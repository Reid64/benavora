# queue-pil-dis-agents.yaml
# Upgrades the 8 already-implemented Discovery-family agents (BEN-DIS-01..08, src/lib/pil/agents/dis/) in place to the
# fuller PIL_AGENT_COMPLETE_ROSTER.md / PIL_AGENT_DEPENDENCIES.yaml spec -- same file paths, same exported class names, same
# AGENT_FACTORIES registry rows in src/lib/pil/agents/index.ts. No new agents, no new files outside each agent's own file plus
# the shared src/__tests__/unit/pil-dis-agents.test.ts test file. 8 sequential prompts (FORGE 1.0 runs prompts in a single
# sequential loop, not in parallel).
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-dis-01-upgrade
  name: Upgrade BEN-DIS-01 Individual Prospect Discovery Agent to the full PIL spec
  prompt: "STEP 1 -- READ IN FULL before writing anything: src/lib/pil/agents/dis/BEN-DIS-01.ts (the current real implementation -- study every existing search step, evidence claim_type, graph node/edge write, and conclusions field it produces), src/lib/pil/agents/dis/shared.ts (the shared Discovery-family helpers this file already imports -- callTool/findOrCreateProspect/findExistingProspect/recordDiscoveryEvidence/recordProspectClassification/tryModelTokens/hostnameOf/normalizeName/parseGoalCriteria), src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- a class implements Agent with `implements Agent`, there is NO `BaseAgent` class anywhere in this codebase, never write `extends BaseAgent`), and src/lib/pil/agents/qlf/BEN-QLF-04.ts (the canonical ~290-line reference pattern: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent by pushing a DelegationRequest object -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the only real chaining mechanism this codebase has). Do NOT regress any currently-passing behavior in src/lib/pil/agents/dis/BEN-DIS-01.ts -- every existing search step, evidence claim_type, graph write, and conclusions field it already returns must remain exactly as-is. You are EXTENDING this file in place (same file path, same exported class name, same default export, same AGENT_FACTORIES registry row in src/lib/pil/agents/index.ts), not rewriting or replacing it.\n\nShared Discovery family contract (PIL_AGENT_COMPLETE_ROSTER.md, applies to this agent like all 8 BEN-DIS agents): discovery outputs are always PROVISIONAL candidates, never canonical identity/capacity/propensity/eligibility/qualification -- qualification and critic gates remain downstream and can block any candidate. Default autonomy A2, max delegation depth 3 (already the effective default via context.depth/DelegationRequest.maxAutonomy in this codebase -- keep every new delegations-array entry at maxAutonomy: \"A2\" as const, matching every existing DIS delegation in this codebase). Universally prohibited for every DIS agent, unchanged by this prompt: outreach, form submission, CRM mutation, private contact harvesting, credential access, protected-trait targeting, policy exception, canonical merge, self-qualification, unsupported capacity/propensity inference.\n\nBEN-DIS-01 \"Individual Prospect Discovery Agent\" -- fuller spec (PIL_AGENT_COMPLETE_ROSTER.md \"Discovery\" section, BEN-DIS-01):\n\nINPUT CONTRACT (IndividualDiscoveryGoal.v2): tenant/domain/goal/strategy ids+versions, discovery dimensions spanning geography, cause relevance,\nprofessional role, charitable activity, business ownership, community participation, public influence, organizational overlap, and relationship\npathways; evidence minimums, source classes, candidate/handoff limits, plus a ResearchStrategy snapshot, cause/geography ontologies, source\nregistry, and prior candidates/fingerprints. This codebase's current parseGoalCriteria() only extracts geography+cause from the free-text goal\nstring -- that is the correct existing behavior, keep it exactly as-is; do not add a fake structured-goal parser that invents fields the real\ncontext.goal string doesn't carry.\n\nOUTPUT CONTRACT (IndividualCandidate.v2): candidates carry one of 8 statuses -- PROVISIONAL, NEEDS_RESOLUTION, NEEDS_MORE_EVIDENCE,\nREADY_FOR_SPECIALIST_HANDOFF, SUPPRESSED_DUPLICATE, EXCLUDED_POLICY, REJECTED_LOW_SUPPORT, MONITOR. The current Discovery interface has no status\nfield at all -- add one. STEP 2 -- add `candidateStatus: \"PROVISIONAL\" | \"NEEDS_RESOLUTION\" | \"NEEDS_MORE_EVIDENCE\"` to the `Discovery` interface\nand populate it at both push sites (the news_search loop and the web_search+crawl loop): when `findOrCreateProspect` returns `created: false`\n(an existing pil_prospect already matched this display_name), set candidateStatus to \"NEEDS_RESOLUTION\" -- it may be the same real-world entity\nas an already-known prospect and needs resolution, not a fresh duplicate flagged as brand-new. When `created: true` and confidence < 0.4 (the\nweb_crawl-sourced candidateNames path, currently confidence 0.35), set candidateStatus to \"NEEDS_MORE_EVIDENCE\". Otherwise (created: true,\nconfidence >= 0.4, i.e. the news_search path at confidence 0.45) set candidateStatus to \"PROVISIONAL\". Include `candidateStatus` in every object\npushed to `discoveries` and surface a `discoveries` array with this field in `conclusions` exactly as today (the array is already returned in\nconclusions -- just add the field to its objects).\n\nDEPENDENCIES: BEN-DIS-01 is explicitly, deliberately the ONLY one of the 8 Discovery agents with zero explicit sibling/cross-family agent-ID\nreferences anywhere in its spec -- handoff language is role-based (\"critic review\"), not ID-based, unlike every other BEN-DIS agent. Do NOT add a\nforced BEN-SUP-05 or BEN-KNW-02 delegation to this agent just because you are about to add one to BEN-DIS-02 through BEN-DIS-08 in sibling\nprompts in this same queue file -- that would contradict this agent's own spec. Leave `delegations: []` in the returned AgentResult exactly as it\nis today.\n\nEVALUATION CRITERIA translated into concrete code behavior (spec's gold cases: common names, changed surnames/employment, sparse footprints,\nduplicate CRM records, prompt injection -- translate into things this agent's code should actually do, not an \"npm run evaluate\"/scorecard\ncommand that doesn't exist in this repo): STEP 3 -- add a minimal precision filter to `extractCandidateNames`'s call site in the web_crawl branch:\nskip any candidateName shorter than 4 characters after trimming, or any candidateName containing \"http\", \"www.\", or a digit (garbage/URL-fragment\nfalse positives that a raw capitalized-name regex over crawled text can produce) before calling findOrCreateProspect on it -- this directly\nreduces the false-candidate rate the gold-case set is measuring without inventing a new dependency. Do this as a small filter step right after\n`const candidateNames = extractCandidateNames(text, 5);` in BEN-DIS-01.ts, not inside shared.ts (extractCandidateNames itself stays general-purpose\nfor other callers).\n\nRECOVERY PROTOCOL translated into concrete code behavior (spec: typed errors including INPUT_INVALID, SOURCE_PROHIBITED, BUDGET_EXHAUSTED each\ndefine retryability -- translate into real try/catch, not a typed-error class hierarchy this codebase doesn't have): STEP 4 -- add an\nINPUT_INVALID-equivalent early return: at the top of `execute()`, if `context.goal.trim().length === 0`, return immediately with\n`{ status: \"completed\", evidence: [], conclusions: { skipped: true, reason: \"BEN-DIS-01 requires a non-empty goal\" }, delegations: [], tokensUsed: 0,\ncostUsd: 0, error: null }` -- matching BEN-QLF-04's own `completed(conclusions, reason)` early-return pattern (you do not need to add a private\n`completed()` helper method for a one-line return; inline the object literal). STEP 5 -- wrap the news_search block and the web_search+crawl block\neach in their own try/catch: on a caught error in either block, call `logAction` (import from `@/lib/pil/audit`) with\n`{ organization_id: context.orgId, actor_type: \"agent\", actor_id: context.agentCode, action: \"discovery.source_failed\", resource_type:\n\"pil_agent_runs\", resource_id: context.runId, before_state: null, after_state: { source: \"news_search\" | \"web_search\", message: <error message> },\npolicy_decision: null, ip_address: null }` and continue to the next block rather than letting the whole execute() throw -- a single search\nprovider's transient failure must not abort discovery via the other source. This changes today's implicit behavior (an unhandled throw from\ncallTool would currently propagate up and get caught generically by AgentRunner.run()'s own try/catch, marking the whole run \"failed\") into\ngraceful degradation with a partial result, which is what the spec's recovery table actually calls for.\n\nTEST FILE: extend src/__tests__/unit/pil-dis-agents.test.ts's existing \"BEN-DIS-01 Individual Prospect Discovery Agent\" describe block (read it in\nfull first -- it already has one test with a news-results happy path; match its exact mocking style, do not introduce a different pattern). Add:\n(a) an assertion on the existing happy-path test (or a new `it`) that every discovery in `result.conclusions.discoveries` has\n`candidateStatus: \"PROVISIONAL\"` for the fresh news-sourced candidates; (b) a new test where `findOrCreateProspect`'s underlying mock returns an\nexisting prospect (`created: false`) for one news result, asserting that entry's `candidateStatus` is `\"NEEDS_RESOLUTION\"`; (c) a new test with an\nempty `goal: \"\"` in the context asserting the early INPUT_INVALID-style return (`conclusions.skipped === true`, `status === \"completed\"`, no tool\ncalls made -- assert the mocked `getTool` was never called).\n\nMANDATORY CLOSE-OUT (do all steps, in order):\n1. INCREMENTAL TEST CHECKPOINT (mid-prompt, before you touch the test file): run `pnpm tsc --noEmit` now. It must show 0 errors relative to the file(s) this prompt touched (src/lib/pil/agents/dis/BEN-DIS-01.ts, src/__tests__/unit/pil-dis-agents.test.ts). Fix any errors before continuing.\n2. Extend the test file as instructed above, then run `pnpm test:unit -- src/__tests__/unit/pil-dis-agents.test.ts` and confirm every test in it passes, including the new/extended cases this prompt added. If a mock needs adjusting to reach the new code path, adjust it -- do not weaken the assertion to make it pass.\n3. Run `pnpm tsc --noEmit` again (full repo this time) -- must show 0 errors.\n4. Run `pnpm run build` and fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit. Do NOT run `npx vercel deploy --prod` and do NOT `curl` any live URL as part of this verification -- a clean build plus passing unit tests is the full bar.\n5. Verify what you built actually works: re-read every file you changed and confirm the described behavior (delegation wiring, new evidence claim_type/value fields, recovery try/catch, the new conclusions fields) is actually present in the code, not just that it compiles.\n6. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from a live audit of what you just did -- run `git diff --stat` and paste real output, note the actual `pnpm tsc --noEmit` / `pnpm test:unit -- src/__tests__/unit/pil-dis-agents.test.ts` / `pnpm run build` results you just observed, and record this agent's upgrade status (spec-aligned delegation wiring added, still same file path/class name/registry row). Pull every fact from the command output you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/dis/BEN-DIS-01.ts
    - src/__tests__/unit/pil-dis-agents.test.ts
- id: pil-dis-02-upgrade
  name: Upgrade BEN-DIS-02 Major Donor Discovery Agent to the full PIL spec
  prompt: "STEP 1 -- READ IN FULL before writing anything: src/lib/pil/agents/dis/BEN-DIS-02.ts (the current real implementation -- study every existing search step, evidence claim_type, graph node/edge write, and conclusions field it produces), src/lib/pil/agents/dis/shared.ts (the shared Discovery-family helpers this file already imports -- callTool/findOrCreateProspect/findExistingProspect/recordDiscoveryEvidence/recordProspectClassification/tryModelTokens/hostnameOf/normalizeName/parseGoalCriteria), src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- a class implements Agent with `implements Agent`, there is NO `BaseAgent` class anywhere in this codebase, never write `extends BaseAgent`), and src/lib/pil/agents/qlf/BEN-QLF-04.ts (the canonical ~290-line reference pattern: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent by pushing a DelegationRequest object -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the only real chaining mechanism this codebase has). Do NOT regress any currently-passing behavior in src/lib/pil/agents/dis/BEN-DIS-02.ts -- every existing search step, evidence claim_type, graph write, and conclusions field it already returns must remain exactly as-is. You are EXTENDING this file in place (same file path, same exported class name, same default export, same AGENT_FACTORIES registry row in src/lib/pil/agents/index.ts), not rewriting or replacing it.\n\nShared Discovery family contract (PIL_AGENT_COMPLETE_ROSTER.md, applies to this agent like all 8 BEN-DIS agents): discovery outputs are always PROVISIONAL candidates, never canonical identity/capacity/propensity/eligibility/qualification -- qualification and critic gates remain downstream and can block any candidate. Default autonomy A2, max delegation depth 3 (already the effective default via context.depth/DelegationRequest.maxAutonomy in this codebase -- keep every new delegations-array entry at maxAutonomy: \"A2\" as const, matching every existing DIS delegation in this codebase). Universally prohibited for every DIS agent, unchanged by this prompt: outreach, form submission, CRM mutation, private contact harvesting, credential access, protected-trait targeting, policy exception, canonical merge, self-qualification, unsupported capacity/propensity inference.\n\nBEN-DIS-02 \"Major Donor Discovery Agent\" -- fuller spec (PIL_AGENT_COMPLETE_ROSTER.md \"Discovery\" section, BEN-DIS-02):\n\nINPUT CONTRACT (MajorDonorDiscoveryGoal.v2): tenant major-gift semantics, gift/cause/geography/role/organization/asset ontologies -- current\nparseGoalCriteria()-based geography/cause extraction is correct and unchanged.\n\nOUTPUT CONTRACT (MajorDonorCandidate.v2): the spec requires wealth, liquidity, capacity, propensity, affinity, access, intent, and giving\nhypotheses to be SEPARATELY TYPED so downstream code cannot conflate constructs -- this agent's existing mission rule already enforces the\npropensity-vs-capacity separation at the flagging level (a wealth-only signal never creates a candidate, only corroborates one that already has a\ngiving signal) -- keep that rule exactly as-is, it is correct and load-bearing (see the file's own header comment). The gap is quantitative\ncalibration: STEP 2 -- add a `confidenceInterval: [number, number]` field to the `FlaggedDonor` interface and populate it for every entry pushed\nto `flagged`: for the giving-signal path (confidence 0.5) use `[0.35, 0.65]`; for the wealth-corroborated path (confidence 0.55) use\n`[0.4, 0.7]`; for the officer-compensation-corroborated case use `[0.3, 0.55]`. These are fixed, documented spread bands (not computed from a\nsample), matching the spec's \"quantitative validation must explicitly test interval coverage/calibration, not point-estimate confidence\" -- state\nin a code comment that these are conservative fixed bands pending a real calibration dataset, not a statistically fitted interval. Include\n`confidenceInterval` in the `flagged` array already returned in conclusions.\n\nFALSE-POSITIVE GUARD (spec: \"false positives involving namesakes/family/foundation assets/corporate gifts/unpaid pledges are designated blocking\ndefects at policy-defined consequence levels -- a stronger failure-severity bar than DIS-01's\"): STEP 3 -- add a\n`looksLikeOrganizationName(name: string): boolean` helper in BEN-DIS-02.ts (a simple regex check for organization-suffix markers: /\\b(foundation|inc|incorporated|corp|corporation|llc|l\\.l\\.c\\.|trust|fund)\\b/i)\nand call it on `item.title` at the top of the news_search giving-behavior loop (`for (const item of results)` under \"1. Giving-behavior signal\nsearch\"): if it matches, skip creating/flagging an individual prospect from that item entirely (a \"major gift\" news mention whose subject reads\nas a foundation/company name is not a major-donor INDIVIDUAL candidate -- it belongs to BEN-DIS-04's corporate-giving discovery, not this agent).\nTrack skipped items in a new `excludedOrganizationNames: string[]` array included in conclusions, so the exclusion is auditable rather than silent.\n\nDEPENDENCIES: roster feeds this agent to BEN-SUP-05 (the critic). Current delegations only cover BEN-INT-08 (deep capacity research) -- keep that\nexactly as-is. STEP 4 -- ADD a second delegation: whenever `flagged.length > 0`, also push one delegation to `\"BEN-SUP-05\"` with\n`objective: \\`Critic review for BEN-DIS-02 major-donor flags: ${flagged.map((f) => f.prospectId).join(\", \")}\\`, maxAutonomy: \"A2\" as const,\nconstraints: { flaggedProspectIds: flagged.map((f) => f.prospectId), capacityThreshold }` -- matching this codebase's established delegation-object\nshape (see the existing BEN-INT-08 delegation literal in this same file for the exact object shape to copy). This directly implements the roster's\n\"stronger failure-severity bar\" by routing every batch of major-donor flags through independent critic review before they're trusted, the same\nway BEN-QLF-04 routes tier_1_priority/tier_2_cultivate classifications through BEN-SUP-05.\n\nRECOVERY PROTOCOL: STEP 5 -- wrap each of the three search/lookup blocks (news_search giving-behavior loop, web_search wealth-signal loop,\nentity_lookup+irs_990_lookup officer-compensation loop) in try/catch; on a caught error in any one block, `logAction` with\n`action: \"discovery.source_failed\"`, `after_state: { source: <block name>, message: <error message> }` (same shape as BEN-DIS-01's prompt in this\nqueue) and continue to the next block. Also add the INPUT_INVALID-equivalent empty-goal early return at the top of `execute()`, identical in shape\nto BEN-DIS-01's (status \"completed\", conclusions `{ skipped: true, reason: \"BEN-DIS-02 requires a non-empty goal\" }`, no tool calls).\n\nTEST FILE: src/__tests__/unit/pil-dis-agents.test.ts currently has no BEN-DIS-02 describe block -- read the file's existing BEN-DIS-01/BEN-DIS-03\nblocks in full first and add a new `describe(\"BEN-DIS-02 Major Donor Discovery Agent\", ...)` block matching their exact mocking style (same\n`baseContext`/`fakeRunner`/`makePilProspectsClient` helpers already defined at the top of the file -- reuse them, do not redefine). Cover: (a) a\nhappy path where a news_search result creates a flagged donor with a populated `confidenceInterval`; (b) the organization-name exclusion --a\nnews_search result titled \"Example Family Foundation Pledges $5M\" must NOT appear in `flagged` or create a pil_prospect, and must appear in\n`excludedOrganizationNames`; (c) the BEN-SUP-05 delegation firing in `result.delegations` when `flagged.length > 0`, alongside the existing\nBEN-INT-08 delegation.\n\nMANDATORY CLOSE-OUT (do all steps, in order):\n1. INCREMENTAL TEST CHECKPOINT (mid-prompt, before you touch the test file): run `pnpm tsc --noEmit` now. It must show 0 errors relative to the file(s) this prompt touched (src/lib/pil/agents/dis/BEN-DIS-02.ts, src/__tests__/unit/pil-dis-agents.test.ts). Fix any errors before continuing.\n2. Extend the test file as instructed above, then run `pnpm test:unit -- src/__tests__/unit/pil-dis-agents.test.ts` and confirm every test in it passes, including the new/extended cases this prompt added. If a mock needs adjusting to reach the new code path, adjust it -- do not weaken the assertion to make it pass.\n3. Run `pnpm tsc --noEmit` again (full repo this time) -- must show 0 errors.\n4. Run `pnpm run build` and fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit. Do NOT run `npx vercel deploy --prod` and do NOT `curl` any live URL as part of this verification -- a clean build plus passing unit tests is the full bar.\n5. Verify what you built actually works: re-read every file you changed and confirm the described behavior (delegation wiring, new evidence claim_type/value fields, recovery try/catch, the new conclusions fields) is actually present in the code, not just that it compiles.\n6. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from a live audit of what you just did -- run `git diff --stat` and paste real output, note the actual `pnpm tsc --noEmit` / `pnpm test:unit -- src/__tests__/unit/pil-dis-agents.test.ts` / `pnpm run build` results you just observed, and record this agent's upgrade status (spec-aligned delegation wiring added, still same file path/class name/registry row). Pull every fact from the command output you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."

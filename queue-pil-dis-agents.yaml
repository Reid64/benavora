ion to make it pass.\n3. Run `pnpm tsc --noEmit` again (full repo this time) -- must show 0 errors.\n4. Run `pnpm run build` and fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit. Do NOT run `npx vercel deploy --prod` and do NOT `curl` any live URL as part of this verification -- a clean build plus passing unit tests is the full bar.\n5. Verify what you built actually works: re-read every file you changed and confirm the described behavior (delegation wiring, new evidence claim_type/value fields, recovery try/catch, the new conclusions fields) is actually present in the code, not just that it compiles.\n6. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from a live audit of what you just did -- run `git diff --stat` and paste real output, note the actual `pnpm tsc --noEmit` / `pnpm test:unit -- src/__tests__/unit/pil-dis-agents.test.ts` / `pnpm run build` results you just observed, and record this agent's upgrade status (spec-aligned delegation wiring added, still same file path/class name/registry row). Pull every fact from the command output you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."

- id: pil-dis-03-upgrade
  name: Upgrade BEN-DIS-03 Foundation Discovery Agent to the full PIL spec
  prompt: "STEP 1 -- READ IN FULL before writing anything: src/lib/pil/agents/dis/BEN-DIS-03.ts (the current real implementation -- study every existing search step, evidence claim_type, graph node/edge write, and conclusions field it produces), src/lib/pil/agents/dis/shared.ts (the shared Discovery-family helpers this file already imports -- callTool/findOrCreateProspect/findExistingProspect/recordDiscoveryEvidence/recordProspectClassification/tryModelTokens/hostnameOf/normalizeName/parseGoalCriteria), src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- a class implements Agent with `implements Agent`, there is NO `BaseAgent` class anywhere in this codebase, never write `extends BaseAgent`), and src/lib/pil/agents/qlf/BEN-QLF-04.ts (the canonical ~290-line reference pattern: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent by pushing a DelegationRequest object -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the only real chaining mechanism this codebase has). Do NOT regress any currently-passing behavior in src/lib/pil/agents/dis/BEN-DIS-03.ts -- every existing search step, evidence claim_type, graph write, and conclusions field it already returns must remain exactly as-is. You are EXTENDING this file in place (same file path, same exported class name, same default export, same AGENT_FACTORIES registry row in src/lib/pil/agents/index.ts), not rewriting or replacing it.\n\nShared Discovery family contract (PIL_AGENT_COMPLETE_ROSTER.md, applies to this agent like all 8 BEN-DIS agents): discovery outputs are always PROVISIONAL candidates, never canonical identity/capacity/propensity/eligibility/qualification -- qualification and critic gates remain downstream and can block any candidate. Default autonomy A2, max delegation depth 3 (already the effective default via context.depth/DelegationRequest.maxAutonomy in this codebase -- keep every new delegations-array entry at maxAutonomy: \"A2\" as const, matching every existing DIS delegation in this codebase). Universally prohibited for every DIS agent, unchanged by this prompt: outreach, form submission, CRM mutation, private contact harvesting, credential access, protected-trait targeting, policy exception, canonical merge, self-qualification, unsupported capacity/propensity inference.\n\nBEN-DIS-03 \"Foundation Discovery Agent\" -- fuller spec (PIL_AGENT_COMPLETE_ROSTER.md \"Discovery\" section, BEN-DIS-03):\n\nINPUT CONTRACT (FoundationDiscoveryGoal.v2): tenant legal/program/geographic profile, grant-history window -- current entity_lookup-based\ndiscovery via `criteria.cause`/`criteria.stateCode` is correct and unchanged, including the family-foundation nuance already implemented in\n`discoverFamilyMembers`.\n\nOUTPUT CONTRACT (FoundationIdentityHypothesis.v2): a 9-value lifecycle enum -- ACTIVE_VERIFIED, ACTIVE_UNCONFIRMED, INACTIVE, TERMINATED, MERGED,\nCONVERTED, SUSPENDED, UNKNOWN, CONFLICTING. Gold cases explicitly include renamed/terminated/merged foundations, DAFs, pass-through/pooled grants,\nconversion foundations, fiscal sponsors -- \"temporal/fiscal semantics are a distinct required test dimension\" per the spec. STEP 2 -- add a\n`lifecycleStatus: string` field to the `FoundationDiscovery` interface and compute it right after the `nineNinety` 990 lookup block (inside the\n`if (match.ein) { ... }` branch, after `data.filing_year` is available): if `nineNinety.success` and `data.filing_year` is within the last 3 tax\nyears relative to `new Date().getFullYear()`, set `lifecycleStatus = \"ACTIVE_VERIFIED\"`; if `nineNinety.success` but `data.filing_year` is older\nthan that window (or null), set `lifecycleStatus = \"ACTIVE_UNCONFIRMED\"`; if `!nineNinety.success` or `!match.ein` (no 990 data reachable at all),\nset `lifecycleStatus = \"UNKNOWN\"`. Additionally, run a simple keyword check over `data.mission` (when present) for\n/\\b(formerly known as|merged with|successor to|dissolved|terminated|converted to)\\b/i -- if it matches, override `lifecycleStatus` to\n`\"CONFLICTING\"` regardless of filing recency (the mission text itself is signaling an identity/lifecycle event the filing-year heuristic alone\ncan't detect). Persist `lifecycleStatus` inside the `value` payload of the existing `foundation_grants_paid` evidence write (do not invent a new\nevidence claim_type or a new DB column -- reuse the existing write, just enrich its `value` object), and include it in the `FoundationDiscovery`\nobjects pushed to `discoveries`.\n\nDEPENDENCIES: roster feeds this agent to BEN-SUP-05. STEP 3 -- add a delegation: whenever any foundation candidate in this run ends up with\n`lifecycleStatus === \"CONFLICTING\"` or `\"UNKNOWN\"`, push one delegation per run (not per-foundation, to stay within budget) to `\"BEN-SUP-05\"` with\n`objective: \\`Critic review for BEN-DIS-03 foundation identity ambiguity: ${<list of affected prospect ids>}\\`, maxAutonomy: \"A2\" as const,\nconstraints: { ambiguousProspectIds: <that list>, reason: \"lifecycle_status_conflicting_or_unknown\" }`. If no foundation in the run has\nCONFLICTING/UNKNOWN status, `delegations` stays `[]` exactly as today.\n\nRECOVERY PROTOCOL: STEP 4 -- the current per-match loop (`for (const match of matches) { ... }`) already continues to the next match if\n`nineNinety.success` is false, which is correct -- but an unexpected thrown error (not a `{success:false}` result -- e.g. a Supabase write error\ninside `upsertNode`/`recordDiscoveryEvidence`) inside one match's processing today would abort the entire loop and fail the whole run. Wrap the\nper-match body (everything inside the `for (const match of matches)` loop) in try/catch: on a
prompts:
- id: asv-001
  name: Build a shared debounced-autosave hook and save-status indicator
  prompt: "SCOPING DECISION (already made, implement it, do not re-litigate): \"autosave for drafts + all user-edited content\" is being scoped to the draft-generator editing surfaces only (src/app/(dashboard)/draft-generator/page.tsx and draft-generator/[id]/page.tsx, both backed by src/components/draft-generator/DraftEditor.tsx) — this is the highest-value, longest-form free-text editing session in the app where losing work matters most. src/components/knowledge-base/NarrativeEditor.tsx was evaluated and explicitly excluded: it is a short structured form (title/category/content/keywords) with a deliberate handleSubmit-on-form-onSubmit pattern, not a long-form drafting session — autosave is the wrong UX pattern for it. If a future pass wants to expand scope, NarrativeEditor.tsx is the next candidate, but do not touch it in this queue.\n\nVERIFIED CONSTRAINT — do not route autosave through src/app/api/drafts/[id]/route.ts's PATCH handler. Read that file in full: its own header comment and code confirm it only accepts updates while applications.pending_review = true (it exists to support editing during the autonomous-draft human-review-queue workflow, a different feature). Drafts being actively composed in the draft-generator wizard are typically NOT in pending_review state, so routing autosave through this route would 409 for the normal case. Do not modify this route's pending_review gate to \"fix\" this — that gate is correct for its actual purpose; building a parallel path is the right call, not weakening this one.\n\nTASK: create a new reusable client-side hook at src/hooks/useAutosave.ts:\n  export function useAutosave<T>(opts: {\n    value: T;\n    onSave: (value: T) => Promise<{ ok: boolean; savedAt?: string; error?: string }>;\n    enabled: boolean; // false while readOnly / not yet editable\n    debounceMs?: number; // default 2500\n  }): { status: \"idle\" | \"saving\" | \"saved\" | \"error\"; lastSavedAt: string | null; error: string | null; saveNow: () => void }\n  Behavior: debounce value changes by debounceMs (default 2500ms) using a ref-based timer (not a naive useEffect-with-timeout that fires on every keystroke re-render), call onSave with the latest value once the debounce settles, track status transitions (idle -> saving -> saved, or -> error on failure), expose saveNow() to force an immediate save (e.g. on blur or before navigating away — also wire a beforeunload warning if status is \"saving\" or if there's a pending debounced save not yet flushed, so a user can't lose the last few seconds of typing by closing the tab). Do not save if the value is unchanged since the last successful save (compare against a ref of the last-saved value, not just \"did the debounce fire\").\n\nCreate a small presentational component at src/components/ui/SaveStatusIndicator.tsx: takes { status, lastSavedAt, error } from the hook above and renders \"Saving…\" / \"Saved <relative time>\" (e.g. \"Saved just now\", \"Saved 2m ago\" — use a simple relative-time formatter, check if one already exists in src/lib before writing a new one) / \"Error saving: <message>\" with a retry affordance. Match this codebase's existing Tailwind styling conventions — check src/components/ui/ for the established small-status-badge pattern before inventing a new visual style.\n\nDo not wire this into any page yet — that's the next two prompts. This prompt only builds the reusable primitives.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/hooks/useAutosave.ts
    - src/components/ui/SaveStatusIndicator.tsx
- id: asv-002
  name: Wire autosave into the draft-generator wizard page
  prompt: "Read src/hooks/useAutosave.ts and src/components/ui/SaveStatusIndicator.tsx (built in the previous prompt) in full. Read src/app/(dashboard)/draft-generator/page.tsx in full, focusing on handleSave() (around line 1085) and the draftText/templateType/opportunityId/confidence/sources state it reads, and the DraftEditor usage around line 1752 (value={draftText}, onChange={setDraftText}, onSave={editable ? handleSave : undefined}, saving={saving}).\n\nVERIFIED CONSTRAINT: this page's handleSave() has an upsert pattern with no stable application id until the first save — it looks up the most recent application for the current opportunityId, updates it if found, otherwise inserts a new one and captures the new id. Your autosave wiring must handle both branches correctly on every debounced save, not just the first one (after the first save creates the row, every subsequent debounced save in the same editing session should update that same row, not create a new one each time — cache the resolved applicationId in a ref/state after the first save/insert and reuse it).\n\nTASK: wrap the existing handleSave() logic (do not duplicate it — refactor it into a function usable by both the manual Save button and the new autosave hook) with useAutosave({ value: draftText, onSave: <adapted handleSave that returns {ok, savedAt, error}>, enabled: editable && !!templateType && !!opportunityId }). Render <SaveStatusIndicator> near the existing Save button (do not remove the manual Save button — keep it as an explicit \"save now\" affordance that also works if autosave is momentarily disabled/erroring, wire it to the hook's saveNow()). Preserve all existing validation (the current early-return guards on !templateType/!opportunityId/!draftText.trim()) inside the adapted save function so autosave silently no-ops rather than erroring when the draft isn't in a saveable state yet (e.g. before an opportunity is selected).\n\nSTALENESS / MULTI-TAB HANDLING (explicit design decision, implement it): before each autosave write, compare the applications.updated_at timestamp your last read/save returned against a fresh read of the same column immediately before writing. If they differ (meaning another tab/session wrote a newer version since this tab last synced), do NOT silently overwrite — set the hook's status to \"error\" with a message like \"This draft was updated elsewhere — reload to see the latest version before continuing,\" and skip the write. This is a deliberate last-write-wins-with-warning choice, not full conflict resolution/merge — document this choice in a one-line comment above the check.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/(dashboard)/draft-generator/page.tsx
- id: asv-003
  name: Wire autosave into the draft-generator detail page
  prompt: "Read src/hooks/useAutosave.ts and src/components/ui/SaveStatusIndicator.tsx in full. Read src/app/(dashboard)/draft-generator/[id]/page.tsx in full — confirm its save logic and how it differs from draft-generator/page.tsx (per prior investigation it also writes directly via supabase.from(\"applications\").update(...), but unlike the wizard page it should already have a stable application id from the URL param, so this is the simpler pure-update case with no create-or-insert branch to handle).\n\nTASK: apply the same useAutosave wiring pattern as the previous prompt (adapt this page's existing save function to return {ok, savedAt, error}, wire useAutosave with the page's draft text as value, render SaveStatusIndicator, keep the manual save affordance wired to saveNow(), apply the same staleness check against updated_at before each write with the same last-write-wins-with-warning behavior — reuse the exact same staleness-check logic/shape as the previous prompt, do not invent a different approach for this page). If this page renders DraftEditor.tsx directly, pass the hook's saving state into DraftEditor's existing saving prop so the Save button shows a spinner/disabled state consistent with the wizard page's behavior.\n\nIf, after reading the file, this page's structure differs meaningfully from what's described above (e.g. it doesn't actually have a stable id, or doesn't use DraftEditor.tsx), adapt the wiring to what you actually find rather than forcing this description to fit — report the discrepancy in your final summary either way.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/(dashboard)/draft-generator/[id]/page.tsx
- id: asv-004
  name: Add flush-on-navigate safety net for pending autosaves
  prompt: "Read src/hooks/useAutosave.ts (built earlier in this queue) in full, and both draft-generator pages you wired it into (src/app/(dashboard)/draft-generator/page.tsx and draft-generator/[id]/page.tsx).\n\nCONTEXT: a debounced autosave has an inherent gap — if a user makes an edit and closes the tab or navigates away within the debounce window (default 2500ms), that edit is lost even though autosave \"exists.\" This prompt closes that gap.\n\nTASK: verify useAutosave.ts already wires a beforeunload listener that warns the user if there's an unflushed pending save (per the previous prompt's spec) — if it's missing or incomplete, add it now: register a beforeunload handler (only while status is \"saving\" or a debounce timer is currently pending) that calls event.preventDefault() and sets event.returnValue (the standard pattern browsers require to show a confirmation dialog), and unregister the listener when there's nothing pending. Additionally, add a same-app in-app navigation safety net: if this Next.js app uses next/navigation's router events or a layout-level route-change hook anywhere else in the codebase (grep for existing patterns before inventing one), hook into it to call the autosave hook's saveNow() and await it before allowing navigation away from an editor with unsaved changes; if no such mechanism exists anywhere in this codebase already, do not build a new app-wide routing-interception system just for this — instead call saveNow() on each editor component's unmount (a standard useEffect cleanup calling a synchronous-ish best-effort save) as a lighter-weight equivalent, and document in a comment that this covers most but not all in-app navigation cases, with the beforeunload handler as the real backstop for tab-close/browser-navigation.\n\nManually verify this actually works before closing the prompt: describe in your final summary the exact manual test you performed (e.g. typed text, watched network tab for the debounced save firing, attempted to close the tab mid-debounce, confirmed the browser's native \"leave site\" confirmation appeared) — do not just claim it works because it compiles.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/hooks/useAutosave.ts
- id: asv-005
  name: Add suppression_list check to the email sequence send engine
  prompt: "VERIFIED GAP: src/lib/email/sequence-engine.ts's processScheduledSends() sends via resend.emails.send() (around line 189, to: enrollment.email_address) with NO suppression_list check anywhere in the file — confirmed by grep, zero matches for \"suppression_list\" in this file. This is inconsistent with src/lib/admin/sales-campaign-engine.ts, which DOES check suppression before every send (around lines 322-339): it loads the full suppression_list table once per batch (.from(\"suppression_list\").select(\"email\")), builds a lowercase Set, and for each queued send checks suppressed.has(send.to_address.toLowerCase()) — if suppressed, marks that send row status:\"suppressed\" and skips it, incrementing a skipped counter, rather than sending.\n\nNOTE: cron registration for the routes that call this engine (src/app/api/cron/email-sequences/route.ts) is handled by a different queue (queue-fix-priority-0-4.yaml) — do not touch vercel.json in this prompt, this prompt is the send-logic fix only.\n\nTASK: read src/lib/email/sequence-engine.ts's processScheduledSends() in full, including the enrollment-fetch loop before line 185 (to see where \"skipped\" is already incremented for other skip reasons, so you match the existing pattern) and the return type ({ sent, failed, skipped } — confirmed at line 235-236). Add a suppression_list check before the resend.emails.send() call at line 189: load suppression_list once per batch (before the loop, not once per enrollment — matching sales-campaign-engine.ts's batch-load pattern for efficiency) into a lowercase Set, and inside the loop, if enrollment.email_address.toLowerCase() is in that set, skip the send (increment skipped, and if there's an existing per-enrollment status-update-on-skip pattern elsewhere in this function for other skip reasons, mirror it for consistency — e.g. pausing or marking the enrollment so it doesn't get re-evaluated every run), do not call resend.emails.send for that enrollment, and continue to the next one.\n\nAdd or update a test in the existing vitest suite for this file (check whether src/__tests__/ already has a sequence-engine test file; if so extend it, if not create one) covering: an enrollment whose email IS in suppression_list is skipped and not sent; an enrollment whose email is NOT in the list sends normally.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/email/sequence-engine.ts
- id: asv-006
  name: Harden email_templates with explicit anon revoke
  prompt: "Read supabase/migrations/054_email_calendar_integration.sql in full — it already enables RLS on email_templates with: CREATE POLICY \"email_templates_org\" ON email_templates USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid())); — note this policy has no explicit \"TO authenticated\" clause, so it technically applies to PUBLIC (including anon), but is still effectively safe against anon reads/writes today because auth.uid() returns NULL for an anon connection and \"organization_id = NULL\" never matches in SQL (NULL comparisons are never true). This is real, working protection — just implicit rather than using this codebase's more common explicit-REVOKE idiom (see e.g. src/supabase/migrations/118_priority_security_tables_rls_hardening.sql for that established pattern).\n\nNOTE: the sales/suppression table RLS fix and a broader migration-reconciliation pass are both handled by other queues in this same backlog (queue-fix-priority-0-4.yaml item 0, and queue-migrations-reconciliation.yaml item 13) — this prompt is a narrow, standalone, additive-only fix packaged with the email theme of this queue, safe to run independently of those regardless of execution order.\n\nTASK: check the real current highest-numbered file in supabase/migrations/ right now (do not assume it is still 164 — another queue in this backlog set may have already added migrations by the time this runs; use the actual next free integer). Create a new migration file at that number containing exactly:\n  ALTER TABLE email_templates ENABLE ROW LEVEL SECURITY;\n  REVOKE ALL ON email_templates FROM anon;\nBoth statements are idempotent (ENABLE ROW LEVEL SECURITY on an already-RLS-enabled table, and REVOKE on a grant that may already be absent, are both safe no-ops if already applied) — this is additive defense-in-depth only. Do NOT modify, drop, or replace the existing email_templates_org policy. Do NOT add a REVOKE FROM authenticated — authenticated users legitimately need access to this table via the existing org-scoped policy, unlike the sales/suppression tables which are service-role-only.\n\nIf DATABASE_URL is available in .env.local (check presence only, do not print its value), apply this migration live via psql now rather than leaving it for a future deploy — this is a cheap, safe, defense-in-depth hardening with no functional risk to legitimate users.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the autosave/email-UX work this specific prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build

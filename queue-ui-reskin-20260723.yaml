prompts:
- id: ui-001
  name: Remove SchoolFunder and Reskin Dashboard as Operational Command Center
  prompt: "MANDATORY PRE-READ — before writing a single line, read these files in full:\n\
    src/app/(dashboard)/dashboard/page.tsx\n\
    src/components/layout/DashboardShell.tsx\n\
    src/components/layout/Sidebar.tsx\n\
    src/components/layout/Header.tsx\n\
    src/components/layout/nav-items.ts\n\
    src/app/globals.css (first 120 lines only)\n\n\
    STEP 1 — REMOVE SCHOOLFUNDER:\n\
    Remove-Item -Recurse -Force src/app/(dashboard)/schoolfunder\n\
    Remove-Item -Recurse -Force src/app/api/schoolfunder (if exists)\n\
    Open src/components/layout/nav-items.ts. Remove every reference to schoolfunder. Save.\n\n\
    STEP 2 — DASHBOARD COMPLETE REWRITE:\n\
    Rewrite src/app/(dashboard)/dashboard/page.tsx from scratch as a premium operational command center.\n\n\
    DESIGN RULES — non-negotiable:\n\
    - ALL colors via hardcoded style={{}} hex values. NEVER Tailwind color classes. NEVER CSS variables.\n\
    - Canvas background: style={{backgroundColor:'#E4E9F0'}}\n\
    - Card surfaces: style={{backgroundColor:'#FFFFFF', borderRadius:'12px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)', border:'1px solid #E2E8F0'}}\n\
    - Elevated cards: style={{backgroundColor:'#FFFFFF', borderRadius:'12px', boxShadow:'0 4px 16px rgba(0,0,0,0.12)'}}\n\
    - Primary text: style={{color:'#0F172A'}}\n\
    - Muted text: style={{color:'#64748B'}}\n\
    - Primary blue: #0077B6\n\
    - Accent cyan: #00B4D8\n\
    - Success green: #16A34A\n\
    - Warning amber: #D97706\n\
    - Error red: #DC2626\n\
    - Font: style={{fontFamily:'Plus Jakarta Sans, sans-serif'}}\n\n\
    LAYOUT — operational command center with 3 zones:\n\
    ZONE 1 — Top stat bar (full width, 5 metric cards side by side):\n\
    Card 1: Active Applications — large number, blue accent, trend arrow up/down\n\
    Card 2: Total Funding Pursued — dollar amount, green accent\n\
    Card 3: Win Rate — percentage, purple accent (#7C3AED)\n\
    Card 4: Deadlines This Week — count, amber accent if >0\n\
    Card 5: AutoApply Queue — count, cyan accent\n\
    Each card: style={{backgroundColor:'#FFFFFF', borderRadius:'12px', padding:'20px 24px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)', border:'1px solid #E2E8F0', flex:'1', minWidth:'0'}}\n\
    Metric number: style={{fontSize:'32px', fontWeight:'800', lineHeight:'1', color:'[accent color]'}}\n\
    Label: style={{fontSize:'12px', fontWeight:'600', color:'#64748B', textTransform:'uppercase', letterSpacing:'0.05em', marginTop:'4px'}}\n\n\
    ZONE 2 — Main content 2-column (left 60%, right 40%):\n\
    LEFT — FlightPath Mission Control:\n\
    Dark panel style={{backgroundColor:'#0F172A', borderRadius:'16px', padding:'24px', color:'#F8FAFC'}}\n\
    Title: MISSION CONTROL in style={{fontSize:'11px', fontWeight:'700', letterSpacing:'0.15em', color:'#00B4D8', textTransform:'uppercase'}}\n\
    6 stage cards in a 3x2 grid, each with:\n\
    - Colored left border (3px solid [stage color])\n\
    - Stage name, count badge, status indicator\n\
    - Stage colors: Onboard=#6366F1, Research=#0077B6, Opportunities=#0EA5E9, Narratives=#8B5CF6, AutoApply=#10B981, Donors=#F59E0B\n\
    - Active stage has glowing border: boxShadow:'0 0 0 2px [stage color]'\n\
    - Each card: style={{backgroundColor:'rgba(255,255,255,0.05)', borderRadius:'8px', padding:'12px 16px', borderLeft:'3px solid [color]'}}\n\n\
    RIGHT — 3 stacked panels:\n\
    Panel A: Today's Priority Actions\n\
    style={{backgroundColor:'#FFFFFF', borderRadius:'12px', padding:'20px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)', marginBottom:'16px'}}\n\
    List of up to 5 action items each with: colored dot, action text, due badge, arrow button\n\
    Action button: style={{backgroundColor:'#0077B6', color:'#FFFFFF', border:'none', borderRadius:'8px', padding:'8px 16px', fontSize:'13px', fontWeight:'600', cursor:'pointer'}}\n\n\
    Panel B: Upcoming Deadlines\n\
    style={{backgroundColor:'#1A2B3C', borderRadius:'12px', padding:'20px', color:'#F8FAFC', marginBottom:'16px'}}\n\
    Up to 4 deadlines with countdown chips: style={{backgroundColor:'rgba(220,38,38,0.2)', color:'#FCA5A5', borderRadius:'6px', padding:'2px 8px', fontSize:'11px', fontWeight:'700'}}\n\n\
    Panel C: Quick Actions grid 2x3\n\
    style={{backgroundColor:'#FFFFFF', borderRadius:'12px', padding:'20px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)'}}\n\
    6 buttons: New Opportunity, Start Draft, Run AutoApply, Find Donors, View Research, Intelligence Library\n\
    Each: style={{backgroundColor:'#F8FAFC', border:'1px solid #E2E8F0', borderRadius:'10px', padding:'14px', textAlign:'center', cursor:'pointer', transition:'all 0.15s'}}\n\n\
    ZONE 3 — Bottom 3-column row:\n\
    Col 1: Recent Activity feed — icon + action + timestamp, alternating subtle background\n\
    Col 2: AI Insights panel — style={{background:'linear-gradient(135deg,#0077B6,#00B4D8)', borderRadius:'12px', padding:'20px', color:'white'}}\n\
    3 insight cards with white semi-transparent backgrounds\n\
    Col 3: Performance Radar — style={{backgroundColor:'#FFFFFF', borderRadius:'12px', padding:'20px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)'}}\n\
    Win rate, avg award size, application velocity — 3 metric rows with progress bars\n\
    Progress bar fill: style={{backgroundColor:'#0077B6', height:'6px', borderRadius:'3px', width:'[pct]%'}}\n\n\
    DATA: Pull real data from Supabase using the existing createClient pattern from other dashboard pages.\n\
    Queries needed: applications count by status, opportunities count, deadlines in next 7 days, recent activity.\n\
    Use existing API routes where available. Add 'use client' directive.\n\n\
    INCREMENTAL TEST CHECKPOINT:\n\
    Run: pnpm tsc --noEmit\n\
    Must show 0 errors. Fix all errors before continuing.\n\n\
    STEP 3 — SIDEBAR RESKIN:\n\
    Read src/components/layout/Sidebar.tsx in full.\n\
    Rewrite the sidebar with these exact styles:\n\
    Container: style={{backgroundColor:'#1A2B3C', width:'240px', minHeight:'100vh', display:'flex', flexDirection:'column', borderRight:'1px solid rgba(255,255,255,0.06)'}}\n\
    Logo area: style={{padding:'24px 20px 16px', borderBottom:'1px solid rgba(255,255,255,0.08)'}}\n\
    Nav item default: style={{display:'flex', alignItems:'center', gap:'10px', padding:'10px 16px', borderRadius:'8px', margin:'2px 8px', color:'rgba(248,250,252,0.7)', fontSize:'13px', fontWeight:'500', textDecoration:'none', transition:'all 0.15s'}}\n\
    Nav item active: style={{backgroundColor:'rgba(0,180,216,0.15)', color:'#00B4D8', fontWeight:'600'}}\n\
    Nav item hover: add onMouseEnter/onMouseLeave to toggle style={{backgroundColor:'rgba(255,255,255,0.06)'}}\n\
    Section labels: style={{fontSize:'10px', fontWeight:'700', letterSpacing:'0.12em', color:'rgba(248,250,252,0.3)', textTransform:'uppercase', padding:'16px 20px 6px'}}\n\
    Icons: use lucide-react, size 16px, style={{flexShrink:0}}\n\n\
    STEP 4 — COMMIT:\n\
    Run: pnpm tsc --noEmit — must be 0 errors\n\
    git add -A\n\
    git commit -m 'feat(ui): operational command center dashboard, sidebar reskin, SchoolFunder removed'\n\
    git push\n\n\
    STEP 5 — GOVERNANCE:\n\
    Update C:\\Users\\manag\\Documents\\benavora\\STATE_OF_THE_BUILD.md:\n\
    Run: git log --oneline -5 to get real commit hashes\n\
    Run: Get-ChildItem src/app/(dashboard) -Directory | Measure-Object | Select-Object Count\n\
    Write actual command output into STATE_OF_THE_BUILD.md — never from memory.\n\
    Update SESSION_STATE.md with prompt ui-001 completed, ui-002 next."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/dashboard/page.tsx
    - src/components/layout/Sidebar.tsx


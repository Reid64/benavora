    Table 2: orphaned_routes (id TEXT PRIMARY KEY, build_run_id TEXT NOT NULL, project_path TEXT NOT NULL, route_path TEXT NOT NULL, http_methods TEXT NOT NULL, reason TEXT NOT NULL, created_at TEXT NOT NULL).

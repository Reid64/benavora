project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: recon-001
  name: Reconcile the two migrations directories against live schema truth
  prompt: "MIGRATION RECONCILIATION — this is the single highest-risk item in the whole backlog. Time estimate 24-40 hours, dominated by this prompt. Read this entire prompt before doing anything. If you cannot get live database access (see Sub-step A), STOP after Sub-step A and report exactly what you tried and what failed — do NOT guess at a reconciliation without live schema ground truth. Guessing here can silently break production for whichever table you get wrong.\n\nCONTEXT: this repo has two migrations directories that have genuinely diverged, not just gone stale:\n- supabase/migrations/ (root) — 166 files, 001-164, the actively-maintained track (pil_* Prospect Intelligence Layer work, most recent commits). Linked to live Supabase project vbjplpquqxxfbpazyalt via a committed supabase/.temp/linked-project.json.\n- src/supabase/migrations/ — 57 files, 072-127, a separate track (marketplace, personalization, and — critically — most of the RLS-hardening work in migrations 113/118/120/122).\nTable-name diff: 202 unique CREATE TABLE names in root, 50 in src, only 14 overlap. Root's own migration 113_revoke_anon_truncate_batch.sql REVOKEs privileges on agent_queue — a table root itself never CREATEs, proving root's author treated it as already-live when writing 113. agent_queue is queried from 26 files including core autonomous-agent infrastructure. This means production schema is a BLEND of both tracks, not simply \"root wins\" — some src-only tables are real and load-bearing.\n\nRoot also has 7 pairs of migration files sharing the same numeric prefix (002, 022, 052, 053, 054, 055, 058 — e.g. two independent 052_*.sql files) from uncoordinated parallel-agent authorship. Both apply fine under lexical sort today, but do not assume migration numbers are unique anywhere in your work below.\n\nSUB-STEP A — establish live ground truth (do this first, everything else depends on it):\nCheck for DATABASE_URL in .env.local (read presence only, do not print the value) or Supabase Management API credentials referenced anywhere in this repo's scripts (check apply-migration.mjs, deploy-migrations.mjs, run-migration.js for the connection pattern they already use successfully). Using whichever real, working method this repo already has, connect to the live database (project ref vbjplpquqxxfbpazyalt) and run:\n  SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;\n  SELECT table_name, column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema = 'public' ORDER BY table_name, ordinal_position;\n  SELECT tablename, rowsecurity FROM pg_tables WHERE schemaname = 'public';\n  SELECT tablename, policyname, roles, cmd, qual FROM pg_policies WHERE schemaname = 'public';\nSave the full output to a new file, migration-audit/live-schema-snapshot-<today's date, get it from a real command like date, never hardcode>.json in the repo (create the migration-audit/ directory if it doesn't exist). This file is your ground truth for every sub-step below — refer back to it, do not re-guess from migration files alone once you have it.\n\nIf you cannot establish live access after real attempts (not just checking one env var and giving up — try every method this repo's own scripts already use), STOP HERE. Do not proceed to Sub-steps B-E. Instead: update STATE_OF_THE_BUILD.md and SESSION_STATE.md to record exactly what you tried, what error each attempt produced, and that migration reconciliation remains blocked on live DB access. Complete Sub-steps F and G below regardless (they can proceed with the anon-exposure audit doc's existing historical data as a starting point, cross-checked against whatever live access you DO have — even read-only PostgREST access via the anon/publishable key, which does not require DATABASE_URL, is enough for F and G's REVOKE-testing since a REVOKE's effect is observable via an actual anon-role request).\n\nSUB-STEP B — per-table live-vs-migration-file diff, for the 14 colliding table names (adapter_usage_log, agent_configurations, agent_registry, board_members, discovery_matches, discovery_runs, donor_discovery_geocache, donor_discovery_taxonomy_aliases, organizational_digital_twins, outreach_templates, relationship_memory, relationship_recommendations, reputation_alerts, reputation_signals):\nFor each, compare its live columns (from your Sub-step A snapshot) against BOTH directories' CREATE TABLE definitions. Determine which directory's shape actually matches live reality (they may even be a hybrid — e.g. agent_configurations is known to use org_id live per a prior investigation, not organization_id, which would tell you which directory's version is closer to truth). Do not assume \"root wins\" — check every one individually against your live snapshot. Record your finding for each of the 14 in migration-audit/collision-resolutions.md: which directory matched, what (if any) columns/indexes/policies from the LOSING directory's definition are present live but would be missing if only the winning directory's file were ever re-applied to a fresh database. For any table where the live shape doesn't cleanly match EITHER file (drifted further via manual/ad-hoc changes), document that explicitly rather than picking one arbitrarily.\n\nSUB-STEP C — write reconciliation migrations in root for the 14 collisions:\nFor each table from Sub-step B, write a migration in supabase/migrations/ (numbered starting at the next free number after 164 — check the real current highest number first, do not assume it is still 164 by the time this runs) that brings root's definition in line with your Sub-step A live snapshot: ADD any column/index/policy that's live but missing from root's current version of that table, using IF NOT EXISTS / idempotent-safe DDL throughout. Never DROP a live column or table in this sub-step, even if it only exists in the \"losing\" directory's file — the live database is truth, migration files are just historical record; your job is to make root's migration history accurately describe live reality going forward, not to enforce a specific file's opinion of the schema.\n\nSUB-STEP D — port the src-only tables that are confirmed live and queried in prod code into root:\nAt minimum: agent_queue (26 files query it, including src/lib/agents/autonomous-base.ts, board-packet-agent.ts, budget-builder-agent.ts, compliance-check-agent.ts, deadline-extraction-agent.ts), agent_decisions (10 files), corporate_intent_signals (9 files), marketplace_listings, board_meetings, disaster_declarations, application_followups, deadline_predictions, funder_dna_profiles. For each, confirm via your Sub-step A live snapshot that the table actually exists live (do not port a src-only table that Sub-step A shows is NOT actually live — src/'s migrations are not proof of live application on their own). For each confirmed-live table, write a new root migration (again numbered after the current highest, idempotent CREATE TABLE IF NOT EXISTS matching the LIVE columns from your snapshot, not necessarily src's file verbatim if they've drifted) plus its indexes and RLS policies as they exist live. autonomous_triggers is a known dead table (zero code references) — confirm via your live snapshot whether it even exists live; if not, skip it; if it does exist live but is unused, still port its definition for completeness but note it as dead in a comment.\n\nSUB-STEP E — document the 7 duplicate migration-number pairs:\nDo NOT rename any of the 7 existing files (002, 022, 052, 053, 054, 055, 058 pairs) — if the live database's migration-tracking mechanism (check supabase/migrations' own apply history, e.g. a schema_migrations table or the Supabase CLI's migration history table) recorded these under their current filenames, renaming would desync that tracking. Instead, add a one-line comment at the top of each of the 14 affected files (7 pairs) cross-referencing its sibling (\"NOTE: this repo also has a second, unrelated migration numbered NNN — see <other file's name> — collision is historical, do not assume migration numbers are unique when writing tooling against this directory\"). Create supabase/migrations/DUPLICATE_NUMBERS.md listing all 7 pairs for future reference.\n\nSUB-STEP F (item 12) — re-verify ANON_GRANT_AUDIT.md's ~17-table anon-exposure list against live state:\nRead ANON_GRANT_AUDIT.md's list of tables it flagged as having no authenticated policy (dd_api_spend, dd_robots_cache, discovery_runs, donor_discovery_geocache, donor_discovery_tos_registry, impersonation_log, system_errors, and the several intelligence_* tables it names). For each, use your Sub-step A pg_tables/pg_policies snapshot (or, if Sub-step A was blocked, a real anon-key PostgREST request per table — e.g. curl the Supabase REST endpoint for that table with only the anon/publishable key and confirm whether it returns rows, a permission-denied error, or an empty array which is ambiguous and needs a row known to exist checked instead) to determine current real status. Update ANON_GRANT_AUDIT.md's §8 status table with today's date and your findings per table — mark each CONFIRMED-STILL-OPEN, CONFIRMED-FIXED, or COULD-NOT-VERIFY. For anything still CONFIRMED-STILL-OPEN, write a migration hardening it (ENABLE ROW LEVEL SECURITY + REVOKE ALL FROM anon, authenticated — no new policy needed unless you find a real authenticated call site during this check, matching the pattern already used in src/supabase/migrations/122_lockdown_no_authenticated_read_path_rls_hardening.sql).\n\nSUB-STEP G (item 13) — confirm/harden email_templates:\nsupabase/migrations/054_email_calendar_integration.sql already enables RLS on email_templates with policy: CREATE POLICY \"email_templates_org\" ON email_templates USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid())); — note this policy has no explicit TO authenticated clause, so it technically applies to PUBLIC (including anon), but is still effectively safe against anon because auth.uid() is NULL for an anon connection and organization_id = NULL never matches. This is real protection, just implicit rather than using this codebase's more common explicit-REVOKE idiom. Add a migration (same numbering sequence as the rest of this prompt) that does ALTER TABLE email_templates ENABLE ROW LEVEL SECURITY; (idempotent, already on, harmless) and REVOKE ALL ON email_templates FROM anon; as explicit defense-in-depth matching the rest of this codebase's pattern (e.g. src/supabase/migrations/118's style) — do not remove or alter the existing email_templates_org policy, this is additive only. If your Sub-step A snapshot's pg_policies output for email_templates shows something different from what's described here (e.g. the policy already has a TO authenticated clause you weren't told about, or an additional REVOKE already exists), trust the live snapshot over this description and adjust accordingly — report the discrepancy either way.\n\nWrite one summary file, MIGRATION_RECONCILIATION_REPORT.md, at the repo root covering what Sub-steps A-G each actually found and did (or why they were blocked), suitable for Reid to read in 5 minutes and know exactly what changed and what's still open.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the migration reconciliation sub-steps actually completed vs. blocked, per MIGRATION_RECONCILIATION_REPORT.md) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - MIGRATION_RECONCILIATION_REPORT.md

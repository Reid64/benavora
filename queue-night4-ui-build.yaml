- id: ui-014
  name: Apply migrations 073 and 074 to database and verify DD pipeline
  prompt: "Read src/supabase/migrations/073_adapter_usage_log.sql and src/supabase/migrations/074_donor_discovery_geocache.sql in full. These migrations need to be applied to the Supabase database. Use the Supabase Management API to apply each migration. The Supabase project ref is vbjplpquqxxfbpazyalt and the management API token is sbp_a63596024b79b5964d2dc2971ac9d4cc77a112c1. For each migration file: POST to https://api.supabase.com/v1/projects/vbjplpquqxxfbpazyalt/database/query with header Authorization Bearer sbp_a63596024b79b5964d2dc2971ac9d4cc77a112c1 and Content-Type application/json with body containing the SQL as a query field. Use Node.js fetch to make these requests - write a small inline script using tsx to execute the migrations. After applying both migrations verify by querying: SELECT table_name FROM information_schema.tables WHERE table_name IN ('adapter_usage_log', 'donor_discovery_geocache'). Then apply the RLS policy for donor_discovery_taxonomy_aliases table: ALTER TABLE donor_discovery_taxonomy_aliases ENABLE ROW LEVEL SECURITY; and CREATE POLICY service_role_all ON donor_discovery_taxonomy_aliases FOR ALL TO service_role USING (true) WITH CHECK (true); Report which migrations succeeded. Update governance docs."
  gates:
  - type: compile

- id: ui-015
  name: Run pnpm seed dd-aliases to populate NAICS plain language search
  prompt: "First verify the donor_discovery_taxonomy_aliases table exists and has RLS policy by running a quick Supabase API check against project vbjplpquqxxfbpazyalt. Then run: pnpm seed:dd-aliases and monitor the output. The script uses Claude claude-sonnet-4-6 to generate plain language aliases for all 1012 six-digit NAICS codes in batches of 50. It should produce 3000-8000 total alias rows. If the script fails with any error diagnose and fix before rerunning. Common failures: PostgREST 400 from large .in() queries (fix by chunking to 100 IDs), RLS policy missing (add it), table missing (check migration applied). After seed completes verify by querying the alias count: SELECT COUNT(*) FROM donor_discovery_taxonomy_aliases. Report the final count. Update governance docs."
  gates:
  - type: compile

- id: ui-016
  name: Flight Path HUD - Mission Control lifecycle dashboard
  prompt: "Read DONOR_DISCOVERY_ARCHITECTURE.md, src/app/(dashboard)/dashboard/page.tsx, and all existing dashboard components in full. Create a new component src/components/dashboard/FlightPathHUD.tsx. This is the Mission Control lifecycle dashboard showing the 6-stage nonprofit funding pipeline: Onboard, Research, Opportunities, Grant Narratives, AutoApply, Donor Discovery. Each stage is a 3D-style flip card built with CSS 3D transforms. The outer container: 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8'. Each stage card wrapper: 'relative h-36 cursor-pointer' with perspective-1000. Each card uses CSS 3D flip on hover: front face shows stage icon, stage name, and live count badge. Back face shows: last activity timestamp, completion percentage bar, and quick action button. Front face styling: 'absolute inset-0 rounded-xl bg-white shadow-sm border border-slate-200 flex flex-col items-center justify-center backface-hidden'. Stage colors: Onboard uses 'border-t-4 border-[#0077B6]', Research uses 'border-t-4 border-[#7C3AED]', Opportunities uses 'border-t-4 border-[#F59E0B]', Grant Narratives uses 'border-t-4 border-[#10B981]', AutoApply uses 'border-t-4 border-[#00B4D8]', Donor Discovery uses 'border-t-4 border-[#EF4444]'. Stage name: 'text-xs font-semibold text-slate-400 uppercase tracking-wide mt-2'. Count badge: 'text-2xl font-black text-slate-900'. Back face: 'absolute inset-0 rounded-xl bg-[#1A2B3C] flex flex-col items-center justify-center backface-hidden rotate-y-180 p-4'. Back face text: white. Progress bar on back: teal fill. Quick action button on back: 'bg-[#0077B6] text-white px-3 py-1.5 rounded-lg text-xs font-semibold mt-2'. Add the FlightPathHUD to the dashboard page at the top before the stat cards. Wire it to read live counts from the existing API routes for each section. After building run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/dashboard/FlightPathHUD.tsx

- id: ui-017
  name: Badge and shared UI component library standardization
  prompt: "Find all shared UI components in src/components/ui/ by running: find src/components/ui -name '*.tsx' | sort. Read each one in full. Standardize these components to use the Elevated Slate design system. Badge component: variants must map to the CSS variable semantic pairs. success variant: 'bg-[#DCFCE7] text-[#15803D] border border-[#BBF7D0]'. warning variant: 'bg-[#FEF3C7] text-[#B45309] border border-[#FDE68A]'. error/danger variant: 'bg-[#FEE2E2] text-[#B91C1C] border border-[#FECACA]'. info variant: 'bg-[#E0F2FE] text-[#0369A1] border border-[#BAE6FD]'. default/neutral variant: 'bg-[#F1F5F9] text-[#475569] border border-[#E2E8F0]'. primary variant: 'bg-[#0077B6] text-white'. All badges: 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold'. Button component: ensure primary uses 'bg-[#0077B6] hover:bg-[#005F92] text-white', secondary uses 'bg-white border border-slate-200 text-slate-700 hover:border-[#0077B6] hover:text-[#0077B6]', destructive uses 'bg-[#EF4444] hover:bg-[#B91C1C] text-white'. Input/Select components: 'bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-700 placeholder-slate-400 focus:border-[#0077B6] focus:ring-2 focus:ring-[#0077B6]/10 outline-none transition-colors'. Card component: 'bg-white rounded-xl shadow-sm border border-slate-200'. After all changes run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile

- id: ui-018
  name: Research and Draft Generator pages visual overhaul
  prompt: "Read src/app/(dashboard)/research/page.tsx and src/app/(dashboard)/draft-generator/page.tsx in full. Apply Elevated Slate design. Research page: the search interface must be premium. Search bar: 'w-full bg-white border-2 border-slate-200 rounded-2xl px-6 py-4 text-base text-slate-700 placeholder-slate-400 focus:border-[#0077B6] focus:ring-4 focus:ring-[#0077B6]/10 outline-none shadow-sm'. Search button: 'bg-[#0077B6] hover:bg-[#005F92] text-white px-6 py-4 rounded-2xl font-semibold'. Result cards: 'bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-4 hover:shadow-md hover:border-[#00B4D8] transition-all'. Result title: 'text-base font-semibold text-slate-900 hover:text-[#0077B6]'. Result source badge: 'bg-[#EFF6FF] text-[#1D4ED8] px-2.5 py-1 rounded-full text-xs font-medium'. Result amount: 'text-[#15803D] font-bold'. Result deadline: urgent 'text-[#EF4444] font-medium' future 'text-slate-400'. Draft Generator page: this is a key revenue feature - style it premium. The generator form must be in a 'bg-white rounded-2xl shadow-md border border-slate-200 p-8'. Section headers inside form: 'text-base font-semibold text-slate-900 mb-4 flex items-center gap-2'. The Generate button must be large and prominent: 'w-full bg-gradient-to-r from-[#00B4D8] to-[#0077B6] hover:from-[#0093AC] hover:to-[#005F92] text-white py-4 rounded-xl font-bold text-base shadow-lg transition-all'. Generated draft output area: 'bg-[#F8FAFC] border border-slate-200 rounded-xl p-6 font-mono text-sm text-slate-700 leading-relaxed'. After changes run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile

- id: ui-019
  name: Mobile responsiveness audit and sidebar mobile drawer fix
  prompt: "Read src/components/layout/Sidebar.tsx, src/components/layout/Header.tsx, and src/components/layout/DashboardLayout.tsx or equivalent layout wrapper in full. Audit and fix mobile responsiveness. The sidebar on mobile must: slide in from the left as a drawer with smooth transition 'translate-x-0 transition-transform duration-300 ease-in-out', be hidden off-screen when closed '-translate-x-full', show over a dark backdrop 'fixed inset-0 bg-[#0F172A]/60 backdrop-blur-sm'. The mobile hamburger button in the header must be visible only on small screens 'lg:hidden'. The main content area must have: 'lg:ml-64 min-h-screen bg-[#EEF2F7]'. On mobile the content must be full width 'w-full'. Check every page for any horizontal overflow issues on mobile - look for fixed widths that would break on small screens. The dashboard stat card grid must be responsive: 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4'. The opportunities table on mobile must scroll horizontally: 'overflow-x-auto'. Add 'min-w-[700px]' to the table itself so it scrolls cleanly. After all fixes run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile

- id: ui-020
  name: Final build verification deploy and governance update
  prompt: "Run a complete build verification: pnpm tsc --noEmit first. If any TypeScript errors exist fix them all before proceeding. Then run pnpm run build. If build fails diagnose and fix. After clean build: run git add -A then git commit with message 'feat: complete Elevated Slate UI overhaul - all pages redesigned with navy sidebar teal accents color-coded components Flight Path HUD and mobile responsive layout'. Then run git push. Then run vercel --prod --yes. Wait for deployment to complete and report the final URL and deployment status. Then update STATE_OF_THE_BUILD.md with a complete audit of all UI changes made in this queue run. Update SESSION_STATE.md noting that the UI redesign is complete and listing the next priorities: Intelligence Library corpus ingestion, 298K prospect CSV import, Email/Calendar Phase 4, Tarritrix audit. The governance docs must reflect the actual current state of the codebase not assumptions."
  gates:
  - type: compile
  - type: file_exists
    files:
    - STATE_OF_THE_BUILD.md
    - SESSION_STATE.md

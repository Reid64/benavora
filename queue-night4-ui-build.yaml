project: benavora
governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
- DONOR_DISCOVERY_ARCHITECTURE.md
- DESIGN_SYSTEM.md
settings:
  max_retries_per_prompt: 3
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 10
  governance_check_frequency: 15
prompts:
- id: ui-001
  name: Sidebar complete rebuild with navy depth and teal accents
  prompt: "Read src/components/layout/Sidebar.tsx and src/components/layout/nav-items.ts in full. The sidebar must be completely rebuilt with these exact visual properties. Do not use CSS variables for the core structure - use hardcoded Tailwind classes so the design cannot be overridden. The outer sidebar wrapper must use: className containing 'bg-[#1A2B3C] flex flex-col h-full'. The logo area at top must use: 'px-6 py-5 border-b border-[#243B55]'. The nav section must use: 'flex-1 overflow-y-auto py-4 px-3'. Each nav item link in ACTIVE state must use: 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#0077B6] text-white font-medium text-sm border-l-4 border-[#00B4D8]'. Each nav item link in INACTIVE state must use: 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#CBD5E1] hover:bg-[#243B55] hover:text-white transition-colors text-sm'. Section labels (PLATFORM, etc) must use: 'px-3 pt-5 pb-1 text-[10px] font-semibold uppercase tracking-[0.15em] text-[#64748B]'. The NavBadge component must use: 'ml-auto inline-flex min-w-[1.25rem] items-center justify-center rounded-full bg-[#EF4444] px-1.5 py-0.5 text-[10px] font-bold text-white'. The mobile backdrop overlay must use: 'fixed inset-0 bg-[#0F172A]/60 backdrop-blur-sm z-40'. The sidebar panel itself must use: 'fixed inset-y-0 left-0 z-50 w-64 bg-[#1A2B3C] shadow-2xl'. The bottom settings area must have: 'border-t border-[#243B55] px-3 py-4'. The tagline below the logo must use: 'text-[11px] text-[#64748B] font-medium tracking-wide'. After rebuilding run pnpm tsc --noEmit - must show 0 errors. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/layout/Sidebar.tsx

- id: ui-002
  name: Header complete rebuild with bold navigation and depth
  prompt: "Read src/components/layout/Header.tsx in full. Rebuild it completely with these exact specifications. The outer header wrapper must use: 'sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm'. The inner container must use: 'flex items-center h-16 px-6'. The nav items container must use: 'flex items-center gap-1'. Each nav link in ACTIVE state must use: 'px-4 py-2 text-sm font-semibold text-[#0077B6] border-b-2 border-[#0077B6] rounded-none -mb-px'. Each nav link in INACTIVE state must use: 'px-4 py-2 text-sm font-semibold text-slate-600 hover:text-[#0077B6] hover:bg-slate-50 rounded-lg transition-colors'. The header must also include a right-side area with: a notification bell icon with red badge, the user avatar circle using 'w-9 h-9 rounded-full bg-[#0077B6] text-white flex items-center justify-center text-sm font-bold ring-2 ring-[#00B4D8] ring-offset-2', and the organization name in 'text-sm font-medium text-slate-700'. The mobile hamburger button must use: 'p-2 rounded-lg text-slate-600 hover:bg-slate-100 lg:hidden'. After rebuilding run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/layout/Header.tsx

- id: ui-003
  name: Dashboard page complete visual overhaul with color-coded stat cards
  prompt: "Read src/app/(dashboard)/dashboard/page.tsx in full. This page needs a complete visual overhaul. The page wrapper must use: 'min-h-screen bg-[#EEF2F7] p-6'. The page title section must use: 'mb-8' with h1 using 'text-2xl font-bold text-slate-900' and subtitle using 'text-slate-500 text-sm mt-1'. The stat cards grid must use: 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5 mb-8'. Each stat card must be a div with: 'bg-white rounded-xl shadow-sm border border-slate-200 p-5 relative overflow-hidden'. Total Opportunities card gets a left accent: add 'absolute left-0 top-0 bottom-0 w-1 bg-[#0077B6] rounded-l-xl'. Applications Submitted card gets: 'absolute left-0 top-0 bottom-0 w-1 bg-[#7C3AED] rounded-l-xl'. Drafts Generated card gets: 'absolute left-0 top-0 bottom-0 w-1 bg-[#F59E0B] rounded-l-xl'. Deadlines This Week card gets: 'absolute left-0 top-0 bottom-0 w-1 bg-[#EF4444] rounded-l-xl'. Each card stat number must use: 'text-3xl font-bold text-slate-900 mt-2'. Each card label must use: 'text-xs font-semibold uppercase tracking-wide text-slate-400'. Each card icon must be top-right positioned with 'absolute top-4 right-4 w-10 h-10 rounded-lg flex items-center justify-center' with the accent color as background at 10 percent opacity. The Pipeline section must use: 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8' with header 'text-lg font-semibold text-slate-900 mb-4'. The Upcoming Deadlines panel must use: 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden' with a header bar 'bg-slate-800 px-5 py-4 flex items-center justify-between' with text 'text-white font-semibold text-sm'. Each deadline item must show a colored dot: red for overdue, amber for this week, green for upcoming. Recent Activity section must use: 'bg-white rounded-xl shadow-sm border border-slate-200 p-6' with each activity item having a left icon, main text, and timestamp. After all changes run pnpm tsc --noEmit. Update governance docs."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/dashboard/page.tsx


- id: pri0-005
  name: Fix column mapping and status filter in the donor discovery BMF ingest script
  prompt: "Read scripts/ingest-irs-bmf-full.ts in full. This is the script that is actually broken (a prior draft of an audit doc briefly and incorrectly flagged the DIFFERENT script scripts/ingest-nonprofit-bmf.ts instead — that one is confirmed correct and needs no change; do not touch it in this prompt).\n\nCONFIRMED BUGS in scripts/ingest-irs-bmf-full.ts:\n1. Its own header comment (top of file) claims column layout: 0=NAME, 2=EIN, 5=CITY, 6=STATE, 7=ZIP. The real IRS BMF layout (verified against scripts/ingest-nonprofit-bmf.ts's own confirmed-correct header comment, itself verified live against a downloaded eo_dc.csv) is: 0=EIN, 1=NAME, 2=ICO, 3=STREET, 4=CITY, 5=STATE, 6=ZIP, ... 26=NTEE_CD. The parsing function (around lines 185-192) follows the WRONG mapping from this file's own (wrong) header comment.\n2. Line 100: const ACTIVE_STATUS = \"O\"; and line 304's filter col(cols, 16).toUpperCase() !== ACTIVE_STATUS — real IRS BMF STATUS values are numeric strings (\"01\", \"02\", \"06\", etc), never the letter \"O\", so this comparison is always true and every single row is classified inactive and skipped. This script has very likely never inserted a real row into donor_discovery_directory.\n\nFIX:\n1. Correct the header comment's column table to match the real layout (0=EIN, 1=NAME, 2=ICO, 3=STREET, 4=CITY, 5=STATE, 6=ZIP, 7=GROUP, 8=SUBSECTION, ... 26=NTEE_CD — copy the exact correct table from scripts/ingest-nonprofit-bmf.ts's header, adjusted for whichever fields this file actually uses).\n2. Fix the parsing function around lines 185-192 to read: ein = col(cols, 0), name = col(cols, 1), street = col(cols, 3), city = col(cols, 4), state = col(cols, 5), zip = col(cols, 6) — keep nteeCd = col(cols, 26) unchanged (already correct). Update every downstream reference to the variables you renamed/reordered so the rest of the function still compiles and uses the right values.\n3. Remove the ACTIVE_STATUS filter entirely (do not try to guess the correct set of \"active\" BMF status codes) — match the precedent already established by the correct sibling script scripts/ingest-nonprofit-bmf.ts, which stores status as-is and does not pre-filter by activity status, per its own documented design (\"this table is a raw prospecting mirror, not a filtered 'currently active' view\"). Store the raw STATUS value on each row instead of skipping it. If donor_discovery_directory's schema has no column to hold a raw status value, check migration 067 for the closest existing column (e.g. an enrichment jsonb blob) and store it there rather than adding a new column in this prompt.\n\nVERIFICATION: after fixing, run the script against a single small state file only (pick the smallest state by file size — check STATE_ABBRS in this file for the list, \"DC\" is a reasonable pick since it is one of the smallest BMF extracts) to confirm it now inserts real rows instead of skipping everything — do not run the full 51-state ingest in this prompt, that is a separate, longer operational task. Report the row count actually inserted for that one state.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (this queue's specific priority-0-4 fixes: RLS port, cron registration, follow-up wiring, grants API wiring, or BMF ingest fix — whichever this prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - scripts/ingest-irs-bmf-full.ts

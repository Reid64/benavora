prompts:
- id: pri0-001
  name: Port sales and suppression table RLS hardening into root migrations
  prompt: "SECURITY FIX — highest priority in this queue. Read this in full before touching anything.\n\nBACKGROUND: supabase/migrations/055_admin_sales_outreach.sql (the root, actively-maintained migrations track) creates 7 tables — sending_domains, prospect_lists, prospects, sales_campaigns, sales_campaign_steps, sales_sends, suppression_list — with NO RLS, NO policy, and NO REVOKE. Per this project's public-schema default ACLs (every CREATE TABLE auto-grants anon+authenticated full CRUD unless explicitly revoked), all 7 are currently anon-readable and anon-writable if this gap reached production. suppression_list is the CAN-SPAM opt-out table — an anonymous actor tampering with it can silently defeat suppression.\n\nA correct, thoroughly-investigated fix for exactly these 7 tables ALREADY EXISTS, but in the other (non-canonical) migrations directory: src/supabase/migrations/118_priority_security_tables_rls_hardening.sql and src/supabase/migrations/122_lockdown_no_authenticated_read_path_rls_hardening.sql. Read BOTH of those files in full now — do not skip this, the exact ALTER TABLE / REVOKE statements you need are already written and call-site-verified there. Their reasoning (documented in their own header comments): every real read/write call site for prospects, prospect_lists, sales_campaigns, sales_campaign_steps, sales_sends, suppression_list, and sending_domains uses createAdminClient() (service role, bypasses RLS) exclusively — so enabling RLS with zero permissive policies and revoking anon+authenticated grants closes the anon hole with zero functional risk to the app.\n\nTASK: Create supabase/migrations/165_port_sales_suppression_rls_hardening.sql in the ROOT migrations directory (not src/) containing the equivalent ALTER TABLE / REVOKE statements for these exact 7 tables, ported from 118+122. Use IF EXISTS-safe, idempotent DDL (ALTER TABLE ... ENABLE ROW LEVEL SECURITY and REVOKE ALL ... FROM ... are both naturally idempotent in Postgres — running them again when already applied is a harmless no-op, so this is safe to run whether or not src/'s copy of 118/122 was ever applied to production). Do not add any CREATE POLICY statements for these 7 tables — per 118's own investigation, none of them have a legitimate authenticated-user access path, only service-role. Structure:\n\nALTER TABLE sending_domains ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON sending_domains FROM anon;\nREVOKE ALL ON sending_domains FROM authenticated;\n\nALTER TABLE prospect_lists ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON prospect_lists FROM anon;\nREVOKE ALL ON prospect_lists FROM authenticated;\n\nALTER TABLE prospects ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON prospects FROM anon;\nREVOKE ALL ON prospects FROM authenticated;\n\nALTER TABLE sales_campaigns ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON sales_campaigns FROM anon;\nREVOKE ALL ON sales_campaigns FROM authenticated;\n\nALTER TABLE sales_campaign_steps ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON sales_campaign_steps FROM anon;\nREVOKE ALL ON sales_campaign_steps FROM authenticated;\n\nALTER TABLE sales_sends ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON sales_sends FROM anon;\nREVOKE ALL ON sales_sends FROM authenticated;\n\nALTER TABLE suppression_list ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON suppression_list FROM anon;\nREVOKE ALL ON suppression_list FROM authenticated;\n\nAdd a header comment on the new file explaining it ports 118+122's fix into the root track because root's live-apply status is confirmed (linked via supabase/.temp/linked-project.json) while src/'s is not — cite this explicitly so a future reader doesn't think it's a duplicate mistake.\n\nCRITICAL — this is a live security exposure, do not just write the file and stop. Check whether DATABASE_URL is set (read .env.local — do not print its value, just confirm presence). If DATABASE_URL is set, apply this migration directly against the live database right now using psql (psql \"$DATABASE_URL\" -f supabase/migrations/165_port_sales_suppression_rls_hardening.sql) rather than waiting for a future deploy cycle. If DATABASE_URL is not set or the connection fails, clearly report that the migration file was created but NOT applied live, and that Reid must run it manually — do not claim the security gap is closed if you could not verify it against the live database.\n\nVERIFICATION — after applying (live or not), write and run a one-off Node script (delete it when done) that connects with the service-role key from .env.local and runs: SELECT relname, relrowsecurity FROM pg_class WHERE relname IN ('sending_domains','prospect_lists','prospects','sales_campaigns','sales_campaign_steps','sales_sends','suppression_list'); — every row must show relrowsecurity = true if the migration actually applied live. Report the exact query output.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (this queue's specific priority-0-4 fixes: RLS port, cron registration, follow-up wiring, grants API wiring, or BMF ingest fix — whichever this prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - supabase/migrations/165_port_sales_suppression_rls_hardening.sql
- id: pri0-002
  name: Register orphaned cron routes in vercel.json and document intentionally-retired ones
  prompt: "Read vercel.json in full. It currently registers exactly 5 crons: research (0 6 * * *), grantsgov (0 7 * * *), reminders (0 8 * * *), autoapply (0 2 * * *), domain-warmup (0 6 * * *).\n\nsrc/app/app/api/cron/ (path: src/app/api/cron/) contains 11 route directories total. 6 have real, working implementations but are NOT registered: campaigns, draft-automation, draft-queue-check, email-sequences, follow-ups, sales-sends. Read all 6 of their route.ts files in full now.\n\nDECISION (already made, do not re-litigate — implement it):\n- REGISTER these 4, they are genuinely unreachable today and each has real user-facing impact: sales-sends, email-sequences, draft-automation, follow-ups.\n- DO NOT register campaigns — read its route.ts header comment; if it still claims \"Vercel Cron hits this every 2 hours\", fix that comment to state it was intentionally retired from vercel.json (0 orgs had the underlying feature flag enabled) and is not currently scheduled. Leave the route working (callable manually / by a future re-enable) but do not add it to vercel.json.\n- DO NOT register draft-queue-check — confirm via grep that its processing logic (processDeadlineApproaching or equivalent) already fires inline from within /api/cron/research's handler; if so, add a comment to draft-queue-check/route.ts noting it is redundant with research and intentionally unregistered to avoid double-processing. If your grep finds it is NOT actually redundant (i.e. research does not call the same logic), instead register draft-queue-check too and note the correction.\n\nAdd these 4 entries to vercel.json's \"crons\" array (preserve the existing 5 exactly as-is, append these):\n{ \"path\": \"/api/cron/sales-sends\", \"schedule\": \"*/30 13-23 * * *\" }\n{ \"path\": \"/api/cron/email-sequences\", \"schedule\": \"0 * * * *\" }\n{ \"path\": \"/api/cron/draft-automation\", \"schedule\": \"0 9 * * *\" }\n{ \"path\": \"/api/cron/follow-ups\", \"schedule\": \"0 9 * * *\" }\n\n(sales-sends schedule note: sales_campaigns rows have send_window_start/send_window_end in America/Chicago as local hours, default 9-17; 13-23 UTC covers 9am-5pm America/Chicago accounting for CDT/CST — verify this against the actual send_window logic in src/lib/admin/sales-campaign-engine.ts and adjust the cron hours if the window logic differs from what's assumed here, but keep it in the 13-23 UTC neighborhood.)\n\nRISK FLAG — before finishing, check whether this Vercel project is on the Hobby plan (which restricts cron jobs to once per day) or Pro/Enterprise (which allows any interval). Check .vercel/project.json and any Vercel-plan references in existing docs (DNS_SETUP_GUIDE.md, package.json, README.md). If you cannot determine the plan tier, add a prominent comment above the crons array in vercel.json flagging that the */30 and hourly entries above require a Pro-tier-or-higher Vercel plan, and that on Hobby they will silently collapse to a single daily run — this must not ship silently wrong.\n\nAlso add each new route's maxDuration to the existing \"functions\" block in vercel.json if it isn't already covered by the existing \"src/app/api/cron/**/*.ts\": { \"maxDuration\": 120 } wildcard entry — confirm that wildcard covers all 4 new paths (it should, they're all under src/app/api/cron/) and note in your report that no new functions entries were needed, or add them if the wildcard doesn't match for some reason.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (this queue's specific priority-0-4 fixes: RLS port, cron registration, follow-up wiring, grants API wiring, or BMF ingest fix — whichever this prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - vercel.json
- id: pri0-003
  name: Wire scheduleFollowUps into the AutoApply submission-success path
  prompt: "Read src/lib/autoapply/follow-up-scheduler.ts in full — you already know its exported scheduleFollowUps(params: ScheduleFollowUpsParams) function (params: submissionId, organizationId, funderId, funderName, submissionChannel, supabase) inserts 3 rows into autoapply_follow_ups (14/30/60-day cadence) and is confirmed to have ZERO callers anywhere in src/ or worker/ today — dead producer code. Its sibling processFollowUps() IS called (from src/app/api/cron/follow-ups/route.ts, which the previous prompt in this queue registered in vercel.json), so once this prompt wires the producer, the full pipeline becomes live end-to-end.\n\nRead worker/queue-processor.ts in full, focusing especially on the region around line 1819 where a submission's status is set to 'submitted' (grep confirmed: \\.eq\\('status', 'submitted'\\) area sets a row's status; there is also a submissionChannel variable computed earlier in the same function, around lines 649 and 892, as 'web_form' | 'email' based on whether a portalUrl is present).\n\nTASK: immediately after the code path that marks a submission status: 'submitted' succeeds (the real success branch — not a dry-run/simulation path, not a failed-submission branch), call scheduleFollowUps() using the submission id, organization id, funder id, funder name, and the submissionChannel value already in scope at that point in the function, passing the same supabase admin client already in scope. Wrap the call in try/catch — a follow-up-scheduling failure must never fail or roll back the submission itself; on failure, console.error with enough context (submission id, error message) to debug later, and continue.\n\nIf, after reading the file, the exact identifiers described above (funderName in particular) are not directly in scope at that point and require an extra query to fetch, add the minimal query needed (e.g. a funders table lookup by funder_id) rather than passing a placeholder — do not fabricate a funder name.\n\nDo not create a new call site elsewhere (e.g. in the AutoApply API routes) — the worker's queue-processor.ts is the single real place a submission transitions to 'submitted', confirmed by grep across src/ and worker/.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (this queue's specific priority-0-4 fixes: RLS port, cron registration, follow-up wiring, grants API wiring, or BMF ingest fix — whichever this prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - worker/queue-processor.ts
- id: pri0-004
  name: Wire Grant Discovery UI to the real paginated grants API
  prompt: "Read src/app/api/grants/route.ts in full — a real, tested, RLS-backed route already exists: GET supports source_type/eligibility_flag/status/deadline-range filters and pagination via limit (default 25, max 100) and an offset-style param, gated by requireRole(\"viewer\"), backed by the opportunities table.\n\nRead src/app/(dashboard)/opportunities/page.tsx in full. Find its current data-fetching logic — confirmed elsewhere to be a direct client-side call: supabase.from(\"opportunities\").select(\"*\").order(\"created_at\",{ascending:false}).limit(1000) with no pagination UI, which silently drops rows past PostgREST's 1000-row hard cap for any org with more than 1000 opportunities.\n\nTASK: replace the direct supabase.from(\"opportunities\") call in this page with a fetch to /api/grants, passing through whatever filters the page's existing UI controls already expose (map each existing filter control to the matching /api/grants query param — read grants-service.ts's exported types (GRANT_SELECT, isFunderCategory, isOpportunityStatus, EligibilityFlag) to get the exact param names and valid values first, do not guess them). Add real pagination: a \"Load more\" button (or page controls, matching this page's existing UI pattern for other paginated lists in this codebase — check src/components for an existing pagination component before building a new one) that requests the next 100-row page and appends to the current list, rather than ever requesting more than MAX_LIMIT=100 rows in one call. Preserve all existing sort/filter/search behavior the page currently has — this is a data-fetching swap, not a UI redesign.\n\nDo not delete or modify src/app/api/grants/route.ts itself in this prompt — it is already correct; this prompt only changes the page that should be calling it.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (this queue's specific priority-0-4 fixes: RLS port, cron registration, follow-up wiring, grants API wiring, or BMF ingest fix — whichever this prompt covers) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."

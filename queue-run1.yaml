      const c = require('./dist/forge2/hooks/conditions');
      // Test glob matching
      if (!c.matchGlob('*.ts', 'file.ts')) { console.error('FAIL: basic glob'); process.exit(1); }
      if (c.matchGlob('*.ts', 'file.tsx')) { console.error('FAIL: should not match tsx'); process.exit(1); }

  description: |
    CONTEXT:
    The error fingerprinting algorithm creates deterministic identifiers for error patterns. Two identical errors in different files produce the same fingerprint. Two different errors in the same file produce different fingerprints. This is how FORGE learns from errors across projects and machines.

    TASK:
    Implement src/forge2/learning/fingerprint.ts:

    1. `getErrorFingerprint(error: { errorCode: string, filePath: string, errorMessage: string, techStack: string[] }): string`

    Algorithm — SHA-256 hash of four concatenated, pipe-separated components:

    Component 1 — Error code: Machine-readable identifier. Examples: TS2307, no-unused-vars, TypeError, ENOENT. Lowercase, trimmed.

    Component 2 — Generalized file path: Replace dynamic segments with wildcards.
    - `app/api/storms/route.ts` → `app/api/*/route.ts`
    - `components/dashboard/StormMap.tsx` → `components/*/StormMap.tsx`
    - `src/utils/helpers.ts` → `src/utils/helpers.ts` (no dynamic segment)
    Rules: Replace path segments that look like entity names (lowercase words, contain hyphens/underscores that suggest dynamic naming) with `*`. Keep filenames intact. Keep known framework directories intact (app, api, components, src, lib, utils, types, hooks, middleware).

    Component 3 — Error message template: Replace specific identifiers with `*`.
    - `Module './StormMap' not found` → `Module '*' not found`
    - `Property 'name' does not exist on type 'Storm'` → `Property '*' does not exist on type '*'`
    - `Cannot find name 'fetchStorms'` → `Cannot find name '*'`
    Rules: Replace quoted strings with `*`. Replace identifiers following common patterns (PascalCase, camelCase words that are clearly app-specific) with `*`. Keep structural words (Module, Property, type, Cannot, find, not, does, exist, on).

    Component 4 — Tech stack context: Sorted, comma-separated tags. Example: `nextjs,supabase,typescript`

    Final: SHA-256 hash of `component1|component2|component3|component4`. Return first 32 hex characters.

    2. `generalizeFilePath(filePath: string): string` — Exported helper for testing.
    3. `generalizeErrorMessage(message: string): string` — Exported helper for testing.

    ACCEPTANCE CRITERIA:
    - Same error in different files produces same fingerprint (e.g., TS2307 import error in storms/route.ts and alerts/route.ts)
    - Different errors in same file produce different fingerprints
    - Fingerprint is exactly 32 hex characters
    - generalizeFilePath correctly wildcards entity-name segments
    - generalizeErrorMessage correctly replaces specific identifiers
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — MODIFY:
    src/forge2/learning/fingerprint.ts

    VERIFICATION:
    ```bash
    npx tsc --noEmit
    node -e "
      const fp = require('./dist/forge2/learning/fingerprint');
      // Same error, different files → same fingerprint
      const f1 = fp.getErrorFingerprint({ errorCode: 'TS2307', filePath: 'app/api/storms/route.ts', errorMessage: \"Module './StormMap' not found\", techStack: ['typescript','nextjs'] });
      const f2 = fp.getErrorFingerprint({ errorCode: 'TS2307', filePath: 'app/api/alerts/route.ts', errorMessage: \"Module './AlertMap' not found\", techStack: ['typescript','nextjs'] });
      if (f1 !== f2) { console.error('FAIL: same error pattern should match'); process.exit(1); }
      // Different error → different fingerprint
      const f3 = fp.getErrorFingerprint({ errorCode: 'TS2339', filePath: 'app/api/storms/route.ts', errorMessage: \"Property 'name' does not exist\", techStack: ['typescript','nextjs'] });
      if (f1 === f3) { console.error('FAIL: different errors should differ'); process.exit(1); }
      if (f1.length !== 32) { console.error('FAIL: fingerprint length should be 32'); process.exit(1); }
      console.log('R1-004 PASS');
    "
    ```


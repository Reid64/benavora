    1. `invokeRunStart(options: ForgeOptions, dbPath?: string): Promise<{ buildId: string, sessionState: any, knowledge: any }>` — Run start sequence:
    a. Validate project path
    b. Generate build ID
    c. Initialize learning database if needed

- id: r1-007
  name: "Core Pipeline — Entry Point and Phase Routing"
  description: |
    CONTEXT:
    The core pipeline controller is the main entry point for FORGE 2.0. It receives CLI commands and routes them to the correct phase module. It manages the 8-phase pipeline: RETROFIT(R), SCOUT(0), ARCHITECT(1), SCAFFOLD(2), COMPOSE(3), EXECUTE(4), SENTINEL(5), DEPLOY(6). Each phase has gate conditions that must pass before the next phase begins.

    TASK:
    Implement src/forge2/core/pipeline.ts:

    1. `invokeForgePipeline(command: string, options: ForgeOptions): Promise<void>` — Main entry point. Parses command (retrofit, scout, architect, scaffold, compose, execute, sentinel, deploy) and routes to the appropriate phase handler. For this prompt, phase handlers are stubs that log "[PHASE] {name} — not yet implemented" and return. The routing logic and command parsing must be complete.

    ForgeOptions interface:
    ```typescript
    interface ForgeOptions {
      projectPath: string;
      buildId?: string;
      mode?: 'GREENFIELD' | 'RETROFIT';
      phase?: string;
      startFrom?: number;
      skipDynamic?: boolean;
      scopeA?: boolean;
      resume?: boolean;
      dryRun?: boolean;
    }
    ```

    2. `validateProjectPath(projectPath: string): { valid: boolean, errors: string[] }` — Validates: path exists, is a directory, has .git (or initializes it), has package.json (for target projects, not FORGE itself).

    3. `generateBuildId(projectName: string, mode: string): string` — Format: `forge-{projectName}-{mode}-{timestamp}` where timestamp is YYYYMMDD-HHmmss.

    4. `getCurrentPhase(): string` — Returns the current phase from global state.
    5. `setCurrentPhase(phase: string): void` — Sets current phase in global state.

    PHASE ROUTING TABLE:
    | Command | Phase | Module | Mode |
    |---------|-------|--------|------|
    | retrofit | R | ForgeRetrofit | RETROFIT only |
    | scout | 0 | ForgeArchitect | GREENFIELD only |
    | architect | 1 | ForgeArchitect | GREENFIELD only |
    | scaffold | 2 | ForgeCore | Both |
    | compose | 3 | ForgeComposer | Both |
    | execute | 4 | ForgeCore | Both |
    | sentinel | 5 | ForgeSentinel | Both |
    | deploy | 6 | ForgeDeploy | Both |


- id: r1-017
  name: "Hook Lifecycle — Hook Evolution Analysis"
  description: |
    CONTEXT:
    The hook system evolves over time through the learning engine. At SessionEnd, hook performance is analyzed. Hooks that fail too often get timeout adjustments. Hooks that never fail get disable proposals. New hooks can be created from error pattern elevation.

    TASK:
    Implement src/forge2/hooks/evolution.ts:

    1. `analyzeHookPerformance(buildId: string, dbPath?: string): PendingEvolution[]` — Queries hook_execution_log for this build. Generates evolution proposals for:
    - Hooks failing >30% of executions → propose timeout increase or threshold adjustment
    - Hooks averaging >10 seconds → propose moving to less frequent ring
    - Hooks with zero failures over 100+ executions → propose disabling to reduce latency
    - Error patterns at 3+ occurrences without a hook → propose new PreToolUse hook

    Each proposal includes: evolution_type, proposed_change, change_detail (JSON with specific values), evidence (statistics from the build), estimated_impact, confidence score (0.0-1.0).

    2. `getHookStats(buildId: string, dbPath?: string): Array<{ hookName: string, executions: number, passes: number, fails: number, timeouts: number, avgDurationMs: number }>` — Aggregated statistics per hook for the build.


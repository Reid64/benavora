- id: r1-003
  name: "Learning Engine — Core Query Infrastructure"
  description: |
    CONTEXT:
    The learning database is initialized (R1-002). Now build the core query layer that every other module uses. No module ever writes raw SQL — they call these functions. All records use UUID primary keys and include machine_id. All timestamps are ISO 8601.

    TASK:
    Implement src/forge2/learning/queries.ts with these functions:

    GENERIC OPERATIONS:
    1. `generateId(): string` — Returns a new UUID v4 via crypto.randomUUID().
    2. `saveToForgeMemory(table: string, data: Record<string, any>, dbPath?: string): string` — Generic insert. Auto-generates UUID id and adds machine_id from getMachineId(). Auto-adds created_at as ISO 8601. Returns the generated id. Validates table name against known tables (whitelist). Uses parameterized queries (never string interpolation).
    3. `getForgeMemory(table: string, options?: { where?: string, params?: any[], orderBy?: string, limit?: number }, dbPath?: string): any[]` — Generic SELECT with optional WHERE, ORDER BY, LIMIT. Returns array (empty if no results, never null). Validates table name. Uses parameterized queries for params.
    4. `updateForgeMemory(table: string, id: string, data: Record<string, any>, dbPath?: string): boolean` — Generic UPDATE by id. Returns true if row was updated.

    PROMPT SCORE FUNCTIONS:
    5. `savePromptScore(score: Omit<PromptScore, 'id' | 'machine_id' | 'created_at'>, dbPath?: string): string` — Insert a prompt execution score with all four dimensions (first_pass_success, tokens_consumed, gate_pass_rate, drift_score).
    6. `getBestPromptTemplates(taskType: string, techStackTags: string[], minSamples?: number, dbPath?: string): Array<{template_hash: string, avg_pass_rate: number, avg_tokens: number, sample_count: number}>` — Aggregate prompt_scores by template hash for matching task type, ordered by first-pass rate descending. Minimum 3 samples (configurable). Returns top 5.

    FIX PATTERN FUNCTIONS:
    7. `getFixPattern(fingerprint: string, dbPath?: string): FixPattern | null` — Lookup by error fingerprint. Returns null if not found.
    8. `registerError(error: { errorCode: string, filePath: string, errorMessage: string, errorCategory: string, techStack: string[] }, dbPath?: string): string` — Registers a new error. Computes fingerprint via getErrorFingerprint(). If fingerprint exists, increments occurrence_count and updates last_seen. If new, creates new fix_patterns entry.
    9. `registerFix(fingerprint: string, fix: { fixDiff?: string, fixDescription: string, filesModified: string[] }, dbPath?: string): void` — Associates a fix with an existing error fingerprint. Updates fix_diff, fix_description, fix_files_modified. Increments times_fix_applied. Recalculates success_rate.
    10. `updateFixPattern(fingerprint: string, updates: Partial<FixPattern>, dbPath?: string): void` — Partial update of a fix pattern by fingerprint.

    GOVERNANCE RULE FUNCTIONS:
    11. `getGovernanceRules(techStackTags: string[], projectName?: string, dbPath?: string): GovernanceRule[]` — Returns active rules matching tech stack. Includes GLOBAL scope + PROJECT_SPECIFIC for the given project. Ordered by enforcement_count descending.
    12. `incrementGovernanceEnforcement(ruleId: string, dbPath?: string): void` — Increments enforcement_count and updates last_enforced to now.

    DECISION WEIGHT FUNCTIONS:
    13. `getDecisionWeights(decisionType: string, minBuilds?: number, dbPath?: string): Array<{option: string, avg_error_rate: number, avg_retry_rate: number, total_samples: number}>` — Aggregate by decision_type, weighted error rate. Minimum 2 builds (configurable).

    SKILL / EVOLUTION FUNCTIONS:
    14. `getRelevantSkills(techStackTags: string[], dbPath?: string): SkillEntry[]` — Skills matching tech stack tags, ordered by effectiveness_rate descending.
    15. `getPendingEvolutions(dbPath?: string): PendingEvolution[]` — All PENDING status, ordered by confidence descending.

    CRITICAL IMPLEMENTATION RULES:
    - NEVER use string interpolation in SQL. Always use parameterized queries (? placeholders).
    - Table name validation: whitelist of known table names. Throw error for unknown tables.
    - All Get-* functions return empty arrays (never null or undefined) when no results match.
    - All JSON fields (tech_stack_tags, fix_files_modified, architecture_decisions, etc.) are stored as JSON strings and parsed on read.
    - Import types from ../types.ts and functions from ./database.ts.

    ACCEPTANCE CRITERIA:
    - All 15 functions are exported and properly typed
    - saveToForgeMemory correctly auto-generates id and machine_id
    - getForgeMemory returns empty array for no-match queries
    - All SQL uses parameterized queries (grep for string interpolation in SQL — should find none)
    - npx tsc --noEmit passes with 0 errors


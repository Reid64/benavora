- id: r1-013
  name: "Hook Lifecycle — Execution Engine"
  description: |
    CONTEXT:
    The hook execution engine is the single function that all FORGE modules call to fire hooks. No module implements its own hook logic. The engine loads hooks for the given event, filters by conditions, resolves templates, executes with timeout, handles blocking behavior, and logs to the learning database.

    TASK:
    Implement src/forge2/hooks/engine.ts:

    1. `invokeHook(event: string, context: HookContext, dbPath?: string): Promise<{ allPassed: boolean, blockedBy?: string, results: HookResult[] }>` — Core function:
    a. Load hooks via parseHooksConfig for context.project_path
    b. Filter to hooks matching this event AND enabled=true
    c. Sort by priority ascending (lower = first)
    d. For each hook: check conditions, resolve templates, execute action, measure duration, log to hook_execution_log
    e. If a hook fails AND hook.blocking is true: handle on_failure (BLOCK: halt, REVERT: git checkout file then halt, WARN: log and continue)
    f. Return aggregate results

    2. `executeHookAction(hook: HookDefinition, resolvedAction: string, context: HookContext): Promise<HookResult>` — Executes a hook action with timeout enforcement:
    - Shell commands: execute via child_process.exec with timeout
    - Script references (action === 'typescript'): call the named function from the script field
    - Timeout exceeded: kill process, return TIMEOUT status
    - Non-zero exit: return FAIL status
    - Zero exit: return PASS status

    3. Hook depth tracking: Maintain a depth counter. If depth > MAX_HOOK_DEPTH (2), suppress the hook with SKIP status and log warning. This prevents recursive hooks.

    Console output per hook:
    ```
      [HOOK] hook-name PASS (42ms)     — Green
      [HOOK] hook-name FAIL (1203ms)   — Red
      [HOOK] hook-name TIMEOUT (30000ms) — Red
      [HOOK] hook-name SKIP             — Yellow
      [HOOK] Pipeline BLOCKED by hook-name — Red (on blocking failure)
    ```

    ACCEPTANCE CRITERIA:
    - invokeHook loads, filters, sorts, and executes hooks correctly
    - Blocking hooks halt the pipeline on failure
    - REVERT on_failure checks out the affected file via git
    - WARN on_failure logs but continues
    - Timeout enforcement kills the process and returns TIMEOUT
    - Hook depth > 2 is suppressed
    - Every execution is logged to hook_execution_log
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — MODIFY:
    src/forge2/hooks/engine.ts

    VERIFICATION:
    ```bash
    npx tsc --noEmit
    echo "R1-013 compile check passed"
    ```


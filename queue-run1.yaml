- id: r1-014
  name: "Hook Lifecycle — Conditions and Template Resolution"
  description: |
    CONTEXT:
    Hook conditions determine whether a hook fires for a given context. Template variables in hook actions are replaced with runtime values. Both are evaluated before hook execution.

    TASK:
    Implement src/forge2/hooks/conditions.ts:

    1. `testHookConditions(hook: HookDefinition, context: HookContext): boolean` — Evaluates ALL conditions (AND logic — every present condition must pass):
    - file_pattern: Comma-separated globs. Hook fires only if context.file matches ANY glob. Uses minimatch or manual glob matching. Only evaluated for PostToolUse and PreCommit events.
    - exclude_pattern: Comma-separated globs. Hook does NOT fire if context.file matches ANY glob.
    - task_types: Array of task type strings. Hook fires only if context.task_type is in the array.
    - min_prompt_number: Integer. Hook fires only if context.prompt_number >= value.
    - phases: Array of phase strings. Hook fires only if context.phase is in the array.
    - If conditions is null/undefined, hook always fires (no filtering).

    2. `resolveHookTemplates(action: string, context: HookContext): string` — Replaces template variables:
    - {{file}} → context.file (absolute path of affected file)
    - {{files}} → context.files (space-separated list)
    - {{project_path}} → context.project_path
    - {{prompt_number}} → context.prompt_number
    - {{build_id}} → context.build_id
    - {{last_commit}} → context.last_commit
    - {{task_type}} → context.task_type
    - {{phase}} → context.phase
    Undefined context values replaced with empty string (never leave {{var}} in output).

    3. `matchGlob(pattern: string, filePath: string): boolean` — Simple glob matching supporting * and ** wildcards. * matches any segment, ** matches any number of segments. Example: *.ts matches foo.ts but not foo/bar.ts. **/*.ts matches any .ts file at any depth.

    ACCEPTANCE CRITERIA:
    - file_pattern correctly matches globs
    - exclude_pattern correctly excludes
    - Multiple conditions are AND'd
    - Null conditions = always fire
    - All template variables resolve correctly
    - Undefined variables become empty strings
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — MODIFY:
    src/forge2/hooks/conditions.ts

    VERIFICATION:
    ```bash

- id: r1-015
  name: "Hook Lifecycle — PreCompact Context Preservation"
  description: |
    CONTEXT:
    During long runs (40-50 prompts), Claude's context fills up and older content gets compacted. Critical state can be lost. The PreCompact hook fires at ~80% context capacity and saves critical context to the compact_snapshots table. When FORGE detects compaction occurred, it re-injects preserved state into the next prompt.

    TASK:
    Implement src/forge2/hooks/precompact.ts:

    1. `invokePreCompactSave(context: PreCompactContext, dbPath?: string): string` — Saves critical state to compact_snapshots table. State includes:
    - build_id, prompt_index
    - Current phase
    - Active unresolved errors (from fix_patterns where occurrence_count > 0 and fix_diff is null)
    - Active governance rules for current tech stack
    - Queue status (completed/total/percent)
    - Pending git changes (git status --porcelain)
    - Current acceptance criteria text

    Returns the snapshot id.

    PreCompactContext interface:
    ```typescript
    interface PreCompactContext {
      buildId: string;
      promptIndex: number;
      phase: string;
      projectPath: string;
      techStackTags: string[];
      acceptanceCriteria: string;
      queueStatus: { total: number, completed: number, pending: number };
    }
    ```

    2. `restoreCompactedContext(buildId: string, dbPath?: string): string | null` — Reads the most recent compact_snapshot for this build. Formats it as a context injection string that can be prepended to the next prompt. Returns null if no snapshot exists. Format:
    ```
    === FORGE CONTEXT RECOVERY ===
    You are resuming after context compaction. Here is your preserved state:
    Phase: {phase}
    Prompt position: {prompt_index} of {total}
    Active errors: {count} unresolved
    {error details}
    Active governance rules: {count}
    {rule summaries}
    Queue: {completed}/{total} ({percent}%)
    Current acceptance criteria: {criteria}
    === END RECOVERY ===
    ```

    3. `shouldPreCompact(promptIndex: number, totalPrompts: number): boolean` — Returns true if we're at ~80% through the run (promptIndex / totalPrompts >= 0.8) OR every 10th prompt after the 30th prompt. This is a heuristic — PreCompact is cheap so erring on the side of saving too often is fine.

    ACCEPTANCE CRITERIA:
    - invokePreCompactSave writes a valid compact_snapshot record
    - restoreCompactedContext formats a readable context recovery block
    - shouldPreCompact triggers at appropriate intervals
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — MODIFY:
    src/forge2/hooks/precompact.ts

    VERIFICATION:

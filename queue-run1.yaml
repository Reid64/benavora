    g. Check for previous session state (stub for now)
    h. Return build ID, knowledge loaded

    2. `invokePromptExecution(prompt: { id: string, name: string, description: string }, context: PromptExecutionContext, dbPath?: string): Promise<PromptExecutionResult>` — Per-prompt sequence:
    a. Create git snapshot
    b. Fire PreToolUse hooks (governance check, fix pattern check)
    c. Execute prompt via child_process: `claude -p --dangerously-skip-permissions` with prompt.description as input
    d. Fire PostToolUse hooks (tsc, eslint, score prompt)
    e. If gates fail: invoke retry logic (up to maxRetries)
    f. Create structured git commit
    g. Return result (passed/failed, retries, output)

    PromptExecutionContext interface:
    ```typescript
    interface PromptExecutionContext {
      projectPath: string;
      buildId: string;
      phase: string;
      taskType: string;
      techStackTags: string[];
      promptNumber: number;
      totalPrompts: number;
      maxRetries: number;
    }
    ```

    3. `invokeRunEnd(buildId: string, runData: BuildRunData, options: ForgeOptions, dbPath?: string): Promise<void>` — Run end sequence:
    a. Fire SessionEnd hooks (sync push, update weights, analyze evolutions, generate handoff)
    b. Generate build report (md + json)
    c. Remove lock file
    d. Print run summary to console

    4. `executeQueue(queuePath: string, options: ForgeOptions, dbPath?: string): Promise<BuildRunData>` — Main queue executor:
    a. Parse queue.yaml via js-yaml
    b. Call invokeRunStart
    c. For each prompt in queue: call invokePromptExecution
    d. Call invokeRunEnd
    e. Return complete run data


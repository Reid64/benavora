- id: r1-012
  name: "Hook Lifecycle — hooks.json Parser and Schema Validation"
  description: |
    CONTEXT:
    Hooks are the nervous system of FORGE. They are declaratively defined in .forge/hooks.json. The parser reads this file, validates the schema, and returns typed hook definitions. If the file is malformed, FORGE falls back to a hardcoded minimal set (tsc-check and gitleaks-scan only).

    TASK:
    Implement src/forge2/hooks/parser.ts:

    1. `parseHooksConfig(projectPath: string): { hooks: HookDefinition[], errors: string[] }` — Reads .forge/hooks.json. Validates against schema. Returns typed hook definitions. If file doesn't exist, returns empty array (no error). If file is malformed JSON, returns empty array with error message.

    2. `validateHookDefinition(hook: any): { valid: boolean, errors: string[] }` — Validates a single hook definition:
    - name: required, string, unique
    - event: required, must be one of HOOK_EVENTS
    - action: required, string
    - blocking: required, boolean
    - timeout_seconds: required, integer, 5-600
    - enabled: required, boolean
    - on_failure: optional, must be BLOCK|REVERT|WARN
    - priority: optional, integer 1-999, default 50
    - conditions: optional, validates sub-fields (file_pattern, exclude_pattern as comma-separated globs, task_types as array of valid task types, min_prompt_number as non-negative integer, phases as array of valid phase names)

    3. `getMinimalFallbackHooks(): HookDefinition[]` — Returns hardcoded minimal hooks for when hooks.json is invalid:
    - tsc-check: PostToolUse, blocking, `npx tsc --noEmit`, priority 10, 30s timeout
    - gitleaks-scan: PreCommit, blocking, `gitleaks detect`, priority 1, 30s timeout

    4. `writeHooksConfig(projectPath: string, hooks: HookDefinition[]): void` — Writes hooks array to .forge/hooks.json with pretty formatting.

    ACCEPTANCE CRITERIA:

- id: r1-005
  name: "Learning Engine — Five Learning Loops"
  description: |
    CONTEXT:
    The five learning loops are the core intelligence of FORGE. They transform raw execution data into actionable knowledge. Each loop fires at specific hook events and reads/writes specific tables. The loops are implemented as pure functions that the hook system calls.

    TASK:
    Implement src/forge2/learning/loops.ts:

    LOOP 1 — PROMPT EFFECTIVENESS SCORING (fires at PostToolUse):
    1. `scorePromptExecution(execution: { templateHash: string, taskType: string, techStackTags: string[], firstPassSuccess: boolean, retryCount: number, tokensConsumed: number, gatePassRate: number, driftScore: number, projectName: string, buildId: string }, dbPath?: string): string` — Scores on four dimensions. Writes to prompt_scores. Returns the score record id.

    LOOP 2 — FIX PATTERN INDEXING (fires at PostToolUse on error):
    2. `captureError(error: { errorCode: string, filePath: string, errorMessage: string, errorCategory: string, techStack: string[] }, dbPath?: string): { fingerprint: string, isKnown: boolean, knownFix?: FixPattern }` — Stage 1 CAPTURE: Computes fingerprint. Checks if pattern exists. If exists, increments count and returns known fix. If new, creates entry.
    3. `checkAutoElevation(fingerprint: string, dbPath?: string): GovernanceRule | null` — Stage 3 ELEVATE: If occurrence_count >= 3 AND a fix exists with success_rate > 0.5, generates a governance rule proposal. Returns the rule if created, null otherwise. Sets auto_governance_rule on the fix_pattern.

    LOOP 3 — ARCHITECTURE DECISION WEIGHTING (fires at SessionEnd):
    4. `updateDecisionWeights(buildId: string, dbPath?: string): void` — For each decision in the build, compute downstream error/retry rates from prompt_scores created after the decision. Updates decision_weights records.

    LOOP 4 — CROSS-PROJECT KNOWLEDGE TRANSFER (fires at SessionStart):
    5. `loadCrossProjectKnowledge(techStackTags: string[], projectName: string, dbPath?: string): { rules: GovernanceRule[], skills: SkillEntry[], fixPatterns: FixPattern[], outcomes: BuildOutcome[], evolutions: PendingEvolution[] }` — Loads all relevant knowledge for this tech stack: active governance rules (GLOBAL + PROJECT_SPECIFIC), relevant skills, high-frequency fix patterns (2+ occurrences), prior build outcomes, pending evolutions.

    LOOP 5 — SELF-MODIFICATION WITH GUARDRAILS (fires at SessionEnd):
    6. `analyzeForEvolutions(buildId: string, dbPath?: string): PendingEvolution[]` — Analyzes the completed run for improvement opportunities:
       a. Gate thresholds: if a gate passes 100% over 20+ prompts, propose relaxation. If fails >30%, propose tightening.
       b. Error patterns reaching 3+ occurrences: propose new RULE.
       c. Low-performing templates <50% pass rate: propose TEMPLATE rewrite.
       d. Complex fixes requiring 2+ retries: propose SKILL creation.
       e. Hook timeouts >30% of executions: propose THRESHOLD adjustment.
       Returns array of created evolution proposals. Each has confidence score 0.0-1.0.

    7. `presentEvolutions(dbPath?: string): PendingEvolution[]` — Returns all PENDING evolutions for human review, ordered by confidence descending.

    8. `applyEvolution(evolutionId: string, approved: boolean, reviewNote?: string, dbPath?: string): void` — Updates evolution status to APPROVED or REJECTED. Sets reviewed_at and review_note.

    CRITICAL: FORGE evolves configuration and knowledge, NEVER its own source code. Loop 5 proposes changes to hooks.json thresholds, governance rules, prompt templates — never to the TypeScript modules themselves.


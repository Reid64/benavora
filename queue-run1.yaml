- id: r1-006
  name: "Cross-Machine Sync — Protocol and Lock Management"
  description: |
    CONTEXT:
    FORGE runs on multiple machines simultaneously. Each has its own local forge_memory.db. Between runs, learning data syncs through a master copy on an 18TB external drive. The sync protocol is append-only with file locking to prevent concurrent writes. This module handles both sync and lock management.

    TASK:
    Implement src/forge2/sync/sync.ts and src/forge2/sync/lock.ts:

    LOCK MANAGEMENT (lock.ts):
    1. `acquireSyncLock(lockPath: string, machineId: string, maxWaitMs?: number, retryIntervalMs?: number): boolean` — Creates a lock file containing JSON { machine_id, acquired_at, pid }. If lock exists and is <2 minutes old, waits retryIntervalMs (default 5000) and retries. Max wait default 30000ms. If lock is >2 minutes old (stale), removes it and acquires. Returns true on success, false on timeout.
    2. `releaseSyncLock(lockPath: string): void` — Removes lock file. Must always succeed (ignore errors if file doesn't exist).
    3. `isLockStale(lockPath: string, staleMinutes?: number): boolean` — Returns true if lock file exists and is older than staleMinutes (default 2).

    SYNC PROTOCOL (sync.ts):
    4. `loadSyncConfig(projectPath: string): SyncConfig` — Reads ~/.forge/sync_config.json. Returns defaults if file doesn't exist: { master_path: '', lock_file: 'forge_sync.lock', max_wait_seconds: 30, retry_interval_seconds: 5 }.

    5. `syncForgeMemory(direction: 'pull' | 'push', localDbPath: string, masterDbPath: string, machineId: string): { synced: number, tables: string[] }` — Core sync function.

    PULL (SessionStart):
    - Open read-only connection to master DB
    - For each of the 14 tables: SELECT * WHERE machine_id != localMachineId AND created_at > lastSyncTimestamp
    - INSERT OR IGNORE each record into local DB (prevents duplicates)
    - Update last_sync_timestamp in forge_meta
    - Return count of synced records

    PUSH (SessionEnd):
    - Acquire lock on master (via acquireSyncLock)
    - For each table: SELECT * FROM local WHERE machine_id = localMachineId AND created_at > lastSyncTimestamp
    - INSERT OR IGNORE each record into master DB
    - Update last_sync_timestamp in both local and master forge_meta
    - Release lock (in finally block — ALWAYS runs)
    - Return count of synced records

    6. `getLastSyncTimestamp(dbPath: string): string` — Reads 'last_sync_timestamp' from forge_meta. Returns '1970-01-01T00:00:00Z' if not set.
    7. `setLastSyncTimestamp(dbPath: string, timestamp: string): void` — Writes/updates 'last_sync_timestamp' in forge_meta.

    CRITICAL RULES:
    - Lock MUST be released in a finally block. A crash during push must not leave a permanent lock.
    - All operations are INSERT OR IGNORE. Never UPDATE existing records on master. Append-only.
    - If master path doesn't exist or isn't accessible, log a warning and return { synced: 0, tables: [] }. Never fail a build because the external drive isn't mounted.
    - Each record has a globally unique UUID id. No conflicts possible across machines.

    ACCEPTANCE CRITERIA:
    - acquireSyncLock creates lock file, detects stale locks, respects timeouts
    - releaseSyncLock always succeeds even if file doesn't exist
    - Pull correctly fetches records from master where machine_id differs
    - Push correctly writes local records to master with lock protection
    - Lock is always released even on error (finally block)
    - Graceful degradation when master path is inaccessible
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — MODIFY:
    src/forge2/sync/sync.ts
    src/forge2/sync/lock.ts

    VERIFICATION:
    ```bash
    npx tsc --noEmit
    node -e "
      const lock = require('./dist/forge2/sync/lock');
      const sync = require('./dist/forge2/sync/sync');
      const db = require('./dist/forge2/learning/database');
      const q = require('./dist/forge2/learning/queries');
      const path = require('path');
      const os = require('os');
      const fs = require('fs');
      const tmpDir = path.join(os.tmpdir(), 'forge_sync_test_' + Date.now());
      fs.mkdirSync(tmpDir, { recursive: true });
      const lockPath = path.join(tmpDir, 'test.lock');
      // Test lock
      const acquired = lock.acquireSyncLock(lockPath, 'test-machine', 5000);
      if (!acquired) { console.error('FAIL: could not acquire lock'); process.exit(1); }
      if (!fs.existsSync(lockPath)) { console.error('FAIL: lock file not created'); process.exit(1); }
      lock.releaseSyncLock(lockPath);
      if (fs.existsSync(lockPath)) { console.error('FAIL: lock not released'); process.exit(1); }
      // Test graceful degradation
      const result = sync.syncForgeMemory('pull', path.join(tmpDir, 'local.db'), '/nonexistent/master.db', 'test');
      if (result.synced !== 0) { console.error('FAIL: should gracefully degrade'); process.exit(1); }
      console.log('R1-006 PASS');
      fs.rmSync(tmpDir, { recursive: true });
    "
    ```


    - src/lib/donor-discovery/adapters/land-bank-adapter.ts
    - scripts/ingest-tx-tdlr.ts
    - scripts/ingest-land-banks.ts
- id: dd-n3-016
  name: Apollo.io and Hunter.io BYO-key connector implementations
  prompt: "Read src/app/(dashboard)/donor-discovery/connectors/page.tsx and src/lib/crypto/key-encrypt.ts in full. Create src/lib/donor-discovery/connectors/apollo-connector.ts. Apollo.io People Search API v1 uses POST https://api.apollo.io/v1/mixed_people/search with api_key in body. This connector implements ConnectorEnricher interface with provider string and enrich method taking prospect DirectoryRecord and apiKey string returning Promise of ConnectorEnrichment. Searches by company domain or name. Extracts decision_maker contacts including CEO Executive Director CSR Director and Donations Manager with email phone and LinkedIn URL. Writes to donor_discovery_prospects.enrichment_private which is tenant-scoped and never shared. Logs usage to adapter_usage_log. Create src/lib/donor-discovery/connectors/hunter-connector.ts. Hunter.io Domain Search API uses GET https://api.hunter.io/v2/domain-search with domain and api_key params. Same ConnectorEnricher interface. Extracts all email addresses found for the domain with confidence score. Filters to decision-maker titles including director manager president CEO executive development donor giving and CSR. Writes to enrichment_private. Create worker job src/worker/jobs/run-connector-enrichment.ts that given prospectId and connectorProvider decrypts the org stored API key calls the appropriate connector and saves results. Wire run_connector_enrichment into queue-processor.ts. Run: pnpm tsc --noEmit. Update governance docs."

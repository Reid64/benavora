# ============================================================
# PILLAR 4 — AUTONOMOUS RELATIONSHIP BUILDER
# Features 98-101
# ============================================================

- id: rel-001
  name: Relationship memory and recommendations migration
  prompt: |
    Read SCHEMA_REGISTRY_v2.md sections for tables 57 (relationship_memory) and 58 (relationship_recommendations) in full.
    Read src/supabase/migrations/ directory listing. Find the highest-numbered migration file.

    Create the next migration file (increment by 1) at src/supabase/migrations/[NEXT]_relationship_builder.sql:

    CREATE TABLE IF NOT EXISTS relationship_memory (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      org_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
      entity_id uuid NOT NULL,
      entity_type text NOT NULL DEFAULT 'funder',
      memory_type text NOT NULL CHECK (memory_type IN ('email','call','press','linkedin','990','meeting','note')),
      content text NOT NULL,
      signal_date date,
      actioned boolean DEFAULT false,
      created_at timestamptz DEFAULT now()
    );
    ALTER TABLE relationship_memory ENABLE ROW LEVEL SECURITY;
    CREATE POLICY "rel_memory_org" ON relationship_memory USING (org_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));
    CREATE INDEX idx_rel_memory_org ON relationship_memory(org_id, entity_id);
    CREATE INDEX idx_rel_memory_type ON relationship_memory(org_id, memory_type);

    CREATE TABLE IF NOT EXISTS relationship_recommendations (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      org_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
      entity_id uuid NOT NULL,
      entity_type text NOT NULL DEFAULT 'funder',
      recommendation_text text NOT NULL,
      urgency text DEFAULT 'normal' CHECK (urgency IN ('urgent','normal','low')),
      status text DEFAULT 'pending' CHECK (status IN ('pending','actioned','dismissed')),
      created_at timestamptz DEFAULT now()
    );
    ALTER TABLE relationship_recommendations ENABLE ROW LEVEL SECURITY;
    CREATE POLICY "rel_recs_org" ON relationship_recommendations USING (org_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));
    CREATE INDEX idx_rel_recs_org ON relationship_recommendations(org_id, status);

    Apply this migration via POST to https://api.supabase.com/v1/projects/vbjplpquqxxfbpazyalt/database/query
    with header Authorization: Bearer sbp_a63596024b79b5964d2dc2971ac9d4cc77a112c1
    and body { "query": "<SQL here>" }.
    Use ASCII characters only in the SQL body — no curly quotes or unicode.
    Use the JavaScriptSerializer pattern for JSON body construction (not ConvertTo-Json).

    Verify both tables exist by running SELECT table_name FROM information_schema.tables WHERE table_name IN ('relationship_memory','relationship_recommendations').

    Commit: git add -A; git commit -m 'feat: relationship_memory and relationship_recommendations tables (migration)'; git push.
  gates:
  - type: compile

- id: rel-002
  name: Relationship Builder agent (AG-19)
  prompt: |
    Read AGENTS_v2.md section for AG-19 (Relationship Builder) in full.
    Read src/lib/agents/ directory listing.
    Read src/lib/intelligence/reputation-agent.ts in full for patterns.

    Create src/lib/agents/relationship-builder-agent.ts:

    Export async function runRelationshipBuilder(orgId: string): Promise<RelationshipBuilderResult>

    The agent:
    1. Fetches all funders for the org from the funders table (id, name, website, last_contact_date).
    2. For each funder, queries relationship_memory WHERE org_id = orgId AND entity_id = funder.id ORDER BY created_at DESC LIMIT 10.
    3. Queries funder_relationship_scores WHERE org_id = orgId AND funder_id = funder.id for current score + momentum.
    4. Calls Claude API (claude-sonnet-4-6, max_tokens 400) with a prompt:
       - System: "You are a nonprofit relationship strategist. Analyze the relationship history and generate ONE specific, actionable engagement recommendation."
       - User: Provide funder name, relationship score, momentum, last 10 memory entries (type + content + date), last_contact_date.
       - Response format: JSON { recommendation: string, urgency: "urgent"|"normal"|"low", reasoning: string }
    5. Upserts the recommendation into relationship_recommendations (insert new row, do not replace existing pending ones — check if a pending recommendation already exists for this funder first, skip if so).
    6. Updates funder_relationship_scores: recalculates score based on memory recency (recent contact = higher score), updates momentum (compare to previous score: rising/stable/declining).

    Score calculation:
    - Base: 50
    - +10 if last_contact_date within 30 days
    - +5 per memory entry in last 90 days (max +20)
    - -10 if no contact in 180+ days
    - -20 if no contact in 365+ days

    Export interface RelationshipBuilderResult { orgsProcessed: number, recommendationsGenerated: number, scoresUpdated: number, errors: string[] }

    Run pnpm tsc --noEmit, fix all errors.
    Commit: git add -A; git commit -m 'feat: AG-19 relationship builder agent'; git push.
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/relationship-builder-agent.ts

- id: rel-003
  name: Relationship Builder API routes
  prompt: |
    Read src/lib/agents/relationship-builder-agent.ts in full.
    Read src/app/api/intelligence/ directory listing for route patterns.

    Create src/app/api/intelligence/relationship-builder/route.ts:
      POST: Accepts { orgId: string }. Runs runRelationshipBuilder(orgId). Returns result JSON.
      Requires authenticated session. Uses service role for DB writes.

    Create src/app/api/intelligence/relationship-memory/route.ts:
      GET: Returns all relationship_memory for the authenticated user's org. Accepts ?entityId= filter.
      POST: Creates a new relationship_memory entry. Body: { entity_id, entity_type, memory_type, content, signal_date }.

    Create src/app/api/intelligence/relationship-recommendations/route.ts:
      GET: Returns all relationship_recommendations for the org WHERE status='pending'. Sorted by urgency (urgent first) then created_at DESC.
      PATCH: Accepts { id, status } to mark a recommendation as actioned or dismissed.

    Run pnpm tsc --noEmit, fix all errors.
    Commit: git add -A; git commit -m 'feat: relationship builder API routes'; git push.
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/intelligence/relationship-builder/route.ts
    - src/app/api/intelligence/relationship-memory/route.ts
    - src/app/api/intelligence/relationship-recommendations/route.ts

- id: rel-004

project: benavora
governance:
- BLUEPRINT_v2.md
- SCHEMA_REGISTRY_v2.md
- FEATURE_REGISTRY_v2.md
- STATE_OF_THE_BUILD.md
- STANDING_DIRECTIVES.md
prompts:

- id: reports-001
  name: Governance sync and funding summary report builder
  prompt: |
    First sync governance docs: $repo = 'C:\Users\manag\Documents\benavora'; $forge = 'C:\Users\manag\Documents\FORGE\projects\benavora'; Get-ChildItem $repo -Filter '*.md' | ForEach-Object { Copy-Item $_.FullName (Join-Path $forge $_.Name) -Force }

    Read src/app/(dashboard)/reports/page.tsx in full.
    Read SCHEMA_REGISTRY_v2.md for applications, outcomes, opportunities tables in full.
    Read src/app/(dashboard)/dashboard/page.tsx first 30 lines for color tokens.

    CRITICAL: inline style={{}} only. Hardcoded hex. Canvas #D6E4F0.

    BUILD COMPLETE REPORTS SYSTEM:

    CREATE src/app/(dashboard)/reports/funding-summary/page.tsx:
    Comprehensive funding pipeline report.

    HEADER: "Funding Summary Report" H1 + date range selector (this month/quarter/year/all time) + "Export PDF" button + "Export CSV" button.

    SUMMARY METRICS ROW (5 cards):
    - Total Opportunities Tracked: count
    - Total Applied (submitted): count + total $ requested
    - Total Awarded: count + total $ awarded
    - Success Rate: awarded/submitted as percentage with trend (up/down arrow vs last period)
    - Pipeline Value: sum of amount_requested for active applications

    FUNDING BY SOURCE (inline SVG bar chart, no external library):
    Bars for: Federal, Foundation, Corporate, State/Local, Land Bank
    Each bar: colored by source type, height proportional to total $ awarded, label with count and amount below.

    FUNDING BY PROGRAM (table):
    Which of your programs attracted the most funding?
    Columns: Program Name, Applications, Awarded, Success Rate, Total Awarded $

    MONTHLY PIPELINE TREND (inline SVG line chart):
    X axis: last 12 months.
    Three lines: Opportunities Found (blue), Applications Submitted (purple), Awards (green).
    Simple polyline SVG — no recharts.

    TOP FUNDERS TABLE:
    Funders you've had the most success with.
    Columns: Funder Name, Times Applied, Times Awarded, Success Rate, Avg Award Amount, Last Award Date.

    CREATE src/app/api/reports/funding-summary/route.ts:
    GET: accepts ?period=month|quarter|year|all. Returns all metrics for the report.
    Runs queries against opportunities, applications, outcomes tables for authenticated org.

    Run pnpm tsc --noEmit. Run pnpm build. Fix all errors.
    git add -A; git commit -m 'feat: funding summary report -- pipeline metrics, source breakdown, program analysis, top funders, inline SVG charts'; git push.

- id: reports-002
  name: Board report generator and impact report
  prompt: |
    Read src/app/(dashboard)/reports/page.tsx in full.
    Read src/app/(dashboard)/reports/funding-summary/page.tsx in full.
    Read SCHEMA_REGISTRY_v2.md for outcomes, knowledge_base_profiles tables in full.
    Read src/app/(dashboard)/dashboard/page.tsx first 30 lines for color tokens.

    CRITICAL: inline style={{}} only. Hardcoded hex. Canvas #D6E4F0.

    BUILD BOARD REPORT AND IMPACT REPORT:

    CREATE src/app/(dashboard)/reports/board-report/page.tsx:
    Auto-generates a board-ready funding report.

    Board Report sections (printable layout, white background for printing):
    1. Executive Summary: one paragraph auto-generated by Claude summarizing the period's performance
    2. Pipeline Overview: same metrics from funding-summary but formatted for board presentation
    3. Key Wins This Quarter: awarded grants listed with context
    4. Upcoming Deadlines (next 60 days): table of high-priority opportunities
    5. AI Platform Activity: agent runs this quarter, drafts generated, opportunities discovered
    6. Recommended Board Actions: pulled from strategic_recommendations with urgency=immediate|urgent

    "Generate Executive Summary" button calls Claude to write 200-word board-appropriate summary.
    "Print Report" button: window.print() with @media print CSS hiding sidebar/nav.
    "Export PDF" button: uses browser print dialog.

    CREATE src/app/(dashboard)/reports/impact/page.tsx:
    Organization impact report for donors and funders.

    Sections:
    1. Mission Statement (from KB)
    2. Programs at a Glance: each program with participant count, outcomes, geography
    3. Financial Stewardship: revenue breakdown, admin vs program ratio
    4. Community Impact Metrics: KPIs from KB with progress bars
    5. Stories of Impact: text area for the org to add 1-2 impact stories
    6. Partners and Funders: list with logos if available
    7. Looking Ahead: goals for next year from KB

    AI ENHANCEMENT: "Enhance with AI" button sends the impact data to Claude and returns a polished, publication-ready narrative version of the impact report.

    Add these to the reports index page with proper links and descriptions.

    Run pnpm tsc --noEmit. Run pnpm build. Fix all errors.
    git add -A; git commit -m 'feat: board report and impact report generators -- printable, AI-enhanced, board-ready'; git push.
    npx vercel deploy --prod.
    Report production URL.

prompts:
- id: pp-001
  name: Fix ProPublica search endpoint zero-result-treated-as-error bug
  prompt: "Read src/lib/donor-discovery/adapters/propublica-adapter.ts in full, focusing on searchOrganizations() (around lines 151-177). Current code (paraphrased, read the real file for exact syntax): it awaits fetch(url), and if response.ok is false it immediately throws a ProPublicaError including the response status and the request URL, before ever attempting to parse a body. Only if response.ok is true does it parse the JSON body and return normalized results.\n\nPer prior investigation (memory: benavora-propublica-search-name-only), ProPublica's /search.json endpoint returns an HTTP 404 status for a legitimate zero-result query (not a 200 with an empty organizations array) — this means the current !response.ok check incorrectly throws ProPublicaError for a perfectly valid \"no matches\" search, indistinguishable from a real failure (network error, malformed request, ProPublica outage). The org-detail fetch elsewhere in this same file (organizations/{ein}.json) already correctly distinguishes its own 404 case — read that function too and match its general approach where it makes sense, but note the two endpoints' 404 semantics are different (org-detail's 404 means \"no such EIN\", search's 404 apparently means \"zero results\" with a JSON body still present) so do not just copy that function's logic verbatim without checking search.json's actual response shape below.\n\nTASK: before changing any code, verify this live — write a small one-off Node script (delete it when done) that calls the real ProPublica API directly: fetch(\"https://projects.propublica.org/nonprofits/api/v2/search.json?q=zzz_deliberately_no_match_zzz\") (a query string virtually guaranteed to match nothing) and log the response status, content-type header, and raw body text. Confirm whether it's actually a 404 with a JSON body (as memory claims) or something else — trust what you observe over the description here.\n\nBased on what you actually observe, fix searchOrganizations() so a legitimate zero-result search returns an empty array instead of throwing: if the response status indicates \"not found\" but the content-type is JSON and the body parses as valid JSON (even if organizations is missing or empty), treat it as a zero-result search and return []. Only throw ProPublicaError for responses that are genuinely not valid JSON, or for non-404 error statuses (5xx, 429, etc — those are real failures the caller should know about, not silently swallow). Keep the existing ProPublicaError type and its call-site contract elsewhere in this file unchanged — this is a narrow fix to searchOrganizations() only.\n\nReport the exact live response you observed (status + content-type) in your final summary — this closes out the open question in INVENTORY_AUDIT_2026-08-26.md §5 about whether this specific call site still has the bug.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the searchOrganizations fix and what a live zero-result query now returns) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/donor-discovery/adapters/propublica-adapter.ts

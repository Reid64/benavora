project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - BEHAVIORAL_CONTRACTS.md
  - STANDING_DIRECTIVES.md
  - FEATURE_REGISTRY_v2.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

prompts:

  - id: security-surface-test-001
    phase: build
    description: "Real security testing: SQL injection, XSS, CSRF, SSRF, auth boundaries, RLS/tenant isolation"
    prompt: |
      Real, live adversarial security testing against this app's actual attack surface - not a checklist read, actual attempts run against real endpoints in a safe/reversible way (test data only, never touching real Faith Foundation data destructively).

      1. SQL injection: attempt real injection payloads against every route that accepts free-text search/filter params (opportunities search, funder search, contact search, admin queries) - this app uses Supabase's query builder throughout, which parameterizes by default, but confirm no route builds raw SQL strings from user input anywhere (grep for any raw .sql()/template-literal query construction).
      2. XSS: attempt real script-injection payloads in every free-text field that gets rendered back to a UI (notes, KB entries, contact names) - confirm React's default escaping isn't bypassed anywhere via dangerouslySetInnerHTML on user-controlled content (grep for every use of dangerouslySetInnerHTML, verify each one's input source).
      3. CSRF: confirm state-changing routes require the real session-cookie auth this app already uses and aren't reachable via a simple cross-origin form post without it.
      4. SSRF: re-verify the safe-fetch.ts protections built for rows #59/#60 are still intact and still block private/loopback/metadata-range targets (re-run the same 8/8 adversarial test already documented as passing, confirm it still passes).
      5. RLS/tenant isolation: pick 5 real org-scoped tables at random (not the ones already exhaustively tested this project's history) and confirm a real second-org session genuinely cannot read or write another org's rows.
      6. Auth boundaries: confirm every owner-only/admin-only route genuinely 403s or redirects for a lower-role real session, not just hides UI elements client-side.

      Document every real finding (pass or fail) in SECURITY_TEST_2026-08-15.md with the actual test performed and actual result - do not claim a category tested if a real attempt wasn't actually made. Fix anything found broken that's small/unambiguous; document anything larger for a follow-up decision.
    expected_outputs:
      - SECURITY_TEST_2026-08-15.md
    gates:
      - type: file_exists
        files: [SECURITY_TEST_2026-08-15.md]
    max_retries: 3
    on_fail: halt

  - id: core-workflow-smoke-test-001
    phase: build
    description: "Real end-to-end smoke test across the actual core user journey"
    prompt: |
      Real, live smoke test through the actual core journey a real org uses this platform for, end to end, in the real Faith Foundation org (or a disposable test org where real writes would be destructive) - not a code read, actual clicks/API calls with real results checked.

      Login -> view dashboard (confirm real data renders, no console errors) -> research/discover a real opportunity -> generate a real AI draft against it -> assemble a real document -> move it through the real application pipeline stages -> record a real outcome. At each step, confirm the real data written is correct (query it back), not just that the UI didn't crash.

      Document real findings in WORKFLOW_SMOKE_TEST_2026-08-15.md - every step's real result, any broken link/button/dead state found along the way. Fix anything small/unambiguous found broken; document anything larger.
    expected_outputs:
      - WORKFLOW_SMOKE_TEST_2026-08-15.md
    gates:
      - type: file_exists
        files: [WORKFLOW_SMOKE_TEST_2026-08-15.md]
    max_retries: 3
    on_fail: halt

  - id: testing-batch-verify-sync-001
    phase: build
    description: "Governance sync"
    prompt: |
      1. Run pnpm run build and pnpm tsc --noEmit, fix any errors.
      2. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md summarizing both test passes, explicit about any real defect found and whether it was fixed or deferred.
      3. Scoped git add, commit with message "test: real security surface test (SQLi/XSS/CSRF/SSRF/RLS/auth) and core workflow smoke test", git push.
    expected_outputs:
      - STATE_OF_THE_BUILD.md
      - SESSION_STATE.md
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

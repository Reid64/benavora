- id: hi-lead-scoring-agent
  name: Build LeadScoringAgent — intelligent lead prioritization
  prompt: |
    Read C:\Users\manag\Documents\hail-intel\src\lib\agents\base-agent.ts in full.
    Read C:\Users\manag\Documents\hail-intel\SCHEMA_REGISTRY.md in full to understand lead and damage data tables.

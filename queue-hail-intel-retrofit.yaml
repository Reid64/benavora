    Create C:\Users\manag\Documents\hail-intel\src\lib\agents\lead-scoring-agent.ts. Minimum 300 lines.
    Export class LeadScoringAgent extends BaseAgent with name='LeadScoringAgent'.
    Scoring formula (all factors 0.0-1.0, composite weighted): damageProximity (0.35) — distance from confirmed hail damage polygon. stormRecency (0.25) — days since nearest storm event, exponential decay. propertyValue (0.20) — estimated property value from county assessor data. contactAvailability (0.10) — has phone, email, and address verified. priorContact (0.10) — negative weight if already contacted within 30 days.
    Composite score = sum of weighted factors, clamped 0.0-1.0.
    Implement run() method: query all leads without score or with score older than 24 hours. Calculate composite score for each. Upsert score and scoring_factors JSON to leads table. Return itemsProcessed = leads scored.
    Create API route src\app\api\agents\lead-scoring\route.ts.
    Register in registry.ts.
    Create migration 20260721000001_lead_scoring_columns.sql adding: score REAL, score_calculated_at TIMESTAMPTZ, scoring_factors JSONB to lead_records table IF NOT EXISTS.

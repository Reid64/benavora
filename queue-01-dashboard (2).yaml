  name: Left Sidebar Navigation 220px
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md before writing.\n\nSTEP 1 - Check if a sidebar component already exists in src\\components\\dashboard\\ or src\\app\\dashboard\\layout.tsx. Read it if yes.\n\nSTEP 2 - Write or replace C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\DashboardSidebar.tsx\nFixed width 220px, full viewport height, background #0f1623, border-right 1px solid #1e2d42, position fixed left 0 top 56px (below top nav). Nav sections with lucide-react icons:\n- Overview (LayoutDashboard icon) -> /dashboard\n- Clients (Users icon) -> /dashboard/clients\n- Pages (FileText icon) -> /dashboard/pages\n- Content Queue (ListTodo icon) -> /dashboard/queue\n- Storm Intelligence (Zap icon) -> /dashboard/storm\n- Analytics (BarChart2 icon) -> /dashboard/analytics\n- System (Settings icon) -> /dashboard/system\nActive state (use usePathname): left border 3px solid #06b6d4, text #06b6d4, background #1c2030. Hover: background #1c2030, text #e2e8f0. Default text #94a3b8. Each nav item is a Next.js Link. Section headers in uppercase 10px #64748b with ambient instructional text below them per DASHBOARD_DESIGN_SPEC.md spec. Bottom: operator version number.\n\nSTEP 3 - Import DashboardSidebar into src\\app\\dashboard\\layout.tsx. Main content area must have padding-left 220px and padding-top 56px to clear fixed nav and sidebar.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors. pnpm run build - succeeds.\n\nSTEP 4 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: DashboardSidebar.tsx exists, imported in layout. pnpm tsc 0 errors. pnpm run build succeeds."

  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md and src\\app\\dashboard\\page.tsx before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\SplitView.tsx\nUses useClientContext() to read selectedClient. Two panels side by side using CSS flexbox. Master panel: when no client selected width=100%, when client selected width=280px with transition width 200ms ease-in-out. Master panel shows scrollable list of all clients: each row has client name, tier badge, page count, health score (integer 0-100). Clicking a row calls setSelectedClient. Detail panel: appears when selectedClient is not null, flex-grow 1, background #0f1623, border-left 1px solid #1e2d42. Detail panel header: client name large, tier badge, active/paused status pill, quick-action buttons (View Pages, Trigger Agent). Detail panel tabs using simple state: Overview, Pages, Content Queue, Analytics, GBP (placeholder), GSC (placeholder). Overview tab renders real data: page count from GET /api/operator/clients/[id], recent conversions from existing conversion API if exists, indexation summary from page_indexation if table exists. Skeleton loader on tab switch. TypeScript strict.\n\nSTEP 2 - Replace the main content area of src\\app\\dashboard\\page.tsx with SplitView. Keep PlatformPulseBar, RiskCommandPanel, PriorityCommandSurface, ActivityStream, IntelligenceRow above or below SplitView per DASHBOARD_DESIGN_SPEC.md layout order.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors.\n\nSTEP 3 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: SplitView.tsx exists, used in dashboard page. pnpm tsc 0 errors."

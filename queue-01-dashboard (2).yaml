- id: d1-006
  name: Platform Pulse Bar Component
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md in full before writing anything.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PlatformPulseBar.tsx\nMid-tone slate palette: background #1c2030, accent #06b6d4. Fetches from GET /api/dashboard/d1-001. Auto-refreshes every 30 seconds via useEffect + setInterval cleanup. Displays: pages_published_today vs daily_allowance with traffic-light (green <80%, amber 80-95%, red >95%), llm_cost_today_usd vs cap_usd with traffic-light, active_clients count, pending_operator_actions count, active_alerts count broken down by P0/P1. Each metric is a horizontal flex row: label left, value center, status dot right. TypeScript strict, no any, full error boundary wrapping the component. Skeleton loader on first fetch.\n\nIMPORTANT: Verify table names against SCHEMA_REGISTRY.md before querying any table in the API route.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\d1-001\\route.ts if it does not already exist.\nGET handler: authenticate with getOperatorContext(), query platform_config for caps, query pages for today count, query llm_calls for today cost, query clients for active count, query flagged items for pending count. Return JSON matching PlatformPulseBar's expected shape.\n\nSTEP 3 - Import PlatformPulseBar into C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\dashboard\\page.tsx at the top of the JSX return.\n\nMIDPOINT CHECK: Run pnpm tsc --noEmit from C:\\Users\\manag\\Documents\\Tarritrix. Fix all errors before continuing.\n\nSTEP 4 - Update C:\\Users\\manag\\Documents\\Tarritrix\\STATE_OF_THE_BUILD.md and C:\\Users\\manag\\Documents\\Tarritrix\\SESSION_STATE.md from actual codebase audit using Get-ChildItem and Select-String commands. Record d1-006 PlatformPulseBar complete with file path and line count.\n\nACCEPTANCE CRITERIA:\nSelect-String -Path C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PlatformPulseBar.tsx -Pattern 'useEffect' - must find match\npnpm tsc --noEmit - 0 errors\npnpm run build - succeeds"
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/dashboard/PlatformPulseBar.tsx

- id: d1-007
  name: Risk Command Panel Component
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\RiskCommandPanel.tsx\nBackground #1c2030, active alert rows get left border 3px solid #06b6d4. Fetches flagged pages from GET /api/dashboard/d1-002. Displays each flagged page as a row: page title, client name, flag reason, time since flagged (relative: '2h ago'), approve button, reject button. Approve calls POST /api/operator/clients/[clientId]/flagged/[pageId]/approve. Reject calls POST /api/operator/clients/[clientId]/flagged/[pageId]/reject. Optimistic UI: remove row immediately on click, restore with error toast if API returns error. Empty state: cyan checkmark icon + text 'No pages require action'. TypeScript strict, no any.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\d1-002\\route.ts if missing.\nGET: getOperatorContext() auth, query pages WHERE validation_status IN ('flagged','pending_review'), join with clients for client name. Return array of flagged pages.\n\nSTEP 3 - Import RiskCommandPanel below PlatformPulseBar in src\\app\\dashboard\\page.tsx.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors before continuing.\n\nSTEP 4 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: RiskCommandPanel file exists, imports found in dashboard page, pnpm tsc 0 errors."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/dashboard/RiskCommandPanel.tsx

- id: d1-008
  name: Priority Command Surface All Three Lanes
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PriorityLaneCritical.tsx\nRed left border 3px #ef4444, background #1c2030. Label CRITICAL uppercase red #ef4444. Fetches from GET /api/dashboard/d1-003?priority=critical. Each item: title, client name, age string, action button. Items older than 4 hours without acknowledgement get pulsing red dot via CSS animation pulse. Sorted oldest first.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PriorityLaneAttention.tsx\nAmber left border 3px #f59e0b. Label ATTENTION uppercase amber. Fetches priority=attention. Auto-escalation: items older than 24h call PATCH /api/dashboard/items/[id]/escalate to move to critical. Sorted oldest first.\n\nSTEP 3 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PriorityLaneInformational.tsx\nCyan left border 3px #06b6d4. Label INFORMATIONAL uppercase cyan. Fetches priority=informational. Dismiss button calls DELETE /api/dashboard/items/[id], removes row optimistically. Auto-escalation to attention after 72h.\n\nSTEP 4 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PriorityCommandSurface.tsx\nThree-column CSS grid, imports all three lane components, renders them side by side. Header: PRIORITY COMMAND SURFACE in #94a3b8 uppercase.\n\nSTEP 5 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\d1-003\\route.ts if missing.\nGET: accepts ?priority= query param, returns dashboard_items filtered by priority. Verify dashboard_items table name against SCHEMA_REGISTRY.md - if table does not exist use operator_actions table or create appropriate structure.\n\nSTEP 6 - Import PriorityCommandSurface into src\\app\\dashboard\\page.tsx below RiskCommandPanel.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors.\n\nSTEP 7 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: All 4 component files exist. pnpm tsc 0 errors. pnpm run build succeeds."

- id: d1-009
  name: Activity Stream Component
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\ActivityStream.tsx\nBackground #1c2030, max-height 400px, overflow-y scroll. Fetches GET /api/dashboard/d1-004?limit=20&cursor=undefined. Each activity item: timestamp (relative), actor name (agent ID or user email), action description, client name, status badge. Badge colors: success #06b6d4, error #ef4444, warning #f59e0b, info #94a3b8. Infinite scroll: IntersectionObserver on last item triggers fetch of next 20 with cursor from previous response. Polling: every 15 seconds fetch new items (created_at > last known), prepend with CSS slide-down transition. TypeScript strict, Zod for API response validation.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\d1-004\\route.ts if missing.\nGET: getOperatorContext() auth, accepts limit and cursor params, queries agent_events table ordered by created_at DESC, returns items with next_cursor. Verify agent_events columns against SCHEMA_REGISTRY.md.\n\nSTEP 3 - Import ActivityStream into src\\app\\dashboard\\page.tsx.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors.\n\nSTEP 4 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: ActivityStream.tsx exists, pnpm tsc 0 errors."

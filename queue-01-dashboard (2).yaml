- id: d1-010
  name: Index Health Score SVG Arc Gauge
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\DASHBOARD_DESIGN_SPEC.md before writing. CRITICAL: This is a custom SVG arc - NOT a donut chart. Do not use recharts, chart.js, or any charting library.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\IndexHealthGauge.tsx\nPure SVG component. Props: score (number 0-100), label (string), size (number default 200). Arc math: cx=size/2, cy=size/2, r=size*0.4, strokeWidth=size*0.06. Arc spans 220 degrees starting at 160deg. startAngleDeg=160, sweepDeg=220, startAngleRad=startAngleDeg*(Math.PI/180), endAngleRad=(startAngleDeg+score/100*sweepDeg)*(Math.PI/180). Arc path: M cx+r*cos(startAngleRad) cy+r*sin(startAngleRad) A r r 0 largeArcFlag 1 cx+r*cos(endAngleRad) cy+r*sin(endAngleRad). largeArcFlag = score/100*sweepDeg > 180 ? 1 : 0. Background arc uses same math with score=100 stroke #2a3347. Score arc color: interpolated from #ef4444 at 0 to #f59e0b at 50 to #06b6d4 at 100 using linear RGB interpolation. Center text: score in font-size size*0.16, label below in font-size size*0.07 fill #94a3b8. Animation: on mount animate score from 0 to actual using requestAnimationFrame over 1000ms with easeOutCubic easing t=>1-Math.pow(1-t,3).\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\IntelligenceRow.tsx\nHorizontal row of 4 intelligence cards. Background #1c2030, cards divided by 1px #2a3347 border. Cards: (1) Storm Intelligence - GET /api/dashboard/storm-summary - shows active storm events count and affected clients. (2) Content Performance - GET /api/dashboard/content-performance - indexed pages this week, avg position. (3) LLM Cost Tracker - GET /api/dashboard/llm-costs - today spend vs cap, model breakdown. (4) System Health - GET /api/dashboard/system-health - renders IndexHealthGauge with index_health_score from API, agent success rates list. Each card has skeleton loader while fetching and error state.\n\nSTEP 3 - Write the 4 API routes if missing:\nC:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\storm-summary\\route.ts - query storm_events and client_storm_subscriptions. Verify table names against SCHEMA_REGISTRY.md first.\nC:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\content-performance\\route.ts - query page_indexation and pages.\nC:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\llm-costs\\route.ts - query llm_calls for today.\nC:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\system-health\\route.ts - compute index_health_score as (indexed_pages/total_pages)*100, query agent_events for success rates.\n\nSTEP 4 - Import IntelligenceRow into src\\app\\dashboard\\page.tsx at the bottom.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors. Verify IndexHealthGauge.tsx contains no recharts or chart.js imports.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: IndexHealthGauge.tsx and IntelligenceRow.tsx exist. No charting library imports in gauge file. pnpm tsc 0 errors."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/dashboard/IndexHealthGauge.tsx
    - src/components/dashboard/IntelligenceRow.tsx


governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
project: Tarritrix
prompts:
- id: spdi-001
  name: SPDI Event Envelope Schema Migration
  prompt: "Read SCHEMA_REGISTRY.md in full. Read docs/architecture/SPDI_SYSTEM_SPEC_V1.md section on event envelope if it exists. Read BEHAVIORAL_CONTRACTS.md Contracts 86-90.\n\nSTEP 1 - Check if domain_events table already exists: SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name='domain_events'. Run via supabase db execute or check SCHEMA_REGISTRY.md.\n\nSTEP 2 - If table does not exist write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728100000_spdi_event_envelope.sql:\nCREATE TABLE IF NOT EXISTS domain_events (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), event_type TEXT NOT NULL, event_version TEXT NOT NULL DEFAULT '1.0', tenant_id UUID NOT NULL, client_id UUID REFERENCES clients(id) ON DELETE SET NULL, originating_agent TEXT, originating_workflow TEXT, causation_event_id UUID REFERENCES domain_events(id) ON DELETE SET NULL, correlation_id UUID, occurred_at TIMESTAMPTZ NOT NULL DEFAULT now(), recorded_at TIMESTAMPTZ NOT NULL DEFAULT now(), actor_type TEXT CHECK (actor_type IN ('agent','operator','system','api')) NOT NULL DEFAULT 'system', actor_id TEXT, risk_class INTEGER CHECK (risk_class BETWEEN 0 AND 4), approval_state TEXT CHECK (approval_state IN ('not_required','pending','approved','rejected','auto_approved')) DEFAULT 'not_required', payload JSONB, data_classification TEXT CHECK (data_classification IN ('public','internal','confidential','restricted')) DEFAULT 'internal', retention_days INTEGER DEFAULT 365);\nCREATE INDEX IF NOT EXISTS idx_domain_events_client ON domain_events(client_id);\nCREATE INDEX IF NOT EXISTS idx_domain_events_type ON domain_events(event_type);\nCREATE INDEX IF NOT EXISTS idx_domain_events_occurred ON domain_events(occurred_at DESC);\nALTER TABLE domain_events ENABLE ROW LEVEL SECURITY;\nCREATE POLICY domain_events_operator ON domain_events FOR SELECT TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY domain_events_system_insert ON domain_events FOR INSERT TO service_role WITH CHECK (true);\n\nSTEP 3 - Apply: supabase db push. Report result.\n\nSTEP 4 - Update SCHEMA_REGISTRY.md adding domain_events table entry.\n\nSTEP 5 - pnpm tsc --noEmit. 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI domain_events event envelope schema migration'; git push origin main. Report commit hash."
  gates:
  - type: compile

- id: spdi-002
  name: Risk Classifier Implementation
  prompt: "Read BEHAVIORAL_CONTRACTS.md Contracts 86-90. Read docs/architecture/SPDI_SYSTEM_SPEC_V1.md risk classification section if accessible.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\risk-classifier.ts\n\nexport enum RiskClass { ZERO = 0, ONE = 1, TWO = 2, THREE = 3, FOUR = 4, PROHIBITED = 99 }\n\nexport interface RiskInput { action_type: string; affected_system: 'external_api'|'database'|'file_system'|'internal'; is_reversible: boolean; is_sensitive_identity_field: boolean; affects_published_content: boolean; requires_human_verification: boolean }\n\nexport function classifyRisk(input: RiskInput): RiskClass\nLogic:\n- PROHIBITED: action_type contains 'delete_all' or 'purge' or 'drop_table'\n- Class 4: affects_published_content=true AND is_reversible=false AND affected_system='external_api'\n- Class 3: affects_published_content=true AND is_reversible=false\n- Class 3: is_sensitive_identity_field=true AND affected_system='external_api'\n- Class 2: affects_published_content=true AND is_reversible=true\n- Class 2: affected_system='external_api' AND requires_human_verification=true\n- Class 1: affected_system='external_api' AND is_reversible=true\n- Class 1: affected_system='database' AND affects_published_content=false\n- Class 0: everything else (internal reads, logging, monitoring)\n\nexport function requiresApproval(riskClass: RiskClass): boolean - returns true if riskClass >= 3\n\nexport function requiresHumanApproval(riskClass: RiskClass): boolean - returns true if riskClass >= 4\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\tests\\unit\\lib\\governance\\risk-classifier.test.ts\n5 vitest tests: PROHIBITED correctly classified, Class 4 external irreversible published, Class 0 internal read, requiresApproval boundary at 3, PROHIBITED returns 99.\n\npnpm tsc --noEmit 0 errors. pnpm vitest run tests/unit/lib/governance/risk-classifier.test.ts passes.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI risk classifier implementation and tests'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/governance/risk-classifier.ts
    - tests/unit/lib/governance/risk-classifier.test.ts

- id: spdi-003
  name: Approval Workflow Schema and API
  prompt: "Read SCHEMA_REGISTRY.md to verify approvals table does not already exist before writing migration.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728110000_spdi_approvals.sql:\nCREATE TABLE IF NOT EXISTS approvals (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID REFERENCES clients(id) ON DELETE CASCADE, action_type TEXT NOT NULL, risk_class INTEGER NOT NULL CHECK (risk_class BETWEEN 0 AND 4), proposed_action JSONB NOT NULL, proposed_by TEXT NOT NULL, status TEXT CHECK (status IN ('pending','approved','rejected','auto_approved','elevated_required','expired')) NOT NULL DEFAULT 'pending', approved_by UUID REFERENCES auth.users(id), approved_at TIMESTAMPTZ, rejection_reason TEXT, notes TEXT, expires_at TIMESTAMPTZ NOT NULL DEFAULT (now() + interval '24 hours'), domain_event_id UUID REFERENCES domain_events(id) ON DELETE SET NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_approvals_client ON approvals(client_id);\nCREATE INDEX IF NOT EXISTS idx_approvals_status ON approvals(status);\nALTER TABLE approvals ENABLE ROW LEVEL SECURITY;\nCREATE POLICY approvals_operator ON approvals FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\approvals\\route.ts\nGET: getOperatorContext() auth. Query pending approvals for operator's clients. Return array sorted by created_at DESC.\nPOST: getOperatorContext() auth. Body { client_id, action_type, risk_class, proposed_action }. Validate risk_class >= 3 (lower risk classes are auto_approved). Insert approval row with status='pending'. Insert domain_event row. Return { approval_id, status, expires_at }.\n\nSTEP 3 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\approvals\\[id]\\route.ts\nPATCH: getOperatorContext() auth. Body { status: 'approved'|'rejected', notes? }. Verify operator owns the client for this approval. Update status, approved_by, approved_at. Insert domain_event. Return updated approval.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI approval workflow schema and API routes'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/api/approvals/route.ts
    - src/app/api/approvals/[id]/route.ts

- id: spdi-004
  name: Evidence Records Schema and Contract 86 Enforcement
  prompt: "Read BEHAVIORAL_CONTRACTS.md Contract 86 (Evidence-Before-Publication Gate) in full. Read AGENTS.md A-05 Page Validator entry.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728120000_spdi_evidence_records.sql:\nCREATE TABLE IF NOT EXISTS evidence_records (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, page_id UUID REFERENCES pages(id) ON DELETE CASCADE, evidence_type TEXT CHECK (evidence_type IN ('job_photo','permit','certificate','measurement','customer_attestation','operator_attestation','system_verified')) NOT NULL, evidence_source TEXT CHECK (evidence_source IN ('job_evidence','manual_upload','third_party_api','operator_entry')) NOT NULL, evidence_status TEXT CHECK (evidence_status IN ('verified','client_attested','system_inferred','expired','prohibited')) NOT NULL DEFAULT 'client_attested', claim_text TEXT, verification_method TEXT, verified_at TIMESTAMPTZ, verified_by TEXT, expiry_date DATE, job_evidence_id UUID REFERENCES job_evidence(id) ON DELETE SET NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_evidence_records_page ON evidence_records(page_id);\nCREATE INDEX IF NOT EXISTS idx_evidence_records_client ON evidence_records(client_id);\nALTER TABLE evidence_records ENABLE ROW LEVEL SECURITY;\nCREATE POLICY evidence_records_operator ON evidence_records FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\evidence-gate.ts\nexport async function checkEvidenceGate(pageId: string, clientId: string): Promise<{ passed: boolean; missing_claims: string[]; evidence_count: number }>\nQuery evidence_records WHERE page_id=pageId AND client_id=clientId AND evidence_status IN ('verified','client_attested'). If count=0 return passed=false. If count > 0 return passed=true. This enforces Contract 86: no page publishes without at least one evidence record.\n\nSTEP 3 - Read src/lib/agents/a-05-page-validator.ts. Find the validation logic. Add an evidence gate check: import checkEvidenceGate, call it before returning validation success. If evidence gate fails add 'EVIDENCE_REQUIRED' to validation errors array. Do not change the function signature or output schema.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI evidence records schema and Contract 86 enforcement in A-05'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/governance/evidence-gate.ts

- id: spdi-005
  name: Audit Events Table and Base Agent Wiring
  prompt: "Read src/lib/agents/base-agent.ts in full before writing anything. Read SCHEMA_REGISTRY.md.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728130000_spdi_audit_events.sql:\nCREATE TABLE IF NOT EXISTS audit_events (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID REFERENCES clients(id) ON DELETE SET NULL, agent_id TEXT, user_id UUID REFERENCES auth.users(id) ON DELETE SET NULL, action_type TEXT NOT NULL, risk_class INTEGER CHECK (risk_class BETWEEN 0 AND 4), before_state JSONB, after_state JSONB, approval_id UUID REFERENCES approvals(id) ON DELETE SET NULL, rollback_available BOOLEAN NOT NULL DEFAULT false, rollback_procedure TEXT, domain_event_id UUID REFERENCES domain_events(id) ON DELETE SET NULL, metadata JSONB, occurred_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_audit_events_client ON audit_events(client_id);\nCREATE INDEX IF NOT EXISTS idx_audit_events_action ON audit_events(action_type);\nCREATE INDEX IF NOT EXISTS idx_audit_events_occurred ON audit_events(occurred_at DESC);\nALTER TABLE audit_events ENABLE ROW LEVEL SECURITY;\nCREATE POLICY audit_events_operator ON audit_events FOR SELECT TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY audit_events_system_insert ON audit_events FOR INSERT TO service_role WITH CHECK (true);\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\audit-logger.ts\nexport async function logAuditEvent(params: { client_id?: string; agent_id?: string; user_id?: string; action_type: string; risk_class?: number; before_state?: unknown; after_state?: unknown; approval_id?: string; rollback_available?: boolean; rollback_procedure?: string; metadata?: unknown }): Promise<string>\nInsert to audit_events using Supabase service role client. Return the created audit_event id. Handle errors gracefully - never throw, log to console.error instead.\n\nSTEP 3 - Update src/lib/agents/base-agent.ts: after any successful agent execution that modifies external state (status='completed' and output is not null), call logAuditEvent with action_type=agent_id, agent_id, client_id, risk_class=0 (default, agents can override), after_state=output summary. Do NOT change the BaseAgent public interface or any existing tests.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. pnpm vitest run — existing tests must still pass.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI audit_events schema and base agent audit logging'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/governance/audit-logger.ts

- id: spdi-006
  name: Policy Events and Auto-Suspension
  prompt: "Read BEHAVIORAL_CONTRACTS.md Contract 89 (SPDI Orchestration Cycle Compliance). Read src/lib/agents/base-agent.ts.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728140000_spdi_policy_events.sql:\nCREATE TABLE IF NOT EXISTS policy_events (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID REFERENCES clients(id) ON DELETE SET NULL, agent_id TEXT, policy_warning_type TEXT CHECK (policy_warning_type IN ('api_quota_exceeded','rate_limit_hit','content_policy_violation','spam_detection','manual_quality_flag','scaled_content_abuse')) NOT NULL, triggering_action TEXT, triggering_agent_event_id UUID, auto_suspended BOOLEAN NOT NULL DEFAULT false, suspension_scope TEXT, resolution TEXT, resolved_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_policy_events_client ON policy_events(client_id);\nCREATE INDEX IF NOT EXISTS idx_policy_events_agent ON policy_events(agent_id);\nALTER TABLE policy_events ENABLE ROW LEVEL SECURITY;\nCREATE POLICY policy_events_operator ON policy_events FOR SELECT TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY policy_events_system ON policy_events FOR INSERT TO service_role WITH CHECK (true);\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\policy-enforcer.ts\nexport async function handleApiPolicyWarning(params: { client_id: string; agent_id: string; warning_type: 'api_quota_exceeded'|'rate_limit_hit'|'content_policy_violation'|'spam_detection'; triggering_action: string; agent_event_id?: string }): Promise<{ suspended: boolean; policy_event_id: string }>\nInsert to policy_events with auto_suspended=true if warning_type IN ('content_policy_violation','spam_detection'). For quota/rate limit: auto_suspended=false but still log. Return { suspended, policy_event_id }.\n\nexport async function isClientSuspended(clientId: string, actionClass: string): Promise<boolean>\nQuery policy_events WHERE client_id=clientId AND auto_suspended=true AND resolved_at IS NULL AND suspension_scope=actionClass OR suspension_scope IS NULL. Return true if any unresolved suspension exists.\n\nSTEP 3 - Add suspension check to base-agent.ts: at the start of execute(), before calling process(), call isClientSuspended(client_id, agent_id). If suspended throw AgentError with code POLICY_SUSPENSION and is_retryable=false.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. Existing vitest tests must still pass.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI policy events auto-suspension enforcement'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/governance/policy-enforcer.ts

- id: spdi-007
  name: SPDI Governance Dashboard Page
  prompt: "Read existing dashboard files in src/app/dashboard/ and src/components/dashboard/ before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\governance\\route.ts\nGET with getOperatorContext() auth. Return:\n{ pending_approvals: number (query approvals WHERE status='pending' AND client_id in operator clients), active_suspensions: number (query policy_events WHERE auto_suspended=true AND resolved_at IS NULL), audit_events_24h: number (query audit_events WHERE occurred_at > now()-interval'24 hours'), risk_class_breakdown: { class_0: n, class_1: n, class_2: n, class_3: n, class_4: n } (from audit_events last 7 days) }\nVerify all table names and columns against SCHEMA_REGISTRY.md before querying.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\dashboard\\governance\\page.tsx\n'use client'. Fetches /api/dashboard/governance. Background #1c2030. Renders:\n- Pending Approvals count with link to /api/approvals for detail\n- Active Suspensions count in red if > 0\n- Audit Events last 24h count\n- Risk Class breakdown as 5 horizontal bars with labels Class 0 through Class 4\n- Recent audit events table: action_type, agent_id, risk_class badge, occurred_at relative timestamp\nAuto-refresh 30s. TypeScript strict.\n\nSTEP 3 - Add Governance link to DashboardSidebar.tsx if it exists. Use Shield icon from lucide-react.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md marking SPDI foundation block complete. Update SESSION_STATE.md. git add -A; git commit --no-verify -m 'feat: SPDI governance dashboard page and API'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/api/dashboard/governance/route.ts
    - src/app/dashboard/governance/page.tsx

- id: spdi-008
  name: SPDI Foundation Integration Verification
  prompt: "Read all SPDI foundation files built in this queue before running verification.\n\nSTEP 1 - Verify all SPDI foundation files exist:\nTest-Path src/lib/governance/risk-classifier.ts\nTest-Path src/lib/governance/evidence-gate.ts\nTest-Path src/lib/governance/audit-logger.ts\nTest-Path src/lib/governance/policy-enforcer.ts\nTest-Path src/app/api/approvals/route.ts\nTest-Path src/app/api/approvals/[id]/route.ts\nTest-Path src/app/api/dashboard/governance/route.ts\nTest-Path src/app/dashboard/governance/page.tsx\nAll must return True.\n\nSTEP 2 - Run full test suite:\npnpm tsc --noEmit\npnpm run build\npnpm vitest run\nReport pass/fail for each. Fix any failures introduced by SPDI changes.\n\nSTEP 3 - Verify governance tables exist in Supabase:\nsupabase db execute --sql \"SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('domain_events','approvals','evidence_records','audit_events','policy_events') ORDER BY table_name\"\nMust return all 5 tables.\n\nSTEP 4 - Update STATE_OF_THE_BUILD.md marking SPDI foundation complete with all 5 schema tables and 4 governance lib files. Update SESSION_STATE.md with next phase: dashboard rebuild (queue-01-retry with substance gate enforcement).\n\nSTEP 5 - Deploy to production:\nvercel --prod\nVerify: Invoke-WebRequest -Uri https://tarritrix.vercel.app/api/health -Method GET\n\nSTEP 6 - git add -A; git commit --no-verify -m 'feat: SPDI foundation complete - governance infrastructure deployed to production'; git push origin main\ngit tag v1.0.0-spdi-foundation; git push origin v1.0.0-spdi-foundation\nReport commit hash and tag.\n\nACCEPTANCE: All 8 files exist. pnpm tsc 0 errors. pnpm run build succeeds. All 5 DB tables exist. Production /api/health returns 200. Commit hash and tag reported."
  gates:
  - type: compile
  - type: build

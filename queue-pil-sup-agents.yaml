tion_flagged', 'allocator.depth_ceiling_reached') uses this file's exact existing logAction() call shape (organization_id, actor_type: \"agent\", actor_id: context.agentCode, resource_type: \"pil_research_runs\", etc.).\n\nTEST FILE -- src/__tests__/unit/pil-sup-agents.test.ts already covers BEN-SUP-04 in its `describe(\"BEN-SUP-04 Research Portfolio Allocator\", ...)` block (read it in full first and match its exact mocking pattern). Extend that describe block with: (1) a starvation-flag test (a run paused N times already gets flagged via createReviewItem() instead of paused again); (2) a depth-ceiling test (delegates to BEN-SUP-05 instead of deepening further once totalSteps is at the ceiling); (3) an evidence-load-failure test delegating to BEN-SUP-06 with allocationSkippedThisCycle: true; (4) a regression test confirming the original single-pause/single-reallocate happy path and the low-yield flagging both still fire exactly as before when none of the new guards trigger.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- pnpm run build is the only real gate this repo tier has beyond compile; the compile gate alone does not catch the build-time ESLint pass Next.js's next build enforces, which has broken production directly before).\n3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (extended precedence/delegation logic, new recovery handling, new structured logging, new review-item creation) is actually present in the code, not just that it compiles. Run pnpm run test:unit -- src/__tests__/unit/pil-sup-agents.test.ts and confirm the new and existing test cases in it all pass -- do not treat a green build
# queue-pil-sup-agents.yaml
# Upgrades the 6 Supervisory-family PIL agents (BEN-SUP-01..06) in place to the fuller
# 47-agent spec detail in C:\temp\PIL_AGENT_COMPLETE_ROSTER.md / PIL_AGENT_DEPENDENCIES.yaml.
# Same file paths, same registry rows, same agent IDs -- no rebuild, no parallel system.
# BEN-SUP-07/BEN-SUP-08 are explicitly out of scope (task-added agents outside this spec).
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-sup-01-upgrade
  name: Upgrade BEN-SUP-01 Chief Prospect Intelligence Orchestrator to the fuller PIL spec
  prompt: "STEP 1 -- READ src/lib/pil/agents/sup/BEN-SUP-01.ts in full before writing anything.\n\nThis file already implements a real, working ChiefProspectIntelligenceOrchestrator: it classifies context.goal into required agent families (discovery/prospect_intelligence/relationship_intelligence/qualification) via classifyGoal(), loads prior pil_research_runs for the prospect, computes completed/active/gap families, dispatches a new pil_research_runs row per gap family via createResearchRun()+advanceRunState(), evaluates objectiveSatisfied (true only when gapFamilies is empty AND every required family was already completed BEFORE this cycle), creates a high_impact_action review item via createReviewItem() when satisfied, and delegates to BEN-SUP-02 (strategy) and, when discovery is a gap, BEN-DIS-01 -- all through the delegations array AgentResult mechanism AgentRunner.run() consumes. PRESERVE all of this exactly: classifyGoal()'s keyword matching, the gap-dispatch loop, the objectiveSatisfied computation, and the existing BEN-SUP-02/BEN-DIS-01 delegation calls must all keep working after this prompt -- do not regress any of it, only extend it.\n\nSTEP 2 -- READ src/lib/pil/agent-runner.ts in full: the real Agent/AgentContext/AgentResult/DelegationRequest interfaces this class implements. This class must read `export class ChiefProspectIntelligenceOrchestrator implements Agent` -- never `extends BaseAgent`, which does not exist anywhere in this codebase. Also read src/lib/pil/agents/qlf/BEN-QLF-04.ts in full: the canonical ~290-line reference pattern every dense PIL agent implementation in this repo follows -- a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent (e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications). This delegations-array mechanism -- not any FORGE queue-chaining feature -- is what \"delegate to\" or \"chain into\" means anywhere below. Also confirm BEN-SUP-01 is still present under its existing key in src/lib/pil/agents/index.ts's AGENT_FACTORIES map (src/lib/pil/agents/index.ts) -- this prompt does not add a new registry entry, it only extends the existing implementation the map already points to.\n\nSTEP 3 -- EXTEND BEN-SUP-01 per its fuller spec (PIL_AGENT_COMPLETE_ROSTER.md section \"BEN-SUP-01 -- Chief Prospect Intelligence Orchestrator\"; PIL_AGENT_DEPENDENCIES.yaml's BEN-SUP-01 entry, both at C:\\temp\\ -- read the full BEN-SUP-01 entries in each before writing code). The richer spec has this agent durably own the tenant goal until it is satisfied, paused, blocked, superseded, disqualified, or terminally failed -- and its input contracts explicitly include v2 consumption of BEN-SUP-05's CriticReviewDecision.v2 and BEN-SUP-06's RecoveryValidationReport.v2, with an explicit conflict-precedence order (spec section 23): constitution/policy > tenant/security/integrity quarantine > BEN-SUP-05 blocking verdict (precedence #3) > BEN-SUP-06 unresolved recovery (precedence #4) > approved strategy (BEN-SUP-02) > validated plan (BEN-SUP-03) > allocation plan (BEN-SUP-04) > human decisions. Concretely, add this precedence check BEFORE the existing objectiveSatisfied computation is allowed to produce status \"completed\":\n(a) Query pil_policy_decisions (already the table BEN-SUP-05 writes verdicts to via its recordDecision() method, action_requested formatted as `critic_review:${targetAgentRunId}`) for any row where actor_agent_id = 'BEN-SUP-05', decision = 'deny', tied to an agent_run for this prospect/research run, with no later overriding row -- if found, this run must never report objectiveSatisfied = true regardless of gapFamilies; instead add `blockedByCriticVerdict: true` to conclusions and keep status \"blocked\" (an existing AgentRunStatus value in src/lib/pil/types.ts).\n(b) Query for any open/unresolved recovery signal from BEN-SUP-06 touching this prospect or research run -- since there is no dedicated pil_recovery_cases table in the applied schema (verify by grepping supabase/migrations/ for 'recovery' before assuming; if a real table exists use it, otherwise reuse the pil_research_runs rows this agent already loads via loadRunsForProspect() and treat any row whose structured_plan has recovery_of set with no corresponding completed recovery outcome as an unresolved SUP-06 case) -- if found, objectiveSatisfied must be false and conclusions must record `blockedByUnresolvedRecovery: true`.\n(c) Only if neither (a) nor (b) blocks, proceed with the existing gapFamilies-based objectiveSatisfied logic unchanged.\n\nSTEP 4 -- Add the two missing delegation targets the roster documents this agent requesting: BEN-SUP-03 (planning) and BEN-SUP-04 (allocation). Today this agent only ever delegates to BEN-SUP-02 and BEN-DIS-01. Extend the existing `if (!objectiveSatisfied)` delegation block: after delegating to BEN-SUP-02 (unchanged), also push a delegation to BEN-SUP-03 with objective `Produce an execution plan for the dispatched research runs (prospect ${context.prospectId ?? \"(portfolio-level)\"})` at maxAutonomy \"A2\" whenever dispatchedRunIds.length > 0 this cycle, and once completedFamilies.size > 0 (there is real research yield to allocate against), also push a delegation to BEN-SUP-04 with objective `Allocate portfolio budget across in-flight research for prospect ${context.prospectId ?? \"(portfolio-level)\"}` at maxAutonomy \"A2\". Do not remove or reorder the existing BEN-SUP-02/BEN-DIS-01 delegations -- append these two.\n\nSTEP 5 -- Recovery protocol (roster: \"Full per-failure-type table\"). This agent's execute() currently has no explicit handling of specific failure types beyond AgentRunner.run()'s own outer catch (which finalizes any thrown error as a \"failed\" run -- keep relying on that safety net for truly unexpected errors). Add explicit, narrower handling for two failure types the roster calls out: wrap the loadRunsForProspect() calls in a try block; on any thrown error whose message matches /duplicate|conflict/i, treat it as \"duplicate delivery\" and recover by reloading once via a fresh loadRunsForProspect() call rather than failing the whole cycle (log via logAction with action 'orchestrator.duplicate_delivery_recovered' before retrying); on any thrown error whose message matches /budget|exhausted/i, treat it as budget exhaustion -- do not retry, instead return status \"blocked\" and record a human-review item via createReviewItem() (review_type 'policy_exception') summarizing the budget exhaustion, matching the existing createReviewItem() call shape already in this file.\n\nSTEP 6 -- Structured logging at each state transition (this translates the roster's G0-G5 evaluation-criteria language into concrete code, since neither `npm run evaluate` nor any scorecard command exists in this repo -- the real quality bar here is pnpm tsc --noEmit + pnpm run build, per FORGE_CANONICAL_INSTRUCTIONS.md). Call logAction() (already imported) at each of these transitions if not already covered: goal classified (existing 'orchestrator.plan_formed' call -- keep as-is), a blocking condition detected in Step 3 (new action 'orchestrator.blocked_by_precedence' with after_state {blockedByCriticVerdict, blockedByUnresolvedRecovery}), each new delegation added in Step 4 (add one 'orchestrator.delegated' logAction call per new delegation target with after_state {childAgentCode, objective}), and final evaluation (existing 'orchestrator.evaluated' call -- keep it, but extend its after_state object to also include blockedByCriticVerdict/blockedByUnresolvedRecovery so the audit trail reflects the new precedence logic).\n\nTEST FILE -- src/__tests__/unit/pil-sup-agents.test.ts already covers BEN-SUP-01 in its `describe(\"BEN-SUP-01 Chief Prospect Intelligence Orchestrator\", ...)` block (read it in full first, including its mock setup for @/lib/pil/db, @/lib/pil/workflow, @/lib/pil/audit, @/lib/pil/human-review -- match that exact mocking pattern, do not invent a new one). Extend that describe block with: (1) a test proving a pending BEN-SUP-05 'deny' row in pil_policy_decisions forces status 'blocked' and objectiveSatisfied is not reported true even when gapFamilies is empty; (2) a test proving the new BEN-SUP-03/BEN-SUP-04 delegations appear in result.delegations when dispatchedRunIds/completedFamilies conditions are met; (3) a regression test proving the existing BEN-SUP-02/BEN-DIS-01 delegation behavior is unchanged so this prompt cannot silently break what already passes.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- pnpm run build is the only real gate this repo tier has beyond compile; the compile gate alone does not catch the build-time ESLint pass Next.js's next build enforces, which has broken production directly before).\n3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (extended precedence/delegation logic, new recovery handling, new structured logging, new review-item creation) is actually present in the code, not just that it compiles. Run pnpm run test:unit -- src/__tests__/unit/pil-sup-agents.test.ts and confirm the new and existing test cases in it all pass -- do not treat a green build as sufficient if this command was not actually run.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (BEN-SUP-01's spec-detail additions, confirmation it remains registered in src/lib/pil/agents/index.ts's AGENT_FACTORIES map under the same key, no new agent codes added) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action.\n\nDo NOT run npx vercel deploy or any production-deploy command, and do NOT curl any live/production URL -- deployment is a separate, explicitly human-reviewed step and out of scope for this queue.\n\nSEPARATE SCOPE BOUNDARY (not a deploy instruction): Do NOT touch src/lib/pil/agents/sup/BEN-SUP-07.ts or src/lib/pil/agents/sup/BEN-SUP-08.ts (Autonomy Governor Agent / Executive Intelligence Narrative Agent) -- those are task-added agents from a different initiative, outside this 47-agent PIL spec's Supervisory family entirely, and must not be modified or even referenced as part of this prompt's changes."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/sup/BEN-SUP-01.ts
    - src/__tests__/unit/pil-sup-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-sup-02-upgrade
  name: Upgrade BEN-SUP-02 Research Strategy Architect to the fuller PIL spec
  prompt: "STEP 1 -- READ src/lib/pil/agents/sup/BEN-SUP-02.ts in full before writing anything.\n\nThis file already implements a real, working ResearchStrategyArchitect: it loads the prospect and its evidence, computes REQUIRED_DIMENSIONS_BY_ENTITY_TYPE for the prospect's entity_type, finds coveredDimensionsFromEvidence() and the resulting gaps, selects source types via SOURCE_TYPES_BY_ENTITY_TYPE and listActiveSources(), scores the plan (dimensionCoverageAfterPlan weighted with avgEvidenceConfidence), logs 'strategy.plan_produced', and ALWAYS delegates exactly once, unconditionally, to BEN-SUP-03 (the PLANNER_AGENT constant) with the plan as a constraint. PRESERVE all of this exactly: the dimension/source selection logic, the scoring formula, and the existing unconditional BEN-SUP-03 delegation must all keep firing on the happy path after this prompt -- do not regress any of it, only extend it.\n\nSTEP 2 -- READ src/lib/pil/agent-runner.ts in full: the real Agent/AgentContext/AgentResult/DelegationRequest interfaces this class implements. This class must read `export class ResearchStrategyArchitect implements Agent` -- never `extends BaseAgent`, which does not exist anywhere in this codebase. Also read src/lib/pil/agents/qlf/BEN-QLF-04.ts in full: the canonical ~290-line reference pattern every dense PIL agent implementation in this repo follows -- a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent (e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications). This delegations-array mechanism -- not any FORGE queue-chaining feature -- is what \"delegate to\" or \"chain into\" means anywhere below. Also confirm BEN-SUP-02 is still present under its existing key in src/lib/pil/agents/index.ts's AGENT_FACTORIES map (src/lib/pil/agents/index.ts) -- this prompt does not add a new registry entry, it only extends the existing implementation the map already points to.\n\nSTEP 3 -- EXTEND BEN-SUP-02 per its fuller spec (PIL_AGENT_COMPLETE_ROSTER.md section \"BEN-SUP-02 -- Research Strategy Architect\"; PIL_AGENT_DEPENDENCIES.yaml's BEN-SUP-02 entry). The richer spec has this agent produce a VERSIONED strategy with an explicit status lifecycle (DRAFT/VALIDATED/REVIEW_REQUIRED/APPROVED/PUBLISHED/SUPERSEDED/REJECTED) plus a StrategyCompletenessReport.v2 and FeasibilityAssessment.v2, and states explicitly that BEN-SUP-03 \"must map every strategy requirement to plan nodes ... with unmapped mandatory fields blocking plan activation\" -- i.e. this agent must stop handing BEN-SUP-03 a plan it already knows is infeasible. Concretely:\n(a) Extend the ResearchPlan interface with a `status: \"DRAFT\" | \"VALIDATED\" | \"REVIEW_REQUIRED\"` field (the narrower 3-value subset this agent can actually determine deterministically from its own data -- APPROVED/PUBLISHED/SUPERSEDED/REJECTED require human or downstream action this agent doesn't perform, so do not fabricate those transitions here).\n(b) Add a `completenessReport: { requiredDimensions: ResearchDimension[]; coveredDimensions: ResearchDimension[]; gaps: ResearchDimension[]; coveragePct: number }` field to ResearchPlan, computed from the existing requiredDimensions/covered/gaps values already in scope (coveragePct = requiredDimensions.length > 0 ? covered.size / requiredDimensions.length : 1).\n(c) Add feasibility detection: for each dimension in `gaps`, check whether SOURCE_TYPES_BY_ENTITY_TYPE (or DEFAULT_SOURCE_TYPES) for this entityType includes at least one source type that selectedSources actually covers; collect any gap dimension with zero coverable source into an `infeasibleDimensions: ResearchDimension[]` array. If infeasibleDimensions.length > 0, set status to \"REVIEW_REQUIRED\" and call createReviewItem() (review_type 'policy_exception', summary listing the infeasible dimensions and why -- no covering source type is active) instead of proceeding as if the plan were fully executable; otherwise set status to \"VALIDATED\".\n(d) Make the existing BEN-SUP-03 delegation CONDITIONAL on status === \"VALIDATED\" -- when status is \"REVIEW_REQUIRED\", do not delegate to BEN-SUP-03 this cycle (the human review item just created is the correct next step, not planning against an infeasible strategy); when status is \"VALIDATED\", delegate to BEN-SUP-03 exactly as today (regression-safe).\n\nSTEP 4 -- Recovery protocol (roster: invalid/incomplete objective, source unavailable, model schema failure). Add: (a) at the very top of execute(), if !context.goal || context.goal.trim().length === 0, return early using the same `completed(conclusions, reason)`-style pattern BEN-QLF-04 uses for its own early-return (status \"completed\", conclusions `{ skipped: true, reason }`, empty delegations) rather than proceeding to build a strategy for an empty objective; (b) if activeSources.length === 0 across the ENTIRE catalog (not just for one dimension -- i.e. listActiveSources() itself returned nothing usable), that is a source-unavailable recovery condition per the roster's table: escalate via createReviewItem() (review_type 'policy_exception', summary noting zero active sources) instead of silently producing a plan with sourceKeys: [] that BEN-SUP-03 would receive with no way to execute it.\n\nSTEP 5 -- Structured logging: extend the existing 'strategy.plan_produced' logAction call's after_state to include the new status/completenessReport/infeasibleDimensions fields so the audit trail reflects the richer decision, and add a distinct 'strategy.review_required' logAction call (before the createReviewItem() call in Step 3c) whenever status becomes REVIEW_REQUIRED, matching this file's existing logAction call shape exactly.\n\nTEST FILE -- src/__tests__/unit/pil-sup-agents.test.ts already covers BEN-SUP-02 in its `describe(\"BEN-SUP-02 Research Strategy Architect\", ...)` block (read it in full first and match its exact mocking pattern). Extend that describe block with: (1) an infeasible-dimension test forcing status REVIEW_REQUIRED, a createReviewItem() call, and NO BEN-SUP-03 delegation; (2) a regression test on the feasible path proving status VALIDATED and the existing unconditional-delegation-equivalent behavior (delegation still fires) are both preserved; (3) an empty-goal early-return test proving no plan/delegation is produced.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- pnpm run build is the only real gate this repo tier has beyond compile; the compile gate alone does not catch the build-time ESLint pass Next.js's next build enforces, which has broken production directly before).\n3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (extended precedence/delegation logic, new recovery handling, new structured logging, new review-item creation) is actually present in the code, not just that it compiles. Run pnpm run test:unit -- src/__tests__/unit/pil-sup-agents.test.ts and confirm the new and existing test cases in it all pass -- do not treat a green build as sufficient if this command was not actually run.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (BEN-SUP-02's spec-detail additions, confirmation it remains registered in src/lib/pil/agents/index.ts's AGENT_FACTORIES map under the same key, no new agent codes added) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action.\n\nDo NOT run npx vercel deploy or any production-deploy command, and do NOT curl any live/production URL -- deployment is a separate, explicitly human-reviewed step and out of scope for this queue.\n\nSEPARATE SCOPE BOUNDARY (not a deploy instruction): Do NOT touch src/lib/pil/agents/sup/BEN-SUP-07.ts or src/lib/pil/agents/sup/BEN-SUP-08.ts (Autonomy Governor Agent / Executive Intelligence Narrative Agent) -- those are task-added agents from a different initiative, outside this 47-agent PIL spec's Supervisory family entirely, and must not be modified or even referenced as part of this prompt's changes."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/sup/BEN-SUP-02.ts
    - src/__tests__/unit/pil-sup-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-sup-03-upgrade
  name: Upgrade BEN-SUP-03 Cross-Agent Research Planner to the fuller PIL spec
  prompt: "STEP 1 -- READ src/lib/pil/agents/sup/BEN-SUP-03.ts in full before writing anything.\n\nThis file already implements a real, working CrossAgentResearchPlanner: it defines a fixed 4-stage DAG (STAGES constant: stage 1 BEN-DIS-01, stage 2 BEN-INT-01+BEN-INT-08 in parallel, stage 3 BEN-REL-01, stage 4 BEN-QLF-04), loads this research run's pil_agent_runs rows, computes each stage's status via stageStatus()/statusOf() (most-recent-attempt-wins), and either replans the earliest failed stage (re-delegating only the failed agents) or dispatches the earliest ready stage whose dependency stage already completed, logging every decision via logAction(). PRESERVE all of this exactly: the 4-stage DAG, the failed-stage-replan-first priority, and the ready-stage dispatch logic must all keep working after this prompt -- do not regress any of it, only extend it.\n\nSTEP 2 -- READ src/lib/pil/agent-runner.ts in full: the real Agent/AgentContext/AgentResult/DelegationRequest interfaces this class implements. This class must read `export class CrossAgentResearchPlanner implements Agent` -- never `extends BaseAgent`, which does not exist anywhere in this codebase. Also read src/lib/pil/agents/qlf/BEN-QLF-04.ts in full: the canonical ~290-line reference pattern every dense PIL agent implementation in this repo follows -- a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient(), real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent (e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications). This delegations-array mechanism -- not any FORGE queue-chaining feature -- is what \"delegate to\" or \"chain into\" means anywhere below. Also confirm BEN-SUP-03 is still present under its existing key in src/lib/pil/agents/index.ts's AGENT_FACTORIES map (src/lib/pil/agents/index.ts) -- this prompt does not add a new registry entry, it only extends the existing implementation the map already points to.\n\nSTEP 3 -- EXTEND BEN-SUP-03 per its fuller spec (PIL_AGENT_COMPLETE_ROSTER.md section \"BEN-SUP-03 -- Cross-Agent Research Planner\"; PIL_AGENT_DEPENDENCIES.yaml's BEN-SUP-03 entry). The richer spec explicitly calls out preventing duplicate research (RedundancyDecision.v1), bounded budget reservation (BudgetReservationSet.v1), and routing child orphan/corruption to BEN-SUP-06 (\"SUP-06 invoked on child orphan/corruption pausing a join\"), plus capability-absence handling that routes back to BEN-SUP-02 rather than treating a missing specialist as an ordinary retryable failure. Concretely:\n(a) Redundancy / duplicate-research prevention: before pushing a delegation for any agent in a ready stage, check whether a COMPLETED pil_agent_runs row already exists for that agent_id + this run's prospect_id across ANY research run for this org (not just this research_run_id) within a recent window you define and document (e.g. the last 7 days -- reuse getPilClient() to query pil_agent_runs by organization_id + agent_id + a join through pil_research_runs.prospect_id, or, simpler and safer given the schema this file already reads, extend loadAgentRuns() to also accept an optional prospectId and query across all research runs for that prospect). If a completed run for that exact agent+prospect combo already exists, skip re-dispatching it: log 'planner.redundant_task_skipped' with the prior run's id instead of pushing a duplicate delegation, and treat that stage agent as already satisfied for stageStatus() purposes this cycle.\n(b) Orphaned/stuck join detection -> delegate to BEN-SUP-06: add an explicit staleness check -- if a stage's status is \"in_progress\" and the oldest of that stage's relevant pil_agent_runs rows has a started_at older than a documented threshold (e.g. 30 minutes -- pick and document a specific value) while still not completed/failed, treat this as an orphaned task per the roster's recovery table (\"orphaned task\" entry) and push a delegation to BEN-SUP-06 with objective describing the specific stalled stage/agent/research-run-id, instead of leaving the plan silently stuck in the existing 'await_dependencies' branch forever.\n(c) Capability-absent handling -> route back to BEN-SUP-02: when this planner loads a stage agent's pil_agent_runs row and its status is \"failed\" with an error string containing \"has no implementation yet\" (the exact NotImplementedAgent error text from src/lib/pil/agents/index.ts's fallback), treat this specifically as capability-absent rather than an ordinary retryable failure: do not add it to the normal failed-stage retry branch; instead push a delegation to BEN-SUP-02 with objective describing which capability is missing so the strategy can be revised around it, and log 'planner.capability_absent'.\n(d) Budget reservation conflict: before dispatching a ready stage, call getBudgetSummary() from src/lib/pil/cost.ts (the same helper BEN-SUP-04 already imports and uses -- read src/lib/pil/agents/sup/BEN-SUP-04.ts's isConstrained() helper for the exact pattern to reuse) for context.orgId; if the org-scoped budget is already at or over its alert_threshold_pct, skip dispatch this cycle (log 'planner.budget_reservation_conflict', push no new delegations) rather than overspending -- the existing failed-stage-replan branch is unaffected by this check (replanning does not open new spend where a stage hasn't already started).\n\nSTEP 4 -- Structured logging: every new branch above already specifies its own logAction call -- make sure each new action string ('planner.redundant_task_skipped', 'planner.capability_absent', 'planner.budget_reservation_conflict', plus a 'planner.orphan_detected' call in step 3b before the BEN-SUP-06 delegation is pushed) is logged via the exact same logAction() call shape this file already uses for 'planner.dispatch_stage' / 'planner.replan_failed_stage' / 'planner.await_dependencies'.\n\nTEST FILE -- NO existing test file covers BEN-SUP-03 today: src/__tests__/unit/pil-sup-agents.test.ts only has describe blocks for BEN-SUP-01, BEN-SUP-02, and BEN-SUP-04 (BEN-SUP-03 is referenced only as the expected delegation target inside the BEN-SUP-02 test, never tested directly -- verify this yourself by reading the file in full before writing tests). Add a NEW `describe(\"BEN-SUP-03 Cross-Agent Research Planner\", ...)` block to src/__tests__/unit/pil-sup-agents.test.ts, matching that file's existing mocking pattern exactly (you will need to add a vi.mock for @/lib/pil/cost's getBudgetSummary alongside the file's existing @/lib/pil/db mock -- follow the same vi.mock shape BEN-SUP-04's own test setup in this file already uses for that same import). Cover: (1) redundant-task-skip behavior across research runs for the same prospect; (2) orphan-detection delegating to BEN-SUP-06 with the stalled stage described in the objective; (3) capability-absent routing to BEN-SUP-02 when a stage agent's run failed with the NotImplementedAgent error text; (4) budget-reservation-conflict skipping dispatch; (5) a regression test confirming the original 4-stage happy-path dispatch and failed-stage-retry behavior (with no redundancy/orphan/capability/budget condition triggered) still works exactly as before.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- pnpm run build is the only real gate this repo tier has beyond compile; the compile gate alone does not catch the build-time ESLint pass Next.js's next build enforces, which has broken production directly before).\n3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (extended precedence/delegation logic, new recovery handling, new structured logging, new review-item creation) is actually present in the code, not just that it compiles. Run pnpm run test:unit -- src/__tests__/unit/pil-sup-agents.test.ts and confirm the new and existing test cases in it all pass -- do not treat a green build as sufficient if this command was not actually run.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (BEN-SUP-03's spec-detail additions, confirmation it remains registered in src/lib/pil/agents/index.ts's AGENT_FACTORIES map under the same key, no new agent codes added) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action.\n\nDo NOT run npx vercel deploy or any production-deploy command, and do NOT curl any live/production URL -- deployment is a separate, explicitly human-reviewed step and out of scope for this queue.\n\nSEPARATE SCOPE BOUNDARY (not a deploy instruction): Do NOT touch src/lib/pil/agents/sup/BEN-SUP-07.ts or src/lib/pil/agents/sup/BEN-SUP-08.ts (Autonomy Governor Agent / Executive Intelligence Narrative Agent) -- those are task-added agents from a different initiative, outside this 47-agent PIL spec's Supervisory family entirely, and must not be modified or even referenced as part of this prompt's changes."

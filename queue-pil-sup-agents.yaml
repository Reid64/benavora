ing key in src/lib/pil/agents/index.ts's AGENT_FACTORIES map (src/lib/pil/agents/index.ts) -- this prompt does not add a new registry entry, it only extends the existing implementation the map already points to.\n\nSTEP 3 -- EXTEND BEN-SUP-06 per its fuller spec (PIL_AGENT_COMPLETE_ROSTER.md section \"BEN-SUP-06 -- Research Recovery Investigator\"; PIL_AGENT_DEPENDENCIES.yaml's BEN-SUP-06 entry). This is the widest gap between current implementation and spec in the whole SUP family: the spec's 12 core recovery invariants (section 4) explicitly require \"contain first/preserve before mutation,\" \"the same plan cannot replay recursively,\" and \"cross-tenant triggers quarantine+security escalation\" -- none of which the current 2-bucket keyword classifier implements. Concretely:\n(a) Preservation before mutation (contain first, durable stores outrank logs): as the VERY FIRST action inside execute(), before any of the existing classification/spawn/delegate logic runs, add a logAction() call (action 'recovery.preservation_snapshot', resource_id: failedRunId, after_state containing the exact failedRun row and failingAgentRun row as loaded) so a durable, unmutated snapshot of the pre-recovery state is captured before this agent does anything that could change state.\n(b) Idempotency guard against recursive replay (\"the same plan cannot replay recursively\"; roster's own meta-recovery item \"reproduced faults -> stop repetition, reopen causal analysis\"): before calling spawnRecoveryRun() in the transient branch, query pil_research_runs for any existing row whose structured_plan.recovery_of === failedRunId (reuse getPilClient() the same way this file's other private methods already do). If one already exists, this failure has already been through recovery once and failed again -- do NOT spawn a second recovery run; instead route to the existing escalate() helper with a plan whose action is \"escalate\" and whose detail explicitly notes the repeated-failure pattern and th
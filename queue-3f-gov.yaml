  - id: gov-001
    phase: build
    description: "Create all governance database tables in a single migration"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md sections 8A through 8H completely.

      Create C:\Users\manag\Documents\benavora\supabase\migrations\052_governance_layer.sql:

      -- Funder relationship memory
      CREATE TABLE IF NOT EXISTS funder_relationships (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id),
        funder_id uuid NOT NULL REFERENCES funders(id),
        relationship_status text DEFAULT 'prospect',
        last_submission_at timestamptz,
        last_response_at timestamptz,
        total_submissions integer DEFAULT 0,
        total_funded numeric(12,2) DEFAULT 0,
        preferred_channel text,
        preferred_request_type text,
        do_not_contact_until timestamptz,
        contact_notes text,
        board_meeting_months integer[],
        fiscal_year_end_month integer,
        response_time_avg_days integer,
        funder_preferences jsonb DEFAULT '{}',
        disallowed_request_types text[],
        max_ask_amount numeric(12,2),
        relationship_score numeric(3,1),
        created_at timestamptz DEFAULT NOW(),
        updated_at timestamptz DEFAULT NOW(),
        UNIQUE(organization_id, funder_id)
      );

      -- Queue control plane
      CREATE TABLE IF NOT EXISTS queue_controls (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        control_type text NOT NULL,
        target_id text,
        paused boolean NOT NULL DEFAULT false,
        paused_by text,
        paused_at timestamptz,
        reason text,
        created_at timestamptz DEFAULT NOW()
      );

      -- Usage metering
      CREATE TABLE IF NOT EXISTS submission_usage (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id),
        period_start timestamptz NOT NULL,
        period_end timestamptz NOT NULL,
        automated_count integer DEFAULT 0,
        email_count integer DEFAULT 0,
        manual_count integer DEFAULT 0,
        overage_automated integer DEFAULT 0,
        overage_email integer DEFAULT 0,
        overage_cost numeric(10,2) DEFAULT 0,
        api_cost_claude numeric(10,2) DEFAULT 0,
        api_cost_openai numeric(10,2) DEFAULT 0,
        proxy_cost numeric(10,2) DEFAULT 0,
        captcha_cost numeric(10,2) DEFAULT 0,
        using_own_keys boolean DEFAULT false,
        created_at timestamptz DEFAULT NOW()
      );

      -- Tier limits
      CREATE TABLE IF NOT EXISTS tier_limits (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        tier_name text NOT NULL UNIQUE,
        monthly_automated integer NOT NULL,
        monthly_email integer NOT NULL,
        monthly_manual integer NOT NULL,
        daily_max integer NOT NULL,
        overage_rate_automated numeric(6,2) NOT NULL,
        overage_rate_email numeric(6,2) NOT NULL,
        allow_own_keys boolean NOT NULL DEFAULT false
      );

      INSERT INTO tier_limits (tier_name, monthly_automated, monthly_email, monthly_manual, daily_max, overage_rate_automated, overage_rate_email, allow_own_keys) VALUES
        ('starter', 50, 20, 10, 5, 2.99, 0.99, false),
        ('professional', 200, 100, 50, 15, 1.99, 0.79, false),
        ('enterprise', 1000, 500, -1, 50, 0.99, 0.49, true),
        ('consultant', -1, -1, -1, 20, 0.99, 0.49, true)
      ON CONFLICT (tier_name) DO NOTHING;

      -- Add automation level to funders
      ALTER TABLE funders ADD COLUMN IF NOT EXISTS automation_level text DEFAULT 'assisted';
      ALTER TABLE funders ADD COLUMN IF NOT EXISTS automation_notes text;

      -- Add automation mode to submission queue
      ALTER TABLE submission_queue ADD COLUMN IF NOT EXISTS automation_mode text DEFAULT 'auto';
      ALTER TABLE submission_queue ADD COLUMN IF NOT EXISTS risk_score integer;
      ALTER TABLE submission_queue ADD COLUMN IF NOT EXISTS risk_factors jsonb;

      -- Indexes
      CREATE INDEX IF NOT EXISTS idx_funder_relationships_org ON funder_relationships(organization_id, funder_id);
      CREATE INDEX IF NOT EXISTS idx_queue_controls_active ON queue_controls(control_type, paused) WHERE paused = true;
      CREATE INDEX IF NOT EXISTS idx_submission_usage_org ON submission_usage(organization_id, period_start);

      NOTE: Migration 052 must be applied manually via Supabase SQL Editor.
    expected_outputs:
      - supabase/migrations/052_governance_layer.sql
    gates:
      - type: file_exists
        files: [supabase/migrations/052_governance_layer.sql]
    max_retries: 3
    on_fail: halt

  - id: gov-002
    phase: build
    description: "Create Submission Risk Engine"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 8A (Submission Risk Engine).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\risk-engine.ts:

      Export async function assessSubmissionRisk(params: {
        funder: { id: string, name: string, automation_level?: string, giving_portal_url?: string },
        requestProfile?: { request_type: string, min_value?: number, max_value?: number },
        formTemplate?: { field_count?: number, has_file_uploads?: boolean },
        orgReadiness?: { ready: boolean, missing_required: string[] },
        crossClientBlocked?: boolean,
        supabase: any
      }): Promise<RiskAssessment>

      Risk scoring (additive):
      - Portal has automation_level = 'manual_only': +40, auto-route to manual
      - CAPTCHA detected in template: +10
      - Login/account required: +15
      - File uploads required but org docs missing: +25
      - Ask amount exceeds funder historical max by >50%: +15 (query funder_relationships or giving history)
      - First submission to this funder (no relationship record): +10
      - Low form template confidence (field_count < 3): +20
      - Cross-client collision detected: +15
      - Legal attestation or certification checkbox in form: +30
      - Org not ready (missing required KB or docs): +25

      Classification:
      - 0-25: LOW — auto-submit
      - 26-50: MEDIUM — auto-submit with enhanced logging
      - 51-75: HIGH — route to manual queue
      - 76-100: CRITICAL — route to manual queue + notify admin

      Return: { score, classification: 'low'|'medium'|'high'|'critical', factors: { name, points, description }[], recommendation: 'auto'|'assisted'|'manual', shouldNotify: boolean }

      Define interface RiskAssessment.

      Integrate into C:\Users\manag\Documents\benavora\worker\queue-processor.ts:
      - Call assessSubmissionRisk BEFORE launching browser.
      - If recommendation is 'manual': update queue item automation_mode = 'manual', status = 'pending_manual', store risk_score and risk_factors. Do not process — skip to next item.
      - If recommendation is 'assisted': process normally but log at enhanced level.
      - If shouldNotify: call webhook notifier with 'review_needed' event.
    expected_outputs:
      - src/lib/autoapply/risk-engine.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: gov-003

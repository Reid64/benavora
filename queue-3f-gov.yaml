  - id: gov-005
    phase: build
    description: "Create Document Compliance Matrix and Funder Relationship Memory"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md sections 8D and 8E.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\document-compliance.ts:

      Define COMPLIANCE_MATRIX constant — for each request_type, specify required and recommended documents with freshness rules (days):
      - monetary: required [501c3_letter, form_990], recommended [board_list, project_budget, financial_statements], freshness { form_990: 365, financial_statements: 365, board_list: 180 }
      - land: required [501c3_letter, form_990, project_budget], recommended [insurance_certificate], freshness { form_990: 365 }
      - in_kind: required [501c3_letter], recommended [form_990], freshness { form_990: 365 }
      - volunteer: required [501c3_letter], recommended [], freshness {}
      - service: required [501c3_letter], recommended [form_990], freshness { form_990: 365 }
      - partnership: required [501c3_letter], recommended [annual_report], freshness {}
      - sponsorship: required [501c3_letter], recommended [annual_report], freshness {}
      - facility: required [501c3_letter, insurance_certificate], recommended [form_990], freshness { insurance_certificate: 365 }

      Export function checkDocumentCompliance(requestType: string, orgDocuments: OrgDocument[]): ComplianceResult
      - Check required docs exist and are current (is_current = true).
      - Check freshness: if doc was uploaded more than {freshness days} ago, flag as stale.
      - Verify doc.organization_id matches (prevent cross-tenant).
      - Return: { compliant, missing_required, stale_documents, warnings }

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\relationship-manager.ts:

      Export class RelationshipManager:
      - async getOrCreateRelationship(orgId, funderId, supabase): upsert into funder_relationships, return record.
      - async recordSubmission(orgId, funderId, submissionData, supabase): increment total_submissions, update last_submission_at.
      - async recordResponse(orgId, funderId, responseData, supabase): update last_response_at, update response_time_avg_days.
      - async recordAward(orgId, funderId, amount, supabase): increment total_funded, update relationship_status to 'funded'.
      - async checkContactRules(orgId, funderId, supabase): check do_not_contact_until, disallowed_request_types. Return { canContact, reason? }.
      - async getRelationshipSummary(orgId, funderId, supabase): return full relationship data for display.

      Integrate into queue-processor: before processing, call checkContactRules. After submission, call recordSubmission.
    expected_outputs:

  - id: gov-006
    phase: build
    description: "Create Queue Control Plane with pause/resume/kill switch"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 8F (Queue Control Plane).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\queue-controls.ts:

      Export class QueueControlPlane:

      async pauseTenant(orgId: string, reason: string, pausedBy: string, supabase: any): Promise<void>
      - Upsert into queue_controls: control_type='tenant', target_id=orgId, paused=true.

      async resumeTenant(orgId: string, supabase: any): Promise<void>
      - Update paused=false.

      async pauseFunder(funderId: string, reason: string, supabase: any): Promise<void>
      - Upsert: control_type='funder', target_id=funderId, paused=true.

      async pauseDomain(domain: string, reason: string, supabase: any): Promise<void>
      - Upsert: control_type='domain', target_id=domain, paused=true.

      async pausePlatform(reason: string, pausedBy: string, supabase: any): Promise<void>
      - EMERGENCY KILL SWITCH. Upsert: control_type='platform', target_id='global', paused=true.
      - Log at ERROR level: "PLATFORM PAUSED by {pausedBy}: {reason}"

      async resumePlatform(supabase: any): Promise<void>

      async isBlocked(params: { orgId?, funderId?, portalUrl?, supabase }): Promise<{ blocked: boolean, reason?: string, controlType?: string }>
      - Check all control levels in order: platform → domain → funder → tenant.
      - Return first block found.

      async getStatus(supabase: any): Promise<ControlStatus[]>
      - Return all active (paused=true) controls.

      Integrate into queue-processor: call isBlocked before processing each item. If blocked, skip with reason.

      Create C:\Users\manag\Documents\benavora\src\app\api\autoapply\controls\route.ts:
      GET: return all control states.
      POST: apply a control (pause tenant/funder/domain/platform).
      DELETE: remove a control (resume).
      Require admin role for platform-level controls.

      Create C:\Users\manag\Documents\benavora\src\app\(dashboard)\autoapply\controls\page.tsx:
      Admin page with:
      - Platform kill switch (big red button, requires confirmation dialog).
      - Active pauses table: control type, target, reason, paused_by, paused_at, resume button.
      - "Pause Tenant" form (select org from dropdown).
      - "Pause Funder" form (search funder by name).
      - "Pause Domain" form (text input for domain).

      Use Tailwind CSS matching existing dashboard styling.
    expected_outputs:
      - src/lib/autoapply/queue-controls.ts
      - src/app/api/autoapply/controls/route.ts
      - src/app/(dashboard)/autoapply/controls/page.tsx
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

  - id: gov-007
    phase: build
    description: "Create Usage Meter with tier enforcement and API key handoff"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 8G (Usage Metering).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\usage-meter.ts:

      Export class UsageMeter:

      async checkAllowance(orgId: string, submissionType: 'automated' | 'email' | 'manual', supabase: any): Promise<{
        allowed: boolean,
        remaining: number,
        atLimit: boolean,
        overageEnabled: boolean,
        dailyCount: number,
        dailyLimit: number,
        monthlyCount: number,
        monthlyLimit: number
      }>
      Steps:
      1. Get org's tier from organizations.subscription_tier.
      2. Get tier limits from tier_limits table.
      3. Get or create current period usage from submission_usage (period = current month).
      4. Check monthly: if count >= limit (and limit != -1): check if org has overages enabled in billing settings.
      5. Check daily: query autoapply_submissions WHERE submitted_at > start of today. If >= daily_max: block regardless of overages.
      6. Return status.

      async recordUsage(orgId: string, submissionType: string, costs: { claude?: number, openai?: number, proxy?: number, captcha?: number }, supabase: any): Promise<void>
      - Increment the appropriate count in submission_usage.
      - If over monthly limit, increment overage count and calculate overage cost.
      - Add costs to the running totals.

      async getUsageReport(orgId: string, periodStart?: Date, supabase: any): Promise<UsageReport>
      - Return full usage report: counts, costs, limits, overages, trends.

      async shouldUseOwnKeys(orgId: string, supabase: any): Promise<{ useOwn: boolean, anthropicKey?: string, openaiKey?: string }>
      - Check if org's tier allows own keys (tier_limits.allow_own_keys).
      - Check if org has stored API keys (in encrypted org settings).
      - Return whether to use their keys and the decrypted values.

      Create C:\Users\manag\Documents\benavora\src\app\api\autoapply\usage\route.ts:
      GET: return usage report for current org and period.

      Integrate into queue-processor:
      - Before processing: call checkAllowance. If not allowed, skip with 'usage_limit_reached'.
      - After processing: call recordUsage with actual costs.
      - Before AI calls: call shouldUseOwnKeys to determine which API keys to use.
    expected_outputs:
      - src/lib/autoapply/usage-meter.ts
      - src/app/api/autoapply/usage/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


      Create scripts\verify\verify-pi01-010.mjs: exits 0 only if the file
      contains ten contracts with all 24 fields, the INT-08 four-way
      distinction, and the INT-09 three labels.
      Run: node scripts/verify/verify-pi01-010.mjs
    expected_outputs:
      - docs/architecture/contracts/FAMILY-3-INTELLIGENCE.md

project: prospect-intel
github_repo: Reid64/prospect-intel

governance:
  - DECISION_LOG.md
  - STANDING_DIRECTIVES.md
  - SESSION_STATE.md
  - STATE_OF_THE_BUILD.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

# ============================================================
# PI-01: ARCHITECTURE DOCUMENT GENERATION
#
# Produces the documentary subset of EAPIL Section 21's 45
# deliverables. These documents are the CONTRACT the entire
# implementation (pi-10 onward) is built against, and the pack
# Reid approves at the pi-02 hard gate.
#
# SOURCE AUTHORITY ORDER for every prompt in this queue:
#   1. docs/EAPIL_DIRECTIVE.md        (the governing directive)
#   2. DECISION_LOG.md                (8 binding decisions + D-009)
#   3. docs/EAPIL_DISSECTION_MEMO.md  (approved strategy)
# Where these conflict, higher authority wins and the conflict is
# recorded in ARCHITECTURE_OPEN_QUESTIONS.md rather than silently
# resolved.
#
# WRITING STANDARD: implementation-ready, not conceptual. Every
# schema gets column-level DDL-style definitions. Every contract
# gets machine-checkable fields. A developer (or FORGE queue) must
# be able to build from these documents without re-deriving intent.
# ASCII only. All docs live in docs/architecture/.
# ============================================================

prompts:

  - id: pi01-001
    phase: build
    description: "Preflight: source docs verified readable, architecture index and open-questions ledger created"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Read in full, confirming each exists and is non-empty:
         docs/EAPIL_DIRECTIVE.md, DECISION_LOG.md,
         docs/EAPIL_DISSECTION_MEMO.md, STANDING_DIRECTIVES.md.
         If EAPIL_DIRECTIVE.md is a placeholder (pi00-009 flagged case),
         HALT: write docs/architecture/DIRECTIVE-MISSING.md and exit the
         verify script with 1 - the directive is the root authority and
         nothing may be generated without it.

      2. Create docs\architecture\ARCHITECTURE_INDEX.md: the full inventory
         of documents this queue will produce (list every file named in
         prompts 002-017 below), each with: owner queue prompt id, its EAPIL
         Section 21 deliverable numbers, and its downstream consumer queues
         (pi-10..pi-70 per the library manifest). Include the authority-order
         rule verbatim from this queue's header.

      3. Create docs\architecture\ARCHITECTURE_OPEN_QUESTIONS.md: empty
         ledger with columns ID | Raised by | Question | Options |
         Recommendation | Status(OPEN/ANSWERED). Every prompt in this queue
         appends here instead of guessing whenever the directive is silent
         or ambiguous on a real design point. This ledger is a primary input
         to the pi-02 review pack.

      4. Create scripts\verify\verify-pi01-001.mjs: exits 0 only if the
         directive file exists, is over 2000 lines or 80KB (a placeholder
         fails), and both new architecture files exist with required
         headings.

      5. Run: node scripts/verify/verify-pi01-001.mjs
    expected_outputs:
      - docs/architecture/ARCHITECTURE_INDEX.md
      - docs/architecture/ARCHITECTURE_OPEN_QUESTIONS.md
      - scripts/verify/verify-pi01-001.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-001.mjs"
    max_retries: 2
    on_fail: halt

  - id: pi01-002
    phase: build
    description: "BLUEPRINT.md - system architecture"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.
      Read the source authorities per the queue header before writing.

      Write docs\architecture\BLUEPRINT.md covering, at implementation depth:

      1. System overview: the operating model loop (DISCOVER through REPLAN,
         verbatim from the directive) mapped onto concrete components.
      2. Package architecture: the nine workspace members from pi-00, each
         with its responsibility, its public surface, and its allowed
         dependencies (mirror the enforced graph from pi00-003; state the
         adapters/benavora contracts-only rule as load-bearing).
      3. Runtime topology: Railway worker pool (durable executors), Vercel
         (console + API edge), Supabase (single Postgres for relational,
         graph, vector, workflow state, ledgers), and the reasoning for
         one-database-many-schemas per D-003/D-004.
      4. The kernel-and-contracts pattern: one agent runtime, 44 behavioral
         contracts as data; why this satisfies the directive's normative
         agent definition; the exact loop stages the kernel implements and
         which are durable checkpoints.
      5. Data flow narratives for three end-to-end scenarios, each traced
         component by component with the tables touched: (a) NL objective to
         qualified prospect with warm path; (b) the septic-installer style
         universal target-profile run; (c) a monitoring trigger (foundation
         filing) reopening a prospect.
      6. Tenancy model: org_id + RLS everywhere, tenant 1 = Faith Foundation,
         cross-tenant data strictly prohibited except explicitly-designed
         anonymized learning aggregates (mark as Phase 6+ decision, log an
         open question).
      7. Failure domains and blast-radius table: what breaks when Postgres,
         the worker pool, the model gateway, or a connector is down, and the
         designed degradation for each.

      Create scripts\verify\verify-pi01-002.mjs: exits 0 only if BLUEPRINT.md
      exists, exceeds 400 lines, and contains all seven numbered section
      headings plus the three scenario traces.
      Run: node scripts/verify/verify-pi01-002.mjs
    expected_outputs:
      - docs/architecture/BLUEPRINT.md
      - scripts/verify/verify-pi01-002.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-002.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-003
    phase: build
    description: "SCHEMA_REGISTRY part 1: tenancy, identity, RBAC, structural entity archetypes, target profiles"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\SCHEMA_REGISTRY.md (part 1 of 4; later prompts
      append). Standard for every table in this registry: full column list
      with types, nullability, defaults, PK/FK/unique constraints, indexes
      with their justifying query, RLS policy description, and a one-line
      purpose. DDL-style blocks, ready to become migrations in pi-10.

      Sections this prompt writes:

      1. Conventions: schema pi for everything; uuid PKs via gen_random_uuid;
         created_at/updated_at on every table; org_id NOT NULL + RLS on every
         tenant-scoped table; soft-delete policy (state it: deleted_at, no
         hard deletes on evidence-bearing tables ever).
      2. Tenancy + identity: organizations, users, memberships (role enum:
         owner/admin/analyst/viewer), api_keys (hashed), tenant_settings.
      3. RBAC/ABAC: role_permissions, data_class_grants (the mechanism by
         which policy allows/prohibits data classes per tenant per agent -
         this table is what the policy engine reads).
      4. STRUCTURAL ENTITY ARCHETYPES per D-008 - exactly five entity
         tables sharing a common core (entity_id, org_id... plus canonical
         name, resolution_status, twin_state jsonb, research_gap summary):
         entities_person (employment-history-bearing fields),
         entities_organization (NAICS/type/size/geography fields),
         entities_foundation (assets, filing linkage, giving-program fields),
         entities_government (jurisdiction/program fields),
         entities_program_opportunity (funding program/opportunity fields).
         Plus entity_external_ids (source system, external id, confidence)
         for cross-source identity anchoring.
      5. TARGET PROFILES per D-008: target_profiles (org-scoped, name,
         description, archetype, taxonomy_codes text[], geography jsonb
         with radius support, size_filters jsonb, required_evidence jsonb,
         affinity_criteria jsonb, engaged_agent_families text[],
         schedule jsonb for continuous monitoring, created_by, version);
         target_profile_runs linking profiles to goals. State explicitly:
         a new prospect type is a new row here, never new code.
      6. Cause/geo taxonomies: taxonomy_nodes (kind: naics/cause/civic,
         code, label, parent_id) - shared, not org-scoped; seeded in pi-10.

      Create scripts\verify\verify-pi01-003.mjs: exits 0 only if the file
      exists containing all five entity archetype tables, target_profiles
      with the schedule column, and RLS notation on every org-scoped table
      in this part (scan for tables lacking an RLS line).
      Run: node scripts/verify/verify-pi01-003.mjs
    expected_outputs:
      - docs/architecture/SCHEMA_REGISTRY.md
      - scripts/verify/verify-pi01-003.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-003.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-004
    phase: build
    description: "SCHEMA_REGISTRY part 2: goals, delegation, runs, durable workflow tables"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.
      Append to docs\architecture\SCHEMA_REGISTRY.md (same standard):

      1. goals: the 22-state lifecycle enum verbatim from the directive
         (PROPOSED..REOPENED), org_id, objective text, structured_plan jsonb
         (the NL-compiler output shape, cross-referenced to API_CONTRACTS),
         owner_agent, budgets (token/tool/financial as separate numeric
         columns plus consumed counterparts), confidence_threshold,
         freshness_requirement, parent_goal_id, state transition audit via
         goal_transitions (goal_id, from_state, to_state, actor, reason,
         at) - every transition writes a row, no exceptions.
      2. delegated_tasks: ALL sixteen DelegatedTask fields from the
         directive verbatim (task_id..max_autonomy) as columns with types,
         plus state, claimed_by, lease_expires_at, heartbeat_at, attempt,
         max_attempts, result jsonb, error jsonb. Constraint notes encoding
         the delegation rules: child authority never exceeds parent
         (enforced in kernel + CHECK where expressible), bounded depth
         (depth column + CHECK), cancellation cascade semantics.
      3. agent_runs: one row per kernel loop execution - agent_id, goal_id,
         task_id, loop_iterations, tools_invoked jsonb, tokens_in/out,
         cost_usd, evidence_claim_ids uuid[], outcome enum, started/ended.
      4. Durable workflow infrastructure per D-004: outbox (aggregate_id,
         event_type, payload, published_at nullable), events (append-only
         bus with consumer offsets table), dead_letters (source table, ref,
         error, attempts, parked_at, resolution), idempotency_keys (key,
         scope, first_seen, result_hash), compensations (task_id, action,
         state).
      5. Lease/claiming semantics documented as a protocol: claim query
         (FOR UPDATE SKIP LOCKED), heartbeat cadence, expiry reclaim,
         effectively-once guarantees and their limits - written precisely
         enough that pi-12 implements without interpretation.

      Create scripts\verify\verify-pi01-004.mjs: exits 0 only if the file
      now contains the 22 goal states, all 16 DelegatedTask field names,
      and the five workflow tables.
      Run: node scripts/verify/verify-pi01-004.mjs
    expected_outputs:
      - docs/architecture/SCHEMA_REGISTRY.md
      - scripts/verify/verify-pi01-004.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-004.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-005
    phase: build
    description: "SCHEMA_REGISTRY part 3: evidence/provenance, audit, cost, snapshots"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.
      Append to docs\architecture\SCHEMA_REGISTRY.md:

      1. claims: ALL 21 evidence fields from the directive verbatim
         (claim_id..lineage) with types; verification_status enum with the 8
         statuses verbatim (VERIFIED_FACT..STALE); inference_status;
         contradiction linkage (contradicts_claim_id, superseded_by_claim_id);
         entity_id FK polymorphic pattern documented (archetype + id).
         Append-only: corrections are new claims superseding old ones,
         never UPDATEs to claim content - state this as a hard invariant
         with the audit reasoning.
      2. sources: registry of source instances (source_type, publisher,
         url pattern, tier, permissibility_class FK to policy tables,
         reliability_score maintained by BEN-OPS-01).
      3. source_snapshots: content-addressed capture (sha256, storage ref,
         retrieved_at, http metadata) so every claim's evidence_excerpt is
         reconstructable against the exact bytes retrieved.
      4. audit_log: append-only, every consequential system action (actor:
         agent or human, action, object refs, before/after refs where
         applicable, at); partitioning note for scale.
      5. cost_ledger per D-005: every model call and metered tool call -
         agent_id, tenant org_id, goal_id, task_id, provider, model, class
         (haiku/sonnet/frontier), tokens_in/out, unit_cost, cost_usd,
         at; materialized rollup views per tenant/day and per agent/day
         (the BEN-OPS-01 and budget-enforcement read paths).

      Create scripts\verify\verify-pi01-005.mjs: exits 0 only if the file
      now contains all 21 claim field names, all 8 verification statuses,
      the append-only invariant statement, and the cost_ledger with class
      column.
      Run: node scripts/verify/verify-pi01-005.mjs
    expected_outputs:
      - docs/architecture/SCHEMA_REGISTRY.md
      - scripts/verify/verify-pi01-005.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-005.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-006
    phase: build
    description: "SCHEMA_REGISTRY part 4: knowledge graph, vector retrieval, consolidated cross-check"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.
      Append to docs\architecture\SCHEMA_REGISTRY.md:

      1. graph_nodes: node_id, org_id, archetype + entity ref, labels,
         properties jsonb; graph_edges: edge_id, org_id, from/to node,
         edge_type (typed enum seed list: OWNS, EMPLOYED_BY, BOARD_MEMBER_OF,
         TRUSTEE_OF, DONATED_TO, GRANTED_TO, FOUNDED, ALUMNI_OF, MEMBER_OF,
         LOCATED_IN, CONNECTED_TO - extensible via taxonomy, log the
         governance of adding edge types as an open question if unclear),
         strength, confidence, valid_from, valid_to, superseded_by_edge_id,
         supporting_claim_ids uuid[] NOT NULL (the no-unevidenced-edges
         invariant: an edge without claims cannot exist - CHECK cardinality),
         contradiction_status.
      2. Multi-hop query layer spec per D-003: the recursive CTE pattern with
         hop limit, org_id isolation inside the recursion (state why it must
         be inside), cycle prevention, strength/confidence aggregation along
         paths, and the pathfinding result shape (hops, per-hop evidence,
         composite confidence, friction estimate) consumed by BEN-REL-05.
      3. Vector layer: embeddings table (object_type, object_id, model,
         dims, embedding vector, content_hash) with pgvector index notes;
         which objects get embedded at launch (claims evidence_excerpts,
         entity twin summaries, target profile descriptions) and the
         re-embedding trigger policy.
      4. CONSOLIDATED CROSS-CHECK section closing the registry: full table
         inventory with counts by area; every FK verified to reference a
         defined table (list any dangling refs found and fix them in place);
         every enum defined exactly once; a Mermaid ERD of the core
         relationships; total table count stated.

      Create scripts\verify\verify-pi01-006.mjs: exits 0 only if the file
      contains graph_edges with supporting_claim_ids, the recursive CTE
      section, the cross-check inventory with a stated total table count,
      and zero occurrences of the string TODO or TBD in the whole registry.
      Run: node scripts/verify/verify-pi01-006.mjs
    expected_outputs:
      - docs/architecture/SCHEMA_REGISTRY.md
      - scripts/verify/verify-pi01-006.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-006.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-007
    phase: build
    description: "AGENT_CONTRACT_SPEC.md - the behavioral contract schema and kernel interface"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\AGENT_CONTRACT_SPEC.md:

      1. The BehavioralContract type, field by field, covering EVERY item the
         directive's Section 2 requires (unique id, name, family, mission,
         objective type, inputs, outputs, permitted tools, permitted data
         sources, restricted data classes, planning behavior, observation
         behavior, replanning behavior, delegation permissions, default
         autonomy, human boundary, evidence requirements, confidence
         requirements, success criteria, failure criteria, escalation
         conditions, memory scope, cost/tool budget, execution cadence,
         evaluation suite ref) - each field with its TypeScript type, its
         zod refinement rules, and which kernel loop stage consumes it.
      2. The kernel-contract interface: exactly which contract fields the
         kernel reads at each loop stage (goal intake, observe, plan, tool
         select, execute, collect evidence, evaluate, replan, escalate/stop),
         and the invariant that a contract can never grant what policy
         denies (policy engine is the ceiling; contract is a further
         restriction only).
      3. Autonomy encoding: A0-A4 + H1/H2 as contract fields with the
         enforcement point for each (which component refuses what, where);
         the never-self-escalate rule as a kernel invariant with its audit
         trail.
      4. Prompt architecture per contract: system prompt template structure,
         versioning (prompts are versioned artifacts in the repo, referenced
         by hash in agent_runs), and the variable-injection contract.
      5. Contract file format and location: packages/contracts/src/agents/
         <family>/<id>.ts, one file per agent, exporting a typed constant;
         registry index asserting uniqueness of ids at build time.
      6. A COMPLETE WORKED EXAMPLE: BEN-DIS-03 Foundation Discovery Agent
         written in full against this spec (every field populated with real
         values derived from the directive's registry entry) - this example
         is the template prompts 008-013 replicate 43 more times.

      Create scripts\verify\verify-pi01-007.mjs: exits 0 only if the file
      contains all 24 contract field definitions, the worked BEN-DIS-03
      example, and the policy-ceiling invariant statement.
      Run: node scripts/verify/verify-pi01-007.mjs
    expected_outputs:
      - docs/architecture/AGENT_CONTRACT_SPEC.md
      - scripts/verify/verify-pi01-007.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-007.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-008
    phase: build
    description: "Behavioral contracts: Family 1 SUPERVISORY - BEN-SUP-01 through BEN-SUP-06"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\contracts\FAMILY-1-SUPERVISORY.md containing
      the complete behavioral contracts for BEN-SUP-01 (Chief Prospect
      Intelligence Orchestrator), BEN-SUP-02 (Research Strategy Architect),
      BEN-SUP-03 (Cross-Agent Research Planner), BEN-SUP-04 (Research
      Portfolio Allocator), BEN-SUP-05 (Prospect Research Critic and
      Red-Team), BEN-SUP-06 (Research Recovery Investigator).

      Rules for this and every contract prompt:
      - Every contract populates ALL 24 fields from AGENT_CONTRACT_SPEC.md,
        at the depth of the BEN-DIS-03 worked example - no field skipped,
        no "see directive" shortcuts.
      - Missions, responsibilities, autonomy defaults, human boundaries, and
        cadences come from the directive's registry entries verbatim where
        given; where the directive gives responsibilities but the spec needs
        structure (inputs/outputs/tools/evidence requirements), derive them
        faithfully and mark derived fields with [DERIVED].
      - Model class per D-005: SUP-01/02/03/05 frontier; SUP-04/06 sonnet
        unless a reasoned exception is recorded.
      - SUP-05 additionally gets its blocking-review protocol: the exact
        conditions that route a conclusion to the critic (consequential
        classes enumerated), the six verdicts verbatim (PASS..BLOCK_POLICY),
        separate-context guarantee (no shared memory scope with the
        producing agent), and the cannot-certify-own-work invariant.
      - SUP-04 additionally gets the marginal-value model: the inputs to its
        allocation reasoning (research state, evidence sufficiency, cost
        ledger, profile priorities) and its authority limits.
      - Each contract ends with an evaluation-suite sketch: 3-5 named golden
        cases with pass criteria (full suites are pi-60 work; the sketch
        binds intent now).

      Create scripts\verify\verify-pi01-008.mjs: exits 0 only if the file
      contains six contracts each containing all 24 field headings, the six
      SUP-05 verdicts, and at least three evaluation cases per contract.
      Run: node scripts/verify/verify-pi01-008.mjs
    expected_outputs:
      - docs/architecture/contracts/FAMILY-1-SUPERVISORY.md
      - scripts/verify/verify-pi01-008.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-008.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-009
    phase: build
    description: "Behavioral contracts: Family 2 DISCOVERY - BEN-DIS-01 through BEN-DIS-08"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\contracts\FAMILY-2-DISCOVERY.md: complete
      contracts for BEN-DIS-01 (Individual Prospect Discovery), BEN-DIS-02
      (Major Donor Discovery), BEN-DIS-03 (Foundation Discovery - lift the
      worked example from AGENT_CONTRACT_SPEC.md as the canonical copy and
      note the spec example now references here), BEN-DIS-04 (Corporate
      Giving Discovery), BEN-DIS-05 (Executive Prospect Discovery),
      BEN-DIS-06 (Geographic Funding Discovery), BEN-DIS-07 (Cause-Aligned
      Prospect Discovery), BEN-DIS-08 (Hidden Prospect and CRM Rediscovery).

      Same rules as pi01-008, plus family-specific requirements:
      - Every discovery contract's inputs include target_profiles (D-008
        universal model): the contract must state how it interprets a
        profile's archetype, taxonomy codes, geography, and filters - the
        septic-installer class of run flows through DIS-06/DIS-04 via
        profiles, and the contracts must make that concrete.
      - BEN-DIS-02 carries the directive's rule verbatim: wealth alone does
        not establish donor propensity.
      - BEN-DIS-08's human boundary verbatim: no automatic solicitation
        escalation.
      - Outputs are ranked candidates with preliminary evidence refs
        (claim_ids) and research justification - never bare name lists.
      - Model class: sonnet for all eight; extraction sub-steps route haiku
        via the model gateway (state this in permitted tools).

      Create scripts\verify\verify-pi01-009.mjs: exits 0 only if the file
      contains eight contracts with all 24 fields each, the DIS-02 propensity
      rule, and target_profiles named in every contract's inputs.
      Run: node scripts/verify/verify-pi01-009.mjs
    expected_outputs:
      - docs/architecture/contracts/FAMILY-2-DISCOVERY.md
      - scripts/verify/verify-pi01-009.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi01-009.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi01-010
    phase: build
    description: "Behavioral contracts: Family 3 CORE INTELLIGENCE - BEN-INT-01 through BEN-INT-10"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\contracts\FAMILY-3-INTELLIGENCE.md: complete
      contracts for BEN-INT-01 (Individual Intelligence), BEN-INT-02
      (Employment and Career), BEN-INT-03 (Business Ownership), BEN-INT-04

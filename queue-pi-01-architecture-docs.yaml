  - id: pi01-011
    phase: build
    description: "Behavioral contracts: Family 4 RELATIONSHIP - BEN-REL-01 through BEN-REL-06"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      Write docs\architecture\contracts\FAMILY-4-RELATIONSHIP.md: complete
      contracts for BEN-REL-01 (Relationship Discovery), BEN-REL-02 (Board

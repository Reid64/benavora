    description: "Create corporate giving portal monitor system"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\scrapers\corporate-monitor.ts:

      Export class CorporateGivingMonitor:
        - checkPortal(target: CorporateTarget): Promise<PortalStatus>
          Fetches the giving page, checks if it's still active, extracts key dates and program info.
          Uses cheerio for HTML parsing. Respects robots.txt conceptually (2s delay).
        - detectChanges(target: CorporateTarget, previousSnapshot: string): Promise<ChangeReport>
          Compares current page content to stored snapshot. Reports: new programs, removed programs, deadline changes, amount changes.
        - async monitorAll(): Promise<MonitoringResult[]>
          Runs all registered corporate targets sequentially with delays.

      Export interface CorporateTarget {
        id: string;
        company_name: string;
        giving_url: string;
        category: 'monetary'|'land'|'in_kind'|'volunteer'|'sponsorship'|'general';
        check_frequency_days: number;
        last_checked?: Date;
        last_snapshot?: string;
      }

      Create C:\Users\manag\Documents\benavora\src\lib\scrapers\data\corporate-targets.ts:
        Export const CORPORATE_TARGETS: CorporateTarget[] with initial targets:
        - Walmart Spark Good (https://walmart.org/how-we-give/local-community-grants)
        - Home Depot Foundation (https://corporate.homedepot.com/foundation)
        - Lowe's Foundation (https://corporate.lowes.com/our-responsibilities/lowes-foundation)
        - Bank of America (https://about.bankofamerica.com/en/making-an-impact/charitable-foundation-funding)
        - JPMorgan Chase (https://www.jpmorganchase.com/impact/communities)
        - Wells Fargo Foundation (https://www.wellsfargo.com/about/corporate-responsibility/community-giving/)
        - Target Foundation (https://corporate.target.com/sustainability-governance/community)
        - Truist Foundation (https://www.truist.com/purpose/truist-foundation)
        - US Bank Foundation (https://www.usbank.com/about-us-bank/community/us-bank-foundation.html)
        - Microsoft Philanthropies (https://www.microsoft.com/en-us/corporate-responsibility/philanthropies)
        - Google.org (https://www.google.org/)
        - Amazon (https://www.aboutamazon.com/impact/community)

      Create migration C:\Users\manag\Documents\benavora\supabase\migrations\061_corporate_monitors.sql:
        CREATE TABLE IF NOT EXISTS corporate_giving_targets (
          id uuid DEFAULT gen_random_uuid() PRIMARY KEY,

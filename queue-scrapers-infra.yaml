  - id: infra-001
    phase: build
    description: "Create proxy manager for AutoApply residential proxy rotation"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts completely.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\proxy-manager.ts:

      Export class ProxyManager:
        - constructor(config?: { provider?: string, apiKey?: string, poolSize?: number })
          Supports multiple proxy providers: brightdata, smartproxy, iproyal, or 'none' (direct).
          Config from env vars: PROXY_PROVIDER, PROXY_API_KEY, PROXY_POOL_SIZE.
          If no provider configured: operates in direct mode (no proxy).
        - async getProxy(region?: string): Promise<ProxyConfig | null>
          Returns a proxy URL preferring geographic match to the funder's region.
          ProxyConfig: { server: string, username?: string, password?: string }
          If in direct mode: returns null.
        - markFailed(proxyUrl: string): void
          Temporarily removes from active pool (30 min cooldown).
        - rotateForSubmission(): ProxyConfig | null
          Returns fresh proxy, never reuses within same batch.
        - getStats(): { total: number, active: number, failed: number }

      Modify C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts:
        Add optional proxy parameter to launch():
        async launch(options?: { proxy?: ProxyConfig }): Promise<void>
        If proxy provided: pass to Playwright browser launch:
          playwright.chromium.launch({ proxy: { server: options.proxy.server, username: options.proxy.username, password: options.proxy.password } })
        If no proxy: launch without proxy (current behavior).

      NOTE: The proxy integration is OPTIONAL. AutoApply works without proxies. This adds the capability for when scaling beyond ~50 submissions requires IP rotation.
    expected_outputs:
      - src/lib/autoapply/proxy-manager.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-002
    phase: build
    description: "Create CAPTCHA solving service integration"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts.
      Read C:\Users\manag\Documents\benavora\worker\queue-processor.ts if it exists.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\captcha-solver.ts:

      Export class CaptchaSolver:
        - constructor(config?: { provider?: string, apiKey?: string })
          Provider: '2captcha' or 'none'. Config from env: CAPTCHA_PROVIDER, CAPTCHA_API_KEY (2CAPTCHA_API_KEY).
          If no provider: returns null for all solve attempts (CAPTCHA items go to manual queue).
        - async solveRecaptchaV2(siteKey: string, pageUrl: string): Promise<string | null>
          Calls 2Captcha API: POST https://2captcha.com/in.php with method=userrecaptcha
          Polls for result: GET https://2captcha.com/res.php?action=get&id={taskId}
          Returns the g-recaptcha-response token, or null on failure.
          Timeout: 120 seconds.
        - async solveHCaptcha(siteKey: string, pageUrl: string): Promise<string | null>
          Similar flow for hCaptcha challenges.
        - async solveImageCaptcha(imageBase64: string): Promise<string | null>
          For simple image CAPTCHAs (text recognition).
        - detectCaptchaOnPage(page: any): Promise<CaptchaType | null>
          Scans page DOM for reCAPTCHA, hCaptcha, or image CAPTCHA elements.
          CaptchaType: 'recaptcha_v2' | 'recaptcha_v3' | 'hcaptcha' | 'image' | null
        - async solveCaptchaOnPage(page: any): Promise<boolean>
          Detects CAPTCHA type, solves it, injects the solution token into the page.
          Returns true if solved, false if unsolvable.

      NOTE: CAPTCHA solving is OPTIONAL. If no API key configured, CAPTCHA-blocked submissions are marked as 'captcha_blocked' and routed to the manual review queue. This is the current behavior — this prompt adds automatic solving as an enhancement.
    expected_outputs:
      - src/lib/autoapply/captcha-solver.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-003
    phase: build
    description: "Create Portal Discovery Agent"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\enrichment\sources\web-search.ts for DuckDuckGo/SearXNG search.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\portal-discovery.ts:

      Export class PortalDiscoveryAgent:
        The missing link: given a funder name, find their donation/giving application portal URL.

        - async discoverPortal(funderName: string, funderWebsite?: string): Promise<PortalDiscoveryResult>
          Strategy 1 (if website known): Crawl the funder's website for links containing keywords:
            'donate', 'giving', 'grant', 'apply', 'request', 'sponsorship', 'community', 'foundation', 'contribute'
            Prioritize links on /giving, /grants, /community, /foundation paths.
          Strategy 2 (if no website): Search DuckDuckGo for "{funderName} donation request form" or "{funderName} grant application".
            Parse results, prefer .org and corporate domains.
          Strategy 3: Search for "{funderName} community giving program".

          For each candidate URL: do a HEAD request to verify it's live (200 status).
          Use Claude to classify: is this actually a giving/donation request page?
          Confidence scoring: 0-1 based on keyword density, URL patterns, Claude classification.

          PortalDiscoveryResult: { url: string | null, confidence: number, method: 'crawl'|'search', alternatives: string[] }

        - async discoverBatch(funders: Array<{ id: string, name: string, website?: string }>): Promise<Map<string, PortalDiscoveryResult>>
          Processes a batch of funders with rate limiting (1 req/sec).
          Updates funders table: sets giving_portal_url for high-confidence results (>0.7).

      Create C:\Users\manag\Documents\benavora\src\app\api\agents\portal-discovery\route.ts:
        POST: Discover portals for specified funders. Body: { funder_ids: string[] } or { all_missing: true }
        Auth required (admin/writer). maxDuration = 300.
        Returns: { discovered, failed, high_confidence, low_confidence }

      Create C:\Users\manag\Documents\benavora\src\app\api\cron\portal-discovery\route.ts:
        POST: Runs portal discovery for funders missing giving_portal_url. CRON_SECRET protected.
        Processes up to 50 funders per run.
        Cron: daily at 3 AM UTC.
    expected_outputs:
      - src/lib/autoapply/portal-discovery.ts
      - src/app/api/agents/portal-discovery/route.ts
      - src/app/api/cron/portal-discovery/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


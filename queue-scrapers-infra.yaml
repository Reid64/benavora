# ============================================================
# SCRAPERS + AUTOAPPLY INFRASTRUCTURE + WHITE-LABEL
# ============================================================
# 1. State grant scraper framework (reusable for all 50 states)
# 2. Corporate giving portal monitors
# 3. AutoApply infrastructure (proxy manager, CAPTCHA, portal discovery)
# 4. Community foundation registry
# 5. White-label system for consultant tier
# ============================================================

prompts:

  # ============================================================
  # STATE GRANT SCRAPERS
  # ============================================================

  - id: scrape-001
    phase: build
    description: "Create state grant scraper framework with pluggable state modules"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\agents\state-scrapers.ts for existing state scraper code.
      Read C:\Users\manag\Documents\benavora\src\lib\agents\tdhca.ts for the Texas-specific scraper.

      Create C:\Users\manag\Documents\benavora\src\lib\scrapers\state-scraper-framework.ts:

      Export abstract class StateScraper:
        abstract stateName: string;
        abstract stateCode: string;
        abstract sources: StateGrantSource[];
        abstract scrape(): Promise<ScrapedOpportunity[]>;

        protected async fetchPage(url: string): Promise<string>
          Uses fetch with retry logic, rate limiting (1 req/2 sec), and User-Agent rotation.
        protected parseWithCheerio(html: string): cheerio.CheerioAPI
        protected extractDeadline(text: string): Date | null
          Regex patterns for common date formats.
        protected extractAmount(text: string): { min?: number, max?: number } | null
          Regex for dollar amounts, ranges like "$5,000 - $50,000".
        protected normalizeCategory(rawCategory: string): string
          Maps state-specific category names to Benavora's standard categories.

      Export interface StateGrantSource {
        name: string;
        url: string;
        type: 'housing'|'community_development'|'health'|'education'|'workforce'|'general';
        scrapeMethod: 'html'|'rss'|'api'|'pdf';
      }

      Export interface ScrapedOpportunity {
        title: string;
        funder: string;
        source_url: string;
        description?: string;
        deadline?: Date;
        amount_min?: number;
        amount_max?: number;
        category: string;
        state: string;
        eligibility_notes?: string;
        raw_html?: string;
      }

      Create C:\Users\manag\Documents\benavora\src\lib\scrapers\scraper-registry.ts:
        Export class ScraperRegistry:
        - register(scraper: StateScraper): void
        - getScraper(stateCode: string): StateScraper | null
        - getAllScrapers(): StateScraper[]
        - async runAll(): Promise<{ state: string, found: number, errors: string[] }[]>
        - async runState(stateCode: string): Promise<ScrapedOpportunity[]>
    expected_outputs:
      - src/lib/scrapers/state-scraper-framework.ts
      - src/lib/scrapers/scraper-registry.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: scrape-002
    phase: build
    description: "Create state scraper implementations for Texas and 9 priority states"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\scrapers\state-scraper-framework.ts for StateScraper base class.

      Create state scraper modules in C:\Users\manag\Documents\benavora\src\lib\scrapers\states\:

      texas.ts — TDHCA (https://www.tdhca.texas.gov/nofa), Texas Veterans Commission, TX Health & Human Services
      california.ts — California HCD (https://www.hcd.ca.gov/grants-and-funding), CalOES
      newyork.ts — NY Homes & Community Renewal (https://hcr.ny.gov/funding-opportunities), NY DOH
      florida.ts — Florida Housing Finance Corp (https://www.floridahousing.org/programs)
      oklahoma.ts — OK Housing Finance Agency, OK DHS
      louisiana.ts — Louisiana Housing Corp, LA DHH
      newmexico.ts — NM Mortgage Finance Authority, NM HSD
      arkansas.ts — AR Development Finance Authority, AR DHS
      ohio.ts — Ohio Housing Finance Agency (https://ohiohome.org/ppd/funding.aspx)
      pennsylvania.ts — PA Housing Finance Agency (https://www.phfa.org/programs/)

      Each scraper:
      - Extends StateScraper
      - Defines 2-3 StateGrantSource entries for that state's housing/grant agencies
      - Implements scrape() to fetch and parse each source
      - Uses cheerio to extract opportunity listings from HTML pages
      - Extracts: title, deadline, amount, description, application URL
      - Falls back gracefully if a page structure changes (log warning, skip source)

      Create C:\Users\manag\Documents\benavora\src\lib\scrapers\states\index.ts:
        Imports all 10 state scrapers and registers them with ScraperRegistry.
        Export function initializeScrapers(): ScraperRegistry
    expected_outputs:
      - src/lib/scrapers/states/texas.ts
      - src/lib/scrapers/states/california.ts
      - src/lib/scrapers/states/newyork.ts
      - src/lib/scrapers/states/florida.ts
      - src/lib/scrapers/states/index.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: scrape-003
    phase: build
    description: "Create remaining 40 state scrapers using template pattern"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\scrapers\states\texas.ts as the reference implementation.
      Read C:\Users\manag\Documents\benavora\src\lib\scrapers\state-scraper-framework.ts.

      Create state scraper modules for ALL remaining states in C:\Users\manag\Documents\benavora\src\lib\scrapers\states\:

      For each state, create a file named {state_code_lowercase}.ts.
      Each state's primary source should be their Housing Finance Agency or equivalent.

      States to create (40 remaining): AL, AK, AZ, CO, CT, DE, GA, HI, ID, IL, IN, IA, KS, KY, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NC, ND, OR, RI, SC, SD, TN, UT, VT, VA, WA, WV, WI, WY, DC

      For each state:
      - Define the state's Housing Finance Agency URL as the primary source
      - Use a GENERIC scraper approach: fetch the funding/grants page, extract all links containing keywords like "funding", "grant", "nofa", "application", "rfp"
      - Extract what's available from the page (some states have structured listings, others have PDF links)
      - Set scrapeMethod to 'html' for all initially

      Update C:\Users\manag\Documents\benavora\src\lib\scrapers\states\index.ts to import and register all 50 state scrapers + DC.

      NOTE: Many state pages will have different structures. The scrapers should be fault-tolerant — if parsing fails, log the error and return empty results rather than throwing. These scrapers will be refined iteratively as we test each state.
    expected_outputs:
      - src/lib/scrapers/states/index.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: scrape-004
    phase: build
    description: "Create state scraper cron job and research integration"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\scrapers\scraper-registry.ts.
      Read C:\Users\manag\Documents\benavora\src\app\api\cron\research\route.ts for existing cron pattern.

      Create C:\Users\manag\Documents\benavora\src\app\api\cron\state-scrapers\route.ts:
        POST: Runs state scrapers. Protected by CRON_SECRET.
        Calls ScraperRegistry.runAll() or specific states from query param.
        For each scraped opportunity:
          1. Check if already exists in opportunities table (match by source_url or title+funder)
          2. If new: insert into opportunities with source_type='state_scraper', run eligibility scoring
          3. If existing: check for deadline/amount changes, update if changed
        Returns: { states_scraped, new_opportunities, updated, errors }

      Add to vercel.json crons (if not already present):
        { "path": "/api/cron/state-scrapers", "schedule": "0 6 * * *" }
        Runs daily at 6 AM UTC.

      Create C:\Users\manag\Documents\benavora\src\app\api\agents\state-scrapers\[stateCode]\route.ts:
        POST: Run scraper for a single state. Auth required (admin/writer).
        Returns scraped opportunities for that state.

      Add "State Grants" as a source card on the Research page:
      Read and modify C:\Users\manag\Documents\benavora\src\app\(dashboard)\research\page.tsx.
      Add a card: "State Grant Portals — 50 states + DC, daily automated scanning"
      With a "Run All States" button and per-state dropdown.
    expected_outputs:
      - src/app/api/cron/state-scrapers/route.ts
      - src/app/api/agents/state-scrapers/[stateCode]/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - BLUEPRINT_v2.md
  - SCHEMA_REGISTRY_v2.md
  - BEHAVIORAL_CONTRACTS.md
  - STATE_OF_THE_BUILD.md
  - STANDING_DIRECTIVES.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 3
  governance_check_frequency: 5

prompts:

  - id: night-001
    phase: infra
    description: "Wire nonprofit scraper into Railway weekly scheduler"
    prompt: |
      Read src/lib/worker/scheduler.ts and scripts/run-nonprofit-scraper.ts in full.
      Add a weekly job (Sunday 4AM CST, staggered after the existing foundation-enrichment-weekly job) that calls runNonprofitScraper().
      Job name: nonprofit-enrichment-weekly. Gate behind ENABLE_SCRAPER env var like the existing foundation job.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(worker): wire nonprofit scraper into weekly Railway scheduler'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-002
    phase: bugfix
    description: "Fix Sales Outreach New Campaign blank page stub"
    prompt: |
      Read src/app/(dashboard)/admin/sales-outreach/ in full, specifically the New Campaign flow.
      The New Campaign button leads to a blank page. Investigate whether a form/component was ever built for this route
      and is just not rendering, or whether it was never implemented at all.
      If never implemented: build a minimal functional campaign-creation form (name, target segment, template selection,
      send schedule) that writes to the campaigns table per SCHEMA_REGISTRY_v2.md. Do not build anything beyond a working
      create flow — no analytics, no A/B testing, keep it minimal and functional.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'fix(sales-outreach): implement functional New Campaign form, was blank stub'; git push
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: continue

  - id: night-003
    phase: audit
    description: "Systematic migration-vs-production audit"
    prompt: |
      Read every file in supabase/migrations/ in order. For each migration, extract every CREATE TABLE / ALTER TABLE /
      ADD COLUMN statement. Using the Supabase Management API REST pattern (JavaScriptSerializer, service-role key)
      confirm whether each table/column actually exists on production.
      This mirrors the discovery that migration 052 was silently never applied — the goal is to find any other
      silently-unapplied migrations before they cause a production bug like the AutoApply automation_level failure did.
      Do NOT apply any missing migrations — diagnostic only. Report findings to MIGRATION_AUDIT.md: list every migration,
      APPLIED or NOT APPLIED, and for NOT APPLIED entries, list every missing table/column and which live code paths
      reference them (grep the codebase for each table/column name).
      git add MIGRATION_AUDIT.md; git commit -m 'docs: full migration-vs-production audit'; git push
    gates:
      - type: file_exists
        files: [MIGRATION_AUDIT.md]
    max_retries: 2
    on_fail: continue

  - id: night-005
    phase: bugfix
    description: "Wire 2Captcha integration into stealth browser flow (Feature #63)"
    prompt: |
      Read src/lib/scraper/captcha-solver.ts (or wherever it lives per FEATURE_REGISTRY_v2.md #63) and
      src/lib/scraper/stealth-engine.ts in full.
      Feature #63 status: "captcha-solver.ts exists. Not wired into stealth browser flow." Wire it in properly:
      when StealthEngine detects a CAPTCHA and TWOCAPTCHA_API_KEY is present, actually call the solver and submit
      the solution, rather than only detecting-and-skipping (current behavior confirmed tonight). If TWOCAPTCHA_API_KEY
      is absent, preserve current skip/circuit-breaker behavior exactly as-is.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(scraper): wire 2Captcha solver into stealth browser flow (#63)'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-006
    phase: bugfix
    description: "Verify and fix process-followups worker job (Feature #74)"
    prompt: |
      Read worker/dist/src/worker/jobs/process-followups.js source (find the .ts source file) and
      FEATURE_REGISTRY_v2.md #74 in full. Registry states "process-followups worker job is stub only" —
      this contradicts a prior session's claim that Feature #74 was completed. Determine ground truth:
      does this job currently do real work (query follow-ups due, generate content, send/queue them) or is it
      a stub that logs and returns. Report findings honestly regardless of what any prior doc claimed.
      If stub: implement real logic per AUTOAPPLY_ARCHITECTURE_V2.md follow-up spec.
      If already real: correct FEATURE_REGISTRY_v2.md's #74 status and note the registry was wrong, not the code.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'fix(worker): verify/implement process-followups job, correct #74 status'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-007
    phase: bugfix
    description: "Wire Integration Settings UI connector cards (Feature #57)"
    prompt: |
      Read the page at /settings/integrations in full. Registry #57 states "connector cards not fully wired."
      Identify which connector cards are decorative/non-functional and wire each to its actual backend
      connection flow (enable/disable, credential entry, status display) using existing patterns already
      working elsewhere in the app. Do not invent new integrations — only wire what already has backend support.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'fix(settings): wire integration connector cards to real backend flows (#57)'; git push
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: continue

  - id: night-008
    phase: bugfix
    description: "Implement Automation Queue priority scoring (Feature #61)"
    prompt: |
      Read worker/queue-processor.ts and the submission_queue schema in SCHEMA_REGISTRY_v2.md.
      Registry #61 states "Worker exists. Priority scoring not implemented." Implement priority scoring for
      queued AutoApply submissions — factors should include deadline proximity, opportunity probability score
      (if available per Feature #102), and organization tier. Queue should process higher-priority items first.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(autoapply): implement submission queue priority scoring (#61)'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-010
    phase: agents
    description: "Build EA-01 Corporate Giving Detector agent"
    prompt: |
      Read WORKER_ARCHITECTURE_v2.md sections 6-7 (Enrichment Processor, Agent Runner) in full, and
      SCHEMA_REGISTRY_v2.md's corporate_prospects and corporate table definitions.
      Build EA-01: Corporate Giving Detector, per the documented spec — fetches a company's website,
      detects presence/absence of a corporate giving program (grants page, foundation page, CSR page),
      extracts program details if found. Follow the same StealthEngine fetch patterns already used in
      src/lib/scraper/ for consistency (fetchPage for rendered content, do not invent a new fetch layer).
      Output merges into corporate_prospects.enrichment jsonb per schema, never overwriting existing fields.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(agents): build EA-01 Corporate Giving Detector'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-011
    phase: agents
    description: "Build EA-08 Executive Bio Analyzer agent"
    prompt: |
      Read WORKER_ARCHITECTURE_v2.md sections 6-7 in full. Build EA-08: Executive Bio Analyzer per spec —
      fetches a company's leadership/about page, extracts executive names, titles, and bio content relevant
      to philanthropic interest signals (board memberships, stated causes, prior giving mentions).
      Merges into corporate_prospects.enrichment jsonb, never overwriting existing fields.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(agents): build EA-08 Executive Bio Analyzer'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-012
    phase: agents
    description: "Build EA-09 Contact Extractor agent"
    prompt: |
      Read WORKER_ARCHITECTURE_v2.md sections 6-7 in full. Build EA-09: Contact Extractor per spec —
      fetches a company's contact page, extracts emails/phone/physical address relevant to corporate
      giving outreach. Reuse extraction logic patterns already built in src/lib/scraper/stealth-engine.ts
      (extractEmails/extractPhone) rather than duplicating regex logic.
      Merges into corporate_prospects.enrichment jsonb, never overwriting existing fields.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(agents): build EA-09 Contact Extractor'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-013
    phase: agents
    description: "Wire Corporate Enrichment Queue orchestration (EA-01/08/09 pipeline)"
    prompt: |
      Read WORKER_ARCHITECTURE_v2.md's exact Corporate Enrichment Queue spec (section 6) in full — this
      defines the poll loop: SELECT from corporate_prospects WHERE enrichment_completed_at IS NULL LIMIT 100,
      run EA-01 then EA-08 then EA-09 per prospect, merge results, queue for propensity scoring, 3s delay
      between companies, checkpoint every 10 records, sleep 60s, continue loop.
      Implement this exact orchestration in worker/enrichment-processor.ts (create if it doesn't exist yet),
      calling EA-01/EA-08/EA-09 built in prior prompts. Do not add retry/backoff logic beyond what's
      specified — match the documented spec exactly, this is orchestration only, not new agent design.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(worker): wire corporate enrichment queue orchestration per WORKER_ARCHITECTURE_v2 spec'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-014
    phase: agents
    description: "Build AG-22 Propensity Scoring Agent (computes PS-01 through PS-10)"
    prompt: |
      Read WORKER_ARCHITECTURE_v2.md's Propensity Scoring Queue spec in full, and SCHEMA_REGISTRY_v2.md's
      corporate_prospects.scores jsonb column definition ("PS-01 through PS-10 propensity scores").
      Build AG-22: Propensity Scoring Agent — triggered after corporate enrichment completes per prospect,
      reads the full enrichment jsonb, calls Claude to compute all 10 propensity dimensions (PS-01 through
      PS-10) in a single structured-output call (not 10 separate agents — this is one agent producing 10
      scores), writes to scores jsonb, then computes and writes a Giving DNA profile to giving_dna jsonb,
      sets scores_computed_at = now(). Note: PS-01 through PS-10's individual scoring dimensions are not
      further specified in any doc — infer reasonable propensity dimensions (e.g. giving capacity, cause
      alignment, geographic proximity, engagement recency) from context, and document your chosen dimensions
      clearly in code comments and in the commit message, since this is the one place in this prompt set
      requiring judgment beyond the documented spec.
      Run pnpm tsc --noEmit. git add -A; git commit -m 'feat(agents): build AG-22 Propensity Scoring Agent, define PS-01-10 dimensions'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: night-015
    phase: governance
    description: "Correct stale registry entries and update governance docs with tonight's findings"
    prompt: |
      Read STATE_OF_THE_BUILD.md, SESSION_STATE.md, FEATURE_REGISTRY_v2.md, DEMO_READINESS_AUDIT.md, and
      MIGRATION_AUDIT.md (if it exists from night-003).
      Correct two confirmed-stale entries in FEATURE_REGISTRY_v2.md: D1 (IRS BMF Full Import) says "Never
      successfully run" but 1,978,526 records were confirmed imported in a prior session — update status to BUILT.
      D6 (Foundation Website Scraper) says "not yet run at scale" but the stealth scraper has been actively
      run tonight — update status to reflect actual current state (IRS 990 fetch bug fixed, real run confirmed
      working at 8/10 parse rate).
      Update all governance docs to reflect: worker outage resolution, stealth scraper build + IRS 990 fetch fix,
      AutoApply automation_level fix (confirmed end-to-end), Sales Outreach New Campaign fix, nonprofit scraper
      scheduler wiring, 2Captcha wiring, process-followups verification, integration settings wiring, priority
      scoring, migration audit findings, worker heartbeat fix, and the new EA-01/EA-08/EA-09/AG-22 agent pipeline
      (note clearly that EA-02 through EA-07 and EA-10 remain unspecified reserved slots, not built — do not
      mark them BUILT or imply they exist). Consolidate into a clean "as of July 28 2026" state snapshot.
      git add STATE_OF_THE_BUILD.md SESSION_STATE.md FEATURE_REGISTRY_v2.md; git commit -m 'governance: overnight session consolidation + agent pipeline + stale registry corrections July 28 2026'; git push
    gates:
      - type: file_exists
        files: [STATE_OF_THE_BUILD.md]
    max_retries: 2
    on_fail: continue

# queue-pil-ops-agents.yaml
# 1 prompt for the Operations & Evaluation & Learning family's sole agent, BEN-OPS-01, built to
# full spec depth per PIL_AGENT_COMPLETE_ROSTER.md and PIL_AGENT_DEPENDENCIES.yaml.
# src/lib/pil/agents/ops/ does not exist yet in this repo -- this prompt creates it.
# Density/format modeled on queue-pil-agents-complete.yaml's pil-ops-001 prompt (already
# audited, working), gone deeper on the propose-only constraint's concrete enforcement and the
# real pil_agent_run_events schema gap (no organization_id column) a shallower read would miss.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-ops-01-build
  name: Implement BEN-OPS-01 Agent Fleet Performance and Learning Agent
  prompt: "Build BEN-OPS-01 Agent Fleet Performance and Learning Agent -- src/lib/pil/agents/ops/ does not exist anywhere in this repo yet; this prompt creates it, and BEN-OPS-01.ts is the only file written there.\n\nREAD FIRST (do not write anything until you have read all of these in full): src/lib/pil/agent-runner.ts -- the real `Agent` interface is `export interface Agent { execute(context: AgentContext, runner: AgentRunner): Promise<AgentResult>; }`. This class reads `class AgentFleetPerformanceAndLearningAgent implements Agent`, never `extends BaseAgent` -- no BaseAgent class exists anywhere in src/lib/pil/. src/lib/pil/agents/qlf/BEN-QLF-04.ts in full (the canonical ~290-line reference implementation every PIL agent in this repo follows -- getPilClient()/getEvidence()/logAction()/createReviewItem(), a `delegations: DelegationRequest[]` array on the returned AgentResult, a lazy tryModelTokens()-style private helper gated on context.tools.includes(\"T-MODEL\")). src/lib/pil/agents/sup/BEN-SUP-07.ts in full -- this codebase's Autonomy Governor agent, the closest real analog to BEN-OPS-01's own propose-only constraint: BEN-SUP-07 reads pil_feature_flags (kill switches) and pil_agent_registry but writes only to pil_agent_runs.status (to terminate a violating run), pil_audit_log, and pil_human_review_queue -- and its SELF_APPROVAL_REVIEW_TYPES=[\"autonomy_increase\",\"policy_exception\"] check is the exact safety net that would catch it if BEN-OPS-01's own createReviewItem() calls were ever approved without a real human (a pil_human_review_queue row reaching 'approved' with assigned_to_user_id still null). src/lib/pil/agents/index.ts in full -- the real `AGENT_FACTORIES: Record<string, () => Agent>` map (no separate AGENT_FACTORIES.ts file); every new agent must be imported there and added. src/lib/pil/policy.ts's canDelegate() function -- it checks `AUTONOMY_ORDER[maxAutonomy] <= AUTONOMY_ORDER[parent.default_autonomy_level]`, i.e. against the DELEGATING agent's OWN registry ceiling, not the target's.\n\nGROUND TRUTH -- registry row (supabase/migrations/155_pil_agent_registry.sql line 122): agent_id BEN-OPS-01, name \"Agent Fleet Performance & Learning Agent\", family operations_evaluation_learning, mission \"Continuously evaluate whether the Prospect Intelligence agent fleet is actually improving research outcomes and determine where behaviors, routing, tools, or research strategies should be adjusted.\", default_autonomy_level stored as 'A1' (CRITICAL: not 'A2' -- the migration's own header comment at lines 14-17 explains the spec's real ceiling is a combined \"A1_A2\" per PIL_AGENT_COMPLETE_ROSTER.md/PIL_AGENT_DEPENDENCIES.yaml -- the lowest of all 47 PIL agents -- but the pil_agent_registry.default_autonomy_level CHECK constraint only accepts a single enum value, so 'A1' is what is actually stored live; ANY delegation this agent issues must use maxAutonomy \"A1\", never \"A2\" -- canDelegate() checks maxAutonomy against BEN-OPS-01's own stored ceiling ('A1'), so requesting \"A2\" on a delegation would make canDelegate() return false and mark the whole AgentResult \"failed\" the instant that delegation is attempted; verify this yourself by reading policy.ts's canDelegate() and the live registry row before writing the delegation object below), human_boundary (quote exactly, and put this exact string inside every review-item summary this agent creates): \"may recommend but may not independently increase autonomy, change security/privacy policy, modify canonical facts, remove safety controls, or rewrite production governance\", cadence \"Continuous + scheduled evaluation (nightly rollup, weekly deep review).\". Roster input observation domains: Agent Performance, Evaluation Results, Outcome Feedback, Cost/Latency, Error Taxonomy, Learning Proposals -- map each onto the concrete computed metrics below. Real dependency data (PIL_AGENT_DEPENDENCIES.yaml): depends_on [BEN-SUP-01, BEN-SUP-04, BEN-SUP-05, BEN-SUP-06] -- its own section explicitly OMITS BEN-SUP-02 and BEN-SUP-03 from the delegation list, so do not add delegations to either of those two; feeds: [BEN-SUP-03] but only indirectly (\"BEN-SUP-03's own doc: Model performance history may inform selection only through approved evaluation data. BEN-OPS-01 proposals do not change production routing until governed deployment\") -- this is NOT a same-run forward delegation BEN-OPS-01 should issue itself, it describes SUP-03 consuming already-APPROVED output through a separate, later, governed channel; do not delegate to BEN-SUP-03 in this implementation.\n\nCRITICAL REAL SCHEMA DETAIL (verified live against supabase/migrations/155_pil_agent_registry.sql lines 128-179, read that file's CREATE TABLE statements yourself before writing any query): pil_agent_runs has organization_id, agent_id, research_run_id, delegated_task_id, goal_id, status (queued/planning/running/observing/replanning/completed/blocked/failed/escalated), autonomy_level_used, input, output, tokens_consumed, cost_usd, started_at, completed_at, error, created_at. pil_agent_run_events has id, agent_run_id, event_type (CHECK constrained to exactly: tool_call, delegation_issued, evidence_collected, replan, escalation, budget_warning, stop_condition_met), payload, created_at -- it has NO organization_id column of its own. To scope events to this org's evaluation window, you MUST first query pil_agent_runs filtered by organization_id and the window, collect those run ids, then query pil_agent_run_events where agent_run_id IN (that id list) -- do not attempt `.eq(\"organization_id\", ...)` directly against pil_agent_run_events, that column does not exist on the table and the call will error or silently misbehave depending on how the mock/RLS handles an unknown column.\n\nIMPLEMENTATION:\ncontext.plan may carry `{ mode?: \"nightly\" | \"weekly\" }` -- default to \"nightly\" if unset or invalid. windowDays = mode === \"weekly\" ? 30 : 7. windowStart = new Date(Date.now() - windowDays*24*60*60*1000).toISOString().\nQuery pil_agent_runs where organization_id = context.orgId AND created_at >= windowStart (use created_at, not started_at -- started_at can be null for a run that never progressed past 'blocked', and that run still belongs in a failure-rate calculation).\nGroup the results into a Map<string, AgentRun[]> keyed by agent_id.\nPer agent_id, compute: runCount, failedCount (status === 'failed'), failureRate = runCount > 0 ? failedCount / runCount : 0, totalCostUsd = sum(cost_usd), avgCostUsd = totalCostUsd / Math.max(runCount, 1), totalTokens = sum(tokens_consumed), avgTokens = totalTokens / Math.max(runCount, 1).\nQuery pil_agent_run_events where agent_run_id IN (the full flat list of every run id across all agent_ids in the window) AND event_type = 'escalation'; for each returned event, look up which agent_id its agent_run_id belongs to (via the same Map you already built) and increment an escalationCount per agent_id.\nCompute fleetMedianCostUsd = the median of avgCostUsd across only the agent_ids with runCount >= a named constant `MIN_SAMPLE_SIZE_FOR_COST_COMPARISON = 5` (excluding low-volume agent_ids from the fleet-wide comparison entirely, both from the median calculation itself and from being flagged as cost outliers, so a single expensive one-off run cannot dominate or falsely trigger the comparison -- document this exact threshold and reasoning in a header comment).\n\nFLAGGING THRESHOLDS (named, documented constants, matching this codebase's existing DISQUALIFY_SCORE_THRESHOLD/RESEARCH_SUFFICIENCY_THRESHOLD-style convention in BEN-QLF-04.ts -- do not leave these as unexplained magic numbers):\nconst FAILURE_RATE_THRESHOLD = 0.2; -- agent_id flagged HIGH severity if failureRate > 0.2 AND runCount >= MIN_SAMPLE_SIZE_FOR_COST_COMPARISON.\nconst COST_OUTLIER_MULTIPLIER = 3; -- agent_id flagged MEDIUM severity if avgCostUsd > fleetMedianCostUsd * 3 AND runCount >= MIN_SAMPLE_SIZE_FOR_COST_COMPARISON.\nconst ESCALATION_COUNT_THRESHOLD = 3; -- agent_id flagged MEDIUM severity if escalationCount >= 3 in the window, regardless of runCount (even a single agent generating 3+ escalations in a week deserves a look, independent of sample size).\nAn agent_id can be flagged by more than one rule; if so, use the highest severity produced (HIGH beats MEDIUM) and list every issue string that tripped, not just the first.\n\nFor each flagged agent_id, build a LearningProposal object: {agentCode, issue (a string naming exactly which threshold(s) tripped with the real computed numbers, e.g. \"failureRate 0.35 exceeds 0.20 threshold over 8 runs\"), recommendation (plain-language only, e.g. \"review BEN-XXX-NN's recent failed runs for a common root cause before any routing or autonomy change\" -- this string must NEVER itself instruct a specific autonomy/policy/routing change to apply, only a recommendation for a human to investigate, per the human_boundary text quoted above), severity: \"high\" | \"medium\"}.\n\nHARD WRITE CONSTRAINT (verify this yourself by grepping the finished file for `.update(` and `.insert(` before closing this prompt): BEN-OPS-01's own execute() method and every private helper it calls must NEVER issue an insert or update against pil_agent_registry, pil_feature_flags, or pil_agent_runs -- those three tables are read-only from this agent's own code (AgentRunner itself, not this agent, is what writes the row for BEN-OPS-01's own run via createRun/finalizeRun in agent-runner.ts -- that is a different code path this agent does not call directly). The only tables this agent's own code may write to are pil_human_review_queue (via createReviewItem, from src/lib/pil/human-review.ts) and pil_audit_log (via logAction, from src/lib/pil/audit.ts). This is the literal code-level enforcement of \"propose, never apply\" -- do not add a convenience method that would let a future caller apply a recommendation directly from this file.\n\nHUMAN REVIEW: for EVERY flagged agent_id (both HIGH and MEDIUM severity -- both are threshold crossings by construction, since nothing sub-threshold generates a LearningProposal at all), call createReviewItem() with review_type \"policy_exception\" (matching BEN-SUP-07.ts's own use of \"policy_exception\" for autonomy/governance findings -- this is the learning-layer sibling of that same mechanism), subject_type \"pil_agent_runs\", subject_id = the id of that agent_id's most recent failed run in the window if one exists, else the most recent run of any status (a real UUID -- HumanReviewItem.subject_id is typed UUID per src/lib/pil/types.ts, so never pass the agent_id text string like \"BEN-STR-01\" here), priority \"high\" for HIGH severity findings else \"normal\", summary that includes both the issue string and this exact sentence: \"BEN-OPS-01 may recommend but may not independently increase autonomy, change security/privacy policy, modify canonical facts, remove safety controls, or rewrite production governance -- this finding requires human review before any change is made.\", evidence_refs = [] (no pil_evidence rows are relevant to a fleet-performance finding).\n\nDELEGATIONS: for every HIGH severity finding only, push a delegation to BEN-SUP-05 (childAgentCode \"BEN-SUP-05\", maxAutonomy \"A1\" -- NOT \"A2\", see the critical autonomy note above) with an objective describing the flagged agent_id and issue, for independent critic review of the proposed learning finding before any human sees it -- consistent with the fleet-wide \"an agent cannot certify its own consequential output\" invariant BEN-SUP-05 exists to enforce, and directly grounded in BEN-OPS-01's own documented boundary that it \"may never approve its own policy exception, autonomy increase, security exception, or consequential self-certification\" (PIL_AGENT_DEPENDENCIES.yaml). Do NOT delegate to BEN-SUP-01, BEN-SUP-04, or BEN-SUP-06 in this implementation even though all three appear in the roster's depends_on list -- per the roster, their role is receiving BEN-OPS-01's output through separately governed, later, out-of-band channels (e.g. BEN-SUP-04 acting on an already-approved allocation-policy change), not a same-run forward delegation from this agent; document this scope decision explicitly in a header comment, the same way BEN-QLF-04.ts's own header comment documents its scope decisions rather than leaving them unexplained.\n\ntokensUsed via the same tryModelTokens-equivalent private helper pattern (gated on context.tools.includes(\"T-MODEL\")), ~500 units. logAction once at the end of execute(): action \"fleet_performance.evaluated\", resource_type \"pil_agent_registry\", resource_id context.runId (this BEN-OPS-01 run's own id -- there is no single better resource id for a fleet-wide rollup that touches many agent_ids at once), before_state null, after_state {mode, windowDays, agentsEvaluated: <count of distinct agent_ids seen>, flaggedCount: <proposals.length>}.\n\nReturn AgentResult.conclusions = {mode, windowDays, agentsEvaluated, proposals: LearningProposal[], fleetMedianCostUsd}. status is always \"completed\" (never \"failed\") even when zero runs exist in the window -- an empty fleet-performance window is a valid, non-error outcome, not a failure.\n\nRegister BEN-OPS-01 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map -- this closes out the Operations & Evaluation & Learning family (1/1 implemented).\n\nTEST FILE: src/__tests__/unit/pil-ops-agents.test.ts does not exist anywhere in this repo yet (confirmed via a live search before writing this prompt) -- create it now. Copy src/__tests__/unit/pil-qlf-knw-agents.test.ts's exact header/mocking pattern verbatim into the new file: the same vi.mock() calls for @/lib/pil/db, @/lib/pil/evidence, @/lib/pil/graph, @/lib/pil/monitoring, @/lib/pil/human-review, @/lib/pil/audit; the same chainable table-keyed `makeClient()` helper; the same `baseContext()` helper (update agentCode default to \"BEN-OPS-01\"). Add a `describe(\"BEN-OPS-01 Agent Fleet Performance and Learning Agent\", ...)` block with: (1) a nightly-mode happy-path test where the mocked pil_agent_runs query returns >=5 runs for one agent_id with failureRate > 0.2, asserting a HIGH severity proposal is present in conclusions.proposals, createReviewItem was called with review_type \"policy_exception\" and priority \"high\", and a delegation to BEN-SUP-05 with maxAutonomy \"A1\" (NOT \"A2\") is present in result.delegations; (2) a weekly-mode happy-path test where one agent_id's avgCostUsd exceeds 3x the mocked fleet median with runCount >= 5, asserting a MEDIUM severity proposal, createReviewItem called with priority \"normal\", and NO delegation to BEN-SUP-05 (since only HIGH severity delegates); (3) a zero-runs-in-window edge case asserting conclusions.proposals is an empty array, result.status is \"completed\" (not \"failed\"), and createReviewItem was never called; (4) an explicit assertion, across all three cases above, that the mocked pil_agent_registry, pil_feature_flags, and pil_agent_runs table clients' insert/update spy functions (from your makeClient() mock) were never invoked by BEN-OPS-01's own execute() call -- this is the propose-only guarantee tested directly as a runtime assertion, not just documented in a comment.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm (a) no write path anywhere in BEN-OPS-01.ts touches pil_agent_registry, pil_feature_flags, or pil_agent_runs, (b) every delegation this agent issues uses maxAutonomy \"A1\" not \"A2\", (c) the pil_agent_run_events query joins through the run-id list rather than filtering on a nonexistent organization_id column.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (confirm BEN-OPS-01 appears in AGENT_FACTORIES, note the Operations family is now 1/1, updated overall PIL agent completion count out of 48) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/ops/BEN-OPS-01.ts
    - src/__tests__/unit/pil-ops-agents.test.ts
    - src/lib/pil/agents/index.ts

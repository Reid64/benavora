         contract: interpret profile -> plan source sequence ->
         enumerate/search -> evidence-gather per candidate (bounded)
         -> rank with justification.
      2. Prompts hardened (these agents read arbitrary web content -
         the pi-21 delimiting is load-bearing here).
      3. Vitest (FakeProvider + fixture connectors through the real
         kernel): each produces ranked DiscoveryResults with claims;
         DIS-03's evidence includes filing-derived claims (fixture
         990 data); DIS-04 detects a giving page in a fixture site
         and cites its snapshot; both respect candidate limits.
      4. Green; evidence\pi-41\dis-03-04-tests.txt. Typecheck clean.
      5. Create scripts\verify\verify-pi41-004.mjs standard pattern.
      6. Run: node scripts/verify/verify-pi41-004.mjs
    expected_outputs:

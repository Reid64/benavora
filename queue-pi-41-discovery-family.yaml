project: prospect-intel
github_repo: Reid64/prospect-intel

governance:
  - DECISION_LOG.md
  - STANDING_DIRECTIVES.md
  - SESSION_STATE.md
  - STATE_OF_THE_BUILD.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

# ============================================================
# PI-41: DISCOVERY FAMILY - BEN-DIS-01 through BEN-DIS-08
#
# The fleet's front door. Eight discovery specialists, every one
# driven by TARGET PROFILES (D-008): donors, foundations,
# executives, and septic installers are the same machinery with
# different profile rows. This family is where real connectors
# meet real reasoning - and where two failure classes must be
# impossible by construction:
#   1. BLIND DUPLICATES: every discovered candidate passes the
#      ER engine's blocking before an entity is created - new,
#      existing (attach), or gray (KNW-02 enqueue). Discovery
#      NEVER creates an entity the system may already know.
#   2. ENUMERATION EXPLOSIONS: a profile matching 10,000
#      companies respects its candidate limits and budget - the
#      fan-out is bounded at the profile layer, enforced before
#      any per-candidate spend.
#
# Established patterns apply throughout (standard migration
# pattern, standard verify pattern, FakeProvider CI + bounded
# live evals, hardened prompt templates, FLEET_STATUS updates).
# ============================================================

prompts:

  - id: pi41-001
    phase: build
    description: "Preflight: FAMILY-2 read, substrate green"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Read FAMILY-2-DISCOVERY.md in full (all eight contracts);
         the target_profiles registry section; CONNECTOR_LAUNCH_SET.
      2. Health: pnpm -r test green; orchestration-proof re-run
         green; migrate --status clean. Capture to
         evidence\pi-41\preflight.txt.
      3. Create scripts\verify\verify-pi41-001.mjs: eight contracts
         x 24 fields present; re-runs green.
      4. Run: node scripts/verify/verify-pi41-001.mjs
    expected_outputs:
      - evidence/pi-41/preflight.txt
      - scripts/verify/verify-pi41-001.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi41-001.mjs"
    max_retries: 2
    on_fail: halt

  - id: pi41-002
    phase: build
    description: "Shared discovery infrastructure: profile interpretation, results, candidate intake"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. packages\core\src\discovery\:
         - ProfileInterpreter: target_profile -> typed search
           parameters: taxonomy expansion (a profile's codes expand
           through taxonomy_nodes descendants - NAICS 238910 pulls
           its subtree; cause codes pull NTEE children), geography
           resolution (states, counties, AND radius: center geocode +
           distance math - implement the haversine util with tests;
           geocoding source per the launch set, Places-flag-aware
           with a fallback path documented), size/eligibility
           filters, required-evidence spec, candidate LIMITS and the
           engaged families.
         - DiscoveryResult schema (contracts/zod): ranked candidates
           each with archetype, identifying fields, external ids
           found, preliminary evidence claim ids (never bare names -
           the family rule), rank justification, profile ref.
         - CandidateIntake: the persistence path - for each result:
           write preliminary claims first (evidence before entity),
           then the ER-blocked entity decision (next prompt wires the
           engine), then portfolio membership when run under an
           objective.
      2. Vitest: taxonomy expansion depth + subtree correctness on
         the seeded NAICS tree (the septic subtree case); radius math
         against hand-computed distances; the limits field surfaces
         in parameters; DiscoveryResult rejects a candidate with zero
         claim ids.
      3. Green; evidence\pi-41\discovery-infra-tests.txt. Typecheck
         clean.
      4. Create scripts\verify\verify-pi41-002.mjs: standard plus the
         zero-claims rejection and septic-subtree tests present.
      5. Run: node scripts/verify/verify-pi41-002.mjs
    expected_outputs:
      - packages/core/src/discovery/index.ts
      - scripts/verify/verify-pi41-002.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi41-002.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi41-003
    phase: build
    description: "Dedup-on-discovery: the ER gate at the front door, and bounded fan-out"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Wire CandidateIntake through the pi-31 ER engine: every
         candidate blocks against existing entities BEFORE creation -
         hard-identifier match attaches to the existing entity (new
         external ids + claims merged in); auto_non_match creates;
         gray zone creates a PROVISIONAL entity (resolution_status
         provisional per the registry) AND enqueues the KNW-02 pair -
         downstream research proceeds on the provisional entity and a
         later MATCH merges it (the pi-31 merge machinery; nothing
         new). The provisional path is the honest middle: discovery
         does not stall on ambiguity, and does not silently
         duplicate.
      2. Fan-out bounds: enumeration streams candidates and STOPS at
         the profile's candidate limit (the connector-side cursor
         abandoned cleanly, the truncation recorded on the run with
         the count seen vs taken - the orchestrator can raise the
         limit deliberately later); per-candidate intake spend
         metered against the discovery node's budget with the pi-12
         pre-check.
      3. Vitest: EIN-match attaches (no new entity, count asserted);
         clean-new creates; gray creates provisional + enqueues
         KNW-02; a 500-candidate fixture stream against a limit of
         50 stops at 50 with truncation recorded; budget exhaustion
         mid-intake stops cleanly (invariant-7 behavior at the
         intake layer).
      4. Green; evidence\pi-41\dedup-bounds-tests.txt. Typecheck
         clean.
      5. Create scripts\verify\verify-pi41-003.mjs: standard plus the
         attach-not-duplicate and truncation tests present.
      6. Run: node scripts/verify/verify-pi41-003.mjs
    expected_outputs:
      - packages/core/src/discovery/intake.ts
      - scripts/verify/verify-pi41-003.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi41-003.mjs"
    max_retries: 3
    on_fail: halt


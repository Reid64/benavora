# QUEUE GOC-1 — Unified Entity Graph (dependency root — must complete before GOC-2/GOC-3)
#
# Per GOOGLE_OPERATIONS_CENTER_MASTER_SPEC.md Part 2.2. This is deliberately scoped
# narrow: schema + one resolution agent, nothing consuming it yet. GOC-2 (GSC) and
# GOC-3 (GBP) both read from this graph rather than joining raw client/page tables
# directly, per the master spec's explicit statement that Tarritrix cannot reliably
# attribute a click, call, review, or lead to the correct location without it.
#
# Every prompt below instructs the build agent to read AGENTS.md/SCHEMA_REGISTRY.md
# live and determine the correct next agent ID and confirm no table-name collision,
# rather than trust any ID/table name pre-assigned in the master spec document, since
# that document was written without live repo access (see GOC-0 reconciliation).

governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
- CLAUDE.md
- docs/audits/2026-08-01-google-ops-center-reconciliation.md
project: Tarritrix
prompts:
- id: goc1-001
  name: Entity Graph schema — google_entity_graph table + supporting join tables
  prompt: |
    Read docs/audits/2026-08-01-google-ops-center-reconciliation.md in full first — confirm none of the tables below already exist under a different name before writing this migration. Read SCHEMA_REGISTRY.md for current table-naming conventions and RLS Pattern A requirements (all new tables must ship with Pattern A RLS from creation, per Contract 91's ban on new Pattern C tables).

    Write FILE 1: supabase/migrations/[correct next timestamp]_google_entity_graph.sql

    Create google_entity_nodes (id, client_id FK, node_type enum: 'domain'|'gsc_property'|'gbp_account'|'gbp_location'|'website_url'|'landing_page'|'tracking_phone'|'ga4_property'|'schema_entity'|'review'|'post'|'query'|'lead', external_id text, metadata jsonb, created_at, updated_at) and google_entity_edges (id, from_node_id FK, to_node_id FK, relationship_type text, confidence numeric, created_at) to represent the graph described in the master spec Part 2.2. Both tables ship with Pattern A RLS (any authenticated operator reads all; writes via service-role agent client only, per the existing pattern already used platform-wide).

    Apply the migration via Supabase MCP. Verify via pg_policies that both tables show Pattern A only, zero Pattern C.

    pnpm tsc --noEmit — 0 errors.

    git add -A; git commit -m 'feat: Google Entity Graph schema (google_entity_nodes, google_entity_edges), Pattern A from creation'; git push origin main. Report commit hash.
  gates:
  - type: compile

- id: goc1-002
  name: Entity Resolution Agent — determine correct ID, implement, wire
  prompt: |
    Read AGENTS.md in full. Determine the correct next available agent ID (do not assume a number — count what's actually there). Read src/lib/agents/base-agent.ts for the BaseAgent pattern every agent must extend, per Contract compliance already enforced platform-wide (verify-contracts.ts).

    Write FILE 1: src/lib/agents/a-[correct-id]-google-entity-resolution.ts

    Extends BaseAgent. Input: client_id. Job: reads clients, pages, domains, and any existing GBP/GSC connection tables (per the reconciliation report) for that client, and populates google_entity_nodes/google_entity_edges with the resolved graph — client → domain → pages → tracking phone (if present) → schema entities already generated by A-03. Do not fabricate edges for data that doesn't exist yet (e.g., no GBP location edge if no GBP connection exists) — leave the graph honestly incomplete rather than invent placeholder nodes.

    Write FILE 2: Update AGENTS.md with this agent's entry at its correct ID, phase, and dependencies.

    pnpm tsc --noEmit — 0 errors. Run the existing agent contract verification script (verify-contracts.ts) and confirm this new agent passes.

    git add -A; git commit -m 'feat: Google Entity Resolution Agent — builds the unified entity graph from existing client/page/schema data'; git push origin main. Report commit hash and the actual agent ID assigned.
  gates:
  - type: compile
  - type: file_exists
    files:
    - AGENTS.md

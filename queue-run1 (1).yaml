- id: r1-006
  name: "Learning Engine — Cross-Machine Sync"
  description: |
    You are enhancing FORGE at C:\Users\manag\Documents\forge-2.

    TASK:
    Create src/learning/sync.ts — handles syncing the local SQLite forge_memory.db with a master copy on an 18TB external drive. The protocol is append-only with file locking.

    LOCK MANAGEMENT:
    acquireSyncLock(lockPath: string, machineId: string, maxWaitMs?: number, retryIntervalMs?: number): boolean — Creates lock file with JSON { machine_id, acquired_at, pid }. If lock exists and < 2 min old, waits and retries. If > 2 min (stale), removes and acquires. Returns true on success.
    releaseSyncLock(lockPath: string): void — Removes lock file. Always succeeds.

    SYNC PROTOCOL:
    loadSyncConfig(configPath?: string): SyncConfig — Reads ~/.forge/sync_config.json. Returns defaults if missing.
    syncForgeMemory(direction: 'pull'|'push', localDbPath: string, masterDbPath: string, machineId: string): { synced: number, tables: string[] } — 
      PULL: Open read-only connection to master. For each table, SELECT WHERE machine_id != local AND created_at > lastSync. INSERT OR IGNORE into local.
      PUSH: Acquire lock. For each table, SELECT local WHERE machine_id = local AND created_at > lastSync. INSERT OR IGNORE into master. Release lock in finally block.
    getLastSyncTimestamp(dbPath: string): string — From forge_meta. Returns epoch if not set.
    setLastSyncTimestamp(dbPath: string, timestamp: string): void — Updates forge_meta.

    CRITICAL: Lock MUST be released in finally block. All operations INSERT OR IGNORE (append-only). If master path inaccessible, log warning and return { synced: 0, tables: [] }. Never fail a build because external drive isn't mounted.

    ACCEPTANCE CRITERIA:
    - Lock management works correctly (create, detect stale, release)
    - Graceful degradation when master path doesn't exist
    - npx tsc --noEmit passes with 0 errors

    FILE MANIFEST — CREATE:
    src/learning/sync.ts

    VERIFICATION:
    npx tsc --noEmit


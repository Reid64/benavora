  - id: wgr-142-sam-gov-rate-limit-handling
    prompt: |
      Fix SAM.gov rate limiting in src/lib/integrations/sam-gov-parser.ts
      
      Current issue: Parser hammers SAM.gov without respecting rate limits (10 req/sec max).
      
      Implement exponential backoff:
      ```typescript
      const SAM_RATE_LIMIT = 10; // requests per second
      const MAX_RETRIES = 3;
      const BASE_DELAY = 100; // ms
      
      async function fetchSAMOpportunity(id: string, retries = 0): Promise<any> {
        try {
          const response = await fetch(`https://api.sam.gov/opportunities/v2/search?id=${id}&api_key=${SAM_API_KEY}`);
          
          if (response.status === 429) {
            if (retries < MAX_RETRIES) {
              const delay = BASE_DELAY * Math.pow(2, retries); // 100ms, 200ms, 400ms
              console.log(`Rate limited. Retrying in ${delay}ms...`);
              await new Promise(resolve => setTimeout(resolve, delay));
              return fetchSAMOpportunity(id, retries + 1);
            } else {
              throw new Error('SAM.gov rate limit exceeded after retries');
            }
          }
          
          if (!response.ok) throw new Error(`SAM.gov error: ${response.status}`);
          return response.json();
        } catch (error) {
          await logIntegrationError('sam_gov', id, error.message);
          throw error;
        }
      }
      
      // Batch requests with throttle
      export async function parseSAMOpportunities(ids: string[]) {
        const results = [];
        for (const id of ids) {
          results.push(await fetchSAMOpportunity(id));
          // Throttle: enforce minimum 100ms between requests
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        return results;
      }
      ```
      
      Test: Feed 50 SAM.gov IDs, verify all succeed without 429 errors.

  - id: wgr-143-sam-gov-error-recovery
    prompt: |
      Add error classification and recovery logic to SAM.gov parser.
      
      Create src/lib/integrations/error-classifier.ts:
      
      ```typescript
      export enum IntegrationErrorType {
        RATE_LIMIT = 'rate_limit',
        NETWORK = 'network',
        PARSING = 'parsing',
        API_KEY = 'api_key_invalid',
        MALFORMED_RESPONSE = 'malformed_response',
        TRANSIENT = 'transient'
      }
      
      export function classifyError(error: any): {
        type: IntegrationErrorType,
        recoverable: boolean,
        recommendedAction: string
      } {
        if (error.response?.status === 429) {
          return {
            type: IntegrationErrorType.RATE_LIMIT,
            recoverable: true,
            recommendedAction: 'retry_with_backoff'
          };
        }
        
        if (error.code === 'ECONNREFUSED' || error.code === 'ENOTFOUND') {
          return {
            type: IntegrationErrorType.NETWORK,
            recoverable: true,
            recommendedAction: 'retry_with_exponential_backoff'
          };
        }
        
        if (error.response?.status === 401) {
          return {
            type: IntegrationErrorType.API_KEY,
            recoverable: false,
            recommendedAction: 'verify_api_key'
          };
        }
        
        if (error.response?.status >= 500) {
          return {
            type: IntegrationErrorType.TRANSIENT,
            recoverable: true,
            recommendedAction: 'retry_later'
          };
        }
        
        return {
          type: IntegrationErrorType.PARSING,
          recoverable: false,
          recommendedAction: 'log_and_skip'
        };
      }
      ```
      
      Use in parser:
      ```typescript
      const { type, recoverable, recommendedAction } = classifyError(error);
      
      if (recoverable) {
        logEvent('integration_error', { source: 'sam_gov', type, action: recommendedAction });
        // Retry logic
      } else {
        logEvent('integration_error_fatal', { source: 'sam_gov', type });
        // Skip and continue
      }
      ```


  - id: autosave-keystroke-timer
    prompt: |
      Implement auto-save for user-created content (CRITICAL BUG: manual save only).
      
      File: src/lib/autosave.ts
      
      ```typescript
      export function useAutoSave(
        content: any,
        onSave: (draft: any) => Promise<void>,
        options?: { interval?: number; debounce?: number }
      ) {
        const interval = options?.interval || 30000; // Auto-save every 30s
        const debounce = options?.debounce || 1000; // Wait 1s after last keystroke
        
        const [isSaving, setIsSaving] = useState(false);
        const [lastSaved, setLastSaved] = useState<Date | null>(null);
        const debouncedSaveRef = useRef<NodeJS.Timeout | null>(null);
        const autoSaveIntervalRef = useRef<NodeJS.Timeout | null>(null);
        
        // Keystroke auto-save
        const handleChange = useCallback(async (newContent: any) => {
          if (debouncedSaveRef.current) {
            clearTimeout(debouncedSaveRef.current);
          }
          
          debouncedSaveRef.current = setTimeout(async () => {
            setIsSaving(true);
            try {
              await onSave(newContent);
              setLastSaved(new Date());
            } catch (error) {
              console.error('Keystroke auto-save failed:', error);
            } finally {
              setIsSaving(false);
            }
          }, debounce);
        }, [onSave, debounce]);
        
        // Timer auto-save (every 30s even if no keystroke)
        useEffect(() => {
          autoSaveIntervalRef.current = setInterval(async () => {
            setIsSaving(true);
            try {
              await onSave(content);
              setLastSaved(new Date());
            } catch (error) {
              console.error('Interval auto-save failed:', error);
            } finally {
              setIsSaving(false);
            }
          }, interval);
          
          return () => {
            if (autoSaveIntervalRef.current) {
              clearInterval(autoSaveIntervalRef.current);
            }
          };
        }, [content, interval, onSave]);
        
        return { isSaving, lastSaved };
      }
      ```
      
      Apply to:
      - Application drafts
      - Knowledge base entries
      - Document uploads (as metadata)
      - Grant narrative editor
      
      UI indicator: "Saving..." / "Saved at 2:35 PM"

  - id: rls-hardening-suppression-list
    prompt: |
      Add RLS policies to suppress suppression_list table (CAN-SPAM compliance).
      
      Current state: no RLS on suppression_list, allowing org A to see org B's suppressed emails.
      
      ```sql
      ALTER TABLE suppression_list ENABLE ROW LEVEL SECURITY;
      
      CREATE POLICY suppression_list_tenant_isolation ON suppression_list
        USING (organization_id = (
          SELECT organization_id FROM profiles WHERE id = auth.uid()
        ));
      
      CREATE POLICY suppression_list_insert ON suppression_list
        FOR INSERT WITH CHECK (
          organization_id = (
            SELECT organization_id FROM profiles WHERE id = auth.uid()
          )
        );
      ```
      
      Verify: Test org A cannot query org B's suppressed emails.


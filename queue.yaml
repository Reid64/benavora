- id: deploy
  name: "Deploy to production"
  prompt_type: deploy
  dependencies: [tests-e2e, tests-api]
  governance_refs: [BLUEPRINT.md]
  estimated_tokens: 5300
  context_injection:
    schema_sections: []
    behavioral_sections: []
    interaction_maps: []
  description: |
    Deploy the application following the FORGE deployment protocol: tsc --noEmit → build → deploy → tests pass 10/10. Ensure every required environment variable is set: AGENT_RETRY_DELAY_MS, AGENT_TIMEOUT_MS, ANTHROPIC_API_KEY, CRON_SECRET, ELIGIBILITY_SCORE_HIGH_THRESHOLD, ELIGIBILITY_SCORE_MODERATE_THRESHOLD, LOG_LEVEL, MAX_CONCURRENT_AGENTS, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_POSTHOG_HOST, NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_SUPABASE_URL, OPENAI_API_KEY, RESEND_API_KEY, SENTRY_AUTH_TOKEN, SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT, SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY, VERCEL_ENV, VERCEL_URL. Deploy config: Platform: Vercel (Next.js 14 App Router). Package manager: pnpm. Node.js runtime: 20.x LTS.

    Build command: `pnpm build` (runs `next build` with TypeScript strict checks and ESLint).
    Install command: `pnpm install --frozen-lockfile`.
    Output directory: `.next` (default Next.js output).

    Vercel project settings:
    - Framework preset: Next.js
    - Root directory: `/` (monorepo-style single app)
    - Environment variables: set per-environment in Vercel dashboard; sensitive keys marked as encrypted secrets.

    Edge/Serverless function regions: `iad1` (US East, primary); AI agent routes (`/api/research/run`, `/api/grants/[id]/rescore`, `/api/consensus/validate`) configured with `maxDuration: 300` seconds (Vercel Pro) to accommodate multi-agent parallel AI calls.

    Cron jobs (vercel.json):
    - `/api/cron/stale-runs` — schedule: `*/10 * * * *` (every 10 minutes) — marks research_runs with status='running' and started_at > 10 min ago as 'failed'. Protected by CRON_SECRET bearer token.
    - `/api/cron/alert-digest` — schedule: `0 8 * * *` (daily at 08:00 UTC) — triggers daily alert digest emails via Resend. Protected by CRON_SECRET bearer token.

    Supabase migrations: Applied via `supabase db push` in CI (GitHub Actions) before Vercel deploy completes. Migration files stored in `supabase/migrations/`. CI step: checkout → pnpm install → supabase db push → vercel deploy.

    Realtime: Supabase Realtime enabled on `research_run_agents` (for per-agent status cards) and `alerts` (for sidebar badge count). Realtime channels use row-level filter `organization_id=eq.{org_id}` to prevent cross-tenant data leakage.

    Static assets: Served via Vercel Edge CDN. Next.js Image Optimization enabled for all `<Image>` components.

    Headers (next.config.ts):
    - `X-Frame-Options: DENY`
    - `X-Content-Type-Options: nosniff`
    - `Referrer-Policy: strict-origin-when-cross-origin`
    - `Permissions-Policy: camera=(), microphone=(), geolocation=()`
    - `Content-Security-Policy`: script-src 'self' 'nonce-{nonce}' https://cdn.posthog.com; default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://api.openai.com https://app.posthog.com; frame-ancestors 'none'.. Abort the deploy if any gate fails — never force-push broken code.

    Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual codebase audit.


prompts:
  - id: nav-rename-autoapply
    category: ui
    prompt: |
      CODEBASE: C:\Users\manag\Documents\benavora
      TASK: Rename "Automation" to "AutoApply" everywhere in the application.
      STEPS:
      1. Read the sidebar nav component (likely src/components/layout/Sidebar.tsx or similar). Find the nav item labeled "Automation" and rename it to "AutoApply".
      2. Search the entire src/ directory for any other references to "Automation" as a nav label, page title, or breadcrumb. Rename all to "AutoApply".
      3. If there is a route folder at src/app/(dashboard)/automation, rename it to autoapply and update all internal links and imports.
      4. Verify build compiles: cd C:\Users\manag\Documents\benavora && pnpm build

      AFTER COMPLETION: Append to C:\Users\manag\Documents\benavora\STATE_OF_THE_BUILD.md a line noting nav-rename-autoapply completed.

  - id: fix-opportunity-detail-display
    category: ui
    prompt: |
      CODEBASE: C:\Users\manag\Documents\benavora
      PROBLEM: The opportunity detail page at /opportunities/[id] shows dashes (-) for all fields in the Overview tab even though the database has populated values for description, eligibility_requirements, amount_max, amount_min, amount_available, deadline, recurrence, geographic_restrictions, application_method, and required_documents. The list page at /opportunities correctly shows amounts and deadlines, proving data exists in Supabase. The detail page is either not querying those columns or not rendering them.
      STEPS:
      1. Read src/app/(dashboard)/opportunities/[id]/page.tsx
      2. Find the Supabase query that loads the opportunity record. Check the select() clause. It must include ALL columns: name, description, category, status, source, amount_available, amount_min, amount_max, deadline, recurrence, eligibility_requirements, required_documents, geographic_restrictions, application_method, url, eligibility_score, recommendation, recommendation_reasoning, discovered_at, created_at, updated_at, and opportunity_documents.
      3. Find the Overview tab rendering section. For each field, ensure there is a display element that renders the value when non-null. Currently all show "-" even when data exists.
      4. Details card (left): render DESCRIPTION (full text not truncated), DEADLINE (formatted date), RECURRENCE, GEOGRAPHIC RESTRICTIONS, ELIGIBILITY REQUIREMENTS (full text block scrollable if long), REQUIRED DOCUMENTS (render as list if text[] array).
      5. Funding card (right): render AMOUNT AVAILABLE, REQUEST RANGE (amount_min to amount_max), APPLICATION METHOD, URL (clickable link).
      6. Match the existing dark theme styling already in the codebase. Do not reference DESIGN_SYSTEM.md.
      7. Verify build: cd C:\Users\manag\Documents\benavora && pnpm build
      CRITICAL: Do not modify any data or queries on the list page. Only fix the detail page.
      AFTER COMPLETION: Append to C:\Users\manag\Documents\benavora\STATE_OF_THE_BUILD.md a line noting fix-opportunity-detail-display completed.

  - id: tighten-grants-gov-keywords
    category: agent
    prompt: |
      CODEBASE: C:\Users\manag\Documents\benavora
      PROBLEM: The Grants.gov research agent returns irrelevant federal grants. Bad examples in the DB: "Clinical Trials Phased Awards for Down syndrome Research", "State Criminal Alien Assistance Program (SCAAP)", "Assistive Technology Program for Farmers with Disabilities", "Centers of Excellence for Veteran Student Success", "National Defense Education Program (NDEP) STEM".
      Faith Foundation is a 508(c)(1)(a) serving emergency/transitional housing in rural Texas. Only relevant grants: housing, homelessness, reentry, addiction recovery, rural community development, CDBG, HOME program, ESG, CoC, faith-based initiatives, Texas programs.
      STEPS:
      1. Find the Grants.gov agent. Search for grants-gov, grants_gov, or grantsGov in src/lib/agents/. Read the file.
      2. Find the keyword/query parameters sent to the Grants.gov API. Replace the keyword list with ONLY these terms: "homeless housing", "transitional housing", "emergency shelter", "reentry housing", "recovery housing", "rural housing", "community development block grant", "HOME Investment Partnership", "Emergency Solutions Grant", "Continuum of Care", "faith-based community", "substance abuse recovery housing".
      3. If the API supports geographic filtering, add Texas or filter for grants available nationally or in Texas.
      4. ADD a post-fetch relevance scoring function BEFORE inserting any opportunity into the database:
         a. Score each result 0-100 based on keyword overlap with: housing, homeless, shelter, reentry, recovery, rural, community development, faith, Texas, nonprofit
         b. Check title and description against REJECT list: ["disability", "veteran education", "criminal alien", "STEM", "defense", "agriculture", "farmers", "fisheries", "NIH", "CDC", "NASA", "DOD research", "clinical trial"]
         c. Only insert opportunities with relevance score >= 40 AND no reject-list matches
         d. Log rejected grants to console with reason
      5. Do NOT delete existing irrelevant grants from the database.
      6. Verify build: cd C:\Users\manag\Documents\benavora && pnpm build
      AFTER COMPLETION: Append to C:\Users\manag\Documents\benavora\STATE_OF_THE_BUILD.md a line noting tighten-grants-gov-keywords completed with relevance filter details.

  - id: nofa-pdf-parsing-pipeline
    category: agent
    prompt: |
      CODEBASE: C:\Users\manag\Documents\benavora
      TASK: Build a PDF NOFA parsing pipeline that downloads federal grant PDFs and extracts structured data to enrich opportunity records.
      CONTEXT: A column called opportunity_documents (jsonb) stores PDF URLs from Grants.gov. These PDFs are the authoritative source for federal grants containing full eligibility, exact deadlines, funding amounts, geographic restrictions, and requirements. Currently stored but never parsed.
      STEPS:
      1. Find the opportunity_documents column. Search supabase/migrations/ for any migration adding opportunity_documents. If it does not exist in prod, create it: ALTER TABLE opportunities ADD COLUMN IF NOT EXISTS opportunity_documents jsonb DEFAULT '[]'.
      2. Install pdf-parse: cd C:\Users\manag\Documents\benavora && pnpm add pdf-parse && pnpm add -D @types/pdf-parse
      3. Create src/lib/agents/nofa-parser.ts:
         a. Accept an opportunity ID as input
         b. Query the opportunity record for opportunity_documents URLs
         c. For each PDF URL: download via fetch (30s timeout), parse text with pdf-parse, send to Claude API with prompt: "Extract from this NOFA: description (2-3 sentences), eligibility_requirements, amount_available, amount_min, amount_max, deadline (ISO date), geographic_restrictions, application_method, required_documents (string array), recurrence, key_priorities (string array). Return JSON only."
         d. Parse Claude response. UPDATE opportunity: only overwrite fields where current DB value is null or empty. Never overwrite populated data.
         e. Log to agent_runs table with agent_type government_research.
      4. Create API route at src/app/api/agents/nofa-parser/route.ts: POST handler accepting opportunityId, requires auth, calls nofa-parser agent, returns success and enrichedFields array. Set maxDuration = 300.
      5. Create a batch function that processes all opportunities where opportunity_documents is not null AND description is null.
      6. Verify build: cd C:\Users\manag\Documents\benavora && pnpm build
      DO NOT build any UI in this prompt.
      AFTER COMPLETION: Append to C:\Users\manag\Documents\benavora\STATE_OF_THE_BUILD.md a line noting nofa-pdf-parsing-pipeline completed.

  - id: opportunity-documents-ui
    category: ui
    prompt: |
      CODEBASE: C:\Users\manag\Documents\benavora
      TASK: Add a Documents section to the opportunity detail page and a Parse NOFA button that triggers the PDF parsing pipeline.
      STEPS:
      1. Read src/app/(dashboard)/opportunities/[id]/page.tsx
      2. Find opportunity_documents in the loaded data (jsonb with PDF URLs from Grants.gov)
      3. Add a Documents section below existing Overview content:
         a. List all PDF URLs from opportunity_documents as clickable links with a PDF icon, opening in new tab
         b. Show filename extracted from URL or label "NOFA Document"
      4. Add a "Parse NOFA" button matching existing Edit/Delete button styling:
         a. On click: POST to /api/agents/nofa-parser with the opportunity ID
         b. Show loading spinner while processing (30-120 seconds expected)
         c. On success: refresh page data to show newly enriched Overview fields
         d. On failure: show error toast or alert
      5. If opportunity_documents is null or empty, show "No NOFA documents available"
      6. Match existing dark theme styling in the codebase.
      7. Verify build: cd C:\Users\manag\Documents\benavora && pnpm build
      AFTER COMPLETION: Append to C:\Users\manag\Documents\benavora\STATE_OF_THE_BUILD.md a line noting opportunity-documents-ui completed. Also update SESSION_STATE.md with current session status.

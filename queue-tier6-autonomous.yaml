  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/funders/relationship-scores/route.ts

- id: t6-026
  name: Final Tier 6 verification deploy and complete governance update
  prompt: "Run a complete build verification across everything built in the Tier 6 queue. Run pnpm tsc --noEmit. If any TypeScript errors exist, fix them all before proceeding. Then run pnpm run build. If build fails, diagnose and fix all errors. After clean build: verify the following files all exist using find commands: src/lib/sources/grantsgov-client.ts, src/lib/sources/samgov-client.ts, src/lib/sources/propublica-990-client.ts, src/lib/intelligence/foundation-profiler.ts, src/lib/intelligence/success-probability.ts, src/lib/intelligence/competitor-intel.ts, src/lib/intelligence/semantic-matcher.ts, src/lib/intelligence/deadline-predictor.ts, src/lib/intelligence/relationship-scorer.ts, src/lib/autoapply/captcha-solver.ts, src/lib/notifications/notify.ts, src/lib/reports/board-report-generator.ts, src/lib/sources/state-portals/portal-scraper.ts. Count total routes in src/app/api/ and report. Count total pages in src/app/(dashboard)/ and report. Run git add -A then git commit -m 'feat: Tier 6 complete - full autonomous operation layer'. Then git push. Then vercel --prod --yes. Wait for deployment confirmation. Update STATE_OF_THE_BUILD.md with complete current state: list every built feature, every migration number applied, total route count, total page count, foundation_directory row count, alias count, current deployment URL. Update SESSION_STATE.md with next session priorities: verify all Tier 6 features live in production, run enrich:propublica-batch, run poll:grantsgov and poll:samgov, test white-label portal, set up first consultant client account."
  gates:
  - type: compile
  - type: file_exists
    files:
    - STATE_OF_THE_BUILD.md
    - SESSION_STATE.md

project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - PAGE_TREATMENT_PROTOCOL.md
  - governance/DESIGN_SYSTEM.md
  - FEATURE_REGISTRY_v2.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

prompts:

  - id: page-reports-001
    phase: build
    description: "/reports - violet #7C3AED"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL.md and apply it to /reports.
      Section: Intelligence & Reports. Accent: #7C3AED (violet).
      Page-specific notes: the three report-type cards (Grant/Financial/Activity Reports)
      each have their own colored left-border accent already (blue/green/violet per card) -
      preserve that per-card differentiation, only the page header and "Generate Board
      Report" button take the section accent/fixed teal.
    expected_outputs: [src/app/(dashboard)/reports/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-reports-simulator-001
    phase: build
    description: "/reports/simulate - violet #7C3AED"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL.md and apply it to /reports/simulate.
      Section: Intelligence & Reports. Accent: #7C3AED.
      Page-specific notes: the Scenario Builder's 6 selectable cards (Board Expansion/Staff
      Hire/Geographic Expansion/New Program/Budget Increase/Partnership) each have distinct
      icon colors - keep them distinct, only the selected-state border and "Run Simulation"
      button take the section treatment. "No simulations yet" needs empty-state polish.
    expected_outputs: [src/app/(dashboard)/reports/simulate/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt


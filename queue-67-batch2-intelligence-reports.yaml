  - id: batch2-verify-sync-001
    phase: build
    description: "Final regression check and governance sync for Batch 2 (17 pages - the most neglected section)"
    prompt: |
      1. Run a real Playwright pass across all 17 pages from this batch, confirm every one
         loads clean, carries the violet section accent correctly, semantic colors (severity,
         completeness, disaster urgency) were preserved where the individual prompts specified,
         and the locked Competitor Intelligence page's paywall still works.
      2. Run pnpm run build and pnpm tsc --noEmit, fix any errors.
      3. Update FEATURE_REGISTRY_v2.md and governance/DESIGN_SYSTEM.md documenting all 17
         Intelligence & Reports pages as complete.
      4. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md - explicit about whether the
         Relationship Graph page (unverified from screenshots, real state discovered during
         this batch) needed anything unusual, and honest about any page that needed a real fix.
      5. Scoped git add, commit with message "feat: apply section-based accent + empty-state
         polish to all 17 Intelligence & Reports pages (batch 2 of 4)", git push.
    expected_outputs: [FEATURE_REGISTRY_v2.md, STATE_OF_THE_BUILD.md, SESSION_STATE.md]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

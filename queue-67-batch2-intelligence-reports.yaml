      Page-specific notes: currently all-empty state (0 applications tracked, "No ROI
      insights yet, AG-39 needs at least 10 tracked submissions") - apply full empty-state
      polish per protocol, including the 3 sub-chart placeholders (Win Rate by Day, Word
      Count, Attachment Impact).
    expected_outputs: [src/app/(dashboard)/reports/roi/page.tsx]
    gates: [{type: compile}, {type: build}]

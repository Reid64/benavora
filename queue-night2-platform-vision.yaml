- id: ecc-001
  name: Executive Command Center page
  prompt: "Read src/app/(dashboard)/dashboard/page.tsx in full for data fetching patterns. Create src/app/(dashboard)/command-center/page.tsx. This is the Executive Command Center — a full-screen operations dashboard for ED/CEO/Development Director. Owner and admin roles only — redirect viewer role to dashboard. Server component fetching all data server-side. Fetch in parallel: (1) opportunities count and top 5 by probability score. (2) applications count by stage. (3) discovery_matches count where status=pending. (4) reputation_alerts count where status=unread. (5) relationship_recommendations count where status=pending. (6) deadlines in next 30 days. (7) funding_forecasts latest for org. (8) Last 5 agent_runs with status. Layout: full viewport width, canvas backgroundColor #0F172A (dark navy). Title bar: 'Executive Command Center' white text, current date/time updating via useEffect. Grid of 6 panel cards each with: backgroundColor #1E293B, borderRadius 12px, padding 20px, border 1px solid rgba(255,255,255,0.08). Panel 1: Live Pipeline (opportunities by stage with counts and dollar values). Panel 2: Today's Priorities (discovery matches + reputation alerts + relationship recommendations with colored counts). Panel 3: Grant Probability Leaderboard (top 5 opportunities by score). Panel 4: Upcoming Deadlines (next 30 days timeline). Panel 5: AI Agent Status (last 5 runs with pass/fail status). Panel 6: Funding Forecast (projected range for next 90 days). All text white or rgba(255,255,255,0.7). Accent colors matching existing palette. Add Command Center link in sidebar for owner/admin only. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: executive command center'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/command-center/page.tsx


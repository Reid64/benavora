- id: a26-001
  name: A-26 Entity Schema Engine Implementation
  prompt: "Read AGENTS.md A-26 entry in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-26-entity-schema-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): (1) Read page and client data. (2) Build LocalBusiness schema: name from clients.business_name, address from clients NAP data, telephone E.164 format, url from page URL, serviceArea from cities. HARD PROHIBITIONS: no aggregateRating in LocalBusiness, no review property in LocalBusiness, schema must match visible page content. (3) Build Service schema for the page's service type. (4) If page has atomic facts from A-25: build FAQPage schema from fact_text entries formatted as Q&A. (5) Validate all schema JSON against schema.org requirements (required fields present, no prohibited properties). (6) Upsert to page_entities. Return { schemas_created, validation_status }.\n\nWrite src\\app\\api\\agents\\a-26\\trigger\\route.ts with getOperatorContext() auth.\n\nWrite tests\\unit\\agents\\a-26.test.ts: 4 tests including prohibition enforcement.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-26 Entity Schema Engine implementation'; git push origin main. Report commit hash."

prompts:
- id: a21-001
  name: A-21 Hyperlocal Geographic Engine Schema
  prompt: "Read AGENTS.md A-21 entry in full before writing anything.\n\nWrite migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728300000_a21_hyperlocal.sql:\nCREATE TABLE IF NOT EXISTS neighborhoods (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, city_id UUID REFERENCES cities(id), name TEXT NOT NULL, zip_code TEXT, county TEXT, state TEXT NOT NULL, parcel_density_class TEXT CHECK (parcel_density_class IN ('residential','commercial','mixed','rural')), topology_class TEXT CHECK (topology_class IN ('urban','suburban','rural','coastal')), median_property_value INTEGER, permit_velocity TEXT, polygon_geojson JSONB, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS county_data_sources (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), county TEXT NOT NULL, state TEXT NOT NULL, tier INTEGER CHECK (tier IN (1,2,3)) NOT NULL DEFAULT 3, api_url TEXT, data_type TEXT, last_fetched_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS parcels (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), neighborhood_id UUID REFERENCES neighborhoods(id) ON DELETE CASCADE, parcel_id TEXT, address TEXT, parcel_type TEXT, building_year INTEGER, lot_size_sqft INTEGER, building_sqft INTEGER, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nALTER TABLE neighborhoods ENABLE ROW LEVEL SECURITY;\nALTER TABLE parcels ENABLE ROW LEVEL SECURITY;\nCREATE POLICY neighborhoods_operator ON neighborhoods FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY parcels_operator ON parcels FOR ALL TO authenticated USING (neighborhood_id IN (SELECT id FROM neighborhoods WHERE client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid())));\nsupabase db push.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-21 hyperlocal schema neighborhoods parcels county_data_sources'; git push origin main. Report commit hash."
  gates:
  - type: compile

- id: a21-002
  name: A-21 Hyperlocal Geographic Engine Implementation
  prompt: "Read AGENTS.md A-21 entry in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-21-hyperlocal-geographic-engine.ts\nExtends BaseAgent. Input: { client_id: string, county?: string, state?: string }. process(): (1) Fetch county_data_sources for client service area. If tier=3 return early with { tier_3_fallback: true, pages_queued: 0 }. (2) For tier 1/2: query neighborhoods for this client+county. (3) Classify each neighborhood: parcel_density_class from parcel data, topology_class from geographic indicators. (4) Generate page candidates for each neighborhood by inserting to page_generation_queue with intent='neighborhood', metadata including neighborhood_id, zip_code, topology_class. (5) Return { neighborhoods_processed, page_candidates_queued, tier_3_counties_skipped }.\n\nWrite src\\app\\api\\agents\\a-21\\trigger\\route.ts with getOperatorContext() auth.\n\nWrite tests\\unit\\agents\\a-21.test.ts: 5 tests: tier 3 county returns fallback, tier 1 generates page candidates, parcel density classified correctly, topology class assigned, page candidates inserted to queue.\n\npnpm tsc --noEmit 0 errors. Tests pass.\n\ngit add -A; git commit --no-verify -m 'feat: A-21 Hyperlocal Geographic Engine implementation'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-21-hyperlocal-geographic-engine.ts
    - src/app/api/agents/a-21/trigger/route.ts

- id: a25-a26-001
  name: A-25 AEO Atomic Fact Engine and A-26 Entity Schema Engine Schema
  prompt: "Read AGENTS.md entries for A-25 and A-26 in full.\n\nWrite migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728310000_a25_a26_aeo.sql:\nCREATE TABLE IF NOT EXISTS page_atomic_facts (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, fact_type TEXT CHECK (fact_type IN ('permit_requirement','hoa_prevalence','local_regulation','service_stat','testimonial_claim','certification_claim')) NOT NULL, fact_text TEXT NOT NULL, source TEXT, verified BOOLEAN NOT NULL DEFAULT false, voice_answer_summary TEXT, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS page_entities (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, entity_type TEXT CHECK (entity_type IN ('LocalBusiness','Service','FAQPage','HowTo','Review')) NOT NULL, schema_json JSONB NOT NULL, validation_status TEXT CHECK (validation_status IN ('valid','invalid','pending')) DEFAULT 'pending', created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS voice_query_patterns (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, query_pattern TEXT NOT NULL, query_type TEXT CHECK (query_type IN ('near_me','how_to','who_provides','what_is','cost_query')) DEFAULT 'near_me', target_page_id UUID REFERENCES pages(id), created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nALTER TABLE page_atomic_facts ENABLE ROW LEVEL SECURITY;\nALTER TABLE page_entities ENABLE ROW LEVEL SECURITY;\nALTER TABLE voice_query_patterns ENABLE ROW LEVEL SECURITY;\nCREATE POLICY paf_operator ON page_atomic_facts FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY pe_operator ON page_entities FOR ALL TO authenticated USING (page_id IN (SELECT id FROM pages WHERE client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid())));\nCREATE POLICY vqp_operator ON voice_query_patterns FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-25 A-26 AEO entity schema tables'; git push origin main. Report commit hash."
  gates:
  - type: compile

- id: a25-001
  name: A-25 AEO Atomic Fact Engine Implementation
  prompt: "Read AGENTS.md A-25 entry in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-25-aeo-atomic-fact-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): (1) Read page from pages table. (2) Read client service area (cities, county from neighborhoods). (3) Generate atomic facts using LLM: permit requirements (query municipal context from neighborhoods.permit_velocity), HOA prevalence from topology_class, local regulation context. Each fact is 40-60 words suitable as a voice search direct answer. (4) Generate voice_answer_summary for the page: 40-50 word direct answer to 'who provides [service] in [city]'. (5) Upsert to page_atomic_facts. (6) Return { facts_created, voice_answer_summary }.\n\nWrite src\\app\\api\\agents\\a-25\\trigger\\route.ts with getOperatorContext() auth.\n\nWrite tests\\unit\\agents\\a-25.test.ts: 4 tests.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-25 AEO Atomic Fact Engine implementation'; git push origin main. Report commit hash."

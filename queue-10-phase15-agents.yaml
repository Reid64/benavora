- id: a27-001
  name: A-27 Voice Search Optimization Engine Implementation
  prompt: "Read AGENTS.md A-27 entry in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-27-voice-search-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): (1) Read A-25 atomic facts for page from page_atomic_facts. (2) Read A-26 entity schema from page_entities. (3) Validate Speakable cssSelector would resolve (static check that content has identifiable selectors). (4) Validate voice_answer_summary is 40-50 words. (5) Generate voice keyword variants: take typed keywords from pages table, append 'near me', 'how to', 'who provides' variants. (6) Upsert voice_query_patterns for client+page. (7) Compute voice optimization score 0-100 based on: has voice_answer_summary (+30), summary 40-50 words (+20), speakable schema present (+25), voice keywords generated (+25). (8) Return { voice_score, patterns_created, validation_issues }.\n\nWrite src\\app\\api\\agents\\a-27\\trigger\\route.ts with getOperatorContext() auth.\n\nWrite tests\\unit\\agents\\a-27.test.ts: 4 tests.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-27 Voice Search Optimization Engine implementation'; git push origin main. Report commit hash."

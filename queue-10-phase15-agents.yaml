- id: a32-a33-001
  name: A-32 Content Seed Variation Engine and A-33 Schema Markup Scrambler
  prompt: "Read AGENTS.md entries for A-32 and A-33 in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-32-content-seed-variation-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string, seed_template?: string }. process(): (1) Parse seed template into semantic blocks: intro, services, benefits, CTA. If no seed_template use page generated_content. (2) For each block generate 3 variations using LLM with instruction 'Rewrite this paragraph maintaining tone facts and structure but varying sentence structure word choice and phrasing. Avoid clichés.' (3) Per page select one variation per block using deterministic seed hash(client_id + page_id). (4) Ensure no two pages for same client use identical block sequences via hash comparison against content_variations. (5) Return { blocks_varied, variations_generated, hash_conflicts_avoided }.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-33-schema-scrambler.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): Read page_entities schemas for page. For each schema: (1) Randomize JSON key order (sort keys by hash(key + page_id)). (2) Vary phone format (pick one of 3 formats using hash). (3) Vary date formats. (4) Inject optional properties at 80%/60% rates using page_id hash. (5) Validate schema remains valid. (6) Update page_entities with scrambled JSON. Return { schemas_scrambled, validation_passed }.\n\nWrite trigger routes for both. Write 3 tests each.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-32 A-33 content variation schema scrambler'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-32-content-seed-variation-engine.ts
    - src/lib/agents/a-33-schema-scrambler.ts

- id: a34-a35-001
  name: A-34 Image Metadata Randomizer and A-35 Component Variation Engine
  prompt: "Read AGENTS.md entries for A-34 and A-35 in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-34-image-metadata-randomizer.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): (1) For each image referenced in page content, generate 5 alt text variations per image type using deterministic selection via hash(image_url + page_id). (2) Vary title attribute similarly. (3) Store in a simple JSONB column or dedicated table — check SCHEMA_REGISTRY.md for image_metadata_variations table, create if missing. (4) Verify no two pages for same client+image use identical alt text. Return { images_processed, variations_assigned }.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-35-component-variation-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. Implements 11 variation axes per AGENTS.md spec. Uses deterministic seed hash(client_id + page_id). Hard constraints enforced: (1) Conversion form always above-the-fold. (2) Brand colors from client config. (3) TCPA text immutable. (4) WCAG 2.1 AA compliance assumed (no color contrast changes). Returns variation_tuple with axis values. Logs to page_fingerprint_log (create table if missing in migration).\n\nWrite trigger routes. Write 3 tests each.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-34 A-35 image metadata randomizer component variation engine'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-34-image-metadata-randomizer.ts
    - src/lib/agents/a-35-component-variation-engine.ts

- id: a36-a37-a38-001
  name: A-36 Internal Link Shuffler A-37 Publish Cadence Jitter A-38 HTTP Fingerprint
  prompt: "Read AGENTS.md entries for A-36 A-37 A-38 in full.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-36-internal-link-shuffler.ts\nExtends BaseAgent. Input: { client_id: string }. process(): For each published page: get A-06 baseline links. Inject 1-2 additional links randomly (to blog, other cities, FAQ) using hash(page_id) for determinism. Vary anchor text per page using rotation array ['roofing services','expert roofers','professional roofing','local roofers','top roofing']. Ensure no two pages have identical link sets via graph hash. Upsert to internal_links. Return { pages_processed, links_varied }.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-37-publish-cadence-jitter.ts\nExtends BaseAgent. Input: { client_id: string, pages_to_publish: string[] }. process(): Apply ±30 minute jitter to each page publish time using hash(page_id + Date.now()). Never publish more than 15 pages per day per client (2026 Google scaled-content-abuse compliance). Update page_generation_queue scheduled_at with jittered times. Return { pages_scheduled, jitter_applied_minutes }.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-38-http-fingerprint-diffusion.ts\nExtends BaseAgent. Input: { page_id: string }. process(): Compute diffusion values from hash(page_id): cache_ttl between 3600-5400 seconds, last_modified_jitter ±12 hours within last 30 days, etag_format one of 3 formats. Store as page metadata. These values are read by Next.js middleware to set response headers. Return { cache_ttl, last_modified_offset, etag_format }.\n\nWrite trigger routes for all three. Write 3 tests each.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-36 A-37 A-38 link shuffler cadence jitter HTTP fingerprint'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-36-internal-link-shuffler.ts
    - src/lib/agents/a-37-publish-cadence-jitter.ts
    - src/lib/agents/a-38-http-fingerprint-diffusion.ts

- id: a46-001
  name: A-46 Directory Registration Agent
  prompt: "Read AGENTS.md A-46 entry in full.\n\nWrite migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728320000_a46_directory.sql:\nCREATE TABLE IF NOT EXISTS directory_registry (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), name TEXT NOT NULL, url TEXT NOT NULL, tier TEXT CHECK (tier IN ('A','B','C')) NOT NULL, track TEXT CHECK (track IN ('A','B','C')) NOT NULL DEFAULT 'B', dr_score INTEGER, api_endpoint TEXT, requires_oauth BOOLEAN DEFAULT false, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS directory_submissions (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, directory_id UUID NOT NULL REFERENCES directory_registry(id), page_id UUID REFERENCES pages(id), submission_status TEXT CHECK (submission_status IN ('pending','submitted','confirmed','rejected','manual_required')) DEFAULT 'pending', submitted_at TIMESTAMPTZ, confirmation_ref TEXT, operator_review_required BOOLEAN DEFAULT false, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nALTER TABLE directory_submissions ENABLE ROW LEVEL SECURITY;\nCREATE POLICY dir_submissions_operator ON directory_submissions FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-46-directory-registration-agent.ts\nExtends BaseAgent. Input: { client_id: string, page_id: string }. process(): (1) Fetch Tier A Track A directories from directory_registry. (2) For each: build submission payload from client NAP data + page URL. (3) For Track A directories with api_endpoint: POST to API with payload. (4) For Track B/C: insert to directory_submissions with operator_review_required=true. (5) Update submission status. Return { track_a_submitted, track_bc_queued }.\n\nWrite trigger route and 3 tests.\n\npnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-46 Directory Registration Agent schema and implementation'; git push origin main. Report commit hash."

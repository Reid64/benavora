name: Deploy Check

on:
  push:
    branches: [main]
  workflow_dispatch:

# Re-enabled 2026-08-07 after a 25-consecutive-failed-Vercel-deploy incident
# (DEPLOY_FAILURE_STRUCTURAL_AUDIT.md) — this exact job would have caught it,
# the trigger was just off. Originally detached from `push` on 2026-07-17
# (commit 8b8c991) alongside a real pnpm version-pin conflict fix (f256861,
# same day); that conflict is confirmed still fixed (package.json's
# `packageManager: "pnpm@9.0.0"` matches pnpm-lock.yaml's `lockfileVersion:
# '9.0'`, and the hardcoded `pnpm/action-setup@v4` version pin f256861
# removed was never re-added) — re-enabling `push` does not reintroduce it.
# The real reason for the original detachment was volume: many commits in
# quick succession each queued their own full run. Guarded against here via
# `concurrency` instead of disabling the gate entirely — a new push
# cancels any still-running check for the same branch rather than queuing
# behind it.
concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 2026-09-19: WAS `node-version: 18`, unchanged since this file was
          # created on 2026-07-17, and it is the root cause of EVERY GitHub
          # Actions failure on this repo since then. undici@7.28.0 (pulled in
          # by cheerio@1.2.0, in pnpm-lock.yaml since 803510de on 2026-06-21)
          # dereferences the global `File` at module load. `File` does not
          # exist in Node 18. Reproduced 2026-09-19 on a clean `git archive` of
          # origin/main with only this workflow's env vars:
          #     Node 18.20.8 -> pnpm build EXIT 1, ReferenceError: File is not defined
          #     Node 22.23.2 -> pnpm build EXIT 0, 408 pages
          # Every prior "fix" (OOM heap, anon keys, worktree gitlinks, the
          # service-role placeholder) was real but was verified on a Windows
          # machine running Node 24. Nobody ever ran a CI step under Node 18.
          # Do not lower this without running `pnpm build` on that version.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AR-8.1: cheap, fast-failing guard for the exact class of failure this
      # workflow spent weeks chasing (see the SUPABASE_SERVICE_ROLE_KEY block
      # below) - runs in seconds, before the 4-minute build, so a missing
      # `dynamic` export on a new admin route fails fast instead of after a
      # full build.
      - name: Guard - admin routes must be force-dynamic
        run: node scripts/audit/assert-admin-routes-dynamic.mjs

      # 2026-08-11: ubuntu-latest's default V8 heap limit (~2GB) OOM'd
      # partway through next build's lint/type-check phase on every single
      # run since re-enabling `push` above — including commits whose actual
      # Vercel build succeeded. That made this check fail unconditionally,
      # regardless of code correctness. Raised to 4GB, within ubuntu-latest's
      # available RAM.
      #
      # Fixing the OOM then surfaced a second, previously-masked failure:
      # this workflow never had NEXT_PUBLIC_SUPABASE_URL /
      # NEXT_PUBLIC_SUPABASE_ANON_KEY, which next build requires to
      # prerender any page that touches the Supabase client. These are the
      # public/anon values Next.js inlines into the client bundle by
      # design (RLS is the real access boundary, not secrecy of this key),
      # so storing them as repo secrets here is safe.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 2026-09-18: the actual cause of this workflow failing on EVERY push
          # since 2026-08-07. createAdminClient() (src/lib/supabase/admin.ts)
          # THROWS when SUPABASE_SERVICE_ROLE_KEY is absent, and 76 of the 83
          # files under src/app/ that call it had no `export const dynamic`, so
          # `next build` evaluated them and exited 1. Local builds passed the
          # whole time because .env.local carries the key.
          #
          # The 2026-08-11 comment above fixed exactly this class for the ANON
          # client and nobody checked the ADMIN client.
          #
          # This is a DELIBERATE PLACEHOLDER, not the real key. The real service
          # role key bypasses every RLS policy in the platform and must never
          # live in CI, where any workflow or compromised action could read it.
          # The build only needs the client constructor not to throw; nothing
          # here queries with it. If a build ever DOES query with it, that call
          # will 401 loudly - which is the correct outcome, not a silent pass.
          SUPABASE_SERVICE_ROLE_KEY: "ci-build-placeholder-not-a-real-key-do-not-use"

      - name: Report build result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build succeeded"
          else
            echo "❌ Build failed"
          fi

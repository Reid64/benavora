name: Daily Test Suite

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 2026-09-19: was 18. See deploy-check.yml for the full root cause -
          # undici@7 dereferences the global `File`, which Node 18 lacks, so
          # every run of this workflow has failed since it was created.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:unit

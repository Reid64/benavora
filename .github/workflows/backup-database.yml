name: Database Backup (S3)

# Off-provider backup: dumps prod Postgres and uploads it to
# s3://benavora-prod-backups, independent of Supabase PITR. See
# scripts/backup-database.ts and infra/aws/backup-bucket/README.md.
#
# Single 2 AM UTC cron, not two separate crons for "daily" and "weekly" —
# running pg_dump twice back-to-back at the same time would just double the
# load on prod for no benefit. Instead the job checks the UTC day-of-week and
# runs the weekly-tagged variant on Mondays; every other day runs the plain
# daily variant. Bucket versioning + the 90-day noncurrent-version lifecycle
# rule (provisioned in infra/aws/backup-bucket) is what actually enforces
# retention — this workflow only decides which S3 object tag today's dump
# gets.
on:
  # 2026-09-19: DAILY CRON DISABLED. This workflow was created on 2026-09-02
  # inside a ~100-file governance-docs commit and has fired at 02:00 UTC every
  # day since, generating one failure email per day. It requires repo secrets
  # AWS_BACKUP_ROLE_ARN and BACKUP_DATABASE_URL, an AWS OIDC trust
  # relationship, and the S3 bucket from infra/aws/backup-bucket/setup.sh.
  # There is no evidence anywhere in this repository that any of the three was
  # ever provisioned, and the FORGE gate that recorded this as verified passes
  # on failure: its success regex is "uploaded|backup" and the script's own
  # failure line is "[backup-database] FAILED: ...".
  #
  # A backup job that has never run is not a backup. Re-enable the schedule
  # ONLY after running infra/aws/backup-bucket/setup.sh, adding both secrets,
  # and confirming a manual workflow_dispatch run uploads an object to S3.
  #   schedule:
  #     - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: backup-database
  cancel-in-progress: false

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials OIDC
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 2026-09-19: was 18. See deploy-check.yml for the full root cause -
          # undici@7 dereferences the global `File`, which Node 18 lacks, so
          # every run of this workflow has failed since it was created.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install postgresql-client (pg_dump)
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Assume AWS backup role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Determine schedule tag
        id: schedule
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "npm_script=backup:database:weekly" >> "$GITHUB_OUTPUT"
          else
            echo "npm_script=backup:database" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm run ${{ steps.schedule.outputs.npm_script }}
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}

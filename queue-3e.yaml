  - id: infra-008
    phase: build
    description: "Create portal health monitoring script"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 4A (Portal Health Monitoring).

      Create C:\Users\manag\Documents\benavora\src\scripts\check-portal-health.ts:

      Add at the top: import dotenv from 'dotenv'; dotenv.config({ path: '.env.local' });
      Use ws package for Supabase WebSocket transport.

      This standalone script checks all giving_portal_urls for health status.

      Steps:
      1. Query funders table for all records with giving_portal_url IS NOT NULL.
      2. Accept --limit flag for testing.
      3. For each funder:
         a. Send a HEAD request with a 10-second timeout. Use a browser-like User-Agent.
         b. Record: status_code, response_time_ms, redirect_url (if 301/302).
         c. Classify: 'active' (200-299), 'redirect' (301/302), 'requires_login' (401/403), 'dead' (404/500/timeout), 'error' (network error).
         d. UPDATE funders SET portal_status = classification, portal_last_checked_at = NOW(), portal_response_time_ms = response_time.
         e. If redirect: also update giving_portal_url to the redirect target.
      4. Log progress: "Checked {n}/{total}: {funderName} — {status} ({response_time}ms)"
      5. Summary at end: "Active: X, Redirect: Y, Dead: Z, Error: W"
      6. Add 500ms delay between requests to avoid flooding.

      Run with: npx tsx src/scripts/check-portal-health.ts --limit 50

      Also create C:\Users\manag\Documents\benavora\worker\portal-health.ts:
      - Export async function quickHealthCheck(url: string): Promise<'active' | 'dead' | 'redirect' | 'unknown'>
      - Simple HEAD request with 5-second timeout.
      - Used by queue-processor before launching full browser for a submission.
      - Import in queue-processor: before processItem launches StealthBrowser, call quickHealthCheck. If 'dead', skip with reason 'portal_dead'.
    expected_outputs:
      - src/scripts/check-portal-health.ts
      - worker/portal-health.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt


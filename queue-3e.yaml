  - id: infra-001
    phase: build
    description: "Create proxy rotation manager and integrate with StealthBrowser"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 1A (Rotating Residential Proxy Network).
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts completely.

      Create C:\Users\manag\Documents\benavora\worker\proxy-manager.ts:

      Export class ProxyManager with:

      constructor(config: { provider: string, apiKey: string, poolSize?: number }):
      - Store config. Provider can be 'brightdata', 'smartproxy', 'iproyal', or 'static' (for a hardcoded list).

      async loadProxies(): Promise<void>
      - For 'static' provider: read from PROXY_LIST env var (comma-separated proxy URLs).
      - For API providers: fetch proxy list from provider API. For now, implement only 'static' — the API integrations are future work. Log a warning for unsupported providers.
      - Store proxies in an internal array.

      getProxy(region?: string): string | null
      - Return a proxy URL from the pool, preferring geographic match if region is provided.
      - Round-robin through the pool to avoid reusing the same proxy consecutively.
      - Return null if pool is empty (system runs without proxy as fallback).

      markFailed(proxyUrl: string): void
      - Remove proxy from active pool for 30 minutes. Track failure count per proxy. After 3 failures, remove permanently until pool refresh.

      rotateForSubmission(): string | null
      - Get next proxy, ensuring it wasn't used in the last 5 submissions (track recent usage).
      - Return null if no suitable proxy available.

      getStats(): { total: number, active: number, failed: number }

      Then modify C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts:

      Add an optional proxy parameter to the launch method:
      - Accept { proxy?: string } in the launch options.
      - Pass to Playwright: chromium.launch({ proxy: { server: proxy } }) when provided.
      - If no proxy provided, launch without proxy (existing behavior).

      Then modify C:\Users\manag\Documents\benavora\worker\queue-processor.ts:
      - Import ProxyManager.
      - Initialize ProxyManager at startup (read PROXY_PROVIDER, PROXY_API_KEY from env).
      - Before each submission, call proxyManager.rotateForSubmission().
      - Pass the proxy to StealthBrowser.launch({ proxy }).
      - On submission failure that looks like IP block (403, 429, "blocked", "suspicious"), call proxyManager.markFailed().
      - If no proxy available (null), proceed without proxy (graceful degradation).
    expected_outputs:
      - worker/proxy-manager.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-002
    phase: build
    description: "Enhance StealthBrowser with full browser profile isolation per submission"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 1B (Multi-Browser Profile Isolation).
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts completely.

      Enhance StealthBrowser to create a fully isolated browser context per submission:

      1. Each call to launch() should create a new browser context (browser.newContext()) with randomized:
         - viewport: randomly selected from common resolutions: [1920x1080, 1366x768, 1440x900, 1536x864, 1280x720]
         - timezone: if proxy region is available, match timezone to region. Otherwise random from a pool of US timezones.
         - locale: match to timezone region. Default 'en-US'.
         - geolocation: approximate lat/lng matching the timezone region (optional, can be null).
         - userAgent: already handled by existing stealth plugin, but verify it rotates per context.

      2. Ensure complete isolation: no shared cookies, localStorage, or cache between contexts. After each submission, call context.close() (not just page.close()).

      3. Add a method: getContextFingerprint(): object — returns the current context's randomized profile for logging/audit purposes.

      4. Do NOT break any existing StealthBrowser functionality. The existing API must work the same — these enhancements are additive.
    expected_outputs:
      - src/lib/autoapply/stealth-browser.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-003
    phase: build
    description: "Create CAPTCHA detection and 2Captcha solving integration"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md and the original Phase 3E plan.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\captcha-solver.ts:

      Import Solver from '@2captcha/captcha-solver'. Use lazy initialization (do NOT instantiate at module level).

      Export class CaptchaSolver with:

      constructor(): Lazy-init Solver with process.env.TWOCAPTCHA_API_KEY.

      async detectCaptcha(page: any): Promise<CaptchaDetection | null>
      - Check for reCAPTCHA: look for iframe[src*="recaptcha"], .g-recaptcha, #recaptcha
      - Check for hCaptcha: look for iframe[src*="hcaptcha"], .h-captcha
      - Check for Cloudflare Turnstile: look for .cf-turnstile, iframe[src*="challenges.cloudflare.com"]
      - Return { type: 'recaptcha_v2' | 'recaptcha_v3' | 'hcaptcha' | 'turnstile' | null, siteKey: string | null, pageUrl: string }
      - Extract siteKey from the element's data-sitekey attribute or from iframe URL params.

      async solveCaptcha(detection: CaptchaDetection, page: any): Promise<string | null>
      - Based on detection.type, call the appropriate 2Captcha method:
        - recaptcha_v2: solver.recaptcha({ pageurl, googlekey: siteKey })
        - recaptcha_v3: solver.recaptcha({ pageurl, googlekey: siteKey, version: 'v3', action: 'submit' })
        - hcaptcha: solver.hcaptcha({ pageurl, sitekey: siteKey })
        - turnstile: solver.turnstile({ pageurl, sitekey: siteKey })
      - Return the solution token.
      - On failure, return null (do not throw).

      async injectSolution(page: any, detection: CaptchaDetection, token: string): Promise<void>
      - For reCAPTCHA: set document.getElementById('g-recaptcha-response').value = token, then call grecaptcha.getResponse callback.
      - For hCaptcha: similar injection pattern.
      - For Turnstile: inject into the response element.

      Export interface CaptchaDetection.

      Then modify C:\Users\manag\Documents\benavora\worker\queue-processor.ts:
      - Import CaptchaSolver.
      - In processItem, after page loads and before form filling:
        1. Call captchaSolver.detectCaptcha(page).
        2. If CAPTCHA detected AND TWOCAPTCHA_API_KEY is set: solve and inject.
        3. If CAPTCHA detected AND no API key: classify failure as 'captcha_blocked', do not retry.
        4. Log: "CAPTCHA detected: {type}, solving..." or "CAPTCHA detected: no solver configured".
      - If solving fails, classify as 'captcha_failed' (different from 'captcha_blocked').
    expected_outputs:
      - src/lib/autoapply/captcha-solver.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-004
    phase: build
    description: "Create funder credentials table and encrypted storage"
    prompt: |
      Create C:\Users\manag\Documents\benavora\supabase\migrations\050_funder_credentials.sql:

      -- Funder portal credentials (encrypted)
      CREATE TABLE IF NOT EXISTS funder_credentials (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        funder_id uuid NOT NULL REFERENCES funders(id) ON DELETE CASCADE,
        portal_url text NOT NULL,
        username text NOT NULL,
        encrypted_password text NOT NULL,
        mfa_secret text,
        login_method text NOT NULL DEFAULT 'form',
        last_login_at timestamptz,
        login_success boolean,
        notes text,
        created_at timestamptz DEFAULT NOW(),
        updated_at timestamptz DEFAULT NOW(),
        UNIQUE(organization_id, funder_id)
      );

      -- Screenshot audit trail
      CREATE TABLE IF NOT EXISTS autoapply_screenshots (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id) ON DELETE CASCADE,
        stage text NOT NULL,
        storage_path text NOT NULL,
        captured_at timestamptz DEFAULT NOW(),
        metadata jsonb DEFAULT '{}'
      );

      -- Human review queue
      CREATE TABLE IF NOT EXISTS autoapply_review_queue (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id) ON DELETE CASCADE,
        organization_id uuid NOT NULL,
        funder_id uuid NOT NULL,
        reason text NOT NULL,
        failure_count integer NOT NULL DEFAULT 0,
        status text NOT NULL DEFAULT 'pending',
        assigned_to uuid,
        resolved_at timestamptz,
        resolution_notes text,
        created_at timestamptz DEFAULT NOW()
      );

      -- Solicitation registrations
      CREATE TABLE IF NOT EXISTS solicitation_registrations (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id),
        state text NOT NULL,
        registration_number text,
        registered_at timestamptz,
        expires_at timestamptz,
        status text NOT NULL DEFAULT 'active',
        created_at timestamptz DEFAULT NOW()
      );

      -- Portal health columns
      ALTER TABLE funders ADD COLUMN IF NOT EXISTS portal_status text DEFAULT 'unknown';
      ALTER TABLE funders ADD COLUMN IF NOT EXISTS portal_last_checked_at timestamptz;
      ALTER TABLE funders ADD COLUMN IF NOT EXISTS portal_response_time_ms integer;

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\credential-manager.ts:

      Export class CredentialManager with:

      async storeCredentials(params: { organizationId, funderId, portalUrl, username, password }): Promise<void>
      - Encrypt password using Node.js crypto: AES-256-GCM with a key derived from process.env.CREDENTIAL_ENCRYPTION_KEY.
      - Store in funder_credentials table.

      async getCredentials(organizationId: string, funderId: string): Promise<{ username, password } | null>
      - Fetch from funder_credentials.
      - Decrypt password.
      - Return null if not found.

      async updateLastLogin(credentialId: string, success: boolean): Promise<void>

      NOTE: Migration 050 must be applied manually via Supabase SQL Editor.
    expected_outputs:
      - supabase/migrations/050_funder_credentials.sql
      - src/lib/autoapply/credential-manager.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-005
    phase: build
    description: "Create account registration agent for portals requiring login"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\form-analyzer-agent.ts to understand the existing agent pattern.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\credential-manager.ts.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\registration-agent.ts:

      Export class RegistrationAgent with:

      async detectRegistrationForm(page: any): Promise<RegistrationFormDetection | null>
      - Use Claude to analyze the page content and determine if it has a registration/signup form.
      - Look for: "sign up", "register", "create account", "new user", form fields for email + password + confirm password.
      - Return: { hasRegistrationForm, formSelector, fields: { email, password, confirmPassword, name, organization, phone, etc. } }
      - Return null if no registration form detected.

      async register(page: any, params: { orgName, orgEmail, orgPhone, contactName, contactEmail }): Promise<RegistrationResult>
      - Fill the detected registration form with org details.
      - Use a dedicated email for the email field: construct from params.contactEmail or use a configured apply@ address.
      - Generate a secure random password (16 chars, mixed case + numbers + symbols).
      - Submit the registration form.
      - Capture screenshots before and after submission.
      - Return { success, username: email used, password: generated password, confirmationRequired: boolean }

      async detectLoginForm(page: any): Promise<LoginFormDetection | null>
      - Detect login forms: "sign in", "log in", email + password fields, submit button.
      - Return form selector and field locations.

      async login(page: any, credentials: { username, password }): Promise<boolean>
      - Fill login form with stored credentials.
      - Submit and wait for navigation.
      - Detect success (dashboard/welcome page) vs failure (error message, same page).
      - Return true on success, false on failure.

      Then modify C:\Users\manag\Documents\benavora\worker\queue-processor.ts:
      - Import RegistrationAgent and CredentialManager.
      - In processItem, when encountering an 'account_required' scenario:
        1. Check CredentialManager for existing credentials.
        2. If credentials exist: attempt login.
        3. If no credentials: attempt registration, store credentials on success.
        4. If registration requires email confirmation: mark as 'awaiting_confirmation', skip for now.
        5. After successful login: proceed with form analysis and filling.
    expected_outputs:
      - src/lib/autoapply/registration-agent.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: infra-006

        4. After submission: captureAndUpload(page, 'post_submit', ...)
        5. On confirmation page: captureAndUpload(page, 'confirmation', ...)
        6. On error: captureAndUpload(page, 'error', ...) in the catch block.
      - Store screenshot paths in the autoapply_submissions record.
    expected_outputs:

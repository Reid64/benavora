project: forge-2
governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
prompts:

  - id: s5-schema
    name: Add sentinel_prime_runs and validation_events tables to Build Memory
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\learning\\database.ts in full to understand the existing schema pattern, ALL_FORGE_TABLES array, and CURRENT_SCHEMA_VERSION. Then add these two CREATE TABLE IF NOT EXISTS blocks inside initializeForgeMemory() after the existing System 3 tables. Table 1: sentinel_prime_runs (id TEXT PRIMARY KEY, build_run_id TEXT NOT NULL, prompt_id TEXT NOT NULL, prompt_index INTEGER NOT NULL, execution_monitor_result TEXT NOT NULL, decision_validator_result TEXT NOT NULL, governance_enforcer_result TEXT NOT NULL, composite_confidence REAL NOT NULL, halt_triggered INTEGER NOT NULL DEFAULT 0, halt_reason TEXT, out_of_scope_writes TEXT, contract_violations TEXT, intent_fulfillment_score REAL, gate_pass_score REAL, created_at TEXT NOT NULL). Table 2: validation_events (id TEXT PRIMARY KEY, sentinel_run_id TEXT NOT NULL, event_type TEXT NOT NULL, severity TEXT NOT NULL, artifact TEXT, description TEXT NOT NULL, auto_resolved INTEGER NOT NULL DEFAULT 0, resolution TEXT, created_at TEXT NOT NULL). Add both table names to ALL_FORGE_TABLES. Bump CURRENT_SCHEMA_VERSION from 2.3.0 to 2.4.0. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 confirm 0 TypeScript errors. Commit: git add -A; git commit -m 'feat(db): System 5 Sentinel Prime tables schema v2.4.0'."
    gates:
    - type: compile

  - id: s5-types
    name: Create System 5 Sentinel Prime type definitions
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\resurrection\\types.ts in full as the reference shape for type definition files. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts exporting these exact interfaces and enums: ObservationEvent{id:string, buildRunId:string, promptId:string, promptIndex:number, eventType:ObservationEventType, severity:EventSeverity, artifact:string|null, description:string, rawData:Record<string,unknown>, timestamp:string}. ObservationEventType enum: FILE_WRITE, FILE_DELETE, COMMAND_EXEC, STDOUT_CHUNK, GATE_RESULT, PROCESS_EXIT. EventSeverity enum: INFO, WARN, CRITICAL, HALT. ExecutionMonitorResult{promptId:string, outOfScopeWrites:string[], unexpectedDeletions:string[], commandsExecuted:string[], stdoutChunks:number, exitCode:number|null, durationMs:number, passed:boolean, violations:ObservationEvent[]}. ValidationResult{promptId:string, intentFulfillmentScore:number, gatePassed:boolean, intentActuallyFulfilled:boolean, promptSummary:string, outputSummary:string, gaps:string[], confidence:number}. DriftReport{artifact:string, contractsCited:string[], violationsFound:string[], severity:EventSeverity, autoResolvable:boolean}. GovernanceEnforcerResult{promptId:string, artifactsScanned:string[], driftReports:DriftReport[], contractViolations:string[], passed:boolean}. ConfidenceScore{composite:number, executionScore:number, validationScore:number, governanceScore:number, haltRecommended:boolean}. HaltDecision{shouldHalt:boolean, reason:string|null, autoRecoverable:boolean, recoveryAction:string|null}. SentinelPrimeRunResult{id:string, buildRunId:string, promptId:string, promptIndex:number, executionResult:ExecutionMonitorResult, validationResult:ValidationResult, governanceResult:GovernanceEnforcerResult, confidenceScore:ConfidenceScore, haltDecision:HaltDecision, createdAt:string}. Run pnpm run build confirm 0 TypeScript errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): System 5 type definitions'."
    gates:
    - type: compile

  - id: s5-execution-monitor
    name: Build ExecutionMonitor — real-time subprocess observer
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts in full to understand how runClaudeImpl spawns subprocesses and how stdout is streamed. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\execution-monitor.ts. This file must be at minimum 200 lines of real implementation. Export class ExecutionMonitor with these methods: start(buildRunId:string, promptId:string, promptIndex:number, projectPath:string):void — initializes observation session, records allowed write scope as all paths under projectPath only. observeStdoutChunk(chunk:string):void — receives each stdout chunk from the Claude subprocess in real time, scans for patterns indicating file writes (Writing to, Creating, Deleting, git rm) and extracts file paths, flags any path outside projectPath as out-of-scope violation, emits ObservationEvent with severity CRITICAL for out-of-scope writes. observeCommand(command:string):void — records every shell command executed, flags rm -rf, git clean, anything touching paths outside projectPath. observeFileWrite(filePath:string):void — called when a file write is confirmed, checks path is under projectPath, emits HALT severity event if outside scope. finish(exitCode:number):ExecutionMonitorResult — closes session, compiles all ObservationEvents into ExecutionMonitorResult, sets passed=false if any CRITICAL or HALT events exist. Export createExecutionMonitor():ExecutionMonitor factory function. All events stored in memory during session. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): ExecutionMonitor real-time subprocess observer'."
    gates:
    - type: compile

  - id: s5-decision-validator
    name: Build DecisionValidator — independent critic pass after every gate
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\engine\\claude-runner.ts in full to understand runClaude invocation pattern. Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts lines 1-100 to understand how prompt entries are structured. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\decision-validator.ts. This file must be at minimum 250 lines of real implementation. Export class DecisionValidator with method validate(promptEntry:{id:string,prompt:string,prompt_type:string}, projectPath:string, gatesPassed:boolean, gitDiff:string):Promise<ValidationResult>. Implementation: 1) Construct a critic system prompt: 'You are a code review critic. You do not build — you only evaluate. Be ruthless. You are given a prompt instruction and a git diff. Score 0.0-1.0 whether the diff actually fulfills the prompt intent. Return JSON only: {intentFulfillmentScore:number, gaps:string[], confidence:number, summary:string}'. 2) Construct user message containing the full prompt text and full gitDiff. 3) Call runClaude from claude-runner.ts with this critic prompt — this uses Claude Code CLI not API so costs $0. 4) Parse JSON response, extract intentFulfillmentScore, gaps, confidence, summary. Handle parse errors with fallback score of 0.5. 5) Set intentActuallyFulfilled=true only when intentFulfillmentScore>=0.75. 6) Return full ValidationResult. A gate passing but intentFulfillmentScore<0.75 is a validation failure — log it as WARN, do not auto-halt but record. Export createDecisionValidator():DecisionValidator. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): DecisionValidator independent critic pass'."
    gates:
    - type: compile

  - id: s5-governance-enforcer
    name: Build GovernanceEnforcer — post-prompt contract compliance scanner
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\resurrection\\governance-gaps.ts in full to understand how artifact scanning works. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\governance-enforcer.ts. This file must be at minimum 250 lines of real implementation. Export class GovernanceEnforcer with method enforce(projectPath:string, promptId:string, modifiedFiles:string[]):Promise<GovernanceEnforcerResult>. Implementation: 1) Read BEHAVIORAL_CONTRACTS.md from projectPath. Parse all Contract entries by scanning for lines matching /^##? Contract \d+/ or /^Contract [A-Z]?-?\d+:/ pattern. Extract contract ID and full contract text. 2) For each modified TypeScript file in modifiedFiles: read file contents. For each contract that is relevant to the file (match by keywords in contract text against file path and content). Check for direct contradictions: if contract says 'never write during active Phase 3 build' scan for build_runs queries that might violate this. If contract says 'never auto-approve architectural gaps' scan for any auto-approve logic. If contract says 'never self-modifies' scan for fs.writeFile targeting own source files. 3) Each contradiction found produces a DriftReport with severity CRITICAL and autoResolvable=false. 4) Missing governance doc updates after a build prompt produces DriftReport with severity WARN and autoResolvable=true. 5) Compile all DriftReports into GovernanceEnforcerResult. Set passed=false if any CRITICAL DriftReport exists. Export createGovernanceEnforcer():GovernanceEnforcer. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): GovernanceEnforcer post-prompt contract scanner'."
    gates:
    - type: compile

  - id: s5-confidence-scorer
    name: Build ConfidenceScorer and persist SentinelPrimeRunResult to DB
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\memory\\builds.ts in full as reference for DB persistence pattern. Read C:\\Users\\manag\\Documents\\forge-2\\src\\learning\\database.ts to confirm sentinel_prime_runs and validation_events tables exist. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\confidence-scorer.ts. Export function scoreConfidence(executionResult:ExecutionMonitorResult, validationResult:ValidationResult, governanceResult:GovernanceEnforcerResult):ConfidenceScore. Formula: executionScore = executionResult.passed ? 1.0 : Math.max(0, 1.0 - (executionResult.violations.length * 0.25)). validationScore = validationResult.intentFulfillmentScore. governanceScore = governanceResult.passed ? 1.0 : Math.max(0, 1.0 - (governanceResult.contractViolations.length * 0.3)). composite = (executionScore * 0.35) + (validationScore * 0.40) + (governanceScore * 0.25). All scores clamped 0.0-1.0. haltRecommended = composite < 0.4 OR any executionResult violation severity===HALT OR governanceResult.contractViolations.length > 0. Export function decideHalt(score:ConfidenceScore, executionResult:ExecutionMonitorResult, governanceResult:GovernanceEnforcerResult):HaltDecision. Export function persistSentinelRun(result:SentinelPrimeRunResult):void using better-sqlite3 prepared statements inserting into sentinel_prime_runs and all ObservationEvents into validation_events. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): ConfidenceScorer formula and DB persistence'."
    gates:
    - type: compile

  - id: s5-orchestrator
    name: Build SentinelPrime orchestrator and wire into phase3-executor
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\execution-monitor.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\decision-validator.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\governance-enforcer.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\confidence-scorer.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\index.ts. Export class SentinelPrime with method runFullObservation(params:{buildRunId:string, promptEntry:{id:string,prompt:string,prompt_type:string}, promptIndex:number, projectPath:string, gatesPassed:boolean, modifiedFiles:string[], gitDiff:string}):Promise<SentinelPrimeRunResult>. Implementation orchestrates all four components in sequence: 1) ExecutionMonitor.finish() to get executionResult (monitor was started earlier during subprocess). 2) DecisionValidator.validate() to get validationResult. 3) GovernanceEnforcer.enforce() to get governanceResult. 4) scoreConfidence() to get confidenceScore. 5) decideHalt() to get haltDecision. 6) persistSentinelRun() to write DB row. 7) Return full SentinelPrimeRunResult. Then in phase3-executor.ts: import SentinelPrime. After the existing Sentinel gate block completes for each prompt, instantiate SentinelPrime and call runFullObservation with the prompt entry, gate results, modified files from git diff, and full diff text. If haltDecision.shouldHalt===true and autoRecoverable===false: print [SENTINEL PRIME] HALT — {reason} in renderProgress at FAIL level and throw to abort the build run. If shouldHalt===true and autoRecoverable===true: print [SENTINEL PRIME] WARN — {reason} and continue. Always print composite confidence score: [SENTINEL PRIME] Confidence: {composite.toFixed(2)} after every prompt. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\execution-monitor-singleton.ts exporting a per-build-run singleton so ExecutionMonitor.start() called at prompt start and finish() called after gates. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): SentinelPrime orchestrator wired into Phase 3'."
    gates:
    - type: compile

  - id: s5-cli
    name: Register forge sentinel CLI command
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\cli\\index.ts in full to understand how existing forge commands are registered (forge audit, forge test, forge learning). Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\index.ts in full. Add forge sentinel command to src\\cli\\index.ts with these subcommands: forge sentinel report --build-run-id <id> — reads sentinel_prime_runs table for that build run, prints full report showing per-prompt confidence scores, violations, contract breaches, intent gaps, formatted in FORGE 1.0 log style with timestamps. forge sentinel history --project <path> --limit <n> — lists last N sentinel runs for a project sorted by created_at desc, showing prompt id, composite confidence, halt triggered y/n. forge sentinel threshold --set <0.0-1.0> — writes SENTINEL_PRIME_HALT_THRESHOLD to a config key in Build Memory so operators can tune halt sensitivity without code changes (default 0.4). Print all output in [yyyy-MM-dd HH:mm:ss] [LEVEL] format matching FORGE 1.0 exactly — no chalk, no raw console.log, only renderProgress-style output. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): forge sentinel CLI — report history threshold'."
    gates:
    - type: compile

  - id: s5-integration-bus
    name: Wire Sentinel Prime into System 4 Integration Bus
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\integration\\bus.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\index.ts in full. In src\\integration\\bus.ts: 1) Import SentinelPrime from sentinel-prime/index.ts. 2) In onSentinelFailure() — after the existing System 1 gap audit and System 2 learning update calls, add: retrieve the most recent sentinel_prime_runs row for this promptId from DB. If it exists and haltDecision.shouldHalt===true with autoRecoverable===false, escalate by writing a BLOCKER entry to STATE_OF_THE_BUILD.md with the sentinel prime run id, confidence score, and halt reason. If autoRecoverable===true, trigger a re-queue of the prompt by inserting a new prompt_execution row with status=pending and retry_count incremented. 3) Export new function onSentinelPrimeHalt(sentinelRunId:string, projectPath:string):Promise<void> that reads the sentinel run, formats a full diagnostic block, appends it to SESSION_STATE.md with timestamp, and logs [SENTINEL PRIME] HALT RECORDED to stdout. 4) Wire onSentinelPrimeHalt into phase3-executor.ts at the halt throw site — call it before throwing so SESSION_STATE.md is always updated on halt. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(integration): Sentinel Prime wired into System 4 bus with auto-recovery'."
    gates:
    - type: compile

  - id: s5-governance-update
    name: Update all governance docs to reflect System 5 completion
    prompt: "In C:\\Users\\manag\\Documents\\forge-2 update these governance documents: 1) STATE_OF_THE_BUILD.md — add System 5 Sentinel Prime section marking all 9 prompts DONE with their commit hashes. Update schema version to 2.4.0. Mark overall build status as Systems 1-5 Complete. 2) SESSION_STATE.md — update last session summary to reflect System 5 build completion, list all new files created in src/sentinel-prime/. 3) AGENTS.md — add four new System 5 agents: ExecutionMonitor(src/sentinel-prime/execution-monitor.ts) — real-time subprocess observer detecting out-of-scope writes and unexpected deletions during Claude Code execution. DecisionValidator(src/sentinel-prime/decision-validator.ts) — independent critic pass after every gate scoring intent fulfillment 0.0-1.0 using a second Claude Code invocation. GovernanceEnforcer(src/sentinel-prime/governance-enforcer.ts) — post-prompt scanner matching modified files against BEHAVIORAL_CONTRACTS.md entries detecting contradictions. ConfidenceScorer(src/sentinel-prime/confidence-scorer.ts) — composite confidence formula (execution 35% + validation 40% + governance 25%) with halt recommendation below 0.4. 4) BEHAVIORAL_CONTRACTS.md — add Contracts SP-1 through SP-5: SP-1: Sentinel Prime MUST run after every Phase 3 prompt without exception. SP-2: A composite confidence score below 0.4 MUST trigger build halt. SP-3: Any out-of-scope file write outside projectPath MUST trigger immediate HALT severity event. SP-4: DecisionValidator MUST use Claude Code CLI never Anthropic API — cost must be $0. SP-5: GovernanceEnforcer contract violations are never auto-approved regardless of flags or operator overrides. 5) FORGE_HANDOFF.md — add System 5 section listing all sentinel-prime/ files and the forge sentinel CLI commands. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'chore: governance docs System 5 Sentinel Prime complete'."
    gates:
    - type: compile

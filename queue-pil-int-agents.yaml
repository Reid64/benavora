# queue-pil-int-agents.yaml
# 10 sequential prompts upgrading BEN-INT-01 through BEN-INT-10 (Core Intelligence family) in place --
# same file paths, same class names, same AGENT_FACTORIES registration -- to the fuller PIL_AGENT_COMPLETE_ROSTER.md
# spec: real conditional delegation-array logic per each agent's documented roster dependency list, a structured
# per-dimension report object, and concrete try/catch error handling around the new logic. Every agent already
# exists and is registered; this queue extends behavior, it does not create new agents or touch index.ts.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-int-01-upgrade
  name: Upgrade BEN-INT-01 Individual Intelligence Agent to the fuller PIL spec
  prompt: "STEP 1 -- READ src/lib/pil/agents/int/BEN-INT-01.ts IN FULL before writing anything (do not skip this even if you upgraded a sibling INT agent earlier in this queue run -- each file's existing behavior differs). This file implements BEN-INT-01 \"Individual Intelligence Agent\" (IndividualIntelligenceAgent implements Agent). Its CURRENT real behavior: on a prospectId with entity_type='individual' it runs a web_search for a biography/profile page, crawls the top result to record biographical/location/professional-summary evidence (claim_type='biographical'), runs a news_search and records one evidence item per news mention (claim_type='biographical'), then returns with `delegations: []` always -- it never delegates to any sibling agent today. Note line 37 currently discards the return value of `upsertProspectNode(context.orgId, prospect, \"person\")` (called as a bare `await` with no assignment) -- this prompt requires capturing it as `const personNode = await upsertProspectNode(...)` since the new gap logic below needs personNode.id to check graph edges. You must PRESERVE every one of these existing tool calls, evidence records, and graph writes EXACTLY as they are today -- this is an in-place upgrade, not a rewrite. Do not remove or alter any existing recordIntelligenceEvidence() call, claim_type string, confidence value, or verification_status value already in the file unless a bug is explicitly called out below.\n\nSPEC DETAIL FROM THE ROSTER (C:\\temp\\PIL_AGENT_COMPLETE_ROSTER.md \"Core Intelligence\" section and C:\\temp\\PIL_AGENT_DEPENDENCIES.yaml's BEN-INT-01 entry -- these are Phase-1 paper specs with zero existing code or tests of their own; the real, buildable target is the concrete behavior spelled out below, not any literal contract-object name from those docs): output contract is a generic `BEN_INT_01Decision.v1` scored across exactly six domain dimensions: Identity Hypotheses And Discriminators; Biographical And Role Chronology; Geographic Relevance; Documented Affiliations; Public Philanthropic Observations; Research Gaps And Contradictions. The roster's own delegation column for BEN-INT-01 lists: BEN-KNW-02, BEN-KNW-03, BEN-INT-02, BEN-INT-04, BEN-INT-05, BEN-INT-07, BEN-INT-08, BEN-REL-01 (the largest delegation list of any INT agent). Autonomy is uniformly A2 for the entire Core Intelligence family (dependencies.yaml). Evaluation-criteria intent, translated into concrete code behavior for this codebase (no literal \"npm run evaluate\"/scorecard command exists anywhere in this repo -- the real bar is: it compiles, it builds, and the vitest suite below passes): every one of the six dimensions above must be visible as an explicit boolean/string field on this agent's own report object in `conclusions`, not just implied by which evidence rows happen to exist in the database. Recovery protocol, translated into concrete code behavior (roster: \"recovery starts from persisted truth ... captured evidence stays immutable\"): wrap ONLY the new gap-analysis + delegation-construction + report-construction logic added below in a try/catch that runs AFTER all existing recordIntelligenceEvidence()/upsertEdge() calls have already completed (those remain individually atomic Supabase writes exactly as today, unaffected by this try/catch) -- on catch, log the failure via `logAction` (import `{ logAction }` from `@/lib/pil/audit`, matching BEN-QLF-04's own import, not currently imported in this file) with action `\"ben-int-01.gap_analysis_failed\"`, resource_type `\"pil_agent_runs\"`, resource_id `context.runId`, before_state null, after_state `{ error: message }`, policy_decision null, ip_address null -- then still return `status: \"completed\"` with the already-collected `evidenceCreated` array intact and `delegations: []`, so a bug in the new gap-analysis code can never discard evidence this run already durably recorded (the concrete meaning of \"captured evidence stays immutable\" and \"never let secondary reasoning crash the primary work\").\n\nDELEGATION-GAP LOGIC TO ADD (the real, concrete translation of the roster's \"may call\" delegation list above into this agent's own conditional `delegations: DelegationRequest[]` array, following BEN-QLF-04's own conditional-delegation pattern rather than an unconditional fan-out to every listed peer every run): add `export const MAX_DELEGATIONS_PER_RUN = 3;` to src/lib/pil/agents/int/shared.ts if it is not already there (check first -- an earlier prompt in this queue run may have added it; if present, reuse it, do not redefine it), documented with a one-line comment explaining it bounds per-run fan-out cost since AgentRunner executes delegations synchronously/inline. After the existing evidence-gathering calls, fetch `const allEvidence = await getEvidence(prospect.id, context.orgId);` (import `{ getEvidence }` from `@/lib/pil/evidence`) and `const personEdges = personNode ? await getEdges(personNode.id) : [];` (import `{ getEdges }` from `@/lib/pil/graph`, alongside the existing `upsertProspectNode` import from int/shared.ts). Compute: `hasEmployment = allEvidence.some(e => e.claim_type === \"employment\")`, `hasEducation = allEvidence.some(e => e.claim_type === \"education\")`, `hasBoard = allEvidence.some(e => e.claim_type === \"nonprofit_board\")`, `hasGiving = allEvidence.some(e => e.claim_type === \"giving_history\")`, `hasWealth = allEvidence.some(e => e.claim_type === \"wealth_capacity\")`, `hasRelationshipEdges = personEdges.length > 0`. Identity-ambiguity trigger for BEN-KNW-02: `evidenceCreated.length === 0 && allEvidence.length === 0` (this run found nothing new AND no prior evidence exists at all for this prospect -- genuinely no identity signal to build a dossier on). Evidence-verification trigger for BEN-KNW-03: `evidenceCreated.length > 0` (new evidence was recorded this run and needs provenance verification). Build the `delegations` array in EXACTLY this priority order, pushing an entry only when its condition is true, and stopping once the array reaches MAX_DELEGATIONS_PER_RUN entries (do not push a lower-priority entry past the cap even if its own condition is also true): 1) BEN-KNW-02 if the identity-ambiguity condition holds, 2) BEN-INT-02 if !hasEmployment, 3) BEN-INT-04 if !hasEducation, 4) BEN-INT-05 if !hasBoard, 5) BEN-INT-07 if !hasGiving, 6) BEN-INT-08 if !hasWealth, 7) BEN-REL-01 if !hasRelationshipEdges, 8) BEN-KNW-03 if the evidence-verification condition holds. Every pushed entry must have shape `{ childAgentCode: \"BEN-XXX-NN\", objective: <a specific one-sentence string naming context.prospectId and the concrete gap/signal that triggered it -- not a generic placeholder>, maxAutonomy: \"A2\", constraints: { prospectId: context.prospectId, triggeredBy: context.agentCode } }`.\n\nREPORT/CONCLUSIONS RESTRUCTURING: replace the current flat `conclusions: { prospectId: prospect.id, evidenceCount: evidenceCreated.length }` with `conclusions: { report }` where `report` is a new exported interface (name it `IndividualIntelligenceReport`) with fields: `prospectId: string`, `dimensionCoverage: Record<string, boolean>` (keyed by the exact six dimension name strings given above, each true if this agent has ANY evidence/graph signal for that dimension as of this run -- persisted evidence via getEvidence(), not just evidence created this run, matching BEN-INT-08's own existing `getEvidence(prospect.id, context.orgId)` pattern), `evidenceCreatedThisRun: number`, `delegationsIssued: string[]` (the childAgentCode of every entry actually pushed into the returned `delegations` array), and any agent-specific fields already present in the current flat conclusions object (preserve those under the same key names, nested inside `report` instead of at the top level).\n\nTEST FILE: src/__tests__/unit/pil-int-agents.test.ts does not exist yet -- create it now, matching the real established mocking convention in this repo's other PIL suites (read src/__tests__/unit/pil-dis-agents.test.ts and src/__tests__/unit/pil-qlf-knw-agents.test.ts in full first, both use vitest's vi.mock at module scope, a `baseContext()` helper building a fake AgentContext, and a `fakeRunner()` helper returning `{ useTool: vi.fn().mockResolvedValue(undefined) }`). Mock exactly these modules at module scope: vi.mock(\"@/lib/pil/db\", () => ({ getPilClient: vi.fn() })); vi.mock(\"@/lib/pil/evidence\", () => ({ recordEvidence: vi.fn(), getEvidence: vi.fn() })); vi.mock(\"@/lib/pil/graph\", () => ({ upsertNode: vi.fn(), upsertEdge: vi.fn(), getNodesByProspect: vi.fn(), getEdges: vi.fn(), traverseGraph: vi.fn() })); vi.mock(\"@/lib/pil/tools\", () => ({ getTool: vi.fn() })); vi.mock(\"@/lib/pil/human-review\", () => ({ createReviewItem: vi.fn() })); vi.mock(\"@/lib/pil/audit\", () => ({ logAction: vi.fn() })); -- import the real (unmocked) src/lib/pil/agents/int/shared.ts, do not mock it, since it is the module under test's own direct dependency and mocking it would hide regressions in the shared helpers this prompt adds. Add a describe(\"BEN-INT-01 Individual Intelligence Agent\") block covering: (a) the existing happy-path behavior (web_search + web_crawl + news_search all succeed, evidence gets recorded) still works unchanged, and (b) at least one new delegation-gap assertion for the logic this prompt adds below (mock getEvidence to return an empty array so every dimension is a gap, mock getEdges to return an empty array, and assert that result.delegations contains an entry with childAgentCode \"BEN-KNW-02\" given zero evidence was found this run, per the identity-ambiguity trigger described below).\n\nPATTERN TO FOLLOW (read these real files in full before writing anything, if you have not already read them this session): src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- Agent is `interface Agent { execute(context: AgentContext, runner: AgentRunner): Promise<AgentResult>; }`, implemented as `class X implements Agent`, NEVER `extends BaseAgent` -- no such base class exists anywhere in this codebase); src/lib/pil/agents/qlf/BEN-QLF-04.ts (the canonical ~290-line reference implementation: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent -- e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications). AgentRunner.run() (agent-runner.ts lines 147-165) processes whatever `delegations` array your execute() returns AFTER your execute() call has already returned: for each entry it calls canDelegate(parentCode, childCode, maxAutonomy) for authorization, then (only if context.depth > 0) synchronously constructs a child AgentContext, runs a NEW AgentRunner().run(childContext) inline and awaits it, and records the outcome on a pil_delegated_tasks row -- if context.depth <= 0 instead, delegations are never executed and the parent run's own status becomes \"escalated\". This is a blocking, depth-bounded, one-way fan-out: the child's result is never fed back into this agent's own already-computed conclusions (matching BEN-QLF-04's own header comment: \"the persisted classification here is the agent's own defensible determination, with critic review recorded as delegated rather than blocking this run\"). If a delegation target agent code has no entry in AGENT_FACTORIES (src/lib/pil/agents/index.ts) yet, loadAgentImpl() falls back to NotImplementedAgent, which logs a warning and returns status \"failed\" WITHOUT throwing -- so issuing a delegation to a not-yet-implemented sibling is always safe and simply records a failed pil_delegated_tasks row; do not skip a spec-required delegation for that reason.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing. Then run pnpm test:unit -- src/__tests__/unit/pil-int-agents.test.ts (the real vitest unit-test runner in this repo's package.json -- note FORGE's own `test` gate type runs Playwright, not vitest, so this vitest check only happens if you run it yourself here) and confirm every test in that file passes, including the tests for every BEN-INT-0N agent upgraded in earlier prompts of this same queue run so far -- fix any regression before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the file(s) you changed and confirm the described delegation-gap logic, the corrected report/conclusions shape, and the try/catch error-handling boundary are actually present in the code, not just that it compiles -- do not self-certify from memory of what you intended to write.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which BEN-INT-0N agent this prompt upgraded, which delegation targets it now conditionally calls, and the updated PIL agent completion/upgrade count) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/int/BEN-INT-01.ts
    - src/lib/pil/agents/int/shared.ts
    - src/__tests__/unit/pil-int-agents.test.ts

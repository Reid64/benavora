  prompt: "STEP 1 -- READ src/lib/pil/agents/int/BEN-INT-10.ts IN FULL before writing anything (do not skip this even if you upgraded a sibling INT agent earlier in this queue run -- each file's existing behavior differs). This file implements BEN-INT-10 \"Contact Intelligence Agent\" (ContactIntelligenceAgent implements Agent). Its CURRENT real behavior: on any prospectId it captures `const subjectNode = await upsertProspectNode(...)` (node_type derived from entity_type via `subjectNodeType()`), searches for a public LinkedIn profile URL and an organization/foundation 'contact us' page, crawls the contact page for a non-personal-provider email via `extractEmail()` (PERSONAL_EMAIL_DOMAINS deny-list), builds a `channels: ContactChannel[]` array, records one evidence item per channel (claim_type='contact') and upserts a 'has_contact' graph edge per channel. Already computes `noPermissibleChannelFound: channels.length === 0` in its conclusions. Returns `delegations: []` always. No BEN-KNW-02 in its own delegation list per the roster (an explicit anomaly shared only with BEN-INT-08) and zero BEN-INT-peer delegation (shared only with BEN-INT-04) -- do NOT add a BEN-KNW-02 delegation or any BEN-INT-0N delegation to this agent, that would contradict the spec. You must PRESERVE every one of these existing tool calls, evidence records, and graph writes EXACTLY as they are today -- this is an in-place upgrade, not a rewrite. Do not remove or alter any existing recordIntelligenceEvidence() call, claim_type string, confidence value, or verification_status value already in the file unless a bug is explicitly called out below.\n\nSPEC DETAIL FROM THE ROSTER (C:\\temp\\PIL_AGENT_COMPLETE_ROSTER.md \"Core Intelligence\" section and C:\\temp\\PIL_AGENT_DEPENDENCIES.yaml's BEN-INT-10 entry -- these are Phase-1 paper specs with zero existing code or tests of their own; the real, buildable target is the concrete behavior spelled out below, not any literal contract-object name from those docs): output contract is a generic `BEN_INT_10Decision.v1` scored across exactly six domain dimensions: Channel Type And Provenance; Business Versus Personal Channel; Validity/Freshness; Consent/Suppression State; Role Relevance; Contactability Uncertainty. The roster's own delegation column for BEN-INT-10 lists: BEN-KNW-03, BEN-REL-01, BEN-QLF-05 (only three targets total, and the only INT agent -- alongside BEN-INT-04 -- with zero delegation to any other BEN-INT peer; BEN-QLF-05 not yet in AGENT_FACTORIES, see PATTERN block above). Autonomy is uniformly A2 for the entire Core Intelligence family (dependencies.yaml). Evaluation-criteria intent, translated into concrete code behavior for this codebase (no literal \"npm run evaluate\"/scorecard command exists anywhere in this repo -- the real bar is: it compiles, it builds, and the vitest suite below passes): every one of the six dimensions above must be visible as an explicit boolean/string field on this agent's own report object in `conclusions`, not just implied by which evidence rows happen to exist in the database. Recovery protocol, translated into concrete code behavior (roster: \"recovery starts from persisted truth ... captured evidence stays immutable\"): wrap ONLY the new gap-analysis + delegation-construction + report-construction logic added below in a try/catch that runs AFTER all existing recordIntelligenceEvidence()/upsertEdge() calls have already completed (those remain individually atomic Supabase writes exactly as today, unaffected by this try/catch) -- on catch, log the failure via `logAction` (import `{ logAction }` from `@/lib/pil/audit`, matching BEN-QLF-04's own import, not currently imported in this file) with action `\"ben-int-10.gap_analysis_failed\"`, resource_type `\"pil_agent_runs\"`, resource_id `context.runId`, before_state null, after_state `{ error: message }`, policy_decision null, ip_address null -- then still return `status: \"completed\"` with the already-collected `evidenceCreated` array intact and `delegations: []`, so a bug in the new gap-analysis code can never discard evidence this run already durably recorded (the concrete meaning of \"captured evidence stays immutable\" and \"never let secondary reasoning crash the primary work\").\n\nDELEGATION-GAP LOGIC TO ADD (the real, concrete translation of the roster's \"may call\" delegation list above into this agent's own conditional `delegations: DelegationRequest[]` array, following BEN-QLF-04's own conditional-delegation pattern rather than an unconditional fan-out to every listed peer every run): add `export const MAX_DELEGATIONS_PER_RUN = 3;` to src/lib/pil/agents/int/shared.ts if it is not already there (check first -- an earlier prompt in this queue run may have added it; if present, reuse it, do not redefine it), documented with a one-line comment explaining it bounds per-run fan-out cost since AgentRunner executes delegations synchronously/inline. No-channel trigger for BEN-REL-01: reuse the existing `channels.length === 0` condition (already computed as `noPermissibleChannelFound`) -- if there is no direct, permissible contact channel, a warm introduction path via a known relationship (BEN-REL-01's own mission) may be the only permissible route to this prospect. Readiness trigger for BEN-QLF-05: `channels.some(c => c.channelType === \"linkedin\")` -- a verified professional channel existing is exactly BEN-QLF-05's Document Readiness input signal (an org is more \"ready\" to act on an opportunity when a real contact channel is confirmed). Evidence-verification trigger for BEN-KNW-03: `evidenceCreated.length > 0`. Build the `delegations` array in EXACTLY this priority order, pushing an entry only when its condition is true, and stopping once the array reaches MAX_DELEGATIONS_PER_RUN entries (do not push a lower-priority entry past the cap even if its own condition is also true): 1) BEN-REL-01 if channels.length === 0, 2) BEN-QLF-05 if the readiness condition holds, 3) BEN-KNW-03 if the evidence-verification condition holds -- never BEN-KNW-02 and never any BEN-INT-0N target for this agent. Every pushed entry must have shape `{ childAgentCode: \"BEN-XXX-NN\", objective: <a specific one-sentence string naming context.prospectId and the concrete gap/signal that triggered it -- not a generic placeholder>, maxAutonomy: \"A2\", constraints: { prospectId: context.prospectId, triggeredBy: context.agentCode } }`.\n\nREPORT/CONCLUSIONS RESTRUCTURING: replace the current flat `conclusions: { prospectId: prospect.id, channelsFound: channels.length, noPermissibleChannelFound: channels.length === 0 }` with `conclusions: { report }` where `report` is a new exported interface (name it `ContactIntelligenceReport`) with fields: `prospectId: string`, `dimensionCoverage: Record<string, boolean>` (keyed by the exact six dimension name strings given above, each true if this agent has ANY evidence/graph signal for that dimension as of this run -- persisted evidence via getEvidence(), not just evidence created this run, matching BEN-INT-08's own existing `getEvidence(prospect.id, context.orgId)` pattern), `evidenceCreatedThisRun: number`, `delegationsIssued: string[]` (the childAgentCode of every entry actually pushed into the returned `delegations` array), and any agent-specific fields already present in the current flat conclusions object (preserve those under the same key names, nested inside `report` instead of at the top level).\n\nTEST FILE: src/__tests__/unit/pil-int-agents.test.ts already exists (created earlier in this same queue run) -- read it in full first to match its existing vi.mock/baseContext/fakeRunner setup exactly, then EXTEND it (do not replace or duplicate the module-scope vi.mock calls) with a new describe(\"{agent_name}\") block covering: (a) the existing happy-path behavior for this agent (its existing tool-call sequence) still works unchanged, and (b) at least one delegation-gap assertion for the new logic this prompt adds below.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything, if you have not already read them this session): src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- Agent is `interface Agent { execute(context: AgentContext, runner: AgentRunner): Promise<AgentResult>; }`, implemented as `class X implements Agent`, NEVER `extends BaseAgent` -- no such base class exists anywhere in this codebase); src/lib/pil/agents/qlf/BEN-QLF-04.ts (the canonical ~290-line reference implementation: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, and a `delegations` array in the returned AgentResult used to chain into a follow-on agent -- e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications). AgentRunner.run() (agent-runner.ts lines 147-165) processes whatever `delegations` array your execute() returns AFTER your execute() call has already returned: for each entry it calls canDelegate(parentCode, childCode, maxAutonomy) for authorization, then (only if context.depth > 0) synchronously constructs a child AgentContext, runs a NEW AgentRunner().run(childContext) inline and awaits it, and records the outcome on a pil_delegated_tasks row -- if context.depth <= 0 instead, delegations are never executed and the parent run's own status becomes \"escalated\". This is a blocking, depth-bounded, one-way fan-out: the child's result is never fed back into this agent's own already-computed conclusions (matching BEN-QLF-04's own header comment: \"the persisted classification here is the agent's own defensible determination, with critic review recorded as delegated rather than blocking this run\"). If a delegation target agent code has no entry in AGENT_FACTORIES (src/lib/pil/agents/index.ts) yet, loadAgentImpl() falls back to NotImplementedAgent, which logs a warning and returns status \"failed\" WITHOUT throwing -- so issuing a delegation to a not-yet-implemented sibling is always safe and simply records a failed pil_delegated_tasks row; do not skip a spec-required delegation for that reason.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing. Then run pnpm test:unit -- src/__tests__/unit/pil-int-agents.test.ts (the real vitest unit-test runner in this repo's package.json -- note FORGE's own `test` gate type runs Playwright, not vitest, so this vitest check only happens if you run it yourself here) and confirm every test in that file passes, including the tests for every BEN-INT-0N agent upgraded in earlier prompts of this same queue run so far -- fix any regression before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the file(s) you changed and confirm the described delegation-gap logic, the corrected report/conclusions shape, and the try/catch error-handling boundary are actually present in the code, not just that it compiles -- do not self-certify from memory of what you intended to write.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which BEN-INT-0N agent this prompt upgraded, which delegation targets it now conditionally calls, and the updated PIL agent completion/upgrade count) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/int/BEN-INT-10.ts
    - src/lib/pil/agents/int/shared.ts
    - src/__tests__/unit/pil-int-agents.test.ts

egationRequest[]` array, following BEN-QLF-04's own conditional-delegation pattern rather than an unconditional fan-out to every listed peer every run): add `export const MAX_DELEGATIONS_PER_RUN = 3;` to src/lib/pil/agents/int/shared.ts if it is not already there (check first -- an earlier prompt in this queue run may have added it; if present, reuse it, do not redefine it), documented with a one-line comment explaining it bounds per-run fan-out cost since AgentRunner executes delegations synchronously/inline. Ownership-signal trigger for BEN-INT-03: after `records` is built (no new tool call needed), test `records.some(r => /founder|co-founder|\\bowner\\b|principal/i.test(r.title))` -- an employment-search result whose title itself reads as a founder/owner/principal mention is exactly BEN-INT-03's Legal Entity Ownership dimension surfacing early. Executive-mobility trigger for BEN-INT-01 (the reciprocal delegation back to its own pair-agent): `records.length > 1` -- both a current AND a prior role were found this run, meaning a documented career change exists that BEN-INT-01's Biographical And Role Chronology dimension should re-sync. Identity-ambiguity trigger for BEN-KNW-02: `records.length === 0` (no employment record found at all this run). Evidence-verification trigger for BEN-KNW-03: `evidenceCreated.length > 0`. Build the `delegations` array in EXACTLY this priority order, pushing an entry only when its condition is true, and stopping once the array reaches MAX_DELEGATIONS_PER_RUN entries (do not push a lower-priority entry past the cap even if its own condition is also true): 1) BEN-KNW-02 if records.length === 0, 2) BEN-INT-03 if the ownership-signal condition holds, 3) BEN-INT-01 if the executive-mobility condition holds, 4) BEN-KNW-03 if the evidence-verification condition holds. Every pushed entry must have shape `{ childAgentCode: \"BEN-XXX-NN\", objective: <a specific one-sentence string naming context.prospectId and the concrete gap/signal that trigg
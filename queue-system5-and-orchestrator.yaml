    name: Build LibraryManager — queue file management and scaffolding
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\library-manager.ts. Export class LibraryManager with these methods: getLibraryPath(baseDir:string, project:string):string — returns baseDir/library/project/. ensureLibraryExists(libraryPath:string):void — creates directory if not present. listQueues(libraryPath:string):string[] — returns all queue-*.yaml files in library. scaffoldManifest(libraryPath:string, project:string):void — creates a starter library-manifest.yaml with one placeholder queue entry if manifest does not exist. addQueueToManifest(manifestPath:string, entry:Omit<QueueEntry,'startedAt'|'completedAt'|'error'|'sentinelCheckpoint'>):void — appends new queue entry to existing manifest. getQueueFilePath(libraryPath:string, queueFile:string):string — resolves and validates queue file exists. validateQueueYaml(queueFilePath:string):string[] — parses queue YAML, returns list of validation errors (missing project key, missing prompts array, prompts with no id or no gates, etc). Export createLibraryManager():LibraryManager. Default library base path: C:\\Users\\manag\\Documents\\FORGE (reads from FORGE_LIBRARY_PATH env var if set, falls back to default). Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): LibraryManager queue file management and scaffolding'."
    gates:
    - type: compile

  - id: orchestrator-cli
    name: Register forge orchestrate and forge library CLI commands
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\cli\\index.ts in full to understand existing command registration pattern. Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\engine.ts, manifest-resolver.ts, library-manager.ts all in full. Register these commands in src\\cli\\index.ts: 1) forge orchestrate <project> — main command accepting --library-path (default C:\\Users\\manag\\Documents\\FORGE), --project-path (repo path for governance sync), --dry-run (print plan only), --skip-to <queue-id>, --only <queue-id>, --reset (reset all complete to pending for re-run). Instantiates OrchestratorEngine and calls run(). Prints [ORCHESTRATOR] banner on start showing project, queues found, estimated total hours. 2) forge library list <project> — lists all queue files in library with their manifest status if manifest exists. 3) forge library add <project> <queue-file> — validates queue YAML then calls addQueueToManifest. 4) forge library validate <project> — runs validateQueueYaml on all queue files, reports errors. 5) forge library scaffold <project> — calls scaffoldManifest to create starter manifest. 6) forge sentinel report --build-run-id <id> — reads sentinel_prime_runs for that run, prints full diagnostic. 7) forge sentinel history --project <path> --limit <n> — lists last N sentinel runs with confidence scores. 8) forge sentinel threshold --set <value> — writes halt threshold to Build Memory config. All output in [yyyy-MM-dd HH:mm:ss] [LEVEL] format. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(cli): forge orchestrate and forge library and forge sentinel commands'."
    gates:
    - type: compile

  - id: orchestrator-index

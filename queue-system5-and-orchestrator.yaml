  - id: s5-governance-update
    name: Update all governance docs to reflect System 5 and Orchestrator completion
    prompt: "In C:\\Users\\manag\\Documents\\forge-2 update these governance documents with full detail — do not truncate or abbreviate any section: 1) STATE_OF_THE_BUILD.md — add System 5 Sentinel Prime section marking all prompts DONE with commit hashes. Add Native Orchestrator section marking all prompts DONE with commit hashes. Update schema version to 2.5.0. Mark overall build status Systems 1-5 plus Native Orchestrator Complete. 2) SESSION_STATE.md — update last session summary listing all new files created in src/sentinel-prime/ and src/orchestrator/. 3) AGENTS.md — add five System 5 agents: ExecutionMonitor(src/sentinel-prime/execution-monitor.ts), DecisionValidator(src/sentinel-prime/decision-validator.ts), GovernanceEnforcer(src/sentinel-prime/governance-enforcer.ts), ConfidenceScorer(src/sentinel-prime/confidence-scorer.ts), OrchestratorEngine(src/orchestrator/engine.ts). 4) BEHAVIORAL_CONTRACTS.md — add Contracts SP-1 through SP-5: SP-1 Sentinel Prime MUST run after every Phase 3 prompt. SP-2 Composite confidence below 0.4 MUST trigger halt. SP-3 Any out-of-scope file write MUST trigger HALT severity. SP-4 DecisionValidator MUST use Claude Code CLI never Anthropic API cost must be zero. SP-5 GovernanceEnforcer contract violations are never auto-approved. Add Contracts ORC-1 through ORC-3: ORC-1 GovernanceSync MUST run before every queue execution no exceptions. ORC-2 Queue dependency cycles MUST be detected and rejected at manifest load time. ORC-3 Orchestrator manifest state MUST be persisted to Build Memory DB not only to YAML file. 5) FORGE_HANDOFF.md — add complete section listing all sentinel-prime/ and orchestrator/ files with descriptions and all new CLI commands. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'chore: governance docs Systems 5 and Native Orchestrator complete'."
    gates:
    - type: compile

    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\engine.ts, manifest-resolver.ts, queue-runner.ts, library-manager.ts, governance-sync.ts, types.ts all in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\integration\\bus.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\index.ts re-exporting createOrchestratorEngine, createManifestResolver, createQueueRunner, createLibraryManager, syncGovernanceDocs from all orchestrator modules. In src\\integration\\bus.ts add: import SentinelPrime from sentinel-prime/index.ts. In onSentinelFailure() after existing System 1-3 calls: retrieve most recent sentinel_prime_runs row for promptId. If haltDecision.shouldHalt and not autoRecoverable: append BLOCKER entry to STATE_OF_THE_BUILD.md with sentinel run id, composite confidence, halt reason, timestamp. If autoRecoverable: insert retry prompt_execution row with status pending and retry_count incremented. Export onSentinelPrimeHalt(sentinelRunId:string, projectPath:string):Promise<void> — reads sentinel run, formats diagnostic block, appends to SESSION_STATE.md. In phase3-executor.ts at halt throw site call onSentinelPrimeHalt before throwing. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): index exports and System 4 bus Sentinel Prime integration'."

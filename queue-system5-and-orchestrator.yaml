prompts:

  - id: s5-schema
    name: Add System 5 and Orchestrator tables to Build Memory
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\learning\\database.ts in full to understand ALL_FORGE_TABLES and CURRENT_SCHEMA_VERSION. Add these four CREATE TABLE IF NOT EXISTS blocks inside initializeForgeMemory() after existing System 3 tables. Table 1: sentinel_prime_runs (id TEXT PRIMARY KEY, build_run_id TEXT NOT NULL, prompt_id TEXT NOT NULL, prompt_index INTEGER NOT NULL, execution_monitor_result TEXT NOT NULL, decision_validator_result TEXT NOT NULL, governance_enforcer_result TEXT NOT NULL, composite_confidence REAL NOT NULL, halt_triggered INTEGER NOT NULL DEFAULT 0, halt_reason TEXT, out_of_scope_writes TEXT, contract_violations TEXT, intent_fulfillment_score REAL, gate_pass_score REAL, created_at TEXT NOT NULL). Table 2: validation_events (id TEXT PRIMARY KEY, sentinel_run_id TEXT NOT NULL, event_type TEXT NOT NULL, severity TEXT NOT NULL, artifact TEXT, description TEXT NOT NULL, auto_resolved INTEGER NOT NULL DEFAULT 0, resolution TEXT, created_at TEXT NOT NULL). Table 3: orchestrator_manifests (id TEXT PRIMARY KEY, project TEXT NOT NULL, manifest_path TEXT NOT NULL, version TEXT NOT NULL, description TEXT, status TEXT NOT NULL DEFAULT 'idle', queues_total INTEGER NOT NULL DEFAULT 0, queues_complete INTEGER NOT NULL DEFAULT 0, queues_failed INTEGER NOT NULL DEFAULT 0, started_at TEXT, completed_at TEXT, created_at TEXT NOT NULL). Table 4: orchestrator_queue_runs (id TEXT PRIMARY KEY, manifest_id TEXT NOT NULL, queue_id TEXT NOT NULL, queue_file TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'pending', depends_on TEXT, priority INTEGER NOT NULL DEFAULT 1, prompt_count INTEGER, started_at TEXT, completed_at TEXT, sentinel_prime_checkpoint TEXT, error TEXT, created_at TEXT NOT NULL). Add all four table names to ALL_FORGE_TABLES. Bump CURRENT_SCHEMA_VERSION to 2.5.0. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 confirm 0 TypeScript errors. Commit: git add -A; git commit -m 'feat(db): System 5 and Orchestrator tables schema v2.5.0'."
    gates:
    - type: compile

  - id: s5-types
    name: Create System 5 Sentinel Prime type definitions
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\resurrection\\types.ts in full as reference shape. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts exporting these exact interfaces and enums. ObservationEventType enum: FILE_WRITE, FILE_DELETE, COMMAND_EXEC, STDOUT_CHUNK, GATE_RESULT, PROCESS_EXIT. EventSeverity enum: INFO, WARN, CRITICAL, HALT. ObservationEvent{id:string, buildRunId:string, promptId:string, promptIndex:number, eventType:ObservationEventType, severity:EventSeverity, artifact:string|null, description:string, rawData:Record<string,unknown>, timestamp:string}. ExecutionMonitorResult{promptId:string, outOfScopeWrites:string[], unexpectedDeletions:string[], commandsExecuted:string[], stdoutChunks:number, exitCode:number|null, durationMs:number, passed:boolean, violations:ObservationEvent[]}. ValidationResult{promptId:string, intentFulfillmentScore:number, gatePassed:boolean, intentActuallyFulfilled:boolean, promptSummary:string, outputSummary:string, gaps:string[], confidence:number}. DriftReport{artifact:string, contractsCited:string[], violationsFound:string[], severity:EventSeverity, autoResolvable:boolean}. GovernanceEnforcerResult{promptId:string, artifactsScanned:string[], driftReports:DriftReport[], contractViolations:string[], passed:boolean}. ConfidenceScore{composite:number, executionScore:number, validationScore:number, governanceScore:number, haltRecommended:boolean}. HaltDecision{shouldHalt:boolean, reason:string|null, autoRecoverable:boolean, recoveryAction:string|null}. SentinelPrimeRunResult{id:string, buildRunId:string, promptId:string, promptIndex:number, executionResult:ExecutionMonitorResult, validationResult:ValidationResult, governanceResult:GovernanceEnforcerResult, confidenceScore:ConfidenceScore, haltDecision:HaltDecision, createdAt:string}. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): System 5 type definitions'."
    gates:
    - type: compile

  - id: s5-execution-monitor
    name: Build ExecutionMonitor — real-time subprocess observer
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts in full to understand subprocess spawning and stdout streaming. Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\execution-monitor.ts. Minimum 200 lines of real implementation. Export class ExecutionMonitor with: start(buildRunId:string, promptId:string, promptIndex:number, projectPath:string):void — initializes session, records projectPath as the only allowed write scope. observeStdoutChunk(chunk:string):void — receives each stdout chunk, scans for file write patterns (Writing to, Creating, Deleting, git rm), extracts file paths, emits ObservationEvent severity CRITICAL for any path outside projectPath. observeCommand(command:string):void — records every shell command, flags rm -rf and any path outside projectPath as HALT severity. observeFileWrite(filePath:string):void — validates path is under projectPath, emits HALT if outside. finish(exitCode:number):ExecutionMonitorResult — closes session, compiles all ObservationEvents, sets passed=false if any CRITICAL or HALT events found. Export createExecutionMonitor():ExecutionMonitor factory. Export executionMonitorSingleton Map<string,ExecutionMonitor> keyed by buildRunId for cross-module access. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): ExecutionMonitor real-time subprocess observer'."
    gates:
    - type: compile

  - id: s5-decision-validator
    name: Build DecisionValidator — independent critic pass after every gate
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\engine\\claude-runner.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts lines 1-100. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\decision-validator.ts. Minimum 250 lines of real implementation. Export class DecisionValidator with method validate(promptEntry:{id:string,prompt:string,prompt_type:string}, projectPath:string, gatesPassed:boolean, gitDiff:string):Promise<ValidationResult>. Implementation: 1) Build critic system prompt: 'You are a ruthless code review critic. You do not build. You only evaluate. You are given a build prompt and its git diff output. Score 0.0-1.0 whether the diff actually fulfills the prompt intent. Return JSON only with no preamble: {intentFulfillmentScore:number,gaps:string[],confidence:number,summary:string}'. 2) Build user message containing full prompt text and full gitDiff. 3) Call runClaude from claude-runner.ts — zero API cost, uses Claude Code CLI. 4) Parse JSON response. Handle parse errors with fallback intentFulfillmentScore=0.5 and note parse failure in gaps. 5) intentActuallyFulfilled=true only when intentFulfillmentScore>=0.75. 6) Return full ValidationResult. Gate pass with intentFulfillmentScore<0.75 logs WARN but does not auto-halt. Export createDecisionValidator():DecisionValidator. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): DecisionValidator independent critic pass via CLI'."
    gates:
    - type: compile

  - id: s5-governance-enforcer
    name: Build GovernanceEnforcer — post-prompt contract compliance scanner
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\resurrection\\governance-gaps.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\governance-enforcer.ts. Minimum 250 lines of real implementation. Export class GovernanceEnforcer with method enforce(projectPath:string, promptId:string, modifiedFiles:string[]):Promise<GovernanceEnforcerResult>. Implementation: 1) Read BEHAVIORAL_CONTRACTS.md from projectPath. Parse all Contract entries by scanning for lines matching /^##? Contract \d+/i or /^Contract [A-Z]?-?\d+:/i. Extract contract ID and full body text. 2) For each modified TypeScript file in modifiedFiles read file contents. Match contracts to files by keyword overlap. Check for contradictions: contract says 'never write during active Phase 3' — scan for unguarded build_runs writes. Contract says 'never auto-approve' — scan for auto-approve patterns. Contract says 'never self-modifies' — scan for fs.writeFile on src/ paths. Contract says 'cost must be $0' — scan for fetch calls to api.anthropic.com. 3) Each contradiction is a DriftReport with severity CRITICAL and autoResolvable=false. Missing governance doc update after build prompt is DriftReport severity WARN autoResolvable=true. 4) Compile into GovernanceEnforcerResult. passed=false if any CRITICAL DriftReport. Export createGovernanceEnforcer():GovernanceEnforcer. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): GovernanceEnforcer post-prompt contract scanner'."
    gates:
    - type: compile

  - id: s5-confidence-and-persist
    name: Build ConfidenceScorer and DB persistence layer
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\memory\\builds.ts in full as DB persistence reference. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\confidence-scorer.ts. Export SENTINEL_WEIGHTS={execution:0.35,validation:0.40,governance:0.25}. Export function scoreConfidence(executionResult:ExecutionMonitorResult, validationResult:ValidationResult, governanceResult:GovernanceEnforcerResult):ConfidenceScore. Formula: executionScore=executionResult.passed?1.0:Math.max(0,1.0-(executionResult.violations.length*0.25)) clamped 0-1. validationScore=validationResult.intentFulfillmentScore clamped 0-1. governanceScore=governanceResult.passed?1.0:Math.max(0,1.0-(governanceResult.contractViolations.length*0.30)) clamped 0-1. composite=(executionScore*0.35)+(validationScore*0.40)+(governanceScore*0.25) clamped 0-1. haltRecommended=composite<0.4 OR any violation.severity===EventSeverity.HALT OR governanceResult.contractViolations.length>0. Export function decideHalt(score:ConfidenceScore, executionResult:ExecutionMonitorResult, governanceResult:GovernanceEnforcerResult):HaltDecision. autoRecoverable=true only when composite>=0.3 and no HALT severity violations and no contract violations. Export function persistSentinelRun(result:SentinelPrimeRunResult):void using better-sqlite3 prepared statements inserting into sentinel_prime_runs and all ObservationEvents into validation_events. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): ConfidenceScorer formula and DB persistence'."
    gates:
    - type: compile

  - id: s5-orchestrator-wire
    name: Build SentinelPrime orchestrator and wire into phase3-executor
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts, execution-monitor.ts, decision-validator.ts, governance-enforcer.ts, confidence-scorer.ts all in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\index.ts. Export class SentinelPrime with method runFullObservation(params:{buildRunId:string,promptEntry:{id:string,prompt:string,prompt_type:string},promptIndex:number,projectPath:string,gatesPassed:boolean,modifiedFiles:string[],gitDiff:string}):Promise<SentinelPrimeRunResult>. Orchestration sequence: 1) ExecutionMonitor finish() from singleton. 2) DecisionValidator validate(). 3) GovernanceEnforcer enforce(). 4) scoreConfidence(). 5) decideHalt(). 6) persistSentinelRun(). 7) Return SentinelPrimeRunResult. In phase3-executor.ts after the existing Sentinel gate block for each prompt: import SentinelPrime. Get git diff via git diff main..HEAD --name-only and git diff main..HEAD for full diff. Call runFullObservation. Print [SENTINEL PRIME] Confidence: {composite.toFixed(2)} at INFO level via renderProgress. If haltDecision.shouldHalt===true and autoRecoverable===false: renderProgress FAIL level [SENTINEL PRIME] HALT — {reason} then throw to abort run. If shouldHalt===true and autoRecoverable===true: renderProgress WARN level [SENTINEL PRIME] WARN — {reason} and continue. Also start ExecutionMonitor singleton at prompt start before runClaudeImpl. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(sentinel-prime): SentinelPrime wired into Phase 3 executor'."
    gates:
    - type: compile

  - id: orchestrator-types
    name: Create native FORGE 2.0 Orchestrator type definitions
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\sentinel-prime\\types.ts as reference shape. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts exporting these exact interfaces and enums. QueueStatus enum: PENDING, RUNNING, COMPLETE, FAILED, PLANNED, SKIPPED. ManifestStatus enum: IDLE, RUNNING, COMPLETE, FAILED, PAUSED. QueueEntry{id:string, file:string, description:string, status:QueueStatus, dependsOn:string[], promptCount:number, estimatedHours:number, priority:number, startedAt:string|null, completedAt:string|null, error:string|null, sentinelCheckpoint:SentinelPrimeRunResult|null}. LibraryManifest{project:string, version:string, description:string, created:string, queues:QueueEntry[]}. OrchestratorOptions{project:string, libraryPath:string, projectPath:string, dryRun:boolean, skipTo:string|null, only:string|null, resetStatus:boolean, governanceSyncPath:string}. OrchestratorResult{manifestId:string, project:string, queuesRun:number, queuesComplete:number, queuesFailed:number, totalDurationMs:number, startedAt:string, completedAt:string}. QueueTransitionEvent{fromQueueId:string|null, toQueueId:string, reason:string, sentinelPassed:boolean, confidenceScore:number}. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): native FORGE 2.0 orchestrator type definitions'."
    gates:
    - type: compile

  - id: orchestrator-manifest-resolver
    name: Build ManifestResolver and DependencyEngine
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\memory\\builds.ts as DB reference. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\manifest-resolver.ts. Minimum 200 lines. Export class ManifestResolver with: load(manifestPath:string):LibraryManifest — reads and parses library-manifest.yaml from disk using js-yaml, validates required fields, throws descriptive error if malformed. save(manifestPath:string, manifest:LibraryManifest):void — writes updated manifest back to disk preserving formatting. getRunnable(manifest:LibraryManifest):QueueEntry[] — returns all PENDING queues whose dependsOn are all COMPLETE, sorted by priority ascending. markRunning(manifest:LibraryManifest, queueId:string, manifestPath:string):void — sets status RUNNING, sets startedAt, saves manifest and upserts orchestrator_queue_runs DB row. markComplete(manifest:LibraryManifest, queueId:string, manifestPath:string):void — sets status COMPLETE, sets completedAt, saves manifest and updates DB row. markFailed(manifest:LibraryManifest, queueId:string, error:string, manifestPath:string):void — sets status FAILED, records error, saves manifest and updates DB row. validateNoCycles(manifest:LibraryManifest):void — detects circular dependencies and throws with descriptive message. Export createManifestResolver():ManifestResolver. Run pnpm run build in C:\\Users\\manag\\Documents\\forge-2 confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): ManifestResolver with dependency resolution and cycle detection'."
    gates:
    - type: compile

  - id: orchestrator-governance-sync
    name: Build GovernanceSync module — DIRECTIVE-016 native implementation
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\governance-sync.ts. Export function syncGovernanceDocs(projectRepoPath:string, forgeProjectPath:string):SyncResult where SyncResult={filesSynced:string[],filesSkipped:string[],errors:string[]}. Implementation: read all *.md files from projectRepoPath root directory using fs.readdirSync filtered to .md extension. For each file copy to forgeProjectPath using fs.copyFileSync. Track files synced, skipped (if source newer check fails), and any copy errors. Never throw — collect errors and return them. Log each file synced via renderProgress-style output: [yyyy-MM-dd HH:mm:ss] [INFO] [GOVERNANCE] Synced {filename} to forge projects folder. Export function syncBeforeQueueRun(options:OrchestratorOptions):SyncResult — calls syncGovernanceDocs then logs summary: [GOVERNANCE] {n} docs synced to {forgeProjectPath}. This implements DIRECTIVE-016 natively in FORGE 2.0 — no PowerShell required. Also export function verifyGovernancePresent(forgeProjectPath:string, requiredDocs:string[]):string[] returning list of any required docs missing from forgeProjectPath. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): GovernanceSync DIRECTIVE-016 native implementation'."
    gates:
    - type: compile

  - id: orchestrator-queue-runner
    name: Build QueueRunner — executes individual queue files within orchestrator
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\manifest-resolver.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\governance-sync.ts in full. Read C:\\Users\\manag\\Documents\\forge-2\\src\\phases\\phase3-executor.ts lines 1-80 to understand how build runs are launched. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\queue-runner.ts. Minimum 250 lines. Export class QueueRunner with method run(queueEntry:QueueEntry, options:OrchestratorOptions):Promise<{success:boolean,error:string|null,sentinelResult:SentinelPrimeRunResult|null}>. Implementation: 1) Call syncBeforeQueueRun to enforce DIRECTIVE-016 before every queue. 2) Resolve full queue file path from options.libraryPath/options.project/queueEntry.file. 3) Copy queue file to forge projects folder as queue.yaml (matching FORGE 1.0 pattern). 4) Spawn forge build subprocess pointing at the queue, streaming stdout in real time to process.stdout using renderProgress format. 5) On process exit: if exit code 0 mark success. If non-zero mark failed. 6) After completion run SentinelPrime checkpoint: read last sentinel_prime_runs row for this build run from DB, attach as sentinelResult. 7) If sentinelResult.haltDecision.shouldHalt and not autoRecoverable: return success=false with halt reason as error. 8) Stream all output with [ORCHESTRATOR] prefix before queue name. Export createQueueRunner():QueueRunner. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): QueueRunner with real-time streaming and Sentinel Prime checkpoint'."
    gates:
    - type: compile

  - id: orchestrator-engine
    name: Build OrchestratorEngine — master loop with dependency resolution
    prompt: "Read C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\types.ts, manifest-resolver.ts, queue-runner.ts, governance-sync.ts all in full. Create C:\\Users\\manag\\Documents\\forge-2\\src\\orchestrator\\engine.ts. Minimum 300 lines. Export class OrchestratorEngine with method run(options:OrchestratorOptions):Promise<OrchestratorResult>. Implementation: 1) Load manifest via ManifestResolver. Insert orchestrator_manifests DB row with status RUNNING. 2) If options.dryRun: print full execution plan showing queue order, dependencies, estimated hours, total — do not execute, return. 3) If options.only: filter to single queue by id, skip dependency check. 4) If options.skipTo: mark all queues before skipTo as SKIPPED. 5) Main loop: while getRunnable() returns entries: take highest priority runnable queue. If options.resetStatus reset it to PENDING first. Call QueueRunner.run(). On success: markComplete, log [ORCHESTRATOR] QUEUE COMPLETE: {id} ({durationMs}ms). On failure: markFailed, log [ORCHESTRATOR] QUEUE FAILED: {id} — {error}. If failed queue has dependents: mark all dependents SKIPPED and log reason. After each queue emit QueueTransitionEvent. 6) When no more runnable and no running: check if any PENDING remain blocked — log them as blocked with reason. 7) Update orchestrator_manifests DB row status COMPLETE or FAILED. Return OrchestratorResult. Handle OutOfMemory gracefully: catch heap errors, save manifest state, exit with message to resume via --skipTo. Export createOrchestratorEngine():OrchestratorEngine. Run pnpm run build confirm 0 errors. Commit: git add -A; git commit -m 'feat(orchestrator): OrchestratorEngine master loop with dependency resolution'."
    gates:
    - type: compile


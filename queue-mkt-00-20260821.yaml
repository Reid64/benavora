- id: knw-001
  name: Knowledge schema migration for Benavora Assist
  prompt: "Work in C:\\Users\\manag\\Documents\\benavora. Read BENAVORA_MARKETING_SITE_BLUEPRINT.md and STANDING_DIRECTIVES.md in full before any edit. Rules: ASCII-only in every file you write; all colors as inline style={{}} hex (Tailwind color classes and CSS vars are overridden by globals.css); zero emoji; never set ignoreBuildErrors or ignoreDuringBuilds; scoped git add only, never git add -A; read any file before editing it and verify exact export names before importing. Do not touch any file under src/app/(dashboard) or worker/ unless this prompt explicitly names it.\n\nSTEP 1 - READ supabase/migrations/ and find the highest-numbered file. Read STANDING_DIRECTIVES.md DIRECTIVE-017 (DDL path) and the migration-ledger procedure recorded in MIGRATION_IDEMPOTENCY_AUDIT.md from the reconciliation run. Read SCHEMA_REGISTRY_v2.md to confirm schema knowledge does not already exist.\n\nSTEP 2 - CREATE supabase/migrations/[NEXT]_knowledge_schema.sql (zero-padded, next number) with EXACTLY this SQL:\n\nCREATE SCHEMA IF NOT EXISTS knowledge;\nCREATE EXTENSION IF NOT EXISTS vector;\nCREATE TABLE IF NOT EXISTS knowledge.sources (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  name text NOT NULL,\n  publisher text NOT NULL,\n  tier smallint NOT NULL CHECK (tier BETWEEN 1 AND 4),\n  rights text NOT NULL CHECK (rights IN ('host','index','link')),\n  license_note text,\n  url text NOT NULL UNIQUE,\n  format text NOT NULL CHECK (format IN ('pdf','html','epub','xlsx','csv','txt')),\n  topics text[] NOT NULL DEFAULT '{}',\n  public_listing boolean NOT NULL DEFAULT true,\n  added_at timestamptz NOT NULL DEFAULT now()\n);\nCREATE TABLE IF NOT EXISTS knowledge.documents (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  source_id uuid NOT NULL REFERENCES knowledge.sources(id) ON DELETE CASCADE,\n  title text NOT NULL,\n  canonical_url text NOT NULL,\n  storage_path text,\n  sha256 text NOT NULL,\n  byte_size integer,\n  fetched_at timestamptz NOT NULL DEFAULT now(),\n  status text NOT NULL DEFAULT 'fetched' CHECK (status IN ('fetched','chunked','embedded','failed')),\n  error text,\n  UNIQUE (source_id, sha256)\n);\nCREATE TABLE IF NOT EXISTS knowledge.chunks (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  document_id uuid NOT NULL REFERENCES knowledge.documents(id) ON DELETE CASCADE,\n  ordinal integer NOT NULL,\n  content text NOT NULL,\n  token_count integer NOT NULL,\n  embedding vector(1536),\n  tsv tsvector GENERATED ALWAYS AS (to_tsvector('english', content)) STORED,\n  metadata jsonb NOT NULL DEFAULT '{}',\n  UNIQUE (document_id, ordinal)\n);\nCREATE TABLE IF NOT EXISTS knowledge.queries (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  surface text NOT NULL CHECK (surface IN ('public','app')),\n  org_id uuid,\n  client_key text,\n  question text NOT NULL,\n  answer text,\n  chunk_ids uuid[] NOT NULL DEFAULT '{}',\n  model text,\n  latency_ms integer,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS idx_knowledge_chunks_embedding ON knowledge.chunks USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100);\nCREATE INDEX IF NOT EXISTS idx_knowledge_chunks_tsv ON knowledge.chunks USING gin (tsv);\nCREATE INDEX IF NOT EXISTS idx_knowledge_queries_client ON knowledge.queries (client_key, created_at DESC);\nALTER TABLE knowledge.sources ENABLE ROW LEVEL SECURITY;\nALTER TABLE knowledge.documents ENABLE ROW LEVEL SECURITY;\nALTER TABLE knowledge.chunks ENABLE ROW LEVEL SECURITY;\nALTER TABLE knowledge.queries ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON ALL TABLES IN SCHEMA knowledge FROM anon, authenticated;\nGRANT USAGE ON SCHEMA knowledge TO service_role;\nGRANT ALL ON ALL TABLES IN SCHEMA knowledge TO service_role;\nCREATE OR REPLACE FUNCTION knowledge.search(query_embedding vector(1536), query_text text, match_count integer DEFAULT 8)\nRETURNS TABLE (chunk_id uuid, document_id uuid, title text, canonical_url text, publisher text, rights text, content text, score double precision)\nLANGUAGE sql STABLE SECURITY DEFINER SET search_path = knowledge, public AS $$\nWITH vec AS (\n  SELECT c.id, row_number() OVER (ORDER BY c.embedding <=> query_embedding) AS r\n  FROM knowledge.chunks c WHERE c.embedding IS NOT NULL\n  ORDER BY c.embedding <=> query_embedding LIMIT 20\n), txt AS (\n  SELECT c.id, row_number() OVER (ORDER BY ts_rank_cd(c.tsv, plainto_tsquery('english', query_text)) DESC) AS r\n  FROM knowledge.chunks c WHERE c.tsv @@ plainto_tsquery('english', query_text)\n  ORDER BY ts_rank_cd(c.tsv, plainto_tsquery('english', query_text)) DESC LIMIT 20\n), fused AS (\n  SELECT id, SUM(1.0 / (60 + r)) AS score FROM (SELECT id, r FROM vec UNION ALL SELECT id, r FROM txt) u GROUP BY id\n)\nSELECT c.id, c.document_id, d.title, d.canonical_url, s.publisher, s.rights, c.content, f.score\nFROM fused f JOIN knowledge.chunks c ON c.id = f.id JOIN knowledge.documents d ON d.id = c.document_id JOIN knowledge.sources s ON s.id = d.source_id\nWHERE s.rights IN ('host','index')\nORDER BY f.score DESC LIMIT match_count;\n$$;\nREVOKE ALL ON FUNCTION knowledge.search(vector, text, integer) FROM PUBLIC, anon, authenticated;\nGRANT EXECUTE ON FUNCTION knowledge.search(vector, text, integer) TO service_role;\nCREATE OR REPLACE FUNCTION knowledge.rate_count(p_client_key text, p_window interval DEFAULT interval '24 hours')\nRETURNS integer LANGUAGE sql STABLE SECURITY DEFINER SET search_path = knowledge AS $$\n  SELECT count(*)::integer FROM knowledge.queries WHERE client_key = p_client_key AND created_at > now() - p_window;\n$$;\nREVOKE ALL ON FUNCTION knowledge.rate_count(text, interval) FROM PUBLIC, anon, authenticated;\nGRANT EXECUTE ON FUNCTION knowledge.rate_count(text, interval) TO service_role;\n\nSTEP 3 - APPLY to production via the DIRECTIVE-017 path (psql against DATABASE_URL with -v ON_ERROR_STOP=1, one transaction) and record the ledger row in supabase_migrations.schema_migrations exactly as the reconciliation run did. Then VERIFY with SQL: SELECT table_name FROM information_schema.tables WHERE table_schema='knowledge' ORDER BY 1; must return chunks, documents, queries, sources. SELECT proname FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE nspname='knowledge'; must return rate_count, search. Save both outputs to test-evidence/knowledge/knw-001-verify.txt.\n\nSTEP 4 - RLS proof: using the anon key and a @supabase/supabase-js client, attempt SELECT on knowledge.sources via .schema('knowledge').from('sources').select('*'); it must error or return zero rows with a permission error. Record the exact response in the same evidence file.\n\nSTEP 5 - CREATE src/lib/knowledge/db.ts: import the shared service-role Supabase factory created in the WGR-158 fix (find it under src/lib; do not create a second factory); export knowledgeDb() returning that client with .schema('knowledge') applied; export types Source, Document, Chunk, SearchHit matching the columns above; export async function searchKnowledge(embedding: number[], text: string, k = 8): Promise<SearchHit[]> that calls rpc('search', { query_embedding: embedding, query_text: text, match_count: k }) and throws on error; export async function rateCount(clientKey: string): Promise<number> calling rpc('rate_count', { p_client_key: clientKey }).\n\nSTEP 6 - APPEND a \"knowledge schema\" section to SCHEMA_REGISTRY_v2.md documenting all four tables, both functions, and the deny-all RLS posture.\n\nINCREMENTAL CHECKPOINT: run pnpm tsc --noEmit and fix every error before continuing.\nCLOSE: run pnpm run build (must exit 0 with type validation and lint shown as run, not skipped) and npx vitest run (must exit 0). Then update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual command output (git log -1, ls of files created, build exit code) - never from memory. Commit only the files this prompt created or changed with message prefixed 'mkt: '. Do not push; FORGE pushes on queue completion."

- id: mkt-001
  name: Marketing theme tokens and layout shell
  prompt: "Work in C:\\Users\\manag\\Documents\\benavora. Read BENAVORA_MARKETING_SITE_BLUEPRINT.md and STANDING_DIRECTIVES.md in full before any edit. Rules: ASCII-only in every file you write; all colors as inline style={{}} hex (Tailwind color classes and CSS vars are overridden by globals.css); zero emoji; never set ignoreBuildErrors or ignoreDuringBuilds; scoped git add only, never git add -A; read any file before editing it and verify exact export names before importing. Do not touch any file under src/app/(dashboard) or worker/ unless this prompt explicitly names it.\n\nSTEP 1 - READ src/app/(marketing)/ recursively and src/app/layout.tsx. List every existing marketing route and the current marketing layout/nav/footer components and where they are imported. Record the list in test-evidence/marketing/mkt-001-inventory.md.\n\nSTEP 2 - CREATE src/lib/marketing/theme.ts with EXACTLY:\n\nexport const mk = {\n  forest: \"#1F3A2E\",\n  sage: \"#8FA68E\",\n  paper: \"#F7F5EF\",\n  surface: \"#FFFFFF\",\n  terracotta: \"#C4663A\",\n  terracottaHover: \"#A9532C\",\n  ink: \"#2B2B28\",\n  muted: \"#6F6F69\",\n  line: \"#DDD8CC\",\n  tint: \"#E8EDE6\",\n  heroText: \"#F7F5EF\",\n  heroMuted: \"#B9C8B8\",\n  wordmarkGold: \"#B88A2E\",\n} as const;\nexport type MkColor = keyof typeof mk;\nexport const mkFont = { display: \"var(--mk-display)\", body: \"var(--mk-body)\" } as const;\nexport const mkRadius = { card: 12, cta: 6, shot: 24 } as const;\n\nSTEP 3 - CREATE src/lib/marketing/nav.ts with the full site map as data. EXACT content:\n\nexport type NavLink = { label: string; href: string; blurb?: string };\nexport type NavGroup = { label: string; href: string; items: NavLink[] };\nexport const PLATFORM: NavGroup = { label: \"Platform\", href: \"/platform\", items: [\n  { label: \"Funding Intelligence\", href: \"/platform/funding-intelligence\", blurb: \"Reads the NOFO, scores eligibility, flags what you fail.\" },\n  { label: \"Opportunity Discovery\", href: \"/platform/opportunity-discovery\", blurb: \"Foundation, corporate and government sources in one feed.\" },\n  { label: \"AI Grant Writer\", href: \"/platform/ai-grant-writer\", blurb: \"Drafts from your knowledge base with source citations.\" },\n  { label: \"AutoApply\", href: \"/platform/autoapply\", blurb: \"Fills and submits portals under human approval.\" },\n  { label: \"Pipeline and CRM\", href: \"/platform/pipeline-crm\", blurb: \"Every prospect, stage and deadline in one place.\" },\n  { label: \"Analytics\", href: \"/platform/analytics\", blurb: \"Win rate, time saved, dollars pursued.\" },\n]};\nexport const SOLUTIONS: NavGroup = { label: \"Solutions\", href: \"/solutions\", items: [\n  { label: \"Faith-Based Organizations\", href: \"/solutions/faith-based\" },\n  { label: \"Human Services\", href: \"/solutions/human-services\" },\n  { label: \"Housing\", href: \"/solutions/housing\" },\n  { label: \"Veterans Organizations\", href: \"/solutions/veterans\" },\n  { label: \"Education\", href: \"/solutions/education\" },\n  { label: \"Community Development\", href: \"/solutions/community-development\" },\n]};\nexport const RESOURCES: NavGroup = { label: \"Resources\", href: \"/resources\", items: [\n  { label: \"Library\", href: \"/resources\" },\n  { label: \"Ask Benavora\", href: \"/resources#ask\" },\n]};\nexport const TOP_LINKS: NavLink[] = [\n  { label: \"How It Works\", href: \"/how-it-works\" },\n  { label: \"Agents\", href: \"/agents\" },\n  { label: \"Why Benavora\", href: \"/why-benavora\" },\n  { label: \"Pricing\", href: \"/pricing\" },\n];\nexport const FOOTER_COLUMNS: { heading: string; links: NavLink[] }[] = [\n  { heading: \"Platform\", links: PLATFORM.items },\n  { heading: \"Solutions\", links: SOLUTIONS.items },\n  { heading: \"Company\", links: [\n    { label: \"Trust and Governance\", href: \"/trust\" },\n    { label: \"Company\", href: \"/company\" },\n    { label: \"Book a Demo\", href: \"/demo\" },\n    { label: \"Privacy\", href: \"/privacy\" },\n    { label: \"Terms\", href: \"/terms\" },\n    { label: \"Security\", href: \"/security\" },\n  ]},\n];\nexport const ALL_MARKETING_ROUTES: string[] = [\"/\",\"/platform\",...PLATFORM.items.map(i=>i.href),\"/how-it-works\",\"/agents\",\"/solutions\",...SOLUTIONS.items.map(i=>i.href),\"/why-benavora\",\"/trust\",\"/pricing\",\"/company\",\"/resources\",\"/demo\"];\n\nSTEP 4 - CREATE src/components/marketing/MarketingNav.tsx as a client component. Requirements, implement fully: sticky top bar, background mk.paper, borderBottom 1px solid mk.line, height 64px, max content width 1200px centered. Left: existing Benavora wordmark component (find it in the inventory from STEP 1 and import it; it stays gold). Then TOP_LINKS interleaved as: Platform (mega), Solutions (mega), How It Works, Agents, Resources (mega), Why Benavora, Pricing. Mega-menus open on hover and on click, render as a full-width panel under the bar with background mk.surface, border 1px mk.line, 3-column grid of items showing label (mk.forest, 600) and blurb (mk.muted, 13px). Active route gets a 2px mk.terracotta underline (use usePathname). Right: \"Sign in\" ghost link to /login (mk.forest) and \"Book demo\" button to /demo (background mk.terracotta, color #FFFFFF, hover mk.terracottaHover, radius mkRadius.cta, padding 8px 14px, fontWeight 600). Mobile under 900px: hamburger toggles a stacked panel listing all groups and links. All colors via inline style using mk.*. No emoji, no icon libraries for the hamburger - three 2px bars drawn with divs.\n\nSTEP 5 - CREATE src/components/marketing/MarketingFooter.tsx: background mk.forest, color mk.heroText, 4 columns (wordmark + one-line tagline, then FOOTER_COLUMNS), links color mk.heroMuted hover mk.heroText, bottom row with copyright text and the year from new Date().getFullYear().\n\nSTEP 6 - CREATE src/components/marketing/Cta.tsx exporting CtaPrimary and CtaGhost (props: href, children, onDark?: boolean). Primary: mk.terracotta bg, white text. Ghost: transparent, 1px border mk.forest (or mk.sage when onDark), text mk.forest (or mk.heroText when onDark).\n\nSTEP 7 - CREATE src/components/marketing/Section.tsx exporting Section (props: tone: \"paper\"|\"tint\"|\"surface\"|\"forest\", id?, children) that renders a full-width band with the matching mk background and a 1200px inner container with 72px vertical padding (48px under 900px), and H1/H2 helpers Display1 and Display2 using mkFont.display, color mk.forest (mk.heroText when parent tone is forest), sizes 48/34px desktop, 34/26px mobile.\n\nSTEP 8 - EDIT src/app/(marketing)/layout.tsx (create it if the route group has none): load the fonts with next/font/google - Fraunces (weights 500,600) bound to CSS variable --mk-display and the sans already used by the app (find it in src/app/layout.tsx) bound to --mk-body; render MarketingNav, then {children}, then MarketingFooter inside a div with background mk.paper, color mk.ink, minHeight 100vh. Do not change src/app/layout.tsx.\n\nSTEP 9 - EDIT next.config.mjs: add redirects() entries (permanent: true) mapping any old marketing route found in STEP 1 that no longer exists in ALL_MARKETING_ROUTES to its closest new route (for example /features -> /platform). Keep every existing entry in next.config.mjs untouched.\n\nSTEP 10 - VERIFY: pnpm tsc --noEmit = 0 errors. Start next dev on port 3100, open / and /pricing with Playwright, assert the nav renders, the Platform mega-menu opens on hover, and getComputedStyle of the Book demo button backgroundColor is rgb(196, 102, 58). Save screenshots to test-evidence/marketing/mkt-001/. Stop the dev server.\n\nINCREMENTAL CHECKPOINT: run pnpm tsc --noEmit and fix every error before continuing.\nCLOSE: run pnpm run build (must exit 0 with type validation and lint shown as run, not skipped) and npx vitest run (must exit 0). Then update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual command output (git log -1, ls of files created, build exit code) - never from memory. Commit only the files this prompt created or changed with message prefixed 'mkt: '. Do not push; FORGE pushes on queue completion."

torage bucket knowledge-host at <source_id>/<sha256>.<ext> using the service role client (create the bucket as private if missing) and store storage_path.\n- Chunk with the existing chunker at 800 tokens with 120 overlap (pass the parameters it supports; if it only supports maxTokens and overlap, use those). Insert knowledge.chunks rows with ordinal, content, token_count (estimate 4 chars per token), metadata { source_name, publisher, tier, rights, topics }. Set document status chunked.\n- Embed in batches of 100 with the existing batch function, update chunks.embedding, set status embedded.\n- Run sequentially per source with a 300ms pause between fetches. Print one line per source: name, rights, status, chunk count.\n- Write test-evidence/knowledge/ingest-<YYYYMMDD-HHmm>.json with per-source results and totals: sources, documents embedded, documents failed (with error), chunks, embedding calls.\n- Flags: --only <substring of name> to ingest a subset; --dry-run to fetch and chunk without embedding or writing.\nAdd to package.json scripts: \"knowledge:ingest\": \"tsx scripts/knowledge/ingest.ts\".\n\nSTEP 4 - INCREMENTAL: run pnpm run knowledge:ingest -- --only \"Publication 557\" --dry-run. Must print a chunk count greater than 50 for that document.\n\nSTEP 5 - RUN the full ingest: pnpm run knowledge:ingest. Then verify with SQL: SELECT s.rights, d.status, count(*) FROM knowledge.documents d JOIN knowledge.sources s ON s.id=d.source_id GROUP BY 1,2; and SELECT count(*) FROM knowledge.chunks WHERE embedding IS NOT NULL; Save outputs to test-evidence/knowledge/knw-002-verify.txt. At least 30 documents must be status embedded. List every failed url with its error in the evidence file; do not edit CORPUS_SEED.yaml to remove failures - leave them for review.\n\nSTEP 6 - RETRIEVAL SMOKE: CREATE scripts/knowledge/ask.ts that takes a question string argument, embeds it with the existing single-embedding function, calls searchKnowledge from src/lib/knowledge/db.ts, and prin
m prompt = public prompt plus \"\\nYou are inside the user's Benavora workspace. You may call tools to read their own organization's opportunities, deadlines, pipeline and drafts. Cite workspace data as [workspace]. Never reveal data for any other organization.\" No rate limit. Use the Anthropic tool-use loop: send tools from toolDefinitions(); while stop_reason is tool_use, run each tool via runTool with the caller's orgId, append tool_result blocks, and continue; cap at 4 tool rounds. Log a knowledge.queries row with surface app and org_id.\n\nSTEP 4 - CREATE src/app/api/assist/route.ts: POST, requireRole() to obtain orgId and userId exactly as the stats route does, same zod schema as the public route minus sessionId, call answerApp, return { answer, citations, toolsUsed: string[] }. 401 when unauthenticated via the existing pattern.\n\nSTEP 5 - CREATE src/components/assist/AppAssistPanel.tsx (client) using useAssist with endpoint /api/assist: a right-side slide-over 420px wide opened from a button in the dashboard top bar labelled \"Assist\" (find the top bar in src/app/(dashboard)/layout.tsx or its header component; add the button using the app's existing button styling and Deep Navy #101B2D / Rich Gold #B88A2E palette, NOT the marketing palette). Panel shows messages, citations, and a \"Used: pipeline_summary, upcoming_deadlines\" line when toolsUsed is non-empty. Mount in the dashboard layout.\n\nSTEP 6 - TESTS: src/__tests__/unit/knowledge-tools.test.ts: each tool rejects when called without orgId; runTool passes the caller orgId and ignores any org_id in input; the tool loop stops after 4 rounds. Mock the query functions.\n\nSTEP 7 - VERIFY: pnpm run build exit 0, npx vitest run exit 0. Live against next start on 3101 as info@faithfoundationsf.org via the magic-link Playwright pattern: open /dashboard, click Assist, ask \"What deadlines do I have in the next 30 days?\", confirm the response and that toolsUsed includes upcoming_deadlines; ask \"What is a 990-
- id: mkt-002
  name: MDX content model and all marketing routes
  prompt: "Work in C:\\Users\\manag\\Documents\\benavora. Read BENAVORA_MARKETING_SITE_BLUEPRINT.md and STANDING_DIRECTIVES.md in full before any edit. Rules: ASCII-only in every file you write; all colors as inline style={{}} hex (Tailwind color classes and CSS vars are overridden by globals.css); zero emoji; never set ignoreBuildErrors or ignoreDuringBuilds; scoped git add only, never git add -A; read any file before editing it and verify exact export names before importing. Do not touch any file under src/app/(dashboard) or worker/ unless this prompt explicitly names it.\n\nSTEP 1 - CREATE src/lib/marketing/content.ts:\n\nimport fs from \"node:fs\";\nimport path from \"node:path\";\nimport matter from \"gray-matter\";\nexport type PageLayout = \"platform\"|\"solution\"|\"single\";\nexport type PageMeta = { title: string; description: string; layout: PageLayout; eyebrow?: string; hero?: string; ctaLabel?: string; related?: string[]; faq?: { q: string; a: string }[]; capabilities?: string[]; problems?: { manual: string; benavora: string }[]; steps?: { title: string; agent: string; human: string }[]; demo?: string };\nexport type MarketingPage = { slug: string[]; meta: PageMeta; body: string };\nconst ROOT = path.join(process.cwd(), \"content\", \"marketing\");\nfunction walk(dir: string, acc: string[] = []): string[] { for (const e of fs.readdirSync(dir, { withFileTypes: true })) { const p = path.join(dir, e.name); if (e.isDirectory()) walk(p, acc); else if (e.name.endsWith(\".mdx\")) acc.push(p); } return acc; }\nexport function listPages(): MarketingPage[] { return walk(ROOT).map(readPage); }\nexport function readPage(file: string): MarketingPage { const raw = fs.readFileSync(file, \"utf8\"); const { data, content } = matter(raw); const rel = path.relative(ROOT, file).replace(/\\\\/g, \"/\").replace(/\\.mdx$/, \"\"); const slug = rel === \"index\" ? [] : rel.split(\"/\"); return { slug, meta: data as PageMeta, body: content }; }\nexport function getPage(slug: string[]): MarketingPage | null { const rel = slug.length ? slug.join(\"/\") : \"index\"; const file = path.join(ROOT, rel + \".mdx\"); return fs.existsSync(file) ? readPage(file) : null; }\n\nSTEP 2 - CREATE the content tree under content/marketing/ . One .mdx per route in BENAVORA_MARKETING_SITE_BLUEPRINT.md Section 4 EXCEPT index, pricing, how-it-works, privacy, terms, security, login (those routes already have page files). Files to create: platform.mdx, platform/funding-intelligence.mdx, platform/opportunity-discovery.mdx, platform/ai-grant-writer.mdx, platform/autoapply.mdx, platform/pipeline-crm.mdx, platform/analytics.mdx, agents.mdx, solutions.mdx, solutions/faith-based.mdx, solutions/human-services.mdx, solutions/housing.mdx, solutions/veterans.mdx, solutions/education.mdx, solutions/community-development.mdx, why-benavora.mdx, trust.mdx, company.mdx, resources.mdx, demo.mdx.\nEvery file MUST have complete front matter per PageMeta and a body of at least 250 words of real, specific copy written to Section 11 copy standards (no adjectives doing the work of evidence; present-tense capability statements; name the human control point on any page that shows an agent acting; no unverifiable numbers). Platform pages: layout platform, eyebrow \"Platform\", hero one sentence, capabilities 5 items, problems 3 pairs, steps 3 items each naming the agent family and the human gate, faq 5 items under 80 words each, related 3 hrefs, demo set to one of replay|theater|analysis|pipeline|none. Solutions pages: layout solution, eyebrow \"Solutions for\", problems 3 pairs specific to that org type and its funding sources (faith-based: religion-related foundations, denominational funds, community foundations; human services: HHS/SAMHSA/state DHS plus local foundations; housing: HUD CoC/CDBG/HOME, LIHTC-adjacent foundations, TDHCA for Texas; veterans: VA SSVF, VFW/American Legion foundations, state veteran commissions; education: ED, Title programs, school foundations; community development: EDA, CDFI Fund, USDA RD, CDBG), capabilities 5 items linking to platform pages, faq 4 items. Single pages: layout single with hero and body. demo.mdx body contains an HTML comment <!-- ZOHO_BOOKINGS_EMBED --> where the embed will go. Use Faith Foundation only as \"our founding organization\" and make no customer, testimonial, or results claims anywhere.\n\nSTEP 3 - CREATE src/components/marketing/PageTemplates.tsx exporting PlatformTemplate, SolutionTemplate, SingleTemplate, each taking { page: MarketingPage; children: React.ReactNode } where children is the rendered MDX body. PlatformTemplate order: Section tone forest (eyebrow in mk.sage 13px uppercase letterSpacing 1px; Display1 title; hero paragraph mk.heroMuted 18px; CtaPrimary \"Book a demo\" href /demo and CtaGhost onDark \"See it run\" href #demo) -> Section tone paper id demo containing a DemoSlot component that renders a 16:9 placeholder card (background mk.surface, border 1px mk.line, radius mkRadius.shot, centered text \"Demo: {meta.demo}\" in mk.muted) when meta.demo is not none -> Section tint \"The manual way versus Benavora\" as a 2-column table of meta.problems -> Section paper \"What it does\" 5-item capabilities list with a 4px mk.terracotta left rule per item -> Section surface \"How the AI works\" 3 cards from meta.steps showing title, agent family, and \"Human control: {human}\" -> Section paper MDX body -> Section tint \"Related\" 3 cards from meta.related resolved via listPages() titles -> Section paper FAQ as details/summary elements -> Section forest CTA band. SolutionTemplate: forest hero -> tint problems -> paper capabilities (each item is a link) -> surface MDX body -> paper FAQ -> forest CTA. SingleTemplate: forest hero (if meta.hero) -> paper MDX body -> forest CTA unless slug is demo.\n\nSTEP 4 - CREATE src/app/(marketing)/[...slug]/page.tsx as a server component: generateStaticParams from listPages(); generateMetadata from meta.title and meta.description with title suffix \" | Benavora\"; notFound() when getPage returns null; render body with next-mdx-remote/rsc compileMDX and pass the result into the template selected by meta.layout. Export dynamicParams = false.\n\nSTEP 5 - CREATE scripts/marketing/smoke-routes.mjs: starts next start on port 3101 against the production build (run pnpm run build first), requests every route in ALL_MARKETING_ROUTES (import the list by reading src/lib/marketing/nav.ts with a regex for hrefs, or duplicate the array), asserts HTTP 200 and that the HTML contains the page title, captures a full-page screenshot of each to test-evidence/marketing/mkt-002/, and writes test-evidence/marketing/mkt-002/routes.json with status per route. Exit non-zero if any route is not 200. Add to package.json scripts: \"marketing:smoke\": \"node scripts/marketing/smoke-routes.mjs\".\n\nSTEP 6 - VERIFY: pnpm run build exit 0, then pnpm run marketing:smoke exit 0 with 22 of 22 routes 200.\n\nINCREMENTAL CHECKPOINT: run pnpm tsc --noEmit and fix every error before continuing.\nCLOSE: run pnpm run build (must exit 0 with type validation and lint shown as run, not skipped) and npx vitest run (must exit 0). Then update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual command output (git log -1, ls of files created, build exit code) - never from memory. Commit only the files this prompt created or changed with message prefixed 'mkt: '. Do not push; FORGE pushes on queue completion."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/marketing/content.ts
    - content/marketing/platform/autoapply.mdx
    - content/marketing/solutions/faith-based.mdx
    - content/marketing/demo.mdx
    - src/components/marketing/PageTemplates.tsx
    - src/app/(marketing)/[...slug]/page.tsx
    - scripts/marketing/smoke-routes.mjs
    - test-evidence/marketing/mkt-002/routes.json
  - type: build
- id: mkt-003
  name: Home gateway page and contrast evidence
  prompt: "Work in C:\\Users\\manag\\Documents\\benavora. Read BENAVORA_MARKETING_SITE_BLUEPRINT.md and STANDING_DIRECTIVES.md in full before any edit. Rules: ASCII-only in every file you write; all colors as inline style={{}} hex (Tailwind color classes and CSS vars are overridden by globals.css); zero emoji; never set ignoreBuildErrors or ignoreDuringBuilds; scoped git add only, never git add -A; read any file before editing it and verify exact export names before importing. Do not touch any file under src/app/(dashboard) or worker/ unless this prompt explicitly names it.\n\nSTEP 1 - READ src/app/(marketing)/page.tsx (the current dark home page) in full and record its sections in test-evidence/marketing/mkt-003-before.md. Capture a before screenshot with Playwright to test-evidence/marketing/mkt-003/before-home.png.\n\nSTEP 2 - REWRITE src/app/(marketing)/page.tsx per BENAVORA_MARKETING_SITE_BLUEPRINT.md Section 3 and Section 4 Home. Exact structure: (1) Section tone forest, minHeight 640px: left column eyebrow \"The autonomous funding acquisition platform for nonprofits\" in mk.sage, Display1 \"Find it. Qualify it. Pursue it. Learn from it.\", paragraph in mk.heroMuted \"One system that discovers funding, qualifies your organization against it, drafts the application, submits under your approval, and learns from every outcome.\", CtaPrimary Book a demo -> /demo and CtaGhost onDark See the platform -> /platform; right column: a DemoSlot placeholder card labelled \"AutoApply replay\" (the real component arrives in a later queue) with aspect ratio 16:9, background rgba(255,255,255,0.06), border 1px solid mk.sage. (2) Section paper \"Three doors\": three cards linking to /platform, /agents, /demo with Display2 titles, 2-line blurbs, and a mk.terracotta \"Explore\" link; card borderTop 4px in mk.forest, mk.sage, mk.terracotta respectively. (3) Section tint \"The funding lifecycle\": an 11-step horizontal strip (Organization Intelligence, Opportunity Discovery, Qualification, Funder Research, Application Development, Human Review, Submission, Follow-Up, Award Tracking, Performance Learning, Continuous Optimization) rendered as numbered chips that wrap on mobile, each linking to /how-it-works#step-N. (4) Section surface \"Platform\": 6 cards from PLATFORM.items with blurb and link. (5) Section paper \"Built for\": 6 links from SOLUTIONS.items as a 3x2 grid. (6) Section tint \"Software should not merely record fundraising activity. It should actively help create it.\" as a Display2 pull-quote with a link to /why-benavora. (7) Section forest final CTA band with CtaPrimary Book a demo and CtaGhost onDark Ask Benavora -> /resources#ask. Remove every element of the old dark page that is not in this list.\n\nSTEP 3 - CREATE scripts/marketing/contrast-check.mjs: computes WCAG contrast ratios for the pairs terracotta on surface, heroMuted on forest, ink on paper, heroText on forest, muted on paper, forest on paper, using the hex values parsed from src/lib/marketing/theme.ts (do not hardcode). Prints a table and writes test-evidence/marketing/mkt-003/contrast.json. Exit non-zero if terracotta on surface < 4.5, heroMuted on forest < 4.5, or ink on paper < 7. Run it. If terracotta on surface fails, darken mk.terracotta in theme.ts in 4-unit steps on each channel until it passes, record the final hex in contrast.json and in BENAVORA_MARKETING_SITE_BLUEPRINT.md Section 3 with a dated note. Do not change any other token.\n\nSTEP 4 - VERIFY with Playwright against pnpm run build + next start on 3101: / renders, the lifecycle strip has 11 chips, getComputedStyle on the hero section backgroundColor is rgb(31, 58, 46), and the final CTA button backgroundColor matches the terracotta hex from contrast.json. Full-page screenshot to test-evidence/marketing/mkt-003/after-home.png. Run pnpm run marketing:smoke again; 22 of 22 must pass.\n\nINCREMENTAL CHECKPOINT: run pnpm tsc --noEmit and fix every error before continuing.\nCLOSE: run pnpm run build (must exit 0 with type validation and lint shown as run, not skipped) and npx vitest run (must exit 0). Then update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual command output (git log -1, ls of files created, build exit code) - never from memory. Commit only the files this prompt created or changed with message prefixed 'mkt: '. Do not push; FORGE pushes on queue completion."

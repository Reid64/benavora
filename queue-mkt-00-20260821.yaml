ny of: software, tool, automate, platform, crm, grant writer, autoapply, benavora, demo, pricing. Pure function, unit-testable.\n- answerPublic(params: { question: string; history: {role:\"user\"|\"assistant\"; content: string}[]; clientKey: string }): Promise<{ answer: string; citations: { n: number; title: string; url: string; publisher: string }[]; offerDemo: boolean; latencyMs: number }>. Implementation: rateCount(clientKey) >= 30 -> throw an Error with message RATE_LIMIT; embed the question with the existing single-embedding function; searchKnowledge(embedding, question, 8); build messages = history (last 6 turns only) + user message containing formatContext + \"Question: \" + question; call the Anthropic client with max_tokens 700 and the system prompt; collect text; compute citations; insert a knowledge.queries row (surface public, client_key, question, answer, chunk_ids, model, latency_ms); return.\n\nSTEP 3 - CREATE src/app/api/public/assist/route.ts: export const runtime = \"nodejs\"; export const maxDuration = 60. POST only. Body schema with zod: { question: string (3..1000), history: array max 12 of {role, content(max 2000)}, sessionId: string uuid }. clientKey = sha256 of (x-forwarded-for first ip or \"unknown\") + \":\" + sessionId, hex. Rate limited by answerPublic; map RATE_LIMIT to 429 JSON { error: \"daily-limit\" }. Any other error -> 500 JSON { error: \"assist-unavailable\" } with the error logged server-side. No auth. Add the route to the middleware public allowlist the same way /api/users/accept is exempted (read src/middleware.ts first and follow its existing pattern exactly).\n\nSTEP 4 - CREATE src/components/marketing/AssistWidget.tsx (client): a floating launcher bottom-right (56px circle, background mk.forest, white \"Ask\" text, no icon) that opens a 380x560 panel (mobile: full-width bottom sheet 80vh) with background mk.surface, border 1px mk.line, radius 12, header \"Ask Benavora\" in mk.forest with a close control, a scrollable message list (user bubbles mk.tint, assistant bubbles mk.surface with 1px mk.line), citations rendered under each assistant message as numbered links (mk.terracotta) opening in a new tab, a textarea + Send button (CtaPrimary styling), a one-line disclaimer in mk.muted \"General guidance from public sources. Not legal or tax advice.\", and an inline \"Book a demo\" link row that appears only when the API returns offerDemo true, shown at most once per session. sessionId generated with crypto.randomUUID() and held in component state (no localStorage). Handle 429 with the message \"You have reached today's limit. Try again tomorrow or book a demo.\" Handle 500 with \"Assist is unavailable right now.\" Enter sends, Shift+Enter newlines. Mount the widget in src/app/(marketing)/layout.tsx below the footer.\n\nSTEP 5 - CREATE src/components/marketing/AssistInline.tsx: the same conversation UI rendered inline (not floating) for embedding on /resources at the #ask anchor; share the message logic by extracting it into src/components/marketing/useAssist.ts (hook: messages, send, loading, error, offerDemo). Edit content/marketing/resources.mdx front matter to add demo: assist and make SingleTemplate render AssistInline under an element with id ask when meta.demo is assist.\n\nSTEP 6 - TESTS: CREATE src/__tests__/unit/knowledge-assist.test.ts with vitest covering formatContext numbering, extractCitations ordering and de-duplication, shouldOfferDemo positive and negative cases, and the clientKey derivation being stable for the same ip+session and different across sessions. Mock the Anthropic and Supabase calls; no network in unit tests.\n\nSTEP 7 - VERIFY: pnpm run build exit 0; start next start on 3101; curl -s -X POST http://localhost:3101/api/public/assist with a valid body asking \"What is Form 990-PF?\" and confirm a JSON answer with at least one citation whose url contains irs.gov. Curl the same endpoint 31 times with one sessionId and confirm the 31st returns 429. Save both output
    description: "/reports - Plum frame, Slate Blue accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /reports. Section: Intelligence & Reports. Frame: #7A5980. Accent: #4F6D8F. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/reports/page.tsx]

      - lib/data/machine-profile-fabrication.ts
      - Any other file that renders a profile shape from bend sequence data

      Audit the current geometry rendering algorithm in BendSequenceDiagram.tsx.
      Answer these specific questions in a written report saved to C:\Users\manag\Documents\afs-website\GEOMETRY_AUDIT.md:

      1. What is the current algorithm for converting bend steps into 2D coordinates?
      2. Does it treat bend angles as ABSOLUTE (each angle is measured from horizontal) or RELATIVE (each angle is a turn from the previous direction)?
      3. What does the database schema for machine_profile_bends contain? List every column and its meaning.
      4. What does each bend step's angleDegrees represent — is it the turn angle, the interior angle, or something else?
      5. Show the exact rendering code path from database row to SVG path.
      6. Identify every place where a profile shape is rendered (SVG, canvas, or otherwise).
      7. What profiles currently render correctly vs incorrectly?

      Do not change any code. Audit only.
      Commit GEOMETRY_AUDIT.md: git add GEOMETRY_AUDIT.md && git commit -m 'docs: geometry rendering audit' && git push origin main

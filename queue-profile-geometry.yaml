  - id: afs-geo-002
    name: Build correct turtle-graphics geometry engine
    prompt: |
      Read CLAUDE.md and GEOMETRY_AUDIT.md from C:\Users\manag\Documents\afs-website before writing any code.
      Read components/studio/BendSequenceDiagram.tsx in full.
      Read the machine_profile_bends table schema from SCHEMA.md.

      The current rendering engine produces incorrect profile shapes because it misinterprets the bend angle data.

      The correct algorithm for rendering a Thalmann DS2801 bend sequence is:

      TURTLE GRAPHICS ALGORITHM:
      Each bend step in machine_profile_bends represents ONE BEND POINT with:
        - left_leg_in: length of the leg BEFORE this bend (in inches)
        - right_leg_in: length of the leg AFTER this bend (in inches)
        - bend_angle_degrees: the TURN ANGLE at this bend point
          - Positive angle = turn counterclockwise (bend upward)
          - Negative angle = turn clockwise (bend downward)
          - 0 degrees = no turn (straight continuation)
          - 90 degrees = sharp right-angle turn upward
          - -90 degrees = sharp right-angle turn downward

      RENDERING PROCEDURE:
      1. Start at origin (0, 0), facing RIGHT (direction = 0 degrees)
      2. For the FIRST bend step:
         a. Draw a line of length left_leg_in in the current direction
         b. Turn by bend_angle_degrees (add to current direction)
         c. Draw a line of length right_leg_in in the new direction
      3. For EACH SUBSEQUENT bend step:
         a. The current position is already at the end of the previous step's right leg
         b. The current direction is already the direction after the previous bend
         c. Turn by this step's bend_angle_degrees
         d. Draw a line of length right_leg_in in the new direction
      4. The result is a connected polyline representing the profile cross-section

      SPECIAL CASES:
      - bend_angle_degrees = 0: this is NOT a bend, it is a straight continuation. Draw right_leg_in in current direction only.
      - When step numbers are non-sequential (gaps in step numbers): treat them as sequential — step order is what matters, not the step number values.
      - Angles outside [-180, 180]: normalize by wrapping.

      COORDINATE SYSTEM FOR SVG:
      - X increases rightward
      - Y increases DOWNWARD (SVG convention — flip sign of Y component when computing direction)
      - So "turn counterclockwise by 90 degrees" visually means turning upward, which in SVG means Y decreases

      Direction math:
        currentDirectionDeg += bend_angle_degrees
        dx = Math.cos(currentDirectionDeg * Math.PI / 180) * legLength
        dy = -Math.sin(currentDirectionDeg * Math.PI / 180) * legLength  // negative because SVG Y is flipped
        nextX = currentX + dx
        nextY = currentY + dy

      REWRITE components/studio/BendSequenceDiagram.tsx completely:

      The component must:
      1. Accept these props:
         interface BendSequenceDiagramProps {
           bends: Array<{
             step: number
             leftLegIn: number    // maps from left_leg_in column
             rightLegIn: number   // maps from right_leg_in column
             angleDegrees: number // maps from bend_angle_degrees column
             radiusIn?: number    // optional, for future radius rendering
           }>
           width?: number         // SVG width, default 200
           height?: number        // SVG height, default 150
           className?: string
           strokeColor?: string   // default '#C0001A' (afs-crimson)
           strokeWidth?: number   // default 2
           showDimensions?: boolean // show leg length labels, default false
           padding?: number       // padding inside SVG viewBox, default 12
         }

      2. Implement the turtle graphics algorithm exactly as specified above

      3. Auto-scale the result to fit within the SVG viewBox:
         - Compute bounding box of all generated points
         - Scale and translate to fit within (padding, padding, width-padding*2, height-padding*2)
         - Preserve aspect ratio
         - Center the profile within the viewBox

      4. Render as SVG <polyline> with the computed points

      5. If showDimensions is true: render small text labels at the midpoint of each leg showing the length in fractional inches

      6. Handle edge cases:
         - Empty bends array: render a horizontal line placeholder
         - Single bend: render correctly
         - All zero angles: render a straight line

      7. Sort bends by step number before processing (do not assume they arrive in order)

      8. Export the geometry computation as a separate named export for reuse:
         export function computeProfilePoints(bends: BendInput[]): { points: {x: number, y: number}[], boundingBox: {minX, minY, maxX, maxY} }

      After rewriting, verify by computing points for this known-good test case:
      bends = [
        { step: 1, leftLegIn: 2, rightLegIn: 1, angleDegrees: 90 },
        { step: 2, leftLegIn: 1, rightLegIn: 3, angleDegrees: -90 }
      ]
      Expected shape: a Z-shaped profile (right 2", turn up 90°, right 1", turn down 90°, right 3")
      Log the computed points to verify they match expectation before committing.

      Run pnpm tsc --noEmit — 0 errors required.
      Run pnpm run build — must pass.
      git add -A && git commit -m 'fix: rewrite BendSequenceDiagram with correct turtle-graphics geometry' && git push origin main
    gates:
      - type: compile
      - type: file_exists
        files:
          - components/studio/BendSequenceDiagram.tsx


  - id: afs-geo-004
    name: Profile Library — fix card rendering and expand to all profiles
    prompt: |
      Read CLAUDE.md from C:\Users\manag\Documents\afs-website.
      Read app/studio/library/page.tsx in full.
      Read components/studio/BendSequenceDiagram.tsx in full.

      Fix these specific issues in the Profile Library page:

      1. PROFILE COUNT — Currently hardcoded to 75. Fix:
         - Query machine_profiles with is_active = true (no is_public filter for authenticated users, is_public = true for anonymous)
         - Display actual count dynamically from query result
         - Remove ALL hardcoded references to "75" from the page
         - Remove all references to "Thalmann DS2801" from public-facing copy
         - Change subtitle to exactly: "Browse every profile in our machine library"

      2. CARD SIZE — Profile cards are too small to read. Fix:
         - Minimum card width: 280px
         - BendSequenceDiagram inside each card: width=240, height=180
         - Profile name: text-sm font-semibold, full name visible (no truncation unless > 40 chars)
         - Show: blank width in inches, bend count, fabrication count

      3. CLICK TO EXPAND — Add full-size modal when clicking any profile card:
         - Modal overlay: dark backdrop, centered, max-w-2xl
         - Large BendSequenceDiagram: width=500, height=400, showDimensions=true
         - Profile name (large, bold)
         - Blank width in inches AND mm
         - Bend count
         - Each bend step listed: "Step N: left leg X", "turn Y°", "right leg Z"
         - Fabricated N times count
         - [Load into FlashDraft] button → navigates to /studio/draft?loadProfile={id}
         - [Close] button

      4. PROFILE NAMES — German names are showing. Apply English translations:
         Run this SQL via Supabase service role client in a one-time script scripts/translate-profile-names.ts:
         UPDATE machine_profiles SET name_en = 'Rake Fascia' WHERE name_original ILIKE '%ortgang%';
         UPDATE machine_profiles SET name_en = 'Valley Flashing' WHERE name_original ILIKE '%kehle%';
         UPDATE machine_profiles SET name_en = 'Edge Angle' WHERE name_original ILIKE '%randwinkel%';
         UPDATE machine_profiles SET name_en = 'Snap Lock Panel' WHERE name_original ILIKE '%steckpaneel%';
         UPDATE machine_profiles SET name_en = 'Eave Drip Edge' WHERE name_original ILIKE '%traufe%';
         UPDATE machine_profiles SET name_en = 'Pent Roof Profile' WHERE name_original ILIKE '%pult%';
         UPDATE machine_profiles SET name_en = 'Radius Profile' WHERE name_original ILIKE '%rund%';
         UPDATE machine_profiles SET name_en = 'Trapezoid Profile' WHERE name_original ILIKE '%trapez%';
         UPDATE machine_profiles SET name_en = CONCAT('Profile ', REGEXP_REPLACE(name_original, '^Rheinzink-Profile_', '')) WHERE name_original ILIKE 'rheinzink%';
         UPDATE machine_profiles SET is_public = false WHERE name_original IN ('Messe', 'Toli', 'Toli1');
         UPDATE machine_profiles SET is_public = false WHERE name_original ILIKE '%BUG%';
         -- Numbered profiles: rename to "Standard Profile NNN"
         UPDATE machine_profiles SET name_en = CONCAT('Standard Profile ', LPAD(name_original, 3, '0')) WHERE name_original ~ '^[0-9]+$' AND LENGTH(name_original) <= 4;

         Add to package.json: "translate:profile-names": "tsx scripts/translate-profile-names.ts"
         Run the script.
         Report how many rows were updated.

      5. BROWSE BUTTON — Change "Browse Profile Library" button to bg-afs-crimson text-white

      Run pnpm tsc --noEmit — 0 errors.
      Run pnpm run build — must pass.
      git add -A && git commit -m 'fix: profile library card size, click-to-expand, English names, dynamic count' && git push origin main
    gates:
      - type: compile
      - type: file_exists
        files:
          - scripts/translate-profile-names.ts

  - id: afs-geo-005
    name: Validate geometry rendering against known profiles
    prompt: |
      Read CLAUDE.md from C:\Users\manag\Documents\afs-website.
      Read components/studio/BendSequenceDiagram.tsx in full.
      Read GEOMETRY_AUDIT.md from C:\Users\manag\Documents\afs-website.

      Create a validation page at app/studio/geometry-test/page.tsx that:

      1. Fetches the first 20 public profiles from machine_profiles with their bend sequences
      2. Renders each profile using BendSequenceDiagram with showDimensions=true
      3. Shows alongside each profile:
         - Profile name
         - Blank width
         - Each bend step's raw data: step number, left leg, right leg, angle
         - The computed SVG points from computeProfilePoints()
      4. This page is for internal validation only — add to /admin routes, not public nav
      5. Renders at /admin/geometry-test

      Also create a unit test file lib/flashdraft/__tests__/geometry.test.ts that tests computeProfilePoints with:

      Test 1 — Simple L-shape:
        bends: [{ step:1, leftLegIn:4, rightLegIn:3, angleDegrees:90 }]
        Expected: starts at (0,0), goes right to (4,0), turns up 90°, ends at (4,-3) [SVG Y is down so -3 means up visually]

      Test 2 — Z-shape:
        bends: [
          { step:1, leftLegIn:2, rightLegIn:1, angleDegrees:90 },
          { step:2, leftLegIn:1, rightLegIn:3, angleDegrees:-90 }
        ]
        Expected: (0,0)→(2,0)→(2,-1)→(3,-1)→(3,-1)→(6,-1) [right 2, up 1, right 1, down 0, right 3]
        Note: after second bend (turn down -90° from going up = going right again) so final segment goes right

      Test 3 — Coping cap (typical):
        bends: [
          { step:1, leftLegIn:3, rightLegIn:4, angleDegrees:-90 },
          { step:2, leftLegIn:4, rightLegIn:3, angleDegrees:90 }
        ]
        Expected: U-shape going down then right then up

      Test 4 — Straight line (0 degree bend):
        bends: [{ step:1, leftLegIn:2, rightLegIn:3, angleDegrees:0 }]
        Expected: straight horizontal line of total length 5"

      Run tests: pnpm test -- --testPathPattern geometry (add jest or vitest config if needed, use whatever test runner is already configured)
      If no test runner is configured, skip the test file and only build the validation page.

      Run pnpm tsc --noEmit — 0 errors.
      Run pnpm run build — must pass.
      git add -A && git commit -m 'feat: geometry validation page and unit tests' && git push origin main
    gates:
      - type: compile
      - type: file_exists
        files:
          - app/admin/geometry-test/page.tsx

  - id: afs-geo-006
    name: FlashDraft — wire Load from Library using correct geometry
    prompt: |
      Read CLAUDE.md from C:\Users\manag\Documents\afs-website.
      Read app/studio/draft/page.tsx in full.
      Read components/studio/BendSequenceDiagram.tsx in full.
      Read app/api/studio/load-profile/[id]/route.ts if it exists.

      The Load from Library feature in FlashDraft loads a machine profile and should pre-populate the canvas with its geometry.
      Currently this fails for anonymous users due to RLS, and may not correctly translate the database bend sequence into canvas points.

      Fix both issues:

      1. CREATE app/api/studio/load-profile/[id]/route.ts (if it doesn't exist):
         - GET endpoint
         - Uses service role client (bypasses RLS)
         - Fetches machine_profile by id WHERE is_public = true OR user is admin
         - Fetches all machine_profile_bends for that profile ordered by step_number
         - Returns: { profile: { id, name_en, blank_width_in, blank_width_mm }, bends: [{step, leftLegIn, rightLegIn, angleDegrees, radiusIn}] }
         - 404 if profile not found or not public and user not admin

      2. In app/studio/draft/page.tsx, find the "Load from Library" functionality:
         - Update it to call /api/studio/load-profile/{id}
         - Use computeProfilePoints() from BendSequenceDiagram to convert bend sequence to canvas points
         - Translate the computed points into the FlashDraft canvas coordinate system
         - Set the profile name from the loaded profile's name_en
         - Show a success toast: "Profile loaded: {name}"

      3. In app/studio/library/page.tsx, ensure [Load into FlashDraft] button in the modal:
         - Links to /studio/draft?loadProfile={profileId}
         - The draft page reads the query param on mount and loads the profile

      Run pnpm tsc --noEmit — 0 errors.
      Run pnpm run build — must pass.
      git add -A && git commit -m 'feat: wire Load from Library with correct geometry and service-role bypass' && git push origin main
    gates:
      - type: compile
      - type: file_exists
        files:
          - app/api/studio/load-profile/[id]/route.ts


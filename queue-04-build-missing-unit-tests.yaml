project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - BLUEPRINT_v2.md
  - SCHEMA_REGISTRY_v2.md
  - TESTING_v2.md
  - STANDING_DIRECTIVES.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"

prompts:
  - id: q4-001
    phase: build
    description: "Build grant-probability-engine.test.ts and digital-twin-builder.test.ts"
    prompt: |
      Find the real source files for grant probability computation and digital twin building (search
      the codebase — file names/locations may differ from TESTING_v2.md's original assumptions).
      Build src/__tests__/unit/grant-probability-engine.test.ts and digital-twin-builder.test.ts using
      Vitest, mocking the Anthropic API per this codebase's real existing mock pattern (check an existing
      passing test file for the actual mock setup used, do not assume TESTING_v2.md's Jest mock syntax works).
      Test real behavior against the real function signatures, not assumed ones.
      Run and report real pass/fail output.
      git add -A; git commit -m 'test(unit): build grant-probability-engine and digital-twin-builder tests'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: q4-002
    phase: build
    description: "Build deadline-predictor.test.ts and relationship-scorer.test.ts"
    prompt: |
      Find the real source files for deadline prediction and relationship scoring logic.
      Build both test files against real function signatures, using the real Vitest mock pattern
      established in q4-001. Run and report real pass/fail output.
      git add -A; git commit -m 'test(unit): build deadline-predictor and relationship-scorer tests'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: q4-003
    phase: build
    description: "Build knowledge-engine.test.ts and outcome-analyzer.test.ts"
    prompt: |
      Find the real source files for knowledge engine querying and outcome analysis.
      Build both test files against real function signatures. Run and report real pass/fail output.
      git add -A; git commit -m 'test(unit): build knowledge-engine and outcome-analyzer tests'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: q4-004
    phase: build
    description: "Build propublica-client.test.ts, samgov-client.test.ts, naics-labels.test.ts"
    prompt: |
      Find the real source files for these three data-pipeline utilities. Build all three test files
      against real function signatures — mock network calls, never call real external APIs in tests.
      Run and report real pass/fail output.
      git add -A; git commit -m 'test(unit): build propublica-client/samgov-client/naics-labels tests'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: q4-005
    phase: build
    description: "Build regressions.test.ts with real regression tests for every bug fixed this session"
    prompt: |
      Build src/__tests__/unit/regressions.test.ts. Add one regression test for each of the following
      real bugs fixed this session, so they cannot silently reappear:
      - funders.automation_level missing column (AutoApply org-readiness check)
      - checkOrgReadiness() querying nonexistent organizations.contact_name column
      - IRS 990 XML fetch using dead S3 URL / wrong fetch method (fetchPage vs fetchRaw)
      - AutonomousAgentResult.matched/.found nonexistent field references
      - Storage bucket created without storage.objects RLS policy
      Each test should assert the fix's actual behavior (e.g. query the real schema for the column's
      existence, or call the fixed function with inputs that would have triggered the original bug).
      Run and report real pass/fail output.
      git add -A; git commit -m 'test(unit): build regression suite for session bugs'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

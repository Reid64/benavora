# queue-pil-str-agents.yaml
# 4 sequential prompts, one per Strategy-family agent (BEN-STR-01..04), built to full spec depth
# per PIL_AGENT_COMPLETE_ROSTER.md and PIL_AGENT_DEPENDENCIES.yaml. src/lib/pil/agents/str/ does
# not exist yet in this repo -- pil-str-01-build creates it. Density/format modeled on
# queue-pil-agents-complete.yaml's pil-str-001 prompt (already audited, working), but split one
# dedicated prompt per agent and gone deeper on dimension-to-code mapping, real column targets,
# and delegation-authority mechanics (AgentRunner.canDelegate checks maxAutonomy against the
# PARENT's own registry ceiling, not the child's -- verified live against src/lib/pil/policy.ts).
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-str-01-build
  name: Implement BEN-STR-01 Prospect Engagement Strategy Agent
  prompt: "Build BEN-STR-01 Prospect Engagement Strategy Agent -- src/lib/pil/agents/str/ does not exist anywhere in this repo yet; this prompt creates it, and BEN-STR-01.ts is the first file written there.\n\nREAD FIRST (do not write anything until you have read all of these in full): src/lib/pil/agent-runner.ts -- the real `Agent` interface is `export interface Agent { execute(context: AgentContext, runner: AgentRunner): Promise<AgentResult>; }`. Every new agent class in this codebase reads `class X implements Agent`, never `extends BaseAgent` -- no BaseAgent class exists anywhere in src/lib/pil/. AgentContext carries agentCode/orgId/prospectId/runId/goal/plan/tools/budget/depth; AgentResult carries status/evidence/conclusions/delegations/tokensUsed/costUsd/error; DelegationRequest carries childAgentCode/objective/maxAutonomy/constraints. src/lib/pil/agents/qlf/BEN-QLF-04.ts is the canonical ~290-line reference implementation every PIL agent in this repo follows -- study its shape: a class implementing Agent, real Supabase reads/writes via getPilClient() against pil_* tables, getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a `delegations: DelegationRequest[]` array on the returned AgentResult used to chain into follow-on agents, and a lazy tryModelTokens()-style private helper gated on context.tools.includes(\"T-MODEL\") before calling runner.useTool(context, \"T-MODEL\", {...}), swallowing failures to 0 tokens rather than throwing. Also read src/lib/pil/agents/index.ts in full -- it exports a single `AGENT_FACTORIES: Record<string, () => Agent>` map (there is no separate AGENT_FACTORIES.ts file); every new agent must be imported there and added to that map, replacing the implicit NotImplementedAgent fallback for its code. Also read src/lib/pil/policy.ts's canDelegate() function -- it checks `AUTONOMY_ORDER[maxAutonomy] <= AUTONOMY_ORDER[parent.default_autonomy_level]`, i.e. against the DELEGATING agent's OWN registry ceiling, not the target's -- get this wrong and AgentRunner.run() marks the whole run \"failed\" the moment an unauthorized delegation is attempted (see agent-runner.ts's `if (!authorized) { ...finalizeRun(...,\"failed\"...) }` branch).\n\nGROUND TRUTH -- registry row (supabase/migrations/155_pil_agent_registry.sql line 112): agent_id BEN-STR-01, name \"Prospect Engagement Strategy Agent\", family strategy, mission \"Determine the most appropriate evidence-based engagement strategy for a qualified prospect.\", default_autonomy_level A2, human_boundary NULL, cadence \"On demand, once a prospect reaches TIER_1_PRIORITY/TIER_2_CULTIVATE.\", spec_ref PROSPECT_INTELLIGENCE_AGENTS.md section BEN-STR-01 -- read that section for narrative detail beyond this one-line mission. Roster dimensions (PIL_AGENT_COMPLETE_ROSTER.md Strategy family): Objective; Prospect Context; Relationship Path; Message Themes; Channel Constraints; Risk And Escalation. Real dependency data (PIL_AGENT_DEPENDENCIES.yaml): depends_on [BEN-QLF-04, BEN-REL-05, BEN-KNW-03]; feeds [BEN-STR-02, BEN-STR-03, BEN-STR-04] -- all three name BEN-STR-01 in their own delegation lists, which is why every one of them requires BEN-STR-01 to already exist first. Note explicitly in a header comment: PIL_AGENT_DEPENDENCIES.yaml's own methodology section states depends_on/feeds record an AUTHORITY (\"may call\") relationship mined from each spec's own delegation section, not a strict data-flow direction -- this codebase's actual `delegations` array on AgentResult is a distinct, concrete forward-execution-chaining mechanism (see BEN-QLF-04's delegation to BEN-SUP-05) that can point the opposite direction from the roster's authority graph; this prompt's delegation logic below follows the concrete forward-chain convention, not a literal reading of the roster's depends_on arrows.\n\nMAP EACH ROSTER DIMENSION TO CONCRETE CODE BEHAVIOR:\nObjective: load the prospect's existing pil_prospect_opportunities row (organization_id + prospect_id match, same find pattern as BEN-QLF-04.upsertOpportunity's find-then-write) -- if none exists yet, early-return via `this.completed({}, reason)` (BEN-QLF-04's exact early-return convention: status completed, conclusions {skipped:true,reason,...}, no throw) since BEN-QLF-04 must run first for this prospect. Derive Objective from opportunity.classification: tier_1_priority -> \"solicit\"; tier_2_cultivate -> \"cultivate\"; tier_3_monitor -> \"monitor\"; anything else (research_more/low_probability/ineligible/disqualified) -> \"research_more\".\nProspect Context: load the pil_prospects row (entity_type, display_name), call getEvidence(prospectId, orgId) and group by claim_type for a summary count map.\nRelationship Path: query pil_graph_edges the same way BEN-QLF-04.scoreRelationshipStrength does (getNodesByProspect then pil_graph_edges where organization_id/is_current=true and source_node_id OR target_node_id in the prospect's node ids) -- that method is private on OpportunityQualificationAgent so cannot be imported; replicate the equivalent query inline in BEN-STR-01 (do not attempt to import a private class method). Compute a 0-100 relationshipPathScore using the same RELATIONSHIP_STRENGTH_SCORE mapping BEN-QLF-04 defines (very_strong:100, strong:80, moderate:55, weak:30, speculative:10), taking the max across matched edges, 0 if none. This stands in for BEN-REL-05's Warm Introduction Pathfinding output, which this codebase has no synchronous persisted read path for yet (same limitation BEN-QLF-04's own header comment documents for BEN-SUP-05 -- no agent in this codebase closes the delegation loop synchronously).\nMessage Themes: reuse BEN-QLF-04's exact CLAIM_TYPES_BY_DIMENSION claim-type vocabulary (do not invent new claim_type strings) -- presence of any of cause_aligned_giving_announcement/cause_statement_or_board_signal/990_mission_cause_alignment/foundation_mission_priorities/philanthropic_announcement in this prospect's evidence yields theme \"mission_alignment\"; presence of documented_major_gift/giving_history yields \"giving_history_continuity\"; presence of foundation_grants_paid/corporate_giving_eligibility_rationale yields \"programmatic_fit\". Return the array of themes actually present (can be empty).\nChannel Constraints: reuse BEN-QLF-04's exact INSTITUTIONAL_ENTITY_TYPES set (family_foundation/private_foundation/community_foundation/corporate_foundation/corporation/institutional_funder) -- if prospect.entity_type is in that set, channels = [\"formal_application\",\"program_officer_contact\"]; otherwise (individual prospects) channels = [\"warm_introduction\",\"email\",\"phone\"]. Document in a code comment that this is a defensible default taxonomy this prompt is establishing, since the roster gives no literal channel list.\nRisk And Escalation: flag HIGH risk when Objective is \"solicit\" AND relationshipPathScore is 0 (a cold solicitation recommendation); flag a risk (any severity) when the average evidence confidence across all of this prospect's evidence items is below 0.4 (a documented threshold matching this codebase's existing DISQUALIFY_SCORE_THRESHOLD/RESEARCH_SUFFICIENCY_THRESHOLD named-constant convention in BEN-QLF-04.ts -- name yours similarly, e.g. `const LOW_CONFIDENCE_THRESHOLD = 0.4;`). On any flagged risk, call createReviewItem() (review_type \"high_impact_action\", subject_type \"pil_prospect_opportunities\", subject_id opportunity.id, priority \"high\" for the cold-solicitation case else \"normal\", summary describing exactly which condition tripped, evidence_refs = the evidence ids considered).\n\nPERSISTENCE: update (not insert) the existing pil_prospect_opportunities row's `engagement_strategy` column (text, real column per src/lib/pil/types.ts's ProspectOpportunity interface) with a concise machine-parseable string of the exact format `${objective}:${channels.join(\"+\")}` -- e.g. \"cultivate:warm_introduction+email\". Do not insert a new opportunity row here; that is BEN-QLF-04's responsibility.\n\nDELEGATIONS (forward-chain array, per this codebase's real convention): if Objective is \"cultivate\", OR Objective is \"solicit\" AND relationshipPathScore is 0, push a delegation to BEN-STR-03 (childAgentCode \"BEN-STR-03\", maxAutonomy \"A2\" -- BEN-STR-01's own registry default_autonomy_level is A2, so A2 is the maximum canDelegate() will authorize; verify this against the live pil_agent_registry row, not just this prompt's text, before hardcoding it) with an objective string explaining why cultivation is indicated. Otherwise, no delegation -- BEN-STR-01 must NOT auto-trigger BEN-STR-02, since BEN-STR-02's own H1 human boundary makes the ask recommendation a separately governed decision, not an automatic continuation of this agent's run.\n\ntokensUsed: same tryModelTokens-equivalent private helper as BEN-QLF-04 (gated on context.tools.includes(\"T-MODEL\")), ~300 units. logAction: action \"engagement_strategy.recommended\", resource_type \"pil_prospect_opportunities\", resource_id opportunity.id, after_state {objective, channels, relationshipPathScore, riskFlagged}.\n\nRegister BEN-STR-01 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map.\n\nTEST FILE: src/__tests__/unit/pil-str-agents.test.ts does not exist anywhere in this repo yet (confirmed via a live search before writing this prompt) -- create it now. Copy src/__tests__/unit/pil-qlf-knw-agents.test.ts's exact header/mocking pattern verbatim into the new file: the same vi.mock() calls for @/lib/pil/db, @/lib/pil/evidence, @/lib/pil/graph, @/lib/pil/monitoring, @/lib/pil/human-review, @/lib/pil/audit; the same chainable table-keyed `makeClient()` helper; the same `baseContext()` helper (update agentCode default to \"BEN-STR-01\"). Add a `describe(\"BEN-STR-01 Prospect Engagement Strategy Agent\", ...)` block with at least: one happy-path test where classification is \"tier_2_cultivate\" and no strong relationship edge exists, asserting a delegation to BEN-STR-03 is present in result.delegations and engagement_strategy was updated to start with \"cultivate:\"; one edge-case test where no pil_prospect_opportunities row exists yet, asserting the early-return `completed({},reason)` shape (status \"completed\", conclusions.skipped true) and that no Supabase update/insert against pil_prospect_opportunities was attempted.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the Objective/Relationship Path/Message Themes/Channel Constraints/Risk-and-Escalation logic and the BEN-STR-03 delegation condition are actually present in code, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (confirm BEN-STR-01 appears in AGENT_FACTORIES, updated PIL agent completion count out of 48) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/str/BEN-STR-01.ts
    - src/__tests__/unit/pil-str-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-str-02-build
  name: Implement BEN-STR-02 Best First Ask Agent
  prompt: "Build BEN-STR-02 Best First Ask Agent -- src/lib/pil/agents/str/ now exists from the prior prompt (BEN-STR-01.ts); add BEN-STR-02.ts alongside it.\n\nREAD FIRST: src/lib/pil/agent-runner.ts (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- `class X implements Agent`, never `extends BaseAgent`). src/lib/pil/agents/qlf/BEN-QLF-04.ts in full (the canonical ~290-line pattern: getPilClient()/getEvidence()/logAction()/createReviewItem(), the VERIFICATION_WEIGHT map and scoreDimension() formula -- max*0.6 + avg*0.4 of clamped-confidence*VERIFICATION_WEIGHT[verification_status] across matched evidence items -- you will replicate this exact formula inline since scoreDimension is a private method and cannot be imported). src/lib/pil/agents/str/BEN-STR-01.ts (just built -- read it for this family's established conventions: early-return pattern, relationship-path query, header-comment style). src/lib/pil/agents/index.ts in full (the real AGENT_FACTORIES map you must add to). src/lib/pil/policy.ts's canDelegate() -- checks maxAutonomy against the DELEGATING agent's own registry ceiling (BEN-STR-02 is A2), not the target's; get this wrong and the whole run fails.\n\nGROUND TRUTH -- registry row (migration 155 line 113): mission \"Recommend an appropriate initial ask or engagement objective.\", default_autonomy_level A2, human_boundary \"H1, final solicitation decision always remains human.\" (quote this exact string in your review-item summary and in a header comment -- this is the one human_boundary value that is NOT NULL among all 4 STR agents), cadence \"On demand.\". Roster dimensions: Ask Type; Amount/Range Rationale; Program Fit; Capacity Constraints; Relationship Stage; Fallback Asks. Real dependencies: depends_on [BEN-QLF-03, BEN-QLF-04, BEN-STR-01, BEN-KNW-03]; feeds [BEN-STR-03, BEN-APP-01, BEN-APP-03] (APP family not built in this codebase, ignore).\n\nMAP EACH DIMENSION TO CONCRETE CODE:\nLoad the prospect's existing pil_prospect_opportunities row (early-return via `completed({},reason)`, BEN-QLF-04's exact pattern, if none exists -- BEN-QLF-04 must run first).\nCapacity Constraints / Program Fit: call getEvidence() and replicate BEN-QLF-04's scoreDimension() formula inline for three dimensions using its exact claim-type arrays: givingCapacity (wealth_capacity, capacity_signal, hidden_capacity_signal_flag, high_compensation_officer_signal), philanthropicPropensity (giving_history, documented_major_gift), missionAffinity (cause_aligned_giving_announcement, cause_statement_or_board_signal, 990_mission_cause_alignment, foundation_mission_priorities, philanthropic_announcement) -- do not invent new claim_type strings, reuse these exactly.\nAsk Type: named-constant thresholds you define and document (matching this codebase's DISQUALIFY_SCORE_THRESHOLD-style convention): capacityScore >= 70 AND propensityScore >= 70 -> \"major_gift_ask\"; capacityScore >= 40 -> \"annual_gift_ask\"; propensityScore >= 40 AND capacityScore < 40 -> \"planned_gift_ask\" (documented rationale: propensity without strong capacity signals suggests a legacy/planned vehicle rather than a large current-cash ask); else -> \"discovery_meeting_request\" (no dollar ask at all, just a relationship-building meeting).\nAmount/Range Rationale: a documented capacity-score-tier table mapped to recommended_ask_low/recommended_ask_high (both real numeric columns on ProspectOpportunity per src/lib/pil/types.ts): capacityScore 90-100 -> $25,000-$100,000; 70-89 -> $10,000-$25,000; 40-69 -> $2,500-$10,000; below 40 -> leave both null (askType is discovery_meeting_request, no dollar figure attached). Document in a code comment that these are directional bands, not precise valuations.\nRelationship Stage: replicate the same pil_graph_edges relationship-strength query BEN-STR-01.ts uses (getNodesByProspect then pil_graph_edges lookup, RELATIONSHIP_STRENGTH_SCORE mapping) -- if you find yourself duplicating this exact query a third time once BEN-STR-03/04 also need it later in this same queue, that is a signal to extract a small src/lib/pil/agents/str/shared.ts module following the REL family's own real precedent (src/lib/pil/agents/rel/shared.ts, which exports MODEL_TOKEN_UNIT_COST_USD/tryModelTokens/getProspectById/etc for BEN-REL-01..08) -- do not create that module yet in this prompt if it would only have one caller so far; note the decision either way in a header comment.\nFallback Asks: a fixed static ladder [\"major_gift_ask\",\"annual_gift_ask\",\"planned_gift_ask\",\"discovery_meeting_request\"] -- return every entry AFTER the primary askType's position in this ladder, capped at 2 entries.\n\nH1 ENFORCEMENT (mandatory, no threshold gate -- this is the one place this family differs from BEN-QLF-04's conditional review-item pattern): this agent must NEVER write anything indicating an ask was actually made, sent, or accepted -- it only ever writes a recommendation. Call createReviewItem() UNCONDITIONALLY, every single time this agent produces a recommendation, regardless of askType or score (review_type \"high_impact_action\", subject_type \"pil_prospect_opportunities\", subject_id opportunity.id, priority \"high\" when askType is \"major_gift_ask\" else \"normal\", summary must literally state: \"BEN-STR-02 recommendation only -- H1, final solicitation decision always remains human.\", evidence_refs = the evidence ids scored above). Assert this unconditional behavior explicitly in the test file described below, contrasting it in a code comment with BEN-QLF-04's conditional (score-threshold-gated) review-item creation.\n\nPERSISTENCE: update the existing pil_prospect_opportunities row's recommended_ask_low and recommended_ask_high columns (both real numeric-or-null columns). Do not touch engagement_strategy (that is BEN-STR-01's column) or classification/status.\n\nDELEGATIONS: push a delegation to BEN-SUP-05 (childAgentCode \"BEN-SUP-05\", maxAutonomy \"A2\" -- BEN-STR-02's own ceiling is A2, verify live against pil_agent_registry) ONLY when askType is \"major_gift_ask\" -- the highest-stakes ask type, matching BEN-QLF-04's own selective critic-delegation convention for its own highest-tier classifications. Do not delegate to BEN-STR-03 automatically here -- BEN-STR-01 already owns that decision.\n\ntokensUsed ~350 units via the same tryModelTokens-equivalent pattern. logAction: action \"ask_recommendation.created\", resource_type \"pil_prospect_opportunities\", resource_id opportunity.id, after_state {askType, recommended_ask_low, recommended_ask_high, fallbackAsks}.\n\nRegister BEN-STR-02 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map.\n\nTEST FILE: src/__tests__/unit/pil-str-agents.test.ts already exists from the prior prompt -- extend it, do not create a duplicate file or a second copy of the mocking helpers. Add a `describe(\"BEN-STR-02 Best First Ask Agent\", ...)` block with: one happy-path test at a mid-tier capacity/propensity combination (askType \"annual_gift_ask\") asserting createReviewItem was called exactly once with priority \"normal\" and recommended_ask_low/high were both set to the documented 40-69 band; one test at the lowest tier (askType \"discovery_meeting_request\") asserting createReviewItem was STILL called (proving the unconditional-H1 behavior, not the conditional BEN-QLF-04 pattern) and that recommended_ask_low/high were both left null.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019).\n3. Verify what you built actually works: re-read the files you changed and confirm createReviewItem fires unconditionally on every path, not just the flagged ones.\n4. Update STATE_OF_THE_BUILD.md from a live audit (confirm BEN-STR-02 appears in AGENT_FACTORIES, updated PIL agent completion count) -- never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/str/BEN-STR-02.ts
    - src/__tests__/unit/pil-str-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-str-03-build
  name: Implement BEN-STR-03 Cultivation Strategy Agent
  prompt: "Build BEN-STR-03 Cultivation Strategy Agent -- src/lib/pil/agents/str/ now has BEN-STR-01.ts and BEN-STR-02.ts; add BEN-STR-03.ts alongside them.\n\nREAD FIRST: src/lib/pil/agent-runner.ts (real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- `class X implements Agent`, never `extends BaseAgent`). src/lib/pil/agents/qlf/BEN-QLF-04.ts in full (canonical pattern, RESEARCH_SUFFICIENCY_THRESHOLD=40 named constant, CLAIM_TYPES_BY_DIMENSION vocabulary). src/lib/pil/agents/str/BEN-STR-01.ts and BEN-STR-02.ts (this family's established relationship-path query and header-comment conventions -- check whether either of them already extracted a shared.ts module per the REL family precedent; if so, import from it here instead of a third inline copy of the same query). src/lib/pil/graph.ts's upsertNode/upsertEdge (the real find-then-write pattern this codebase uses when a table has no natural ON CONFLICT target -- you will need the same pattern for the new table below). src/lib/pil/agents/index.ts in full (the AGENT_FACTORIES map). src/lib/pil/policy.ts's canDelegate() (checks maxAutonomy against the DELEGATING agent's own ceiling -- BEN-STR-03 is A2).\n\nGROUND TRUTH -- registry row (migration 155 line 114): mission \"Create a multi-step relationship-development plan when immediate solicitation is not appropriate.\", default_autonomy_level A2, human_boundary NULL, cadence \"On demand, when BEN-QLF-05/BEN-STR-01 indicate cultivate_first.\". Roster dimensions: Cultivation Stages; Milestones; Relationship-Building Actions; Content/Evidence Needs; Timing; Reassessment Gates. Real dependencies: depends_on [BEN-STR-01, BEN-STR-02, BEN-REL-06, BEN-QLF-05]; feeds [BEN-STR-04] -- BEN-STR-04 names BEN-STR-03 in its own delegation list, confirming the implied chain BEN-STR-01/02 -> BEN-STR-03 -> BEN-STR-04. BEN-QLF-05 (Timing & Readiness Agent) is NOT implemented or registered anywhere in this codebase yet (confirmed absent from src/lib/pil/agents/index.ts's AGENT_FACTORIES) -- this agent must work standalone when triggered directly with just a real context.prospectId (treat an explicit trigger as sufficient signal that cultivation was already determined necessary by whatever called it), and must also work correctly when invoked via BEN-STR-01's delegation (context.goal carries BEN-STR-01's objective string in that case -- no special-casing needed, both paths converge on the same prospectId-driven logic).\n\nLoad the prospect's existing pil_prospect_opportunities row -- early-return via `completed({},reason)` if none exists.\n\nMAP EACH DIMENSION TO CONCRETE CODE:\nCultivation Stages: a fixed, documented 4-stage ladder: [\"identify_shared_ground\",\"warm_introduction_or_first_touch\",\"deepen_engagement\",\"readiness_reassessment\"] -- document in a header comment that this is a standard major-gift cultivation-cycle ladder, since the roster gives no literal stage names.\nMilestones: one object per stage, `{stage, description, suggestedTimingDays, completed:false}`, with suggestedTimingDays at documented cumulative offsets 0/30/90/180 (roughly a 6-month cadence -- document as a reasonable default, not a spec-mandated number).\nRelationship-Building Actions: reuse (or, if BEN-STR-01/02 already extracted one, import) the pil_graph_edges relationship-strength query -- if a warm edge (relationship_strength in strong/very_strong) exists to a tenant-connected node, action = \"warm_introduction_via_[edge properties]\"; otherwise action = \"shared_content_outreach\" (a cold, lower-intensity touch), assigned per stage.\nContent/Evidence Needs: list every evidence claim_type from BEN-QLF-04's CLAIM_TYPES_BY_DIMENSION vocabulary (missionAffinity/givingCapacity/philanthropicPropensity arrays) whose scored dimension is below the reused RESEARCH_SUFFICIENCY_THRESHOLD=40 constant (redefine this constant locally with a comment cross-referencing BEN-QLF-04.ts as the canonical source so the two never drift silently).\nTiming: total plan horizon in days = max(milestone offsets) = 180; nextReassessmentAt = ISO timestamp of now + 180 days.\nReassessment Gates: one boolean per stage, true only for the final stage (\"readiness_reassessment\") -- the point of a reassessment gate is confirming readiness before the fleet re-engages BEN-STR-02/BEN-STR-04, so only the terminal stage requires one by default.\n\nPERSISTENCE -- real schema gap, new migration required: pil_prospect_opportunities has no column for a structured multi-step plan (only engagement_strategy:text and timing_status:enum), and pil_agent_run_events.event_type is a fixed 7-value CHECK constraint (tool_call/delegation_issued/evidence_collected/replan/escalation/budget_warning/stop_condition_met, per supabase/migrations/155_pil_agent_registry.sql lines 167-176) with no slot for a cultivation-plan payload either -- genuinely nothing existing fits. Run `ls supabase/migrations | sort | tail -5` (or the PowerShell equivalent) immediately before writing to confirm the current highest migration number -- at the time this queue was authored it was 164_pil_rel_07_08_registry.sql, but re-verify live since other work may have landed since, and number your new file exactly one higher than whatever you actually find. Create that migration with this exact table (adjust only the leading number if 165 is no longer free):\n\nCREATE TABLE IF NOT EXISTS pil_cultivation_plans (\\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\\n  organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,\\n  prospect_id uuid NOT NULL REFERENCES pil_prospects(id) ON DELETE CASCADE,\\n  opportunity_id uuid NOT NULL REFERENCES pil_prospect_opportunities(id) ON DELETE CASCADE,\\n  stages jsonb NOT NULL DEFAULT '[]',\\n  milestones jsonb NOT NULL DEFAULT '[]',\\n  content_evidence_needs jsonb NOT NULL DEFAULT '[]',\\n  reassessment_gates jsonb NOT NULL DEFAULT '[]',\\n  next_reassessment_at timestamptz,\\n  created_by_agent_id text,\\n  status text NOT NULL DEFAULT 'active' CHECK (status IN ('active','completed','abandoned','superseded')),\\n  created_at timestamptz NOT NULL DEFAULT now(),\\n  updated_at timestamptz NOT NULL DEFAULT now()\\n);\\nCREATE INDEX IF NOT EXISTS idx_pil_cultivation_plans_org_prospect ON pil_cultivation_plans(organization_id, prospect_id);\\nALTER TABLE pil_cultivation_plans ENABLE ROW LEVEL SECURITY;\\nREVOKE ALL ON pil_cultivation_plans FROM anon;\\nCREATE POLICY pil_cultivation_plans_org_select ON pil_cultivation_plans FOR SELECT TO authenticated USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\\nCREATE POLICY pil_cultivation_plans_org_insert ON pil_cultivation_plans FOR INSERT TO authenticated WITH CHECK (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\\nCREATE POLICY pil_cultivation_plans_org_update ON pil_cultivation_plans FOR UPDATE TO authenticated USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\\n\\nThis mirrors pil_agent_runs' exact RLS policy shape (migration 155 lines 155-162: org-scoped select/insert/update, anon fully revoked) -- this codebase already learned the hard way that the public schema's default ACLs auto-grant anon/authenticated full CRUD on any new table lacking explicit RLS+REVOKE, so do not skip the REVOKE line. Add a matching `CultivationPlan` interface to src/lib/pil/types.ts with the same fields (typed, not cast through unknown). Write/update using a find-then-write pattern like graph.ts's upsertNode/upsertEdge (no natural ON CONFLICT target exists) -- at most one 'active' row per (organization_id, prospect_id); if one already exists, update it rather than inserting a duplicate.\n\nDELEGATIONS: push a delegation to BEN-STR-04 (childAgentCode \"BEN-STR-04\", maxAutonomy \"A2\" -- NOT \"A3\": BEN-STR-03's own registry ceiling is A2, and canDelegate() checks maxAutonomy against the DELEGATING agent's ceiling, not BEN-STR-04's own A3 ceiling; requesting A3 here would make canDelegate() return false and fail this run) with an objective describing the new cultivation plan, so the fleet re-evaluates next-best-action once a plan exists.\n\ntokensUsed ~300 units via the tryModelTokens-equivalent pattern. logAction: action \"cultivation_plan.created\", resource_type \"pil_cultivation_plans\", resource_id plan.id, after_state {stageCount:4, nextReassessmentAt}.\n\nRegister BEN-STR-03 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map.\n\nTEST FILE: extend the existing src/__tests__/unit/pil-str-agents.test.ts (do not create a duplicate). Add a `describe(\"BEN-STR-03 Cultivation Strategy Agent\", ...)` block with: one happy-path test asserting a plan with 4 stages was created/upserted and a delegation to BEN-STR-04 with maxAutonomy \"A2\" is present in result.delegations; one edge-case test with no pil_prospect_opportunities row, asserting the early-return shape and that no pil_cultivation_plans write was attempted.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019).\n3. Verify what you built actually works: re-read the files you changed, and confirm the new migration is both present on disk and actually applied the same way the most recent prior pil_* migration was applied (check STANDING_DIRECTIVES.md's migration-application convention, or git log --oneline -- supabase/migrations/164_pil_rel_07_08_registry.sql for precedent, before assuming it's a no-op file).\n4. Update STATE_OF_THE_BUILD.md from a live audit (confirm BEN-STR-03 appears in AGENT_FACTORIES, confirm the new migration number, updated PIL agent completion count) -- never from memory. Update SESSION_STATE.md with the current phase and next action."

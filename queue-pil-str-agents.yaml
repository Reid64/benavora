ty\" (a real per-opportunity sweep requirement none of the SUP ternaries need), its org-wide branch must do more than the SUP agents' simple empty-array fallback: it must actually iterate every open opportunity and produce one recommendation each. Document this reasoning explicitly in a header comment citing the three SUP files above, since this is new precedent for that specific full-loop behavior, not a copy of an existing generic \"batch-sweep\" pattern.\n\nGROUND TRUTH -- registry row (migration 155 line 115): mission \"Continuously determine the most valuable next action for each qualified opportunity.\", default_autonomy_level A3 (the only STR agent above A2), human_boundary NULL, cadence \"Continuous, per active pil_prospect_opportunities row.\". Roster dimensions: Current State; Candidate Actions; Expected Information/Value Gain; Risk; Cost; Policy/Human Gates. Real dependencies: depends_on [BEN-STR-01, BEN-STR-03, BEN-QLF-04, BEN-QLF-05, BEN-SUP-05] -- the only STR agent delegating to a BEN-SUP-* agent; feeds: [] -- PIL_AGENT_DEPENDENCIES.yaml explicitly notes no other agent in the 47-agent fleet names BEN-STR-04 as its own delegation target, making it a genuine terminal leaf.\n\nDUAL-MODE IMPLEMENTATION:\nSingle-prospect mode (context.prospectId is set): load exactly that prospect's pil_prospect_opportunities row filtered to status='open'; if it is not open or does not exist, produce candidateAction \"wait\" and return early with a minimal report (do not throw).\nOrg-wide mode (context.prospectId is null): query ALL of the org's pil_prospect_opportunities rows with status='open' (no prospect_id filter), capped at a documented MAX_BATCH_SIZE = 200 opportunities per run -- if the cap is hit, set conclusions.batchCapped = true so a caller knows to re-run for the remainder. Produce one recommendation per row.\n\nPER-OPPORTUNITY SYNTHESIS (same logic in both modes, just looped in org-wide mode): read engagement_strategy (BEN-STR-01's output, may be null), recommended_ask_low/recommended_ask_high (BEN-STR-02's output, may both be null), timing_status (BEN-QLF-05's output -- that agent is not implemented or registered anywhere in this codebase yet, treat null gracefully, never throw on its absence), classification/confidence (BEN-QLF-04's output). Attempt a query against pil_cultivation_plans for an 'active' row matching this prospect (BEN-STR-03's table, if that prompt already ran in this queue) -- wrap this specific query in a try/catch that treats a missing-table/relation error as \"no active plan\" rather than crashing, since this queue's prompts may not all have executed yet in every environment this agent could run in. Call getEvents(orgId, prospectId) (src/lib/pil/monitoring.ts) and check for any event with status 'new' or 'reviewed', exactly like BEN-QLF-04.scoreTimingFromMonitoring.\n\nCandidate Actions (exact enum): \"solicit_now\" | \"cultivate\" | \"research_more\" | \"monitor\" | \"wait\" | \"escalate_human_review\". Decision order, documented in a header comment: if engagement_strategy starts with \"solicit:\" AND both recommended_ask_low and recommended_ask_high are set -> \"solicit_now\"; else if engagement_strategy starts with \"cultivate:\" OR an active pil_cultivation_plans row was found -> \"cultivate\"; else if opportunity.classification is \"research_more\" -> \"research_more\"; else if there are actionable monitoring events (per the getEvents check above) -> \"escalate_human_review\"; else -> \"monitor\" (the safe default).\nExpected Information/Value Gain: reuse BEN-QLF-04's exact scoredDimensions/coveredCount researchSufficiency approach (fraction of the 8 scorable dimensions with a nonzero score, times 100) recomputed here as a proxy for how much is still unknown -- higher score means more to learn from further research.\nRisk: reapply BEN-STR-01's own cold-solicitation check (candidateAction is \"solicit_now\" AND the same pil_graph_edges relationship-path query used in BEN-STR-01/02/03 returns 0)
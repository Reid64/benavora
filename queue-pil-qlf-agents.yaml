# queue-pil-qlf-agents.yaml
# FORGE 1.0 queue -- 5 sequential prompts covering the Qualification (QLF) family.
# BEN-QLF-04 (Opportunity Qualification Agent) already exists at src/lib/pil/agents/qlf/BEN-QLF-04.ts
# and is UPGRADED in place by the last prompt (pil-qlf-04-upgrade). BEN-QLF-01/02/03/05 do not exist
# yet and are BUILT NEW to the same ~250-300+ line depth by the first 4 prompts, in that order, so
# that by the time BEN-QLF-04 is upgraded its real hand-off tables already exist to read from --
# though every hand-off read is written as a graceful fallback (this codebase's established
# convention, see BEN-KNW-01.ts's existing BEN-KNW-04 delegation), so this ordering is a convenience,
# not a hard requirement. FORGE 1.0's orchestrator runs prompts strictly sequentially from this file,
# not in parallel, so this order is what actually executes.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-qlf-01-build
  name: Build BEN-QLF-01 Mission Affinity Agent new
  prompt: "Implement BEN-QLF-01 -- Mission Affinity Agent, a brand-new PIL agent (src/lib/pil/agents/qlf/BEN-QLF-01.ts does not exist yet, create it). Registry mission (supabase/migrations/155_pil_agent_registry.sql): \"Determine how strongly documented philanthropic behavior aligns with the tenant mission.\" Autonomy A2. Cadence: \"On demand, once Family 3/4 research reaches sufficiency for a prospect.\" Spec dimensions (PROSPECT_INTELLIGENCE_AGENTS.md section BEN-QLF-01): Cause Alignment; Population Alignment; Program Alignment; Geographic Alignment; Recency; Counterevidence.\n\nThis agent is one of the two hand-off targets BEN-QLF-04's own header comment names explicitly (src/lib/pil/agents/qlf/BEN-QLF-04.ts, comment block around its VERIFICATION_WEIGHT/DIMENSION_WEIGHTS constants): \"Family 5's other four specialists ... are not implemented yet ... this agent scores their dimensions itself directly ... once those land, their persisted scores should replace the corresponding scoreDimension() calls below.\" You are landing one of those four specialists now. A separate prompt later in this same queue file (pil-qlf-04-upgrade) wires BEN-QLF-04 to actually consume what you build here -- do not edit BEN-QLF-04.ts in this prompt, only build BEN-QLF-01 and make its output easy for that later prompt to read.\n\nRead src/lib/pil/agents/qlf/BEN-QLF-04.ts in full first. Add the `export` keyword to its VERIFICATION_WEIGHT const and its CLAIM_TYPES_BY_DIMENSION const (both currently module-private) so this file can import and reuse them exactly rather than forking a second copy of the same claim-type vocabulary -- reuse `import { VERIFICATION_WEIGHT, CLAIM_TYPES_BY_DIMENSION } from \"@/lib/pil/agents/qlf/BEN-QLF-04\"` (this is a trivial, additive, non-breaking change to BEN-QLF-04.ts -- do not change any of its logic, only add the two `export` keywords). Use `CLAIM_TYPES_BY_DIMENSION.missionAffinity` (cause_aligned_giving_announcement, cause_statement_or_board_signal, 990_mission_cause_alignment, foundation_mission_priorities, philanthropic_announcement) and `CLAIM_TYPES_BY_DIMENSION.geographicRelevance` (geographic_funder_directory_match, geographic_funding_landscape_magnitude, community_foundation_mention, local_giving_program_mention) as your Cause Alignment / Program Alignment and Geographic Alignment claim-type sources respectively. Also reuse BEN-QLF-04's exact scoreDimension(items) formula (best*0.6 + avg*0.4 of confidence*VERIFICATION_WEIGHT[verification_status], 0-100 rounded) -- export that function too (`export function scoreDimension`) and import it rather than reimplementing it.\n\nScore all 6 named dimensions individually (this is the real difference from BEN-QLF-04's single blended missionAffinity number -- BEN-QLF-01 must expose WHICH evidence drove the score, per its mission, not just a total): causeAlignmentScore = scoreDimension() over cause_aligned_giving_announcement/cause_statement_or_board_signal/990_mission_cause_alignment items. programAlignmentScore = scoreDimension() over foundation_mission_priorities/philanthropic_announcement items. geographicAlignmentScore = scoreDimension() over the four geographicRelevance claim types. recencyScore = a decay function over each contributing item's published_at ?? retrieved_at: 100 at 0 days old, linearly decaying to 0 at 730 days old, floored at 0 -- take the max recencyScore across all contributing items (freshest evidence sets the recency score). populationAlignmentScore: read src/lib/pil/types.ts's Prospect/EvidenceItem interfaces and the organizations table's real columns (grep supabase/migrations for `CREATE TABLE organizations` or its later ALTERs) to check whether any real tenant-declared target-population field exists; if none exists in the applied schema, set populationAlignmentScore to 0 and add \"populationAlignmentScore unscored -- no tenant target-population field in this schema\" to a new `unscoredDimensions: string[]` report field, rather than fabricating a population taxonomy the schema doesn't have. counterevidence: evidence items among the mission-affinity claim types with contradiction_status==='contradicted' -- list their ids in a `counterevidence: string[]` field and subtract 10 points per item (floor 0) from the overall score.\n\noverallScore (0-100, rounded): average of causeAlignmentScore, programAlignmentScore, geographicAlignmentScore, and recencyScore (excluding populationAlignmentScore from the average when it is in unscoredDimensions, per the same graceful-omission logic BEN-QLF-04 already uses for its own coveredCount/researchSufficiency calculation -- read that logic in BEN-QLF-04.ts's execute() method and mirror its shape), minus the counterevidence penalty, clamped to [0,100].\n\nPersist two ways. (1) Write overallScore to pil_prospect_opportunities.mission_affinity_score using the exact same find-or-insert upsert pattern as BEN-QLF-04's own private upsertOpportunity() method (find existing row by organization_id+prospect_id, update if found else insert with the same default field set BEN-QLF-04 already uses) -- do not duplicate that whole method verbatim, extract a small local helper here scoped to just the one column you need to touch, since importing BEN-QLF-04's private method is not possible (it's a class-private method, not exported). (2) Insert a full detail row into a new table so BEN-QLF-04 and future callers can see which evidence drove the score and why, not just the single number. Check the current highest-numbered file in supabase/migrations/ first (run `ls supabase/migrations | sort -t_ -k1 -n | tail -3` or the PowerShell equivalent) -- as of this prompt being written the highest is 164_pil_rel_07_08_registry.sql, so the next number is 165, but VERIFY this live and use whatever the real next-free number is if something has landed since. Create supabase/migrations/165_pil_qlf_assessment_tables.sql (or the correct next number) with exactly this table (idempotent CREATE TABLE IF NOT EXISTS, matching this codebase's existing pil_contradictions/pil_source_registry RLS convention exactly -- org-scoped SELECT/INSERT policies for the `authenticated` role keyed off profiles.organization_id, RLS enabled, anon revoked):\n\nCREATE TABLE IF NOT EXISTS pil_mission_affinity_assessments (\n  id                          uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  organization_id             uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,\n  prospect_id                 uuid NOT NULL REFERENCES pil_prospects(id) ON DELETE CASCADE,\n  opportunity_id               uuid REFERENCES pil_prospect_opportunities(id) ON DELETE SET NULL,\n  cause_alignment_score        numeric NOT NULL DEFAULT 0,\n  population_alignment_score   numeric,\n  program_alignment_score      numeric NOT NULL DEFAULT 0,\n  geographic_alignment_score   numeric NOT NULL DEFAULT 0,\n  recency_score                numeric NOT NULL DEFAULT 0,\n  overall_score                numeric NOT NULL,\n  counterevidence               jsonb NOT NULL DEFAULT '[]'::jsonb,\n  unscored_dimensions           jsonb NOT NULL DEFAULT '[]'::jsonb,\n  evidence_refs                 jsonb NOT NULL DEFAULT '[]'::jsonb,\n  confidence                    numeric NOT NULL DEFAULT 0,\n  computed_by_agent_id          text NOT NULL DEFAULT 'BEN-QLF-01',\n  computed_at                   timestamptz NOT NULL DEFAULT now(),\n  created_at                    timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS idx_pil_mission_affinity_prospect ON pil_mission_affinity_assessments(prospect_id, computed_at DESC);\nCREATE INDEX IF NOT EXISTS idx_pil_mission_affinity_org ON pil_mission_affinity_assessments(organization_id);\nALTER TABLE pil_mission_affinity_assessments ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON pil_mission_affinity_assessments FROM anon;\nCREATE POLICY pil_mission_affinity_assessments_org_select ON pil_mission_affinity_assessments FOR SELECT TO authenticated USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\nCREATE POLICY pil_mission_affinity_assessments_org_insert ON pil_mission_affinity_assessments FOR INSERT TO authenticated WITH CHECK (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\n\nAdd the matching TypeScript interface to src/lib/pil/types.ts near the existing ProspectOpportunity interface (follow that file's existing naming/JSDoc-comment conventions exactly).\n\nReal delegation wiring (per PIL_AGENT_DEPENDENCIES.yaml's BEN-QLF-01 entry: depends_on [BEN-KNW-03, BEN-INT-07, BEN-INT-06], feeds [BEN-QLF-02, BEN-QLF-04]): push a DelegationRequest to BEN-KNW-03 (childAgentCode: \"BEN-KNW-03\", maxAutonomy: \"A2\") whenever the average VERIFICATION_WEIGHT-weighted confidence across all contributing evidence items is below 0.6 -- objective text should name the specific claim_types involved and this prospect id, asking for evidence-quality verification before the score is trusted. Push a DelegationRequest to BEN-INT-07 when zero giving-history-adjacent evidence exists for this prospect, and to BEN-INT-06 when zero foundation-adjacent evidence exists and prospect.entity_type is an institutional funder type (reuse BEN-QLF-04's existing INSTITUTIONAL_ENTITY_TYPES set -- export it from BEN-QLF-04.ts alongside VERIFICATION_WEIGHT/CLAIM_TYPES_BY_DIMENSION/scoreDimension and import it here rather than redefining it a second time).\n\nUse the same completed({}, reason) early-return convention as BEN-QLF-04 for a missing context.prospectId or a prospect not found in pil_prospects. Log the run via logAction() (src/lib/pil/audit.ts) exactly the way BEN-QLF-04 does, with action \"mission_affinity.scored\".\n\nTest file: extend src/__tests__/unit/pil-qlf-knw-agents.test.ts -- read it in full first, it already covers BEN-QLF-04/BEN-KNW-01/02/03 with a shared makeClient()/baseContext() mocking helper pair at the top of the file; reuse those helpers exactly, do not redefine your own mocking scaffold. Add a new `describe(\"BEN-QLF-01 Mission Affinity Agent\", ...)` block with at least: a happy-path test scoring a prospect with cause-aligned and geographic evidence and asserting overallScore and the persisted pil_mission_affinity_assessments insert payload, and an edge-case test for a missing prospectId returning the skipped/completed shape.\n\nRegister the new agent: import it into src/lib/pil/agents/index.ts and add `\"BEN-QLF-01\": () => new MissionAffinityAgent(),` to the AGENT_FACTORIES map (read the whole file first -- it is a flat Record<string, () => Agent> with one import line and one map entry per agent, follow the exact existing style for both).\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (the real Agent interface -- `class X implements Agent`, NOT `extends BaseAgent`, which does not exist anywhere in this codebase -- plus the AgentContext/AgentResult/DelegationRequest interfaces and how AgentRunner.run() executes delegations fire-and-forget via canDelegate()+this.delegate(), decrementing context.depth by 1 per hop and marking a run 'escalated' rather than executing delegations once depth<=0 -- this is the existing hard backstop against runaway mutual delegation, so confirmed cycles like BEN-QLF-04<->BEN-REL-06 and BEN-KNW-02<->BEN-KNW-04 are already safe without new guard code). Study src/lib/pil/agents/qlf/BEN-QLF-04.ts in full -- the real, dense, ~290-line reference implementation every other PIL agent in this repo is told to study: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, a completed({}, reason) early-return convention for missing prospectId/prospect-not-found, and a delegations array in the returned AgentResult used to chain into follow-on agents (e.g. its existing delegation to BEN-SUP-05 for critic review on Tier 1/2 classifications) -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the real 'chain-it' pattern in this codebase's actual agent architecture. Also read src/lib/pil/agents/index.ts in full -- the real registry is an AGENT_FACTORIES map inside that single file (there is NO separate AGENT_FACTORIES.ts file); every new or changed agent must be imported and present in that map, and unregistered agent_ids already resolve gracefully to NotImplementedAgent, which is why forward-delegating to a sibling that may not be registered yet in a parallel queue run is safe and already an established pattern in this codebase (see BEN-KNW-01.ts's own header comment on its existing BEN-KNW-04 delegation).\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) -- quoted per-agent above -- backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md, which are unrelated general-purpose governance docs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code for full behavioral detail beyond the one-line mission text. Every agent must be a real, substantive implementation matching the ~250-300+ line depth of BEN-QLF-04 -- real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, never a thin wrapper that just calls Claude and returns its raw text. Where an LLM call is genuinely useful (a short narrative rationale field, for example), use the exact lazy tryModelTokens(context, runner, units) pattern already established in BEN-QLF-04.ts (context.tools.includes(\"T-MODEL\") guard + runner.useTool(context, \"T-MODEL\", {unitCost, units, costType: \"model_tokens\"}) with a try/catch returning 0 on failure) rather than inventing a new client pattern -- keep every scoring/decision path itself fully deterministic and testable without a live model call.\n\nMANDATORY CLOSE-OUT (do all four, in order, exactly as this repo's other PIL prompts require): 1. Run an incremental test checkpoint now: `pnpm tsc --noEmit` must show 0 errors relative to files this prompt touched -- fix any errors before continuing. Then run `pnpm test:unit` (this repo's real vitest command -- `pnpm test` runs Playwright e2e specs instead and is not the right check for these unit tests) scoped to the test file(s) this prompt touched and confirm they pass; fix any failures before continuing. 2. Run `pnpm run build` -- fix ALL errors before proceeding; do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit; `tsc --noEmit` alone does not catch the build-time ESLint pass `next build` runs). 3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (scoring logic, persistence targets, delegation conditions) is actually present in the code, not just that it compiles -- this repo's own history has real cases of tsc/build passing while nothing behavioral actually changed. 4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which PIL agent codes this prompt built and BEN-QLF-01, their AGENT_FACTORIES registration status verified by re-reading src/lib/pil/agents/index.ts, and the updated X/48 PIL agent completion count computed from an actual count of AGENT_FACTORIES entries, never from memory) -- pull the actual current state from the files/commands you just ran. Update SESSION_STATE.md with the current phase and next action. Do NOT run `npx vercel deploy --prod` or `curl` against any live URL as part of this close-out -- that is out of scope for this prompt."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/qlf/BEN-QLF-01.ts
    - src/__tests__/unit/pil-qlf-knw-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-qlf-02-build
  name: Build BEN-QLF-02 Funding Eligibility Agent new
  prompt: "Implement BEN-QLF-02 -- Funding Eligibility Agent, a brand-new PIL agent (src/lib/pil/agents/qlf/BEN-QLF-02.ts does not exist yet, create it). Registry mission: \"Determine whether a foundation, corporation, or funding program is actually available to the tenant.\" Autonomy A2. Cadence: \"On demand, per foundation/corporate prospect.\" Spec dimensions: Applicant Class; Tax Status; Geography; Program Restrictions; Deadline/Window; Required Prerequisites. This is the second of the two hand-off targets BEN-QLF-04's header comment names for its own fundingEligibility dimension.\n\nRead src/lib/pil/agents/qlf/BEN-QLF-01.ts in full first if it already exists in this repo at the time you run (it is built by an earlier prompt in this same queue file, pil-qlf-01-build) -- per PIL_AGENT_DEPENDENCIES.yaml, BEN-QLF-02 depends_on BEN-QLF-01 (\"mission affinity feeds eligibility reasoning\"). If it exists, import and reuse its exported scoreDimension/VERIFICATION_WEIGHT/CLAIM_TYPES_BY_DIMENSION re-exports the same way BEN-QLF-01 imports them from BEN-QLF-04; if for any reason it is not present yet when you run, import directly from BEN-QLF-04.ts instead (same exported constants) -- do not block this prompt on BEN-QLF-01 existing, this is a soft preference for a single import source, not a hard dependency.\n\nUse `CLAIM_TYPES_BY_DIMENSION.fundingEligibility` from BEN-QLF-04.ts (foundation_application_procedures, corporate_giving_eligibility_rationale, foundation_officers) as your primary evidence source. Score each of the 6 dimensions as a nullable boolean pass/fail plus supporting notes (null = no evidence found either way, distinct from an explicit false): applicantClassPass -- read the tenant organization's real applicant-class-relevant columns (grep supabase/migrations for the `organizations` table's CREATE TABLE and later ALTERs to find its real columns, e.g. any tax-exempt-status/entity-type field; do not assume a column exists without confirming it in a migration file) against any applicant-class restriction text found in foundation_application_procedures/corporate_giving_eligibility_rationale evidence.value; default to null (no known restriction) when no restriction evidence exists, not an optimistic true. taxStatusPass -- same pattern for 501(c)(3)/tax-status restriction language in that evidence. geographyPass -- reuse CLAIM_TYPES_BY_DIMENSION.geographicRelevance evidence cross-referenced against the tenant's declared service geography if such a column exists on organizations (same verify-before-assuming rule); null if neither side has data. programRestrictionsPass -- look for explicit programmatic-exclusion language in foundation_mission_priorities-adjacent evidence.value (define and document a small keyword list you use for this, e.g. \"does not fund\", \"excludes\", \"ineligible categories\" -- a documented heuristic, not full NLP). deadlineWindowPass -- parse any deadline/window date present in foundation_application_procedures evidence.value (jsonb); false if a parsed deadline is strictly in the past, true if in the future, null if no deadline evidence exists. requiredPrerequisitesPass -- presence/absence of foundation_officers or explicit prerequisite/registration-requirement evidence; null if no such evidence exists either way.\n\nOverall `eligible: boolean | null` -- false if ANY dimension explicitly resolved false (a real disqualifying fact was found); true only if at least one dimension resolved true and none resolved false; null if every dimension is null (genuinely no eligibility evidence on file at all -- this is the \"insufficient evidence\" case, must NOT be treated as an optimistic pass). Map to a numeric score for downstream consumers exactly the way BEN-QLF-04's own existing fundingEligibility===0 disqualification check already expects: eligible===true -> 100, eligible===false -> 0, eligible===null -> 0 (same numeric value as an explicit false, since BEN-QLF-04's disqualification logic already treats fundingEligibility===0 as disqualifying for institutional entity types) but with a distinct `disqualifyingReasons` entry text of \"insufficient eligibility evidence on file\" (vs. an explicit false dimension's own specific reason text) so a caller reading the detail table can tell \"confirmed ineligible\" apart from \"unknown\" even though both currently zero out the same way in BEN-QLF-04's scoring.\n\nPersist to a new table only -- there is no existing eligibility column on pil_prospect_opportunities to reuse (verify this yourself by reading src/lib/pil/types.ts's ProspectOpportunity interface in full before writing any code; it has classification/mission_affinity_score/capacity_estimate_low/high/recommended_ask_low/high/timing_status/engagement_strategy/confidence/qualified_by_agent_id/qualified_at/status and nothing eligibility-shaped). Check the current highest-numbered file in supabase/migrations/ live (do not hardcode a number without verifying -- BEN-QLF-01's prompt in this same queue may have already created 165_pil_qlf_assessment_tables.sql; if so, ADD this table to that same migration file rather than creating a near-duplicate 166 file for what is really one related batch of qualification-assessment tables -- read the file first to check whether it already exists and append to it if so, otherwise create the next-numbered file yourself with just this table) with exactly:\n\nCREATE TABLE IF NOT EXISTS pil_funding_eligibility_assessments (\n  id                         uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  organization_id            uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,\n  prospect_id                uuid NOT NULL REFERENCES pil_prospects(id) ON DELETE CASCADE,\n  opportunity_id              uuid REFERENCES pil_prospect_opportunities(id) ON DELETE SET NULL,\n  eligible                    boolean,\n  applicant_class_pass        boolean,\n  tax_status_pass             boolean,\n  geography_pass               boolean,\n  program_restrictions_pass    boolean,\n  deadline_window_pass         boolean,\n  prerequisites_pass           boolean,\n  disqualifying_reasons        jsonb NOT NULL DEFAULT '[]'::jsonb,\n  evidence_refs                 jsonb NOT NULL DEFAULT '[]'::jsonb,\n  confidence                    numeric NOT NULL DEFAULT 0,\n  computed_by_agent_id          text NOT NULL DEFAULT 'BEN-QLF-02',\n  computed_at                   timestamptz NOT NULL DEFAULT now(),\n  created_at                    timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS idx_pil_funding_eligibility_prospect ON pil_funding_eligibility_assessments(prospect_id, computed_at DESC);\nCREATE INDEX IF NOT EXISTS idx_pil_funding_eligibility_org ON pil_funding_eligibility_assessments(organization_id);\nALTER TABLE pil_funding_eligibility_assessments ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON pil_funding_eligibility_assessments FROM anon;\nCREATE POLICY pil_funding_eligibility_assessments_org_select ON pil_funding_eligibility_assessments FOR SELECT TO authenticated USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\nCREATE POLICY pil_funding_eligibility_assessments_org_insert ON pil_funding_eligibility_assessments FOR INSERT TO authenticated WITH CHECK (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\n\nAdd the matching TypeScript interface to src/lib/pil/types.ts next to the mission-affinity one (or next to ProspectOpportunity if BEN-QLF-01 has not landed its own interface yet).\n\nReal delegation wiring (depends_on [BEN-KNW-03, BEN-INT-06, BEN-QLF-01], feeds [BEN-QLF-04, BEN-QLF-05, BEN-INT-06]): push a DelegationRequest to BEN-QLF-01 whenever no pil_mission_affinity_assessments row exists yet for this prospect (still complete THIS run's own eligibility determination using the direct evidence read above -- this is a forward-looking delegation so a future run benefits, not a blocking dependency, matching this codebase's established graceful-degradation convention). Push to BEN-KNW-03 when overall confidence (average evidence confidence across all dimensions with non-null evidence) is below 0.6. Push to BEN-INT-06 when zero foundation-adjacent evidence exists at all for an institutional-entity-type prospect (reuse BEN-QLF-04's exported INSTITUTIONAL_ENTITY_TYPES set).\n\nSame completed({}, reason) early-return convention and logAction() usage (action: \"funding_eligibility.scored\") as BEN-QLF-04/BEN-QLF-01.\n\nTest file: extend src/__tests__/unit/pil-qlf-knw-agents.test.ts (read it in full first, reuse its makeClient()/baseContext() helpers exactly, do not redefine your own). Add `describe(\"BEN-QLF-02 Funding Eligibility Agent\", ...)` with at least: a happy-path eligible===true case, and an eligible===false case driven by an explicit past-deadline evidence item, asserting the persisted disqualifying_reasons content.\n\nRegister in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map (`\"BEN-QLF-02\": () => new FundingEligibilityAgent(),`).\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (the real Agent interface -- `class X implements Agent`, NOT `extends BaseAgent`, which does not exist anywhere in this codebase -- plus the AgentContext/AgentResult/DelegationRequest interfaces and how AgentRunner.run() executes delegations fire-and-forget via canDelegate()+this.delegate(), decrementing context.depth by 1 per hop and marking a run 'escalated' rather than executing delegations once depth<=0 -- this is the existing hard backstop against runaway mutual delegation, so confirmed cycles like BEN-QLF-04<->BEN-REL-06 and BEN-KNW-02<->BEN-KNW-04 are already safe without new guard code). Study src/lib/pil/agents/qlf/BEN-QLF-04.ts in full -- the real, dense, ~290-line reference implementation every other PIL agent in this repo is told to study: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, a completed({}, reason) early-return convention for missing prospectId/prospect-not-found, and a delegations array in the returned AgentResult used to chain into follow-on agents (e.g. its existing delegation to BEN-SUP-05 for critic review on Tier 1/2 classifications) -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the real 'chain-it' pattern in this codebase's actual agent architecture. Also read src/lib/pil/agents/index.ts in full -- the real registry is an AGENT_FACTORIES map inside that single file (there is NO separate AGENT_FACTORIES.ts file); every new or changed agent must be imported and present in that map, and unregistered agent_ids already resolve gracefully to NotImplementedAgent, which is why forward-delegating to a sibling that may not be registered yet in a parallel queue run is safe and already an established pattern in this codebase (see BEN-KNW-01.ts's own header comment on its existing BEN-KNW-04 delegation).\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) -- quoted per-agent above -- backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md, which are unrelated general-purpose governance docs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code for full behavioral detail beyond the one-line mission text. Every agent must be a real, substantive implementation matching the ~250-300+ line depth of BEN-QLF-04 -- real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, never a thin wrapper that just calls Claude
en (boolean|null) -- if a fresh (computed within 30 days) pil_funding_eligibility_assessments row exists for this prospect (BEN-QLF-02's table, per this queue's earlier pil-qlf-02-build prompt), read its deadline_window_pass value directly rather than re-parsing evidence; if no such row exists, fall back to a direct parse of foundation_application_procedures evidence.value for a deadline date the same way BEN-QLF-02's own prompt describes. triggerRecencyDays -- days since the more recent of: the latest getEvents() (src/lib/pil/monitoring.ts) entry, or the latest liquidity_event evidence item's published_at/retrieved_at. relationshipMaturityScore -- read src/lib/pil/agents/rel/BEN-REL-06.ts in full first: it already persists relationship strength directly onto pil_graph_edges.relationship_strength (very_strong/strong/moderate/weak/speculative) plus a numeric strengthScore inside edge.properties.strengthFactors/strengthScore, via the exact same pil_graph_edges rows BEN-QLF-04's own existing scoreRelationshipStrength() method already reads through RELATIONSHIP_STRENGTH_SCORE -- reuse BEN-QLF-04's exported RELATIONSHIP_STRENGTH_SCORE map (add `export` to it alongside the other constants you're already exporting from that file) and read pil_graph_edges the same way BEN-QLF-04's scoreRelationshipStrength() does (export that method as a standalone function too, `export async function scoreRelationshipStrength`, and import/call it here instead of re-deriving graph-edge relationship strength a second time). tenantReadinessScore -- grep supabase/migrations for the organizations table's real columns for any staffing/gift-officer-availability field; if none exists in the applied schema, default to a neutral 50 and add \"tenantReadinessScore unscored -- no tenant-readiness field in this schema\" to a documented `unscoredDimensions: string[]` field, matching BEN-QLF-01's same honesty convention for its own populationAlignmentScore gap, rather than fabricating a tenant-readiness table. documentReadinessScore -- if a fresh pil_funding_eligibility_assessments row exists, use its prerequisites_pass field as a 100/0 signal; else null/unscored. stalenessAndMonitorConditions -- evidence ids among the timing-relevant claim types with freshness_status==='stale', plus any getEvents() entries with status IN ('new','reviewed') (same actionable-event filter BEN-QLF-04's own scoreTimingFromMonitoring already uses).\n\nFinal `timingStatus` decision must be exactly one of the four literal values already defined as `ProspectOpportunityTimingStatus` in src/lib/pil/types.ts -- \"approach_now\" | \"cultivate_first\" | \"monitor\" | \"defer\" (read that type before writing any code; use it as the return type, do not invent new string values). Decision rule, document this reasoning in a header comment: \"defer\" if applicationWindowOpen===false; else \"approach_now\" if applicationWindowOpen===true AND relationshipMaturityScore >= 55 (matches BEN-QLF-04's own RELATIONSHIP_STRENGTH_SCORE \"moderate\" tier threshold) AND (documentReadinessScore===null OR documentReadinessScore >= 70); else \"monitor\" if applicationWindowOpen===null OR stalenessAndMonitorConditions.length > 0; else \"cultivate_first\" (relationship not yet mature enough, but nothing forcing monitor/defer).\n\nPersist to (1) pil_prospect_opportunities.timing_status (existing column, currently always null in BEN-QLF-04's insert defaults) via the same find-or-insert upsert pattern described in the QLF-01/02/03 prompts, and (2) a new detail table -- check for and append to the qualification-assessment-tables migration file the earlier prompts in this queue may have already created, else create the next-numbered file with exactly:\n\nCREATE TABLE IF NOT EXISTS pil_timing_readiness_assessments (\n  id                            uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  organization_id               uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,\n  prospect_id                   uuid NOT NULL REFERENCES pil_prospects(id) ON DELETE CASCADE,\n  opportunity_id                 uuid REFERENCES pil_prospect_opportunities(id) ON DELETE SET NULL,\n  timing_status                  text NOT NULL CHECK (timing_status IN ('approach_now','cultivate_first','monitor','defer')),\n  application_window_open        boolean,\n  trigger_recency_days            integer,\n  relationship_maturity_score     numeric,\n  tenant_readiness_score          numeric,\n  document_readiness_score        numeric,\n  monitor_conditions               jsonb NOT NULL DEFAULT '[]'::jsonb,\n  staleness_flags                  jsonb NOT NULL DEFAULT '[]'::jsonb,\n  unscored_dimensions              jsonb NOT NULL DEFAULT '[]'::jsonb,\n  confidence                        numeric NOT NULL DEFAULT 0,\n  computed_by_agent_id              text NOT NULL DEFAULT 'BEN-QLF-05',\n  computed_at                       timestamptz NOT NULL DEFAULT now(),\n  created_at                        timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS idx_pil_timing_readiness_prospect ON pil_timing_readiness_assessments(prospect_id, computed_at DESC);\nCREATE INDEX IF NOT EXISTS idx_pil_timing_readiness_org ON pil_timing_readiness_assessments(organization_id);\nALTER TABLE pil_timing_readiness_assessments ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON pil_timing_readiness_assessments FROM anon;\nCREATE POLICY pil_timing_readiness_assessments_org_select ON pil_timing_readiness_assessments FOR SELECT TO authenticated USING (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\nCREATE POLICY pil_timing_readiness_assessments_org_insert ON pil_timing_readiness_assessments FOR INSERT TO authenticated WITH CHECK (organization_id = (SELECT organization_id FROM profiles WHERE id = auth.uid()));\n\nAdd the matching TypeScript interface to src/lib/pil/types.ts.\n\nReal delegation wiring (depends_on [BEN-KNW-04, BEN-REL-06, BEN-QLF-02], feeds [BEN-QLF-04, BEN-INT-10, BEN-STR-03]): push a 
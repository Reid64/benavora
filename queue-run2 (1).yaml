      // ANSI color helpers (no external deps)
      const C = {
        reset: '\x1b[0m',
        red: '\x1b[31m',
        yellow: '\x1b[33m',
        green: '\x1b[32m',
        cyan: '\x1b[36m',
        gray: '\x1b[90m',
        bold: '\x1b[1m',
        white: '\x1b[37m',
      };

      function colorSeverity(s: string): string {
        if (s === 'CRITICAL') return `${C.red}[CRITICAL]${C.reset}`;
        if (s === 'WARN')     return `${C.yellow}[WARN]${C.reset}`;
        return `${C.gray}[INFO]${C.reset}`;
      }

      export function renderBanner(projectName: string, scope: string): void {
        console.log(`\n${C.bold}${C.cyan}════════════════════════════════════════════════════════════${C.reset}`);
        console.log(`${C.bold}  FORGE 2.0 — RETROFIT SCAN${C.reset}`);
        console.log(`${C.bold}  Project: ${projectName}  |  Scope: ${scope}${C.reset}`);

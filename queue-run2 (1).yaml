      // ─── OPERATION 9: Package Audit ──────────────────────────────────────────────
      export function auditPackages(projectPath: string, packageManager: string): PackageAuditEntry[] {
        const entries: PackageAuditEntry[] = [];
        const pkgPath = join(projectPath, 'package.json');
        if (!existsSync(pkgPath)) return entries;

        let pkg: Record<string, unknown>;
        try { pkg = JSON.parse(readFileSync(pkgPath, 'utf8')); } catch { return entries; }

        const allDeps = {
          ...((pkg.dependencies as Record<string, string>) ?? {}),
          ...((pkg.devDependencies as Record<string, string>) ?? {}),
        };

        // Security audit
        try {
          const auditCmd = packageManager === 'pnpm' ? 'pnpm audit --json' : packageManager === 'yarn' ? 'yarn audit --json' : 'npm audit --json';
          const auditRaw = execSync(auditCmd, { cwd: projectPath, stdio: 'pipe' }).toString();
          const auditData = JSON.parse(auditRaw);
          const vulns = auditData?.vulnerabilities ?? auditData?.advisories ?? {};
          for (const [name, v] of Object.entries(vulns)) {
            const vuln = v as Record<string, unknown>;
            const severity = String(vuln.severity ?? 'moderate');
            entries.push({
              name,
              issue: 'SECURITY_ADVISORY',
              severity: severity === 'critical' || severity === 'high' ? 'CRITICAL' : 'WARN',
              currentVersion: String(allDeps[name] ?? '?'),
            });
          }
        } catch { /* audit may fail on clean projects */ }

        // Outdated check
        try {
          const outdatedCmd = packageManager === 'pnpm' ? 'pnpm outdated --json' : packageManager === 'yarn' ? 'yarn outdated --json' : 'npm outdated --json';
          const outdatedRaw = execSync(outdatedCmd, { cwd: projectPath, stdio: 'pipe' }).toString();
          const outdatedData = JSON.parse(outdatedRaw);
          for (const [name, info] of Object.entries(outdatedData)) {
            const i = info as Record<string, string>;
            const already = entries.find(e => e.name === name);
            if (!already) {
              entries.push({ name, issue: 'OUTDATED', severity: 'INFO', currentVersion: i.current, latestVersion: i.latest });
            }
          }
        } catch { }

        return entries;
      }

      // ─── OPERATION 10: Governance Document Inventory ─────────────────────────────
      export function inventoryGovernanceDocs(projectPath: string): GovernanceDocEntry[] {

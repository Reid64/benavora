      // FORGE 2.0 — DIAGNOSE: Governance Reconciliation + Enterprise Patterns Gap
      import { readFileSync, existsSync } from 'node:fs';
      import { join } from 'node:path';
      import type { ScanReport, DiagnoseFinding } from './types.js';

      export type MaturityStage = 'FOUNDATION' | 'GROWTH' | 'ENTERPRISE';

      export interface GovernanceReconciliationReport {
        unbuilt: Array<{ feature: string; source: string; recommendation: 'BUILD' | 'DEFER' | 'ABANDON' }>;
        undocumented: Array<{ feature: string; file: string }>;
        generatedAt: string;
      }

      export interface EnterprisePatternsGapReport {
        maturityStage: MaturityStage;
        gaps: Array<{ pattern: string; required: boolean; present: boolean; severity: 'CRITICAL' | 'WARN' | 'INFO' }>;
        generatedAt: string;
      }

      // ─── DETECT MATURITY STAGE ────────────────────────────────────────────────────
      export function detectMaturityStage(report: ScanReport): MaturityStage {
        const totalFiles = report.fileTree.totalFiles;
        const routeCount = report.routeInventory.length;
        const hasTests = report.testAudit.testFilesFound > 0;

        if (totalFiles > 200 && routeCount > 20 && hasTests) return 'ENTERPRISE';
        if (totalFiles > 50 || routeCount > 5) return 'GROWTH';
        return 'FOUNDATION';
      }

      // ─── REPORT 2: GOVERNANCE RECONCILIATION ─────────────────────────────────────
      export function buildGovernanceReconciliationReport(
        report: ScanReport,
        projectPath: string
      ): GovernanceReconciliationReport {
        const unbuilt: GovernanceReconciliationReport['unbuilt'] = [];
        const undocumented: GovernanceReconciliationReport['undocumented'] = [];

        // Parse STATE_OF_THE_BUILD.md for planned features
        const stateFile = join(projectPath, 'STATE_OF_THE_BUILD.md');
        if (existsSync(stateFile)) {
          let content = '';
          try { content = readFileSync(stateFile, 'utf8'); } catch { }

          // Extract NOT_STARTED or PLANNED items
          const notStartedRegex = /\|\s*([^|]+)\s*\|\s*NOT_STARTED\s*\|/g;
          let m: RegExpExecArray | null;
          while ((m = notStartedRegex.exec(content)) !== null) {
            const feature = m[1].trim();
            unbuilt.push({ feature, source: 'STATE_OF_THE_BUILD.md', recommendation: 'BUILD' });
          }

          // Extract DEFERRED items
          const deferredRegex = /\|\s*([^|]+)\s*\|\s*DEFERRED\s*\|/g;
          while ((m = deferredRegex.exec(content)) !== null) {
            const feature = m[1].trim();
            unbuilt.push({ feature, source: 'STATE_OF_THE_BUILD.md', recommendation: 'DEFER' });
          }
        }

        // Detect undocumented features from codebase
        // Files with routes that aren't documented in AGENTS.md
        const agentsFile = join(projectPath, 'AGENTS.md');
        let agentsContent = '';
        if (existsSync(agentsFile)) {
          try { agentsContent = readFileSync(agentsFile, 'utf8'); } catch { }
        }

        for (const route of report.routeInventory) {
          if (route.type === 'API') {
            const routeKey = route.route.replace(/^\//, '');
            if (!agentsContent.includes(routeKey) && !agentsContent.includes(route.file)) {
              undocumented.push({ feature: `API route: ${route.route}`, file: route.file });
            }
          }
        }

        return { unbuilt, undocumented, generatedAt: new Date().toISOString() };
      }

      // ─── REPORT 3: ENTERPRISE PATTERNS GAP ───────────────────────────────────────
      const PATTERNS: Record<string, { foundation: 'skip' | 'check' | 'require'; growth: 'skip' | 'check' | 'require'; enterprise: 'skip' | 'check' | 'require' }> = {
        'Error boundaries':         { foundation: 'skip',    growth: 'check',   enterprise: 'require' },
        'Loading states':           { foundation: 'skip',    growth: 'check',   enterprise: 'require' },
        'RLS policies':             { foundation: 'check',   growth: 'require', enterprise: 'require' },
        'company_id scoping':       { foundation: 'check',   growth: 'require', enterprise: 'require' },
        'Rate limiting':            { foundation: 'skip',    growth: 'skip',    enterprise: 'check' },
        'Audit logging':            { foundation: 'skip',    growth: 'skip',    enterprise: 'check' },
        'OpenTelemetry':            { foundation: 'skip',    growth: 'skip',    enterprise: 'check' },
        'Feature flags':            { foundation: 'skip',    growth: 'skip',    enterprise: 'check' },
        'Error tracking (Sentry)':  { foundation: 'skip',    growth: 'check',   enterprise: 'require' },
        'Env var validation (zod)': { foundation: 'skip',    growth: 'check',   enterprise: 'require' },
      };

      function detectPatternPresence(pattern: string, report: ScanReport, projectPath: string): boolean {
        try {
          const { execSync } = require('node:child_process') as typeof import('node:child_process');
          const searchTerms: Record<string, string> = {
            'Error boundaries': 'ErrorBoundary',
            'Loading states': 'loading.tsx',
            'RLS policies': 'MISSING_RLS', // absence in schemaAudit
            'company_id scoping': 'company_id',
            'Rate limiting': 'rate.limit',
            'Audit logging': 'audit_log',
            'OpenTelemetry': 'opentelemetry',
            'Feature flags': 'feature.flag',
            'Error tracking (Sentry)': '@sentry',
            'Env var validation (zod)': 'z.env',
          };

          if (pattern === 'RLS policies') {
            return !report.schemaAudit.some(s => s.issue === 'MISSING_RLS');
          }

          const term = searchTerms[pattern] ?? pattern;
          try {
            execSync(`grep -r "${term}" ${projectPath}/src --include="*.ts" --include="*.tsx" -l 2>/dev/null | head -1`, { stdio: 'pipe' });
            return true;
          } catch {
            return false;
          }
        } catch {
          return false;
        }
      }

      export function buildEnterprisePatternsGapReport(
        report: ScanReport,
        projectPath: string
      ): EnterprisePatternsGapReport {
        const maturityStage = detectMaturityStage(report);
        const stageKey = maturityStage.toLowerCase() as 'foundation' | 'growth' | 'enterprise';
        const gaps: EnterprisePatternsGapReport['gaps'] = [];

        for (const [pattern, levels] of Object.entries(PATTERNS)) {
          const level = levels[stageKey];
          if (level === 'skip') continue;

          const present = detectPatternPresence(pattern, report, projectPath);
          const required = level === 'require';
          const severity: 'CRITICAL' | 'WARN' | 'INFO' = required && !present ? 'WARN' : present ? 'INFO' : 'INFO';

          gaps.push({ pattern, required, present, severity });
        }

        return { maturityStage, gaps, generatedAt: new Date().toISOString() };
      }

      export function buildDiagnoseSummary(findings: DiagnoseFinding[]): {
        criticalCount: number;
        warnCount: number;
        infoCount: number;
        blocksForwardProgress: boolean;
      } {
        const criticalCount = findings.filter(f => f.severity === 'CRITICAL').length;
        const warnCount = findings.filter(f => f.severity === 'WARN').length;
        const infoCount = findings.filter(f => f.severity === 'INFO').length;
        return { criticalCount, warnCount, infoCount, blocksForwardProgress: criticalCount > 0 };
      }

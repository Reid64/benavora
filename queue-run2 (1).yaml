      // FORGE 2.0 — DIAGNOSE: Architecture Health Report + Adversarial Review
      import type { ScanReport, DiagnoseFinding, FindingSeverity } from './types.js';

      export interface ArchitectureHealthReport {
        critical: DiagnoseFinding[];
        warn: DiagnoseFinding[];
        info: DiagnoseFinding[];
        adversaryFindings: DiagnoseFinding[];
        generatedAt: string;
      }

      function addFinding(
        findings: DiagnoseFinding[],
        severity: FindingSeverity,
        category: string,
        message: string,
        file?: string
      ): void {
        findings.push({ severity, category, message, ...(file ? { file } : {}) });
      }

      export function deriveFindingsFromScanReport(report: ScanReport): DiagnoseFinding[] {
        const findings: DiagnoseFinding[] = [];

        // Broken imports → CRITICAL
        for (const b of report.brokenImports) {
          const msg = b.missingExport
            ? `Missing export '${b.missingExport}' in ${b.resolvedPath}`
            : `Cannot resolve import '${b.importPath}'`;
          addFinding(findings, 'CRITICAL', 'BROKEN_IMPORT', msg, b.sourceFile);
        }

        // TypeScript errors → CRITICAL
        for (const e of report.compilationErrors) {
          addFinding(findings, 'CRITICAL', 'TYPESCRIPT', `${e.code}: ${e.message}`, `${e.file}:${e.line}`);
        }

        // Missing env vars → CRITICAL
        for (const e of report.envAudit) {
          if (e.classification === 'MISSING_LOCAL' || e.classification === 'MISSING_PRODUCTION') {
            addFinding(findings, 'CRITICAL', 'ENV_VAR', `${e.classification}: ${e.name}`);
          }
        }

        // Schema issues → CRITICAL/WARN
        for (const s of report.schemaAudit) {
          if (s.issue === 'TABLE_MISSING_IN_DB' || s.issue === 'COLUMN_DRIFT' || s.issue === 'MISSING_RLS' || s.issue === 'STALE_MIGRATION') {
            addFinding(findings, 'CRITICAL', 'SCHEMA', `${s.issue}: ${s.tableName} — ${s.detail}`);
          } else if (s.issue === 'TABLE_MISSING_IN_TYPES') {
            addFinding(findings, 'WARN', 'SCHEMA', `${s.issue}: ${s.tableName} — ${s.detail}`);
          }
        }

        // Dynamic route failures
        for (const d of report.dynamicAudit) {
          if (d.classification === 'CRITICAL') {
            addFinding(findings, 'CRITICAL', 'DYNAMIC_ROUTE', `HTTP ${d.statusCode} on ${d.route}`, d.url);
          } else if (d.classification === 'WARN') {
            addFinding(findings, 'WARN', 'DYNAMIC_ROUTE', `HTTP ${d.statusCode ?? 'ERR'} on ${d.route}: ${d.error ?? ''}`, d.url);
          }
        }

        // Security vulnerabilities
        for (const p of report.packageAudit) {
          if (p.issue === 'SECURITY_ADVISORY') {
            addFinding(findings, p.severity as FindingSeverity, 'SECURITY', `${p.name}@${p.currentVersion ?? '?'} has security advisory`);
          } else if (p.issue === 'OUTDATED') {
            addFinding(findings, 'INFO', 'PACKAGE', `${p.name} outdated: ${p.currentVersion} → ${p.latestVersion}`);
          }
        }

        // Stale governance
        for (const g of report.governanceInventory) {
          if (g.staleness === 'MISSING') {
            addFinding(findings, 'WARN', 'GOVERNANCE', `${g.filename} is MISSING`);
          } else if (g.staleness === 'STALE') {
            addFinding(findings, 'INFO', 'GOVERNANCE', `${g.filename} is STALE (${g.lastModifiedDays}d old)`);
          }
        }

        // Vercel deploy lag
        if (report.vercelAudit.status === 'WARN') {
          addFinding(findings, 'WARN', 'DEPLOY', `Last Vercel deployment was ${report.vercelAudit.daysSinceDeploy} days ago`);
        }

        // Dead files
        if (report.deadFiles.length > 0) {
          addFinding(findings, 'INFO', 'DEAD_CODE', `${report.deadFiles.length} dead files detected (never imported)`);
        }

        return findings;
      }

      export async function generateArchitectureHealthReport(
        report: ScanReport,
        apiKey?: string
      ): Promise<ArchitectureHealthReport> {
        const primaryFindings = deriveFindingsFromScanReport(report);
        let adversaryFindings: DiagnoseFinding[] = [];

        // Adversarial review via Claude API
        const key = apiKey ?? process.env['ANTHROPIC_API_KEY'];
        if (key) {
          try {

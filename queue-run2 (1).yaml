        } catch (e: unknown) {
          output = (e as { stdout?: Buffer; stderr?: Buffer }).stdout?.toString() ?? '';
          if (!output) output = (e as { stderr?: Buffer }).stderr?.toString() ?? '';
        }
        const errorRegex = /^(.+?)\((\d+),(\d+)\):\s+error\s+(TS\d+):\s+(.+)$/gm;
        let m: RegExpExecArray | null;
        while ((m = errorRegex.exec(output)) !== null) {
          errors.push({ file: m[1], line: parseInt(m[2], 10), column: parseInt(m[3], 10), code: m[4], message: m[5].trim() });
        }
        return errors;

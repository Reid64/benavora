      CREATE src/retrofit/scan-ops-5-8.ts with EXACTLY this content:

      ```typescript
      // FORGE 2.0 — SCAN Operations 5-8: Routes, Env Audit, Schema, Git
      import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
      import { join, relative, dirname } from 'node:path';
      import { execSync } from 'node:child_process';
      import type { RouteEntry, EnvAuditEntry, SchemaAuditEntry } from './types.js';

      const EXCLUDE_DIRS = /node_modules|\.next|\.git|dist|build/;

      // ─── OPERATION 5: Route Inventory ────────────────────────────────────────────
      export function buildRouteInventory(projectPath: string): RouteEntry[] {
        const routes: RouteEntry[] = [];
        const appDir = join(projectPath, 'app');
        const srcAppDir = join(projectPath, 'src', 'app');
        const root = existsSync(appDir) ? appDir : existsSync(srcAppDir) ? srcAppDir : null;
        if (!root) return routes;

        function walk(dir: string): void {
          let entries: string[];
          try { entries = readdirSync(dir); } catch { return; }
          for (const entry of entries) {
            const fullPath = join(dir, entry);
            if (EXCLUDE_DIRS.test(fullPath)) continue;
            let stat;
            try { stat = statSync(fullPath); } catch { continue; }
            if (stat.isDirectory()) { walk(fullPath); continue; }

            const routeSegment = relative(root!, dirname(fullPath)).replace(/\\/g, '/');
            const displayRoute = '/' + routeSegment;

            if (entry === 'page.tsx' || entry === 'page.ts') {
              routes.push({ type: 'PAGE', route: displayRoute, file: relative(projectPath, fullPath) });
            } else if (entry === 'layout.tsx' || entry === 'layout.ts') {
              routes.push({ type: 'LAYOUT', route: displayRoute, file: relative(projectPath, fullPath) });
            } else if (entry === 'route.ts' || entry === 'route.js') {
              let content = '';
              try { content = readFileSync(fullPath, 'utf8'); } catch { }
              const methods: string[] = [];
              for (const method of ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'HEAD', 'OPTIONS']) {
                if (new RegExp(`export\\s+(async\\s+)?function\\s+${method}`).test(content)) methods.push(method);
              }
              routes.push({ type: 'API', route: displayRoute, file: relative(projectPath, fullPath), methods });
            } else if (entry === 'middleware.ts' || entry === 'middleware.js') {
              routes.push({ type: 'MIDDLEWARE', route: '/', file: relative(projectPath, fullPath) });
            }
          }
        }

        walk(root);
        return routes;
      }

      // ─── OPERATION 6: Environment Variable Audit ─────────────────────────────────
      export function auditEnvVars(
        projectPath: string,
        localEnvVars: Record<string, string>,
        vercelAvailable: boolean
      ): EnvAuditEntry[] {
        const codeVars = new Set<string>();
        const entries: EnvAuditEntry[] = [];

        function walk(dir: string): void {
          let files: string[];
          try { files = readdirSync(dir); } catch { return; }
          for (const f of files) {
            const fullPath = join(dir, f);
            if (EXCLUDE_DIRS.test(fullPath)) continue;
            let stat;
            try { stat = statSync(fullPath); } catch { continue; }
            if (stat.isDirectory()) { walk(fullPath); continue; }
            if (!/\.(ts|tsx|js|jsx)$/.test(f)) continue;
            let content = '';
            try { content = readFileSync(fullPath, 'utf8'); } catch { continue; }
            const matches = content.matchAll(/process\.env\.([A-Z_][A-Z0-9_]*)/g);
            for (const m of matches) codeVars.add(m[1]);
          }
        }

        walk(projectPath);

        let vercelVarNames = new Set<string>();
        if (vercelAvailable) {
          try {
            const raw = execSync('vercel env ls --json', { stdio: 'pipe' }).toString();
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              for (const v of parsed) if (v.key) vercelVarNames.add(v.key);
            }
          } catch { }
        }

        for (const v of codeVars) {
          const inLocal = v in localEnvVars;
          const inVercel = vercelAvailable ? vercelVarNames.has(v) : true; // skip check if no vercel
          if (!inLocal) {
            entries.push({ name: v, classification: 'MISSING_LOCAL', severity: 'CRITICAL' });
          } else if (!inVercel) {
            entries.push({ name: v, classification: 'MISSING_PRODUCTION', severity: 'CRITICAL' });
          } else {
            entries.push({ name: v, classification: 'OK', severity: 'INFO' });
          }
        }

        for (const v of Object.keys(localEnvVars)) {
          if (!codeVars.has(v)) {
            entries.push({ name: v, classification: 'UNUSED', severity: 'INFO' });
          }
        }

        return entries;
      }

      // ─── OPERATION 7: Database Schema Extraction ─────────────────────────────────
      export function extractDatabaseSchema(projectPath: string): SchemaAuditEntry[] {
        const entries: SchemaAuditEntry[] = [];
        const migrationsDir = join(projectPath, 'supabase', 'migrations');

        if (!existsSync(migrationsDir)) {
          entries.push({ tableName: '(none)', issue: 'OK', severity: 'INFO', detail: 'No supabase/migrations directory found' });
          return entries;
        }

        let files: string[];
        try { files = readdirSync(migrationsDir).filter(f => f.endsWith('.sql')).sort(); } catch { return entries; }

        const tablesInMigrations = new Set<string>();
        for (const file of files) {
          let content = '';
          try { content = readFileSync(join(migrationsDir, file), 'utf8'); } catch { continue; }
          const createMatches = content.matchAll(/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(?:"?public"?\s*\.\s*)?"?(\w+)"?/gi);
          for (const m of createMatches) tablesInMigrations.add(m[1]);
        }

        const typesFile = join(projectPath, 'src', 'types', 'database.types.ts');
        const altTypesFile = join(projectPath, 'database.types.ts');
        const typesSrc = existsSync(typesFile) ? typesFile : existsSync(altTypesFile) ? altTypesFile : null;
        const tablesInTypes = new Set<string>();

        if (typesSrc) {
          let content = '';
          try { content = readFileSync(typesSrc, 'utf8'); } catch { }
          const tableMatches = content.matchAll(/(\w+):\s*\{[\s\S]*?Row:/g);
          for (const m of tableMatches) tablesInTypes.add(m[1]);
        }

        for (const table of tablesInMigrations) {
          if (!tablesInTypes.has(table) && typesSrc) {
            entries.push({ tableName: table, issue: 'TABLE_MISSING_IN_TYPES', severity: 'WARN', detail: 'In migrations but not in TypeScript types — regenerate with supabase gen types' });
          } else {
            entries.push({ tableName: table, issue: 'OK', severity: 'INFO', detail: 'Migration defined' });
          }
        }

        return entries;
      }


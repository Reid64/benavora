      // ─── OPERATION 13: Dynamic Route Testing (GET Only) ──────────────────────────
      export async function testDynamicRoutes(
        projectPath: string,
        routes: Array<{ type: string; route: string; methods?: string[] }>,
        skipDynamic: boolean
      ): Promise<DynamicRouteResult[]> {
        if (skipDynamic) return [];

        const PORT = 3099;
        const BASE_URL = `http://localhost:${PORT}`;
        const results: DynamicRouteResult[] = [];

        // Start dev server
        const devServer = spawn('npx', ['next', 'dev', '--port', String(PORT)], {
          cwd: projectPath,
          stdio: 'pipe',
          detached: false,
        });

        // Poll until ready (max 60s)
        const ready = await new Promise<boolean>(resolve => {
          const timeout = setTimeout(() => resolve(false), 60_000);
          const interval = setInterval(async () => {
            try {
              const { default: http } = await import('node:http');
              const req = http.get(`${BASE_URL}/`, res => {
                clearInterval(interval);
                clearTimeout(timeout);
                resolve(true);
              });
              req.on('error', () => { /* not ready yet */ });
            } catch { }
          }, 2000);
        });

        if (!ready) {
          devServer.kill();
          return [{ route: '/', url: BASE_URL, statusCode: null, responseTimeMs: null, classification: 'WARN', error: 'Dev server failed to start in 60s' }];
        }

        // Test GET routes
        const testableRoutes = routes.filter(r =>
          r.type === 'PAGE' || (r.type === 'API' && r.methods?.includes('GET'))
        );

        for (const route of testableRoutes) {
          const url = BASE_URL + route.route;
          const start = Date.now();
          try {
            const { default: http } = await import('node:http');
            const statusCode = await new Promise<number>((resolve, reject) => {
              const req = http.get(url, res => resolve(res.statusCode ?? 0));
              req.on('error', reject);
              req.setTimeout(10_000, () => { req.destroy(); reject(new Error('timeout')); });
            });
            const responseTimeMs = Date.now() - start;
            const classification =
              statusCode >= 500 ? 'CRITICAL' :
              statusCode === 404 ? 'WARN' :
              (statusCode === 401 || statusCode === 403) ? 'INFO' : 'OK';
            results.push({ route: route.route, url, statusCode, responseTimeMs, classification });
          } catch (e: unknown) {
            results.push({ route: route.route, url, statusCode: null, responseTimeMs: Date.now() - start, classification: 'WARN', error: String(e) });
          }
        }

        devServer.kill();
        return results;
      }


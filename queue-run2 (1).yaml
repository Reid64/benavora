        try {
          const info = execSync('vercel ls --json 2>/dev/null | head -1', { cwd: projectPath, stdio: 'pipe', shell: true }).toString();
          const data = JSON.parse(info);
          const deployments = Array.isArray(data) ? data : [data];
          if (!deployments.length) return { url: null, lastDeployedAt: null, daysSinceDeploy: null, status: 'UNKNOWN' };
          const latest = deployments[0];
          const createdAt = latest.created ? new Date(latest.created).toISOString() : null;
          const daysSinceDeploy = createdAt ? Math.floor((Date.now() - new Date(createdAt).getTime()) / (1000 * 60 * 60 * 24)) : null;
          const status = daysSinceDeploy !== null && daysSinceDeploy > 14 ? 'WARN' : 'OK';
          return { url: latest.url ?? null, lastDeployedAt: createdAt, daysSinceDeploy, status };
        } catch {
          return { url: null, lastDeployedAt: null, daysSinceDeploy: null, status: 'UNKNOWN' };
        }
      }

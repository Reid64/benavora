        if (!hasVitest && !hasJest) return { testFilesFound, passed: null, failed: null };

        try {
          const runner = hasVitest ? 'npx vitest run --reporter=json' : 'npx jest --json';
          const raw = execSync(runner, { cwd: projectPath, stdio: 'pipe', timeout: 120_000 }).toString();
          const data = JSON.parse(raw);
          const passed = data.numPassedTests ?? data.passed ?? 0;

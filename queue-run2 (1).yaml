      export function checkTypeScriptCompilation(projectPath: string): CompilationError[] {
        const errors: CompilationError[] = [];
        let output = '';
        try {
          execSync('npx tsc --noEmit --pretty false 2>&1', { cwd: projectPath, stdio: 'pipe' });

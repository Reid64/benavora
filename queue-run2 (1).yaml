        console.log(`  Uncommitted changes:  ${report.gitAudit.uncommittedChanges}`);
        console.log('');
      }

      export function renderFinding(f: DiagnoseFinding): void {
        const cat = `${C.cyan}[${f.category}]${C.reset}`;
        const file = f.file ? ` ${C.gray}(${f.file})${C.reset}` : '';
        console.log(`  ${colorSeverity(f.severity)} ${cat} ${f.message}${file}`);
      }

      export function renderHealthReport(report: ArchitectureHealthReport): void {
        console.log(`\n${C.bold}── ARCHITECTURE HEALTH REPORT ──${C.reset}`);
        if (report.critical.length > 0) {
          console.log(`\n  ${C.red}CRITICAL (${report.critical.length})${C.reset}`);
          report.critical.forEach(renderFinding);
        }
        if (report.warn.length > 0) {
          console.log(`\n  ${C.yellow}WARN (${report.warn.length})${C.reset}`);
          report.warn.forEach(renderFinding);
        }
        if (report.info.length > 0) {
          console.log(`\n  ${C.gray}INFO (${report.info.length})${C.reset}`);
          report.info.forEach(renderFinding);
        }
        if (report.adversaryFindings.length > 0) {
          console.log(`\n  ${C.cyan}ADVERSARY ADDITIONS (${report.adversaryFindings.length})${C.reset}`);
          report.adversaryFindings.forEach(renderFinding);

      ```typescript
      // FORGE 2.0 — RETROFIT RECONCILE: Hybrid Decision Engine (Model C)
      import { createInterface } from 'node:readline';
      import { existsSync } from 'node:fs';
      import { join } from 'node:path';
      import type { ReconcileDecision, DiagnoseFinding } from './types.js';
      import type { GovernanceReconciliationReport, EnterprisePatternsGapReport } from './diagnose-reports.js';

      export interface ReconcileInput {
        criticalFindings: DiagnoseFinding[];
        warnFindings: DiagnoseFinding[];
        governanceReport: GovernanceReconciliationReport;
        enterpriseReport: EnterprisePatternsGapReport;
        dbPath?: string;
      }

      export interface ReconcileOutput {
        decisions: ReconcileDecision[];
        approved: DiagnoseFinding[];
        deferred: string[];
        abandoned: string[];
        confirmedAt: string;
      }

      async function prompt(rl: ReturnType<typeof createInterface>, question: string): Promise<string> {
        return new Promise(resolve => rl.question(question, resolve));
      }

      async function loadPriorDecisions(projectName: string, dbPath?: string): Promise<ReconcileDecision[]> {
        const path = dbPath ?? join(process.env['HOME'] ?? process.env['USERPROFILE'] ?? '', '.forge', 'forge_memory.db');
        if (!existsSync(path)) return [];
        try {
          const { execSync } = await import('node:child_process');
          const raw = execSync(
            `sqlite3 "${path}" "SELECT item_id, item_type, decision, reason FROM reconcile_decisions WHERE project_name = '${projectName}' ORDER BY timestamp DESC"`,
            { stdio: 'pipe' }
          ).toString().trim();
          if (!raw) return [];
          return raw.split('\n').map(line => {
            const [itemId, itemType, decision, reason] = line.split('|');
            return { itemId, itemType, decision, reason, timestamp: '' } as ReconcileDecision;
          });
        } catch { return []; }
      }

      async function persistDecision(decision: ReconcileDecision, projectName: string, dbPath?: string): Promise<void> {
        const path = dbPath ?? join(process.env['HOME'] ?? process.env['USERPROFILE'] ?? '', '.forge', 'forge_memory.db');
        if (!existsSync(path)) return;
        try {
          const { execSync } = await import('node:child_process');
          const safe = (s: string) => s.replace(/'/g, "''");
          execSync(
            `sqlite3 "${path}" "INSERT OR REPLACE INTO reconcile_decisions (id, project_name, item_id, item_type, decision, reason, timestamp) VALUES (hex(randomblob(16)), '${safe(projectName)}', '${safe(decision.itemId)}', '${safe(decision.itemType)}', '${safe(decision.decision)}', '${safe(decision.reason ?? '')}', '${safe(decision.timestamp)}')"`,
            { stdio: 'pipe' }
          );
        } catch { }
      }

      export async function runReconcile(
        projectName: string,
        input: ReconcileInput,
        nonInteractive = false
      ): Promise<ReconcileOutput> {
        const decisions: ReconcileDecision[] = [];
        const approved: DiagnoseFinding[] = [];
        const deferred: string[] = [];
        const abandoned: string[] = [];

        const priorDecisions = await loadPriorDecisions(projectName, input.dbPath);

        if (nonInteractive) {
          // Auto-approve all CRITICAL, auto-build all unbuilt, auto-approve all warns
          for (const f of input.criticalFindings) {
            const d: ReconcileDecision = { itemId: f.message, itemType: 'CRITICAL_FIX', decision: 'APPROVE', timestamp: new Date().toISOString() };
            decisions.push(d);
            approved.push(f);
          }
          for (const u of input.governanceReport.unbuilt) {
            const d: ReconcileDecision = { itemId: u.feature, itemType: 'UNBUILT_FEATURE', decision: u.recommendation === 'ABANDON' ? 'ABANDON' : 'BUILD', timestamp: new Date().toISOString() };
            decisions.push(d);
            if (d.decision === 'ABANDON') abandoned.push(u.feature);
            else deferred.push(u.feature);
          }
          return { decisions, approved, deferred, abandoned, confirmedAt: new Date().toISOString() };
        }

        const rl = createInterface({ input: process.stdin, output: process.stdout });

        console.log('\n════════════════════════════════════════════════════════════');
        console.log('  FORGE 2.0 — RETROFIT RECONCILE');
        console.log('════════════════════════════════════════════════════════════\n');

        // STEP 6.1: Show prior decisions if any
        if (priorDecisions.length > 0) {
          console.log(`Found ${priorDecisions.length} prior decisions for project '${projectName}'.`);
          console.log('Prior decisions will be shown as defaults.\n');
        }

        // STEP 6.2: CRITICAL fixes — auto-approved, can skip
        if (input.criticalFindings.length > 0) {
          console.log(`\n── CRITICAL FIXES (${input.criticalFindings.length} items) ──`);
          console.log('Auto-approved. Press ENTER to approve each. Type SKIP + reason to override.\n');
          for (const f of input.criticalFindings) {
            const prior = priorDecisions.find(p => p.itemId === f.message);
            const hint = prior ? ` [Prior: ${prior.decision}]` : '';
            const answer = await prompt(rl, `  [CRITICAL] ${f.category}: ${f.message}${hint}\n  > `);
            if (answer.toUpperCase().startsWith('SKIP')) {
              const reason = answer.substring(4).trim();
              decisions.push({ itemId: f.message, itemType: 'CRITICAL_FIX', decision: 'SKIP', reason, timestamp: new Date().toISOString() });
            } else {
              decisions.push({ itemId: f.message, itemType: 'CRITICAL_FIX', decision: 'APPROVE', timestamp: new Date().toISOString() });
              approved.push(f);
            }
          }
        }

        // STEP 6.3: UNBUILT feature triage
        if (input.governanceReport.unbuilt.length > 0) {
          console.log(`\n── UNBUILT FEATURES (${input.governanceReport.unbuilt.length} items) ──`);
          console.log('[B]uild / [D]efer / [A]bandon for each:\n');
          for (const u of input.governanceReport.unbuilt) {
            const prior = priorDecisions.find(p => p.itemId === u.feature);
            const hint = prior ? ` [Prior: ${prior.decision}]` : '';
            const answer = (await prompt(rl, `  ${u.feature}${hint} (B/D/A): `)).toUpperCase().trim();
            let decision: ReconcileDecision['decision'] = 'DEFER';
            if (answer === 'B') decision = 'BUILD';
            else if (answer === 'A') decision = 'ABANDON';
            else decision = 'DEFER';
            const d: ReconcileDecision = { itemId: u.feature, itemType: 'UNBUILT_FEATURE', decision, timestamp: new Date().toISOString() };
            decisions.push(d);
            await persistDecision(d, projectName, input.dbPath);
            if (decision === 'ABANDON') abandoned.push(u.feature);
            else if (decision === 'DEFER') deferred.push(u.feature);
          }
        }

        // STEP 6.4: WARN fixes
        if (input.warnFindings.length > 0) {
          console.log(`\n── WARN FIXES (${input.warnFindings.length} items) ──`);
          const answer = (await prompt(rl, '[A]pprove all / [S]elect individually / [I]gnore all: ')).toUpperCase().trim();
          if (answer === 'A') {
            for (const f of input.warnFindings) {
              decisions.push({ itemId: f.message, itemType: 'WARN_FIX', decision: 'APPROVE', timestamp: new Date().toISOString() });
              approved.push(f);
            }
          } else if (answer === 'S') {
            for (const f of input.warnFindings) {
              const ans = (await prompt(rl, `  [WARN] ${f.category}: ${f.message} (Y/n): `)).toUpperCase().trim();
              if (ans !== 'N') { decisions.push({ itemId: f.message, itemType: 'WARN_FIX', decision: 'APPROVE', timestamp: new Date().toISOString() }); approved.push(f); }
              else decisions.push({ itemId: f.message, itemType: 'WARN_FIX', decision: 'IGNORE', timestamp: new Date().toISOString() });
            }
          } else {
            for (const f of input.warnFindings) decisions.push({ itemId: f.message, itemType: 'WARN_FIX', decision: 'IGNORE', timestamp: new Date().toISOString() });
          }
        }

        // STEP 6.5: Enterprise patterns
        const gaps = input.enterpriseReport.gaps.filter(g => !g.present);
        if (gaps.length > 0) {
          console.log(`\n── ENTERPRISE PATTERNS (${gaps.length} gaps) ──`);
          for (const g of gaps) {
            const ans = (await prompt(rl, `  Inject '${g.pattern}' pattern? (y/N): `)).toUpperCase().trim();
            decisions.push({ itemId: g.pattern, itemType: 'ENTERPRISE_PATTERN', decision: ans === 'Y' ? 'BUILD' : 'DEFER', timestamp: new Date().toISOString() });
          }
        }

        // STEP 6.6: Summary + confirmation
        console.log('\n── RECONCILE SUMMARY ──');
        console.log(`  CRITICAL approved: ${approved.filter(f => decisions.find(d => d.itemId === f.message && d.decision === 'APPROVE')).length}`);
        console.log(`  Features to BUILD: ${decisions.filter(d => d.decision === 'BUILD').length}`);
        console.log(`  Features DEFERRED: ${deferred.length}`);
        console.log(`  Features ABANDONED: ${abandoned.length}`);
        console.log(`  WARNs approved: ${decisions.filter(d => d.itemType === 'WARN_FIX' && d.decision === 'APPROVE').length}`);

        const confirm = (await prompt(rl, '\nConfirm and proceed to QUEUE generation? (Y/n): ')).toUpperCase().trim();
        rl.close();

        if (confirm === 'N') {
          console.log('Reconcile aborted. No queue will be generated.');
          process.exit(0);
        }

        // Persist all decisions
        for (const d of decisions) {
          await persistDecision(d, projectName, input.dbPath);
        }

        return { decisions, approved, deferred, abandoned, confirmedAt: new Date().toISOString() };
      }

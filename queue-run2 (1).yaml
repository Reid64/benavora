      ```typescript
      // FORGE 2.0 — RETROFIT Full Pipeline Orchestrator
      import { join } from 'node:path';
      import type { ScanScope } from './types.js';
      import { runScan } from './scan.js';
      import { generateArchitectureHealthReport } from './diagnose-health.js';
      import { buildGovernanceReconciliationReport, buildEnterprisePatternsGapReport } from './diagnose-reports.js';
      import { runReconcile } from './reconcile.js';
      import { generateRetrofitQueue } from './queue-generator.js';
      import {
        renderBanner, renderPreFlightResults, renderScanProgress, renderScanSummary,
        renderHealthReport, renderGovernanceReport, renderEnterprisePatternsReport, renderQueueSummary,
      } from './renderer.js';

      export interface RetrofitPipelineOptions {
        projectPath: string;
        scope?: ScanScope;
        skipDynamic?: boolean;
        resume?: boolean;
        nonInteractive?: boolean;
        queueOutputPath?: string;
        apiKey?: string;
      }

      export async function runRetrofitPipeline(options: RetrofitPipelineOptions): Promise<void> {
        const {
          projectPath,
          scope = 'C',
          skipDynamic = false,
          resume = false,
          nonInteractive = false,
          queueOutputPath,
          apiKey,
        } = options;

        const projectName = projectPath.split(/[/\\]/).pop() ?? 'unknown';
        renderBanner(projectName, scope);

        // ── STAGE 1: SCAN ──────────────────────────────────────────────────────────
        console.log('Running SCAN (14 operations)...\n');
        const { report: scanReport, preFlightHalted } = await runScan({
          projectPath,
          scope,
          skipDynamic,
          resume,
          onProgress: (step, i, total) => {
            renderScanProgress(step, i, total);
          },
        });

        if (preFlightHalted) {
          console.error('\nPre-flight checks FAILED. RETROFIT aborted.');
          process.exit(1);
        }

        renderScanSummary(scanReport);

        // ── STAGE 2: DIAGNOSE ─────────────────────────────────────────────────────
        console.log('Running DIAGNOSE...\n');

        const healthReport = await generateArchitectureHealthReport(scanReport, apiKey);
        renderHealthReport(healthReport);

        const governanceReport = buildGovernanceReconciliationReport(scanReport, projectPath);
        renderGovernanceReport(governanceReport);

        const enterpriseReport = buildEnterprisePatternsGapReport(scanReport, projectPath);
        renderEnterprisePatternsReport(enterpriseReport);

        // ── STAGE 3: RECONCILE ────────────────────────────────────────────────────
        console.log('Running RECONCILE...\n');

        const reconcileOutput = await runReconcile(projectName, {
          criticalFindings: healthReport.critical,
          warnFindings: healthReport.warn,
          governanceReport,
          enterpriseReport,
        }, nonInteractive);

        // ── STAGE 4: QUEUE GENERATION ─────────────────────────────────────────────
        const forgeProjectsDir = queueOutputPath ?? join(
          process.env['USERPROFILE'] ?? process.env['HOME'] ?? '',
          'Documents', 'FORGE', 'projects', projectName
        );

        const queue = generateRetrofitQueue(scanReport, reconcileOutput, forgeProjectsDir);
        renderQueueSummary(queue);

        console.log(`To run the generated queue:\n`);
        console.log(`  cd C:\\Users\\manag\\Documents\\FORGE`);
        console.log(`  $env:NODE_OPTIONS="--max-old-space-size=8192"`);
        console.log(`  $env:ANTHROPIC_API_KEY=$null`);
        console.log(`  $env:DANGEROUSLY_SKIP_PERMISSIONS=1`);
        console.log(`  powershell -ExecutionPolicy Bypass -File .\\forge.ps1 -project ${projectName} -startFrom 0`);
      }

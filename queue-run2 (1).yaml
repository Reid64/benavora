      export function analyzeGitHistory(projectPath: string): {
        lastCommitHash: string | null;
        lastCommitDate: string | null;
        daysSinceCommit: number | null;
        uncommittedChanges: number;
        branches: string[];
      } {
        let lastCommitHash: string | null = null;
        let lastCommitDate: string | null = null;
        let daysSinceCommit: number | null = null;
        let uncommittedChanges = 0;
        let branches: string[] = [];

        try {
          const logLine = execSync('git log -1 --format="%H|%ai|%s"', { cwd: projectPath, stdio: 'pipe' }).toString().trim();
          const parts = logLine.split('|');
          lastCommitHash = parts[0] || null;
          lastCommitDate = parts[1] || null;
          if (lastCommitDate) {
            const diffMs = Date.now() - new Date(lastCommitDate).getTime();
            daysSinceCommit = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          }
        } catch { }

        try {
          const status = execSync('git status --porcelain', { cwd: projectPath, stdio: 'pipe' }).toString().trim();
          uncommittedChanges = status ? status.split('\n').length : 0;
        } catch { }

        try {
          const branchLines = execSync('git branch -a --format="%(refname:short)"', { cwd: projectPath, stdio: 'pipe' }).toString().trim();
          branches = branchLines.split('\n').filter(Boolean);
        } catch { }

        return { lastCommitHash, lastCommitDate, daysSinceCommit, uncommittedChanges, branches };
      }

      ```typescript
      // FORGE 2.0 — RETROFIT Pre-Flight Checks
      import { existsSync, readdirSync } from 'node:fs';
      import { join } from 'node:path';
      import { execSync } from 'node:child_process';
      import type { PreFlightResult } from './types.js';

      export async function runPreFlightChecks(
        projectPath: string,
        scope: 'A' | 'B' | 'C'
      ): Promise<{ results: PreFlightResult[]; halted: boolean; supabaseAvailable: boolean; vercelAvailable: boolean; packageManager: string; envVars: Record<string, string> }> {
        const results: PreFlightResult[] = [];
        let halted = false;
        let supabaseAvailable = false;
        let vercelAvailable = false;
        let packageManager = 'npm';
        const envVars: Record<string, string> = {};

        // CHECK 1: Project path exists
        if (existsSync(projectPath)) {
          results.push({ check: 'Project path exists', status: 'PASS', message: projectPath });
        } else {
          results.push({ check: 'Project path exists', status: 'FAIL', message: `Not found: ${projectPath}` });
          halted = true;
          return { results, halted, supabaseAvailable, vercelAvailable, packageManager, envVars };
        }

        // CHECK 2: Git repository
        const gitDir = join(projectPath, '.git');
        if (existsSync(gitDir)) {
          results.push({ check: 'Git repository', status: 'PASS', message: '.git directory found' });
        } else {
          try {
            execSync('git init', { cwd: projectPath, stdio: 'pipe' });
            execSync('git add -A && git commit -m "FORGE RETROFIT: initial snapshot" --allow-empty', { cwd: projectPath, stdio: 'pipe', shell: true });
            results.push({ check: 'Git repository', status: 'PASS', message: 'Initialized and committed', autoFixed: true });
          } catch {
            results.push({ check: 'Git repository', status: 'FAIL', message: 'Git init failed' });
            halted = true;
            return { results, halted, supabaseAvailable, vercelAvailable, packageManager, envVars };
          }
        }

        // CHECK 3: Node.js available
        try {
          const nodeVersion = execSync('node --version', { stdio: 'pipe' }).toString().trim();
          results.push({ check: 'Node.js available', status: 'PASS', message: nodeVersion });
        } catch {
          results.push({ check: 'Node.js available', status: 'WARN', message: 'node not in PATH — add C:\\Program Files\\nodejs to PATH manually' });
        }

        // CHECK 4: Package manager
        const files = readdirSync(projectPath);
        if (files.includes('pnpm-lock.yaml')) {
          packageManager = 'pnpm';
        } else if (files.includes('yarn.lock')) {
          packageManager = 'yarn';
        } else {
          packageManager = 'npm';
        }
        results.push({ check: 'Package manager', status: 'PASS', message: packageManager });

        // CHECK 5: Environment file
        const envPath = join(projectPath, '.env.local');
        if (existsSync(envPath)) {
          const { readFileSync } = await import('node:fs');
          const lines = readFileSync(envPath, 'utf8').split('\n');
          for (const line of lines) {
            const m = line.match(/^([^#=\s][^=]*)=(.*)$/);
            if (m) envVars[m[1].trim()] = m[2].trim();
          }
          results.push({ check: 'Environment file', status: 'PASS', message: `${Object.keys(envVars).length} vars found` });
        } else {
          results.push({ check: 'Environment file', status: 'WARN', message: '.env.local not found — env audit will be limited' });
        }

        // CHECK 6: Supabase credentials (Scope B/C)
        if (scope === 'B' || scope === 'C') {
          const hasUrl = 'NEXT_PUBLIC_SUPABASE_URL' in envVars || 'SUPABASE_URL' in envVars;
          const hasKey = 'SUPABASE_SERVICE_ROLE_KEY' in envVars;
          if (hasUrl && hasKey) {
            supabaseAvailable = true;
            results.push({ check: 'Supabase credentials', status: 'PASS', message: 'URL and SERVICE_ROLE_KEY found' });
          } else {
            results.push({ check: 'Supabase credentials', status: 'WARN', message: 'Missing SUPABASE URL or SERVICE_ROLE_KEY — schema audit will use migration files only' });
          }
        } else {
          results.push({ check: 'Supabase credentials', status: 'INFO' as any, message: 'Scope A — skipped' });
        }

        // CHECK 7: Vercel CLI (Scope C)
        if (scope === 'C') {
          try {
            execSync('vercel whoami', { stdio: 'pipe' });
            vercelAvailable = true;
            results.push({ check: 'Vercel CLI', status: 'PASS', message: 'vercel authenticated' });
          } catch {
            results.push({ check: 'Vercel CLI', status: 'WARN', message: 'Vercel CLI not available — deploy audit skipped' });
          }
        } else {
          results.push({ check: 'Vercel CLI', status: 'INFO' as any, message: 'Scope A/B — skipped' });
        }

        // CHECK 8: Learning database
        const { homedir } = await import('node:os');
        const dbPath = join(homedir(), '.forge', 'forge_memory.db');
        if (existsSync(dbPath)) {
          results.push({ check: 'Learning database', status: 'PASS', message: dbPath });
        } else {
          results.push({ check: 'Learning database', status: 'WARN', message: 'forge_memory.db not found — reconcile history unavailable' });
        }

        return { results, halted, supabaseAvailable, vercelAvailable, packageManager, envVars };
      }

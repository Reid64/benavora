      // FORGE 2.0 — RETROFIT QUEUE Generator
      import { writeFileSync, mkdirSync } from 'node:fs';
      import { join } from 'node:path';
      import type { ScanReport, ReconcileDecision, DiagnoseFinding } from './types.js';
      import type { ReconcileOutput } from './reconcile.js';

      export interface QueuePrompt {
        id: string;
        tier: 'CRITICAL' | 'WARN_FEATURE' | 'ENTERPRISE';
        name: string;
        dependsOn: string[];
        acceptanceCriteria: string;
        filesHint: string[];
        governanceUpdates: string[];
        prompt: string;
      }

      export interface GeneratedQueue {
        buildId: string;
        projectName: string;
        totalPrompts: number;
        tiers: { critical_fixes: number; warn_fixes_and_features: number; enterprise_patterns: number };
        prompts: QueuePrompt[];
        generatedAt: string;
      }

      function sanitizeId(text: string, prefix: string, index: number): string {
        return `${prefix}-${String(index + 1).padStart(3, '0')}`;
      }

      function buildCriticalFixPrompt(finding: DiagnoseFinding, index: number, projectPath: string): QueuePrompt {
        const id = sanitizeId(finding.message, 'RC', index);
        const fileHint = finding.file ? [finding.file] : [];

        let prompt = `You are fixing a CRITICAL issue in the codebase at ${projectPath}.\n\n`;
        prompt += `ISSUE (${finding.category}): ${finding.message}\n`;
        if (finding.file) prompt += `FILE: ${finding.file}\n`;
        prompt += `\nThis is a blocking issue. Fix it completely before doing anything else.\n`;
        prompt += `\nAfter fixing:\n`;
        prompt += `1. Run: pnpm tsc --noEmit — must pass 0 errors\n`;
        prompt += `2. If this was a broken import: verify the import resolves correctly\n`;
        prompt += `3. If this was a schema issue: run the migration or regenerate types\n`;
        prompt += `4. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md\n`;

        return {
          id,
          tier: 'CRITICAL',
          name: `Fix CRITICAL: ${finding.category} — ${finding.message.substring(0, 60)}`,
          dependsOn: index > 0 ? [sanitizeId('', 'RC', index - 1)] : [],
          acceptanceCriteria: `pnpm tsc --noEmit passes 0 errors; ${finding.category} issue resolved`,
          filesHint: fileHint,
          governanceUpdates: ['STATE_OF_THE_BUILD.md', 'SESSION_STATE.md'],
          prompt,
        };
      }

      function buildWarnFeaturePrompt(finding: DiagnoseFinding, index: number, projectPath: string, criticalCount: number): QueuePrompt {
        const id = sanitizeId(finding.message, 'RW', index);
        const fileHint = finding.file ? [finding.file] : [];
        const priorId = index > 0 ? [sanitizeId('', 'RW', index - 1)] : criticalCount > 0 ? [sanitizeId('', 'RC', criticalCount - 1)] : [];

        let prompt = `You are addressing a WARN-level issue in the codebase at ${projectPath}.\n\n`;
        prompt += `ISSUE (${finding.category}): ${finding.message}\n`;
        if (finding.file) prompt += `FILE: ${finding.file}\n`;
        prompt += `\nThis is suboptimal but does not block compilation. Fix it cleanly.\n`;
        prompt += `\nAfter fixing:\n`;
        prompt += `1. Run: pnpm tsc --noEmit — must still pass\n`;
        prompt += `2. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md\n`;

        return {
          id,
          tier: 'WARN_FEATURE',
          name: `Fix WARN: ${finding.category} — ${finding.message.substring(0, 60)}`,
          dependsOn: priorId,
          acceptanceCriteria: `${finding.category} issue resolved; pnpm tsc --noEmit passes`,
          filesHint: fileHint,
          governanceUpdates: ['STATE_OF_THE_BUILD.md', 'SESSION_STATE.md'],
          prompt,
        };
      }

      function buildEnterprisePatternPrompt(patternName: string, index: number, projectPath: string, priorId?: string): QueuePrompt {
        const id = sanitizeId(patternName, 'RE', index);

        let prompt = `You are injecting the '${patternName}' enterprise pattern into the codebase at ${projectPath}.\n\n`;
        prompt += `This pattern was identified as missing during FORGE RETROFIT analysis.\n`;
        prompt += `Implement it correctly for the existing tech stack (Next.js, TypeScript, Supabase).\n`;
        prompt += `\nAfter implementing:\n`;
        prompt += `1. Run: pnpm tsc --noEmit — must pass\n`;
        prompt += `2. Run: pnpm build — must succeed\n`;
        prompt += `3. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md\n`;

        return {
          id,
          tier: 'ENTERPRISE',
          name: `Inject Pattern: ${patternName}`,
          dependsOn: priorId ? [priorId] : [],
          acceptanceCriteria: `'${patternName}' pattern implemented; tsc passes; build passes`,
          filesHint: [],
          governanceUpdates: ['STATE_OF_THE_BUILD.md', 'SESSION_STATE.md', 'AGENTS.md'],
          prompt,
        };
      }

      export function generateRetrofitQueue(
        scan: ScanReport,
        reconcile: ReconcileOutput,
        outputPath: string
      ): GeneratedQueue {
        const prompts: QueuePrompt[] = [];

        // Tier 1: CRITICAL fixes (approved only)
        const approvedCriticals = reconcile.decisions
          .filter(d => d.itemType === 'CRITICAL_FIX' && d.decision === 'APPROVE')
          .map(d => reconcile.approved.find(f => f.message === d.itemId))
          .filter((f): f is DiagnoseFinding => f !== undefined);

        approvedCriticals.forEach((f, i) => {
          prompts.push(buildCriticalFixPrompt(f, i, scan.projectPath));
        });

        // Tier 2: WARN fixes (approved)
        const approvedWarns = reconcile.decisions
          .filter(d => d.itemType === 'WARN_FIX' && d.decision === 'APPROVE')
          .map(d => reconcile.approved.find(f => f.message === d.itemId))
          .filter((f): f is DiagnoseFinding => f !== undefined);

        approvedWarns.forEach((f, i) => {
          prompts.push(buildWarnFeaturePrompt(f, i, scan.projectPath, approvedCriticals.length));
        });

        // Tier 3: Enterprise patterns to build
        const patternsToBuild = reconcile.decisions
          .filter(d => d.itemType === 'ENTERPRISE_PATTERN' && d.decision === 'BUILD')
          .map(d => d.itemId);

        const lastWarnId = approvedWarns.length > 0 ? sanitizeId('', 'RW', approvedWarns.length - 1) :
          approvedCriticals.length > 0 ? sanitizeId('', 'RC', approvedCriticals.length - 1) : undefined;

        patternsToBuild.forEach((pattern, i) => {
          const priorId = i > 0 ? sanitizeId('', 'RE', i - 1) : lastWarnId;
          prompts.push(buildEnterprisePatternPrompt(pattern, i, scan.projectPath, priorId));
        });

        const queue: GeneratedQueue = {
          buildId: `forge-retrofit-${scan.projectName}-${Date.now()}`,
          projectName: scan.projectName,
          totalPrompts: prompts.length,
          tiers: {
            critical_fixes: approvedCriticals.length,
            warn_fixes_and_features: approvedWarns.length,
            enterprise_patterns: patternsToBuild.length,
          },
          prompts,
          generatedAt: new Date().toISOString(),
        };

        // Write YAML
        mkdirSync(outputPath, { recursive: true });
        const yamlPath = join(outputPath, 'queue.yaml');
        const yaml = buildYaml(queue, scan.projectName);
        writeFileSync(yamlPath, yaml, 'utf8');
        console.log(`\nQueue written to: ${yamlPath}`);
        console.log(`Total prompts: ${queue.totalPrompts}`);

        return queue;
      }

      function buildYaml(queue: GeneratedQueue, projectName: string): string {
        const lines: string[] = [
          `project: ${projectName}`,
          '',
          'governance:',
          '  - BLUEPRINT.md',
          '  - STATE_OF_THE_BUILD.md',
          '  - SESSION_STATE.md',
          '  - SCHEMA_REGISTRY.md',
          '  - BEHAVIORAL_CONTRACTS.md',
          '  - AGENTS.md',
          '',
          'settings:',
          '  build_model: claude-sonnet-4-6',
          '  max_retries: 3',
          '',
          'prompts:',
        ];

        for (const p of queue.prompts) {
          lines.push(`  - id: ${p.id}`);
          lines.push(`    name: "${p.name.replace(/"/g, '\\"')}"`);
          if (p.dependsOn.length > 0) {
            lines.push(`    depends_on:`);
            for (const dep of p.dependsOn) lines.push(`      - ${dep}`);
          }
          lines.push(`    prompt: |`);
          const promptLines = p.prompt.split('\n');
          for (const pl of promptLines) lines.push(`      ${pl}`);
          lines.push('');
        }

        return lines.join('\n');
      }
      ```


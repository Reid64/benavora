      }

      export function renderPreFlightResults(results: PreFlightResult[]): void {
        console.log(`${C.bold}── PRE-FLIGHT CHECKS ──${C.reset}`);
        for (const r of results) {
          const icon = r.status === 'PASS' ? `${C.green}✓${C.reset}` : r.status === 'WARN' ? `${C.yellow}⚠${C.reset}` : `${C.red}✗${C.reset}`;
          const fixed = r.autoFixed ? ` ${C.cyan}[auto-fixed]${C.reset}` : '';
          console.log(`  ${icon} ${r.check}: ${r.message}${fixed}`);
        }
        console.log('');
      }

      export function renderScanProgress(step: string, index: number, total: number): void {
        const pct = Math.round((index / total) * 100);
        const bar = '█'.repeat(Math.floor(pct / 5)) + '░'.repeat(20 - Math.floor(pct / 5));
        process.stdout.write(`\r  ${C.cyan}[${bar}]${C.reset} ${pct}% — ${step}                    `);
        if (index === total) process.stdout.write('\n');
      }

      export function renderScanSummary(report: ScanReport): void {
        console.log(`\n${C.bold}── SCAN COMPLETE ──${C.reset}`);
        console.log(`  Files scanned:        ${report.fileTree.totalFiles}`);
        console.log(`  Project size:         ${report.fileTree.projectSizeKB.toFixed(1)} KB`);
        console.log(`  Routes found:         ${report.routeInventory.length}`);
        console.log(`  Broken imports:       ${C.red}${report.brokenImports.length}${C.reset}`);
        console.log(`  TypeScript errors:    ${C.red}${report.compilationErrors.length}${C.reset}`);
        console.log(`  Dead files:           ${C.yellow}${report.deadFiles.length}${C.reset}`);

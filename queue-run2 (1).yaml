      CREATE src/retrofit/scan-ops-1-4.ts with EXACTLY this content:

      ```typescript
      // FORGE 2.0 — SCAN Operations 1-4: Directory Tree, Dependency Graph, Broken Imports, Dead Files
      import { readdirSync, statSync, readFileSync, existsSync } from 'node:fs';
      import { join, extname, dirname, resolve, relative } from 'node:path';
      import type { FileTreeResult, DependencyGraph, BrokenImport, ImportEdge } from './types.js';

      const EXCLUDE_DIRS = /node_modules|\.next|\.git|dist|build|\.cache/;

      // ─── OPERATION 1: Directory Tree Enumeration ─────────────────────────────────
      export function scanDirectoryTree(projectPath: string): FileTreeResult {
        const files: { fullPath: string; extension: string; sizeBytes: number; lastModified: Date }[] = [];

        function walk(dir: string): void {
          let entries: string[];
          try { entries = readdirSync(dir); } catch { return; }
          for (const entry of entries) {
            const fullPath = join(dir, entry);
            if (EXCLUDE_DIRS.test(fullPath)) continue;
            let stat;
            try { stat = statSync(fullPath); } catch { continue; }
            if (stat.isDirectory()) {
              walk(fullPath);
            } else {
              files.push({
                fullPath,
                extension: extname(entry) || '(none)',
                sizeBytes: stat.size,
                lastModified: stat.mtime,
              });
            }
          }
        }

        walk(projectPath);

        const byExtension: Record<string, { count: number; totalSizeKB: number }> = {};
        let totalBytes = 0;
        for (const f of files) {
          if (!byExtension[f.extension]) byExtension[f.extension] = { count: 0, totalSizeKB: 0 };
          byExtension[f.extension].count++;
          byExtension[f.extension].totalSizeKB += f.sizeBytes / 1024;
          totalBytes += f.sizeBytes;
        }

        return {
          totalFiles: files.length,
          byExtension,
          files,
          projectSizeKB: totalBytes / 1024,
        };
      }

      // ─── OPERATION 2: Dependency Tree Mapping ────────────────────────────────────
      const IMPORT_REGEX = /(?:import\s+(?:.*?\s+from\s+)?['"]([^'"]+)['"]|require\s*\(\s*['"]([^'"]+)['"]\s*\))/g;
      const NAMED_IMPORT_REGEX = /import\s+\{([^}]+)\}\s+from\s+['"][^'"]+['"]/g;
      const DEFAULT_EXPORT_REGEX = /export\s+default\s+/g;
      const NAMED_EXPORT_REGEX = /export\s+(?:const|function|class|type|interface|enum|let|var)\s+(\w+)/g;

      function getFileExports(filePath: string): string[] {
        let content: string;
        try { content = readFileSync(filePath, 'utf8'); } catch { return []; }
        const exports: string[] = [];
        if (DEFAULT_EXPORT_REGEX.test(content)) exports.push('default');
        NAMED_EXPORT_REGEX.lastIndex = 0;
        let m: RegExpExecArray | null;
        while ((m = NAMED_EXPORT_REGEX.exec(content)) !== null) exports.push(m[1]);
        return exports;
      }

      function resolveImportPath(fromFile: string, importPath: string, projectPath: string): string | null {
        if (!importPath.startsWith('.') && !importPath.startsWith('/')) return null; // external
        const fromDir = dirname(fromFile);
        const resolved = resolve(fromDir, importPath);
        const candidates = [
          resolved,
          resolved + '.ts',
          resolved + '.tsx',
          resolved + '.js',
          resolved + '/index.ts',
          resolved + '/index.tsx',
          resolved + '/index.js',
          resolved.replace(/\.js$/, '.ts'),
          resolved.replace(/\.js$/, '.tsx'),
        ];
        for (const c of candidates) {
          if (existsSync(c)) return c;
        }
        return null;
      }

      export function buildDependencyGraph(projectPath: string): DependencyGraph {
        const graph: DependencyGraph = { nodes: new Map(), edges: [] };

        function walk(dir: string): void {
          let entries: string[];
          try { entries = readdirSync(dir); } catch { return; }
          for (const entry of entries) {
            const fullPath = join(dir, entry);
            if (EXCLUDE_DIRS.test(fullPath)) continue;
            let stat;
            try { stat = statSync(fullPath); } catch { continue; }
            if (stat.isDirectory()) { walk(fullPath); continue; }
            if (!/\.(ts|tsx|js|jsx)$/.test(entry)) continue;

            let content: string;
            try { content = readFileSync(fullPath, 'utf8'); } catch { continue; }

            const exports = getFileExports(fullPath);
            if (!graph.nodes.has(fullPath)) {
              graph.nodes.set(fullPath, { exports, importCount: 0, dependencyCount: 0 });
            }

            IMPORT_REGEX.lastIndex = 0;
            let m: RegExpExecArray | null;
            while ((m = IMPORT_REGEX.exec(content)) !== null) {
              const importPath = m[1] || m[2];
              if (!importPath) continue;
              const resolvedTarget = resolveImportPath(fullPath, importPath, projectPath);
              const importedNames: string[] = [];
              NAMED_IMPORT_REGEX.lastIndex = 0;
              let nm: RegExpExecArray | null;
              while ((nm = NAMED_IMPORT_REGEX.exec(content)) !== null) {
                const names = nm[1].split(',').map(s => s.trim().split(' as ')[0].trim()).filter(Boolean);
                importedNames.push(...names);
              }
              const edge: ImportEdge = { source: fullPath, target: importPath, importedNames, isRelative: importPath.startsWith('.'), resolvedTarget };
              graph.edges.push(edge);
              const node = graph.nodes.get(fullPath);
              if (node) node.dependencyCount++;
              if (resolvedTarget && graph.nodes.has(resolvedTarget)) {
                const targetNode = graph.nodes.get(resolvedTarget)!;
                targetNode.importCount++;
              }
            }
          }
        }

        walk(projectPath);
        return graph;
      }

      // ─── OPERATION 3: Broken Import Detection ────────────────────────────────────
      export function detectBrokenImports(graph: DependencyGraph, projectPath: string): BrokenImport[] {
        const broken: BrokenImport[] = [];
        for (const edge of graph.edges) {
          if (!edge.isRelative) continue; // skip external
          if (edge.resolvedTarget === null) {
            broken.push({
              sourceFile: relative(projectPath, edge.source),
              importPath: edge.target,
              resolvedPath: null,
              severity: 'CRITICAL',
            });
          } else if (edge.importedNames.length > 0) {
            const targetNode = graph.nodes.get(edge.resolvedTarget);
            const exports = targetNode?.exports ?? getFileExports(edge.resolvedTarget);
            for (const name of edge.importedNames) {
              if (name !== 'default' && !exports.includes(name) && !exports.includes('*')) {
                broken.push({
                  sourceFile: relative(projectPath, edge.source),
                  importPath: edge.target,
                  resolvedPath: relative(projectPath, edge.resolvedTarget),
                  missingExport: name,
                  severity: 'CRITICAL',
                });
              }
            }
          }
        }
        return broken;
      }

      // ─── OPERATION 4: Dead File Detection ────────────────────────────────────────
      const ENTRY_POINT_PATTERN = /page\.(tsx|ts|js|jsx)$|route\.(ts|js)$|layout\.(tsx|ts)$|middleware\.(ts|js)$|tailwind\.config|next\.config|tsconfig|jest\.config|vitest\.config|playwright\.config/;

      export function detectDeadFiles(graph: DependencyGraph, projectPath: string): string[] {
        const importedTargets = new Set<string>();
        for (const edge of graph.edges) {
          if (edge.resolvedTarget) importedTargets.add(edge.resolvedTarget);
        }
        const dead: string[] = [];
        for (const [filePath] of graph.nodes) {
          if (importedTargets.has(filePath)) continue;
          if (ENTRY_POINT_PATTERN.test(filePath)) continue;
          dead.push(relative(projectPath, filePath));
        }
        return dead;
      }
      ```


# queue-pil-rel-agents.yaml
# Upgrades BEN-REL-01 through BEN-REL-06 (Relationship family) in place from their current
# working simplified implementations to the fuller PIL spec (C:\temp\PIL_AGENT_COMPLETE_ROSTER.md /
# C:\temp\PIL_AGENT_DEPENDENCIES.yaml). Same file paths, same registry rows, same agent_ids --
# no rebuild, no parallel system. BEN-REL-07/08 (task-added, outside the 47-agent PIL spec) are
# intentionally untouched by this queue. 6 sequential prompts (FORGE 1.0 runs one queue.yaml loop
# sequentially, not in parallel, matching queue-pil-agents-complete.yaml's own convention).
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-rel-01-upgrade
  name: Upgrade BEN-REL-01 Relationship Discovery Agent to the fuller PIL spec
  prompt: "Upgrade the live BEN-REL-01 Relationship Discovery Agent (src/lib/pil/agents/rel/BEN-REL-01.ts, class RelationshipDiscoveryAgent) in place -- same file path, same registry row, same agent_id \\\"BEN-REL-01\\\" -- to match the richer PIL spec below, while preserving every currently-working behavior (its one-hop-outward web-search discovery loop, its node/edge upsert-and-dedup logic, its existing delegations to BEN-REL-02 for board-like hits and BEN-REL-03 for corporate-like hits, and its completedEmpty() early-return pattern).\n\nPATTERN TO FOLLOW (read these real files in full before writing anything, in this order): first C:\\Users\\manag\\Documents\\benavora\\src\\lib\\pil\\agents\\rel\\BEN-REL-01.ts itself -- this is an UPGRADE, not a rebuild; it already exists as a real, working implementation (class RelationshipDiscoveryAgent implements Agent), already registered in src/lib/pil/agents/index.ts's AGENT_FACTORIES map under the same agent_id and same file path, already exercised by real delegation chains from sibling REL agents. Preserve every existing behavior exactly as-is -- do not remove, rename, or weaken any existing delegation, evidence-write, graph read/write, or early-return guard already in the file; this prompt only EXTENDS it with additional richer-spec behavior layered on top of what already works. Second, read src/lib/pil/agents/rel/shared.ts in full (the family's shared plumbing -- getProspectById, getPrimaryProspectNode, recordRelationshipEvidence, callTool, tryModelTokens, MODEL_TOKEN_UNIT_COST_USD, hostnameOf, extractLeadName, reconstructShortestPaths, pathConfidence, getTenantContactProspectIds, getNodesForProspectIds, refetchEdge, frictionEstimateForHops -- reuse these helpers for any new logic, do not duplicate them inline). Third, read src/lib/pil/agent-runner.ts in full (the real Agent/AgentContext/AgentResult/DelegationRequest interfaces -- class X implements Agent with an execute(context, runner) method, never \\\"extends BaseAgent\\\" which does not exist anywhere in this codebase; note AgentRunner.delegate() at line ~330 sets a delegated child's context.prospectId to the PARENT's context.prospectId unchanged -- a delegation from an org-wide/batch-mode run with prospectId===null to an agent that requires a prospectId, such as BEN-REL-01/BEN-REL-05/BEN-REL-06 which all early-return \\\"requires an existing prospectId\\\" when null, is a dead-on-arrival no-op; guard any new delegation to a prospectId-scoped sibling with an explicit \\\"if (context.prospectId)\\\" check and skip it, with a one-line comment explaining why, when context.prospectId is null). Fourth, read src/lib/pil/agents/qlf/BEN-QLF-04.ts in full as the canonical reference implementation depth/shape (~290 lines: real Supabase reads/writes via getPilClient() against pil_* tables, real getEvidence()/logAction()/createReviewItem() usage from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment, and a delegations array in the returned AgentResult used to chain into follow-on agents by their real agent_id string -- delegation targets are referenced purely as childAgentCode strings, e.g. \\\"BEN-KNW-02\\\", not as TypeScript imports of another agent's class; AgentRunner resolves the string to an implementation via src/lib/pil/agents/index.ts's AGENT_FACTORIES map at delegation time, so no new import statements are needed in this file to delegate to BEN-KNW-02/BEN-KNW-03/BEN-INT-0N/other BEN-REL-0N agents -- they are already registered there). This prompt's scope is limited strictly to the one file named above plus the shared test file named later in this prompt -- do not modify any other file.\n\nSPEC SOURCE OF TRUTH: this upgrade's fuller behavioral detail comes from C:\\temp\\PIL_AGENT_COMPLETE_ROSTER.md's \\\"Relationship (6 agents)\\\" section and C:\\temp\\PIL_AGENT_DEPENDENCIES.yaml's BEN-REL-0N entries (both Phase-1 paper specifications with zero implementation evidence per their own methodology notes -- treat them as design input only, not as claims about what already runs in production). Per those documents, delegation ($7 Delegation / depends_on) is described as an AUTHORITY/CAPABILITY relationship (\\\"may call when its canonical reasoning boundary is required\\\"), not a strict data-flow pipeline dependency -- so every new delegation this prompt adds must be triggered by a concrete, documented condition in the code (a real signal that the target agent's specialized reasoning is actually needed), never an unconditional call on every run.\n\nFULLER SPEC DETAIL FOR BEN-REL-01 (Relationship Discovery Agent): Purpose per roster -- \\\"Discover evidence-backed person-to-person and person-to-organization relationship hypotheses that can be independently verified and temporally scoped.\\\" Output dimensions (BEN_REL_01Decision.v1's 6 named fields per the roster, mapped onto this schema's real conclusions object since no dedicated pil_rel_01_decisions table exists anywhere in supabase/migrations/ -- follow the same \\\"table doesn't exist, use evidence + conclusions\\\" resolution BEN-REL-05.ts's own header comment already documents for this exact situation): Relationship Type, Source And Direction, Time Interval, Directness, Strength Evidence, Alternative Explanations. Dependencies per PIL_AGENT_DEPENDENCIES.yaml's depends_on list: BEN-KNW-02, BEN-KNW-03, BEN-REL-02, BEN-REL-03, BEN-REL-04 -- the last two are already wired (REL-02 on boardLikeHits>0, REL-03 on corporateLikeHits>0); this prompt adds the missing three (BEN-KNW-02, BEN-KNW-03, BEN-REL-04).\n\nCONCRETE CODE TO ADD, inside execute() after the existing for-loop over existingNeighbors (the loop that already builds evidenceCreated/newEdgeIds/newNodeIds/boardLikeHits/corporateLikeHits) and before the existing two delegations.push() calls for REL-02/REL-03:\n\n1. Identity-ambiguity delegation to BEN-KNW-02: inside the loop, alongside the existing candidateNode/edge/evidence creation, track a Map<string, { nodeIds: string[]; viaOrganizations: string[] }> keyed by candidateName.toLowerCase(), pushing this iteration's candidateNode.id and neighbor.label into the bucket for that key. After the loop, for every bucket with nodeIds.length >= 2 (the same candidate name was independently surfaced via two or more different one-hop neighbors this run -- a real ambiguity signal, not a guess), push one delegations entry: { childAgentCode: \\\"BEN-KNW-02\\\", objective: a string naming the candidate, how many distinct relationship paths surfaced it, and that REL-02/REL-03 should not treat these as confirmed-same-person until resolved, maxAutonomy: \\\"A2\\\", constraints: { candidateNodeIds: bucket.nodeIds, candidateName } }.\n\n2. Provenance-verification delegation to BEN-KNW-03: after the loop, if newEdgeIds.length > 0 (every edge this agent creates starts at the existing hardcoded confidence 0.3 / relationship_strength \\\"speculative\\\" -- do not change that existing behavior), push one delegations entry: { childAgentCode: \\\"BEN-KNW-03\\\", objective: a string stating N newly discovered low-confidence edges for prospect ${prospect.id} need provenance/freshness verification before BEN-REL-02/BEN-REL-03 build on them, maxAutonomy: \\\"A2\\\", constraints: { prospectId: prospect.id, edgeIds: newEdgeIds } }.\n\n3. Organizational-overlap delegation to BEN-REL-04: track a Set<string> of organizationNodeIdsTouched, adding neighbor.id inside the loop whenever neighbor.node_type is one of the existing BOARD_LIKE_TYPES or CORPORATE_LIKE_TYPES arrays already defined at the top of the file (reuse them, do not redefine). After the loop, if organizationNodeIdsTouched.size > 0, push one delegations entry: { childAgentCode: \\\"BEN-REL-04\\\", objective: a string stating this prospect just connected to N institution(s) and asking BEN-REL-04 to check whether any tenant contact or other prospect also overlaps at the same institutions, maxAutonomy: \\\"A2\\\", constraints: { prospectId: prospect.id, organizationNodeIds: [...organizationNodeIdsTouched] } }. This agent already has a valid context.prospectId at this point (guarded by the existing top-of-method early return), so no additional prospectId guard is needed for this specific delegation.\n\nDECISION OBJECT: extend the existing conclusions return value with a new \\\"decision\\\" field (a plain object, not a new type/table) whose 6 keys are the roster's named dimensions, populated from data this method already computes -- do not invent new signals: relationshipType (array of the distinct relationshipType strings assigned to each candidate this run, via the existing relationshipTypeFor() helper), sourceAndDirection (a fixed string \\\"outbound_from_prospect_one_hop\\\" since this agent's traversal is always prospect-to-neighbor-to-candidate by construction), timeInterval (a fixed string \\\"unverified_no_temporal_bounds_yet\\\" -- this agent never sets temporal_validity_start/end, matching the existing upsertEdge calls which already pass null for both), directness (\\\"indirect_single_source_web_search\\\" when newEdgeIds.length > 0 else \\\"none_found\\\"), strengthEvidence (the existing hardcoded 0.3 confidence value, labeled, when edges were created), alternativeExplanations (an array built from the ambiguous-candidate-name buckets computed in step 1 above, each entry naming the candidate and the >=2 distinct organizations it was found via -- an empty array when there were none).\n\nRECOVERY PROTOCOL -> CONCRETE ERROR HANDLING (translating the spec's shared INT/REL failure taxonomy -- RETRYABLE_TRANSIENT, RATE_OR_CAPACITY, VALIDATION, POLICY_OR_AUTHORITY, DATA_AMBIGUITY_OR_CONTRADICTION, DUPLICATE_OR_CONCURRENCY, STATE_CORRUPTION, SECURITY_TENANT, TERMINAL_EXTERNAL -- into this codebase's real mechanics, since there is no npm run evaluate/scorecard command anywhere in this repo): AgentRunner.run() (agent-runner.ts lines ~130-145) already wraps implementation.execute() in a try/catch that finalizes any thrown error as a \\\"failed\\\" pil_agent_runs row with the error message preserved -- this is the real STATE_CORRUPTION/TERMINAL_EXTERNAL backstop, do not add a redundant top-level try/catch around the whole execute() body. Every new Supabase read this prompt adds must follow the file's existing \\\"const { data, error } = await ...; if (error) throw error;\\\" pattern -- never swallow a DB error into a default/empty value, since that would silently corrupt a delegation decision (DATA_AMBIGUITY_OR_CONTRADICTION) rather than surfacing it as a real failure. Every new delegation push must be guarded by an explicit length/null check on its trigger data (never push a DelegationRequest with an empty constraints array or a null id) -- an empty-but-truthy delegation is a POLICY_OR_AUTHORITY-adjacent bug this family's existing code already avoids (see how boardLikeHits/corporateLikeHits gate BEN-REL-01's existing two delegations) and the new ones must match that standard. New external tool calls (if any) must go through the existing callTool() helper from shared.ts exactly as today's web_search calls do -- callTool already treats a failed tool result as non-fatal (checks result.success before using it) rather than throwing, matching RETRYABLE_TRANSIENT/RATE_OR_CAPACITY handling.\n\nEVALUATION CRITERIA -> CONCRETE CODE BEHAVIOR (translating the spec's G0-G5 gate structure and gold-case testing intent into this repo's real bar, which is pnpm tsc --noEmit + pnpm run build + real unit tests, not a scorecard): (1) never fabricate a relationship, node, or edge from LLM/search text alone without a real search hit backing it -- preserve the existing pattern exactly (a candidate is only created when callTool's web_search actually returned a result). (2) never let two independently-discovered same-named or same-role candidates silently merge into one identity without a BEN-KNW-02 identity-resolution delegation firing first -- this is the concrete form of the spec's \\\"names are not identifiers\\\" principle. (3) never treat a shared board/org membership alone as strong personal closeness without the existing strength-scoring/limitations language this family already writes into its evidence claims and conclusions. (4) confidence values on any new edge/evidence this prompt's new code paths create must come from a real computed source (an existing edge's .confidence, an evidence item's .confidence, or a documented constant with a comment explaining the number, matching this file's existing MODEL_TOKEN_UNIT_COST_USD-style documented-constant convention) -- never a bare unexplained magic number.\n\nTEST FILE: src/__tests__/unit/pil-rel-agents.test.ts. Check whether it already exists first (it will after BEN-REL-01's own upgrade prompt has run, since these prompts execute sequentially in one FORGE queue and each commits before the next starts). If it exists, read it in full and ADD a new describe block for this agent's new delegation-trigger behavior, matching its existing mocking/setup pattern exactly. If it does not exist yet (only possible if this prompt is run standalone/out of order), create it following src/__tests__/unit/pil-qlf-knw-agents.test.ts's pattern (read that file in full first: vi.mock() for @/lib/pil/db, @/lib/pil/evidence, @/lib/pil/graph, @/lib/pil/human-review, @/lib/pil/audit as needed; the makeClient() chainable Supabase-mock helper keyed by table name; a baseContext() helper for AgentContext) -- do not invent a new test style. Cover at minimum: one happy-path test proving each newly-added delegation fires under its documented trigger condition, and one edge-case test proving it does NOT fire when the trigger condition is absent (e.g. no ambiguous candidates, no contested evidence, context.prospectId null where relevant).\n\nAlso update this file's own header comment block to note the three new delegation targets and the decision object, in the same documentation style the existing header comment already uses (a short paragraph, not a rewrite of the whole comment).\n\nMANDATORY CLOSE-OUT (do all four, in order): 1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing. 2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit). 3. Verify what you built actually works: re-read the file(s) you changed and confirm the described delegation-trigger behavior and decision-object shape are actually present in the code, not just that it compiles. 4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which BEN-REL-0N delegation targets and decision-dimension fields this prompt added, confirm src/lib/pil/agents/index.ts's AGENT_FACTORIES entry for this agent_id is unchanged/still correct since no new agent codes were introduced) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/rel/BEN-REL-01.ts
    - src/__tests__/unit/pil-rel-agents.test.ts

gentResult/DelegationRequest interfaces -- class X implements Agent with an execute(context, runner) method, never \\\"extends BaseAgent\\\" which does not exist anywhere in this codebase; note AgentRunner.delegate() at line ~330 sets a delegated child's context.prospectId to the PARENT's context.prospectId unchanged -- a delegation from an org-wide/batch-mode run with prospectId===null to an agent that requires a prospectId, such as BEN-REL-01/BEN-REL-05/BEN-REL-06 which all early-return \\\"requires an existing prospectId\\\" when null, is a dead-on-arrival no-op; guard any new delegation to a prospectId-scoped sibling with an explicit \\\"if (context.prospectId)\\\" check and skip it, with a one-line comment explaining why, when context.prospectId is null). Fourth, read src/lib/pil/agents/qlf/BEN-QLF-04.ts in full as the canonical reference implementation depth/shape (~290 lines: real Supabase reads/writes via getPilClient() against pil_* tables, real getEvidence()/logAction()/createReviewItem() usage from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment, and a delegations array in the returned AgentResult used to chain into follow-on agents by their real agent_id string -- delegation targets are referenced purely as childAgentCode strings, e.g. \\\"BEN-KNW-02\\\", not as TypeScript imports of another agent's class; AgentRunner resolves the string to an implementation via src/lib/pil/agents/index.ts's AGENT_FACTORIES map at delegation time, so no new import statements are needed in this file to delegate to BEN-KNW-02/BEN-KNW-03/BEN-INT-0N/other BEN-REL-0N agents -- they are already registered there). This prompt's scope is limited strictly to the one file named above plus the shared test file named later in this prompt -- do not modify any other file.\n\nSPEC SOURCE OF TRUTH: this upgrade's fuller behavioral detail comes from C:\\temp\\PIL_AGENT_COMPLETE_ROSTER.md's \\\"Relationship (6 agents)\\\" section and C:\\temp\\PIL_AGENT_DEPENDENCIES.yaml's BEN-REL-0N entries (both Phase-1 paper specifications with zero implementation evidence per their own methodology notes -- treat them as design input only, not as claims about what already runs in production). Per those documents, delegation ($7 Delegation / depends_on) is described as an AUTHORITY/CAPABILITY relationship (\\\"may call when its canonical reasoning boundary is required\\\"), not a strict data-flow pipeline dependency -- so every new delegation this prompt adds must be triggered by a concrete, documented condition in the code (a real signal that the target agent's specialized reasoning is actually needed), never an unconditional call on every run.\n\nFULLER SPEC DETAIL FOR BEN-REL-03 (Corporate Relationship Mapping Agent): Purpose per roster -- \\\"Map evidence-backed corporate, employment, ownership, vendor, partnership, and governance connections without collapsing organizational relationships into personal ones.\\\" Output dimensions: Company Legal Identity, Role/Ownership Linkage, Subsidiary/Parent Boundaries, Shared Employment Interval, Commercial Versus Philanthropic Context, Decision-Authority Uncertainty. Dependencies per PIL_AGENT_DEPENDENCIES.yaml -- 5 targets, the largest in the family: BEN-INT-02, BEN-INT-03, BEN-KNW-02, BEN-KNW-03, BEN-REL-05.\n\nIMPORTANT PLATFORM CONSTRAINT: this agent does not require or read context.prospectId at all today (it iterates ALL corporate-category funders org-wide, unlike REL-01/02/05/06 which are single-prospect). BEN-REL-05 requires a prospectId and early-returns otherwise, and AgentRunner.delegate() passes the PARENT's context.prospectId unchanged to any child -- so the BEN-REL-05 delegation below (step 5) must be guarded with \\\"if (context.prospectId)\\\" and skipped with a one-line explanatory comment when this agent is invoked org-wide without one; do not remove that guard to force the delegation through.\n\nCONCRETE CODE TO ADD, inside execute()'s existing for-loop over corporateFunders (and its nested loop over funderContacts) and after both loops:\n\n1. Near-duplicate entity delegation to BEN-KNW-02: before the existing upsertNode() call that creates/finds corporateNode for each funder, query pil_graph_nodes (organization_id=context.orgId, node_type=\\\"company\\\") for any OTHER existing node whose label, when normalized (lowercase, then strip trailing \\\" inc\\\"/\\\" inc.\\\"/\\\" llc\\\"/\\\" corp\\\"/\\\" corporation\\\"/\\\" co\\\" suffixes -- write a small local normalizeCompanyName() helper for this), matches funder.name's normalized form but whose RAW label is not an exact match to funder.name (a likely near-duplicate spelling upsertNode's own exact-label dedup would not catch). When found, push a delegations entry: { childAgentCode: \\\"BEN-KNW-02\\\", objective: naming both labels and asking BEN-KNW-02 to confirm whether they are the same legal entity before this run treats them as distinct nodes, maxAutonomy: \\\"A2\\\", constraints: { funderId: funder.id, candidateNodeLabel: funder.name, possibleDuplicateNodeId, possibleDuplicateLabel } }.\n\n2. Ownership/control delegation to BEN-INT-03: define a new OWNERSHIP_TITLE_PATTERN regex (owner|founder|chairman|chairwoman|chair|\\\\bceo\\\\b|president) alongside the existing PHILANTHROPY_TITLE_PATTERN constant. Inside the funderContacts loop, when a contact's title matches OWNERSHIP_TITLE_PATTERN (in addition to the existing PHILANTHROPY_TITLE_PATTERN check that gates node/edge creation), push a delegations entry: { childAgentCode: \\\"BEN-INT-03\\\", objective: naming the contact and funder and asking BEN-INT-03 to verify documented beneficial-ownership/control before this personnel edge is treated as a decision-authority signal, maxAutonomy: \\\"A2\\\", constraints: { funderId: funder.id, personNodeId: personNode.id, title: contact.title } }.\n\n3. Career-change delegation to BEN-INT-02: before calling upsertEdge() for personnelEdge, fetch the existing pil_graph_edges row for (organization_id=context.orgId, source_node_id=corporateNode.id, target_node_id=personNode.id, edge_type=\\\"has_contact\\\") via a maybeSingle() select (the same pattern getPrimaryProspectNode/getProspectById in shared.ts already use). If a prior row exists AND its properties?.title (cast safely) differs from contact.title, push a delegations entry: { childAgentCode: \\\"BEN-INT-02\\\", objective: naming the contact, the old title, and the new title, and asking BEN-INT-02 to chronicle this career/title change, maxAutonomy: \\\"A2\\\", constraints: { personNodeId: personNode.id, previousTitle: <old>, currentTitle: contact.title } }.\n\n4. Batch provenance delegation to BEN-KNW-03: after both loops complete, if corporateEdgeIds.length + personnelEdgeIds.length > 0, push one delegations entry: { childAgentCode: \\\"BEN-KNW-03\\\", objective: stating N newly-touched corporate/personnel edges need provenance verification, maxAutonomy: \\\"A2\\\", constraints: { edgeIds: [...corporateEdgeIds, ...personnelEdgeIds] } }.\n\n5. Warm-introduction delegation to BEN-REL-05 (GUARDED, see platform constraint above): only when context.prospectId is truthy, and only for a personNode created via a philanthropy-title match this run whose title also suggests seniority (VP/director/manager-level -- reuse the existing PHILANTHROPY_TITLE_PATTERN match as the seniority proxy, no new regex needed), push one delegations entry: { childAgentCode: \\\"BEN-REL-05\\\", objective: naming the person and funder and asking BEN-REL-05 to compute a warm-introduction path to them, maxAutonomy: \\\"A2\\\", constraints: { prospectId: context.prospectId, targetNodeId: personNode.id } }. When context.prospectId is null, skip this step entirely with a one-line comment explaining why (org-wide sweep mode has no single prospect to path toward).\n\nDECISION OBJECT: extend the existing conclusions return value with a \\\"decision\\\" field mapping this file's existing computed values onto the roster's 6 named dimensions: companyLegalIdentity (the array of corporateFunders' names/ids scanned this run), roleOwnershipLinkage (an array of {personNodeId, title} for every OWNERSHIP_TITLE_PATTERN match from step 2), subsidiaryParentBoundaries (a fixed string \\\"not_modeled_no_parent_subsidiary_column_in_schema\\\" -- this platform's funders table has no parent/subsidiary relationship column, document this as a real schema gap rather than fabricating one), sharedEmploymentInterval (a fixed string \\\"unbounded_no_temporal_validity_set_on_personnel_edges\\\" matching the existing upsertEdge calls which already pass null for both temporal fields), commercialVersusPhilanthropicContext (\\\"philanthropic\\\" for every personnelEdge created via PHILANTHROPY_TITLE_PATTERN, since that is this agent's only personnel-edge creation path today), decisionAuthorityUncertainty (\\\"flagged_for_BEN-INT-03_review\\\" for any contact that triggered step 2's delegation, else \\\"unassessed\\\").\n\nRECOVERY PROTOCOL -> CONCRETE ERROR HANDLING (translating the spec's shared INT/REL failure taxonomy -- RETRYABLE_TRANSIENT, RATE_OR_CAPACITY, VALIDATION, POLICY_OR_AUTHORITY, DATA_AMBIGUITY_OR_CONTRADICTION, DUPLICATE_OR_CONCURRENCY, STATE_CORRUPTION, SECURITY_TENANT, TERMINAL_EXTERNAL -- into this codebase's real mechanics, since there is no npm run evaluate/scorecard command anywhere in this repo): AgentRunner.run() (agent-runner.ts lines ~130-145) already wraps implementation.execute() in a try/catch that finalizes any thrown error as a \\\"failed\\\" pil_agent_runs row with the error message preserved -- this is the real STATE_CORRUPTION/TERMINAL_EXTERNAL backstop, do not add a redundant top-level try/catch around the whole execute() body. Every new Supabase read this prompt adds must follow the file's existing \\\"const { data, error } = await ...; if (error) throw error;\\\" pattern -- never swallow a DB error into a default/empty value, since that would silently corrupt a delegation decision (DATA_AMBIGUITY_OR_CONTRADICTION) rather than surfacing it as a real failure. Every new delegation push must be guarded by an explicit length/null check on its trigger data (never push a DelegationRequest with an empty constraints array or a null id) -- an empty-but-truthy delegation is a POLICY_OR_AUTHORITY-adjacent bug this family's existing code already avoids (see how boardLikeHits/corporateLikeHits gate BEN-REL-01's existing two delegations) and the new ones must match that standard. New external tool calls (if any) must go through the existing callTool() helper from shared.ts exactly as today's web_search calls do -- callTool already treats a failed tool result as non-fatal (checks result.success before using it) rather than throwing, matching RETRYABLE_TRANSIENT/RATE_OR_CAPACITY handling.\n\nEVALUATION CRITERIA -> CONCRETE CODE BEHAVIOR (translating the spec's G0-G5 gate structure and gold-case testing intent into this repo's real bar, which is pnpm tsc --noEmit + pnpm run build + real unit tests, not a scorecard): (1) never fabricate a relationship, node, or edge from LLM/search text alone without a real search hit backing it -- preserve the existing pattern exactly (a candidate is only created when callTool's web_search actually returned a result). (2) never let two independently-discovered same-named or same-role candidates silently merge into one identity without a BEN-KNW-02 identity-resolution delegation firing first -- this is the concrete form of the spec's \\\"names are not identifiers\\\" principle. (3) never treat a shared board/org membership alone as strong personal closeness without the existing strength-scoring/limitations language this family already writes into its evidence claims and conclusions. (4) confidence values on any new edge/evidence this prompt's new code paths create must come from a real computed source (an existing edge's .confidence, an evidence item's .confidence, or a documented constant with a comment explaining the number, matching this file's existing MODEL_TOKEN_UNIT_COST_USD-style documented-constant convention) -- never a bare unexplained magic number.\n\nTEST FILE: src/__tests__/unit/pil-rel-agents.test.ts. Check whether it already exists first (it will after BEN-REL-01's own upgrade prompt has run, since these prompts execute sequentially in one FORGE queue and each commits before the next starts). If it exists, read it in full and ADD a new describe block for this agent's new delegation-trigger behavior, matching its existing mocking/setup pattern exactly. If it does not exist yet (only possible if this prompt is run standalone/out of order), create it following src/__tests__/unit/pil-qlf-knw-agents.test.ts's pattern (read that file in full first: vi.mock() for @/lib/pil/db, @/lib/pil/evidence, @/lib/pil/graph, @/lib/pil/human-review, @/lib/pil/audit as needed; the makeClient() chainable Supabase-mock helper keyed by table name; a baseContext() helper for AgentContext) -- do not invent a new test style. Cover at minimum: one happy-path test proving each newly-added delegation fires under its documented trigger condition, and one edge-case test proving it does NOT fire when the trigger condition is absent (e.g. no ambiguous candidates, no contested evidence, context.prospectId null where relevant).\n\nAlso update this file's own header comment block to note the five new delegation targets, the platform-constraint guard on step 5, and the decision object, in the same documentation style already used.\n\nMANDATORY CLOSE-OUT (do all four, in order): 1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing. 2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit). 3. Verify what you built actually works: re-read the file(s) you changed and confirm the described delegation-trigger behavior and decision-object shape are actually present in the code, not just that it compiles. 4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which BEN-REL-0N delegation targets and decision-dimension fields this prompt added, confirm src/lib/pil/agents/index.ts's AGENT_FACTORIES entry for this agent_id is unchanged/still correct since no new agent codes were introduced) -- pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."

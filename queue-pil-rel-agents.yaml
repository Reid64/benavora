 own methodology notes -- treat them as design input only, not as claims about what already runs in production). Per those documents, delegation ($7 Delegation / depends_on) is described as an AUTHORITY/CAPABILITY relationship (\\\"may call when its canonical reasoning boundary is required\\\"), not a strict data-flow pipeline dependency -- so every new delegation this prompt adds must be triggered by a concrete, documented condition in the code (a real signal that the target agent's specialized reasoning is actually needed), never an unconditional call on every run.\n\nFULLER SPEC DETAIL FOR BEN-REL-02 (Board Relationship Mapping Agent): Purpose per roster -- \\\"Map overlapping board/trustee/committee/governance service into evidence-backed paths without inferring personal closeness from co-service alone.\\\" Output dimensions: Shared Organization, Board Type, Overlap Interval, Role Compatibility, Path Length, Relationship Limitations. Dependencies per PIL_AGENT_DEPENDENCIES.yaml: BEN-INT-05, BEN-KNW-03, BEN-REL-05 -- none of these three are currently wired (only the REL-06 delegation exists today, which this prompt keeps unchanged).\n\nCONCRETE CODE TO ADD, inside execute() after the existing ranked/delegations-to-REL-06 logic:\n\n1. Governance-depth delegation to BEN-INT-05: for the top-ranked path (ranked[0], when ranked.length > 0), inspect its edgeTypes array; if it includes \\\"serves_on_board_of\\\" or \\\"trustee_of\\\" (this file's existing DEFAULT_MAX_HOPS/rankPaths logic already surfaces edgeTypes per path), push one delegations entry: { childAgentCode: \\\"BEN-INT-05\\\", objective: a string asking BEN-INT-05 to deepen board-governance intelligence (committee/officer-role/interval detail) for the organization anchoring this path, since this agent's own traversal only confirms the edge exists, not its governance detail, maxAutonomy: \\\"A2\\\", constraints: { prospectId: prospect.id, edgeIds: topPath.edgeIds, targetNodeId: topPath.targetNodeId } }. Only
         (API-class sources exempt per the policy - implement exactly
         what the doc says; if the doc left a judgment open it is an AOQ,
         not an improvisation), record the robots decision on the sources
         row robots_policy_state.
      2. Parsing primitives (packages\connectors\src\parse\): HTML to
         text extraction, CSV (streaming, handles headerless with
         supplied column arrays - the IRS lesson generalized), XML
         (streaming), ZIP entry iteration (the 990 bundle path), JSON
         with size guards.
      3. Vitest with fixtures: robots disallow blocks a crawl-class fetch
         and records state; UA present on every request (recording
         client); headerless CSV parses with a supplied 28-column array;
         ZIP iteration yields entries without full-archive memory load
         (assert peak buffer bound on a fixture).
      4. Green; evidence\pi-13\http-parse-tests.txt. Typecheck clean.
      5. Create scripts\verify\verify-pi13-004.mjs standard pattern.
      6. Run: node scripts/verify/verify-pi13-004.mjs
    expected_outputs:
      - packages/connectors/src/http/index.ts
      - packages/connectors/src/parse/index.ts
      - scripts/verify/verify-pi13-004.mjs
    gates:
      - type: command

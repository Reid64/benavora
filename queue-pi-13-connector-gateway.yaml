project: prospect-intel
github_repo: Reid64/prospect-intel

governance:
  - DECISION_LOG.md
  - STANDING_DIRECTIVES.md
  - SESSION_STATE.md
  - STATE_OF_THE_BUILD.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

# ============================================================
# PI-13: CONNECTOR GATEWAY + LAUNCH ADAPTERS
#
# The acquisition layer. One uniform Connector interface behind
# one gateway that enforces, for EVERY source access: policy
# permissibility (pi-11 engine), per-source rate limits, robots
# policy per PRIVACY_CONTROLS, snapshot capture (every fetched
# byte content-addressed BEFORE parsing - claims cite snapshots,
# not live URLs), caching, and metering where the source bills.
# New sources are new adapters, never new pipelines.
#
# HARD-WON DATA LESSONS PORTED FROM THE SIBLING PROJECT (encoded
# in adapter prompts, not left to rediscovery):
#   - IRS BMF state CSVs are HEADERLESS, 28 columns.
#   - Individual IRS 990 XML URLs return HTTP 403; the ZIP bundle
#     path is the only viable route.
#   - Federal Register agency slugs must be read from the live
#     /agencies.json endpoint - hardcoded guessed slugs 400.
#   - USASpending page-1 amounts exceed numeric(12,2) - oversize
#     values null the amount, never fail the batch; and error
#     objects must be unwrapped properly (PostgrestError is not
#     an Error).
#   - Node 20 baseline: camoufox segfaults; use the fallback
#     stealth stack per STANDING_DIRECTIVES.
#
# TESTING RULE: unit tests use recorded fixtures/fakes. Live
# smokes are small, rate-limited, free-tier-safe, and capture
# real snapshots as their evidence. No live smoke for flagged or
# unavailable sources - their absence is recorded, not faked.
# ============================================================

prompts:

  - id: pi13-001
    phase: build
    description: "Preflight: contracts read, rails healthy, source registry rows planned"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Read TOOL_CONTRACTS.md in full, SERVICE_REGISTRY.md connector/
         crawler/rate-limiter entries, PRIVACY_CONTROLS.md source
         permissibility + robots policy sections, and the sources table
         definition in SCHEMA_REGISTRY.md.
      2. Health: migrate --status clean; rails-proof green (re-run,
         capture).
      3. Write docs\architecture\CONNECTOR_LAUNCH_SET.md: the eleven
         launch adapters + licensed interfaces, each mapped to: its
         sources rows (publisher, tier, permissibility class from the
         seeded classes), its rate limit (from the source's published
         terms - fetch and cite each: SEC EDGAR's stated req/s, SAM.gov
         and Grants.gov API terms, ProPublica API guidance, Census,
         Federal Register, USASpending; where a source publishes no
         limit, set a conservative default and mark [DERIVED]), its auth
         needs (which env var), and its tool id in TOOL_CONTRACTS.
         Flag Google Places: BLOCKED behind feature flag pending the
         Cloud Console key-restriction fix (known external item).
      4. Capture to evidence\pi-13\preflight.txt.
      5. Create scripts\verify\verify-pi13-001.mjs: exits 0 only if the
         launch-set doc exists covering all eleven + licensed interfaces
         with a rate-limit line each, and the rails re-run is green.
      6. Run: node scripts/verify/verify-pi13-001.mjs
    expected_outputs:
      - docs/architecture/CONNECTOR_LAUNCH_SET.md
      - scripts/verify/verify-pi13-001.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi13-001.mjs"
    max_retries: 2
    on_fail: halt

  - id: pi13-002
    phase: build
    description: "Connector interface + gateway core: policy, snapshot, cache, meter on every access"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. packages\connectors\src\core\:
         - Connector interface per TOOL_CONTRACTS: id, sourceIds,
           capabilities (search/fetch/enumerate typed operations with zod
           input/output schemas), authRequirement, rateLimitKey.
         - ConnectorGateway.execute(connectorId, operation, input, ctx)
           where ctx carries org/agent/goal/task/purpose. Enforcement
           order, each with a distinct typed failure:
           (a) connector registered + source rows active;
           (b) PolicyEngine.decide for the source's permissibility class
               + purpose (the pi-11 engine, injected);
           (c) rate limiter acquire (pi13-003; stub interface now);
           (d) execute the adapter operation;
           (e) EVERY raw response body snapshotted via SnapshotService
               BEFORE parsing - the adapter returns parsed output PLUS
               the snapshot sha; the gateway refuses an adapter result
               lacking its snapshot ref (claims cite snapshots - this is
               the provenance chain's first link);
           (f) cache layer: content-addressed response reuse within a
               per-source TTL (cache hit skips (c)-(e), returns the
               existing snapshot ref, records a cache-hit audit metric);
           (g) metering hook for billable sources (records to
               cost_ledger with provider dimensions).
      2. FakeConnector for tests. Vitest: enforcement order proven by
         fault injection at each step (policy deny stops before rate
         limit; missing snapshot ref refused; cache hit skips the
         adapter call - call recording asserts it).
      3. Green; evidence\pi-13\gateway-core-tests.txt. Typecheck clean.
      4. Create scripts\verify\verify-pi13-002.mjs standard pattern plus
         the missing-snapshot-refusal test name present.
      5. Run: node scripts/verify/verify-pi13-002.mjs
    expected_outputs:
      - packages/connectors/src/core/index.ts
      - scripts/verify/verify-pi13-002.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi13-002.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi13-003
    phase: build
    description: "Rate limiter service: per-source token buckets honoring published terms"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. packages\services\src\ratelimit\: token-bucket limiter keyed by
         rateLimitKey, config from the CONNECTOR_LAUNCH_SET rates loaded
         into pi.config (migration 0020_ratelimit_config.sql seeding the
         per-source rows - guarded upserts; expectations file first);
         acquire(key) with bounded wait + timeout; a distributed-safety
         note honestly stating the current guarantee (single-worker-pool
         accurate; multi-instance uses a DB-coordinated bucket if the
         registry specified one, else in-process per instance with the
         limitation documented and an AOQ row logged for the
         multi-instance future).
      2. Wire into the gateway for real (replace the stub).
      3. Vitest (fake timers): burst beyond capacity queues then admits at
         refill rate; timeout path; distinct keys independent.
      4. Green; evidence\pi-13\ratelimit-tests.txt. Typecheck clean;
         matrix green with the config seed.
      5. Create scripts\verify\verify-pi13-003.mjs standard pattern.
      6. Run: node scripts/verify/verify-pi13-003.mjs
    expected_outputs:
      - supabase/migrations/0020_ratelimit_config.sql
      - packages/services/src/ratelimit/index.ts
      - scripts/verify/verify-pi13-003.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi13-003.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi13-004

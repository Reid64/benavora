         this runtime) optionally through ScraperAPI rotation
         (PI_SCRAPERAPI_KEY env; add to .env.example; absent key = no
         rotation tier, recorded not fatal). EVERY fetch: robots-checked
         (crawl class), rate-limited per host, snapshotted. Escalation
         tier recorded on the result (plain/stealth/rotated) - BEN-OPS-01
         will want source-difficulty telemetry later.
      2. Extraction: the parse primitives + a structured-page result
         (title, text, links, contact-pattern hits) - deterministic
         extraction only here; model-based extraction is agent work, not
         connector work (state the boundary in the module doc).
      3. Unit tests: escalation trigger on a fixture 403-with-challenge;
         robots denial; tier recording.
      4. Live smoke: crawl ONE benign public page (a well-known
         foundation's about page), assert text extracted + snapshot sha +
         tier recorded - evidence\pi-13\webcrawl-smoke.json.
      5. Green; typecheck clean.

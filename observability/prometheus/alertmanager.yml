# Alertmanager routing for prometheus.rules.yaml.
#
# Prometheus only evaluates alert *conditions*; delivery to Slack is
# Alertmanager's job. Apply this wherever the rules are evaluated
# (self-hosted Alertmanager, or your Prometheus provider's managed
# Alertmanager/contact-point equivalent -- e.g. Grafana Cloud/Alloy).
#
# The Slack webhook URL is a secret and must not be committed. Point
# slack_api_url_file at a secret mounted on the Alertmanager host, sourced
# from the SLACK_ALERTS_WEBHOOK_URL value in your secret manager (see
# .env.local.example). If your provider only accepts an inline webhook URL
# (no *_file support), set it there via the provider's secret store instead
# of pasting it into this checked-in file.
global:
  slack_api_url_file: /etc/alertmanager/secrets/slack_alerts_webhook_url

route:
  receiver: slack-benavora-alerts
  group_by: [alertname, family]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-benavora-alerts
    slack_configs:
      - channel: "#benavora-alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

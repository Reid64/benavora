- id: dd-rebuild-001
  name: Governance sync and Donor Discovery schema and data pipeline audit
  prompt: |
    First sync governance docs: $repo = 'C:\Users\manag\Documents\benavora'; $forge = 'C:\Users\manag\Documents\FORGE\projects\benavora'; Get-ChildItem $repo -Filter '*.md' | ForEach-Object { Copy-Item $_.FullName (Join-Path $forge $_.Name) -Force }

    Read src/app/(dashboard)/donor-discovery/ directory listing in FULL.
    Read EVERY file in that directory in FULL including all subdirectories.
    Read worker/dist/src/lib/donor-discovery/ directory listing.
    Read SCHEMA_REGISTRY_v2.md for corporate_prospects, dd_requests, submission_queue tables in FULL.
    Read src/app/api/ directory listing for any donor-discovery routes.

    AUDIT: Report exactly:
    1. What routes exist under src/app/api/ for donor discovery?
    2. What tables exist in the DB for donor discovery? Run:
    npx tsx -e "import {createClient} from '@supabase/supabase-js'; const s=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY); Promise.all([s.from('corporate_prospects').select('id',{count:'exact',head:true}), s.from('dd_requests').select('id',{count:'exact',head:true}), s.from('submission_queue').select('id',{count:'exact',head:true})]).then(([cp,dd,sq])=>console.log('corporate_prospects:',cp.count,'dd_requests:',dd.count,'submission_queue:',sq.count,'errors:',cp.error?.message,dd.error?.message,sq.error?.message))"
    3. What does corporate_prospects table actually contain? Show schema and sample records:
    npx tsx -e "import {createClient} from '@supabase/supabase-js'; const s=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY); s.from('corporate_prospects').select('*').limit(3).then(r=>console.log(JSON.stringify(r.data,null,2)))"
    4. What does the discover flow do when Continue is clicked? Trace the onClick handler.
    5. What is the dd_request table schema?

    Based on audit findings: document ALL broken pieces before writing any code.
    Then fix the back button: find why it shows a circle-with-X icon and fix navigation.

    Run pnpm tsc --noEmit. Fix TypeScript errors found.
    git add -A; git commit -m 'fix: donor discovery audit -- broken pieces documented, back button fixed'; git push.

- id: dd-rebuild-002
  name: Corporate prospect data pipeline complete build
  prompt: |
    Read src/app/(dashboard)/donor-discovery/ directory in FULL.
    Read SCHEMA_REGISTRY_v2.md for corporate_prospects and dd_requests tables in FULL.
    Read src/lib/sources/land-bank-client.ts for API pattern reference.

    The corporate_prospects table is the foundation of Donor Discovery. It needs to be populated with real, relevant corporate prospect data.

    CREATE scripts/populate-corporate-prospects.ts

    This script builds a comprehensive corporate prospect database from multiple real sources.

    SOURCE 1 — Google Places API (primary source for local businesses):
    For each org in organizations WHERE onboarding_completed=true:
    Load org service area (city, state) from knowledge_base_profiles.
    Load org NTEE code to determine relevant industry search terms.
    
    Industry search matrix (NTEE -> search terms):
    L (Housing): ['real estate developer', 'home builder', 'property management company', 'bank mortgage lender', 'title company', 'construction company', 'building materials supplier', 'insurance company', 'moving company']
    E/F (Health): ['hospital', 'medical center', 'pharmaceutical company', 'health insurance company', 'medical device company', 'dental practice chain', 'pharmacy', 'medical staffing agency']
    B (Education): ['university', 'college', 'private school', 'educational publisher', 'EdTech company', 'tutoring center', 'corporate training company', 'staffing agency']
    P (Human Services): ['bank', 'credit union', 'grocery chain', 'retail chain', 'staffing agency', 'utility company', 'telecommunications company', 'restaurant chain', 'hotel chain']
    O (Youth): ['sports equipment retailer', 'entertainment company', 'tech company', 'food and beverage company', 'clothing retailer', 'gaming company']
    A (Arts): ['hotel chain', 'restaurant group', 'financial services', 'tech company', 'media company', 'advertising agency', 'luxury brand']
    C/D (Environment): ['energy company', 'utility', 'manufacturing company', 'chemical company', 'transportation company', 'agricultural company']
    Default: ['Fortune 500', 'major employer', 'corporation', 'company headquarters', 'corporate office']

    For each search term + service area: call Google Places Text Search API:
    GET https://maps.googleapis.com/maps/api/place/textsearch/json?query=[term]+in+[city]+[state]&type=establishment&key=[GOOGLE_PLACES_API_KEY]
    
    For top 10 results per search: fetch Place Details:
    GET https://maps.googleapis.com/maps/api/place/details/json?place_id=[id]&fields=name,formatted_address,formatted_phone_number,website,rating,user_ratings_total,business_status,types&key=[GOOGLE_PLACES_API_KEY]
    
    Insert into corporate_prospects:
    - name: place.name
    - website: place.website
    - phone: place.formatted_phone_number
    - address: place.formatted_address
    - city: extracted from address
    - state: extracted from address
    - zip: extracted from address
    - google_place_id: place.place_id
    - rating: place.rating
    - user_ratings_total: place.user_ratings_total
    - industry: determined from search term category
    - industry_category: one of [real_estate, healthcare, education, financial, retail, manufacturing, technology, energy, hospitality, professional_services, construction, food_beverage, transportation, media]
    - organization_id: org.id
    - source: 'google_places'
    - status: 'new'
    ON CONFLICT (google_place_id, organization_id) DO NOTHING

    SOURCE 2 — IRS BMF Corporate Donors (from nonprofits table):
    Query nonprofits WHERE ntee_code LIKE 'T%' (philanthropy/voluntarism foundations) AND asset_amount > 1000000.
    These are private foundations that donate to nonprofits.
    Insert as corporate_prospects with industry='private_foundation', source='irs_bmf'.

    SOURCE 3 — SAM.gov Small Business Database:
    GET https://api.sam.gov/opportunities/v2/search?api_key=SAM-ca328c91-250e-4b51-a4cc-ab90ef5aab7a&q=community+development&naicsCode=522110&limit=20
    Insert qualified companies as prospects.

    SOURCE 4 — Hardcoded national corporate donors by industry (500 companies):
    This is the MOST IMPORTANT source for the popular categories. Create comprehensive lists:

    CONSTRUCTION & TRADES (50 companies):
    National: Turner Construction, Skanska USA, Webcor Builders, Clark Construction, Walsh Group, DPR Construction, Hensel Phelps, McCarthy Building Companies, Mortenson Construction, Holder Construction, Whiting-Turner, JE Dunn Construction, Gilbane Building Company, Suffolk Construction, Brasfield & Gorrie
    Regional variations by service area.
    Each with: csr_focus=['affordable housing','community development'], typical_grant_range={min:5000,max:50000}, portal_type='generic', known_giving_programs=['employee matching','community grants']

    FOOD SERVICES (50 companies):
    National: McDonald's, Starbucks, Yum! Brands, Darden Restaurants, Aramark, Sodexo, Compass Group, Sysco, US Foods, Performance Food Group, Chipotle, Panera Bread, Dunkin Brands, Jack in the Box, Restaurant Brands International
    Each with CSR programs: hunger relief, youth employment, community development.

    PROFESSIONAL SERVICES (50 companies):
    National: Deloitte, PwC, KPMG, EY, McKinsey, BCG, Bain, Accenture, IBM, Cognizant, Infosys, Wipro, Capgemini, Booz Allen Hamilton, Leidos, SAIC, ManTech, ICF, Booz Allen
    Known for: pro bono services, skills-based volunteering, employee matching, community grants.

    MANUFACTURING (50 companies):
    National: 3M, Honeywell, General Electric, Caterpillar, Deere & Company, Parker Hannifin, Emerson Electric, Illinois Tool Works, Eaton Corporation, Rockwell Automation, Roper Technologies, Dover Corporation, Xylem, Watts Water Technologies
    CSR focus: STEM education, workforce development, environmental programs.

    SITE SERVICES (50 companies):
    National: ABM Industries, ServiceMaster, Aramark Uniform Services, Cintas, Rollins, Terminix, Belfor Holdings, BrightSpring Health, TeamHealth, Envision Healthcare
    CSR focus: workforce development, community employment, veterans employment.

    TECHNOLOGY (50 companies):
    National: Microsoft, Google, Amazon, Apple, Meta, Salesforce, Adobe, Oracle, SAP, Cisco, Intel, Qualcomm, NVIDIA, AMD, Broadcom
    Known for: digital inclusion, education, STEM, workforce development.

    FINANCIAL SERVICES (50 companies):
    National: JPMorgan Chase, Bank of America, Wells Fargo, Citibank, US Bank, PNC Bank, Truist, Fifth Third Bank, Regions Bank, Huntington Bancshares, KeyBank, Santander US, TD Bank, BMO Harris, BBVA USA
    Community Reinvestment Act (CRA) compliance drives significant giving. Include CRA program details.

    HEALTHCARE (50 companies):
    National: UnitedHealth Group, CVS Health, Anthem, Cigna, Humana, Centene, Molina Healthcare, WellCare, Magellan Health, Centene
    CSR: health equity, access to care, mental health, substance use.

    RETAIL (50 companies):
    National: Walmart, Target, Costco, Home Depot, Lowe's, Best Buy, Macy's, Nordstrom, TJX Companies, Ross Stores, Burlington, Dollar General, Dollar Tree, Family Dollar, Five Below
    Community giving: local community grants, employee matching, hunger relief.

    ENERGY & UTILITIES (50 companies):
    National: Duke Energy, Southern Company, Dominion Energy, Exelon, NextEra Energy, American Electric Power, Xcel Energy, Entergy, Eversource Energy, Consolidated Edison, Pacific Gas & Electric, Edison International, Avangrid, WEC Energy Group
    CRA-adjacent giving, environmental programs, workforce development.

    For each company: insert into corporate_prospects with full fields including:
    - known_csr_programs: jsonb array of { program_name, focus_areas, typical_grant_range, application_url, deadline_pattern }
    - industry_category: standardized category
    - employee_count_estimate: text range ('1000-5000', '5000-25000', '25000-100000', '100000+')
    - annual_revenue_estimate: text range
    - has_employee_matching: boolean
    - has_community_grants: boolean
    - has_foundation: boolean
    - foundation_name: text if applicable
    - portal_type: 'cybergrants'|'benevity'|'yourcause'|'blackbaud'|'generic'|'unknown'
    - portal_url: direct URL to their giving portal if known

    Portal mapping (CRITICAL for AutoApply):
    Companies on Benevity: Microsoft, Google, Salesforce, Adobe, and most Fortune 500 tech companies
    Companies on CyberGrants: JPMorgan Chase, Bank of America, many financial institutions
    Companies on YourCause: many manufacturing and industrial companies
    Companies on Blackbaud: many healthcare and education companies

    Run: npx tsx scripts/populate-corporate-prospects.ts
    Report total prospects by industry_category.
    Add package.json script: "populate:prospects": "tsx scripts/populate-corporate-prospects.ts"

    Run pnpm tsc --noEmit. Fix errors.
    git add -A; git commit -m 'feat: corporate prospects complete data pipeline -- Google Places, IRS BMF, 500 national companies with CSR programs and portal types'; git push.

- id: dd-rebuild-003
  name: Donor Discovery UI complete enterprise rebuild
  prompt: |
    Read src/app/(dashboard)/donor-discovery/ ALL files in FULL.
    Read SCHEMA_REGISTRY_v2.md for corporate_prospects table FULL schema.
    Read src/app/(dashboard)/dashboard/page.tsx first 30 lines for color tokens.

    CRITICAL: inline style={{}} only. Hardcoded hex. Canvas #D6E4F0.

    COMPLETE REBUILD of the entire Donor Discovery section.

    MAIN PAGE src/app/(dashboard)/donor-discovery/page.tsx:
    
    Header: "Donor Discovery" H1 + subtitle "AI-powered corporate prospect identification and outreach"
    
    Stats row (5 cards, background #0D1526):
    - Total Prospects in Pipeline
    - High Intent (intent_score >= 75)
    - Contacted This Month
    - Active Outreach Campaigns
    - Submissions via AutoApply
    

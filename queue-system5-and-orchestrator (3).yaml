- id: s5-confidence-and-persist
  name: Build ConfidenceScorer and DB persistence layer
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\sentinel-prime\types.ts in full.
    Read C:\Users\manag\Documents\forge-2\src\memory\builds.ts in full as DB persistence reference.

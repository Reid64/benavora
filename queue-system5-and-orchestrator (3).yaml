    Export SENTINEL_WEIGHTS = { execution: 0.35, validation: 0.40, governance: 0.25 }.
    Export function scoreConfidence(executionResult: ExecutionMonitorResult, validationResult: ValidationResult, governanceResult: GovernanceEnforcerResult): ConfidenceScore.
    Formula: executionScore = executionResult.passed ? 1.0 : Math.max(0, 1.0 - (executionResult.violations.length * 0.25)) clamped 0-1. validationScore = validationResult.intentFulfillmentScore clamped 0-1. governanceScore = governanceResult.passed ? 1.0 : Math.max(0, 1.0 - (governanceResult.contractViolations.length * 0.30)) clamped 0-1. composite = (executionScore * 0.35) + (validationScore * 0.40) + (governanceScore * 0.25) clamped 0-1.
    haltRecommended = composite < 0.4 OR any violation.severity === EventSeverity.HALT OR governanceResult.contractViolations.length > 0.
    Export function decideHalt(score: ConfidenceScore, executionResult: ExecutionMonitorResult, governanceResult: GovernanceEnforcerResult): HaltDecision.
    autoRecoverable=true only when composite>=0.3 and no HALT severity violations and no contract violations.
    Export function persistSentinelRun(result: SentinelPrimeRunResult): void using better-sqlite3 prepared statements inserting into sentinel_prime_runs and all ObservationEvents into validation_events.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 errors.

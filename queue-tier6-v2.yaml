project: benavora
governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- SCHEMA_REGISTRY.md
prompts:

- id: t6-002
  name: SAM.gov polling client
  prompt: "Read src/lib/sources/grantsgov-client.ts in full. Create src/lib/sources/samgov-client.ts matching the same pattern: fetch https://api.sam.gov/opportunities/v2/search?api_key=SAM-ca328c91-250e-4b51-a4cc-ab90ef5aab7a&ptype=o&limit=100. Parse response.opportunitiesData[]. Map title->name, description->description, responseDeadLine->deadline, awardAmount->amount, category='Government Federal', source='sam_gov', noticeId->external_id. Create src/app/api/sources/samgov/route.ts: GET endpoint accepts orgId param, calls SAM client, deduplicates by external_id, upserts to opportunities table via supabase service role client. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: SAM.gov polling client'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/sources/samgov-client.ts
    - src/app/api/sources/samgov/route.ts

- id: t6-003
  name: ProPublica 990 enrichment client
  prompt: "Create src/lib/sources/propublica-990-client.ts: fetch https://projects.propublica.org/nonprofits/api/v2/organizations/{ein}.json. Extract totrevenue and totassetsend from filings[0]. Create src/app/api/sources/propublica/route.ts: GET with ?ein= param, fetches org detail, upserts asset_amount and revenue to foundation_directory where ein matches, uses supabase service role. Create scripts/enrich-propublica-batch.ts: reads foundation_directory rows where asset_amount IS NULL limit 1000, queries ProPublica by EIN with 300ms delay between calls, upserts results. Add to package.json scripts: 'enrich:propublica-batch': 'tsx scripts/enrich-propublica-batch.ts'. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: ProPublica 990 client'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/sources/propublica-990-client.ts
    - src/app/api/sources/propublica/route.ts

- id: t6-005
  name: CSV import wizard
  prompt: "Create src/app/(dashboard)/import/page.tsx: 3-step CSV import. Step 1: file input accept='.csv', parse first 5 rows with FileReader, show preview table. Step 2: map CSV columns to fields name/email/website/category/phone/state/notes via dropdowns. Step 3: POST mapped data to /api/import/csv, show import count. Create src/app/api/import/csv/route.ts: accepts JSON array, validates required field 'name', upserts to funders table via supabase service role, returns {imported, failed}. Add Import link to sidebar nav under Platform section. Style with bg-white rounded-xl shadow-sm border border-slate-200. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: CSV import wizard'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/import/page.tsx
    - src/app/api/import/csv/route.ts

- id: t6-006
  name: AutoApply autonomous modes
  prompt: "Create src/app/api/autoapply/mode/route.ts: GET returns org_settings.autoapply_mode (default 'manual') for orgId from auth, POST updates it to manual/semi_auto/autonomous using supabase service role. Find the most relevant existing AutoApply page and add a mode selector: three buttons Manual/Semi-Auto/Autonomous. Semi-Auto shows amber warning. Autonomous shows red warning text and a confirmation alert before enabling. Only show Autonomous option if user role is owner. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: AutoApply autonomous modes'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/autoapply/mode/route.ts

- id: t6-008
  name: Foundation profile builder
  prompt: "Create src/supabase/migrations/075_foundation_profiles.sql: CREATE TABLE IF NOT EXISTS foundation_profiles (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), foundation_id uuid REFERENCES foundation_directory(id) ON DELETE CASCADE, avg_grant_size numeric, geographic_focus text, funding_categories text[], computed_at timestamptz DEFAULT now()); CREATE INDEX IF NOT EXISTS idx_foundation_profiles_foundation_id ON foundation_profiles(foundation_id). Create src/lib/intelligence/foundation-profiler.ts: exports async function computeFoundationProfile(foundationId, supabase) that reads foundation_directory enrichment jsonb, computes avg_grant_size from grant data if available, returns profile object. Create src/app/api/foundations/[id]/profile/route.ts: GET calls computeFoundationProfile, upserts result to foundation_profiles, returns it. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: foundation profiler'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/intelligence/foundation-profiler.ts
    - src/app/api/foundations/[id]/profile/route.ts

- id: t6-009
  name: Success probability scoring
  prompt: "Create src/lib/intelligence/success-probability.ts: exports async function computeSuccessProbability(orgId, opportunityId, supabase): Promise<{score:number, confidence:string, factors:object[]}>. Fetch opportunity eligibility_score weight 30pct. Fetch org outcomes success rate for same category weight 25pct. Check deadline is 30+ days out weight 20pct. Count KB narratives weight 25pct. Return weighted average 0-100 as score, confidence 'high'/'medium'/'low', factors array. Create src/app/api/opportunities/[id]/probability/route.ts: GET with ?orgId= param calls computeSuccessProbability returns result. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: success probability'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/intelligence/success-probability.ts
    - src/app/api/opportunities/[id]/probability/route.ts

- id: t6-010
  name: Competitor intelligence
  prompt: "Create src/lib/intelligence/competitor-intel.ts: exports async function getCompetitorIntel(foundationId, supabase). Reads foundation_directory where id=foundationId, checks enrichment jsonb for any grant recipient data. If no recipient data returns empty array. If recipient data exists groups by recipient name and sums amounts. Returns top 10 as array of {name, total_received, years_funded}. Create src/app/api/foundations/[id]/competitors/route.ts: GET calls getCompetitorIntel returns result. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: competitor intel'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/intelligence/competitor-intel.ts
    - src/app/api/foundations/[id]/competitors/route.ts

- id: t6-011
  name: Semantic funder matching
  prompt: "Create src/lib/intelligence/semantic-matcher.ts: exports async function matchFunders(orgMission, orgId, supabase, filters?). Queries foundation_directory limit 500. For each record scores keyword overlap: split mission and foundation name into words, compute intersection divided by union. Returns top 50 sorted by score as {id, name, ein, asset_amount, state, score}. Create src/app/api/match/foundations/route.ts: POST accepts {orgId, mission, minGrant, maxGrant, state} calls matchFunders returns results. Create src/app/(dashboard)/research/match/page.tsx: textarea for mission, grant range inputs, submit button calls API, results list with score badge. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: semantic funder matching'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/intelligence/semantic-matcher.ts
    - src/app/(dashboard)/research/match/page.tsx
    - src/app/api/match/foundations/route.ts

- id: t6-012
  name: Outreach templates
  prompt: "Create src/supabase/migrations/076_outreach_templates.sql: CREATE TABLE IF NOT EXISTS outreach_templates (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, name text NOT NULL, channel text NOT NULL CHECK (channel IN ('email','linkedin','phone_script','physical_mail')), subject text, body text NOT NULL, created_at timestamptz DEFAULT now()). Create src/app/api/outreach/templates/route.ts: GET returns templates for org from auth, POST creates template. Create src/app/(dashboard)/outreach/page.tsx: tabs for each channel, template cards, New Template modal with name/channel/subject/body fields. Add Outreach link in sidebar nav. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: outreach templates'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/outreach/page.tsx
    - src/app/api/outreach/templates/route.ts

- id: t6-013
  name: Follow-up sequences
  prompt: "Create src/supabase/migrations/077_followup_sequences.sql: CREATE TABLE IF NOT EXISTS followup_sequences (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, name text NOT NULL, trigger_stage text NOT NULL, steps jsonb NOT NULL DEFAULT '[]'::jsonb, created_at timestamptz DEFAULT now()); CREATE TABLE IF NOT EXISTS followup_enrollments (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), application_id uuid NOT NULL, sequence_id uuid NOT NULL, enrolled_at timestamptz DEFAULT now(), current_step int DEFAULT 0, status text DEFAULT 'active'). Create src/app/api/outreach/sequences/route.ts: GET/POST for sequences CRUD. Create src/app/(dashboard)/outreach/sequences/page.tsx: list sequences, New Sequence form with name/trigger/steps. Create src/worker/jobs/process-followups.ts: export async function processFollowups() stub that logs 'processing followups'. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: follow-up sequences'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/(dashboard)/outreach/sequences/page.tsx
    - src/worker/jobs/process-followups.ts

- id: t6-014
  name: Grant financial reconciliation
  prompt: "Create src/supabase/migrations/078_grant_financials.sql: CREATE TABLE IF NOT EXISTS grant_budgets (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, application_id uuid, total_budget numeric DEFAULT 0, personnel numeric DEFAULT 0, supplies numeric DEFAULT 0, equipment numeric DEFAULT 0, other numeric DEFAULT 0, period_start date, period_end date, created_at timestamptz DEFAULT now()); CREATE TABLE IF NOT EXISTS grant_expenses (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, budget_id uuid REFERENCES grant_budgets(id), category text, description text, amount numeric NOT NULL, expense_date date, created_at timestamptz DEFAULT now()). Create src/app/api/financials/budgets/route.ts: GET/POST. Create src/app/api/financials/expenses/route.ts: GET/POST. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: grant financials'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/financials/budgets/route.ts
    - src/app/api/financials/expenses/route.ts

- id: t6-015
  name: Compliance calendar
  prompt: "Create src/supabase/migrations/079_compliance.sql: CREATE TABLE IF NOT EXISTS compliance_requirements (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, application_id uuid, requirement_type text NOT NULL, title text NOT NULL, due_date date NOT NULL, status text DEFAULT 'upcoming' CHECK (status IN ('upcoming','due_soon','overdue','submitted')), notes text, submitted_at timestamptz, created_at timestamptz DEFAULT now()). Create src/app/api/compliance/route.ts: GET returns requirements sorted by due_date, POST creates, PATCH updates status. Create src/app/(dashboard)/compliance/page.tsx: list with red/amber/green urgency coloring, Mark Submitted button, Add Requirement modal. Add Compliance to sidebar. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: compliance calendar'; git push."
  gates:

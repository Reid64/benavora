  name: State portal scraping framework
  prompt: "Create src/lib/sources/state-portals/portal-config.ts: export interface PortalConfig {state: string; portalName: string; searchUrl: string; titleSelector: string; deadlineSelector: string;}. Export const STATE_PORTAL_CONFIGS: PortalConfig[] with entries for TX Florida Illinois California NewYork using real grant portal search URLs from memory or reasonable defaults. Create src/lib/sources/state-portals/portal-scraper.ts: export async function scrapePortal(config: PortalConfig): Promise<Array<{title:string, deadline:string|null, sourceUrl:string, state:string}>>. Uses fetch to GET config.searchUrl, extracts text matching titleSelector pattern with basic string search. Returns empty array on any error. Create src/app/api/sources/state-portals/route.ts: GET with ?state= finds config calls scrapePortal returns results. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: state portal scraper'; git push."

    - src/app/api/compliance/route.ts

- id: t6-016
  name: Deadline prediction
  prompt: "Create src/lib/intelligence/deadline-predictor.ts: exports async function predictDeadlines(funderId, supabase). Queries opportunities where funder_id=funderId and deadline IS NOT NULL. Groups past deadlines by month number. If any month appears 2+ times returns prediction {predicted_month: number, month_name: string, confidence: 'high'|'medium', basis: string, days_until_next: number}. Returns array of predictions. Create src/app/api/intelligence/deadline-predictions/route.ts: GET with ?funderId= calls predictDeadlines returns results. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: deadline prediction'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/intelligence/deadline-predictor.ts
    - src/app/api/intelligence/deadline-predictions/route.ts

- id: t6-017
  name: Application cloning
  prompt: "Create src/app/api/applications/[id]/clone/route.ts: POST accepts {targetOpportunityId}. Read source application by id param. Read latest draft_version for source application. Create new application record with targetOpportunityId, org_id from source, status='discovery'. Call Claude claude-sonnet-4-6 with the source draft body and instruction to adapt it for the new opportunity name. Create new draft_version on cloned application with adapted body and label='Adapted from [source name]'. Return {newApplicationId}. Add Clone button to src/app/(dashboard)/applications/page.tsx opening a simple modal to select target opportunity then POST to clone endpoint. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: application cloning'; git push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/applications/[id]/clone/route.ts

- id: t6-018
  name: Funder relationship scoring
  prompt: "Create src/supabase/migrations/081_relationship_scores.sql: CREATE TABLE IF NOT EXISTS funder_relationship_events (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), org_id uuid NOT NULL, funder_id uuid NOT NULL, event_type text NOT NULL, event_date timestamptz DEFAULT now(), notes text); CREATE TABLE IF NOT EXISTS funder_relationship_scores (funder_id uuid NOT NULL, org_id uuid NOT NULL, score numeric DEFAULT 0, momentum text DEFAULT 'stable', computed_at timestamptz DEFAULT now(), PRIMARY KEY (funder_id, org_id)). Create src/lib/intelligence/relationship-scorer.ts: exports computeRelationshipScore(funderId, orgId, supabase) counts events with weights award=30 application=10 response=20 outreach=5 returns {score, momentum}. Create src/app/api/funders/[id]/relationship/route.ts: GET computes returns score. Create src/app/api/funders/relationship-scores/route.ts: GET returns scores for all org funders. Run pnpm tsc --noEmit fix all errors. Commit: git add -A; git commit -m 'feat: relationship scoring'; git push."

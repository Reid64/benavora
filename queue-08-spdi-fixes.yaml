prompts:
- id: spdi-fix-001
  name: Risk Classifier and Evidence Gate
  prompt: "New-Item -ItemType Directory -Force -Path 'src\\lib\\governance'\nNew-Item -ItemType Directory -Force -Path 'tests\\unit\\lib\\governance'\n\nWrite FILE 1: C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\risk-classifier.ts\nexport enum RiskClass { ZERO=0, ONE=1, TWO=2, THREE=3, FOUR=4, PROHIBITED=99 }\nexport interface RiskInput { action_type: string; affected_system: 'external_api'|'database'|'file_system'|'internal'; is_reversible: boolean; is_sensitive_identity_field: boolean; affects_published_content: boolean; requires_human_verification: boolean }\nexport function classifyRisk(input: RiskInput): RiskClass { if (/(delete_all|purge|drop_table)/.test(input.action_type)) return RiskClass.PROHIBITED; if (input.affects_published_content && !input.is_reversible && input.affected_system === 'external_api') return RiskClass.FOUR; if (input.affects_published_content && !input.is_reversible) return RiskClass.THREE; if (input.is_sensitive_identity_field && input.affected_system === 'external_api') return RiskClass.THREE; if (input.affects_published_content && input.is_reversible) return RiskClass.TWO; if (input.affected_system === 'external_api' && input.requires_human_verification) return RiskClass.TWO; if (input.affected_system === 'external_api' && input.is_reversible) return RiskClass.ONE; if (input.affected_system === 'database' && !input.affects_published_content) return RiskClass.ONE; return RiskClass.ZERO; }\nexport function requiresApproval(riskClass: RiskClass): boolean { return riskClass >= 3; }\nexport function requiresHumanApproval(riskClass: RiskClass): boolean { return riskClass >= 4; }\n\nWrite FILE 2: C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\evidence-gate.ts\nimport { createClient } from '@supabase/supabase-js';\nconst supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, process.env.SUPABASE_SERVICE_ROLE_KEY!);\nexport async function checkEvidenceGate(pageId: string, clientId: string): Promise<{ passed: boolean; missing_claims: string[]; evidence_count: number }> { const { count, error } = await supabase.from('evidence_records').select('id', { count: 'exact', head: true }).eq('page_id', pageId).eq('client_id', clientId).in('evidence_status', ['verified','client_attested']); if (error || count === null || count === 0) return { passed: false, missing_claims: ['NO_EVIDENCE_RECORDS'], evidence_count: count ?? 0 }; return { passed: true, missing_claims: [], evidence_count: count }; }\n\nWrite FILE 3: C:\\Users\\manag\\Documents\\Tarritrix\\tests\\unit\\lib\\governance\\risk-classifier.test.ts\nimport { describe, it, expect } from 'vitest'; import { classifyRisk, RiskClass, requiresApproval, requiresHumanApproval } from '../../../../src/lib/governance/risk-classifier';\ndescribe('risk-classifier', () => { it('classifies PROHIBITED for delete_all', () => { expect(classifyRisk({ action_type: 'delete_all_pages', affected_system: 'database', is_reversible: false, is_sensitive_identity_field: false, affects_published_content: true, requires_human_verification: false })).toBe(RiskClass.PROHIBITED); }); it('classifies Class 4 for external irreversible published', () => { expect(classifyRisk({ action_type: 'publish_page', affected_system: 'external_api', is_reversible: false, is_sensitive_identity_field: false, affects_published_content: true, requires_human_verification: false })).toBe(RiskClass.FOUR); }); it('classifies Class 0 for internal read', () => { expect(classifyRisk({ action_type: 'read_log', affected_system: 'internal', is_reversible: true, is_sensitive_identity_field: false, affects_published_content: false, requires_human_verification: false })).toBe(RiskClass.ZERO); }); it('requiresApproval true at class 3', () => { expect(requiresApproval(RiskClass.THREE)).toBe(true); expect(requiresApproval(RiskClass.TWO)).toBe(false); }); it('requiresHumanApproval true at class 4', () => { expect(requiresHumanApproval(RiskClass.FOUR)).toBe(true); expect(requiresHumanApproval(RiskClass.THREE)).toBe(false); }); });\n\nVerify all 3 Test-Path True. pnpm tsc --noEmit 0 errors. pnpm vitest run tests/unit/lib/governance/risk-classifier.test.ts — 5 tests pass.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI risk-classifier evidence-gate governance lib'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/governance/risk-classifier.ts
    - src/lib/governance/evidence-gate.ts
    - tests/unit/lib/governance/risk-classifier.test.ts

- id: spdi-fix-002
  name: Audit Logger and Policy Enforcer
  prompt: "Write FILE 1: C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\audit-logger.ts\nimport { createClient } from '@supabase/supabase-js';\nconst getAdminClient = () => createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, process.env.SUPABASE_SERVICE_ROLE_KEY!);\nexport interface AuditEventParams { client_id?: string; agent_id?: string; user_id?: string; action_type: string; risk_class?: number; before_state?: unknown; after_state?: unknown; approval_id?: string; rollback_available?: boolean; rollback_procedure?: string; metadata?: unknown }\nexport async function logAuditEvent(params: AuditEventParams): Promise<string> { try { const supabase = getAdminClient(); const { data, error } = await supabase.from('audit_events').insert({ client_id: params.client_id ?? null, agent_id: params.agent_id ?? null, user_id: params.user_id ?? null, action_type: params.action_type, risk_class: params.risk_class ?? 0, before_state: params.before_state ?? null, after_state: params.after_state ?? null, approval_id: params.approval_id ?? null, rollback_available: params.rollback_available ?? false, rollback_procedure: params.rollback_procedure ?? null, metadata: params.metadata ?? null }).select('id').single(); if (error) { console.error('[audit-logger] insert failed:', error); return ''; } return data?.id ?? ''; } catch (err) { console.error('[audit-logger] unexpected error:', err); return ''; } }\n\nWrite FILE 2: C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\governance\\policy-enforcer.ts\nimport { createClient } from '@supabase/supabase-js';\nconst getAdminClient = () => createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, process.env.SUPABASE_SERVICE_ROLE_KEY!);\nexport type PolicyWarningType = 'api_quota_exceeded'|'rate_limit_hit'|'content_policy_violation'|'spam_detection';\nexport async function handleApiPolicyWarning(params: { client_id: string; agent_id: string; warning_type: PolicyWarningType; triggering_action: string; agent_event_id?: string }): Promise<{ suspended: boolean; policy_event_id: string }> { const supabase = getAdminClient(); const auto_suspended = ['content_policy_violation','spam_detection'].includes(params.warning_type); const { data, error } = await supabase.from('policy_events').insert({ client_id: params.client_id, agent_id: params.agent_id, policy_warning_type: params.warning_type, triggering_action: params.triggering_action, triggering_agent_event_id: params.agent_event_id ?? null, auto_suspended }).select('id').single(); if (error) { console.error('[policy-enforcer] insert failed:', error); return { suspended: false, policy_event_id: '' }; } return { suspended: auto_suspended, policy_event_id: data?.id ?? '' }; }\nexport async function isClientSuspended(clientId: string, _actionClass: string): Promise<boolean> { const supabase = getAdminClient(); const { count } = await supabase.from('policy_events').select('id', { count: 'exact', head: true }).eq('client_id', clientId).eq('auto_suspended', true).is('resolved_at', null); return (count ?? 0) > 0; }\n\nVerify both Test-Path True. pnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI audit-logger policy-enforcer governance lib'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/governance/audit-logger.ts
    - src/lib/governance/policy-enforcer.ts

- id: spdi-fix-003
  name: Approvals API Routes
  prompt: "New-Item -ItemType Directory -Force -Path 'src\\app\\api\\approvals\\[id]'\n\nWrite FILE 1: C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\approvals\\route.ts\nimport { NextResponse } from 'next/server'; import { getOperatorContext } from '@/lib/auth/operator-context';\nexport async function GET(request: Request) { try { const ctx = await getOperatorContext(); if (!ctx) return NextResponse.json({ error: 'Unauthorized' }, { status: 401 }); const supabase = ctx.supabase; const { data, error } = await supabase.from('approvals').select('*').in('client_id', ctx.clientIds ?? []).eq('status','pending').order('created_at', { ascending: false }); if (error) return NextResponse.json({ error: error.message }, { status: 500 }); return NextResponse.json(data ?? []); } catch (e) { return NextResponse.json({ error: 'Internal error' }, { status: 500 }); } }\nexport async function POST(request: Request) { try { const ctx = await getOperatorContext(); if (!ctx) return NextResponse.json({ error: 'Unauthorized' }, { status: 401 }); const body = await request.json(); const { client_id, action_type, risk_class, proposed_action } = body; if (!client_id || !action_type || risk_class === undefined || !proposed_action) return NextResponse.json({ error: 'Missing required fields' }, { status: 400 }); const supabase = ctx.supabase; const { data, error } = await supabase.from('approvals').insert({ client_id, action_type, risk_class, proposed_action, proposed_by: ctx.userId, status: 'pending' }).select('id, status, expires_at').single(); if (error) return NextResponse.json({ error: error.message }, { status: 500 }); return NextResponse.json({ approval_id: data.id, status: data.status, expires_at: data.expires_at }); } catch (e) { return NextResponse.json({ error: 'Internal error' }, { status: 500 }); } }\n\nWrite FILE 2: C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\approvals\\[id]\\route.ts\nimport { NextResponse } from 'next/server'; import { getOperatorContext } from '@/lib/auth/operator-context';\nexport async function PATCH(request: Request, { params }: { params: { id: string } }) { try { const ctx = await getOperatorContext(); if (!ctx) return NextResponse.json({ error: 'Unauthorized' }, { status: 401 }); const body = await request.json(); const { status, notes } = body; if (!['approved','rejected'].includes(status)) return NextResponse.json({ error: 'Invalid status' }, { status: 400 }); const supabase = ctx.supabase; const { data, error } = await supabase.from('approvals').update({ status, notes: notes ?? null, approved_by: ctx.userId, approved_at: new Date().toISOString() }).eq('id', params.id).select().single(); if (error) return NextResponse.json({ error: error.message }, { status: 500 }); return NextResponse.json(data); } catch (e) { return NextResponse.json({ error: 'Internal error' }, { status: 500 }); } }\n\nVerify both Test-Path True. pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI approvals API routes GET POST PATCH'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/api/approvals/route.ts
    - src/app/api/approvals/[id]/route.ts

- id: spdi-fix-004
  name: Governance Dashboard API and Page
  prompt: "New-Item -ItemType Directory -Force -Path 'src\\app\\api\\dashboard\\governance'\nNew-Item -ItemType Directory -Force -Path 'src\\app\\dashboard\\governance'\n\nWrite FILE 1: C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\governance\\route.ts\nimport { NextResponse } from 'next/server'; import { getOperatorContext } from '@/lib/auth/operator-context';\nexport async function GET() { try { const ctx = await getOperatorContext(); if (!ctx) return NextResponse.json({ error: 'Unauthorized' }, { status: 401 }); const supabase = ctx.supabase; const clientIds = ctx.clientIds ?? []; const [approvalsRes, suspensionsRes, auditRes] = await Promise.all([ supabase.from('approvals').select('id', { count: 'exact', head: true }).in('client_id', clientIds).eq('status','pending'), supabase.from('policy_events').select('id', { count: 'exact', head: true }).in('client_id', clientIds).eq('auto_suspended', true).is('resolved_at', null), supabase.from('audit_events').select('id', { count: 'exact', head: true }).in('client_id', clientIds).gte('occurred_at', new Date(Date.now() - 86400000).toISOString()) ]); return NextResponse.json({ pending_approvals: approvalsRes.count ?? 0, active_suspensions: suspensionsRes.count ?? 0, audit_events_24h: auditRes.count ?? 0, risk_class_breakdown: { class_0: 0, class_1: 0, class_2: 0, class_3: 0, class_4: 0 } }); } catch (e) { return NextResponse.json({ error: 'Internal error' }, { status: 500 }); } }\n\nWrite FILE 2: C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\dashboard\\governance\\page.tsx\n'use client'; import { useState, useEffect } from 'react';\ninterface GovernanceData { pending_approvals: number; active_suspensions: number; audit_events_24h: number; risk_class_breakdown: { class_0: number; class_1: number; class_2: number; class_3: number; class_4: number } }\nexport default function GovernancePage() { const [data, setData] = useState<GovernanceData | null>(null); const [loading, setLoading] = useState(true); const fetchData = async () => { try { const res = await fetch('/api/dashboard/governance'); if (res.ok) { const json = await res.json(); setData(json); } } catch {} finally { setLoading(false); } }; useEffect(() => { fetchData(); const interval = setInterval(fetchData, 30000); return () => clearInterval(interval); }, []); if (loading) return <div style={{ background: '#1c2030', minHeight: '100vh', padding: '24px', color: '#94a3b8' }}>Loading...</div>; return (<div style={{ background: '#1c2030', minHeight: '100vh', padding: '24px' }}><h1 style={{ color: '#06b6d4', fontSize: '20px', fontWeight: 700, marginBottom: '24px', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Governance</h1>{data && (<div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}><div style={{ background: '#0f1623', border: '1px solid #1e2d42', borderRadius: '8px', padding: '16px' }}><div style={{ color: '#94a3b8', fontSize: '12px', textTransform: 'uppercase' }}>Pending Approvals</div><div style={{ color: data.pending_approvals > 0 ? '#f59e0b' : '#06b6d4', fontSize: '32px', fontWeight: 700 }}>{data.pending_approvals}</div></div><div style={{ background: '#0f1623', border: '1px solid #1e2d42', borderRadius: '8px', padding: '16px' }}><div style={{ color: '#94a3b8', fontSize: '12px', textTransform: 'uppercase' }}>Active Suspensions</div><div style={{ color: data.active_suspensions > 0 ? '#ef4444' : '#06b6d4', fontSize: '32px', fontWeight: 700 }}>{data.active_suspensions}</div></div><div style={{ background: '#0f1623', border: '1px solid #1e2d42', borderRadius: '8px', padding: '16px' }}><div style={{ color: '#94a3b8', fontSize: '12px', textTransform: 'uppercase' }}>Audit Events (24h)</div><div style={{ color: '#06b6d4', fontSize: '32px', fontWeight: 700 }}>{data.audit_events_24h}</div></div></div>)}</div>); }\n\nVerify both Test-Path True. pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\ngit add -A; git commit --no-verify -m 'feat: SPDI governance dashboard API and page'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/api/dashboard/governance/route.ts
    - src/app/dashboard/governance/page.tsx


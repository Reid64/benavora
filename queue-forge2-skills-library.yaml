- id: skills-scaffold
  name: Create skills library directory structure and loader
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\cli\index.ts in full.
    Read C:\Users\manag\Documents\forge-2\src\phases\phase3-executor.ts lines 1-100.
    Create the skills library infrastructure:
    1) Create directory C:\Users\manag\Documents\forge-2\src\skills\ with index.ts.
    2) Export interface Skill { id: string, name: string, domain: string, template: string, tags: string[], applicablePromptTypes: string[] }.
    3) Export interface SkillsLibrary { skills: Skill[], getByDomain(domain: string): Skill[], getByTags(tags: string[]): Skill[], getForPrompt(promptType: string): Skill[], injectIntoContext(promptText: string, projectStack: string[]): string }.

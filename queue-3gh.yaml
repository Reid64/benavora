  # ============================================================
  # LIVE SESSION STREAMING & RECORDINGS
  # ============================================================

  - id: gh-005
    phase: build
    description: "Add CDP screencast and WebSocket server to Railway worker for live streaming"
    prompt: |
      Read C:\Users\manag\Documents\benavora\worker\queue-processor.ts completely.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts completely.

      Create C:\Users\manag\Documents\benavora\worker\stream-server.ts:

      Import http and ws (WebSocket). Use the 'ws' package already installed.

      Export class StreamServer:

      constructor(port: number):
      - Create an HTTP server on the given port.
      - Create a WebSocket server attached to the HTTP server.
      - Add a GET /health endpoint returning { status: 'ok', viewers: count }.

      async start(): Promise<void>
      - Listen on the port. Log: "Stream server listening on port {port}".

      onConnection(ws, req):
      - Extract JWT token from query params or headers: ws://host:port?token=JWT
      - Validate JWT against Supabase auth (use supabase.auth.getUser(token)).
      - Extract organization_id from the user's JWT claims or user metadata.
      - If invalid: close connection with code 4001.
      - If valid: store connection in a Map<orgId, Set<WebSocket>>.
      - Log: "Viewer connected for org {orgId}".

      broadcastFrame(orgId: string, frameData: Buffer): void
      - Get all WebSocket connections for this orgId.
      - Send the frame as binary data to each connected viewer.
      - Remove closed connections from the set.

      broadcastStatus(orgId: string, status: { step: string, funderName: string, elapsed: number }): void
      - Send JSON status update to all viewers for this org.

      getViewerCount(orgId: string): number

      Modify C:\Users\manag\Documents\benavora\src\lib\autoapply\stealth-browser.ts:

      Add CDP screencast methods:

      async startScreencast(callback: (frame: Buffer) => void): Promise<void>
      - Get the CDP session: const cdp = await this.page.context().newCDPSession(this.page);
      - Enable screencast: await cdp.send('Page.startScreencast', { format: 'jpeg', quality: 40, maxWidth: 960, maxHeight: 540, everyNthFrame: 3 });
      - Listen for frames: cdp.on('Page.screencastFrame', (params) => { callback(Buffer.from(params.data, 'base64')); cdp.send('Page.screencastFrameAck', { sessionId: params.sessionId }); });

      async stopScreencast(): Promise<void>
      - await cdp.send('Page.stopScreencast');

      Modify C:\Users\manag\Documents\benavora\worker\index.ts (or wherever the worker entry point is):
      - Import StreamServer.
      - Initialize StreamServer on process.env.PORT || 8080.
      - Start it before the queue processor begins.
      - Pass the streamServer instance to the queue processor.

      Modify queue-processor.ts:
      - Accept streamServer as a parameter.
      - When processing an item, if streamServer.getViewerCount(orgId) > 0:
        - Call stealthBrowser.startScreencast((frame) => streamServer.broadcastFrame(orgId, frame));
        - Broadcast status updates at each step: { step: 'Analyzing form', funderName, elapsed }.
      - When done: call stopScreencast.
      - If no viewers connected, skip screencast entirely (zero overhead).
    expected_outputs:
      - worker/stream-server.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: gh-006

  # ============================================================
  # PHASE 3H: ANALYTICS & OPTIMIZATION
  # ============================================================

  - id: gh-009
    phase: build
    description: "Create A/B testing framework for submission approaches"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 7A (A/B Testing).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\ab-testing.ts:

      Export class ABTestEngine:

      async getVariant(orgId: string, funderCategory: string, supabase: any): Promise<ABVariant | null>
      - Fetch active variants for this org + category from ab_test_variants.
      - If no variants exist, return null (no A/B test running).
      - Select a variant randomly weighted by inverse submission_count (less-tested variants get picked more).
      - Return: { id, variantName, pitchStyle, emphasis }.

      async recordOutcome(variantId: string, success: boolean, supabase: any): Promise<void>
      - Increment submission_count. If success, increment success_count.
      - After 50+ submissions per variant in the same category, check for a winner:
        - Calculate conversion rate per variant.
        - If one variant's rate is >20% higher than others with 95% confidence (simple z-test): mark as winner.
        - Log: "A/B test winner for {category}: {variantName} at {rate}%".

      async getTestResults(orgId: string, supabase: any): Promise<TestResults[]>
      - Return all variants grouped by category with conversion rates, submission counts, winner status.

      Create C:\Users\manag\Documents\benavora\src\app\api\autoapply\ab-tests\route.ts:
      GET: return test results for the org.
      POST: create new variant. Accept: funder_category, variant_name, pitch_style, emphasis.
      DELETE: deactivate a variant.

      Integrate into queue-processor:
      - Before personalization, call abTestEngine.getVariant.
      - If a variant is returned, pass its pitchStyle and emphasis to the pitch personalizer.
      - After submission, call recordOutcome with the result.
      - Store variant_id on the autoapply_submissions record.
    expected_outputs:
      - src/lib/autoapply/ab-testing.ts
      - src/app/api/autoapply/ab-tests/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

  - id: gh-010
    phase: build
    description: "Create funder response time analytics"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\response-analytics.ts:

      Export async function getResponseTimeStats(orgId: string, supabase: any): Promise<ResponseTimeReport>
      - Query autoapply_submissions WHERE response_received_at IS NOT NULL AND organization_id = orgId.
      - Calculate per funder: average response time (days between submitted_at and response_received_at).
      - Calculate per category: average response time.
      - Calculate overall: average, median, fastest, slowest.
      - Identify overdue: submissions where (NOW() - submitted_at) > (funder's avg response time * 1.5) AND no response received.
      - Return: { overall, byFunder, byCategory, overdue }.

      Export async function getChannelComparison(orgId: string, supabase: any): Promise<ChannelStats>
      - Group autoapply_submissions by submission_channel (web_form, email, manual).
      - For each: total count, success count, response rate, average response time.
      - Return comparison data.

      Export async function getConversionFunnel(orgId: string, supabase: any): Promise<FunnelData>
      - Stage 1: Queued (total submission_queue items)
      - Stage 2: Submitted (autoapply_submissions created)
      - Stage 3: Confirmed (confirmation_data IS NOT NULL)
      - Stage 4: Responded (response_received_at IS NOT NULL)
      - Stage 5: Funded (linked grant_agreements with amount_awarded > 0)
      - Calculate drop-off rate between each stage.
      - Return stage counts and percentages.

      Export async function getROICalculation(orgId: string, supabase: any): Promise<ROIReport>
      - Total funded: SUM of grant_agreements.amount_awarded.
      - Total cost: SUM of submission_usage costs (claude + openai + proxy + captcha) + subscription fee estimate.
      - ROI: (total_funded - total_cost) / total_cost * 100.
      - Cost per submission: total_cost / total_submissions.
      - Cost per funded dollar: total_cost / total_funded.
      - Return all metrics.
    expected_outputs:
      - src/lib/autoapply/response-analytics.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt


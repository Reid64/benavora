prompts:

  # ============================================================
  # PHASE 3G: MULTI-CHANNEL SUBMISSION & FOLLOW-UP
  # ============================================================

  - id: gh-001
    phase: build
    description: "Create migration for follow-up sequences and session recordings"
    prompt: |
      Create C:\Users\manag\Documents\benavora\supabase\migrations\053_multichannel_analytics.sql:

      CREATE TABLE IF NOT EXISTS autoapply_follow_ups (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id) ON DELETE CASCADE,
        organization_id uuid NOT NULL,
        funder_id uuid NOT NULL,
        sequence_number integer NOT NULL,
        scheduled_at timestamptz NOT NULL,
        sent_at timestamptz,
        status text NOT NULL DEFAULT 'pending',
        template_type text NOT NULL,
        content text,
        response_received boolean DEFAULT false,
        created_at timestamptz DEFAULT NOW()
      );

      CREATE TABLE IF NOT EXISTS session_recordings (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id) ON DELETE CASCADE,
        organization_id uuid NOT NULL,
        funder_id uuid NOT NULL,
        storage_path text NOT NULL,
        duration_seconds integer,
        file_size_bytes integer,
        recorded_at timestamptz DEFAULT NOW()
      );

      CREATE TABLE IF NOT EXISTS ab_test_variants (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL,
        funder_category text NOT NULL,
        variant_name text NOT NULL,
        pitch_style text NOT NULL,
        emphasis text,
        submission_count integer DEFAULT 0,
        success_count integer DEFAULT 0,
        is_winner boolean DEFAULT false,
        active boolean DEFAULT true,
        created_at timestamptz DEFAULT NOW()
      );

      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS variant_id uuid REFERENCES ab_test_variants(id);
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS response_received_at timestamptz;
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS follow_up_status text DEFAULT 'none';

      CREATE INDEX IF NOT EXISTS idx_follow_ups_scheduled ON autoapply_follow_ups(scheduled_at, status) WHERE status = 'pending';
      CREATE INDEX IF NOT EXISTS idx_session_recordings_org ON session_recordings(organization_id, recorded_at DESC);
      CREATE INDEX IF NOT EXISTS idx_ab_variants_category ON ab_test_variants(organization_id, funder_category, active);

      NOTE: Migration 053 must be applied manually via Supabase SQL Editor.
    expected_outputs:
      - supabase/migrations/053_multichannel_analytics.sql
    gates:
      - type: file_exists
        files: [supabase/migrations/053_multichannel_analytics.sql]
    max_retries: 3
    on_fail: halt

  - id: gh-002
    phase: build
    description: "Create email-based submission channel for funders without web portals"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 3A (Email-Based Donation Requests).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\email-submitter.ts:

      Import Resend with lazy initialization.

      Export async function submitViaEmail(params: {
        funderEmail: string,
        funderName: string,
        contactName?: string,
        organizationName: string,
        personalizedPitch: string,
        requestType: string,
        askAmount?: number,
        contactEmail: string,
        contactPhone?: string,
        attachments?: { filename: string, content: Buffer }[]
      }): Promise<{ messageId: string, status: string }>

      Steps:
      1. Construct a professional letter of inquiry email:
         - Subject: "Partnership Inquiry from {organizationName}" (for non-monetary) or "Grant/Donation Request from {organizationName}" (for monetary)
         - Body: HTML formatted letter with: personalized greeting (Dear {contactName} or "Dear Grants Committee"), the personalized pitch, specific request details, amount (if monetary), organization contact information, 501(c)(3) status mention.
         - From: configured Resend sender (notifications@benavora.com or org-specific)
         - Reply-To: org's contact email
      2. Attach documents if provided (501c3 letter, budget, etc.)
      3. Send via Resend API.
      4. Return messageId and status.

      Modify C:\Users\manag\Documents\benavora\worker\queue-processor.ts:
      - In processItem, check submission channel: if funder has giving_portal_url → web_form. If funder has contact_email but no portal → email.
      - If email channel: call submitViaEmail instead of launching StealthBrowser.
      - Track in autoapply_submissions with submission_channel = 'email'.
      - Skip all browser-related steps (screenshots, form filling, CAPTCHA) for email submissions.

      If RESEND_API_KEY is not set, skip email submissions with reason 'email_not_configured'.
    expected_outputs:
      - src/lib/autoapply/email-submitter.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: gh-003
    phase: build
    description: "Create automated follow-up sequence scheduler"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 5B (Automated Follow-Up Sequences).

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\follow-up-scheduler.ts:

      Export async function scheduleFollowUps(params: {
        submissionId: string,
        organizationId: string,
        funderId: string,
        funderName: string,
        submissionChannel: string,
        supabase: any
      }): Promise<void>
      - Insert 3 follow-up rows into autoapply_follow_ups:
        - sequence 1: scheduled_at = submission_date + 14 days, template_type = 'initial_followup'
        - sequence 2: scheduled_at = submission_date + 30 days, template_type = 'second_followup'
        - sequence 3: scheduled_at = submission_date + 60 days, template_type = 'final_followup'

      Export async function processFollowUps(supabase: any): Promise<{ sent: number, skipped: number }>
      - Query autoapply_follow_ups WHERE scheduled_at <= NOW() AND status = 'pending'.
      - For each:
        1. Check if funder has responded (response_received on submission record). If yes, cancel all remaining follow-ups for this submission.
        2. Check funder_relationships for do_not_contact_until. If active, skip.
        3. Generate follow-up email content using Claude (lazy init Anthropic):
           - initial_followup: "Following up on our request submitted on {date}..."
           - second_followup: "Checking in regarding our {request_type} request..."
           - final_followup: "Final follow-up with updated impact information..."
        4. Send via Resend to the funder's email.
        5. Update status = 'sent', sent_at = NOW().
      - Return counts.

      Export async function cancelFollowUps(submissionId: string, reason: string, supabase: any): Promise<void>
      - Update all pending follow-ups for this submission to status = 'cancelled'.

      Create C:\Users\manag\Documents\benavora\src\app\api\cron\follow-ups\route.ts:
      - GET handler with CRON_SECRET auth.
      - Calls processFollowUps.
      - Set maxDuration to 60 seconds.
    expected_outputs:
      - src/lib/autoapply/follow-up-scheduler.ts
      - src/app/api/cron/follow-ups/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

  - id: gh-004

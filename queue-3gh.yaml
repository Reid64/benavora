  - id: gh-007
    phase: build
    description: "Create LiveSessionViewer dashboard component with monitor frame design"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\components\autoapply\LiveSessionViewer.tsx:

      A dashboard component that displays a live stream of the AutoApply worker session, rendered inside a CSS monitor frame.

      MONITOR FRAME DESIGN (pure CSS, no images):
      - Outer container: dark charcoal (#1a1a2e) rounded rectangle with 16px padding, subtle box-shadow (0 8px 32px rgba(0,0,0,0.4)).
      - Top bezel: 12px, slightly lighter (#252540), with centered text "BENAVORA AUTOAPPLY" in 9px uppercase tracking-widest text, color #555.
      - Screen area: inner div with 2px solid #333 border, border-radius 4px, overflow hidden. Background #0a0a15 when no stream.
      - Bottom bezel: 16px, same color as top. Small green dot (6px circle, #22c55e with subtle glow box-shadow) as power indicator on the left. Status text on the right.
      - Monitor stand: centered trapezoid shape below the monitor body. 60px wide at top, 100px at bottom, 20px tall, same charcoal color. Use CSS clip-path.
      - Stand base: 120px wide rectangle, 6px tall, rounded, slightly lighter color.

      STREAM FUNCTIONALITY:
      1. Connect to worker WebSocket: ws://{WORKER_URL}?token={supabase_access_token}
      2. Receive binary frames → render on a <canvas> element inside the screen area using createImageBitmap + drawImage.
      3. Receive JSON status messages → display as overlay at bottom of screen: step name, funder name, elapsed time.
      4. Auto-reconnect on disconnect with exponential backoff (1s, 2s, 4s, max 30s).
      5. When no stream active: show "No active session" message centered on the dark screen with a subtle pulse animation on the power LED.
      6. When streaming: green power LED glows brighter, status text shows "LIVE" with a recording dot animation.

      STATES:
      - Disconnected: dark screen, "Connecting..." text, amber LED.
      - Connected, no session: dark screen, "Waiting for submission..." text, green LED (dim).
      - Live streaming: full stream, status overlay, green LED (bright with glow), "LIVE" badge.

      SIZING:
      - Default: 384px wide (3:2 aspect ratio for the screen area).
      - Expandable: click to toggle fullscreen modal view (960px wide).
      - Responsive: scales down on mobile.

      Add this component to the AutoApply dashboard page, positioned prominently.

      Use Tailwind CSS for the monitor frame styling where possible, inline styles for the specific monitor design elements. Use lucide-react for any icons.
    expected_outputs:
      - src/components/autoapply/LiveSessionViewer.tsx
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


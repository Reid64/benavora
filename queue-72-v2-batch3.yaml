    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /financials. Section: Applications & Pipeline. Frame: #101B2D. Accent: #2E6B66. This page had a real data-loading bug fixed earlier tonight - confirm it still loads real data correctly before styling. Full verification standard required.

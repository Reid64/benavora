project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - PAGE_TREATMENT_PROTOCOL_V2.md
  - DESIGN_SYSTEM_V2_ASSIGNMENT.md
  - FEATURE_REGISTRY_v2.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

prompts:

  - id: cleanup-stray-processes-003
    phase: build
    description: "Kill any stray node processes before this batch"
    prompt: |
      Check for and terminate any node.exe processes not part of this current session before proceeding.
    expected_outputs: []
    gates: [{type: compile}]
    max_retries: 2
    on_fail: continue

  - id: page-applications-002
    phase: build
    description: "/applications - Navy frame, Teal accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /applications. Section: Applications & Pipeline. Frame: #101B2D. Accent: #2E6B66. Preserve real stage-status colors. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/applications/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-deadlines-002
    phase: build
    description: "/deadlines - Navy frame, Teal accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /deadlines. Section: Applications & Pipeline. Frame: #101B2D. Accent: #2E6B66. CRITICAL: preserve the real overdue/due-this-week/future color legend exactly - do not repaint. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/deadlines/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-compliance-002
    phase: build
    description: "/compliance - Navy frame, Teal accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /compliance. Section: Applications & Pipeline. Frame: #101B2D. Accent: #2E6B66. This page had a real data-loading bug fixed earlier tonight - confirm it still loads real data correctly before styling, do not mask a regression with new colors. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/compliance/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-documents-002
    phase: build
    description: "/documents - Navy frame, Teal accent"

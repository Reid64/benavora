    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to both /outreach and /outreach/templates. Section: Outreach & Communication. Frame: #A3492F. Accent: #A4712C. Full verification standard required on both routes.
    expected_outputs: [src/app/(dashboard)/outreach/page.tsx, src/app/(dashboard)/outreach/templates/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: batch3v2-verify-sync-001
    phase: build
    description: "Final regression + governance sync for Batch 3 v2 (11 pages)"
    prompt: |
      1. Real Playwright pass across all pages in this batch, confirm navy/teal on Applications & Pipeline, rust/bronze on Outreach & Communication, layering with shadows, zero unintended white values. CRITICAL: re-confirm /compliance and /financials load real data cleanly, not just styled correctly.
      2. Run pnpm run build and pnpm tsc --noEmit, fix any errors.
      3. Update FEATURE_REGISTRY_v2.md and DESIGN_SYSTEM_V2_ASSIGNMENT.md marking these 11 pages complete under v2.
      4. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md honestly.
      5. Scoped git add, commit "feat: v2 navy/teal design system on Applications & Pipeline, rust/bronze on Outreach & Communication (batch 3 of 4)", push.
    expected_outputs: [FEATURE_REGISTRY_v2.md, STATE_OF_THE_BUILD.md, SESSION_STATE.md]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

- id: ui-shadcn-installer
  name: Build ShadcnInstaller — auto-installs shadcn/ui components in target projects
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\skills\index.ts in full.
    Read C:\Users\manag\Documents\forge-2\src\engine\claude-runner.ts in full.
    Create C:\Users\manag\Documents\forge-2\src\ui-engine\shadcn-installer.ts. Minimum 200 lines.
    Export interface ShadcnComponent { name: string, command: string, dependencies: string[] }.
    Export const SHADCN_COMPONENTS: ShadcnComponent[] — define all available shadcn/ui components: button, input, label, select, dialog, sheet, dropdown-menu, table, card, badge, alert, toast, tabs, accordion, avatar, checkbox, radio-group, switch, textarea, form, calendar, date-picker, command, combobox, skeleton, separator, scroll-area, popover, hover-card, tooltip, progress, slider, toggle, navigation-menu, breadcrumb, pagination, alert-dialog, context-menu, menubar, collapsible, aspect-ratio, resizable.
    Export function detectInstalledComponents(projectPath: string): string[] — reads components.json and src/components/ui/ directory to find already installed components.
    Export function installComponent(projectPath: string, componentName: string): Promise<void> — runs npx shadcn-ui@latest add {componentName} --yes in projectPath. Skips if already installed.
    Export function ensureComponentsInstalled(projectPath: string, requiredComponents: string[]): Promise<string[]> — installs any missing components, returns list of newly installed.
    Export function detectRequiredComponents(promptText: string): string[] — scans prompt text for UI component keywords and maps to shadcn component names.
    Wire into phase3-executor.ts: before prompt execution for component/page/feature prompt types, call detectRequiredComponents and ensureComponentsInstalled.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): ShadcnInstaller auto-installs components in target projects'
  gates:
  - type: compile

- id: ui-component-generator
  name: Build UIComponentGenerator — generates world-class components using skills templates
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\ui-engine\shadcn-installer.ts in full.
    Read C:\Users\manag\Documents\forge-2\src\skills\index.ts in full.
    Read C:\Users\manag\Documents\forge-2\src\engine\claude-runner.ts in full.
    Create C:\Users\manag\Documents\forge-2\src\ui-engine\component-generator.ts. Minimum 250 lines.
    Export interface ComponentSpec { name: string, description: string, props: string[], dataSource: string|null, interactions: string[], accessibility: string[] }.
    Export interface GeneratedComponent { spec: ComponentSpec, code: string, storyCode: string, testCode: string, filePath: string }.
    Export class UIComponentGenerator with method generate(spec: ComponentSpec, projectPath: string, buildRunId: string, promptId: string): Promise<GeneratedComponent>.
    Implementation:
    1) Load ui-components skill template from skills library.
    2) Detect and install required shadcn components via ShadcnInstaller.
    3) Build generation prompt injecting the ui-components skill template, component spec, and these hard requirements: use shadcn/ui primitives not hand-rolled elements, Tailwind for styling, TypeScript strict, ARIA labels on all interactive elements, loading state, error state, empty state where applicable, dark mode support via dark: prefix, mobile-first responsive.
    4) Call runClaude with generation prompt.
    5) Parse response to extract TypeScript component code.
    6) Generate Storybook story code for the component.
    7) Generate Vitest test file for the component.
    8) Write component to projectPath/src/components/{spec.name}.tsx.
    9) Write story to projectPath/src/stories/{spec.name}.stories.tsx if Storybook detected.
    10) Persist to design_artifacts table.
    Export createUIComponentGenerator(): UIComponentGenerator.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): UIComponentGenerator with shadcn skills injection'
  gates:
  - type: compile

- id: ui-design-token-system
  name: Build DesignTokenManager — enforces consistent design tokens across projects
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\ui-engine\component-generator.ts in full.
    Create C:\Users\manag\Documents\forge-2\src\ui-engine\design-token-manager.ts. Minimum 200 lines.
    Export interface DesignTokens { colors: Record<string, string>, typography: Record<string, string>, spacing: Record<string, string>, borderRadius: Record<string, string>, shadows: Record<string, string>, breakpoints: Record<string, string> }.
    Export const DEFAULT_DESIGN_TOKENS: DesignTokens — define a world-class default token set using Tailwind CSS variable names for colors (--primary, --secondary, --accent, --muted, --destructive, --background, --foreground, --card, --border, --ring), Inter as default font family, standard Tailwind spacing scale, consistent border radius (sm: 0.25rem, md: 0.375rem, lg: 0.5rem, xl: 0.75rem, full: 9999px).
    Export function detectProjectTokens(projectPath: string): Partial<DesignTokens> — reads tailwind.config.ts and globals.css to extract existing design tokens.
    Export function generateTailwindConfig(tokens: DesignTokens): string — generates a complete tailwind.config.ts content string with the token set.
    Export function generateGlobalsCss(tokens: DesignTokens): string — generates globals.css with CSS custom properties for all tokens supporting both light and dark mode.
    Export function ensureDesignTokens(projectPath: string, tokens?: Partial<DesignTokens>): Promise<void> — merges provided tokens with defaults, writes tailwind.config.ts and globals.css if not already configured.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): DesignTokenManager consistent design tokens across projects'
  gates:
  - type: compile

- id: ui-storybook-generator
  name: Build StorybookGenerator — auto-generates stories for all components
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\ui-engine\component-generator.ts in full.
    Create C:\Users\manag\Documents\forge-2\src\ui-engine\storybook-generator.ts. Minimum 200 lines.
    Export function detectStorybookInstalled(projectPath: string): boolean — checks for .storybook directory and @storybook packages in package.json.
    Export function installStorybook(projectPath: string): Promise<void> — runs npx storybook@latest init --yes in projectPath if not installed.
    Export function generateStory(componentPath: string, componentName: string, props: string[]): string — generates a complete Storybook story file following CSF3 format with: default export meta with title, component, tags autodocs. Export const Default story. Export const Loading story if component has loading prop. Export const Empty story if component has empty state. Export const Error story if component has error prop.
    Export function generateStoriesForProject(projectPath: string): Promise<{generated: string[], skipped: string[]}> — scans src/components/ for all .tsx files without existing stories, generates story for each, writes to src/stories/.
    Export function generateStorybookIndex(projectPath: string): Promise<void> — creates .storybook/main.ts and .storybook/preview.ts configured for Next.js and Tailwind.
    Wire into UIComponentGenerator: after component generation call generateStory and write to stories directory.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): StorybookGenerator auto-generates CSF3 stories'
  gates:
  - type: compile

- id: ui-accessibility-checker
  name: Build AccessibilityChecker — validates WCAG 2.1 AA compliance
  prompt: |
    Read C:\Users\manag\Documents\forge-2\src\ui-engine\component-generator.ts in full.
    Create C:\Users\manag\Documents\forge-2\src\ui-engine\accessibility-checker.ts. Minimum 200 lines.
    Export interface AccessibilityIssue { severity: 'error'|'warning', rule: string, description: string, fix: string, element?: string }.
    Export interface AccessibilityReport { filePath: string, issues: AccessibilityIssue[], score: number, passed: boolean }.
    Export function checkComponentAccessibility(filePath: string, code: string): AccessibilityReport.
    Implementation checks for: missing aria-label on interactive elements (buttons without text content, icon-only buttons), missing alt on img elements, missing htmlFor on label elements, onClick handlers on non-interactive elements (div, span), missing role on custom interactive elements, color contrast (flags hardcoded color values that may fail contrast), keyboard navigation (onKeyDown handlers missing when onClick present on non-button elements), form fields missing associated labels, dialog missing aria-labelledby.
    Each issue includes a specific fix suggestion.
    Score = 100 - (errors * 10) - (warnings * 3) clamped 0-100.
    passed = score >= 70 and zero errors.
    Export function checkProjectAccessibility(projectPath: string): Promise<AccessibilityReport[]> — scans all src/components/**/*.tsx files.
    Wire into Sentinel gate: add accessibility check as optional gate for component prompt types.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): AccessibilityChecker WCAG 2.1 AA validation'
  gates:
  - type: compile


    design_artifacts (id TEXT PRIMARY KEY, build_run_id TEXT NOT NULL, prompt_id TEXT NOT NULL, component_name TEXT NOT NULL, description TEXT NOT NULL, generated_code TEXT NOT NULL, framework TEXT NOT NULL DEFAULT 'react', styling TEXT NOT NULL DEFAULT 'tailwind', file_path TEXT, applied INTEGER NOT NULL DEFAULT 0, created_at TEXT NOT NULL).
    Add design_artifacts to ALL_FORGE_TABLES.

    Read C:\Users\manag\Documents\forge-2\src\ui-engine\accessibility-checker.ts in full.
    In phase3-executor.ts make these additions:
    1) Before the first prompt of every build run: call ensureDesignTokens(projectPath) to ensure design tokens are configured. Log [UI ENGINE] Design tokens configured.
    2) For every prompt with prompt_type containing component, page, or ui: call detectRequiredComponents(prompt.text) and ensureComponentsInstalled(projectPath, required). Log [UI ENGINE] Installed {n} shadcn components: {list}.
    3) After every prompt that passes all Sentinel gates and prompt_type is component or page: call checkComponentAccessibility on each modified .tsx file. If any accessibility errors found: log [UI ENGINE] ACCESSIBILITY: {n} issues found in {file} and add to build report. Do not fail the build — warn only.
    4) Add accessibility issue count to the per-prompt summary line.
    Run pnpm run build in C:\Users\manag\Documents\forge-2 confirm 0 TypeScript errors.
    Commit: git add -A; git commit -m 'feat(ui-engine): UI engine wired into Phase 3 for automatic enhancement'
  gates:
  - type: compile


  - id: f3f-010
    phase: build
    description: "Create cross-client dedup, domain-level throttling, and velocity controls"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\submission-controls.ts:

      Export class SubmissionControls with:

      async checkCrossClientDedup(funderDomain: string, orgId: string, supabase: any): Promise<{ blocked: boolean, reason?: string, delayUntil?: Date }>
      - Hash the orgId (SHA-256) for anonymization.
      - Query cross_client_submissions WHERE funder_domain = domain AND submitted_at > NOW() - INTERVAL '7 days' AND org_hash != hashedOrgId.
      - If recent submission from another client exists: return blocked=true, suggest delay of 7 days.
      - After successful submission, insert into cross_client_submissions.

      async checkDomainThrottle(portalUrl: string, supabase: any): Promise<{ blocked: boolean, reason?: string }>
      - Extract domain from portal URL.
      - Query autoapply_submissions WHERE giving_portal_url domain matches AND submitted_at > NOW() - INTERVAL '2 hours'.
      - If submissions to same domain in last 2 hours >= 3: block (Benevity/CyberGrants protection).
      - Known shared platforms: ['benevity.com', 'cybergrants.com', 'yourcause.com', 'smartsimple.com', 'submittable.com', 'fluxx.io', 'grantinterface.com'].
      - Stricter limit for known shared platforms: max 2 per 4 hours.

      async checkVelocityLimits(orgId: string, supabase: any): Promise<{ blocked: boolean, reason?: string, dailyCount: number, dailyLimit: number }>

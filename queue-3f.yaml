  - id: f3f-004
    phase: build
    description: "Create multi-page form handler with dynamic field and complex input support"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\form-analyzer-agent.ts completely.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\form-filler-agent.ts completely.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\multi-page-handler.ts:

      Export class MultiPageFormHandler with:

      async detectMultiPage(page: any): Promise<{ isMultiPage: boolean, pageCount?: number, currentPage?: number, nextButton?: string, progressIndicator?: string }>
      - Look for: "Next", "Continue", "Step X of Y", progress bars, pagination dots, wizard navigation.
      - Check for form[data-step], .wizard-step, .form-step, multi-section with visibility toggles.
      - Use Claude if ambiguous: "Is this a multi-page form? How many pages? What is the next button selector?"

      async navigateToNextPage(page: any, nextButtonSelector: string): Promise<boolean>
      - Click the next/continue button.
      - Wait for page transition or new fields to appear (waitForSelector or waitForNavigation).
      - Handle per-page validation errors: if clicking next doesn't advance, return false (validation failed).
      - Return true on successful navigation.

      async getAllPages(page: any): Promise<FormPage[]>
      - Navigate through all pages, collecting fields from each.
      - Return array of FormPage objects: { pageNumber, fields, nextButtonSelector }.
      - Navigate back to page 1 when done (if possible) or note that it's forward-only.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\advanced-field-handler.ts:

      Export class AdvancedFieldHandler with methods for each complex input type:

      async fillSelect(page: any, selector: string, value: string): Promise<boolean>
      - Handle <select> dropdowns: page.selectOption(selector, value).
      - If value not in options, find closest match using string similarity.

      async fillCheckbox(page: any, selector: string, shouldCheck: boolean): Promise<void>
      - Check/uncheck: if current state differs from shouldCheck, click it.

      async fillRadio(page: any, name: string, value: string): Promise<void>
      - Find radio group by name, click the option matching value.

      async fillDatePicker(page: any, selector: string, date: string): Promise<boolean>
      - Try direct input first (type the date string).
      - If that fails, try clicking the picker and navigating the calendar widget.
      - Handle common date picker libraries: flatpickr, pikaday, jQuery UI datepicker.

      async fillFileUpload(page: any, selector: string, filePath: string): Promise<boolean>
      - Use page.setInputFiles(selector, filePath) for standard file inputs.
      - Handle drag-and-drop zones by finding the underlying input.

      async handleConditionalFields(page: any): Promise<void>
      - After filling a select/radio that might trigger conditional fields, wait 1 second for DOM changes.
      - Re-analyze the visible fields.

      async acceptTerms(page: any): Promise<boolean>
      - Find terms/conditions checkbox: [name*="terms"], [name*="agree"], [id*="terms"], [id*="agree"], label containing "I agree", "I accept", "terms and conditions".
      - Check it. Return true if found and checked, false if not found.

      async handleSessionTimeout(page: any): Promise<boolean>
      - Detect timeout indicators: "session expired", "timed out", login redirect.
      - If detected, return false so the caller can restart the session.

      These classes are utilities imported by FormAnalyzerAgent and FormFillerAgent.
    expected_outputs:
      - src/lib/autoapply/multi-page-handler.ts
      - src/lib/autoapply/advanced-field-handler.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: f3f-005
    phase: build
    description: "Create document attachment system for form file uploads"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\document-vault.ts.
      Read C:\Users\manag\Documents\benavora\src\lib\autoapply\advanced-field-handler.ts.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\document-attacher.ts:

      Export class DocumentAttacher with:

      async detectUploadFields(page: any): Promise<UploadField[]>
      - Find all file input elements: input[type="file"], .file-upload, .dropzone, [data-upload].
      - For each, use Claude to classify what document type it expects based on: the field label, nearby text, placeholder, accept attribute.
      - Return: { selector, label, expectedDocType, acceptedFormats, required }

      async matchDocumentsToFields(uploadFields: UploadField[], orgDocuments: OrgDocument[]): Promise<DocumentMatch[]>
      - For each upload field, find the best matching org document:
        - "501(c)(3)" label → match to '501c3_letter' document
        - "990" or "tax return" label → match to 'form_990'
        - "board" label → match to 'board_list'
        - "budget" label → match to 'project_budget'
        - "financial" label → match to 'financial_statements'
        - Use Claude for ambiguous matches: "This upload field is labeled '{label}'. Which of these document types is the best match: {available types}?"
      - Return: { field, matchedDocument, confidence }
      - If no match found, flag as 'unmatched' for human review.

      async attachDocuments(page: any, matches: DocumentMatch[], vault: DocumentVault): Promise<AttachmentResult[]>
      - For each match with a document:
        1. Download the document from Supabase Storage via vault.getDocumentBuffer()
        2. Save to a temp file
        3. Use advancedFieldHandler.fillFileUpload() to attach
        4. Clean up temp file
      - Return results: { fieldLabel, documentName, success, error? }
      - Log: "Attached {docName} to field '{label}'"

      async getUnmatchedFields(uploadFields: UploadField[], matches: DocumentMatch[]): Promise<UploadField[]>
      - Return fields that had no matching document — these may need human intervention.

      Define interfaces: UploadField, DocumentMatch, AttachmentResult, OrgDocument.
    expected_outputs:
      - src/lib/autoapply/document-attacher.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: f3f-006
    phase: build
    description: "Create form validation, org readiness assessment, and anti-duplicate detection"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\submission-validator.ts:

      Export class SubmissionValidator with:

      async validateFormData(formFields: FormField[], fieldValues: Record<string, string>, orgData: any): Promise<ValidationResult>
      - For each required field, check if a value exists and is non-empty.
      - Validate specific formats:
        - EIN: must match XX-XXXXXXX pattern
        - Phone: must be 10+ digits
        - Email: must contain @ and .
        - URL: must start with http:// or https://
        - ZIP: must be 5 or 9 digits
        - Date: must be valid date format
      - Return: { valid: boolean, errors: { field, message }[], warnings: { field, message }[] }

      async checkOrgReadiness(orgId: string, supabase: any): Promise<ReadinessReport>
      - Check KB completeness: mission (required), ein (required), address (required), contact_name (required), contact_email (required), phone (recommended), programs (recommended).
      - Check document vault: 501c3_letter (required), form_990 (required), board_list (recommended).
      - Check for active request profiles (at least one required for AutoApply).
      - Return: { ready: boolean, score: number (0-100), missing_required: string[], missing_recommended: string[], blockers: string[] }
      - ready = false if ANY required item is missing.

      async detectExistingSubmission(page: any): Promise<{ hasPending: boolean, message?: string }>
      - After page loads, use Claude to check if the page shows any indication of an existing pending request:
        "You have a pending request", "Already submitted", "Your application is under review"
      - Return whether a pending submission was detected.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\confirmation-parser.ts:

      Export async function parseConfirmationPage(page: any): Promise<ConfirmationData>
      - Take a screenshot for reference.
      - Extract page text content.
      - Use Claude to parse: "Extract the following from this confirmation page text. Return JSON: { confirmation_number, reference_id, expected_response_date, next_steps, thank_you_message, contact_for_questions }. If any field is not found, set it to null."
      - Return structured ConfirmationData.

      Define all interfaces: ValidationResult, ReadinessReport, ConfirmationData.
    expected_outputs:
      - src/lib/autoapply/submission-validator.ts
      - src/lib/autoapply/confirmation-parser.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  - id: f3f-007
    phase: build
    description: "Create funder capability matching engine"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md section 2C (Funder Capability Matching) completely.

      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\funder-matcher.ts:

      Export function matchFunderToProfiles(funder: FunderForMatching, profiles: RequestProfile[]): MatchResult[]

      Score each (funder, profile) pair from 0.0 to 1.0:

      1. Category match (0-0.4):
         - funder.category in profile.target_funder_categories: +0.4
         - Partial/related match: +0.2

      2. Type alignment (0-0.3) — capability map:
         - real_estate, construction, land_trust → land, facility: +0.3
         - construction, building_supply, hardware → in_kind: +0.3
         - law_firm, accounting, consulting → service: +0.3
         - foundation, corporate_giving, community_foundation → monetary: +0.3
         - retail, wholesale, manufacturing → in_kind: +0.3
         - church, community_group, civic → volunteer, monetary: +0.3
         - Any → sponsorship: +0.2

      3. Geographic alignment (0-0.2):
         - Profile has geographic_requirements AND funder matches: +0.2
         - No geographic requirement: +0.1

      4. Historical success (0-0.1):
         - Previous successful submission to this funder with same type: +0.1

      Filter scores below 0.3. Return sorted descending.

      Export function getBestProfile(funder: FunderForMatching, profiles: RequestProfile[]): MatchResult | null

      Define interfaces: FunderForMatching (category, type, state, city, id, name), RequestProfile, MatchResult (profileId, profileName, requestType, score, matchReasons).
    expected_outputs:
      - src/lib/autoapply/funder-matcher.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt


prompts:

  # ============================================================
  # PHASE 3F: COMPREHENSIVE SUBMISSION INTELLIGENCE
  # Every gap, every missing component, every enterprise requirement
  # Reference: AUTOAPPLY_ARCHITECTURE_V2.md
  # ============================================================

  - id: f3f-001
    phase: build
    description: "Create all Phase 3F database tables in a single migration"
    prompt: |
      Read AUTOAPPLY_ARCHITECTURE_V2.md sections 2A through 2D and 6A completely.

      Create C:\Users\manag\Documents\benavora\supabase\migrations\051_submission_intelligence.sql:

      -- Request profiles for multi-type submissions
      CREATE TABLE IF NOT EXISTS request_profiles (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        name text NOT NULL,
        request_type text NOT NULL,
        priority integer NOT NULL DEFAULT 100,
        active boolean NOT NULL DEFAULT true,
        needs_description text NOT NULL,
        specific_requirements jsonb DEFAULT '{}',
        target_funder_categories text[],
        target_funder_types text[],
        pitch_template text,
        form_field_overrides jsonb DEFAULT '{}',
        success_criteria text,
        min_value numeric(12,2),
        max_value numeric(12,2),
        value_unit text DEFAULT 'usd',
        geographic_requirements jsonb,
        created_at timestamptz DEFAULT NOW(),
        updated_at timestamptz DEFAULT NOW()
      );

      -- Extended KB for non-monetary needs
      CREATE TABLE IF NOT EXISTS kb_extended_needs (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        request_profile_id uuid REFERENCES request_profiles(id) ON DELETE CASCADE,
        need_type text NOT NULL,
        details jsonb NOT NULL,
        created_at timestamptz DEFAULT NOW()
      );

      -- Pitch cache
      CREATE TABLE IF NOT EXISTS pitch_cache (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL,
        funder_id uuid NOT NULL,
        request_profile_id uuid REFERENCES request_profiles(id) ON DELETE SET NULL,
        personalized_pitch text NOT NULL,
        pitch_hash text NOT NULL,
        created_at timestamptz DEFAULT NOW(),
        expires_at timestamptz DEFAULT NOW() + INTERVAL '30 days',
        UNIQUE(organization_id, funder_id, request_profile_id)
      );

      -- Organization document vault for form attachments
      CREATE TABLE IF NOT EXISTS org_documents (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        document_type text NOT NULL,
        display_name text NOT NULL,
        storage_path text NOT NULL,
        file_name text NOT NULL,
        file_size integer,
        mime_type text,
        is_current boolean NOT NULL DEFAULT true,
        expires_at timestamptz,
        uploaded_by uuid,
        created_at timestamptz DEFAULT NOW()
      );

      -- Submission receipts
      CREATE TABLE IF NOT EXISTS submission_receipts (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id) ON DELETE CASCADE,
        organization_id uuid NOT NULL,
        receipt_pdf_path text,
        receipt_data jsonb NOT NULL,
        generated_at timestamptz DEFAULT NOW()
      );

      -- Grant agreements (post-award tracking)
      CREATE TABLE IF NOT EXISTS grant_agreements (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        submission_id uuid REFERENCES autoapply_submissions(id),
        organization_id uuid NOT NULL REFERENCES organizations(id),
        funder_id uuid NOT NULL REFERENCES funders(id),
        amount_awarded numeric(12,2),
        award_type text,
        agreement_date timestamptz,
        start_date timestamptz,
        end_date timestamptz,
        terms text,
        reporting_requirements jsonb,
        payment_schedule jsonb,
        status text NOT NULL DEFAULT 'pending',
        notes text,
        created_at timestamptz DEFAULT NOW()
      );

      -- Webhook notification configs
      CREATE TABLE IF NOT EXISTS webhook_configs (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        webhook_type text NOT NULL DEFAULT 'slack',
        webhook_url text NOT NULL,
        events text[] NOT NULL DEFAULT '{submission_completed,submission_failed}',
        active boolean NOT NULL DEFAULT true,
        created_at timestamptz DEFAULT NOW()
      );

      -- Cross-client submission tracking (anonymized)
      CREATE TABLE IF NOT EXISTS cross_client_submissions (
        id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
        funder_domain text NOT NULL,
        submitted_at timestamptz NOT NULL DEFAULT NOW(),
        org_hash text NOT NULL
      );

      -- Add columns to existing tables
      ALTER TABLE submission_queue ADD COLUMN IF NOT EXISTS request_profile_id uuid REFERENCES request_profiles(id);
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS request_profile_id uuid REFERENCES request_profiles(id);
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS submission_channel text DEFAULT 'web_form';
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS personalized_pitch text;
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS optimized_amount numeric(12,2);
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS timing_score numeric(3,2);
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS confirmation_data jsonb;
      ALTER TABLE autoapply_submissions ADD COLUMN IF NOT EXISTS documents_attached text[];

      -- Indexes
      CREATE INDEX IF NOT EXISTS idx_request_profiles_org ON request_profiles(organization_id, active);
      CREATE INDEX IF NOT EXISTS idx_pitch_cache_lookup ON pitch_cache(organization_id, funder_id, request_profile_id);
      CREATE INDEX IF NOT EXISTS idx_org_documents_type ON org_documents(organization_id, document_type, is_current);
      CREATE INDEX IF NOT EXISTS idx_cross_client_domain ON cross_client_submissions(funder_domain, submitted_at DESC);

      NOTE: Migration 051 must be applied manually via Supabase SQL Editor.
    expected_outputs:
      - supabase/migrations/051_submission_intelligence.sql
    gates:
      - type: file_exists
        files: [supabase/migrations/051_submission_intelligence.sql]
    max_retries: 3
    on_fail: halt

  - id: f3f-002
    phase: build
    description: "Create org document vault with upload API and storage integration"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\autoapply\document-vault.ts:

      Export class DocumentVault with:

      Standard document types (enum/const):
      - '501c3_letter': IRS 501(c)(3) determination letter
      - 'form_990': Latest IRS Form 990
      - 'board_list': Current board of directors list
      - 'project_budget': Project/program budget
      - 'financial_statements': Audited financial statements
      - 'annual_report': Latest annual report
      - 'organizational_chart': Org chart
      - 'letters_of_support': Letters of support/partnership
      - 'insurance_certificate': Certificate of insurance
      - 'other': Miscellaneous document

      async uploadDocument(params: { orgId, documentType, file: Buffer, fileName, mimeType, uploadedBy?, expiresAt? }): Promise<string>
      - Upload to Supabase Storage bucket 'org-documents' at path: {orgId}/{documentType}/{fileName}
      - If a current document of this type exists, set is_current = false on the old one.
      - Insert into org_documents with is_current = true.
      - Return the document ID.

      async getDocument(orgId: string, documentType: string): Promise<OrgDocument | null>
      - Fetch the current (is_current = true) document of the given type.
      - Return null if none exists.

      async getDocumentBuffer(storagePath: string): Promise<Buffer>
      - Download the file from Supabase Storage and return the buffer.

      async getAllDocuments(orgId: string): Promise<OrgDocument[]>
      - Return all current documents for the org.

      async getReadinessReport(orgId: string): Promise<{ ready: boolean, missing: string[], expired: string[], score: number }>
      - Check which standard document types exist for this org.
      - Flag missing required docs: 501c3_letter, form_990 are required.
      - Flag expired docs (expires_at < NOW()).
      - Score: (docs present / total standard types) * 100.
      - ready = true if 501c3_letter AND form_990 exist and are not expired.

      Create C:\Users\manag\Documents\benavora\src\app\api\autoapply\documents\route.ts:
      GET: return all current documents for the org.
      POST: accept multipart form upload, call vault.uploadDocument.

      Create C:\Users\manag\Documents\benavora\src\app\api\autoapply\documents\readiness\route.ts:
      GET: return readiness report for the org.
    expected_outputs:
      - src/lib/autoapply/document-vault.ts
      - src/app/api/autoapply/documents/route.ts
      - src/app/api/autoapply/documents/readiness/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


    \ maturity_stage IS NULL),\n      first_pass_rate REAL, machine_id TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now'))\n    );\n\n    CREATE TABLE IF NOT EXISTS skill_library (\n     \

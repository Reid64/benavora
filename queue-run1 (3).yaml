    \ value) VALUES ('created_at', datetime('now'));\n\n    CREATE TABLE IF NOT EXISTS prompt_scores (\n      id TEXT PRIMARY KEY, prompt_template_hash TEXT NOT NULL,\n      task_type TEXT NOT NULL CHECK(task_type\
    \ IN ('SCAFFOLD','CRUD','INTEGRATION','AI_PIPELINE','CONFIG','TEST','FIX')),\n      tech_stack_tags TEXT NOT NULL DEFAULT '[]', first_pass_success INTEGER NOT NULL CHECK(first_pass_success IN (0, 1)),\n\
    \      retry_count INTEGER NOT NULL DEFAULT 0, tokens_consumed INTEGER NOT NULL DEFAULT 0,\n      gate_pass_rate REAL NOT NULL DEFAULT 0.0, drift_score REAL NOT NULL DEFAULT 0.0,\n      project_name\
    \ TEXT NOT NULL, build_id TEXT NOT NULL, machine_id TEXT NOT NULL,\n      created_at TEXT NOT NULL DEFAULT (datetime('now'))\n    );\n    CREATE INDEX IF NOT EXISTS idx_prompt_scores_task_type ON prompt_scores(task_type);\n\
    \    CREATE INDEX IF NOT EXISTS idx_prompt_scores_template_hash ON prompt_scores(prompt_template_hash);\n    CREATE INDEX IF NOT EXISTS idx_prompt_scores_project ON prompt_scores(project_name);\n  \
    \  CREATE INDEX IF NOT EXISTS idx_prompt_scores_created ON prompt_scores(created_at);\n\n    CREATE TABLE IF NOT EXISTS fix_patterns (\n      id TEXT PRIMARY KEY, error_fingerprint TEXT NOT NULL, error_message\
    \ TEXT NOT NULL,\n      error_category TEXT NOT NULL CHECK(error_category IN ('COMPILE','RUNTIME','TEST','LINT','SECURITY','SCHEMA','DEPLOY')),\n      file_path_pattern TEXT NOT NULL, fix_diff TEXT,\
    \ fix_description TEXT,\n      fix_files_modified TEXT DEFAULT '[]', tech_stack_tags TEXT NOT NULL DEFAULT '[]',\n      occurrence_count INTEGER NOT NULL DEFAULT 1, success_rate REAL NOT NULL DEFAULT\
    \ 0.0,\n      times_fix_applied INTEGER NOT NULL DEFAULT 0, times_fix_succeeded INTEGER NOT NULL DEFAULT 0,\n      auto_governance_rule TEXT, governance_rule_id TEXT,\n      last_seen TEXT NOT NULL\
    \ DEFAULT (datetime('now')), machine_id TEXT NOT NULL,\n      created_at TEXT NOT NULL DEFAULT (datetime('now'))\n    );\n    CREATE UNIQUE INDEX IF NOT EXISTS idx_fix_patterns_fingerprint ON fix_patterns(error_fingerprint);\n\
    \    CREATE INDEX IF NOT EXISTS idx_fix_patterns_category ON fix_patterns(error_category);\n\n    CREATE TABLE IF NOT EXISTS decision_weights (\n      id TEXT PRIMARY KEY, decision_type TEXT NOT NULL,\
    \ option_chosen TEXT NOT NULL,\n      downstream_error_rate REAL NOT NULL DEFAULT 0.0, downstream_retry_rate REAL NOT NULL DEFAULT 0.0,\n      downstream_prompts INTEGER NOT NULL DEFAULT 0, downstream_errors\

    \      start_time TEXT NOT NULL, end_time TEXT,\n      end_reason TEXT CHECK(end_reason IN ('COMPLETED','PAUSED','FAILED','INTERRUPTED') OR end_reason IS NULL),\n      total_prompts_planned INTEGER\
    \ NOT NULL DEFAULT 0, total_prompts_executed INTEGER NOT NULL DEFAULT 0,\n      prompts_passed INTEGER NOT NULL DEFAULT 0, prompts_retried INTEGER NOT NULL DEFAULT 0,\n      prompts_failed INTEGER NOT\

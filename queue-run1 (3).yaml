    \ TABLE IF NOT EXISTS pending_evolutions (\n      id TEXT PRIMARY KEY,\n      evolution_type TEXT NOT NULL CHECK(evolution_type IN ('HOOK','TEMPLATE','RULE','THRESHOLD','CONFIG','GATE')),\n      proposed_change\
    \ TEXT NOT NULL, change_detail TEXT NOT NULL, evidence TEXT NOT NULL,\n      estimated_impact TEXT NOT NULL, confidence REAL NOT NULL CHECK(confidence >= 0.0 AND confidence <= 1.0),\n      status TEXT\

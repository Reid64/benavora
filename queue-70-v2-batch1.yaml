project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - PAGE_TREATMENT_PROTOCOL_V2.md
  - DESIGN_SYSTEM_V2_ASSIGNMENT.md
  - FEATURE_REGISTRY_v2.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

prompts:

  - id: cleanup-stray-processes-001
    phase: build
    description: "Kill any stray node processes before starting the overnight run"
    prompt: |
      Before any real work: check for and terminate any existing node.exe processes that are not part of this current session (stray dev servers, orphaned builds from earlier sessions). This is a known real risk - leftover processes have caused multi-hour timeout cascades in this project before. Confirm a clean process list before proceeding to the next prompt.
    expected_outputs: []
    gates: [{type: compile}]
    max_retries: 2
    on_fail: continue

  - id: page-dashboard-002
    phase: build
    description: "/dashboard - Gold frame, Navy accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /dashboard. Section: Dashboard/Home. Frame: #B88A2E. Accent: #101B2D. Full verification standard from the protocol required.
    expected_outputs: [src/app/(dashboard)/dashboard/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-research-002
    phase: build
    description: "/research - Bronze frame, Slate Blue accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /research. Section: Research & Discovery. Frame: #A4712C. Accent: #4F6D8F. Full verification standard required.

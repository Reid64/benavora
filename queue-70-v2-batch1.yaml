  - id: batch1v2-verify-sync-001
    phase: build
    description: "Final regression + governance sync for Batch 1 v2 (15 pages)"
    prompt: |
      1. Real Playwright pass across all 15 pages in this batch, confirm each carries its correct section frame/accent, layering with real shadows, zero unintended white values, no broken functionality.
      2. Run pnpm run build and pnpm tsc --noEmit, fix any errors.
      3. Update FEATURE_REGISTRY_v2.md and DESIGN_SYSTEM_V2_ASSIGNMENT.md marking these 15 pages complete under the v2 system.
      4. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md - explicit, honest language on whether all 15 passed clean.
      5. Scoped git add, commit "feat: v2 gold/bronze/navy/stone design system applied to Dashboard, Research & Discovery, and Draft & Automation (batch 1 of 4)", push.
    expected_outputs: [FEATURE_REGISTRY_v2.md, STATE_OF_THE_BUILD.md, SESSION_STATE.md]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

prompts:
  - id: playwright-test-setup
    prompt: |
      Setup Playwright for end-to-end testing.
      
      Install: npm install --save-dev @playwright/test @types/node
      
      File: playwright.config.ts (root)
      
      ```typescript
      import { defineConfig, devices } from '@playwright/test';
      
      export default defineConfig({
        testDir: './tests/e2e',
        testMatch: '**/*.spec.ts',
        fullyParallel: true,
        forbidOnly: !!process.env.CI,
        retries: process.env.CI ? 2 : 0,
        workers: process.env.CI ? 1 : undefined,
        reporter: [
          ['html', { outputFolder: 'playwright-report' }],
          ['json', { outputFile: 'test-results/results.json' }],
          ['junit', { outputFile: 'test-results/junit.xml' }]
        ],
        use: {
          baseURL: process.env.PLAYWRIGHT_TEST_BASE_URL || 'http://localhost:3000',
          trace: 'on-first-retry',
          screenshot: 'only-on-failure'
        },
        webServer: {
          command: 'pnpm dev',
          url: 'http://localhost:3000',
          reuseExistingServer: !process.env.CI
        },
        projects: [
          { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
          { name: 'firefox', use: { ...devices['Desktop Firefox'] } },
          { name: 'webkit', use: { ...devices['Desktop Safari'] } }
        ]
      });
      ```

  - id: playwright-test-auth
    prompt: |
      Create authentication fixture for tests.
      
      File: tests/e2e/fixtures/auth.ts
      
      ```typescript
      import { test as base, Page } from '@playwright/test';
      
      export const test = base.extend<{ authenticatedPage: Page }>({
        authenticatedPage: async ({ page }, use) => {
          // Login
          await page.goto('/login');
          await page.fill('input[name="email"]', 'beta1@benavora-test.com');
          await page.fill('input[name="password"]', 'BetaTest2026');
          await page.click('button[type="submit"]');
          
          // Wait for redirect to dashboard
          await page.waitForURL('/dashboard');
          
          // Store session token
          const sessionToken = await page.context().cookies();
          
          // Use page in tests
          await use(page);
          
          // Cleanup
          await page.context().clearCookies();
        }
      });
      
      export { expect } from '@playwright/test';
      ```

  - id: playwright-critical-user-flows
    prompt: |
      Write critical user flow tests.
      
      File: tests/e2e/critical-flows.spec.ts
      
      ```typescript
      import { test, expect } from './fixtures/auth';
      
      test.describe('Critical User Flows', () => {
        test('Login flow', async ({ page }) => {
          await page.goto('/login');
          expect(await page.isVisible('text=Sign In')).toBeTruthy();
          
          await page.fill('input[name="email"]', 'beta1@benavora-test.com');
          await page.fill('input[name="password"]', 'BetaTest2026');
          await page.click('button[type="submit"]');
          
          await page.waitForURL('/dashboard');
          expect(await page.isVisible('text=Dashboard')).toBeTruthy();
        });
        
        test('Access dashboard and navigate tabs', async ({ authenticatedPage }) => {
          await authenticatedPage.goto('/dashboard');
          expect(await authenticatedPage.isVisible('text=Mission Control')).toBeTruthy();
          
          // Click on Research tab
          await authenticatedPage.click('a:has-text("Research")');
          await authenticatedPage.waitForURL('/dashboard/research');
          
          // Verify research page loaded
          expect(await authenticatedPage.isVisible('text=Research Resources')).toBeTruthy();
        });
        
        test('Create opportunity in knowledge base', async ({ authenticatedPage }) => {
          await authenticatedPage.goto('/dashboard/knowledge-base');
          await authenticatedPage.click('button:has-text("Add Entry")');
          
          await authenticatedPage.fill('input[placeholder="Title"]', 'Test Mission Statement');
          await authenticatedPage.fill('textarea', 'Housing for homeless families...');
          await authenticatedPage.click('button:has-text("Save")');
          
          // Verify success
          expect(await authenticatedPage.isVisible('text=Saved successfully')).toBeTruthy();
        });
        
        test('Discover opportunity and move to pipeline', async ({ authenticatedPage }) => {
          await authenticatedPage.goto('/dashboard/research');
          
          // Assuming opportunities loaded
          await authenticatedPage.waitForSelector('[data-testid="opportunity-card"]');
          const firstOpp = await authenticatedPage.locator('[data-testid="opportunity-card"]').first();
          
          await firstOpp.click();
          await authenticatedPage.waitForURL(/\/dashboard\/opportunities\/*/);
          
          // Click Apply
          await authenticatedPage.click('button:has-text("Apply")');
          await authenticatedPage.waitForURL(/\/applications\/*/);
          
          expect(await authenticatedPage.isVisible('text=Application')).toBeTruthy();
        });
        
        test('AutoApply workflow (if enabled)', async ({ authenticatedPage }) => {
          // Feature flagged test
          await authenticatedPage.goto('/dashboard/autoapply');
          
          const isQueuePresent = await authenticatedPage.isVisible('[data-testid="submission-queue"]');
          if (!isQueuePresent) {
            console.log('AutoApply not enabled for this org');
            return;
          }
          
          // Queue should have items
          const queueItems = await authenticatedPage.locator('[data-testid="queue-item"]').count();
          expect(queueItems).toBeGreaterThan(0);
          
          // Click first item
          await authenticatedPage.locator('[data-testid="queue-item"]').first().click();
          
          // Verify details panel
          expect(await authenticatedPage.isVisible('text=Success Probability')).toBeTruthy();
        });
        
        test('Intelligence dashboard (if PIL enabled)', async ({ authenticatedPage }) => {
          const pilEnabled = await authenticatedPage.isVisible('a:has-text("Intelligence")');
          
          if (!pilEnabled) {
            console.log('PIL not enabled for this org');
            return;
          }
          
          await authenticatedPage.click('a:has-text("Intelligence")');
          await authenticatedPage.waitForURL('/dashboard/intelligence');
          
          // Should see prospect dossiers
          expect(await authenticatedPage.isVisible('text=Prospect Intelligence')).toBeTruthy();
        });
      });
      ```

  - id: playwright-api-tests
    prompt: |
      Write API integration tests.
      
      File: tests/e2e/api.spec.ts
      
      ```typescript
      import { test, expect } from '@playwright/test';
      
      test.describe('API Integration Tests', () => {
        let authToken: string;
        
        test.beforeAll(async () => {
          // Get auth token
          const response = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: 'beta1@benavora-test.com',
              password: 'BetaTest2026'
            })
          });
          
          const data = await response.json();
          authToken = data.token;
        });
        
        test('Health check endpoint', async () => {
          const response = await fetch('http://localhost:3000/api/health');
          expect(response.status).toBe(200);
          
          const health = await response.json();
          expect(health.status).toBe('healthy');
          expect(health.checks.database.status).toBe('ok');
        });
        
        test('Create organization', async () => {
          const response = await fetch('http://localhost:3000/api/organizations', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${authToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: 'Test Nonprofit E2E',
              ein: '12-3456789',
              mission_statement: 'Test mission'
            })
          });
          
          expect(response.status).toBe(201);
          const org = await response.json();
          expect(org.id).toBeDefined();
        });
        
        test('List opportunities', async () => {
          const response = await fetch('http://localhost:3000/api/opportunities', {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          
          expect(response.status).toBe(200);
          const opps = await response.json();
          expect(Array.isArray(opps)).toBeTruthy();
        });
      });
      ```

  - id: github-actions-ci-workflow
    prompt: |
      Create GitHub Actions CI pipeline.
      
      File: .github/workflows/test.yml
      
      ```yaml
      name: Test Suite
      
      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main, develop]
      
      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'pnpm'
            - run: pnpm install
            - run: pnpm lint
            - run: pnpm type-check
        
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'pnpm'
            - run: pnpm install
            - run: pnpm build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build
                path: .next/
        
        test:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: postgres:15
              env:
                POSTGRES_PASSWORD: postgres
              options: >-
                --health-cmd pg_isready
                --health-interval 10s
                --health-timeout 5s
                --health-retries 5
          
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'pnpm'
            - run: pnpm install
            - run: pnpm test
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: test-results/
        
        e2e:
          runs-on: ubuntu-latest
          timeout-minutes: 30
          
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'pnpm'
            
            - run: pnpm install
            - run: pnpm build
            - run: pnpm exec playwright install --with-deps
            
            - name: Run Playwright tests
              run: pnpm exec playwright test
              env:
                PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: playwright-report
                path: playwright-report/
            
            - name: Comment PR with test results
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                script: |
                  const fs = require('fs');
                  const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf-8'));
                  const passed = results.stats.expected;
                  const failed = results.stats.unexpected;
                  
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `✅ E2E Tests: ${passed} passed, ${failed} failed`
                  });
      ```

  - id: local-test-script
    prompt: |
      Create local test runner script.
      
      File: scripts/test-locally.sh
      
      ```bash
      #!/bin/bash
      
      echo "Starting Benavora E2E test suite..."
      
      # 1. Build
      echo "Building..."
      pnpm build
      if [ $? -ne 0 ]; then
        echo "❌ Build failed"
        exit 1
      fi
      
      # 2. Lint & type check
      echo "Linting..."
      pnpm lint
      pnpm type-check
      if [ $? -ne 0 ]; then
        echo "❌ Lint/type check failed"
        exit 1
      fi
      
      # 3. Unit tests
      echo "Running unit tests..."
      pnpm test
      if [ $? -ne 0 ]; then
        echo "❌ Unit tests failed"
        exit 1
      fi
      
      # 4. E2E tests
      echo "Running E2E tests..."
      pnpm exec playwright test
      if [ $? -ne 0 ]; then
        echo "❌ E2E tests failed"
        exit 1
      fi
      
      echo "✅ All tests passed!"
      ```


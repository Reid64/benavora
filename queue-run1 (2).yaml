        }, dbPath) as BuildOutcome[];

        console.log(`[FORGE Learning] Loaded: ${rules.length} rules, ${skills.length} skills, ${fixPatterns.length} fix patterns, ${outcomes.length} outcomes, ${evolutions.length} evolutions`);


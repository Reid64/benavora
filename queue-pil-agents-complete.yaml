# queue-pil-agents-complete.yaml
# 4 sequential prompts (NOT 4 parallel sub-queues): FORGE 1.0's orchestrator (forge.ps1) runs
# prompts in a single sequential loop with no parallel-execution model, so a linear queue is
# what's actually launchable today. True wall-clock parallelism across families would require
# running each family via a separate forge.ps1 invocation against an isolated git worktree.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-str-001
  name: Implement the Strategy family agents BEN-STR-01 through BEN-STR-04
  prompt: "Build the entire Strategy family — src/lib/pil/agents/str/ does not exist yet, create it. This is 4 agents; per the registry (supabase/migrations/155_pil_agent_registry.sql) they are:\n\nBEN-STR-01 \"Prospect Engagement Strategy Agent\" — mission: \"Determine the most appropriate evidence-based engagement strategy for a qualified prospect.\" Autonomy A2. Cadence: on demand, once a prospect reaches TIER_1_PRIORITY/TIER_2_CULTIVATE (i.e. triggered off pil_prospect_opportunities.classification written by BEN-QLF-04). Reads the prospect's qualification dimension scores (from BEN-QLF-04's pil_prospect_opportunities row) plus relationship/timing evidence to recommend an engagement approach (e.g. direct ask vs. cultivation-first vs. event-based). Persist the recommendation somewhere sensible on pil_prospect_opportunities (check its real columns via src/lib/pil/types.ts first — do not invent a column that doesn't exist; if no suitable column exists, extend the table with a new idempotent migration numbered after the current highest in supabase/migrations/). Chain (delegations array): if the qualification's timing_status/BEN-QLF-05-equivalent signal indicates immediate readiness, no delegation needed; if cultivation is indicated, delegate to BEN-STR-03.\n\nBEN-STR-02 \"Best First Ask Agent\" — mission: \"Recommend an appropriate initial ask or engagement objective.\" Autonomy A2. Human boundary: \"H1, final solicitation decision always remains human\" — this agent must NEVER auto-execute or auto-communicate an ask; it only writes a recommendation and (given the H1 boundary) should create a human-review item via createReviewItem() from src/lib/pil/human-review.ts for every recommendation it produces, matching BEN-QLF-04's createReviewItem() usage pattern. Reads capacity/giving-history evidence (same evidence claim types BEN-QLF-04 already reads for givingCapacity/philanthropicPropensity — reuse those, do not reinvent) to recommend an ask range and type (e.g. annual gift vs. major gift vs. planned gift ask).\n\nBEN-STR-03 \"Cultivation Strategy Agent\" — mission: \"Create a multi-step relationship-development plan when immediate solicitation is not appropriate.\" Autonomy A2. Cadence: on demand, when BEN-QLF-05/BEN-STR-01 indicate cultivate_first (BEN-QLF-05 itself doesn't exist yet — this agent should still work when triggered directly with a prospectId, treating an explicit trigger as sufficient signal, and separately also accept being triggered via BEN-STR-01's delegation). Produces an ordered multi-step plan (e.g. array of {step, rationale, suggestedTimingDays} objects) persisted to conclusions in the AgentResult and, if a table exists for tracking multi-step plans (check pil_* migrations — do not invent a new table for this prompt if a close-enough one already exists, e.g. via pil_agent_run_events), record the plan there; otherwise a new idempotent migration for a small pil_cultivation_plans table is acceptable if genuinely nothing fits — justify that choice in a header comment if you take it.\n\nBEN-STR-04 \"Next-Best-Action Agent\" — mission: \"Continuously determine the most valuable next action for each qualified opportunity.\" Autonomy A3. Cadence: continuous, per active pil_prospect_opportunities row. Unlike the other 3 (single-prospect, on-demand), this one should support being invoked either for a single prospectId (context.prospectId set) or in a batch mode over all of an org's open pil_prospect_opportunities rows when no prospectId is given — read how other \"batch sweep\" agents in this codebase handle that dual mode (e.g. BEN-REL-04's periodic batch sweep, or BEN-KNW-02/04's periodic sweep behavior per their registry cadence text) and follow the same convention. It should synthesize across BEN-STR-01/02/03's outputs where available (read the same pil_prospect_opportunities row) plus monitoring events (src/lib/pil/monitoring.ts's getEvents, same as BEN-QLF-04 already uses) to output a single \"next best action\" recommendation per opportunity.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (Agent/AgentContext/AgentResult/DelegationRequest interfaces), src/lib/pil/agents/qlf/BEN-QLF-04.ts (a real, dense, ~290-line implementation — study its shape: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, and a \"delegations\" array in the returned AgentResult used to chain into a follow-on agent — e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications; this delegation-chaining mechanism, not FORGE's own queue-chaining feature, is what \"chain-it pattern\" means in this codebase's own agent architecture — every new agent below must use the same delegations-array mechanism to chain into whichever sibling agent(s) its mission naturally hands off to, per the \"next agent\" hints given per-agent below). Also read src/lib/pil/agents/index.ts in full — every new agent must be imported and added to its AGENT_FACTORIES map, replacing the current implicit NotImplementedAgent fallback for that code.\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) — quoted per-agent below — backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md — those are different, general-purpose governance docs unrelated to PIL agent specs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code below for full behavioral detail beyond the one-line mission text.\n\nTest file: extend src/__tests__/unit/pil-qlf-knw-agents.test.ts (QLF/KNW prompts) — read it in full first to match its existing mocking/setup pattern exactly (it already covers BEN-QLF-04/BEN-KNW-01/02/03, follow the same per-agent describe-block structure for the new ones). For STR and OPS, no existing test file covers those families — create src/__tests__/unit/pil-str-agents.test.ts and src/__tests__/unit/pil-ops-agents.test.ts respectively, matching pil-qlf-knw-agents.test.ts's own setup/mocking pattern (read it first) rather than inventing a new test style.\n\nEvery agent must be a real, substantive implementation matching the ~250-300 line depth of BEN-QLF-04 — real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, not a thin wrapper that just calls Claude and returns its raw text. Where the mission genuinely calls for an LLM call (e.g. drafting a strategy narrative), use the same lazy-init Claude client pattern already established elsewhere in src/lib/pil/ (grep for how other agents call the model, e.g. via context.tools.includes(\"T-MODEL\") + runner.useTool, matching BEN-QLF-04's tryModelTokens() pattern) rather than inventing a new client pattern.\n\nCreate src/__tests__/unit/pil-str-agents.test.ts covering all 4 agents: at least one happy-path test and one edge-case (e.g. missing evidence / prospect not found, matching BEN-QLF-04's own \"completed({}, reason)\" early-return pattern for missing-data cases) per agent.\n\nRegister all 4 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which PIL agent codes this prompt implemented, their AGENT_FACTORIES registration, and updated X/48 PIL agent completion count) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/str/BEN-STR-01.ts
    - src/lib/pil/agents/str/BEN-STR-02.ts
    - src/lib/pil/agents/str/BEN-STR-03.ts
    - src/lib/pil/agents/str/BEN-STR-04.ts
    - src/__tests__/unit/pil-str-agents.test.ts
    - src/lib/pil/agents/index.ts
- id: pil-ops-001
  name: Implement the Operations family agent BEN-OPS-01
  prompt: "Build the Operations & Evaluation & Learning family — src/lib/pil/agents/ops/ does not exist yet, create it. This is a single agent per the registry:\n\nBEN-OPS-01 \"Agent Fleet Performance & Learning Agent\" — mission: \"Continuously evaluate whether the Prospect Intelligence agent fleet is actually improving research outcomes and determine where behaviors, routing, tools, or research strategies should be adjusted.\" Autonomy A1 (registry note: spec's own text says default A1/A2, but the DB CHECK constraint only accepts one value, so A1 is what's stored — this agent must never independently increase its own or another agent's autonomy level, matching its documented human_boundary: \"may recommend but may not independently increase autonomy, change security/privacy policy, modify canonical facts, remove safety controls, or rewrite production governance\"). Cadence: continuous + scheduled evaluation (nightly rollup, weekly deep review).\n\nImplementation: query pil_agent_runs (status, tokens_consumed, cost_usd, error, started_at/completed_at) and pil_agent_run_events (event_type IN escalation/budget_warning/stop_condition_met especially) across an org's recent history (e.g. last 7 days for the nightly rollup, last 30 for weekly deep review — read context for which mode is requested, default to nightly if unspecified) to compute per-agent-code health metrics: run count, failure rate, average cost, average tokens, count of escalations. Flag agent codes with anomalously high failure rate or cost relative to the fleet average. Because this agent may ONLY recommend (never apply) changes, its output must be a structured set of recommendations (e.g. {agentCode, issue, recommendation, severity}[]) written to conclusions in the AgentResult and, since any resulting change would be consequential, create a human-review item via createReviewItem() (src/lib/pil/human-review.ts) summarizing the findings whenever it identifies at least one agent above a failure-rate or cost threshold you define and document (pick reasonable, documented defaults — e.g. failure rate > 20% or cost more than 3x the fleet median — do not leave these as unexplained magic numbers).\n\nDo NOT have this agent write to pil_agent_registry, pil_feature_flags, or any other config table that would constitute \"independently\" changing behavior — that would violate its own documented human_boundary. If you find src/lib/pil/agents/sup/BEN-SUP-07.ts (Autonomy Governor Agent) already reads pil_feature_flags, read it to understand the actual autonomy-governance flow in this codebase and make sure BEN-OPS-01's recommendations are the kind of input a human or BEN-SUP-07 would act on, not something BEN-OPS-01 applies itself.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (Agent/AgentContext/AgentResult/DelegationRequest interfaces), src/lib/pil/agents/qlf/BEN-QLF-04.ts (a real, dense, ~290-line implementation — study its shape: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, and a \"delegations\" array in the returned AgentResult used to chain into a follow-on agent — e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications; this delegation-chaining mechanism, not FORGE's own queue-chaining feature, is what \"chain-it pattern\" means in this codebase's own agent architecture — every new agent below must use the same delegations-array mechanism to chain into whichever sibling agent(s) its mission naturally hands off to, per the \"next agent\" hints given per-agent below). Also read src/lib/pil/agents/index.ts in full — every new agent must be imported and added to its AGENT_FACTORIES map, replacing the current implicit NotImplementedAgent fallback for that code.\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) — quoted per-agent below — backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md — those are different, general-purpose governance docs unrelated to PIL agent specs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code below for full behavioral detail beyond the one-line mission text.\n\nTest file: extend src/__tests__/unit/pil-qlf-knw-agents.test.ts (QLF/KNW prompts) — read it in full first to match its existing mocking/setup pattern exactly (it already covers BEN-QLF-04/BEN-KNW-01/02/03, follow the same per-agent describe-block structure for the new ones). For STR and OPS, no existing test file covers those families — create src/__tests__/unit/pil-str-agents.test.ts and src/__tests__/unit/pil-ops-agents.test.ts respectively, matching pil-qlf-knw-agents.test.ts's own setup/mocking pattern (read it first) rather than inventing a new test style.\n\nEvery agent must be a real, substantive implementation matching the ~250-300 line depth of BEN-QLF-04 — real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, not a thin wrapper that just calls Claude and returns its raw text. Where the mission genuinely calls for an LLM call (e.g. drafting a strategy narrative), use the same lazy-init Claude client pattern already established elsewhere in src/lib/pil/ (grep for how other agents call the model, e.g. via context.tools.includes(\"T-MODEL\") + runner.useTool, matching BEN-QLF-04's tryModelTokens() pattern) rather than inventing a new client pattern.\n\nCreate src/__tests__/unit/pil-ops-agents.test.ts covering: a nightly-rollup happy path, a weekly-deep-review happy path, and an edge case with zero runs in the window (must not crash, must return a valid empty-ish report).\n\nRegister BEN-OPS-01 in src/lib/pil/agents/index.ts's imports and AGENT_FACTORIES map.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which PIL agent codes this prompt implemented, their AGENT_FACTORIES registration, and updated X/48 PIL agent completion count) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."

- id: pil-knw-001
  name: Implement the remaining Knowledge Integrity agent BEN-KNW-04
  prompt: "Build the last Knowledge Integrity agent — src/lib/pil/agents/knw/ already exists with BEN-KNW-01/02/03.ts (read all 3 in full; BEN-KNW-03 \"Evidence & Provenance Verification Agent\" is the closest sibling in spirit since both deal with evidence-quality signals, but BEN-KNW-04 has a distinct mission — do not just clone BEN-KNW-03).\n\nBEN-KNW-04 \"Contradiction & Freshness Investigator\" — mission: \"Detect conflicting or outdated prospect information and determine what should remain canonical.\" Autonomy A3. Cadence: continuous (triggered on any two pil_evidence rows for the same claim_type/entity with divergent values) + periodic staleness sweep.\n\nTwo distinct responsibilities, both required:\n1. Contradiction detection: query pil_evidence (read src/lib/pil/evidence.ts's getEvidence() and the pil_evidence schema/migration in full first) for a prospect, group by claim_type, and detect divergent values within the same claim_type (e.g. two different wealth_capacity estimates, or two different employment records that conflict). Check whether a pil_contradictions table already exists (migration 155's backfill section references pil_contradictions.investigated_by_agent_id, so it should — read that table's real schema via its own CREATE TABLE migration) and write detected contradictions there, matching its existing schema exactly (do not assume column names, read the migration).\n2. Freshness/staleness sweep: identify pil_evidence rows past a reasonable staleness threshold for their claim_type (e.g. employment/board-membership claims go stale faster than historical-education claims — define per-claim-type staleness windows and document your reasoning for the specific day counts you choose) and flag them (verification_status already has a 'stale' value per BEN-QLF-04's own VERIFICATION_WEIGHT map — use the same enum value, do not invent a new status).\n\nFor both responsibilities, this agent determines what \"should remain canonical\" per its mission — when two pieces of evidence conflict, it must pick one as canonical (e.g. higher verification_status weight, more recent, or more corroborated) and document the reasoning in its output, not just flag the conflict and stop. High-impact canonical-designation changes (e.g. a change that would affect a prospect's tier classification) should route through createReviewItem() the same way BEN-QLF-04 does for high-impact outcomes.\n\nSupport both single-prospect (context.prospectId set, triggered by the \"any two divergent pil_evidence rows\" condition) and org-wide batch sweep modes (no prospectId, for the periodic staleness sweep), same dual-mode convention referenced in this queue's STR-04 prompt.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (Agent/AgentContext/AgentResult/DelegationRequest interfaces), src/lib/pil/agents/qlf/BEN-QLF-04.ts (a real, dense, ~290-line implementation — study its shape: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, and a \"delegations\" array in the returned AgentResult used to chain into a follow-on agent — e.g. BEN-QLF-04 delegates to BEN-SUP-05 for critic review on high-impact classifications; this delegation-chaining mechanism, not FORGE's own queue-chaining feature, is what \"chain-it pattern\" means in this codebase's own agent architecture — every new agent below must use the same delegations-array mechanism to chain into whichever sibling agent(s) its mission naturally hands off to, per the \"next agent\" hints given per-agent below). Also read src/lib/pil/agents/index.ts in full — every new agent must be imported and added to its AGENT_FACTORIES map, replacing the current implicit NotI
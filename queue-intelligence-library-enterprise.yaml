    Currently /intelligence-library/[category] pages are blank. Fix the routing:
    The category links should NOT navigate to separate pages. They should set the NTEE filter on the main library page.
    Change all category links to: onClick(() => setNteeFilter('O')) etc. instead of href navigation.

  name: Intelligence Library UI complete rebuild -- enterprise grade
  prompt: |
    Read src/app/(dashboard)/intelligence-library/page.tsx in FULL. Every line.
    Read src/app/api/intelligence/proposals/route.ts in FULL.
    Read src/app/(dashboard)/dashboard/page.tsx first 30 lines for color tokens.

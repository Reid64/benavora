- id: intel-lib-001
  name: Governance sync and Intelligence Library schema upgrade
  prompt: |
    First sync governance docs: $repo = 'C:\Users\manag\Documents\benavora'; $forge = 'C:\Users\manag\Documents\FORGE\projects\benavora'; Get-ChildItem $repo -Filter '*.md' | ForEach-Object { Copy-Item $_.FullName (Join-Path $forge $_.Name) -Force }

    Read src/app/(dashboard)/intelligence-library/page.tsx in FULL. Every line.
    Read src/app/api/intelligence/proposals/route.ts in FULL.
    Read src/supabase/migrations/048_grant_intelligence.sql in FULL.
    Read src/lib/intelligence/evaluation-library.ts in FULL.

    STEP 1 — SCHEMA AUDIT: Run this query and report results:
    SELECT column_name, data_type FROM information_schema.columns WHERE table_name='intelligence_funded_proposals' ORDER BY ordinal_position;

    STEP 2 — SCHEMA UPGRADE: Apply these columns via Supabase SQL editor at https://supabase.com/dashboard/project/vbjplpquqxxfbpazyalt/sql/new
    Generate and display this SQL for the user to run:

    ALTER TABLE intelligence_funded_proposals
      ADD COLUMN IF NOT EXISTS funder_type text DEFAULT 'foundation',
      ADD COLUMN IF NOT EXISTS funder_category text,
      ADD COLUMN IF NOT EXISTS ntee_major text,
      ADD COLUMN IF NOT EXISTS ntee_code text,
      ADD COLUMN IF NOT EXISTS success_factors jsonb DEFAULT '[]',
      ADD COLUMN IF NOT EXISTS keywords jsonb DEFAULT '[]',
      ADD COLUMN IF NOT EXISTS persuasive_elements jsonb DEFAULT '[]',
      ADD COLUMN IF NOT EXISTS winning_phrases jsonb DEFAULT '[]',
      ADD COLUMN IF NOT EXISTS theory_of_change text,
      ADD COLUMN IF NOT EXISTS evaluation_approach text,
      ADD COLUMN IF NOT EXISTS budget_structure jsonb DEFAULT '{}',
      ADD COLUMN IF NOT EXISTS geographic_scope text DEFAULT 'local',
      ADD COLUMN IF NOT EXISTS org_size_category text,
      ADD COLUMN IF NOT EXISTS submission_timing jsonb DEFAULT '{}',
      ADD COLUMN IF NOT EXISTS application_word_count integer,
      ADD COLUMN IF NOT EXISTS sections_included jsonb DEFAULT '[]',
      ADD COLUMN IF NOT EXISTS ai_quality_score integer,
      ADD COLUMN IF NOT EXISTS is_verified boolean DEFAULT false,
      ADD COLUMN IF NOT EXISTS source_url text,
      ADD COLUMN IF NOT EXISTS source_type text DEFAULT 'manual',
      ADD COLUMN IF NOT EXISTS import_batch text,
      ADD COLUMN IF NOT EXISTS full_text_search_vector tsvector;

    CREATE INDEX IF NOT EXISTS idx_funded_proposals_fts ON intelligence_funded_proposals USING gin(full_text_search_vector);
    CREATE INDEX IF NOT EXISTS idx_funded_proposals_ntee ON intelligence_funded_proposals(ntee_major, ntee_code);
    CREATE INDEX IF NOT EXISTS idx_funded_proposals_funder_type ON intelligence_funded_proposals(funder_type);
    CREATE INDEX IF NOT EXISTS idx_funded_proposals_amount ON intelligence_funded_proposals(award_amount);
    CREATE INDEX IF NOT EXISTS idx_funded_proposals_year ON intelligence_funded_proposals(award_year);

    CREATE OR REPLACE FUNCTION update_funded_proposals_fts() RETURNS trigger AS $$
    BEGIN
      NEW.full_text_search_vector := to_tsvector('english',
        coalesce(NEW.title,'') || ' ' ||
        coalesce(NEW.funder_name,'') || ' ' ||
        coalesce(NEW.grant_program,'') || ' ' ||
        coalesce(NEW.full_text,'') || ' ' ||
        coalesce(NEW.narrative_excerpt,'')
      );
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS funded_proposals_fts_trigger ON intelligence_funded_proposals;
    CREATE TRIGGER funded_proposals_fts_trigger
      BEFORE INSERT OR UPDATE ON intelligence_funded_proposals
      FOR EACH ROW EXECUTE FUNCTION update_funded_proposals_fts();

    UPDATE intelligence_funded_proposals SET full_text_search_vector = to_tsvector('english',
      coalesce(title,'') || ' ' || coalesce(funder_name,'') || ' ' || coalesce(grant_program,'') || ' ' || coalesce(full_text,'') || ' ' || coalesce(narrative_excerpt,'')
    );

    STEP 3 — FIX EXISTING RECORDS: Update all 113 existing records to populate new columns from metadata jsonb:
    Run via npx tsx:
    Load all records, extract funder_type from funder_name (if contains 'HUD'|'HHS'|'DOJ'|'VA'|'USDA'|'NIH'|'NSF'|'CDC'|'Department'|'Federal' -> 'federal', if contains 'Foundation' -> 'foundation', if contains 'Bank'|'Corp'|'Inc'|'LLC' -> 'corporate', else 'foundation').
    Extract ntee_major from category field (single letter).
    Extract success_factors from metadata.success_factors if exists.
    Extract keywords from metadata.keywords if exists.
    Upsert all records with populated columns.

    Run pnpm tsc --noEmit. Fix errors.
    git add -A; git commit -m 'feat: intelligence library schema upgrade -- full-text search, funder_type, ntee columns, persuasive elements'; git push.

- id: intel-lib-002
  name: Mass data import from NIH, NSF, Federal Register, USASpending
  prompt: |
    Read src/supabase/migrations/048_grant_intelligence.sql in FULL.
    Read src/lib/intelligence/evaluation-library.ts in FULL.

    CREATE scripts/import-federal-awards.ts

    This script imports real federal grant award data from multiple official sources into intelligence_funded_proposals. Target: 400+ new records from federal sources alone.

    SOURCE 1 — USASpending.gov API (most comprehensive, no API key required):
    Endpoint: https://api.usaspending.gov/api/v2/search/spending_by_award/
    POST body: { filters: { award_type_codes: ["02","03","04","05"], time_period: [{ start_date: "2022-01-01", end_date: "2024-12-31" }], award_amounts: [{ lower_bound: 25000, upper_bound: 2000000 }] }, fields: ["Award ID","Recipient Name","Award Amount","Awarding Agency","Award Description","Period of Performance Start Date","Primary Place of Performance State Code","CFDA Number","CFDA Title"], limit: 100, page: 1 }
    Paginate through results (multiple pages).
    Filter for nonprofit recipients (award_recipient_type contains 'NONPROFIT').
    For each award: create intelligence_funded_proposals record with:
      funder_name: awarding_agency
      grant_program: cfda_title
      award_amount: award_amount
      award_year: year from period_of_performance_start_date
      funder_type: 'federal'
      ntee_major: map CFDA prefix to NTEE (14.* -> L housing, 93.* -> E/F health, 84.* -> B education, 16.* -> P human services, 66.* -> C environment)
      narrative_excerpt: award_description (truncate 500 chars)
      full_text: Generate expanded narrative from award_description using Claude (max_tokens:600): "Expand this federal grant award description into a 400-word grant narrative excerpt showing how a nonprofit would describe this program in a grant application. Write in first person plural, include problem statement, program description, and measurable outcomes."
      source_type: 'usaspending'
      source_url: 'https://www.usaspending.gov/award/' + award_id
      is_verified: true

    SOURCE 2 — NIH Reporter API (no API key required):
    Endpoint: https://api.reporter.nih.gov/v2/projects/search
    POST body: { criteria: { org_types: ["NONPROFIT"], award_notice_date: { from_date: "2022-01-01", to_date: "2024-12-31" }, award_amount_range: { min_amount: 25000, max_amount: 5000000 } }, offset: 0, limit: 50, sort_field: "award_amount", sort_order: "desc" }
    For each result: create record with funder_name='National Institutes of Health', funder_type='federal', ntee_major='E' (health), grant_program from project_title, narrative from abstract text.
    Paginate 5 pages = 250 records.

    SOURCE 3 — NSF Award Search API (no API key required):
    Endpoint: https://api.nsf.gov/services/v1/awards.json?agency=NSF&dateStart=01/01/2022&dateEnd=12/31/2024&awardeeStateCode=CA&printFields=id,title,abstractText,awardeeName,fundsObligatedAmt,date&offset=1
    Paginate multiple states and years.
    funder_name='National Science Foundation', funder_type='federal', ntee_major='B' (education/science).
    Generate narrative from abstractText.

    SOURCE 4 — Grants.gov Awarded Grants RSS:
    Fetch https://www.grants.gov/rss/GG_NewOppByAgency.xml for multiple agencies.
    Parse XML for recently posted opportunities (these represent active programs, use as templates).
    Create records with source_type='grants_gov'.

    RATE LIMITING: 1 second delay between API calls. Process in batches of 25. Checkpoint progress to file.

    NARRATIVE QUALITY: For any record where full_text is under 200 words, call Claude to expand it. System prompt: "You are a grant writer. Expand this award description into a compelling 400-word grant narrative excerpt. Use specific program details, measurable outcomes, and persuasive language. Write as if this is from the winning application."

    PERSUASIVE ELEMENTS EXTRACTION: After generating full_text, call Claude (max_tokens:300): "Extract the 5 most persuasive elements from this grant narrative. Return JSON array: [{ element_type: string, text: string, why_it_works: string }]. Element types: compelling_statistic, clear_outcome, emotional_appeal, credibility_marker, urgency_statement."
    Store in persuasive_elements column.

    WINNING PHRASES EXTRACTION: Call Claude (max_tokens:200): "Extract 8 grant-winning phrases from this narrative. These should be phrases grant reviewers find compelling. Return JSON array of strings."
    Store in winning_phrases column.

    Add package.json script: "import:federal": "tsx scripts/import-federal-awards.ts"
    Run: npx tsx scripts/import-federal-awards.ts
    Report: total records imported by source.

    Run pnpm tsc --noEmit. Fix errors.
    git add -A; git commit -m 'feat: intelligence library federal import -- USASpending, NIH, NSF, Grants.gov -- 400+ records with persuasive elements'; git push.


    Full-text search using PostgreSQL tsvector.
    SELECT *, ts_rank(full_text_search_vector, query) as rank FROM intelligence_funded_proposals WHERE full_text_search_vector @@ plainto_tsquery('english', $1) ORDER BY rank DESC LIMIT 20

    Run pnpm tsc --noEmit. Run pnpm build. Fix ALL errors.
    git add -A; git commit -m 'feat: Intelligence Library complete UI rebuild -- enterprise search, all filters fixed, narrative overlay, winning phrases, NIH/NSF/USASpending quick filters, category filter fix'; git push.
    npx vercel deploy --prod.
    Report production URL and total record count.

- id: intel-lib-005
  name: AI pattern extraction engine and draft integration upgrade
  prompt: |
    Read src/lib/agents/draft-generation-agent.ts in FULL.
    Read src/lib/intelligence/evaluation-library.ts in FULL.
    Read src/app/api/intelligence/proposals/route.ts in FULL.

    CREATE src/lib/intelligence/pattern-extractor.ts:

    This is the engine that extracts actionable intelligence from the library and feeds it to the draft generation agent.

    Export async function extractGrantPatterns(orgProfile: OrgProfile, opportunity: Opportunity, supabase: SupabaseClient): Promise<GrantPatternIntelligence>

    GrantPatternIntelligence: {
      referenceNarratives: ReferenceNarrative[]
      winningPhrases: string[]
      successFactors: string[]
      persuasiveElements: PersuasiveElement[]
      budgetStructureRecommendation: BudgetStructure
      evaluationApproachRecommendation: string
      theoryOfChangeTemplate: string
      funderPreferences: string[]
      avoidPatterns: string[]
      recommendedWordCount: number
      recommendedSections: string[]
    }

    MATCHING ALGORITHM:
    1. PRIMARY MATCH: SELECT * FROM intelligence_funded_proposals WHERE ntee_major = org_ntee_major AND funder_type = opportunity_funder_type ORDER BY award_amount DESC LIMIT 10
    2. SECONDARY MATCH: full-text search using org mission keywords + opportunity keywords: WHERE full_text_search_vector @@ plainto_tsquery('english', keywords) LIMIT 5
    3. FUNDER MATCH: WHERE funder_name ILIKE '%' + funder_name_keyword + '%' LIMIT 3
    4. AMOUNT MATCH: WHERE award_amount BETWEEN opportunity_amount_min * 0.5 AND opportunity_amount_max * 2 LIMIT 5
    5. Deduplicate and rank: score each match by relevance (ntee match=3pts, funder_type match=2pts, amount range match=1pt, full_text match=2pts)
    6. Take top 5 by score

    PATTERN SYNTHESIS: After collecting reference narratives, call Claude (max_tokens:800):
    System: "You are a senior grant writing strategist. Analyze these successful grant narratives and extract actionable patterns for a new grant application."
    User: { orgProfile, opportunity, referenceNarratives: top 5 narratives' full text }
    Extract:
    - Top 10 winning phrases adapted for this org
    - Top 5 success factors from matching grants
    - Budget structure recommendation (% breakdown)
    - Evaluation approach most common in winning grants of this type
    - Theory of change template used in similar successful grants
    - Funder preference signals (what do they seem to value based on what they funded)
    - Patterns to AVOID (what seems absent from unsuccessful applications based on contrast)
    - Recommended word count and sections based on award amount and funder type

    UPGRADE draft-generation-agent.ts:
    Replace the simple library query with extractGrantPatterns():
    const intelligence = await extractGrantPatterns(orgProfile, opportunity, supabase)

    Inject the full GrantPatternIntelligence into the Phase 2 strategy prompt AND Phase 3 section drafting prompts:

    INTELLIGENCE LIBRARY PATTERN ANALYSIS:
    Reference grants analyzed: [list funder names and amounts]
    Winning phrases to incorporate (adapt, not copy): [list]
    Success factors present in all matching grants: [list]
    Funder preference signals: [list]
    Recommended budget structure: Personnel [X]%, Programs [X]%, Admin [X]%
    Recommended sections: [list]
    Patterns to avoid: [list]
    Theory of change template: [text]

    This ensures every draft is genuinely informed by what has actually won grants from similar funders.

    Also update the draft review page to show which reference narratives were used:
    Add "Intelligence Used" section to each draft card showing: X reference narratives from the Intelligence Library, funder types matched, winning phrases applied count.

    Run pnpm tsc --noEmit. Run pnpm build. Fix all errors.
    git add -A; git commit -m 'feat: grant pattern extraction engine -- multi-factor matching, pattern synthesis, full intelligence injection into draft pipeline'; git push.
    npx vercel deploy --prod.
    Report production URL. Report how many reference narratives were matched for a test opportunity for Faith Foundation.

# queue-pil-critic-review.yaml
# Post-build verification stage. Runs AFTER all 8 family queues (queue-pil-{sup,dis,int,rel,qlf,str,knw,ops}-agents.yaml),
# and specifically after queue-pil-sup-agents.yaml's pil-sup-05-upgrade prompt, which upgrades BEN-SUP-05 (Prospect
# Research Critic and Red-Team Agent) to a 9-value CriticVerdict (PASS, PASS_WITH_CAVEATS, RESEARCH_MORE,
# BLOCK_INSUFFICIENT_EVIDENCE, BLOCK_ENTITY_AMBIGUITY, BLOCK_POLICY, BLOCK_INDEPENDENCE, BLOCK_EVIDENCE_INTEGRITY,
# QUARANTINE_SECURITY) and a self-certification refusal guard. Constitutional principle (spec): "a research-producing
# agent cannot certify its own consequential output." This queue makes BEN-SUP-05 independently review the REAL output
# of every other agent the 8 family queues touch -- 43 agents total (all of SUP-01/02/03/04/06, DIS-01..08, INT-01..10,
# REL-01..06, QLF-01..05, STR-01..04, KNW-01..04, OPS-01 -- never SUP-05 itself, which is the reviewer, not a subject).
#
# DESIGN DECISION (documented per instruction, not left implicit): this is 8 prompts, one per family, each producing ONE
# new test file -- NOT a single prompt looping generically over all 43 agents. Verified before choosing: (1) Glob for
# src/lib/pil/integration-tests/ or any *integration* path under src/lib/pil/ returned zero results -- no pre-existing
# cross-cutting PIL integration-test directory exists to slot into. (2) src/__tests__/integration/*.test.ts DOES exist,
# but every file there (platform-config-org-scope.test.ts, rls.test.ts, corporate-prospects.test.ts, etc.) runs against
# the REAL live Supabase project from .env.local with real network round-trips and afterAll teardown -- that is a
# different, heavier convention (used for RLS/org-scope regressions against live infra) than how PIL agents are tested
# anywhere in this codebase. (3) Every actual PIL agent test file (pil-sup-agents.test.ts, pil-sup-agents-2.test.ts,
# pil-dis-agents.test.ts, pil-qlf-knw-agents.test.ts, and the pil-int/rel/str/ops-agents.test.ts files the 8 family
# queues create) is fully mocked (vi.mock on @/lib/pil/db, evidence, graph, tools, audit, human-review, monitoring), is
# organized ONE FILE PER FAMILY, and each family's own mocking shape genuinely differs -- pil-dis-agents.test.ts mocks
# getTool()-based tool calls and a pil_prospects find-then-insert client; pil-sup-agents-2.test.ts mocks a table-keyed
# generic Supabase chain via makeClient(); pil-qlf-knw-agents.test.ts additionally mocks getEvents()/detectContradiction().
# Forcing all 43 agents through one uniform mock shape in a single prompt/file would be LESS faithful to each agent's
# real interface, not more, and would produce an unreviewably large single prompt. Splitting one prompt per family (a) 8
# prompts, matching the exact family split already established by the 8 upgrade/build queues and their own test files,
# (b) keeps each prompt's real per-agent mock/fixture work inside FORGE's proven 7-15-minute dense-prompt shape, and
# (c) lets each new test file sit next to (not clobber) the family's own agent-implementation test file this queue
# depends on already existing and already passing.
#
# THE REAL REVIEW MECHANISM (read this before writing any prompt below -- it is the one thing every prompt shares):
# BEN-SUP-05.execute(context, runner) does NOT accept an arbitrary "here is agent X's output, grade it" object. Its real
# contract (src/lib/pil/agents/sup/BEN-SUP-05.ts) is: context.plan.targetAgentRunId identifies a pil_agent_runs row to
# load (loadAgentRun() -- mocked here via the table-keyed makeClient() convention already used in pil-sup-agents-2.test.ts
# for the pil_agent_runs table); context.prospectId identifies whose pil_evidence/pil_graph_* to independently
# re-examine via the REAL getEvidence(prospectId, orgId) / getNodesByProspect(prospectId, orgId) / getEdges(nodeId) calls
# (mocked here, but called for real by the critic's own execute() -- this queue does not stub evaluateClaim/decideVerdict
# themselves, only their DB-layer dependencies, exactly like every other PIL agent test in this repo). The loaded run's
# output.assertedFacts (if present) is cross-checked against that SAME evidence pool for the inference_presented_as_fact
# and (post-upgrade) source-independence / evidence-integrity checks; every other check (insufficient_evidence,
# stale_evidence, weak_source_quality, contradicted, speculative relationships, duplicate identity, cross-tenant) runs
# directly against the evidence pool regardless of assertedFacts. So "feed the subject agent's real output to BEN-SUP-05"
# concretely means, per subject agent under test: (1) execute the REAL subject agent class against a realistic mocked
# context/tools fixture (reusing that family's own established fixture conventions -- do not invent a parallel style);
# (2) capture every item the subject agent's own mocked recordEvidence() calls actually received during that real
# execution (push each into a local `recorded: EvidenceItem[]` array, exactly like pil-dis-agents.test.ts's existing
# `recorded.push(item)` pattern) -- this IS the subject agent's real produced evidence, not hand-authored parallel data;
# (3) if and only if the subject agent's real AgentResult.conclusions exposes a claim/evidence-id pairing that maps onto
# FactClaim ({claimType, evidenceId}), build assertedFacts from that real pairing -- if it does not expose one (most
# agents will not; only a few, e.g. BEN-QLF-04's classification output, are documented as SUP-05-aware), assertedFacts is
# simply [], which BEN-SUP-05's own `?? []` fallback already handles correctly, and this queue must say so plainly in
# that agent's test rather than fabricate a claim pairing that doesn't exist; (4) mock getEvidence(prospectId, orgId) to
# return exactly the `recorded` array from step 2 (with each item given the required EvidenceItem fields the fixture is
# missing -- id, organization_id, entity_id, entity_table -- reusing the same literal values already used for these
# fields in that family's own existing evidence fixtures); (5) mock pil_agent_runs.maybeSingle() (via makeClient()) to
# return a targetRun row with agent_id = the real subject agent code (e.g. "BEN-DIS-03"), organization_id = the same
# ORG_ID, and output = { assertedFacts } from step 3; (6) execute the REAL ProspectResearchCriticAgent from
# src/lib/pil/agents/sup/BEN-SUP-05.ts against context.agentCode = "BEN-SUP-05", context.plan.targetAgentRunId =
# targetRun.id, context.prospectId = the same prospect id used in step 1-4, context.orgId = ORG_ID; (7) assert on the
# REAL returned report.verdict.
#
# TWO tests per subject agent, both required:
# (a) CLEAN-RUN TEST: the subject agent's fixture context/tools are set up so its real execution succeeds and produces
#     well-formed, fresh, verified, corroborated evidence (reuse that family's own "happy path" fixture from its
#     existing test file, which already models this). Assert
#     `expect(["PASS","PASS_WITH_CAVEATS"]).toContain(report.verdict)`.
#     This is the load-bearing assertion of the whole queue: if BEN-SUP-05's real, unmocked evaluateClaim/decideVerdict
#     logic returns any BLOCK_* value or QUARANTINE_SECURITY here, this assertion FAILS the test outright -- it is not
#     caught, logged, downgraded to a warning, or wrapped in a conditional that only checks the shape of the report.
#     NEVER write a pattern like `if (verdict.startsWith("BLOCK_")) console.warn(...) else expect(true).toBe(true)` or
#     any other structure that lets a BLOCK_*/QUARANTINE_SECURITY verdict pass silently -- that would defeat the entire
#     purpose of this queue. A failing assertion here fails `pnpm run test:unit`, which this prompt's own close-out step
#     3 requires to actually be run and pass before the prompt can be treated as complete.
# (b) DEGRADED-RUN TEST: take the SAME recorded evidence array from the clean-run test and mutate exactly one already-
#     established bad-evidence trait already used elsewhere in this codebase's own BEN-SUP-05 tests (reuse, do not
#     invent: confidence below MIN_CONFIDENCE=0.3 for insufficient_evidence; freshness_status:"stale" for stale_evidence;
#     verification_status:"unverified" or "single_source_fact" for weak_source_quality; contradiction_status other than
#     "none" for contradicted; verification_status:"reasoned_inference"/"estimate" or inference_status:"inferred" paired
#     with an assertedFacts entry for inference_presented_as_fact -- see pil-sup-agents-2.test.ts's existing
#     `inferredEvidence` fixture for the exact shape). Re-read the CURRENT (post pil-sup-05-upgrade) BEN-SUP-05.ts before
#     picking which mutation to use for the source-independence and evidence-integrity cases specifically, since this
#     queue file was authored before that upgrade landed -- use whatever field name the real, upgraded evaluateClaim()
#     independence check actually keys on (do not guess). Assert the real returned verdict is one of BLOCK_INSUFFICIENT_
#     EVIDENCE, BLOCK_ENTITY_AMBIGUITY, BLOCK_POLICY, BLOCK_INDEPENDENCE, BLOCK_EVIDENCE_INTEGRITY, QUARANTINE_SECURITY,
#     or RESEARCH_MORE (whichever the specific mutation actually triggers per decideVerdict()'s real precedence order --
#     re-read it, do not assume), AND assert that whichever real side effect that verdict causes actually fired: a
#     BLOCK_*/QUARANTINE_SECURITY verdict must show `createReviewItem` called with `review_type: "critic_block"` and
#     `subject_id` equal to the targetRun id, and the recorded pil_policy_decisions insert payload's `decision` field
#     must be `"deny"` (or `"require_human"` for RESEARCH_MORE) -- proving the block is a real, observable side effect,
#     not just a string on an unused return value.
#
# No `type: test` gate is used anywhere in this queue, matching every one of the 8 prior family queues: FORGE 1.0's
# `test` gate type runs Playwright specs, not vitest, and would silently misreport PASS/SKIP against these unit test
# files (per FORGE_CANONICAL_INSTRUCTIONS.md's gate table). Enforcement of "tests must actually pass" therefore lives in
# each prompt's own MANDATORY CLOSE-OUT step 3 (an explicit `pnpm run test:unit -- <file>` run that must be confirmed
# green before the prompt is treated as complete) -- the identical trust model every one of the 8 family queues already
# uses for its own new/extended test files, not a weaker one introduced here.
#
# PRECONDITION every prompt below re-verifies for itself (do not trust this comment's paraphrase of a file this queue's
# author read before the sup queue ran): grep src/lib/pil/agents/sup/BEN-SUP-05.ts for "BLOCK_INDEPENDENCE" before
# writing any test. If it is absent, pil-sup-05-upgrade has not run yet in this environment -- STOP, do not write tests
# against the pre-upgrade 6-value verdict enum, and report this precondition failure instead of proceeding.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-critic-review-sup-build
  name: Critic-review BEN-SUP-01/02/03/04/06 real output through the upgraded BEN-SUP-05
  prompt: "PRECONDITION CHECK FIRST: run `grep -n \"BLOCK_INDEPENDENCE\" src/lib/pil/agents/sup/BEN-SUP-05.ts`. If no match, STOP -- queue-pil-sup-agents.yaml's pil-sup-05-upgrade prompt has not run yet in this environment; report this precondition failure and do not write any test in this prompt against the wrong interface.\n\nSTEP 1 -- READ IN FULL: src/lib/pil/agents/sup/BEN-SUP-05.ts (the real, upgraded ProspectResearchCriticAgent -- note its real 9-value CriticVerdict union, the exact field the new source-independence check groups evidence by, the exact evidenceId-resolution logic behind BLOCK_EVIDENCE_INTEGRITY, and the exact organization_id comparison behind QUARANTINE_SECURITY). src/lib/pil/agent-runner.ts (real Agent/AgentContext/AgentResult interfaces -- `implements Agent`, never `extends BaseAgent`, which does not exist). src/lib/pil/types.ts's EvidenceItem, AgentRun, and ProspectIdentity interfaces in full (exact field names -- id, organization_id, entity_id, entity_table, claim_type, confidence, verification_status, freshness_status, contradiction_status, inference_status for EvidenceItem; id, organization_id, agent_id, output for AgentRun). src/lib/pil/evidence.ts's real getEvidence(prospectId, orgId) and recordEvidence(item) signatures. src/__tests__/unit/pil-sup-agents.test.ts and pil-sup-agents-2.test.ts in full -- these already cover BEN-SUP-01/02/03/04/06 (pil-sup-agents.test.ts) and BEN-SUP-05 itself (pil-sup-agents-2.test.ts); study their exact baseContext(), makeClient() chainable-mock-client helper, and each agent's already-established happy-path fixture (org id, prospect id, evidence shape, mocked getPilClient responses) -- you will reuse these fixtures, not invent parallel ones.\n\nSTEP 2 -- CREATE src/__tests__/unit/pil-critic-review-sup.test.ts, a new file (do not edit pil-sup-agents.test.ts or pil-sup-agents-2.test.ts). Import describe/it/expect/vi/beforeEach from vitest, the same vi.mock() calls for @/lib/pil/db, @/lib/pil/evidence, @/lib/pil/graph, @/lib/pil/audit, @/lib/pil/human-review that pil-sup-agents-2.test.ts already uses, plus the same ORG_ID constant, the same baseContext() helper, and the same makeClient() helper (copy them verbatim -- these are the established repo convention, not something to redesign).\n\nFor EACH of these 5 subject agents -- BEN-SUP-01 (ChiefProspectIntelligenceOrchestrator, src/lib/pil/agents/sup/BEN-SUP-01.ts), BEN-SUP-02 (ResearchStrategyArchitect, sup/BEN-SUP-02.ts), BEN-SUP-03 (CrossAgentResearchPlanner, sup/BEN-SUP-03.ts), BEN-SUP-04 (ResearchPortfolioAllocator, sup/BEN-SUP-04.ts), BEN-SUP-06 (ResearchRecoveryInvestigatorAgent, sup/BEN-SUP-06.ts) -- write a `describe(\"<agent code> critic review\", ...)` block containing exactly the CLEAN-RUN and DEGRADED-RUN tests described in this queue file's header comment under 'THE REAL REVIEW MECHANISM' and 'TWO tests per subject agent'. Concretely for BEN-SUP-01 (do this one FIRST, in full, as the worked example the remaining 4 follow exactly): (1) reuse pil-sup-agents.test.ts's existing BEN-SUP-01 happy-path fixture context/mocks verbatim, execute `new ChiefProspectIntelligenceOrchestrator().execute(context, fakeRunnerOrRealRunnerAsUsedInThatFile)`; (2) since BEN-SUP-01 is a supervisory/orchestration agent it may not itself call recordEvidence() directly -- if it does not, construct the `recorded: EvidenceItem[]` array instead from the SAME evidence fixture pil-sup-agents.test.ts's BEN-SUP-01 test already mocks getEvidence()/getNodesByProspect() to return (reuse those exact objects, do not author new ones), since that is the real evidence pool this agent's own decisions were based on; (3) inspect BEN-SUP-01's real result.conclusions for any claim/evidenceId pairing; if none exists, assertedFacts = [] and say so in a code comment; (4) mock getEvidence to return `recorded` for the shared prospect id used in step 1's fixture; (5) build targetRun with agent_id \"BEN-SUP-01\", organization_id ORG_ID, output { assertedFacts }; (6) execute the real `new ProspectResearchCriticAgent()` with context.agentCode \"BEN-SUP-05\", plan.targetAgentRunId = targetRun.id, prospectId = the same prospect id, orgId ORG_ID; (7) assert per the CLEAN-RUN and DEGRADED-RUN rules verbatim, including the createReviewItem/pil_policy_decisions side-effect assertions for the degraded case. Apply the identical 7-step pattern to BEN-SUP-02/03/04/06, substituting each one's own class name/file path and its own already-established fixture from pil-sup-agents.test.ts.\n\nSTEP 3 -- INCREMENTAL TEST CHECKPOINT (mid-prompt, not just at the end): after writing the BEN-SUP-01 describe block alone, run `pnpm run test:unit -- src/__tests__/unit/pil-critic-review-sup.test.ts` and confirm that block's 2 tests pass before writing the remaining 4 agents' blocks. Fix any failure now.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run: pnpm tsc --noEmit -- must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build -- fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019).\n3. Run: pnpm run test:unit -- src/__tests__/unit/pil-critic-review-sup.test.ts and confirm all 10 tests (5 agents x 2 tests each) pass -- a BLOCK_*/QUARANTINE_SECURITY verdict on any CLEAN-RUN test is a real failure to fix (by fixing the fixture's evidence quality or this prompt's understanding of the agent's real output, never by loosening the assertion), not something to silence.\n4. Update STATE_OF_THE_BUILD.md from a live audit (confirm the new file exists, confirm all 10 tests pass, note this is prompt 1/8 of the critic-review queue) -- never from memory. Update SESSION_STATE.md with the current phase and next action.\n\nDo NOT modify src/lib/pil/agents/sup/BEN-SUP-05.ts or any other agent implementation file in this prompt -- this queue only adds new test files that exercise the already-upgraded real agents."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/__tests__/unit/pil-critic-review-sup.test.ts
- id: pil-critic-review-dis-build
  name: Critic-review BEN-DIS-01 through BEN-DIS-08 real output through BEN-SUP-05
  prompt: "PRECONDITION CHECK FIRST: run `grep -n \"BLOCK_INDEPENDENCE\" src/lib/pil/agents/sup/BEN-SUP-05.ts`. If no match, STOP and report the precondition failure instead of proceeding.\n\nSTEP 1 -- READ IN FULL: src/lib/pil/agents/sup/BEN-SUP-05.ts (current, upgraded), src/lib/pil/agent-runner.ts, src/lib/pil/types.ts's EvidenceItem/AgentRun interfaces, src/lib/pil/evidence.ts's getEvidence/recordEvidence. Then read src/__tests__/unit/pil-dis-agents.test.ts in FULL -- it already covers all 8 BEN-DIS agents with a `makePilProspectsClient()` helper and a `recorded: Array<{claim_type:string}>` capture pattern on the mocked recordEvidence() (see its existing BEN-DIS-01/BEN-DIS-03 describe blocks) -- this is exactly the `recorded` capture this queue's header comment describes; reuse it verbatim rather than re-deriving it.\n\nSTEP 2 -- CREATE src/__tests__/unit/pil-critic-review-dis.test.ts (new file; do not edit pil-dis-agents.test.ts). Same vi.mock()/ORG_ID/baseContext()/makeClient() setup convention as pil-critic-review-sup.test.ts (prompt 1 of this queue, already run) plus pil-dis-agents.test.ts's own @/lib/pil/tools mock (`vi.mock(\"@/lib/pil/tools\", () => ({ getTool: vi.fn() }))`) and makePilProspectsClient() helper, copied verbatim.\n\nFor EACH of these 8 subject agents -- BEN-DIS-01 (IndividualProspectDiscoveryAgent), BEN-DIS-02 (MajorDonorDiscoveryAgent), BEN-DIS-03 (FoundationDiscoveryAgent), BEN-DIS-04 (CorporateGivingDiscoveryAgent), BEN-DIS-05 (ExecutiveProspectDiscoveryAgent), BEN-DIS-06 (GeographicFundingDiscoveryAgent), BEN-DIS-07 (CauseAlignedProspectDiscoveryAgent), BEN-DIS-08 (HiddenProspectAndCrmRediscoveryAgent), each at src/lib/pil/agents/dis/BEN-DIS-0N.ts -- write a `describe(\"<agent code> critic review\", ...)` block with the CLEAN-RUN and DEGRADED-RUN tests exactly as defined in this queue file's header comment. Concretely for BEN-DIS-03 (do this one FIRST in full, as the worked example -- pil-dis-agents.test.ts's own existing BEN-DIS-03 test already mocks entity_lookup returning 2 foundation_directory matches and captures recordEvidence calls): (1) reuse that exact fixture (the `matches` array, the getTool mock, the makePilProspectsClient() setup) and execute the real `new FoundationDiscoveryAgent().execute(context, fakeRunner())`; (2) capture every recordEvidence() call's item into `recorded: EvidenceItem[]` (the source pil-dis-agents.test.ts already establishes this pattern, extend it to push the FULL item object, not just claim_type); (3) BEN-DIS-03's conclusions.discoveries array does not expose a FactClaim-shaped assertedFacts pairing (it exposes prospectId per discovery, not evidenceId/claimType pairs) -- so assertedFacts = [] here, documented in a code comment per the header comment's rule 3; (4) mock getEvidence to return `recorded` for the prospect id the FIRST discovered prospect resolves to (pull it from the insertMock echo, matching how pil-dis-agents.test.ts already asserts on insertMock.mock.calls); (5)-(7) exactly as the header comment specifies. Apply the identical pattern to the remaining 7 BEN-DIS agents, reusing each one's own already-established fixture from pil-dis-agents.test.ts (news_search results for BEN-DIS-01, and whatever each other agent's own existing test already sets up -- if a given BEN-DIS-0N does not yet have its own describe block in pil-dis-agents.test.ts, construct its context/tools fixture following the exact same shape as the ones that do, reading that agent's own .ts file first to see which tools/claim_types it actually uses).\n\nSTEP 3 -- INCREMENTAL TEST CHECKPOINT: after writing BEN-DIS-01 and BEN-DIS-03's blocks, run `pnpm run test:unit -- src/__tests__/unit/pil-critic-review-dis.test.ts` and confirm those 4 tests pass before writing the remaining 6 agents.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run: pnpm tsc --noEmit -- 0 errors relative to files this prompt touched.\n2. Run: pnpm run build -- fix ALL errors before proceeding (DIRECTIVE-019).\n3. Run: pnpm run test:unit -- src/__tests__/unit/pil-critic-review-dis.test.ts and confirm all 16 tests (8 agents x 2) pass -- fix any CLEAN-RUN BLOCK_*/QUARANTINE_SECURITY failure by improving fixture evidence quality, never by loosening the assertion.\n4. Update STATE_OF_THE_BUILD.md from a live audit (file exists, 16/16 tests pass, prompt 2/8) -- never from memory. Update SESSION_STATE.md with current phase and next action.\n\nDo NOT modify any src/lib/pil/agents/dis/BEN-DIS-0N.ts file in this prompt."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/__tests__/unit/pil-critic-review-dis.test.ts
- id: pil-critic-review-int-build
  name: Critic-review BEN-INT-01 through BEN-INT-10 real output through BEN-SUP-05
  prompt: "PRECONDITION CHECK FIRST: run `grep -n \"BLOCK_INDEPENDENCE\" src/lib/pil/agents/sup/BEN-SUP-05.ts`. If no match, STOP and report the precondition failure instead of proceeding.\n\nSTEP 1 -- READ IN FULL: src/lib/pil/agents/sup/BEN-SUP-05.ts (current, upgraded), src/lib/pil/agent-runner.ts, src/lib/pil/types.ts's EvidenceItem/AgentRun interfaces, src/lib/pil/evidence.ts. Then read src/__tests__/unit/pil-int-agents.test.ts in FULL -- created by queue-pil-int-agents.yaml, which ran before this queue; it covers all 10 BEN-INT agents (BEN-INT-08 Wealth & Capacity Intelligence Agent's fixture is also directly reused, unmodified, by pil-sup-agents-2.test.ts's own existing BEN-SUP-05 test -- read that reuse too, it is the single clearest existing precedent in this codebase for exactly what this whole queue is doing). Study its established context/tools/evidence fixture conventions per agent.\n\nSTEP 2 -- CREATE src/__tests__/unit/pil-critic-review-int.test.ts (new file). Same vi.mock()/ORG_ID/baseContext()/makeClient() convention as prompts 1-2 of this queue plus whatever additional mocks (@/lib/pil/tools, etc.) pil-int-agents.test.ts itself establishes -- copy its exact mock setup verbatim.\n\nFor EACH of these 10 subject agents -- BEN-INT-01 (IndividualIntelligenceAgent), BEN-INT-02 (EmploymentCareerIntelligenceAgent), BEN-INT-03 (BusinessOwnershipIntelligenceAgent), BEN-INT-04 (EducationAlumniIntelligenceAgent), BEN-INT-05 (NonprofitBoardIntelligenceAgent), BEN-INT-06 (FoundationIntelligenceAgent), BEN-INT-07 (GivingHistoryIntelligenceAgent), BEN-INT-08 (WealthCapacityIntelligenceAgent), BEN-INT-09 (WealthOriginLiquidityEventAgent), BEN-INT-10 (ContactIntelligenceAgent), each at src/lib/pil/agents/int/BEN-INT-0N.ts -- write a `describe(\"<agent code> critic review\", ...)` block with the CLEAN-RUN and DEGRADED-RUN tests per this queue file's header comment. Do BEN-INT-08 FIRST, in full, as the worked example, since it has the most direct existing precedent: reuse pil-sup-agents-2.test.ts's existing `targetRun`/`inferredEvidence` fixture pattern for the DEGRADED-RUN test structure (evidenceId ev-1, claim_type wealth_capacity, assertedFacts [{claimType:\"wealth_capacity\",evidenceId:\"ev-1\"}]) but drive it from BEN-INT-08's own REAL execute() output this time rather than a hand-authored targetRun -- i.e. execute the real `new WealthCapacityIntelligenceAgent().execute(context, runner)` against pil-int-agents.test.ts's own established BEN-INT-08 fixture first, capture its real recordEvidence() calls into `recorded`, and confirm whether its real conclusions expose a claimType/evidenceId pairing (if BEN-INT-08's conclusions include an explicit wealth-capacity assertion keyed to a specific evidence id, use that REAL pairing for assertedFacts; only fall back to assertedFacts=[] if it genuinely does not). For the CLEAN-RUN test, all captured evidence should be fresh/verified/corroborated per BEN-INT-08's own happy-path fixture. For the DEGRADED-RUN test, mutate one captured item to inferred/estimate verification_status while its claimType/evidenceId pairing is still asserted as fact, mirroring the existing BLOCK_INSUFFICIENT_EVIDENCE precedent exactly. Apply the identical pattern to the remaining 9 BEN-INT agents, reusing each one's own established fixture from pil-int-agents.test.ts.\n\nSTEP 3 -- INCREMENTAL TEST CHECKPOINT: after writing BEN-INT-01 and BEN-INT-08's blocks (4 tests), run `pnpm run test:unit -- src/__tests__/unit/pil-critic-review-int.test.ts` and confirm they pass before writing the remaining 8 agents.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run: pnpm tsc --noEmit -- 0 errors relative to files this prompt touched.\n2. Run: pnpm run build -- fix ALL errors before proceeding (DIRECTIVE-019).\n3. Run: pnpm run test:unit -- src/__tests__/unit/pil-critic-review-int.test.ts and confirm all 20 tests (10 agents x 2) pass -- fix any CLEAN-RUN BLOCK_*/QUARANTINE_SECURITY failure by improving fixture evidence quality, never by loosening the assertion.\n4. Update STATE_OF_THE_BUILD.md from a live audit (file exists, 20/20 tests pass, prompt 3/8) -- never from memory. Update SESSION_STATE.md with current phase and next action.\n\nDo NOT modify any src/lib/pil/agents/int/BEN-INT-0N.ts file in this prompt."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/__tests__/unit/pil-critic-review-int.test.ts

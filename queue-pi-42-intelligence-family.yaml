         model).
      2. The ratchet: full proof ladder + pnpm -r test green
         together; consolidated to
         evidence\pi-42\family-ratchet.txt.
      3. Create scripts\verify\verify-pi42-013.mjs: all four
         hardening families + the ratchet green.
      4. Run: node scripts/verify/verify-pi42-013.mjs

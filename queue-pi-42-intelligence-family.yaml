project: prospect-intel
github_repo: Reid64/prospect-intel

governance:
  - DECISION_LOG.md
  - STANDING_DIRECTIVES.md
  - SESSION_STATE.md
  - STATE_OF_THE_BUILD.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

# ============================================================
# PI-42: INTELLIGENCE FAMILY - BEN-INT-01 through BEN-INT-10
#
# The deep-research core: ten specialists that turn discovered
# candidates into understood prospects. This family writes the
# bulk of the system's claims and the graph's edges - everything
# it produces flows through the evidence rails built in Phases
# 1-3, lands in twins, and feeds qualification in pi-44.
#
# THE D-006 CENTERPIECE (BEN-INT-08): no wealth-screening
# license exists at launch. INT-08 runs in PUBLIC-EVIDENCE MODE:
# SEC insider positions, proxy compensation, business ownership,
# public real-property records - with WIDER confidence intervals
# and an explicit evidence-basis label on every capacity
# statement (public_evidence vs licensed_screening). When a
# license lands, the pi-13 seam drops in and confidence
# tightens; nothing else changes. Capacity claims NEVER
# overstate their basis - that is this family's version of
# wealth-is-not-propensity.
#
# Established patterns throughout. Deterministic extraction
# services do the parsing; agents do the reasoning.
# ============================================================

prompts:

  - id: pi42-001
    phase: build
    description: "Preflight: FAMILY-3 read, ratchet green"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Read FAMILY-3-INTELLIGENCE.md in full (all ten contracts);
         re-read PRIVACY_CONTROLS' permissible-source rules for
         giving records and property data (INT-05/10 live at the
         policy edge - their prompts must encode exactly what the
         doc permits).
      2. Health: the pi-41 family ratchet re-run green; migrate
         --status clean. Capture to evidence\pi-42\preflight.txt.
      3. Create scripts\verify\verify-pi42-001.mjs: ten contracts x
         24 fields; ratchet green.
      4. Run: node scripts/verify/verify-pi42-001.mjs
    expected_outputs:
      - evidence/pi-42/preflight.txt
      - scripts/verify/verify-pi42-001.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-001.mjs"
    max_retries: 2
    on_fail: halt

  - id: pi42-002
    phase: build
    description: "Shared intelligence infrastructure: dossiers, depth budgets, twin flow"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. packages\core\src\intelligence\:
         - ResearchDossier schema (contracts/zod): per-dimension
           findings (the dimensions matching twin sections), every
           finding carrying claim ids + confidence + evidence-basis
           label; open questions typed (research_requests-compatible);
           NO free-floating conclusions (schema rejects a finding
           without claims - the family rule structural).
         - Depth budgeting: an intelligence node's budget slices
           across its target entities (per-entity allocation from
           the plan; the kernel's task budgets carry it); a
           per-entity exhaustion yields a partial dossier flagged
           incomplete, never a silent thin one.
         - Twin flow: dossier findings ARE claims (written through
           the evidence path during research); the dossier document
           references them - KNW-01's event-driven rebuilds pick
           them up with zero new wiring (assert, don't rebuild).
      2. Vitest: schema rejects claim-less findings; per-entity
         budget exhaustion flags incomplete; a dossier's claims
         appear in the twin via the existing event chain.
      3. Green; evidence\pi-42\intel-infra-tests.txt. Typecheck
         clean.
      4. Create scripts\verify\verify-pi42-002.mjs standard pattern.
      5. Run: node scripts/verify/verify-pi42-002.mjs
    expected_outputs:
      - packages/core/src/intelligence/index.ts
      - scripts/verify/verify-pi42-002.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-002.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-003
    phase: build
    description: "The 990 analysis toolkit: deterministic filing extraction"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. packages\services\src\filings\: deterministic 990/990-PF
         extraction over the IRS ZIP-bundle XMLs (pi-13's adapter
         supplies bytes; this service parses meaning): officers/
         directors/trustees with compensation; Schedule I grants
         (recipient, EIN where present, amount, purpose); 990-PF
         grant equivalents; total assets/distributions; payout
         computation across years; grant-pattern aggregation
         (size distribution, cause buckets via recipient NTEE
         lookup against our nonprofit data, geographic spread from
         recipient addresses). Version-tolerant parsing (schema
         years differ - handle the recent major versions; an
         unparseable year yields a typed gap, never silent zeros).
      2. Vitest on committed fixture XMLs (build fixtures from real
         downloaded samples across at least two schema years):
         extraction exactness against hand-read values; the
         unparseable-year gap; pattern aggregation math.
      3. Green; evidence\pi-42\filings-toolkit-tests.txt. Typecheck
         clean.
      4. Create scripts\verify\verify-pi42-003.mjs: standard plus
         the two-schema-year and gap tests present.
      5. Run: node scripts/verify/verify-pi42-003.mjs
    expected_outputs:
      - packages/services/src/filings/index.ts
      - scripts/verify/verify-pi42-003.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-003.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-004
    phase: build
    description: "BEN-INT-02 (Foundation Intelligence) + BEN-INT-03 (Corporate Intelligence) as code"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-02.ts field-for-field: the 990 reasoner - tools:
         the filings toolkit, irs/propublica, webcrawl (foundation
         sites, guidelines pages), graph writes for grant
         relationships (foundation -> granted_to -> recipient edges,
         claim-backed); its signature reasoning: PRIORITIES IN
         PRACTICE vs stated priorities (grant patterns vs website
         language - divergence surfaced as a finding), grant-size
         fit vs a tenant's ask range, application accessibility.
         BEN-INT-03.ts: corporate giving depth - webcrawl (CSR/
         foundation pages, matching-gift program detection), edgar
         (corporate foundation linkage, proxy philanthropy
         mentions), news; outputs giving-program structures typed.
      2. Vitest (FakeProvider + fixtures, real kernel): INT-02 on a
         fixture foundation (3 years of fixture filings) produces
         the practice-vs-stated divergence finding with claims from
         BOTH sides (filing claims + website claims); grant edges
         land evidenced; INT-03 detects the fixture matching
         program with its snapshot.
      3. Green; evidence\pi-42\int-02-03-tests.txt. Typecheck clean.
      4. Create scripts\verify\verify-pi42-004.mjs: standard plus
         the divergence-finding test present.
      5. Run: node scripts/verify/verify-pi42-004.mjs
    expected_outputs:
      - packages/contracts/src/agents/intelligence/BEN-INT-02.ts
      - packages/contracts/src/agents/intelligence/BEN-INT-03.ts
      - scripts/verify/verify-pi42-004.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-004.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-005
    phase: build
    description: "BEN-INT-01 (Individual Deep Research) + BEN-INT-04 (Board/Leadership Network) as code"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-01.ts: bounded-depth individual research -
         biography, career history, organizational affiliations
         from public sources (webcrawl bios, news, propublica/
         filings officer listings, edgar officer data); its
         contract's depth discipline (the plan's depth budget
         governs how many source-hops per person; the bound
         tested). BEN-INT-04.ts: the network mapper - THE GRAPH'S
         PRIMARY AUTHOR: board seats, officer roles, prior
         affiliations as temporal edges (valid_from from evidence
         dates; unknown starts handled per the registry's
         convention), co-membership surfaced via the overlap
         primitives; every edge claim-backed by construction
         (assertEdge's schema).
      2. Vitest: INT-01 dossier sections with claims, depth bound
         honored (hop counting); INT-04 builds the fixture board
         (5 people, 2 orgs, one person on both) - edges temporal,
         overlap query returns the co-member, an undated seat lands
         per the convention with its dating gap as an open
         question.
      3. Green; evidence\pi-42\int-01-04-tests.txt. Typecheck
         clean.
      4. Create scripts\verify\verify-pi42-005.mjs: standard plus
         the depth-bound and undated-seat tests present.
      5. Run: node scripts/verify/verify-pi42-005.mjs
    expected_outputs:
      - packages/contracts/src/agents/intelligence/BEN-INT-01.ts
      - packages/contracts/src/agents/intelligence/BEN-INT-04.ts
      - scripts/verify/verify-pi42-005.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-005.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-006
    phase: build
    description: "BEN-INT-05 (Giving History) + BEN-INT-06 (Affinity) as code"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-05.ts: public giving reconstruction - donor
         recognition pages, annual reports, gala/event listings,
         990 public donor data, news gift announcements - EXACTLY
         within the PRIVACY_CONTROLS permissibility for each source
         class (the public-does-not-mean-permitted principle from
         the directive: the prompt instructs, the policy engine
         enforces via each source's class - both layers). Gift
         records as typed claims (amount-or-range, recipient, date
         precision honest). BEN-INT-06.ts: affinity from public
         statements/activities/patterns - cause alignment findings
         with the inference discipline (an inferred affinity is
         INFERENCE-labeled always; the schema carries the label).
      2. Vitest: INT-05 fixture donor-wall extraction with range-
         typed amounts (named ranges like "$10,000-$24,999" stay
         ranges, never midpointed into fake precision - test);
         a source whose class disallows the purpose is policy-
         denied and the agent's trail shows the denial handled
         (skip + gap, not crash); INT-06 inference labels present
         on every affinity finding.
      3. Green; evidence\pi-42\int-05-06-tests.txt. Typecheck
         clean.
      4. Create scripts\verify\verify-pi42-006.mjs: standard plus
         the range-integrity and policy-denial-handling tests
         present.
      5. Run: node scripts/verify/verify-pi42-006.mjs
    expected_outputs:
      - packages/contracts/src/agents/intelligence/BEN-INT-05.ts
      - packages/contracts/src/agents/intelligence/BEN-INT-06.ts
      - scripts/verify/verify-pi42-006.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-006.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-007
    phase: build
    description: "BEN-INT-07 (Life Events/Triggers) + BEN-INT-09 (Business/Liquidity Events) as code"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-07.ts: news-driven life/career event detection for
         tracked entities (role changes, retirements, awards,

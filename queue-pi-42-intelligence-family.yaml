  - id: pi42-013
    phase: build
    description: "Family hardening + the ratchet"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. Hardening extensions: (a) injection via a hostile fixture
         bio page ("this individual has committed $10M" planted

  - id: pi42-008
    phase: build
    description: "BEN-INT-08 (Wealth Screening) as code: public-evidence mode with honest confidence"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-08.ts field-for-field - the D-006 implementation:
         tools: edgar (insider positions, proxy compensation,
         ownership stakes), the licensed seam (its calls land on
         NotLicensedError today - the agent HANDLES that as a
         capability gap, recorded in the dossier's basis section,
         never a crash), INT-09/10 outputs via claims, business-
         ownership evidence from filings/webcrawl.
         Its output discipline (schema-enforced): every capacity
         assessment carries evidence_basis (public_evidence |
         licensed_screening), a RANGE (never a point estimate),
         confidence reflecting the basis (public-evidence ranges
         WIDER - the contract's calibration guidance encoded in
         the prompt), and the component evidence itemized (which
         claims support which capacity component).
      2. Vitest: a fixture public-company executive (proxy comp +
         Form 4 history + ownership stake fixtures) yields a
         range-typed capacity with basis public_evidence and
         itemized components; the licensed-seam NotLicensed path
         lands as a recorded gap; a schema attempt at a point
         estimate rejected; when the mock licensed adapter is
         swapped in (pi-13's compile-level mock), the SAME agent
         run yields basis licensed_screening with tighter
         confidence - the drop-in future proven now.
      3. Green; evidence\pi-42\int-08-tests.txt. Typecheck clean.
      4. Create scripts\verify\verify-pi42-008.mjs: standard plus
         the point-estimate rejection and mock-license drop-in
         tests present.
      5. Run: node scripts/verify/verify-pi42-008.mjs
    expected_outputs:
      - packages/contracts/src/agents/intelligence/BEN-INT-08.ts
      - scripts/verify/verify-pi42-008.mjs
    gates:
      - type: command
        run: "node scripts/verify/verify-pi42-008.mjs"
    max_retries: 3
    on_fail: halt

  - id: pi42-009
    phase: build
    description: "BEN-INT-10 (Real Estate/Assets) as code: honest availability"
    prompt: |
      Work in C:\Users\manag\Documents\prospect-intel.

      1. BEN-INT-10.ts: public-record property/asset research -
         county-level property data varies wildly in online
         availability; the agent's design embraces that honestly:
         a jurisdiction-capability layer (which counties/states
         have queryable public records via webcrawl-reachable
         portals - a maintained capability table starting SPARSE
         with the fixture jurisdictions + an AOQ noting commercial
         property-data licensing as the scaling path), findings
         only where records are genuinely reachable, explicit
         coverage gaps in the dossier otherwise (an absent record
         in an uncovered county is UNKNOWN, never "no assets").
      2. Vitest: covered-jurisdiction fixture yields property
         claims with snapshots; uncovered jurisdiction yields the
         typed coverage gap; the UNKNOWN-vs-absent distinction in
         the dossier output.
      3. Green; evidence\pi-42\int-10-tests.txt. Typecheck clean.
      4. Create scripts\verify\verify-pi42-009.mjs: standard plus
         the unknown-vs-absent test present.
      5. Run: node scripts/verify/verify-pi42-009.mjs

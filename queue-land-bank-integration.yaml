- id: landbank-001
  name: Governance sync and land bank opportunity source integration
  prompt: |
    First sync governance docs: $repo = 'C:\Users\manag\Documents\benavora'; $forge = 'C:\Users\manag\Documents\FORGE\projects\benavora'; Get-ChildItem $repo -Filter '*.md' | ForEach-Object { Copy-Item $_.FullName (Join-Path $forge $_.Name) -Force }

    Read src/lib/sources/land-bank-client.ts in FULL if it exists. If missing note it.
    Read src/lib/agents/opportunity-discovery-agent.ts in FULL.
    Read SCHEMA_REGISTRY_v2.md for opportunities table in FULL.

    CREATE or UPGRADE src/lib/sources/land-bank-client.ts with full enterprise implementation:

    Land banks are governmental and quasi-governmental authorities that acquire, manage, and repurpose tax-delinquent and vacant properties. They are CRITICAL funding and partnership sources for housing nonprofits. This client discovers land bank grant programs, RFPs, and partnership opportunities.

    NATIONAL LAND BANK DIRECTORY (hardcoded, authoritative):

    discoverLandBankOpportunities(serviceArea, supabase):
    1. Filter directory by state match OR national entries
    2. For each matching authority: create an opportunity record if not already in DB
    3. Query SAM.gov for CFDA 14.* (HUD) programs: GET https://api.sam.gov/opportunities/v2/search?api_key=SAM-ca328c91-250e-4b51-a4cc-ab90ef5aab7a&q=affordable+housing+land+bank+community+development&postedFrom=[60 days ago]&limit=20
    4. Parse SAM.gov results and add as opportunities with source='sam_gov_land_bank'
    5. Insert all into opportunities table: source='land_bank', funder_type='government', ntee_focus='L'
    6. Return array of created opportunities

    Also create a DEDICATED search function: searchLandBankRFPs(keywords: string[], state: string) that uses Claude web_search to find active RFPs from land bank authorities in real time.

    Update opportunity-discovery-agent.ts:
    In the decision phase where agent chooses strategy: if org NTEE starts with 'L' (housing) OR org programs include 'housing' keyword, ALWAYS include land bank discovery as one of the sources regardless of other strategy choices.
    Call discoverLandBankOpportunities() and merge results into main opportunity set.

    Run pnpm tsc --noEmit. Fix all errors.
    git add -A; git commit -m 'feat: land bank opportunity source -- 20 authorities, SAM.gov HUD query, housing agent integration'; git push.

- id: landbank-002
  name: Land bank UI filter and opportunities page enhancement
  prompt: |
    Read src/app/(dashboard)/opportunities/page.tsx in FULL.
    Read src/lib/sources/land-bank-client.ts in FULL.
    Read src/app/(dashboard)/dashboard/page.tsx first 30 lines for color tokens.

    CRITICAL: inline style={{}} only. Hardcoded hex. Canvas #D6E4F0.

    Upgrade the opportunities page to surface land bank opportunities prominently for housing orgs:

    1. Add "Land Bank" as a source filter option alongside Federal/Foundation/Corporate/State.
       Land Bank badge color: #0F766E (teal-700) bg #F0FDFA.

    2. Add a "Land Bank Spotlight" section at the top of the page (only visible if org NTEE is L or org has housing programs):
       White card, border-radius 14px, padding 20px, left accent bar 4px solid #0F766E.
       Header: "Land Bank & Affordable Housing Funding" with a house icon.
       Subtext: "Specialized opportunities from land bank authorities, HUD programs, and community development funders."
       Shows top 3 land bank opportunities sorted by deadline.
       "Discover More Land Bank Opportunities" button that triggers POST /api/agents/trigger with agentId='ag-02-opportunity-discovery' and hint='land_bank'.

    3. Add "Run Land Bank Discovery" button to the page header (housing orgs only):
       Background #0F766E, white text, calls POST /api/agents/trigger.

    4. Create src/app/api/intelligence/land-banks/route.ts:
       GET: returns all opportunities WHERE source LIKE '%land_bank%' OR funder_type='government' AND title ILIKE '%housing%'
       POST: triggers land bank discovery for authenticated org

    Run pnpm tsc --noEmit. Run pnpm build. Fix all errors.
    git add -A; git commit -m 'feat: land bank UI -- opportunities filter, housing spotlight panel, discovery trigger'; git push.
    npx vercel deploy --prod.
    Report production URL.

  - id: sales-003
    phase: build
    description: "Create automated domain warm-up engine"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\admin\domain-manager.ts completely.

      Create C:\Users\manag\Documents\benavora\src\lib\admin\warmup-engine.ts:

      Export class WarmupEngine:
        Manages the gradual ramp from 5 → 10 → 20 → 50 emails/day per domain.

        Warmup schedule (conservative, reputation-safe):
        Days 1-3: 5 emails/day
        Days 4-7: 10 emails/day
        Days 8-14: 20 emails/day
        Days 15-21: 35 emails/day
        Days 22+: 50 emails/day (target, adjustable per domain)

        - advanceWarmup(domainId: string): Promise<void>
          Called daily by cron. Increments warmup_day. Updates current_daily_limit per schedule.
          If bounce_rate > 3% on any day: freeze at current level for 3 extra days.
          If bounce_rate > 5%: regress one tier.

        - getDailyBudget(domainId: string): Promise<{ remaining: number, limit: number, sent_today: number }>
          Counts sends today (sent_at >= start of today in domain timezone).
          Returns remaining capacity.

        - isWarmupComplete(domainId: string): Promise<boolean>
          True when warmup_day >= 22 and bounce_rate < 2%.

      Create C:\Users\manag\Documents\benavora\src\app\api\cron\domain-warmup\route.ts:
        GET: Cron endpoint. Processes all active domains. Calls advanceWarmup on each.
        Verify CRON_SECRET.
        Should run daily at midnight CT.
    expected_outputs:
      - src/lib/admin/warmup-engine.ts
      - src/app/api/cron/domain-warmup/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


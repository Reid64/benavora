  - id: sales-005
    phase: build
    description: "Create sales campaign engine with staggered multi-domain sending"
    prompt: |
      Read C:\Users\manag\Documents\benavora\src\lib\admin\domain-manager.ts completely.
      Read C:\Users\manag\Documents\benavora\src\lib\admin\warmup-engine.ts completely.
      Read C:\Users\manag\Documents\benavora\src\lib\admin\prospect-manager.ts completely.

      Create C:\Users\manag\Documents\benavora\src\lib\admin\sales-campaign-engine.ts:

      Export class SalesCampaignEngine:
        - createCampaign(config: CampaignConfig): Promise<string>
          Creates campaign with steps. Returns campaign ID.
          CampaignConfig: { name, description, list_id, sending_domain_ids, daily_send_target, send_window_start, send_window_end, send_timezone, filter_criteria, steps: Array<{ subject_template, body_template, delay_days }> }

        - scheduleSends(campaignId: string): Promise<{ scheduled: number }>
          1. Get campaign details and filter criteria.
          2. Query eligible prospects from list (not suppressed, not already enrolled in this campaign, has email, not contacted within 30 days).
          3. For each prospect at step 1:
             a. Calculate send time: random minute within send_window, distributed across sending domains.
             b. Insert into sales_sends with status = 'queued', scheduled_for = calculated time.
          4. For prospects at step 2+: schedule based on delay_days from previous send.
          5. Respect daily_send_target across all domains combined.
          6. Stagger: no more than 2 emails per minute per domain (human-like sending pattern).

        - processQueuedSends(): Promise<SendBatchResult>
          1. Query sales_sends WHERE status = 'queued' AND scheduled_for <= NOW() LIMIT 10.
          2. For each:
             a. Check domain daily budget via WarmupEngine.getDailyBudget. Skip if exhausted.
             b. Check suppression list. Skip and mark suppressed if found.
             c. Render template with prospect variables: {org_name}, {first_name}, {city}, {state}.
             d. Send via Resend API using the domain's encrypted API key.
             e. Update: status = 'sent', sent_at = NOW(), resend_message_id.
             f. Update prospect: last_contacted_at, total_emails_sent++.
             g. Update domain: total_sent++.
          3. Random delay 15-45 seconds between sends (human-like).
          4. Return { sent, failed, skipped_budget, skipped_suppressed }.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\campaigns\route.ts:
        GET: List all sales campaigns with stats. Admin only.
        POST: Create campaign with steps. Admin only.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\campaigns\[id]\route.ts:
        GET: Campaign detail with step stats.
        PATCH: Update campaign (status, config).
        POST with action = 'schedule': Schedule next batch of sends.
        POST with action = 'pause': Pause campaign (mark queued sends as 'cancelled').
        POST with action = 'resume': Resume paused campaign (re-schedule cancelled sends).

      Create C:\Users\manag\Documents\benavora\src\app\api\cron\sales-sends\route.ts:
        GET: Cron endpoint. Calls processQueuedSends(). Runs every 5 minutes during send window.
        Verify CRON_SECRET.
        Set maxDuration = 120.
    expected_outputs:
      - src/lib/admin/sales-campaign-engine.ts
      - src/app/api/admin/campaigns/route.ts
      - src/app/api/admin/campaigns/[id]/route.ts
      - src/app/api/cron/sales-sends/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

  - id: sales-006
    phase: build
    description: "Create auto-unsubscribe parser using Claude agentic system"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\admin\unsubscribe-agent.ts:

      Export class UnsubscribeAgent:
        The agentic unsubscribe system. When prospects reply to campaign emails, this agent reads the reply and determines if it's an unsubscribe request, a positive response, or neutral.

        - classifyReply(emailBody: string, emailSubject: string): Promise<ReplyClassification>
          Calls Claude API (lazy init) with:
          System: "You are analyzing email replies to a sales outreach campaign for a nonprofit SaaS platform. Classify the reply intent. Return ONLY valid JSON: { intent: 'unsubscribe' | 'positive' | 'question' | 'negative' | 'auto_reply' | 'bounce', confidence: number (0-1), reasoning: string }"
          User: "Subject: {subject}\n\nBody: {body}"

          Unsubscribe signals: "unsubscribe", "remove me", "stop emailing", "not interested", "do not contact", "take me off", explicit opt-out language.
          Positive signals: "tell me more", "interested", "let's set up a call", "sounds good", pricing inquiries.
          Auto-reply: out of office, vacation, automatic responses.

        - processIncomingReply(sendId: string, replyBody: string, replySubject: string): Promise<ProcessResult>
          1. Classify the reply.
          2. If unsubscribe (confidence > 0.7):
             a. Add email to suppression_list with reason = 'unsubscribe_reply'.
             b. Mark prospect as suppressed.
             c. Cancel all queued future sends for this prospect across ALL campaigns.
             d. Send confirmation email: "You've been removed from our mailing list. We apologize for the inconvenience."
             e. Update sales_sends: unsubscribed_at = NOW().
          3. If positive:
             a. Mark prospect: has_replied = true.
             b. Pause campaign sequence for this prospect (don't send more automated emails).
             c. Create an alert for admin: "Prospect {org_name} replied positively — follow up manually."
          4. If bounce:
             a. Update domain bounce stats.
             b. Mark send as bounced.
             c. If hard bounce: suppress the email address.
          5. Log classification and action taken.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\webhooks\email-reply\route.ts:
        POST: Webhook endpoint for Resend's inbound email webhook.
        Receives reply events, extracts body/subject, calls processIncomingReply.
        Verify webhook signature via Resend webhook secret.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\webhooks\email-events\route.ts:
        POST: Webhook for Resend delivery events (bounced, complained, delivered, opened).
        Updates sales_sends status accordingly.
        On bounce: call unsubscribe agent for hard bounces.
        On complaint: immediately suppress and add to suppression_list.
    expected_outputs:
      - src/lib/admin/unsubscribe-agent.ts
      - src/app/api/admin/webhooks/email-reply/route.ts
      - src/app/api/admin/webhooks/email-events/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt

  - id: sales-007
    phase: build
    description: "Create CAN-SPAM compliance layer"
    prompt: |
      Create C:\Users\manag\Documents\benavora\src\lib\admin\compliance.ts:

      Export class EmailComplianceEngine:
        CAN-SPAM Act compliance enforcement. Every outbound email MUST pass these checks.

        - enforceCompliance(email: { from: string, to: string, subject: string, body_html: string }): ComplianceResult
          Checks:
          1. From address uses a real, registered sending domain (not spoofed).
          2. Subject line is not deceptive (no RE: or FW: prefix on initial outreach).
          3. Body includes physical mailing address (footer requirement).
          4. Body includes unsubscribe link: "Unsubscribe: https://benavora.com/unsubscribe?email={encoded_email}&token={token}"
          5. From name identifies the sender (not anonymous).
          Returns: { compliant: boolean, violations: string[], modified_body?: string }
          If not compliant, modified_body auto-adds missing footer/unsubscribe.

        - generateUnsubscribeToken(email: string): string
          HMAC-SHA256 of email + secret. Used to verify unsubscribe link authenticity.

        - verifyUnsubscribeToken(email: string, token: string): boolean
          Validates the token matches.

        - getComplianceFooter(fromDomain: string): string
          Returns the physical address + unsubscribe link HTML for email footer.

      Create C:\Users\manag\Documents\benavora\src\app\api\unsubscribe\route.ts:
        GET: Public unsubscribe page. Shows confirmation: "Are you sure you want to unsubscribe {email}?"
        POST: Processes unsubscribe. Verifies token. Adds to suppression_list. Shows confirmation page.
        This is a PUBLIC route — no auth required. The token proves the request is legitimate.

      Update C:\Users\manag\Documents\benavora\src\lib\admin\sales-campaign-engine.ts:
        Import and call enforceCompliance() before every send in processQueuedSends().
        If not compliant and auto-fix fails: skip the send and log the violation.
    expected_outputs:
      - src/lib/admin/compliance.ts
      - src/app/api/unsubscribe/route.ts
    gates:
      - type: compile
      - type: build
    max_retries: 3
    on_fail: halt


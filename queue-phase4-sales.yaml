      Create C:\Users\manag\Documents\benavora\src\lib\admin\auth.ts:
        Export async function requireAdmin(request: Request): Promise<{ userId: string }>
        Checks if the authenticated user has an admin role. For MVP, hardcode Reid's user ID as the admin. Later this should check a platform_admins table.
        Returns user info or throws 403.

      Create C:\Users\manag\Documents\benavora\src\lib\admin\domain-manager.ts:

      Read C:\Users\manag\Documents\benavora\src\lib\email\encryption.ts for the encryption functions.

      Export class DomainManager:
        - addDomain(domain: string, apiKey: string, provider?: string): Promise<SendingDomain>
          Encrypts API key. Inserts into sending_domains. Returns record.

        - verifyDns(domainId: string): Promise<{ verified: boolean, records: DnsRecord[] }>
          Calls Resend API to check DNS verification status for the domain.
          Updates dns_verified in DB.

        - getDomainHealth(domainId: string): Promise<DomainHealth>
          Calculates bounce_rate and complaint_rate from sales_sends.
          Returns health status: 'healthy' (bounce < 2%), 'warning' (2-5%), 'critical' (>5%).
          Updates health_status in DB.

        - getWarmupStatus(domainId: string): Promise<WarmupStatus>
          Returns current warmup day, current limit, sends today.

        - rotateDomain(campaignId: string): Promise<SendingDomain>
          Round-robin selects next healthy, warmed domain for sending.
          Skips domains at daily limit. Returns null if all exhausted.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\domains\route.ts:
        GET: List all sending domains with health stats. Admin only.
        POST: Add new domain. Body: { domain, api_key, provider? }. Admin only.

      Create C:\Users\manag\Documents\benavora\src\app\api\admin\domains\[id]\route.ts:
        GET: Get domain details including warmup history.
        PATCH: Update domain settings (target_daily_limit, is_active).
        DELETE: Deactivate domain (set is_active = false, don't hard delete).
    expected_outputs:

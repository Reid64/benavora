is queue's own pil-knw-03-upgrade prompt, which explicitly preserves that exact behavior). BEN-KNW-04's real job per its mission (\"determine what should remain canonical\") is to RESOLVE those already-open rows -- not to re-scan pil_evidence for divergent values a second time, which would duplicate work BEN-KNW-03 already does.\n\nFIRST, add the `export` keyword to BEN-KNW-03's VERIFICATION_WEIGHT const (src/lib/pil/agents/knw/BEN-KNW-03.ts -- a trivial, additive, non-breaking one-word change to an existing module-private const) and import it here (`import { VERIFICATION_WEIGHT } from \"@/lib/pil/agents/knw/BEN-KNW-03\"`) rather than defining a third independent copy of the same object literal in this codebase (BEN-QLF-04.ts has its own separate copy already -- that one is out of scope for this prompt, do not touch it, only KNW-03's copy needs exporting for this specific reuse).\n\nTwo responsibilities, both required, supporting dual mode exactly like this codebase's other batch-capable PIL agents (context.prospectId set = single-prospect mode, triggered by a fresh contradiction from a delegating agent; context.prospectId null = org-wide periodic batch sweep across all open contradictions for context.orgId):\n\n(1) Contradiction resolution -- query pil_contradictions WHERE organization_id = context.orgId AND resolution_status = 'open' (AND prospect_id = context.prospectId when set). For each open row, load both referenced pil_evidence rows via a direct client.from('pil_evidence').select('*').in('id', [evidence_id_a, evidence_id_b]) query (do not use getEvidence() from src/lib/pil/evidence.ts for this -- it takes a prospectId and returns all of a prospect's evidence, not a lookup by specific ids; document this distinction in a comment). Compute canonicalWeight per side = VERIFICATION_WEIGHT[item.verification_status] * clamp(item.confidence, 0, 1) * (item.freshness_status === 'fresh' ? 1 : item.freshness_status === 'aging' ? 0.7 : 0.4). If side A's weight exceeds sid
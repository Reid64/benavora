- id: pil-knw-03-upgrade
  name: Upgrade BEN-KNW-03 with the 4 missing spec dimensions and a real BEN-KNW-04 hand-off
  prompt: "CRITICAL COMPATIBILITY WARNING -- READ THIS BEFORE TOUCHING ANY CODE: BEN-KNW-03 (Evidence and Provenance Verification Agent, src/lib/pil/agents/knw/BEN-KNW-03.ts, class EvidenceProvenanceAgent) is the single highest-fan-in agent in the entire 47-agent PIL fleet -- per PROSPECT_INTELLIGENCE_AGENTS.md's cross-family observations it is named as a delegation target by roughly 29 distinct call sites: essentially every BEN-REL agent (all 6), every other BEN-QLF agent (all 5, including the ones this same initiative just built/upgraded in queue-pil-qlf-agents.yaml), most of the BEN-INT family, 2 of 4 BEN-STR agents, BEN-DIS-07/08, and both AutoApply BEN-APP-01/03. Other families' own upgrade/build prompts may be landing in parallel with this one, and every one of them assumes BEN-KNW-03's CURRENT public interface keeps working exactly as it does today. This upgrade must be strictly ADDITIVE: the exported class name (EvidenceProvenanceAgent), the execute(context, runner) method signature, every existing field on the EvidenceProvenanceReport interface (prospectId, evidenceScanned, staleFlagged, agingFlagged, contradictionsFound, contradictionsRecorded, tamperingFlagged, unsupportedClaims, evidenceQualityScore), and every existing DB side-effect (pil_evidence.freshness_status updates, pil_contradictions inserts via recordContradiction(), pil_evidence.lineage provenance-hash writes, the best-effort pil_prospect_opportunities.confidence update) must all continue to behave exactly as they do today, unchanged in meaning or type. Add new fields; never rename, remove, or repurpose an existing one.\n\nRead the entire current file first, in full. Registry mission: \"Verify that consequential claims are supported by permissible, traceable evidence.\" Autonomy A3. Cadence: \"Continuous ... + on-demand from BEN-SUP-05.\" Spec dimensions: Claim Support; Source Directness; Source Independence; Permissibility; Freshness; Lineage Completeness -- the current implementation only really covers Freshness (staleness scan) and Lineage Completeness (provenance hash) directly, plus an interim contradiction-detection scan its own header comment explicitly documents as borrowed scope: \"BEN-KNW-04 Contradiction & Freshness Investigator (contradiction detection/resolution) ... this agent implements BEN-KNW-03's real mission plus BEN-KNW-04's contradiction-detection duty ... A standalone BEN-KNW-04 ... remains unimplemented.\" A real BEN-KNW-04 is being built in this same queue file's own pil-knw-04-build prompt (the last prompt in this file). This upgrade does two things: adds the 4 missing dimensions as new additive report fields, and starts handing the contradiction-investigation duty forward to BEN-KNW-04 while KEEPING the existing detection scan exactly as-is (do not remove detectContradiction()/recordContradiction() -- BEN-KNW-04's real job per spec is investigating and RESOLVING already-open pil_contradictions rows, not re-detecting them from scratch, so removing this file's own detection would leave nothing populating the queue BEN-KNW-04 consumes).\n\nPRESERVE EXACTLY: DEFAULT_TTL_HOURS/TTL_HOURS_BY_SOURCE_TYPE, the staleness scan loop and its pil_evidence.freshness_status writes, the full detectContradiction()/recordContradiction() loop and its pil_evidence.contradiction_status writes, the provenance-hash verification loop and its pil_evidence.lineage writes, scoreEvidenceQuality()'s existing stalePenalty/contradictionPenalty terms, and tryUpdateOpportunityConfidence(). The existing unit test (\"flags evidence older than its source's TTL as stale\") must keep passing unmodified, including its exact staleFlagged assertion.\n\nNEW additive dimension scores on EvidenceProvenanceReport (add all 4, do not remove anything): claimSupportScore (0-100) -- percentage of scanned evidence items with a non-null, non-empty evidence_excerpt (evidence with no excerpt at all cannot be said to directly support its own claim); document this as a deliberately conservative presence-based heuristic, not full NLP entailment checking, which is out of scope for this file's existing architecture. sourceDirectnessScore (0-100) -- percentage-weighted by a documented source_type directness tier map reusing exactly the source_type vocabulary already enumerated in this file's own TTL_HOURS_BY_SOURCE_TYPE constant (do not invent new source_type values): irs_form_990/sec_edgar/nonprofit_filing = 100 (\"primary/official filing\"), foundation_information/corporate_information/public_records = 70 (\"secondary official\"), news = 50 (\"secondary reported\"), open_web = 30 (\"tertiary/unverified web\"), crm/internal = 40 (\"first-party unverified\"); any source_type not in this map defaults to 30. sourceIndependenceScore (0-100) -- for each claim_type group with 2 or more evidence items, the fraction with a distinct publisher (falling back to distinct source_url domain when publisher is null); average across claim_type groups that have 2+ items; groups with exactly 1 item are excluded from this average entirely (documented as \"independence undefined for single-source claims\" -- do not score them as 0, since single-source evidence is already penalized via VERIFICATION_WEIGHT and double-penalizing would distort evidenceQualityScore). permissibilityFlagged (string[] of evidence ids) -- cross-reference each scanned evidence item's source_type against pil_source_registry rows sharing that same source_type (read supabase/migrations/157_pil_source_registry.sql first -- there is NO direct foreign key from pil_evidence to a specific pil_source_registry row in the applied schema, so this is necessarily a best-effort source_type-level check, not a per-row check; document this limitation explicitly in a header comment matching this file's existing \"Schema notes\" comment style). Flag an evidence item only when its source_type has at least one pil_source_registry row with permissibility_status='prohibited'; an evidence item whose source_type has zero matching pil_source_registry rows at all is NOT flagged (unknown is not the same as prohibited -- document this as intentionally conservative).\n\nExtend scoreEvidenceQuality() additively: multiply the existing formula by one new term, (1 - 0.5 * permissibilityPenalty) where permissibilityPenalty = permissibilityFlagged.length / evidence.length, using the exact same 0.5-weight convention the existing stalePenalty/contradictionPenalty terms already use -- do not change the existing stalePenalty or contradictionPenalty terms in any way. Before finishing, manually re-run the existing staleness test's fixture through your updated formula and confirm the resulting evidenceQualityScore is numerically IDENTICAL to the pre-upgrade value, since that fixture has zero permissibilityFlagged items (permissibilityPenalty=0 leaves the new term equal to 1, a no-op) -- this is your proof the upgrade is behavior-preserving for the existing test.\n\nNEW: after the existing detectContradiction()/recordContradiction() loop, if contradictionsRecorded > 0 this run, push a DelegationRequest to BEN-KNW-04 (objective naming this prospect id and the specific claim_types that contradicted) so BEN-KNW-04 picks up the newly-opened pil_contradictions rows for resolution once it exists; if BEN-KNW-04 is not yet registered in AGENT_FACTORIES when this prompt runs, this delegation fires harmlessly into the graceful NotImplementedAgent fallback (src/lib/pil/agents/index.ts), the same established convention already relied on elsewhere in this codebase -- do not skip or special-case it based on registration status.\n\nNEW: push a DelegationRequest to BEN-SUP-05 (critic) whenever tamperingFlagged.length > 0 OR permissibilityFlagged.length > 0 this run -- provenance tampering or a prohibited-source claim feeding canonical state is exactly the class of event BEN-SUP-05 exists to independently review; objective naming the specific flagged evidence ids.\n\nExtend the existing BEN-KNW-03 describe block in src/__tests__/unit/pil-qlf-knw-agents.test.ts (do not touch the existing passing test) with new tests: (1) claimSupportScore/sourceDirectnessScore/sourceIndependenceScore computed correctly on a representative multi-item fixture, (2) permissibilityFlagged populated when a pil_source_registry mock row has permissibility_status='prohibited' for a matching source_type, (3) a regression test asserting the existing staleness fixture's evidenceQualityScore value is numerically unchanged from before this upgrade (hard-code the pre-upgrade expected value you computed by hand, or restructure to compute-then-compare -- document which approach you took and why in a comment on the test).\n\nNo AGENT_FACTORIES change needed (BEN-KNW-03 already registered) -- re-read src/lib/pil/agents/index.ts after your edit to confirm.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (the real Agent interface -- `class X implements Agent`, NOT `extends BaseAgent`, which does not exist anywhere in this codebase -- plus the AgentContext/AgentResult/DelegationRequest interfaces and how AgentRunner.run() executes delegations fire-and-forget via canDelegate()+this.delegate(), decrementing context.depth by 1 per hop and marking a run 'escalated' rather than executing delegations once depth<=0 -- this is the existing hard backstop against runaway mutual delegation, so confirmed cycles like BEN-QLF-04<->BEN-REL-06 and BEN-KNW-02<->BEN-KNW-04 are already safe without new guard code). Study src/lib/pil/agents/qlf/BEN-QLF-04.ts in full -- the real, dense, ~290-line reference implementation every other PIL agent in this repo is told to study: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, a completed({}, reason) early-return convention for missing prospectId/prospect-not-found, and a delegations array in the returned AgentResult used to chain into follow-on agents (e.g. its existing delegation to BEN-SUP-05 for critic review on Tier 1/2 classifications) -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the real 'chain-it' pattern in this codebase's actual agent architecture. Also read src/lib/pil/agents/index.ts in full -- the real registry is an AGENT_FACTORIES map inside that single file (there is NO separate AGENT_FACTORIES.ts file); every new or changed agent must be imported and present in that map, and unregistered agent_ids already resolve gracefully to NotImplementedAgent, which is why forward-delegating to a sibling that may not be registered yet in a parallel queue run is safe and already an established pattern in this codebase (see BEN-KNW-01.ts's own header comment on its existing BEN-KNW-04 delegation).\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) -- quoted per-agent above -- backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md, which are unrelated general-purpose governance docs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code for full behavioral detail beyond the one-line mission text. Every agent must be a real, substantive implementation matching the ~250-300+ line depth of BEN-QLF-04 -- real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, never a thin wrapper that just calls Claude and returns its raw text. Where an LLM call is genuinely useful (a short narrative rationale field, for example), use the exact lazy tryModelTokens(context, runner, units) pattern already established in BEN-QLF-0
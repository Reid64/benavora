# queue-pil-knw-agents.yaml
# FORGE 1.0 queue -- 4 sequential prompts covering the Knowledge-Integrity (KNW) family.
# BEN-KNW-01/02/03 already exist at src/lib/pil/agents/knw/BEN-KNW-0{1,2,3}.ts and are UPGRADED in
# place by the first 3 prompts. BEN-KNW-04 does not exist yet and is BUILT NEW to the same
# ~250-300+ line depth by the last prompt. BEN-KNW-03 is the fleet's single highest-fan-in agent
# (~29 call sites across nearly every other family per PROSPECT_INTELLIGENCE_AGENTS.md) -- its
# upgrade prompt (pil-knw-03-upgrade) opens with an explicit compatibility warning and is strictly
# additive. BEN-KNW-02<->BEN-KNW-04 is a confirmed mutual delegation cycle per PIL_AGENT_
# DEPENDENCIES.yaml; AgentRunner's existing depth<=0 => 'escalated' behavior (src/lib/pil/
# agent-runner.ts) is the real backstop against runaway mutual delegation, so no new guard code is
# introduced for it. Every new delegation added by this queue to an agent_id that might not be
# registered yet at run time resolves gracefully to NotImplementedAgent (src/lib/pil/agents/
# index.ts) -- the same established convention BEN-KNW-01.ts already relies on today for its
# existing BEN-KNW-04 delegation, so within-file execution order here is a convenience, not a hard
# requirement.
project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: pil-knw-01-upgrade
  name: Upgrade BEN-KNW-01 to wire real BEN-KNW-02 BEN-KNW-03 BEN-SUP-05 hand-offs
  prompt: "Upgrade BEN-KNW-01 -- Prospect Digital Twin Agent IN PLACE (src/lib/pil/agents/knw/BEN-KNW-01.ts already exists -- same file path, same class name ProspectDigitalTwinAgent, same agent_id). Read the entire current file first, in full, before changing anything. Registry mission: \"Maintain the living structured representation of each prospect.\" Autonomy A3. Cadence: \"Continuous (updates on every accepted write from any Family 3/4/5/6 agent).\" Spec dimensions: Entity State; Claims And Evidence; Relationships; Opportunities; Temporal Versions; Conflicts And Uncertainty. Per PIL_AGENT_DEPENDENCIES.yaml this agent's fuller depends_on list is [BEN-KNW-02, BEN-KNW-03, BEN-KNW-04, BEN-SUP-05] -- the current implementation only wires the BEN-KNW-04 leg (on field-conflict detection); this upgrade adds the other three.\n\nPRESERVE EXACTLY, DO NOT REGRESS: the existing conflict-checked field set (biography, giving_history, wealth_indicators, affinity, capacity), the existing materiallyDifferent()/isEmptyValue() helpers, the existing twin_version increment logic, the existing BEN-KNW-04 delegation on any conflicted field, and the existing find-or-insert upsert into pil_prospect_digital_twins. The existing unit test in src/__tests__/unit/pil-qlf-knw-agents.test.ts (\"keeps the prior biography and delegates to BEN-KNW-04 when new evidence conflicts with the canonical twin\") must keep passing completely unmodified -- run it explicitly as part of your incremental checkpoint below.\n\nNEW: delegate to BEN-KNW-02 (Entity Resolution) when this run is building a prospect's FIRST digital twin (existingTwin is null) and a lightweight same-organization fuzzy-name scan turns up at least one other pil_prospects row that looks like a possible duplicate. Read src/lib/pil/agents/knw/BEN-KNW-02.ts in full first and export its normalizeName()/nameSimilarity() functions (add `export` to both -- trivial, additive, non-breaking) so this file can import and reuse the exact same token-overlap heuristic rather than re-implementing string matching a second time; this agent's own duplicate scan should stay intentionally light (query other active pil_prospects rows in the same organization_id with the same entity_type, then run nameSimilarity() against each candidate's canonical_name, threshold 0.5) -- BEN-KNW-02 itself does the real, authoritative resolution work; this is only a trigger. DelegationRequest objective text should name both candidate prospect ids and describe this as a first-twin duplicate check.\n\nNEW: delegate to BEN-KNW-03 (Evidence and Provenance Verification) whenever this run's evidence set includes at least one item with verification_status IN ('unverified', 'single_source_fact') feeding one of the 5 conflict-checked fields -- objective text naming the specific evidence ids and claim_types. This does not block the twin write (the twin still gets this run's proposed values, exactly as today) -- it is a forward, advisory delegation requesting verification before the NEXT run trusts this data further, the same fire-and-forget convention as the existing BEN-KNW-04 delegation.\n\nNEW: delegate to BEN-SUP-05 (critic) whenever completeness_score crosses upward through 0.7 for the first time this run (existingTwin's prior completeness_score < 0.7 AND this run's newly computed completeness_score >= 0.7), OR whenever the capacity field is materiallyDifferent() from the prior twin's capacity field (reuse the existing materiallyDifferent() helper -- do not write a second comparison function) -- both are the twin becoming consequential enough for downstream qualification to matter, the same spirit as BEN-QLF-04's own Tier 1/2 BEN-SUP-05 delegation in src/lib/pil/agents/qlf/BEN-QLF-04.ts (read that pattern for the exact DelegationRequest shape: childAgentCode, objective, maxAutonomy: \"A2\", constraints).\n\nExtend the existing BEN-KNW-01 describe block in src/__tests__/unit/pil-qlf-knw-agents.test.ts (do not touch the existing passing test) with 2 new tests: (1) the BEN-KNW-02 delegation fires when a fuzzy-duplicate canonical_name exists in the same organization and no twin exists yet for this prospect, (2) the BEN-SUP-05 delegation fires when completeness_score crosses the 0.7 threshold upward between the prior twin and this run.\n\nNo AGENT_FACTORIES change needed (BEN-KNW-01 already registered) -- re-read src/lib/pil/agents/index.ts after your edit to confirm.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (the real Agent interface -- `class X implements Agent`, NOT `extends BaseAgent`, which does not exist anywhere in this codebase -- plus the AgentContext/AgentResult/DelegationRequest interfaces and how AgentRunner.run() executes delegations fire-and-forget via canDelegate()+this.delegate(), decrementing context.depth by 1 per hop and marking a run 'escalated' rather than executing delegations once depth<=0 -- this is the existing hard backstop against runaway mutual delegation, so confirmed cycles like BEN-QLF-04<->BEN-REL-06 and BEN-KNW-02<->BEN-KNW-04 are already safe without new guard code). Study src/lib/pil/agents/qlf/BEN-QLF-04.ts in full -- the real, dense, ~290-line reference implementation every other PIL agent in this repo is told to study: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, a completed({}, reason) early-return convention for missing prospectId/prospect-not-found, and a delegations array in the returned AgentResult used to chain into follow-on agents (e.g. its existing delegation to BEN-SUP-05 for critic review on Tier 1/2 classifications) -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the real 'chain-it' pattern in this codebase's actual agent architecture. Also read src/lib/pil/agents/index.ts in full -- the real registry is an AGENT_FACTORIES map inside that single file (there is NO separate AGENT_FACTORIES.ts file); every new or changed agent must be imported and present in that map, and unregistered agent_ids already resolve gracefully to NotImplementedAgent, which is why forward-delegating to a sibling that may not be registered yet in a parallel queue run is safe and already an established pattern in this codebase (see BEN-KNW-01.ts's own header comment on its existing BEN-KNW-04 delegation).\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) -- quoted per-agent above -- backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md, which are unrelated general-purpose governance docs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code for full behavioral detail beyond the one-line mission text. Every agent must be a real, substantive implementation matching the ~250-300+ line depth of BEN-QLF-04 -- real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, never a thin wrapper that just calls Claude and returns its raw text. Where an LLM call is genuinely useful (a short narrative rationale field, for example), use the exact lazy tryModelTokens(context, runner, units) pattern already established in BEN-QLF-04.ts (context.tools.includes(\"T-MODEL\") guard + runner.useTool(context, \"T-MODEL\", {unitCost, units, costType: \"model_tokens\"}) with a try/catch returning 0 on failure) rather than inventing a new client pattern -- keep every scoring/decision path itself fully deterministic and testable without a live model call.\n\nMANDATORY CLOSE-OUT (do all four, in order, exactly as this repo's other PIL prompts require): 1. Run an incremental test checkpoint now: `pnpm tsc --noEmit` must show 0 errors relative to files this prompt touched -- fix any errors before continuing. Then run `pnpm test:unit` (this repo's real vitest command -- `pnpm test` runs Playwright e2e specs instead and is not the right check for these unit tests) scoped to the test file(s) this prompt touched and confirm they pass; fix any failures before continuing. 2. Run `pnpm run build` -- fix ALL errors before proceeding; do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit; `tsc --noEmit` alone does not catch the build-time ESLint pass `next build` runs). 3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (scoring logic, persistence targets, delegation conditions) is actually present in the code, not just that it compiles -- this repo's own history has real cases of tsc/build passing while nothing behavioral actually changed. 4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which PIL agent codes this prompt upgraded and BEN-KNW-01 (wiring real BEN-KNW-02/BEN-KNW-03/BEN-SUP-05 hand-offs alongside the existing BEN-KNW-04 one), their AGENT_FACTORIES registration status verified by re-reading src/lib/pil/agents/index.ts, and the updated X/48 PIL agent completion count computed from an actual count of AGENT_FACTORIES entries, never from memory) -- pull the actual current state from the files/commands you just ran. Update SESSION_STATE.md with the current phase and next action. Do NOT run `npx vercel deploy --prod` or `curl` against any live URL as part of this close-out -- that is out of scope for this prompt."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/lib/pil/agents/knw/BEN-KNW-01.ts
    - src/lib/pil/agents/knw/BEN-KNW-02.ts
    - src/__tests__/unit/pil-qlf-knw-agents.test.ts
- id: pil-knw-02-upgrade

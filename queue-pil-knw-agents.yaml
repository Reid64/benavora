  prompt: "Upgrade BEN-KNW-02 -- Entity Resolution Agent IN PLACE (src/lib/pil/agents/knw/BEN-KNW-02.ts already exists -- same file path, same class name EntityResolutionAgent, same agent_id -- this is the fleet's shared identity-resolution service, the second-highest fan-in agent in the entire 47-agent fleet per PROSPECT_INTELLIGENCE_AGENTS.md's cross-family observations, 14 named call sites: BEN-KNW-01, BEN-KNW-04, 6 of the 10 BEN-INT agents, BEN-REL-01/03, and 4 of the 8 BEN-DIS agents). Read the entire current file first, in full, before changing anything. Registry mission: \"Reason through ambiguous identities and determine whether records refer to the same entity.\" Autonomy A3. H1 human boundary already coded exactly: \"Any merge that would materially change a prospect's giving-history attribution or capacity classification\" routes to human review before executing, even at A3. Spec dimensions: Candidate Identities; Stable Identifiers; Name/Address/Role Discriminators; Negative Evidence; Merge/Split Risk; Identity Confidence. Per PIL_AGENT_DEPENDENCIES.yaml this agent's fuller depends_on list is [BEN-KNW-03, BEN-KNW-04, BEN-SUP-05] (BEN-KNW-04 is a confirmed MUTUAL cycle -- KNW-02 depends on KNW-04 and KNW-04 depends on KNW-02) -- the current implementation has zero delegations at all (`delegations: []` is hardcoded in every return path); this upgrade adds all three.\n\nPRESERVE EXACTLY, DO NOT REGRESS: AUTO_MERGE_THRESHOLD (0.95), HUMAN_REVIEW_THRESHOLD (0.7), SENSITIVE_CLAIM_TYPES-driven H1 human-review gate, the exact matchScore formula (einMatch shortcut to 0.97, else nameSim*0.3 + emailDomainMatch*0.15 + orgOverlapRatio*0.25 + crmMatch*0.15), executeMerge()'s node-reassignment plus pil_identity_resolution_log write, and upsertCandidate()'s find-or-insert-by-sorted-pair-id logic. The existing unit test in src/__tests__/unit/pil-qlf-knw-agents.test.ts (\"auto-merges two prospects with identical EIN\") must keep passing completely unmodified, including its explicit assertion that createReviewItem was NOT called for that non-sensitive case -- run it explicitly as part of your incremental checkpoint below.\n\nNEW: delegate to BEN-KNW-04 (Contradiction and Freshness Investigator) whenever an auto-merge actually executes this run (status==='match' && merged===true) -- this is the concrete, spec-grounded reason BEN-KNW-02 and BEN-KNW-04 mutually depend on each other: merging two previously-independent prospects can create NEW contradictions between their combined evidence sets for the same claim_type that did not exist while the two prospects were separate (each side's evidence was independently non-contradictory on its own). Do NOT have this file re-implement any contradiction-detection logic itself -- just delegate the check to BEN-KNW-04 with an objective naming the surviving and absorbed prospect ids and asking it to scan the merged entity's evidence for newly-adjacent contradictions. BEN-KNW-04 is being built in this same queue file's own pil-knw-04-build prompt (order in this file: 01-upgrade, 02-upgrade, 03-upgrade, then 04-build) -- if it has not run yet when this prompt executes, the delegation still fires harmlessly into the graceful NotImplementedAgent fallback path (src/lib/pil/agents/index.ts), the same established convention BEN-KNW-01.ts already relies on.\n\nNEW: delegate to BEN-KNW-03 (Evidence and Provenance Verification) before accepting any match whose deciding signal was weak -- specifically when einMatch===false AND nameSim<0.5 (meaning the match score leaned mainly on crmMatch and/or emailDomainMatch alone, the two weakest signals in the existing formula) -- objective naming both prospect ids and asking for a provenance check on the alias evidence (crm_id/email aliases) that drove the match before it is trusted for merge.\n\nNEW: delegate to BEN-SUP-05 (critic) on EVERY executed auto-merge, unconditionally -- this is IN ADDITION TO, not instead of, the existing sensitive-attribution H1 human-review gate (a merge with giving_history/wealth_capacity evidence gets BOTH the existing createReviewItem() call AND this new BEN-SUP-05 delegation; a merge without sensitive evidence gets only the new BEN-SUP-05 delegation, since per spec identity merges are always consequential/near-irreversible enough to warrant independent critic review even when they don't trigger the narrower H1 sensitive-attribution boundary).\n\nExtend the existing BEN-KNW-02 describe block in src/__tests__/unit/pil-qlf-knw-agents.test.ts (do not touch the existing passing test's assertions) by adding new assertions to that SAME test (or a new test using the same fixture) confirming result.delegations now contains entries for both BEN-KNW-04 and BEN-SUP-05 after the EIN auto-merge -- this is a compatible extension of the existing scenario, not a conflicting change, since the existing test's createReviewItem-not-called assertion is about the H1 human-review path, not the new BEN-SUP-05 delegation path.\n\nNo AGENT_FACTORIES change needed (BEN-KNW-02 already registered) -- re-read src/lib/pil/agents/index.ts after your edit to confirm.\n\nPATTERN TO FOLLOW (read these real files in full before writing anything): src/lib/pil/agent-runner.ts (the real Agent interface -- `class X implements Agent`, NOT `extends BaseAgent`, which does not exist anywhere in this codebase -- plus the AgentContext/AgentResult/DelegationRequest interfaces and how AgentRunner.run() executes delegations fire-and-forget via canDelegate()+this.delegate(), decrementing context.depth by 1 per hop and marking a run 'escalated' rather than executing delegations once depth<=0 -- this is the existing hard backstop against runaway mutual delegation, so confirmed cycles like BEN-QLF-04<->BEN-REL-06 and BEN-KNW-02<->BEN-KNW-04 are already safe without new guard code). Study src/lib/pil/agents/qlf/BEN-QLF-04.ts in full -- the real, dense, ~290-line reference implementation every other PIL agent in this repo is told to study: a class implementing Agent, an execute(context, runner) method returning AgentResult, real Supabase reads/writes via getPilClient() against pil_* tables, real use of getEvidence()/logAction()/createReviewItem() from src/lib/pil/{evidence,audit,human-review}.ts, a documented header comment explaining how this mission maps to the registry spec, a completed({}, reason) early-return convention for missing prospectId/prospect-not-found, and a delegations array in the returned AgentResult used to chain into follow-on agents (e.g. its existing delegation to BEN-SUP-05 for critic review on Tier 1/2 classifications) -- this delegations-array mechanism, not any FORGE queue-chaining feature, is the real 'chain-it' pattern in this codebase's actual agent architecture. Also read src/lib/pil/agents/index.ts in full -- the real registry is an AGENT_FACTORIES map inside that single file (there is NO separate AGENT_FACTORIES.ts file); every new or changed agent must be imported and present in that map, and unregistered agent_ids already resolve gracefully to NotImplementedAgent, which is why forward-delegating to a sibling that may not be registered yet in a parallel queue run is safe and already an established pattern in this codebase (see BEN-KNW-01.ts's own header comment on its existing BEN-KNW-04 delegation).\n\nMission/spec source of truth is supabase/migrations/155_pil_agent_registry.sql's INSERT INTO pil_agent_registry rows (name, mission, default_autonomy_level, human_boundary, cadence columns) -- quoted per-agent above -- backed by PROSPECT_INTELLIGENCE_AGENTS.md (the spec_ref column points there, NOT AGENTS.md/AGENTS_v2.md, which are unrelated general-purpose governance docs). Read the relevant section of PROSPECT_INTELLIGENCE_AGENTS.md for each agent code for full behavioral detail beyond the one-line mission text. Every agent must be a real, substantive implementation matching the ~250-300+ line depth of BEN-QLF-04 -- real scoring/decision logic grounded in actual pil_evidence/pil_graph_edges/pil_prospect_opportunities data, never a thin wrapper that just calls Claude and returns its raw text. Where an LLM call is genuinely useful (a short narrative rationale field, for example), use the exact lazy tryModelTokens(context, runner, units) pattern already established in BEN-QLF-04.ts (context.tools.includes(\"T-MODEL\") guard + runner.useTool(context, \"T-MODEL\", {unitCost, units, costType: \"model_tokens\"}) with a try/catch returning 0 on failure) rather than inventing a new client pattern -- keep every scoring/decision path itself fully deterministic and testable without a live model call.\n\nMANDATORY CLOSE-OUT (do all four, in order, exactly as this repo's other PIL prompts require): 1. Run an incremental test checkpoint now: `pnpm tsc --noEmit` must show 0 errors relative to files this prompt touched -- fix any errors before continuing. Then run `pnpm test:unit` (this repo's real vitest command -- `pnpm test` runs Playwright e2e specs instead and is not the right check for these unit tests) scoped to the test file(s) this prompt touched and confirm they pass; fix any failures before continuing. 2. Run `pnpm run build` -- fix ALL errors before proceeding; do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 -- this is the only real gate this repo tier has, nothing downstream blocks a bad commit; `tsc --noEmit` alone does not catch the build-time ESLint pass `next build` runs). 3. Verify what you built actually works: re-read every file you changed and confirm the described behavior (scoring logic, persistence targets, delegation conditions) is actually present in the code, not just that it compiles -- this repo's own history has real cases of tsc/build passing while nothing behavioral actually changed. 4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (which PIL agent codes this prompt upgraded and BEN-KNW-02 (wiring the confirmed mutual BEN-KNW-04 cycle plus BEN-KNW-03/BEN-SUP-05 hand-offs, replacing the previously-hardcoded empty delegations array), their AGENT_FACTORIES registration status verified by re-reading src/lib/pil/agents/index.ts, and the updated X/48 PIL agent completion count computed from an actual count of AGENT_FACTORIES entries, never from memory) -- pull the actual current state from the files/commands you just ran. Update SESSION_STATE.md with the current phase and next action. Do NOT run `npx vercel deploy --prod` or `curl` against any live URL as part of this close-out -- that is out of scope for this prompt."

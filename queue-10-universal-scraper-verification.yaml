project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - UNIVERSAL_SCRAPER_PRD.md
  - STATE_OF_THE_BUILD.md
  - STANDING_DIRECTIVES.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"

prompts:
  - id: q10-001
    phase: verify
    description: "Confirm ANTHROPIC_API_KEY is valid before any further scraper testing"
    prompt: |
      Before running anything else, confirm ANTHROPIC_API_KEY in .env.local is valid by making a minimal
      real API call (a trivial message request). Report success or the exact error. If invalid, stop this
      queue and report clearly rather than letting downstream prompts fail on the same root cause repeatedly.
    gates:
      - type: compile
    max_retries: 1
    on_fail: halt

  - id: q10-002
    phase: verify
    description: "Run uscraper-007 templates for real, confirm actual database writes"
    prompt: |
      Per BUILD_FAILURE_ROOT_CAUSE_AUDIT.md and prior session findings, the uscraper-007 re-platformed
      foundation/nonprofit scraper templates (job-store.ts, templates/, run-*-template.ts) were built and
      compiled but never actually run — the claimed "verified against real batch with DB writes confirmed"
      was never true. Run them now for real, against a small batch (20-30 records).
      Before running: query scrape_jobs/scrape_results row counts. After running: query again and report
      the real delta. This is the actual verification the original prompt asked for and never got.
      git add -A; git commit -m 'test(scraper-v2): live-verify uscraper-007 templates with real DB write confirmation'; git push
    gates:
      - type: compile
    max_retries: 3
    on_fail: continue

  - id: q10-003
    phase: verify
    description: "Run universal scraper CLI against 2 new arbitrary keywords to re-prove generality"
    prompt: |
      Run pnpm scrape:universal against 2 keywords genuinely unrelated to nonprofits/foundations/corporate
      giving (pick 2 new ones, different from any used in prior testing). Report real discovered URLs,
      real fetched content, real extracted structured JSON for each. This re-confirms the system is
      actually general-purpose, not narrowly tuned to whatever was tested before.
      git add -A; git commit -m 'test(scraper-v2): re-verify universal scraper generality against new keywords'; git push
    gates:
      - type: compile
    max_retries: 2
    on_fail: continue

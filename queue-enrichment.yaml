  # ============================================================
  # PROMPT 9: FOUNDATION DIRECTORY REBUILD
  # ============================================================

  - id: enrich-009
    phase: build
    description: "Create foundation directory rebuild utility and IRS BMF re-import script"
    prompt: |
      Read the foundation_directory table schema completely.

      Create C:\Users\manag\Documents\benavora\scripts\rebuild-foundations.ts:

      A CLI script that:
      1. Backs up the current foundation_directory to a CSV file (safety net).
      2. Truncates foundation_directory (or deletes all records — check for FK constraints first).
      3. Re-imports from IRS BMF CSV files.
         IRS BMF files are at: https://www.irs.gov/pub/irs-soi/eo_XX.csv (XX = state code)
         Files are HEADERLESS — 28 columns with known positions:
         0=EIN, 1=name, 2=ICO, 3=street, 4=city, 5=state, 6=zip, 14=subsection_code, 15=foundation_type, 17=organization_type, 18=status, 24=ntee_code, 25=ruling_date
         Also: revenue is at position 21 (if available in BMF), asset_amount at position 22.
      4. For each row: INSERT into foundation_directory with: ein, name, city, state, zip, subsection_code, foundation_type, organization_type, status, ntee_code, ruling_date, revenue_amount, asset_amount.
      5. Deduplicates by EIN (skip if already inserted).
      6. Logs progress every 10,000 records.
      7. After import: creates an enrichment job record for the full table with status = 'queued'.

      Usage: npx tsx scripts/rebuild-foundations.ts --states "AL,AK,AZ,AR,CA,CO,CT,DE,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY,DC"

      NOTE: The BMF data has carriage return issues on some columns. Trim all values. Handle encoding issues.

      Create C:\Users\manag\Documents\benavora\scripts\import-prospects.ts:

      Similar CLI script for importing the 298K nonprofit prospect CSV from DATAOCEAN:
      1. Reads CSV from a specified file path.
      2. Inserts into prospects table (migration 055 must be applied first).
      3. Maps CSV columns to table columns.
      4. Dedup by EIN.
      5. Creates enrichment job for the prospects table.

      Usage: npx tsx scripts/import-prospects.ts --file "D:\nonprofits.csv"
    expected_outputs:
      - scripts/rebuild-foundations.ts
      - scripts/import-prospects.ts
    gates:
      - type: compile
    max_retries: 3
    on_fail: halt

  # ============================================================
  # PROMPT 10: BUILD VERIFICATION + GOVERNANCE
  # ============================================================

  - id: enrich-010
    phase: build

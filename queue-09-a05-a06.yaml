governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
project: Tarritrix
prompts:
- id: a05-001
  name: A-05 Page Validator Schema Verification
  prompt: "Read AGENTS.md entry for A-05 Page Validator in full. Read SCHEMA_REGISTRY.md for page_validation_results table. Read BEHAVIORAL_CONTRACTS.md Contract 86.\n\nSTEP 1 - Verify page_validation_results table exists. If not write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728200000_a05_validation_results.sql:\nCREATE TABLE IF NOT EXISTS page_validation_results (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, validation_run_at TIMESTAMPTZ NOT NULL DEFAULT now(), gates_passed INTEGER NOT NULL DEFAULT 0, gates_failed INTEGER NOT NULL DEFAULT 0, gate_results JSONB NOT NULL DEFAULT '{}', overall_status TEXT CHECK (overall_status IN ('pass','fail','partial')) NOT NULL DEFAULT 'fail', error_codes TEXT[] DEFAULT '{}', agent_event_id UUID, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_page_validation_page ON page_validation_results(page_id);\nCREATE INDEX IF NOT EXISTS idx_page_validation_client ON page_validation_results(client_id);\nALTER TABLE page_validation_results ENABLE ROW LEVEL SECURITY;\nCREATE POLICY pvr_operator ON page_validation_results FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push. Report result.\n\nSTEP 2 - Read existing src\\lib\\agents\\a-05-page-validator.ts if it exists. Report what gates are already implemented.\n\nSTEP 3 - pnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-05 page_validation_results schema migration'; git push origin main. Report commit hash and what currently exists in a-05-page-validator.ts."
  gates:
  - type: compile

- id: a05-002
  name: A-05 Page Validator 15 Gates Implementation
  prompt: "Read AGENTS.md A-05 entry in full. Read BLUEPRINT.md section 'A-05 PAGE VALIDATOR -- 15 GATES'. Read existing src\\lib\\agents\\a-05-page-validator.ts in full.\n\nRewrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-05-page-validator.ts\nExtends BaseAgent. Input Zod schema: { client_id: z.string().uuid(), page_id: z.string().uuid() }. Output: { gates_passed: z.number(), gates_failed: z.number(), gate_results: z.record(z.string(), z.object({ passed: z.boolean(), error_code: z.string().optional(), details: z.string().optional() })), overall_status: z.enum(['pass','fail','partial']), error_codes: z.array(z.string()) }.\n\nImplement all 15 gates. Read page from pages table (verify column names against SCHEMA_REGISTRY.md). For each gate:\nG1 - page has generated_content field not null and not empty\nG2 - generated_content length > 500 chars\nG3 - page has a title (h1 present in content)\nG4 - page has meta description (check pages table or generated_content metadata)\nG5 - contact affordance present: generated_content contains tel: or form element\nG6 - TCPA disclaimer present: generated_content contains 'TCPA' or consent text\nG7 - city and service mentioned in content\nG8 - Evidence gate via checkEvidenceGate from src/lib/governance/evidence-gate.ts\nG9 - no placeholder text: content does not contain '[CLIENT_NAME]' or 'PLACEHOLDER' or 'TODO'\nG10 - internal link present: content contains href that starts with / (relative link)\nG11 - schema markup present: content contains 'application/ld+json'\nG12 - page slug is URL-safe: no spaces or special chars\nG13 - client brand voice check: if client_brand_voice_model exists for client verify content is not generic (length check, brand terms present)\nG14 - above-the-fold check: first 200 chars of generated_content contain contact affordance\nG15 - content uniqueness: generated_content hash not duplicated in pages table for same client\n\nAfter running all 15 gates: upsert to page_validation_results. Update pages.validation_status = 'validated' if all pass or 'needs_review' if any fail.\n\nReturn gate_results, overall_status, error_codes.\n\nSTEP 2 - Write trigger route src\\app\\api\\agents\\a-05\\trigger\\route.ts (check if exists first, update if so).\n\nSTEP 3 - Write tests\\unit\\agents\\a-05.test.ts: 5 vitest tests: all gates pass returns pass status, G5 contact affordance failure, G8 evidence gate failure, G9 placeholder detection, G15 duplicate detection.\n\npnpm tsc --noEmit 0 errors. pnpm vitest run tests/unit/agents/a-05.test.ts.\n\ngit add -A; git commit --no-verify -m 'feat: A-05 Page Validator 15 gates complete implementation'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-05-page-validator.ts
    - tests/unit/agents/a-05.test.ts

- id: a06-001
  name: A-06 Internal Linker Schema Migration
  prompt: "Read AGENTS.md A-06 Internal Linker entry in full. Read SCHEMA_REGISTRY.md for internal_links table.\n\nSTEP 1 - Check if internal_links table exists. If not write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260728210000_a06_internal_links.sql:\nCREATE TABLE IF NOT EXISTS internal_links (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), from_page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, to_page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, anchor_text TEXT NOT NULL, placement_zone TEXT CHECK (placement_zone IN ('intro','body','sidebar','footer','cta')) DEFAULT 'body', link_type TEXT CHECK (link_type IN ('service','location','hub','blog','homepage')) DEFAULT 'service', created_at TIMESTAMPTZ NOT NULL DEFAULT now(), UNIQUE(from_page_id, to_page_id, anchor_text));\nCREATE INDEX IF NOT EXISTS idx_internal_links_from ON internal_links(from_page_id);\nCREATE INDEX IF NOT EXISTS idx_internal_links_client ON internal_links(client_id);\nALTER TABLE internal_links ENABLE ROW LEVEL SECURITY;\nCREATE POLICY internal_links_operator ON internal_links FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push. Report result.\n\nSTEP 2 - pnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: A-06 internal_links schema migration'; git push origin main. Report commit hash."
  gates:
  - type: compile

- id: a06-002
  name: A-06 Internal Linker Implementation
  prompt: "Read AGENTS.md A-06 Internal Linker entry in full. Read src\\lib\\agents\\a-06-internal-link-builder.ts if it exists.\n\nWrite C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-06-internal-link-builder.ts\nExtends BaseAgent. Input Zod: { client_id: z.string().uuid() }. Output: { pages_processed: z.number(), links_created: z.number(), links_updated: z.number() }.\n\nprocess(): (1) Query all published pages for client_id (status='published'). Verify pages table columns against SCHEMA_REGISTRY.md. (2) For each page, build link candidates: every page should link to homepage, 2-3 service pages, and 1 other city page. (3) Vary anchor text per A-36 spec: for a roofing service link use rotation of 'roofing services', 'expert roofers', 'professional roofing'. (4) Ensure no two pages have identical link sets — generate unique combos per page using hash(page_id). (5) Upsert to internal_links table ON CONFLICT (from_page_id, to_page_id, anchor_text) DO UPDATE SET placement_zone=EXCLUDED.placement_zone. (6) Return counts.\n\nHub-and-spoke enforcement: pages with intent='service-hub' (if that column exists per SCHEMA_REGISTRY.md) get linked from all their child location pages. Tier 3 location pages link to their Tier 2 hub parent.\n\nWrite src\\app\\api\\agents\\a-06\\trigger\\route.ts: POST with getOperatorContext() auth.\n\nWrite tests\\unit\\agents\\a-06.test.ts: 5 tests: link graph generated for client pages, no duplicate link sets, hub-and-spoke links created, empty client returns zero, link count in output matches DB.\n\npnpm tsc --noEmit 0 errors. Tests pass.\n\ngit add -A; git commit --no-verify -m 'feat: A-06 Internal Linker complete'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-06-internal-link-builder.ts
    - src/app/api/agents/a-06/trigger/route.ts
    - tests/unit/agents/a-06.test.ts

- id: a05-a06-wire
  name: A-05 A-06 Pipeline Wiring and Verification
  prompt: "Read existing CRON route files and dashboard files before writing.\n\nSTEP 1 - Wire A-05 into the publishing pipeline. Read src\\app\\api\\cron\\cron-01-drip-publisher\\route.ts in full. Verify it calls A-05 validation before publishing. If not: update drip publisher to call A05PageValidator.execute() for each page before setting status='published'. Pages that fail A-05 get status='needs_review' not 'published'.\n\nSTEP 2 - Wire A-06 into post-publish CRON. Update src\\app\\api\\cron\\daily-agent-cycle\\route.ts to also call A06InternalLinkBuilder.execute() for each active client after A-08 and A-11 run.\n\nSTEP 3 - Add A-05 validation summary to dashboard. In src\\app\\api\\dashboard\\stats\\route.ts (check if exists): add pages_failing_validation count from page_validation_results WHERE overall_status='fail'.\n\nSTEP 4 - pnpm tsc --noEmit 0 errors. pnpm run build succeeds.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md marking A-05 and A-06 complete. Update SESSION_STATE.md next queue: queue-10-phase15-agents.\n\ngit add -A; git commit --no-verify -m 'feat: A-05 A-06 wired into publishing pipeline and CRON'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: build

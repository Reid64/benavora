project: benavora
governance:
- governance/BLUEPRINT.md
- governance/BEHAVIORAL_CONTRACTS.md
- governance/AGENTS.md
- governance/SCHEMA_REGISTRY.md
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
prompts:
- id: ci-001
  name: Add Playwright e2e job to CI
  prompt: "Read .github/workflows/daily-tests.yml and .github/workflows/deploy-check.yml in full — these are the only 2 existing GitHub Actions workflows in this repo. Neither runs any Playwright/e2e spec; daily-tests.yml runs pnpm test:unit (vitest) on a schedule, deploy-check.yml runs pnpm build on push to main. The 24-file Playwright suite under e2e/ (playwright.config.ts defines projects: setup, public, authed, critical-paths, plus chromium/firefox/webkit cross-browser variants for the smoke path) is mature and has passed in prior manual runs, but is not wired into any automated gate — UI regressions between manual sessions currently ship undetected.\n\nRead playwright.config.ts in full to understand how the dev server is started for tests (webServer config) and what env vars / seeded test org the authed project's storage-state setup (tests/e2e/auth.setup.ts — read this file too) actually requires.\n\nTASK: create .github/workflows/e2e-tests.yml, a new workflow that:\n- Triggers on: workflow_dispatch (manual), and on push to main (to catch regressions before they compound, matching deploy-check.yml's trigger).\n- Uses the same pnpm/action-setup + actions/setup-node@v4 (node-version 18, cache pnpm) pattern as daily-tests.yml, plus actions/checkout@v4.\n- Installs Playwright browsers: pnpm exec playwright install --with-deps chromium (start with chromium only for CI speed — do not run the firefox/webkit cross-browser variants in CI, keep those as manual/local-only per playwright.config.ts's existing project split, to control CI runtime and cost).\n- Provides whatever env vars auth.setup.ts and playwright.config.ts's webServer actually require (read them to get the real var names — likely NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY at minimum, matching what deploy-check.yml already provisions as GitHub Actions repo secrets per its own documented reasoning that these are safe to expose since RLS is the real boundary; do not provision SUPABASE_SERVICE_ROLE_KEY or any other secret-tier credential into this new workflow unless you confirm the e2e suite genuinely requires it for seeding a test org — if it does, flag this explicitly in your report rather than silently adding a new production secret to CI).\n- Runs: pnpm exec playwright test --project=setup --project=public --project=critical-paths --reporter=list (do not include the authed project in the first version of this workflow unless auth.setup.ts's requirements can be fully satisfied by the env vars above without a manually-provisioned test-org login — if authed genuinely needs more than that, report what's missing rather than half-wiring it).\n- Uploads the Playwright HTML report and any failure screenshots/traces as a workflow artifact on failure (actions/upload-artifact@v4, if-no-files-found: ignore, retention 7 days) so a failing run is debuggable without re-running locally.\n\nDo not modify daily-tests.yml or deploy-check.yml in this prompt.\n\nMANDATORY CLOSE-OUT (do all four, in order):\n1. Run an incremental test checkpoint now: pnpm tsc --noEmit must show 0 errors relative to files this prompt touched. Fix any errors before continuing.\n2. Run: pnpm run build — fix ALL errors before proceeding. Do not treat this prompt as complete if the build fails (STANDING_DIRECTIVES.md DIRECTIVE-019 — this is the only real gate this repo tier has, nothing downstream blocks a bad commit).\n3. Verify what you built actually works: re-read the files you changed and confirm the described behavior is present, not just that it compiles.\n4. Update STATE_OF_THE_BUILD.md from a live audit of what you just did (the new .github/workflows/e2e-tests.yml job and what it runs) — pull the actual current state from the files/commands you just ran, never from memory. Update SESSION_STATE.md with the current phase and next action."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - .github/workflows/e2e-tests.yml

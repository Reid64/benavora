    phase: build
    description: "/settings - Navy frame, Gold accent - Danger Zone stays distinct"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /settings. Section: Admin/Platform. Frame: #101B2D. Accent: #B88A2E. CRITICAL: "Danger Zone" must stay visually distinct per the protocol's safety-sensitive-element rule - do not repaint it into the general section treatment. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/settings/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: batch4v2-verify-sync-001
    phase: build
    description: "Final regression, governance sync, and full-rollout completion sign-off - the last batch"
    prompt: |
      1. Real Playwright pass across all 10 pages in this batch, confirm navy/gold treatment, confirm Impersonate/Clear Stuck Jobs/Danger Zone all remain visually distinct from the general section color, not blended in.
      2. Run pnpm run build and pnpm tsc --noEmit, fix any errors.
      3. This is the final batch of the full 52-page v2 rollout across queues 70-73. Read FEATURE_REGISTRY_v2.md and DESIGN_SYSTEM_V2_ASSIGNMENT.md in full and confirm every page from all 4 batches is genuinely documented complete - flag explicitly if anything from an earlier batch was missed or inconsistent, do not let it slide silently.
      4. Update FEATURE_REGISTRY_v2.md and DESIGN_SYSTEM_V2_ASSIGNMENT.md with the final, complete record.
      5. Update STATE_OF_THE_BUILD.md and SESSION_STATE.md with a full, honest summary of the entire v2 rollout: total pages treated, any real issues found and fixed along the way, explicit language on whether this is genuinely complete.
      6. Scoped git add, commit "feat: v2 navy/gold design system applied to all Admin/Platform pages, completing the full 52-page gold/bronze/navy/stone rollout across all 4 batches", push.
    expected_outputs: [FEATURE_REGISTRY_v2.md, STATE_OF_THE_BUILD.md, SESSION_STATE.md]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

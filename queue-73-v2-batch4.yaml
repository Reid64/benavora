project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - PAGE_TREATMENT_PROTOCOL_V2.md
  - DESIGN_SYSTEM_V2_ASSIGNMENT.md
  - FEATURE_REGISTRY_v2.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"
  review_frequency: 5
  governance_check_frequency: 10

prompts:

  - id: cleanup-stray-processes-004
    phase: build
    description: "Kill any stray node processes before this batch"
    prompt: |
      Check for and terminate any node.exe processes not part of this current session before proceeding.
    expected_outputs: []
    gates: [{type: compile}]
    max_retries: 2
    on_fail: continue

  - id: page-command-center-002
    phase: build
    description: "/command-center - Navy frame, Gold accent"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /command-center. Section: Admin/Platform. Frame: #101B2D. Accent: #B88A2E. Preserve the real live-updating stat panels and their distinct per-panel colored borders. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/command-center/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-admin-orgs-002
    phase: build
    description: "/admin/orgs - Navy frame, Gold accent - Impersonate stays distinct"
    prompt: |
      Read PAGE_TREATMENT_PROTOCOL_V2.md in full, apply to /admin/orgs. Section: Admin/Platform. Frame: #101B2D. Accent: #B88A2E. CRITICAL safety rule from the protocol: "Impersonate" buttons must stay visually distinct from the general section treatment - real risk of accidental clicks on a sensitive admin action if blended in. Full verification standard required.
    expected_outputs: [src/app/(dashboard)/admin/orgs/page.tsx]
    gates: [{type: compile}, {type: build}]
    max_retries: 3
    on_fail: halt

  - id: page-admin-system-002

- id: a08-001
  name: A-08 Indexation Tracker Schema and Migration
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-08 Indexation Tracker in full. Read SCHEMA_REGISTRY.md for existing indexation tables. A-08 is Priority P3 per STATE_OF_THE_BUILD.md locked priorities - the platform primary reality-check feedback loop.\n\nSTEP 1 - Check existing migrations: Get-ChildItem C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\ | Where-Object { $_.Name -match 'a.08|indexat' }. If migration exists skip creation.\n\nIf no migration exists write C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260727000000_a08_indexation_tracker.sql with:\nCREATE TABLE IF NOT EXISTS page_indexation (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, page_id UUID NOT NULL REFERENCES pages(id) ON DELETE CASCADE, url TEXT NOT NULL, gsc_index_status TEXT CHECK (gsc_index_status IN ('indexed','not_indexed','excluded','error','unknown')) DEFAULT 'unknown', canonical_url TEXT, last_crawl_date TIMESTAMPTZ, coverage_state TEXT, robots_txt_state TEXT, indexing_state TEXT, last_checked_at TIMESTAMPTZ NOT NULL DEFAULT now(), check_source TEXT CHECK (check_source IN ('api','manual','inferred')) DEFAULT 'inferred', created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(), UNIQUE(client_id, page_id));\nCREATE INDEX IF NOT EXISTS idx_page_indexation_client_id ON page_indexation(client_id);\nCREATE INDEX IF NOT EXISTS idx_page_indexation_status ON page_indexation(client_id, gsc_index_status);\nALTER TABLE page_indexation ENABLE ROW LEVEL SECURITY;\nCREATE POLICY page_indexation_operator_all ON page_indexation FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\n\nSTEP 2 - Apply migration: cd C:\\Users\\manag\\Documents\\Tarritrix && supabase db push. If push fails report exact error - do not proceed.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors.\n\nSTEP 3 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md from actual audit.\n\nACCEPTANCE: Migration file exists or was skipped because table already exists. pnpm tsc 0 errors."
  gates:
  - type: compile

- id: a08-002
  name: A-08 Indexation Tracker Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-08 in full. Read C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\base-agent.ts to understand the BaseAgent interface.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-08-indexation-tracker.ts\nClass A08IndexationTracker extends BaseAgent. Input schema (Zod): { client_id: z.string().uuid(), page_ids: z.array(z.string().uuid()).optional() }. Output schema: { checked_count: z.number(), indexed_count: z.number(), not_indexed_count: z.number(), error_count: z.number(), results: z.array(z.object({ page_id: z.string(), url: z.string(), status: z.string() })) }.\n\nprocess() method: (1) Query pages table for client_id - if page_ids provided filter to those, else fetch all published pages for client. Verify pages table columns against SCHEMA_REGISTRY.md before querying. (2) Check client_gsc_credentials table for this client - verify table name against SCHEMA_REGISTRY.md. If GSC credentials exist set check_source=api, else set check_source=inferred. (3) For each page: if check_source=api call GSC URL Inspection API with 1 second delay between calls for quota compliance. If check_source=inferred derive index status from most recent A-05 validation result in page_validation_results table. (4) Upsert results to page_indexation table using ON CONFLICT (client_id, page_id) DO UPDATE. (5) Return summary counts.\n\nFull TypeScript implementation - no stubs. No any types. Handle all errors with proper AgentError types.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\agents\\a-08\\trigger\\route.ts\nPOST handler: getOperatorContext() auth, validate body with Zod { client_id: string, page_ids?: string[] }, instantiate A08IndexationTracker, call execute(), return result. Error handling with structured response.\n\nSTEP 3 - Write C:\\Users\\manag\\Documents\\Tarritrix\\tests\\unit\\agents\\a-08.test.ts\n5 vitest tests: (1) successful indexation check returns correct counts, (2) handles missing GSC credentials gracefully with inferred check_source, (3) client_id isolation - cannot access other client pages, (4) page_ids filter works correctly, (5) GSC API error handled without crashing agent.\n\nMIDPOINT CHECK: pnpm tsc --noEmit - 0 errors. pnpm vitest run tests/unit/agents/a-08.test.ts.\n\nSTEP 4 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit: git add -A && git commit --no-verify -m 'feat: A-08 Indexation Tracker complete' && git push origin main. Report commit hash.\n\nACCEPTANCE: All 3 files exist. pnpm tsc 0 errors. 5 tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-08-indexation-tracker.ts
    - src/app/api/agents/a-08/trigger/route.ts
    - tests/unit/agents/a-08.test.ts

- id: a09-001
  name: A-09 Conversion Handler Schema and Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-09 Conversion Handler in full. A-09 is TCPA contract enforcement and lead capture - NOT content validation. Read BEHAVIORAL_CONTRACTS.md Contract 14 (TCPA) in full.\n\nSTEP 1 - Read SCHEMA_REGISTRY.md conversions table entry fully. Identify which columns exist. Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260727010000_a09_conversion_handler.sql adding only missing columns:\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS tcpa_consent_verified BOOLEAN NOT NULL DEFAULT false;\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS tcpa_consent_timestamp TIMESTAMPTZ;\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS tcpa_consent_source TEXT;\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS tcpa_consent_ip TEXT;\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS lead_score INTEGER CHECK (lead_score BETWEEN 0 AND 100);\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS lead_qualified BOOLEAN DEFAULT false;\nALTER TABLE conversions ADD COLUMN IF NOT EXISTS disqualification_reason TEXT;\nCREATE TABLE IF NOT EXISTS lead_capture_events (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, page_id UUID REFERENCES pages(id), session_id TEXT, event_type TEXT CHECK (event_type IN ('form_submit','call_click','chat_start','quote_request')) NOT NULL, form_data JSONB, tcpa_consent_verified BOOLEAN NOT NULL, tcpa_consent_text TEXT, ip_address TEXT, user_agent TEXT, referrer TEXT, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nALTER TABLE lead_capture_events ENABLE ROW LEVEL SECURITY;\nCREATE POLICY lead_capture_events_operator ON lead_capture_events FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-09-conversion-handler.ts\nExtends BaseAgent. Input: { client_id, page_id, event_type, form_data, tcpa_consent_verified, tcpa_consent_timestamp, tcpa_consent_source, ip_address, user_agent, referrer }. process(): (1) GATE: if tcpa_consent_verified=false throw AgentError TCPA_CONSENT_REQUIRED immediately - no data stored. (2) Validate form_data completeness. (3) Score lead 0-100: +25 if all required fields present, +25 if service_type matches client service areas, +25 if ip geolocation matches client service area, +25 if submitted during business hours. (4) Insert to conversions and lead_capture_events. (5) Return { conversion_id, lead_score, lead_qualified, tcpa_verified: true }.\n\nSTEP 3 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\agents\\a-09\\capture\\route.ts\nPOST - NO operator auth (called from public client pages). Rate limiting: track submissions by IP in memory or redis, max 10 per IP per hour, return 429 if exceeded. TCPA gate enforced before any storage.\n\nSTEP 4 - Write tests\\unit\\agents\\a-09.test.ts: 5 tests: TCPA rejection blocks storage, valid capture stores both tables, lead scoring logic correct, rate limit returns 429, geographic matching.\n\nMIDPOINT CHECK: pnpm tsc --noEmit 0 errors. Tests pass.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit and push. Report commit hash.\n\nACCEPTANCE: All files exist. pnpm tsc 0 errors. Tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-09-conversion-handler.ts
    - src/app/api/agents/a-09/capture/route.ts
    - tests/unit/agents/a-09.test.ts

- id: a11-001
  name: A-11 Content Refresh Engine Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-11 Content Refresh Engine in full. A-11 identifies page decay signals and creates refresh jobs - NOT a ranking predictor.\n\nSTEP 1 - Verify page_generation_queue table exists and columns against SCHEMA_REGISTRY.md. Verify page_performance_daily table exists. Verify page_indexation table exists (built in a08-001).\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-11-content-refresh-engine.ts\nExtends BaseAgent. Input: { client_id: string, page_id?: string }. process(): for each page (all client pages or specific page_id): (1) Decay signal 1 - days since published > 180: SELECT pages.last_published_at, compute age in days. (2) Decay signal 2 - indexation degrading: SELECT gsc_index_status FROM page_indexation WHERE page_id=X AND gsc_index_status IN ('not_indexed','excluded','error'). (3) Decay signal 3 - conversion decline: SELECT COUNT(*) from conversions WHERE page_id=X AND created_at > now()-interval'30 days' vs prior 30 days, flag if current < 50% of prior. (4) Decay signal 4 - impression decline: SELECT SUM(impressions) FROM page_performance_daily WHERE page_id=X grouped by 30d windows, flag if latest 30d < 80% of prior 30d. (5) If any decay signal fired: INSERT into page_generation_queue (client_id, page_id, priority='refresh', source_page_id=page.id, reason=JSON array of decay reasons, status='queued'). Use ON CONFLICT to avoid duplicate queue entries. Return { pages_analyzed, refresh_jobs_created, decay_signals_by_type }.\n\nSTEP 3 - Write src\\app\\api\\agents\\a-11\\trigger\\route.ts: POST with getOperatorContext() auth.\n\nSTEP 4 - Write tests\\unit\\agents\\a-11.test.ts: 5 tests: age decay detected, indexation decay detected, conversion decline detected, no decay means no queue entry, page_id filter works.\n\nMIDPOINT CHECK: pnpm tsc --noEmit 0 errors. Tests pass.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit and push. Report commit hash.\n\nACCEPTANCE: Files exist. pnpm tsc 0 errors. Tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-11-content-refresh-engine.ts
    - src/app/api/agents/a-11/trigger/route.ts

- id: a14-001
  name: A-14 Review Velocity Engine Schema and Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-14 Review Velocity Engine in full. A-14 manages legitimate review requests from real customers - NOT a content refresh agent. Hard prohibition: never require positive rating, never suppress negative reviewers.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260727020000_a14_review_velocity.sql:\nCREATE TABLE IF NOT EXISTS review_requests (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, customer_name TEXT NOT NULL, customer_email TEXT, customer_phone TEXT, job_id TEXT, service_type TEXT, review_platform TEXT CHECK (review_platform IN ('google','facebook','yelp','bbb')) NOT NULL DEFAULT 'google', request_sent_at TIMESTAMPTZ, request_method TEXT CHECK (request_method IN ('sms','email','in_app')), reminder_count INTEGER NOT NULL DEFAULT 0, last_reminder_at TIMESTAMPTZ, review_received BOOLEAN NOT NULL DEFAULT false, review_received_at TIMESTAMPTZ, opted_out BOOLEAN NOT NULL DEFAULT false, opted_out_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_review_requests_client_id ON review_requests(client_id);\nALTER TABLE review_requests ENABLE ROW LEVEL SECURITY;\nCREATE POLICY review_requests_operator ON review_requests FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-14-review-velocity-engine.ts\nExtends BaseAgent. Input: { client_id, action: 'send_request'|'send_reminder'|'mark_received', customer_data?: { name, email, phone, job_id, service_type }, request_id?: string }. process(): send_request - validate customer has real contact info (email or phone required), check customer has not opted_out, insert review_request, send via Resend email if email provided. send_reminder - find request by request_id, verify review_received=false AND opted_out=false AND reminder_count < 2 AND (last_reminder_at IS NULL OR last_reminder_at < now()-interval'48 hours'), send reminder via Resend, increment reminder_count. mark_received - update review_received=true review_received_at=now(). Return { action_taken, request_id, reminder_eligible_after }.\n\nSTEP 3 - Write src\\app\\api\\agents\\a-14\\trigger\\route.ts with getOperatorContext() auth.\n\nSTEP 4 - Write tests\\unit\\agents\\a-14.test.ts: 5 tests: request created correctly, reminder blocked if too soon, reminder blocked if count>=2, mark_received updates correctly, opted_out customer blocked.\n\nMIDPOINT CHECK: pnpm tsc --noEmit 0 errors. Tests pass.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit and push. Report commit hash.\n\nACCEPTANCE: All files exist. pnpm tsc 0 errors. Tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-14-review-velocity-engine.ts
    - src/app/api/agents/a-14/trigger/route.ts
    - tests/unit/agents/a-14.test.ts

- id: a18-001
  name: A-18 Job Evidence Ingestion Engine Schema and Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-18 Job Evidence Ingestion Engine in full. A-18 ingests EXIF-verified job photos and project evidence - NOT entity linking. Read BEHAVIORAL_CONTRACTS.md Contract 86 (Evidence-Before-Publication Gate).\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260727030000_a18_job_evidence.sql:\nCREATE TABLE IF NOT EXISTS job_evidence (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, job_id TEXT, evidence_type TEXT CHECK (evidence_type IN ('photo','document','measurement','certificate','permit','video')) NOT NULL, file_url TEXT NOT NULL, storage_path TEXT, exif_data JSONB, exif_gps_lat NUMERIC(10,7), exif_gps_lng NUMERIC(10,7), exif_taken_at TIMESTAMPTZ, exif_verified BOOLEAN NOT NULL DEFAULT false, evidence_status TEXT CHECK (evidence_status IN ('verified','client_attested','system_inferred','expired','prohibited')) NOT NULL DEFAULT 'client_attested', service_type TEXT, city TEXT, state TEXT, description TEXT, reviewed_by UUID REFERENCES auth.users(id), reviewed_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS idx_job_evidence_client_id ON job_evidence(client_id);\nCREATE INDEX IF NOT EXISTS idx_job_evidence_status ON job_evidence(client_id, evidence_status);\nALTER TABLE job_evidence ENABLE ROW LEVEL SECURITY;\nCREATE POLICY job_evidence_operator ON job_evidence FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-18-job-evidence-ingestion.ts\nExtends BaseAgent. Input: { client_id, job_id?, file_urls: string[], service_type?, city?, state?, description? }. process(): for each file_url: (1) Fetch file metadata from Supabase Storage using storage admin client. (2) Parse EXIF from metadata if available - extract GPSLatitude GPSLongitude DateTimeOriginal. (3) If GPS present: query client service_areas table (verify table name against SCHEMA_REGISTRY.md) to check if coordinates fall within client service area. If match: exif_verified=true evidence_status='verified'. If GPS missing or mismatch: evidence_status='client_attested' flag for operator review. (4) Insert to job_evidence table. Return { ingested_count, verified_count, flagged_for_review_count, evidence_ids }.\n\nSTEP 3 - Write src\\app\\api\\agents\\a-18\\trigger\\route.ts with getOperatorContext() auth, validate file_urls array, call agent.\n\nSTEP 4 - Write tests\\unit\\agents\\a-18.test.ts: 5 tests: GPS match sets verified, GPS missing sets client_attested, GPS mismatch sets client_attested, multiple files processed, invalid file_url handled.\n\nMIDPOINT CHECK: pnpm tsc --noEmit 0 errors. Tests pass.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit and push. Report commit hash.\n\nACCEPTANCE: All files exist. pnpm tsc 0 errors. Tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-18-job-evidence-ingestion.ts
    - src/app/api/agents/a-18/trigger/route.ts
    - tests/unit/agents/a-18.test.ts

- id: a19-001
  name: A-19 Universal Integration Hub Schema and Implementation
  prompt: "Read C:\\Users\\manag\\Documents\\Tarritrix\\AGENTS.md entry for A-19 Universal Integration Hub in full. A-19 connects field service management CRM and scheduling systems - NOT AEO optimization.\n\nSTEP 1 - Write migration C:\\Users\\manag\\Documents\\Tarritrix\\supabase\\migrations\\20260727040000_a19_integration_hub.sql:\nCREATE TABLE IF NOT EXISTS integration_connections (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), client_id UUID NOT NULL REFERENCES clients(id) ON DELETE CASCADE, integration_type TEXT CHECK (integration_type IN ('field_service_management','crm','scheduling','call_tracking','analytics','ecommerce')) NOT NULL, provider TEXT NOT NULL, credentials_vault_ref TEXT NOT NULL, connection_status TEXT CHECK (connection_status IN ('active','error','expired','paused','pending')) NOT NULL DEFAULT 'pending', last_sync_at TIMESTAMPTZ, sync_frequency_minutes INTEGER NOT NULL DEFAULT 60, webhook_url TEXT, created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS integration_sync_log (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), connection_id UUID NOT NULL REFERENCES integration_connections(id) ON DELETE CASCADE, sync_started_at TIMESTAMPTZ NOT NULL DEFAULT now(), sync_completed_at TIMESTAMPTZ, records_fetched INTEGER NOT NULL DEFAULT 0, records_normalized INTEGER NOT NULL DEFAULT 0, records_errored INTEGER NOT NULL DEFAULT 0, errors JSONB, created_at TIMESTAMPTZ NOT NULL DEFAULT now());\nALTER TABLE integration_connections ENABLE ROW LEVEL SECURITY;\nALTER TABLE integration_sync_log ENABLE ROW LEVEL SECURITY;\nCREATE POLICY integration_connections_operator ON integration_connections FOR ALL TO authenticated USING (client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid()));\nCREATE POLICY integration_sync_log_operator ON integration_sync_log FOR ALL TO authenticated USING (connection_id IN (SELECT id FROM integration_connections WHERE client_id IN (SELECT id FROM clients WHERE operator_id = auth.uid())));\nsupabase db push.\n\nSTEP 2 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\lib\\agents\\a-19-universal-integration-hub.ts\nExtends BaseAgent. Input: { client_id, connection_id, action: 'sync'|'test_connection'|'register_webhook' }. Define abstract IntegrationAdapter interface: { testConnection(): Promise<boolean>, fetchRecords(since?: Date): Promise<NormalizedRecord[]>, normalizeRecord(raw: unknown): NormalizedRecord }. Implement GenericWebhookAdapter as baseline concrete class. process(): test_connection - load connection from DB, instantiate appropriate adapter by provider field, call testConnection(), update connection_status. sync - fetch records since last_sync_at, normalize each, upsert to appropriate Tarritrix tables (jobs go to job_evidence, leads go to conversions), insert sync_log row. Return { records_fetched, records_normalized, errors }.\n\nSTEP 3 - Write src\\app\\api\\agents\\a-19\\trigger\\route.ts with getOperatorContext() auth.\nWrite src\\app\\api\\agents\\a-19\\connections\\route.ts: GET list connections for client, POST register new connection.\n\nSTEP 4 - Write tests\\unit\\agents\\a-19.test.ts: 5 tests: test_connection success, test_connection failure updates status to error, sync fetches and normalizes records, sync_log row created, connection not found returns error.\n\nMIDPOINT CHECK: pnpm tsc --noEmit 0 errors. Tests pass.\n\nSTEP 5 - Update STATE_OF_THE_BUILD.md and SESSION_STATE.md. Commit and push. Report commit hash.\n\nACCEPTANCE: All files exist. pnpm tsc 0 errors. Tests pass. Commit hash reported."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-19-universal-integration-hub.ts
    - src/app/api/agents/a-19/trigger/route.ts
    - tests/unit/agents/a-19.test.ts

- id: agents-wire-001
  name: Phase 1 Agents Dashboard Integration and CRON Wiring
  prompt: "Read all 6 new agent files and src\\app\\dashboard\\page.tsx before writing.\n\nSTEP 1 - Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\dashboard\\agent-health\\route.ts\nGET with getOperatorContext() auth. Query agent_events table: SELECT agent_id, COUNT(*) as total_runs, COUNT(CASE WHEN status='completed' THEN 1 END) as successful_runs, AVG(duration_ms) as avg_duration_ms, MAX(created_at) as last_run_at, COUNT(CASE WHEN status='failed' AND created_at > now()-interval'24 hours' THEN 1 END) as errors_24h FROM agent_events GROUP BY agent_id. Verify agent_events columns against SCHEMA_REGISTRY.md. Return array of agent health objects.\n\nSTEP 2 - Wire A-08 and A-11 into daily CRON. Check if src\\app\\api\\cron\\ directory exists. Write C:\\Users\\manag\\Documents\\Tarritrix\\src\\app\\api\\cron\\daily-agent-cycle\\route.ts: GET handler (CRON calls via GET), no user auth but verify CRON_SECRET header matches env var. Query all active clients. For each client call A08IndexationTracker.execute() then A11ContentRefreshEngine.execute(). Log results to agent_events. Return summary.\n\nSTEP 3 - Add agent health card to IntelligenceRow if it exists. If IntelligenceRow.tsx exists read it. Add a 5th card or update System Health card to show per-agent success rates from /api/dashboard/agent-health.\n\nSTEP 4 - Add A-14 and A-18 summary data to SplitView client detail Overview tab. In the Overview tab of SplitView.tsx: fetch review_requests count (sent and received) for selected client. Fetch job_evidence count by status for selected client. Display as two small stat rows.\n\nSTEP 5 - pnpm tsc --noEmit. pnpm run build. Fix all errors.\n\nSTEP 6 - Update STATE_OF_THE_BUILD.md marking all 6 Phase 1 agents complete: A-08 A-09 A-11 A-14 A-18 A-19. Update SESSION_STATE.md with next queue: queue-03-a20-hosting.yaml. Commit:\ngit add -A && git commit --no-verify -m 'feat: Phase 1 agents A-08 A-09 A-11 A-14 A-18 A-19 complete with dashboard integration and CRON wiring' && git push origin main\nReport commit hash.\n\nACCEPTANCE: pnpm tsc 0 errors. pnpm run build succeeds. Commit hash reported."
  gates:
  - type: compile
  - type: build
  - type: file_exists
    files:
    - src/app/api/dashboard/agent-health/route.ts
    - src/app/api/cron/daily-agent-cycle/route.ts

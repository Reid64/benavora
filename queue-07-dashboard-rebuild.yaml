  name: PlatformPulseBar Component
  prompt: "Read DASHBOARD_DESIGN_SPEC.md before writing.\n\nMake directory: New-Item -ItemType Directory -Force -Path 'src\\components\\dashboard'\n\nWrite ONLY this file: C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\PlatformPulseBar.tsx\n\nFull implementation: 'use client'. Import React useState useEffect. Props: none. Fetches GET /api/dashboard/d1-001 every 30 seconds. Shows platform health metrics as horizontal rows: pages_published_today vs daily_allowance with traffic-light dot (green <80%, amber 80-95%, red >95%), llm_cost_today_usd vs cap_usd with traffic-light, active_clients count, pending_operator_actions count. Background #1c2030, accent #06b6d4. Skeleton loader on first fetch. Error boundary. TypeScript strict no any. Default export PlatformPulseBar.\n\nAfter writing verify: Test-Path 'src\\components\\dashboard\\PlatformPulseBar.tsx' — must return True. Get the line count: (Get-Content 'src\\components\\dashboard\\PlatformPulseBar.tsx').Count — must be > 40. pnpm tsc --noEmit — 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: PlatformPulseBar dashboard component d1-006'; git push origin main. Report commit hash and line count."

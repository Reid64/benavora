- id: dash-007
  name: IndexHealthGauge SVG Arc Component
  prompt: "Read DASHBOARD_DESIGN_SPEC.md before writing. CRITICAL: pure SVG arc only — no recharts no chart.js no external charting library.\n\nWrite ONLY this file: C:\\Users\\manag\\Documents\\Tarritrix\\src\\components\\dashboard\\IndexHealthGauge.tsx\n\nFull implementation. Props: score (number 0-100), label (string), size (number default 200). Pure SVG. Math: cx=size/2, cy=size/2, r=size*0.4, strokeWidth=size*0.06. Arc spans 220deg from 160deg. startAngleRad=160*Math.PI/180. endAngleRad=(160+score/100*220)*Math.PI/180. x1=cx+r*Math.cos(startAngleRad), y1=cy+r*Math.sin(startAngleRad). x2=cx+r*Math.cos(endAngleRad), y2=cy+r*Math.sin(endAngleRad). largeArcFlag=score/100*220>180?1:0. Background arc: same startAngle endAngle of full 220deg stroke #2a3347. Score arc: stroke color interpolated #ef4444 at 0 to #06b6d4 at 100. Center text: score number fontSize=size*0.16, label below fontSize=size*0.07 fill #94a3b8. Animate 0 to score on mount via requestAnimationFrame 1000ms easeOutCubic. TypeScript strict. Default export IndexHealthGauge.\n\nVerify: Test-Path 'src\\components\\dashboard\\IndexHealthGauge.tsx' — True. Select-String -Path 'src\\components\\dashboard\\IndexHealthGauge.tsx' -Pattern 'recharts|chart.js' — must return NOTHING (no charting library). pnpm tsc --noEmit 0 errors.\n\ngit add -A; git commit --no-verify -m 'feat: IndexHealthGauge custom SVG arc component d1-013'; git push origin main. Report commit hash."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/components/dashboard/IndexHealthGauge.tsx

